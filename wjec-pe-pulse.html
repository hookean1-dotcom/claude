  ],
  learn: [
    { h: 'Fair play, sportsmanship and gamesmanship', html: `
<ul><li><b>Fair play</b> — the ethos of playing within the letter and the <b>spirit</b> of the rules: respect for opponents, officials and the game.</li>
<li><b>Sportsmanship</b> — behaviour that shows fair play: kicking the ball out when an opponent is injured, a batter “walking” when out, shaking hands, applauding opponents.</li>
<li><b>Gamesmanship</b> — bending the rules or using dubious tactics to gain an advantage without technically breaking the rules: time-wasting, sledging, feigning injury, taking a long time over a serve, deliberately unsettling an opponent.</li></ul>` },
    { h: 'Deviance', html: `
<p><b>Deviance</b> is behaviour that goes against the <b>norms and values</b> of society — “at a tangent to the norm”.</p>
<ul><li><b>Relative deviance</b> — whether behaviour is deviant depends on the <b>context</b>, the sport, the culture and the time (a “professional foul” is accepted in some sports; gamesmanship tolerated at some levels).</li>
<li><b>Absolute deviance</b> — behaviour that is considered wrong in <b>any</b> context and breaks the core ethics of sport: doping, match-fixing, deliberate violence.</li></ul>
<div class="tbl"><table><tr><th>Type</th><th>Meaning</th><th>Examples</th></tr>
<tr><td><b>Under-conformity</b> (negative deviance)</td><td>rejecting or ignoring the rules and norms</td><td>doping, cheating, match-fixing, violence, simulation</td></tr>
<tr><td><b>Over-conformity</b> (positive deviance)</td><td>over-committing to the norms of sport — taking them to extremes</td><td>training through injury, playing in pain, extreme weight loss, over-training</td></tr></table></div>
<p><b>Coakley’s sports ethic</b> (Hughes and Coakley) — four norms that athletes can over-conform to: <b>making sacrifices for the game</b>; <b>striving for distinction</b>; <b>accepting risks and playing through pain</b>; <b>refusing to accept limits</b> in pursuit of possibilities.</p>
<p><b>Reasons for deviance:</b> the desire to win (win-at-all-costs); huge rewards from <b>commercialisation</b> (prize money, contracts, <b>sponsorship</b>); pressure from coaches, sponsors, media and nations; fame; belief that others cheat; low chance of detection; weak punishments.</p>` },
    { h: 'Violence and hooliganism', html: `
<p><b>On-field violence</b> by players: fights, punches, dangerous tackles. Causes: frustration, provocation, rivalry, high stakes, hostile crowds, poor officiating, reinforcement by coaches or media (see 3.13).</p>
<p><b>Off-field violence</b> — <b>hooliganism</b> (spectator violence). Causes: alcohol and drugs; tribalism and local rivalries; group identity and deindividuation (anonymity in a crowd); masculinity and “hard” culture; frustration at results or decisions; media hype; social deprivation; poor policing and segregation.</p>
<p><b>Solutions:</b> all-seater stadiums (after the Taylor Report, 1990, which followed Hillsborough), CCTV, banning orders and travel restrictions, alcohol bans, segregation of fans, police intelligence units, family enclosures, membership schemes, early kick-offs, club and community education programmes.</p>` },
    { h: 'Doping', html: `
<div class="tbl"><table><tr><th>Drug / method</th><th>Effect</th><th>Used by</th><th>Side effects</th></tr>
<tr><td>Anabolic steroids</td><td>increase muscle mass and strength; faster recovery</td><td>power athletes, sprinters</td><td>liver damage, heart disease, aggression, hormonal effects</td></tr>
<tr><td>EPO and blood doping</td><td>more red blood cells → more O₂ carried</td><td>endurance athletes</td><td>thicker blood → clots, strokes, heart attack</td></tr>
<tr><td>Stimulants</td><td>alertness, reduced fatigue</td><td>many sports</td><td>addiction, high blood pressure, heart problems</td></tr>
<tr><td>Beta blockers</td><td>reduce heart rate, anxiety and tremor</td><td>archery, shooting, snooker</td><td>fatigue, low blood pressure</td></tr>
<tr><td>Diuretics</td><td>rapid weight loss; mask other drugs</td><td>weight-category sports</td><td>dehydration, cramp</td></tr>
<tr><td>Human growth hormone</td><td>muscle growth; fat loss</td><td>power athletes</td><td>abnormal bone growth, heart problems</td></tr></table></div>
<p><b>Why athletes dope:</b> to win; money and sponsorship; fame; pressure from coaches, teams or nations (e.g. state-sponsored doping); to recover from injury faster; a belief that others dope (“levelling the playing field”); low risk of being caught.</p>
<p><b>Ethics and implications:</b> doping is cheating and breaks fair play; it endangers health; it coerces clean athletes to dope; it destroys trust in results and role models; it harms the sport’s reputation, sponsorship and audience (e.g. cycling after Lance Armstrong; Russia’s state-sponsored programme). A minority argue legalising drugs would level the field and respect athletes’ autonomy — but health and fairness arguments prevail.</p>` },
    { h: 'Fighting doping: WADA', html: `
<p>The <b>World Anti-Doping Agency (WADA)</b>, set up in 1999, co-ordinates the fight against doping. UK Anti-Doping (UKAD) runs testing in the UK.</p>
<ul><li><b>World Anti-Doping Code</b> — the same rules and sanctions across sports and countries; <b>strict liability</b> (athletes are responsible for any substance in their body).</li>
<li>The <b>Prohibited List</b> — updated every year.</li>
<li><b>Testing</b> — in-competition and <b>out-of-competition</b> (random, no notice) urine and blood samples. Samples are split into <b>A and B</b> samples; if A is positive, the athlete can request B to be tested. Samples can be stored and <b>retested for up to 10 years</b> as methods improve.</li>
<li><b>Whereabouts system</b> — elite athletes must say where they will be for a one-hour slot every day; three missed tests or filing failures in 12 months is a violation.</li>
<li><b>Biological passport</b> — an electronic record of an athlete’s blood and steroid markers over time. Doping is detected <b>indirectly</b> from abnormal changes, even when the drug itself is not found.</li>
<li>Bans (usually four years for a first serious offence), education programmes, intelligence and investigations, sanctions on nations; some countries have made doping a criminal offence.</li></ul>` }
  ],
  eqs: [],
  worked: [
    { q: 'Explain how the biological passport helps to detect doping. (3 marks)', s: ['It is an individual electronic record of an athlete’s biological markers (e.g. haemoglobin, reticulocytes, steroid profile) built up from repeated tests over time.', 'Doping changes these markers — e.g. EPO raises haemoglobin — so abnormal variations from the athlete’s own baseline are flagged.', 'This detects doping indirectly, even when the substance itself is no longer detectable or is new.'], a: 'Monitors markers over time; detects abnormal changes indirectly.' }

  cards: [
    ['Sportsmanship?', 'Behaviour showing fair play — within the letter and spirit of the rules.'], ['Gamesmanship?', 'Bending the rules or using dubious tactics to gain an advantage without breaking the rules.'], ['Deviance?', 'Behaviour that goes against the norms and values of society.'],
    ['Relative deviance?', 'Deviance that depends on context, sport, culture or time.'], ['Absolute deviance?', 'Behaviour considered wrong in any context (doping, match-fixing).'], ['Under-conformity?', 'Rejecting/ignoring the rules — e.g. doping, violence.'],

  id: '3.21', unit: '3', area: 'soc', ref: 'Sport and the mass media', title: 'Sport and the mass media', short: 'Functions and forms of the media; the golden triangle; televised sport; dramatisation; stereotypes; social media',
  summary: 'Sport and the media depend on each other. Learn the five functions of the media, its forms, the symbiotic relationship and the golden triangle, how the rise of televised sport has changed sport, the creation of celebrities, dramatisation and sexploitation, how the media perpetuates stereotypes, and the rise of social media.',
  spec: [
    'Functions of the media in society: inform, interpret, educate, entertain and advertise',
    'Forms of media within sport',
    'The symbiotic relationship between sport and the mass media; the importance of the golden triangle; interdependence with up-to-date examples',
    'Impact of the media: the rise of televised sport, changes to sport to suit the media, the creation of sporting celebrities',
    'Dramatisation of sport: sensationalising contests, sexploitation of female athletes, creation of national pride',
    'Sport as an avenue for perpetuating stereotypes',
    'The rise of social media within sport'
  ],
  learn: [
    { h: 'Functions and forms', html: `
<div class="tbl"><table><tr><th>Function</th><th>Example</th></tr>
<tr><td><b>Inform</b></td><td>results, fixtures, team news, live scores</td></tr>
<tr><td><b>Interpret</b></td><td>expert analysis, punditry, replays, statistics</td></tr>
<tr><td><b>Educate</b></td><td>coaching programmes, documentaries, health campaigns, explanations of rules</td></tr>
<tr><td><b>Entertain</b></td><td>live coverage, highlights, reality/behind-the-scenes shows</td></tr>
<tr><td><b>Advertise</b></td><td>adverts during coverage, sponsors’ logos, product placement</td></tr></table></div>
<p><b>Forms:</b> television (free-to-air, satellite/subscription, pay-per-view), radio, newspapers and magazines, the internet (websites, streaming services, podcasts), social media (X/Twitter, Instagram, TikTok, YouTube), video games and apps.</p>` },
    { h: 'The symbiotic relationship and the golden triangle', html: `
[[d:golden]]
<p>Sport and the media have a <b>symbiotic</b> (mutually beneficial) relationship: the media needs sport for content and audiences; sport needs the media for money, exposure and sponsors.</p>
<p>The <b>golden triangle</b> links <b>sport</b>, the <b>media</b> and <b>sponsorship/business</b>:</p>
<ul><li>the media pays sport for broadcasting rights and brings audiences;</li><li>audiences attract sponsors and advertisers, who pay the media (advertising) and sport (sponsorship);</li><li>sport provides the spectacle that attracts audiences, so its value grows.</li></ul>
<p>Examples: the Premier League’s domestic and overseas TV deals worth billions; the Six Nations and Principality Stadium naming rights; streaming services bidding for sports rights.</p>` },
    { h: 'Impact of the media on sport', html: `
<div class="grid g2"><div class="box good"><b class="lbl">Positive</b><ul><li>large income from rights → better facilities, salaries, grassroots funding</li><li>greater exposure and participation; role models</li><li>education and interest in minority sports (e.g. during the Olympics)</li><li>technology (Hawk-Eye, TMO, VAR) improving officiating</li></ul></div>
<div class="box warn"><b class="lbl">Negative / changes to suit the media</b><ul><li>rule changes (tie-breaks, T20 cricket, bonus points, shot clocks)</li><li>scheduling and kick-off times set by broadcasters, not fans</li><li>breaks for adverts; coloured kits; entertainment “razzmatazz”</li><li>rich clubs and popular sports get richer; minority sports ignored</li><li>fans must pay subscriptions; invasion of privacy; negative stories</li></ul></div></div>
<p><b>The rise of televised sport</b>: from free-to-air coverage to satellite subscription (BSkyB and the Premier League from 1992) and now streaming. Some events are “listed” (the Crown Jewels, e.g. the Olympics, FIFA World Cup finals) so they stay on free-to-air TV.</p>
<p><b>Sporting celebrities</b>: the media turns athletes into stars and brands (e.g. Gareth Bale, Serena Williams), increasing sponsorship income but also scrutiny.</p>` },
    { h: 'Dramatisation and stereotypes', html: `
<ul><li><b>Sensationalising contests</b> — hyping rivalries, grudge matches, “must-win” games; exaggerated headlines to attract audiences.</li>
<li><b>Sexploitation of female athletes</b> — focusing on appearance, clothing and private lives rather than performance.</li>
<li><b>Creation of national pride</b> — jingoistic coverage of national teams, emphasising “us vs them”.</li></ul>
<p><b>Perpetuating stereotypes:</b> women’s sport receives a small share of coverage (historically under 10%), often on “feminine” sports; disabled athletes are covered mainly during the Paralympics; commentary can reinforce racial stereotypes (black athletes described by physical attributes, white athletes by intelligence). This limits role models and participation — though coverage of women’s football, rugby and cricket has grown rapidly.</p>` },
    { h: 'Social media', html: `
<div class="grid g2"><div class="box good"><b class="lbl">Benefits</b><ul><li>direct communication between athletes, clubs and fans</li><li>athletes build personal brands and income</li><li>instant news and highlights; wider reach for minority and women’s sport</li><li>clubs and NGBs promote events and campaigns</li></ul></div>
<div class="box warn"><b class="lbl">Problems</b><ul><li>online abuse, racism and trolling of athletes and officials</li><li>misinformation and leaks; pressure on mental health</li><li>ill-judged posts damaging reputations and careers</li><li>loss of privacy; distraction</li></ul></div></div>` }
  ],
  eqs: [],
  worked: [
    { q: 'Explain the concept of the golden triangle. (3 marks)', s: ['It is the relationship between sport, the media and sponsorship/business.', 'The media pays for broadcasting rights to show sport, which attracts large audiences.', 'Audiences attract sponsors and advertisers, who pay both the media and sport — so all three benefit and depend on each other.'], a: 'Interdependence of sport, media and sponsors.' }
  ],
  pitfalls: ['Listing functions of the media without sporting examples.', 'Describing the golden triangle as just “money” — explain the relationships between all three corners.', 'Writing only negative effects — evaluate both.', 'Forgetting that the specification names social media explicitly.'],
  cards: [
    ['Five functions of the media?', 'Inform, interpret, educate, entertain, advertise.'], ['Symbiotic relationship?', 'Sport and media benefit from and depend on each other.'], ['Golden triangle?', 'Sport, media and sponsorship/business — mutually dependent.'],
    ['Three changes to sport to suit the media?', 'Rule changes, scheduling/kick-off times, advert breaks (also coloured kits, new formats).'], ['Sexploitation?', 'Media focus on female athletes’ appearance rather than performance.'], ['Crown Jewels?', 'Listed events that must be shown on free-to-air TV.'],
    ['Positive effect of media on sport?', 'Money, exposure, role models, participation, technology.'], ['Negative effect of social media?', 'Online abuse, misinformation, pressure, reputational damage.']
  ],
  quiz: [
    { q: 'Expert analysis of a match by pundits is the media function of…', o: ['interpreting', 'advertising', 'informing only', 'educating only'], x: 'Explaining what happened.' },
    { q: 'The golden triangle links sport, the media and…', o: ['sponsorship/business', 'the government', 'the fans only', 'officials'], x: 'Commercial relationship.' },
    { q: 'T20 cricket is an example of…', o: ['a format change to suit the media and audiences', 'gamesmanship', 'social stratification', 'deviance'], x: 'Shorter, more entertaining.' },
    { q: 'Focusing on a female athlete’s appearance rather than performance is…', o: ['sexploitation', 'sportsmanship', 'globalisation', 'Americanisation'], x: 'Dramatisation.' },
    { q: 'A mutually beneficial relationship is…', o: ['symbiotic', 'deviant', 'stratified', 'autocratic'], x: 'Both depend on each other.' },
    { q: 'A drawback of social media for athletes is…', o: ['online abuse', 'direct contact with fans', 'personal branding', 'instant news'], x: 'Trolling and racism.' }
  ],
  exam: [
    { q: 'State the five functions of the media. [5]', m: 5, ms: ['inform', 'interpret', 'educate', 'entertain', 'advertise'] },
    { q: 'Explain how sport has changed to suit the needs of television. [4]', m: 4, ms: ['rule changes, e.g. tie-breaks / bonus points / shot clocks', 'new formats, e.g. T20 cricket / sevens', 'scheduling / kick-off times to suit broadcasters (prime time/overseas audiences)', 'breaks for adverts / coloured kit / technology (TMO, VAR, Hawk-Eye) / razzmatazz'] },
    { q: 'Discuss the impact of the mass media, including social media, on sport. [8]', m: 8, lv: true, ms: ['golden triangle / symbiotic relationship', 'income from rights → facilities, wages, grassroots', 'exposure → participation, role models, celebrities', 'changes to rules, formats, scheduling to suit media', 'dramatisation: sensationalism, sexploitation, national pride', 'stereotypes of women, disabled, ethnic minorities perpetuated (though improving)', 'social media: direct fan contact, branding vs abuse and misinformation', 'judgement: media essential to modern sport but can distort its values'], tag: 'ext' }

TOPICS.push({
  id: '3.22', unit: '3', area: 'soc', ref: 'Sport, commercialisation and globalisation', title: 'Commercialisation and globalisation', short: 'Sport as a commodity; sponsorship; brands; Americanisation; Giddens; Cashmore’s three levels; migration of players',
  summary: 'Sport is now big business played on a global stage. Learn how sport became a commodity shaped by market forces, the forms, advantages and disadvantages of sponsorship, how brands like Nike and Adidas grew, Americanisation, Giddens’ definition of globalisation, Cashmore’s three levels, and the consequences — including the global migration of players and its effect on national teams.',
  spec: [
    'Sport as a commodity; consumerism — market forces and sport industry influences; how sport evolved into big business',
    'The different ways of sponsoring sport; advantages and disadvantages of sponsorship; brand awareness and the sporting goods market',
    'How brands such as Adidas and Nike evolved into major multi-national companies',
    'Americanisation and its impact on sport',
    'Globalisation (Giddens) and sport and global culture; three levels of globalisation (Cashmore)',
    'Globalisation as a mechanism of financial gain; consequences: global migration of players, coaches and expertise; global superstars and teams',
    'Examples: sporting goods and global competitions (African Cup of Nations, IPL, Premier League); links with media — exclusive rights and prime-time television',
    'Issues relating to the global migration of players and effects on national teams'
  ],
  learn: [
    { h: 'Commercialisation', html: `
<p><b>Commercialisation</b> is the process by which sport is treated as a <b>commodity</b> — a product to be bought and sold for profit. Clubs, events and athletes are packaged and sold to spectators, broadcasters and sponsors. <b>Consumerism</b> means fans are treated as customers: tickets, subscriptions, replica kits, hospitality. <b>Market forces</b> (supply and demand) decide which sports and athletes earn most.</p>
<p>Drivers: television and the golden triangle; sponsorship; merchandising; globalisation; professionalisation.</p>` },
    { h: 'Sponsorship', html: `
<p><b>Forms:</b> kit and shirt sponsorship; naming rights (stadiums — the Principality Stadium; competitions); event sponsorship; individual athlete endorsements; equipment and clothing deals; team or league title sponsors; grassroots sponsorship.</p>
<div class="tbl"><table><tr><th></th><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td><b>For the sport/athlete</b></td><td>income for wages, facilities, coaching and development; allows full-time training; raises profile</td><td>dependence on sponsors; sponsors may control scheduling, kit and image; money goes to popular sports and stars; withdrawal after scandal; associations with unhealthy products (alcohol, gambling, fast food)</td></tr>
<tr><td><b>For the sponsor</b></td><td>brand awareness and exposure to large audiences; association with success and a positive image; target markets; tax relief; hospitality</td><td>risk of damage by association (a doping scandal, poor results); cost; ambush marketing by rivals</td></tr></table></div>` },
    { h: 'Brands and the sporting goods market', html: `
<ul><li><b>Adidas</b> — founded by Adi Dassler in Germany (1949); built on football boots and spikes; supplied the 1954 World Cup winners and became a long-term FIFA partner.</li>
<li><b>Nike</b> — founded as Blue Ribbon Sports (1964), renamed Nike in 1971; the “swoosh”; the <b>Air Jordan</b> deal with Michael Jordan (1984) and the <b>“Just Do It”</b> campaign (1988) made it a global lifestyle brand.</li></ul>
<p>Both grew by: <b>endorsements</b> with global superstars; sponsoring teams and events; clever <b>marketing</b> and emotional advertising; turning sportswear into <b>fashion</b>; manufacturing in low-cost countries (criticised for sweatshop conditions); and global distribution — becoming major <b>multi-national companies</b>.</p>` },
    { h: 'Americanisation', html: `
<p><b>Americanisation</b> is the spread of the American model of sport: sport as <b>entertainment</b> and big business — razzmatazz, cheerleaders, music, big screens; franchises and team names; the win-at-all-costs (“Lombardian”) ethic; heavy commercialisation and media control; statistics and technology. Examples: Super League rugby league teams (Leeds Rhinos, Warrington Wolves), T20 cricket’s entertainment, US owners of Premier League clubs, NFL games in London. Critics argue it erodes local traditions and values.</p>` },
    { h: 'Globalisation', html: `
<p><b>Giddens’ definition</b>: globalisation is “the intensification of worldwide social relations which link distant localities in such a way that local happenings are shaped by events occurring many miles away and vice versa.”</p>
[[d:cashmore]]
<p><b>Cashmore’s three levels of globalisation:</b></p>
<ol><li>the creation of <b>global sporting competitions</b> — the Olympics, the FIFA World Cup, the Rugby World Cup;</li><li>the development of <b>satellite communications</b> — TV and now the internet take sport to global audiences live;</li><li>the growth of the <b>sporting goods market</b> — Nike, Adidas and others selling worldwide.</li></ol>
<p><b>Globalisation as a mechanism of financial gain:</b> those with power in sport (leagues, clubs, brands, governing bodies) promote their product worldwide for profit — overseas TV rights, pre-season tours in Asia and the USA, global merchandising, exclusive rights and <b>prime-time</b> scheduling for overseas audiences (e.g. Premier League kick-off times for Asian audiences; Olympic events timed for US TV).</p>
<p>Examples: the <b>Premier League</b> (watched in almost every country); the <b>Indian Premier League</b> (cricket as a global franchise product with international stars); the <b>African Cup of Nations</b> (global audiences and players from European clubs).</p>` },
    { h: 'Consequences of globalisation', html: `
<div class="tbl"><table><tr><th>Consequence</th><th>Detail</th></tr>
<tr><td><b>Global migration</b> of players, coaches and expertise</td><td>players move to the richest leagues; coaches and sports scientists work abroad</td></tr>
<tr><td>Global superstars and teams</td><td>athletes and clubs with worldwide fanbases (e.g. Real Madrid, Manchester United; Cristiano Ronaldo)</td></tr>
<tr><td>Effects on national teams</td><td><b>negative:</b> fewer opportunities for home-grown players in top leagues (in the Premier League most players are foreign); weakened domestic leagues in exporting countries; club vs country conflicts over release of players. <b>Positive:</b> players gain experience in stronger leagues abroad; imported coaches raise standards; players can qualify through residency</td></tr>
<tr><td>Culture</td><td>a more uniform global sports culture; local and traditional sports may decline</td></tr></table></div>` }
  ],
  eqs: [],
  worked: [

/* ==========================================================
   Numerical question generators — PE maths: fitness data, physiology and biomechanics.
   Each returns { q, ans, unit, steps[] } with fresh values; answers are computed so every
   question is self-consistent. Answers within 2% are accepted by the checker. g = 9.8 N/kg.
   ========================================================== */
const GEN = {};
const GEN_FLAGS = {};
const s3 = x => sf(x, 3);
const r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100;
const pk = a => a[Math.floor(Math.random() * a.length)];
const G = 9.8;

/* ---------- Data handling ---------- */
const TESTS = [['multi-stage fitness test level', 6, 13, 0.1, ''], ['vertical jump', 30, 65, 1, 'cm'], ['sit and reach', 5, 35, 1, 'cm'], ['30 m sprint', 3.9, 5.2, 0.01, 's'], ['handgrip strength', 25, 60, 1, 'kg'], ['1 minute press-up test', 15, 55, 1, 'reps'], ['VO₂max', 35, 65, 0.5, 'ml/kg/min']];
GEN.pctchange = () => { const [n, lo, hi, st, u] = pk(TESTS), a = rnd(lo, hi, st), b = +(a * (1 + (n.includes('sprint') ? -rnd(2, 8, 0.5) : rnd(3, 20, 1)) / 100)).toFixed(st < 0.1 ? 2 : st < 1 ? 1 : 0), pc = (b - a) / a * 100;
  return { q: `An athlete’s ${n} changes from ${a}${u ? ' ' + u : ''} to ${b}${u ? ' ' + u : ''} after training. Calculate the percentage change (use a negative value for a decrease).`, ans: pc, unit: '%', steps: ['% change = (new − old) ÷ old × 100', `= (${b} − ${a}) ÷ ${a} × 100`, `= ${r1(pc)}%`] }; };
GEN.mean1 = () => { const [n, lo, hi, st, u] = pk(TESTS), xs = Array.from({ length: pk([3, 4, 5]) }, () => rnd(lo, hi, st)), m = xs.reduce((a, b) => a + b, 0) / xs.length;
  return { q: `An athlete completes ${xs.length} trials of the ${n}: ${xs.join(', ')}${u ? ' ' + u : ''}. Calculate the mean.`, ans: m, unit: u || '', steps: [`sum = ${r2(xs.reduce((a, b) => a + b, 0))}`, `mean = sum ÷ ${xs.length} = ${r2(m)}`] }; };
GEN.partdata = () => { const pop = rnd(800, 4000, 50), p = rnd(0.2, 0.65, 0.01), n = Math.round(pop * p), pc = n / pop * 100;
  const who = pk(['pupils in a school', 'adults in a town survey', 'girls aged 11–16 in a region', 'members of a leisure centre']);
  return { q: `In a survey of ${pop} ${who}, ${n} took part in sport three or more times a week. Calculate the participation rate.`, ans: pc, unit: '%', steps: ['rate = participants ÷ total × 100', `= ${n} ÷ ${pop} × 100 = ${r1(pc)}%`] }; };

/* ==========================================================
   Simulation framework (canvas sims via mountSim; DOM explorations via DS)
   ========================================================== */
const SIMS = {};
let simTheme = null;
function refreshSimTheme() { simTheme = themeColors(); }

/* ---- canvas helpers ---- */
const CV = {
  line(c, x1, y1, x2, y2, col, w = 1.5, dash) { c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]); },
  arrow(c, x1, y1, x2, y2, col, w = 2, hs = 9) {
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 1) return; const a = Math.atan2(y2 - y1, x2 - x1);
    CV.line(c, x1, y1, x2 - Math.cos(a) * hs * .6, y2 - Math.sin(a) * hs * .6, col, w);
    c.fillStyle = col; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(a - .42), y2 - hs * Math.sin(a - .42)); c.lineTo(x2 - hs * Math.cos(a + .42), y2 - hs * Math.sin(a + .42)); c.closePath(); c.fill();
  },
  text(c, s, x, y, col, size = 12, align = 'left', weight = 500, font = 'Figtree, system-ui, sans-serif') { c.fillStyle = col; c.font = `${weight} ${size}px ${font}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); },

  share(t, I) { const i = I / 100, pc = Math.exp(-Math.pow(t / 10, 2)) * i * i, gl = (1 - Math.exp(-t / 15)) * Math.exp(-t / 90) * i * i * i * 1.2, ae = (1 - Math.exp(-t / 25)) * (1.1 - 0.6 * i) + 0.05, s = pc + gl + ae; return [pc / s, gl / s, ae / s]; },
  step(st, dt) { st.p.T = st.p.T >= 180 ? 1 : Math.min(180, st.p.T + dt * 12); const inp = document.getElementById('sc-energy-T'); if (inp) { inp.value = Math.round(st.p.T); inp.style.setProperty('--p', (st.p.T / 180 * 100) + '%'); inp.previousElementSibling.querySelector('output').textContent = Math.round(st.p.T); } },
  init(st) { st.run = false; },
  draw(c, W, H, st, C) { const b = { x: 60, y: 30, w: W - 90, h: H - 90 }, cols = [C.a1, C.a4, C.a3];
    const X = t => b.x + t / 180 * b.w, Y = v => b.y + b.h - v * b.h;
    CV.rrect(c, b.x - 8, b.y - 8, b.w + 16, b.h + 26, 8, C.surface, C.line, 1);
    for (let t = 1; t <= 180; t += 1) { const sh = this.share(t, st.p.I); let acc = 0; sh.forEach((v, k) => { c.fillStyle = hexA(cols[k], .75); c.fillRect(X(t - 1), Y(acc + v), X(t) - X(t - 1) + .6, v * b.h); acc += v; }); }
    CV.line(c, X(st.p.T), b.y, X(st.p.T), b.y + b.h, C.ink, 2); [10, 60, 120, 180].forEach(t => CV.text(c, t + ' s', X(t), b.y + b.h + 14, C.muted, 11, 'center'));
    ['ATP-PC', 'anaerobic glycolysis', 'aerobic'].forEach((n, k) => { CV.rrect(c, b.x + k * 150, H - 26, 12, 12, 3, cols[k]); CV.text(c, n, b.x + 18 + k * 150, H - 20, C.ink, 12); });
    CV.text(c, '% of energy', b.x - 6, b.y - 14, C.muted, 11);
  },
  read(st) { const s = this.share(st.p.T, st.p.I), k = s.indexOf(Math.max(...s)); return s.map(v => Math.round(v * 100) + '%').concat([['ATP-PC (e.g. 60 m, shot)', 'anaerobic glycolysis (e.g. 400 m)', 'aerobic (e.g. 1500 m +)'][k]]); }
};

  readouts: ['Heart rate', 'Stroke volume', 'Cardiac output', 'Why'],
  note: 'Q = HR × SV. Stroke volume rises with venous return (Frank–Starling) and plateaus at about 40–60% intensity; beyond that, cardiac output rises mainly through heart rate. The trained heart has a larger SV and a lower HR at any submaximal workload.',
  v(st, I) { const tr = +st.p.tr, hr = (tr ? 50 : 72) + ((tr ? 195 : 200) - (tr ? 50 : 72)) * I / 100, sv = (tr ? 100 : 70) + (tr ? 80 : 45) * Math.min(1, I / (tr ? 70 : 50)); return { hr, sv, q: hr * sv / 1000 }; },
  draw(c, W, H, st, C) { const b = plotBox(W, H), tr = st.p.tr;
    const pl = CV.plot(c, C, b, { xr: [0, 100], yr: [0, 40], xl: 'intensity (%)', yl: 'Q (L/min) · SV/5 (ml) · HR/5 (bpm)', series: [{ f: I => this.v(st, I).q, col: C.a1, w: 3 }, { f: I => this.v(st, I).sv / 5, col: C.a3, w: 2 }, { f: I => this.v(st, I).hr / 5, col: C.a2, w: 2 }], dots: [[st.p.I, this.v(st, st.p.I).q, C.a1, 6]] });
    CV.text(c, 'Q', pl.X(96), pl.Y(this.v(st, 96).q) - 10, C.a1, 12, 'center', 700); CV.text(c, 'SV', pl.X(96), pl.Y(this.v(st, 96).sv / 5) - 10, C.a3, 12, 'center', 700); CV.text(c, 'HR', pl.X(96), pl.Y(this.v(st, 96).hr / 5) + 14, C.a2, 12, 'center', 700);
    CV.circle(c, W - 70, 70, 16 + 6 * Math.abs(Math.sin(performance.now() / (60000 / this.v(st, st.p.I).hr) * Math.PI)), hexA(C.a1, .6)); },
  read(st) { const v = this.v(st, st.p.I); return [Math.round(v.hr) + ' bpm', Math.round(v.sv) + ' ml', v.q.toFixed(1) + ' L/min', st.p.I < 45 ? 'SV and HR both rising' : 'SV near plateau; HR drives Q']; }
};

SIMS.memory = DS('Memory span and chunking', 'A sequence of set-play calls flashes up. Recall it. Then try the same length grouped into chunks — the STM holds about 7 ± 2 items, but chunks count as single items.', body => {
  const CALLS = ['cross', 'loop', 'switch', 'post', 'drive', 'skip', 'screen', 'dummy', 'wrap', 'blitz'];
  let round = 0, seq = [], res = [];
  const start = () => { const n = 5 + round * 2, chunk = round >= 2; seq = shuffle(CALLS.concat(CALLS)).slice(0, n); const shown = chunk ? seq.map((w, i) => w + ((i + 1) % 3 === 0 && i < n - 1 ? ' | ' : ' · ')).join('') : seq.join(' · ');
    body.innerHTML = `<div class="card" style="text-align:center;font:700 22px var(--f-mono);padding:22px">${shown}</div><p class="small muted">Memorise… (${chunk ? 'grouped in threes' : 'no grouping'})</p>`;
    setTimeout(() => { if (!document.body.contains(body)) return; body.innerHTML = `<p>Type the calls in order, separated by spaces.</p><input id="mm-in" class="ds-sel" autocomplete="off"><div class="row" style="margin-top:8px"><button class="btn primary" id="mm-go">Check</button></div>`; $('#mm-in', body).focus(); $('#mm-go', body).onclick = check; }, 2600 + n * 500); };
  const check = () => { const ans = $('#mm-in', body).value.trim().toLowerCase().split(/[\s,·|]+/).filter(Boolean); let k = 0; while (k < seq.length && ans[k] === seq[k]) k++; res.push([seq.length, k, round >= 2]); round++;
    body.innerHTML = `<div class="tbl"><table><tr><th>Sequence length</th><th>Correct in order</th><th>Grouped?</th></tr>${res.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2] ? 'yes' : 'no'}</td></tr>`).join('')}</table></div>${round < 4 ? `<button class="btn primary" id="mm-next">Next sequence</button>` : `<p class="small">Most people recall about 7 ± 2 items; grouping (chunking) and meaningful calls help. Coaches chunk set plays into one call word.</p><button class="btn" id="mm-next">Start again</button>`}`;
    $('#mm-next', body).onclick = () => { if (round >= 4) { round = 0; res = []; } start(); }; };

});

/* ---- 3.19 Reaction time test (Hick's law) ---- */
SIMS.reaction = DS('Reaction time test: Hick’s law', 'Measure your own simple and choice reaction times. When a coloured target lights up, press the matching key (or tap it) as fast as you can. Five trials per condition; the graph plots your mean against the number of choices.', body => {
  const KEYS = ['f', 'j', 'd', 'k'], COLS = ['var(--a1)', 'var(--a3)', 'var(--a2)', 'var(--a4)'];
  let n = 1, trial = 0, t0 = 0, target = -1, times = {}, tm = null, waiting = false;
  const pads = () => `<div class="row" style="justify-content:center;gap:12px;margin:18px 0">${Array.from({ length: n }, (_, i) => `<button class="btn" data-p="${i}" style="width:84px;height:84px;border-radius:16px;font:800 20px var(--f-display);${i === target ? `background:${COLS[i]};color:#fff;border-color:${COLS[i]}` : ''}">${KEYS[i].toUpperCase()}</button>`).join('')}</div>`;
  const draw = msg => { body.innerHTML = `<div class="row" style="justify-content:space-between"><span class="pill">${n} choice${n > 1 ? 's' : ''} · trial ${Math.min(trial + 1, 5)}/5</span><span class="small muted">${msg || ''}</span></div>${pads()}${chart()}`;
    $$('[data-p]', body).forEach(b => b.onpointerdown = () => press(+b.dataset.p)); };
  const chart = () => { const ks = [1, 2, 4].filter(k => times[k]?.length); if (!ks.length) return ''; const pts = ks.map(k => [k, times[k].reduce((a, b) => a + b, 0) / times[k].length]);
    return `<div class="tbl"><table><tr><th>Choices</th><th>Mean reaction time</th></tr>${pts.map(p => `<tr><td>${p[0]}</td><td class="mono">${Math.round(p[1])} ms</td></tr>`).join('')}</table></div>`; };
  const arm = () => { target = -1; waiting = true; draw('wait for a target…'); clearTimeout(tm); tm = setTimeout(() => { target = Math.floor(Math.random() * n); t0 = performance.now(); waiting = false; draw('GO!'); }, 900 + Math.random() * 1800); };
  const press = i => { if (waiting) { clearTimeout(tm); draw('Too early! Wait for the colour.'); setTimeout(arm, 900); return; } if (target < 0) return; const rt = performance.now() - t0; if (i !== target) { draw('Wrong target — try again.'); setTimeout(arm, 900); return; }
    (times[n] ??= []).push(rt); trial++; target = -1; sfx.tick();
    if (trial >= 5) { trial = 0; n = n === 1 ? 2 : n === 2 ? 4 : 0; if (!n) { finish(); return; } draw(`Next: ${n} choices`); setTimeout(arm, 1200); } else { draw(Math.round(rt) + ' ms'); setTimeout(arm, 700); } };
  const key = e => { if (!document.body.contains(body)) { removeEventListener('keydown', key); return; } const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0 && n && i < n) press(i); };
  const finish = () => { const m = k => times[k].reduce((a, b) => a + b, 0) / times[k].length; body.innerHTML = `${chart()}<p>Your choice reaction time rose from <b>${Math.round(m(1))} ms</b> (1 choice) to <b>${Math.round(m(4))} ms</b> (4 choices) — Hick’s law. Attackers create more choices (disguise) to slow defenders; defenders anticipate to reduce them.</p><button class="btn primary" id="rt-again">Test again</button>`; $('#rt-again', body).onclick = () => { n = 1; trial = 0; times = {}; arm(); }; };
  addEventListener('keydown', key);
  body.innerHTML = `<p>Use keys <b>F</b>, <b>J</b>, <b>D</b>, <b>K</b> or tap the pads. Don’t anticipate — an early press restarts the trial.</p><button class="btn primary" id="rt-go">Start</button>`; $('#rt-go', body).onclick = arm;
  return () => { clearTimeout(tm); removeEventListener('keydown', key); };
});

  controls: [{ id: 'gap', label: 'Gap between dummy and real move (ms)', min: 0, max: 600, step: 10, value: 120 }, { id: 'proc', label: 'Defender’s processing time for S1 (ms)', min: 150, max: 350, step: 10, value: 220 }],

  note: 'Single-channel hypothesis: the defender cannot start processing the real move (S2) until the dummy (S1) has been processed. A gap shorter than the processing time adds a delay — the PRP.',
  draw(c, W, H, st, C) { const g = st.p.gap, p = st.p.proc, delay = Math.max(0, p - g), sc = (W - 80) / 900, X = t => 40 + t * sc;

    CV.arrow(c, X(g), 40, X(g), 118, C.a1, 2); CV.text(c, 'S2 real move', X(g), 30, C.a1, 12, 'center', 700); },
  read(st) { const g = st.p.gap, p = st.p.proc, delay = Math.max(0, p - g); return [(g + delay + 220) + ' ms', delay + ' ms', delay > 60 ? 'attacker gets past' : 'defender reacts in time', delay ? 'S2 arrived before S1 was processed' : 'gap too long — the dummy was “read”']; }

function gameBest(id, score) { S.games[id] ??= { best: 0, plays: 0 }; if (score != null) { S.games[id].plays++; if (score > S.games[id].best) { S.games[id].best = score; save(); return true; } save(); } return false; }

function drawGameArt(cv, id) {
  const c = cv.getContext('2d'), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; c.scale(dpr, dpr);
  c.fillStyle = '#0B1326'; c.fillRect(0, 0, W, H);
  const col = { muscle: '#FF6478', plane: '#3CCBB4', attrib: '#A98BFF', reaction: '#FF9152', blitz: '#F2B04E' }[id];
  if (id === 'reaction') { for (let i = 0; i < 12; i++) { c.fillStyle = hexA(col, .2 + .06 * i); c.fillRect(20 + i * (W - 40) / 12, H - 24 - i * 5, (W - 40) / 12 - 4, 10 + i * 5); } }
  else if (id === 'plane') { const cx = W - 70, cy = H / 2 - 6; [[.4, '#6CC47A'], [.38, '#E8B84A'], [.12, '#FF8A5B'], [.08, '#64A8F0'], [.02, '#B98AEF']].reduce((a0, [p, cc]) => { c.fillStyle = cc; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, 44, a0, a0 + p * Math.PI * 2); c.fill(); return a0 + p * Math.PI * 2; }, -Math.PI / 2); }
  else if (id === 'attrib') { for (let i = 0; i < 14; i++) { const x = 20 + Math.random() * (W - 40), y = 10 + Math.random() * (H - 50); c.save(); c.translate(x, y); c.rotate(Math.random() * 3); c.fillStyle = hexA(col, .3 + Math.random() * .5); c.beginPath(); c.roundRect ? c.roundRect(-10, -4, 20, 8, 4) : c.rect(-10, -4, 20, 8); c.fill(); c.restore(); } }
  else for (let i = 0; i < 26; i++) { c.fillStyle = hexA(col, Math.random() * .5 + .1); c.beginPath(); c.arc(Math.random() * W, Math.random() * (H - 30), 2 + Math.random() * 8, 0, 7); c.fill(); }
  CV.text(c, GAMES[id].title, 14, H - 18, '#fff', 21, 'left', 700, '"Barlow Condensed", sans-serif');
}

function mountGame(host, id) {
  let alive = true, timer = null; const stop = () => { alive = false; clearInterval(timer); };
  const hud = (items) => `<div class="game-hud">${items.map(([k, v]) => `<div class="hud"><span>${k}</span><b>${v}</b></div>`).join('')}<span class="spacer"></span><a class="btn sm" href="#/arcade">${ICON.back} Arcade</a></div>`;
  const endScreen = (score, extra = '') => { const nb = gameBest(id, score); if (score > 0) addXP(Math.min(60, Math.round(score / 2)), GAMES[id].title); if (nb && score > 0) { burst(); sfx.win(); }
    host.innerHTML = `<div class="game"><div class="card result"><div class="eyebrow">${GAMES[id].title}</div><div class="big">${score}</div><p class="lede" style="margin:8px auto">${nb ? 'New personal best!' : 'Personal best: ' + S.games[id].best}</p>${extra}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-again>Play again</button><a class="btn" href="#/arcade">Back to arcade</a></div></div></div>`;
    $('[data-again]', host).onclick = () => { stop(); cleanup = mountGame(host, id); }; };
  let cleanup = stop;

  if (id === 'muscle' || id === 'plane' || id === 'attrib') {
    const bank = id === 'muscle' ? MUSCLE_BANK : id === 'plane' ? PLANE_BANK : ATTRIB_BANK, total = 60;
    let score = 0, streak = 0, left = total, cur = null, answered = 0, right = 0;
    const next = () => { const item = pick(bank); const seen = new Set([item[1]]), others = shuffle(bank.filter(b => b[1] !== item[1])).filter(b => !seen.has(b[1]) && seen.add(b[1])).slice(0, 3); cur = { item, opts: shuffle([item, ...others]) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Streak', streak], ['Time', Math.ceil(left) + 's']])}<div class="timer"><i style="width:${left / total * 100}%"></i></div>
        <div class="eyebrow" style="text-align:center">${id === 'muscle' ? 'Which muscle is the agonist?' : id === 'plane' ? 'Which plane and axis?' : 'Which attribution (Weiner)?'}</div><div class="big-prompt">${esc(cur.item[0])}</div>
        <div class="opts">${cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o[1])}</span></button>`).join('')}</div><p class="kbd-hint">Keys 1–4 to answer.</p></div>`;
      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => { if (!alive) return; answered++; const ok = cur.opts[i] === cur.item; const btn = $$('.opt', host)[i]; if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btn.classList.add('right'); } else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btn.classList.add('wrong'); $$('.opt', host)[cur.opts.indexOf(cur.item)].classList.add('right'); } setTimeout(() => alive && left > 0 && next(), ok ? 250 : 900); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= 4 && !$('.opt.right', host)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();
    return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'reaction') {
    let n = 0, times = [], t0 = 0, armed = false, tm = null;
    const render = (msg, go) => { host.innerHTML = `<div class="game">${hud([['Trial', Math.min(n + 1, 10) + '/10'], ['Mean', times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) + ' ms' : '—']])}<button id="rt-pad" class="card" style="display:block;width:100%;height:220px;border-radius:20px;font:800 34px var(--f-display);text-transform:uppercase;cursor:pointer;background:${go ? 'var(--a5)' : 'var(--surface-2)'};color:${go ? '#fff' : 'var(--ink)'}">${msg}</button><p class="kbd-hint">Tap the pad or press Space when it turns orange.</p></div>`; $('#rt-pad', host).onpointerdown = hit; };
    const arm = () => { armed = false; render('Wait…'); clearTimeout(tm); tm = setTimeout(() => { if (!alive) return; armed = true; t0 = performance.now(); render('Go!', true); }, 1000 + Math.random() * 2200); };
    const hit = () => { if (!armed) { clearTimeout(tm); render('Too early!'); sfx.bad(); setTimeout(() => alive && arm(), 900); return; } const rt = performance.now() - t0; armed = false; times.push(rt); n++; sfx.good();
      if (n >= 10) { const m = times.reduce((a, b) => a + b, 0) / times.length; removeEventListener('keydown', key); endScreen(Math.max(0, Math.round(600 - m)), `<p class="muted">Mean simple reaction time ${Math.round(m)} ms (score = 600 − mean). Choice reactions are slower — Hick’s law.</p>`); } else { render(Math.round(rt) + ' ms'); setTimeout(() => alive && arm(), 800); } };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.code === 'Space') { e.preventDefault(); hit(); } };
    addEventListener('keydown', key); arm();
    return () => { stop(); clearTimeout(tm); removeEventListener('keydown', key); };
  }

  if (id === 'blitz') {
    const pool = allTopics().flatMap(t => V_(t).quiz.map(q => ({ q, t }))); let score = 0, lives = 3, cur;
    const next = () => { const { q, t } = pick(pool); const truth = Math.random() < 0.5; const opt = truth ? q.o[0] : pick(q.o.slice(1)); cur = { q, t, truth, opt }; render(); };
    const render = () => { host.innerHTML = `<div class="game">${hud([['Score', score], ['Lives', '♥'.repeat(lives) || '0']])}<div class="card"><div class="eyebrow">${cur.t.id} · ${esc(cur.t.title)}</div><p class="q-text">${rich(cur.q.q)}</p><div class="box def" style="font-size:17px"><b class="lbl">Proposed answer</b><p>${rich(cur.opt)}</p></div>
      <div class="row" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn primary" data-a="1" style="min-width:130px">True <kbd>T</kbd></button><button class="btn" data-a="0" style="min-width:130px">False <kbd>F</kbd></button></div><div id="bz-fb"></div></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => answer(b.dataset.a === '1')); };
    const answer = a => { if ($('#bz-fb', host).innerHTML) return; const ok = a === cur.truth; ok ? (score += 10, sfx.good()) : (lives--, sfx.bad());
      $('#bz-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</b> ${cur.truth ? 'That answer is right.' : 'The correct answer is: ' + rich(cur.q.o[0])} ${cur.q.x ? '<br><span class="muted">' + rich(cur.q.x) + '</span>' : ''}</div>`;
      setTimeout(() => { if (!alive) return; lives > 0 ? next() : endScreen(score); }, ok ? 900 : 2600); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 't' || e.key === 'T') answer(true); if (e.key === 'f' || e.key === 'F') answer(false); };
    addEventListener('keydown', key); next(); return () => { stop(); removeEventListener('keydown', key); };
  }
  return stop;
}

function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, v = V_(t);
  const ck = t.cards.length ? Object.entries(s.cards).filter(([i, b]) => b >= 3 && inScope(t.cards[i]?.[2] || '')).length / Math.max(1, v.cards.length) : 0;
  const sp = v.spec.reduce((a, [, i]) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / Math.max(1, v.spec.length);
  const calc = v.gens.length ? Math.min(s.calc || 0, 5) / 5 : q;
  return clamp(0.4 * q + 0.2 * ck + 0.2 * sp + 0.2 * calc, 0, 1);
}
const pct = x => Math.round(x * 100) + '%';
const unitMastery = uid => { const ts = unitTopics(uid); return ts.length ? ts.reduce((a, t) => a + mastery(t), 0) / ts.length : 0; };

    </article>

      <div class="card flat" style="padding:16px"><div class="eyebrow">Specification checklist · ${esc(t.ref)}</div><p class="small muted" style="margin:6px 0 10px">Rate your confidence: red, amber, green.</p><div class="spec-list">${v.spec.map(([sp, i]) => `<div class="spec-item"><div class="rag" data-i="${i}">${[1, 2, 3].map(val => `<button data-v="${val}" class="${s.spec[i] === val ? 'on' : ''}" aria-label="${['Not confident', 'Getting there', 'Confident'][val - 1]}: ${esc(specTxt(sp))}"></button>`).join('')}</div><span>${tagHTML(specFlag(sp), 1)}${rich(esc(specTxt(sp)))}</span></div>`).join('')}</div></div>
      <a class="btn primary" href="#/t/${t.id}/quiz">Test yourself ${ICON.arrow}</a></aside></div>`;

  /* ---------- Flashcards (Leitner boxes) ---------- */
  function cardsTab(host, t) {
    const s = T(t.id), idxs = t.cards.map((c, i) => i).filter(i => inScope(t.cards[i][2] || '')); let queue = shuffle(idxs).sort((a, b) => (s.cards[a] || 0) - (s.cards[b] || 0)), pos = 0, flipped = false, reviewed = 0;
    const render = () => {
      const i = queue[pos], box = s.cards[i] || 0, counts = [0, 1, 2, 3, 4, 5].map(b => idxs.filter(j => (s.cards[j] || 0) === b).length);
      if (pos >= queue.length) { host.innerHTML = `<div class="card result"><div class="eyebrow">Session complete</div><div class="big">${reviewed}</div><p class="lede" style="margin:8px auto">cards reviewed. Known (box 3+): ${idxs.filter(j => s.cards[j] >= 3).length}/${idxs.length}</p><button class="btn primary" id="again">Review again</button></div>`; $('#again').onclick = () => cardsTab(host, t); return; }
      host.innerHTML = `<div class="fc-stage"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow">Card ${pos + 1} of ${queue.length}</span><span class="pill">Box ${box || 'new'}</span></div>
        <div class="fc ${flipped ? 'flip' : ''}" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="front"><span class="eyebrow">Question ${tagHTML(t.cards[i][2] || '', 1)}</span><div>${rich(t.cards[i][0])}</div></div><div class="back"><span class="eyebrow">Answer</span><div>${rich(t.cards[i][1])}</div></div></div>
        <div class="fc-ctl">${flipped ? `<button class="btn" data-r="0" style="border-color:var(--bad);color:var(--bad)">Again <kbd>1</kbd></button><button class="btn" data-r="1">Hard <kbd>2</kbd></button><button class="btn" data-r="2" style="border-color:var(--good);color:var(--good)">Good <kbd>3</kbd></button><button class="btn" data-r="3">Easy <kbd>4</kbd></button>` : `<button class="btn primary" id="flip">Show answer <kbd>Space</kbd></button>`}</div>
        <div class="boxes">${counts.map((n, b) => `<span>${b ? 'Box ' + b : 'New'}: ${n}</span>`).join('')}</div></div>`;
      $('#fc').onclick = () => { flipped = !flipped; sfx.flip(); render(); };
      $('#flip') && ($('#flip').onclick = () => { flipped = true; sfx.flip(); render(); });
      $$('[data-r]', host).forEach(b => b.onclick = () => rate(+b.dataset.r));
    };
    const rate = r => { const i = queue[pos], b = s.cards[i] || 0; s.cards[i] = r === 0 ? 1 : r === 1 ? Math.max(1, b) : r === 2 ? Math.min(5, b + 1) : Math.min(5, b + 2); if (r === 0) queue.push(i); reviewed++; S.stats.cardsSeen++; save(); addXP(2); pos++; flipped = false; render(); };
    const key = e => { if (!document.body.contains(host) || !$('#fc')) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipped = !flipped; render(); } else if (flipped && '1234'.includes(e.key)) rate(+e.key - 1); };
    addEventListener('keydown', key); cleanup = () => removeEventListener('keydown', key);
    render();
  }

  /* ---------- Quiz engine (also used by mock exam & daily challenge) ---------- */
  function runQuiz(host, items, o = {}) {
    const exam = o.mode === 'exam';
    const qs = items.map(it => it.type === 'num' ? it : { ...it, type: 'mcq', order: shuffle(it.o.map((_, i) => i)) });
    let i = 0, res = [], t0 = Date.now(), tick = null;
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${q.topic}</a>` : ''}${o.timeLimit ? '<span class="pill warn mono" id="qtimer"></span>' : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : exam ? 'cur' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.type === 'num' ? q.q : q.q)}</div>
        ${q.type === 'mcq' ? `<div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p>`
          : `<div class="calc-in"><input id="numin" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5e-3" aria-label="Your answer"><span class="unit">${q.unit || ''}</span><button class="btn primary" id="numgo">Submit</button></div><p class="kbd-hint">Give your answer to 2–3 significant figures (answers within 2% are accepted).</p>`}
        <div id="fb"></div>`;
      if (q.type === 'mcq') $$('.opt', host).forEach(b => b.onclick = () => answer(+b.dataset.k));
      else { const inp = $('#numin'); inp.focus(); $('#numgo').onclick = () => answer(inp.value); inp.onkeydown = e => { if (e.key === 'Enter') answer(inp.value); }; }
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i) return;
      let ok, given;
      if (q.type === 'mcq') { ok = q.order[k] === 0; given = k; } else { const v = parseNum(k); if (!isFinite(v)) { toast('Enter a number, e.g. 3.2e-5'); return; } ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * (q.tol || 0.02) + 1e-12; given = v; }
      res.push({ ok, given, q }); (ok ? sfx.good : sfx.bad)();
      if (exam) { i++; render(); return; }
      if (q.type === 'mcq') { $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); }); }
      else { $('#numin').disabled = true; $('#numgo').disabled = true; }
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${q.type === 'num' ? `Answer: <b>${fmtAns(q.ans)}</b> ${q.unit}<div class="steps"><b class="small">Solution</b><ol>${q.steps.map(x => `<li>${rich(x)}</li>`).join('')}</ol></div>` : rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      clearInterval(tick); removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100), secs = Math.round((Date.now() - t0) / 1000);
      if (p === 100) { burst(); sfx.win(); }
      const byTopic = {}; res.forEach(r => { const k = r.q.topic || '—'; byTopic[k] ??= [0, 0]; byTopic[k][1]++; if (r.ok) byTopic[k][0]++; });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete · ${Math.floor(secs / 60)}m ${secs % 60}s</div><div class="big">${p}%</div><p class="lede" style="margin:6px auto 0">${correct} of ${qs.length} correct${p >= 80 ? ' — excellent.' : p >= 50 ? ' — good progress.' : ' — revisit the notes and try again.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>
        ${Object.keys(byTopic).length > 1 ? `<div class="sec"><div class="eyebrow">By topic</div><div class="grid gauto" style="margin-top:10px">${Object.entries(byTopic).map(([k, [a, b]]) => `<a class="tcard" href="#/t/${k}" style="--uc:${TOPIC[k] ? ucol(TOPIC[k].unit) : 'var(--accent)'}"><span class="no" style="font-size:22px">${k}</span><span class="tt">${TOPIC[k] ? esc(TOPIC[k].title) : ''}</span><span class="ts">${a}/${b} correct</span></a>`).join('')}</div></div>` : ''}
        <div class="sec"><div class="eyebrow">Review</div>${res.map((r, j) => `<div class="explain" style="margin-top:10px"><b class="v ${r.ok ? 'good' : 'bad'}">${j + 1}. ${r.ok ? '✓' : '✗'}</b> ${rich(r.q.q)}<div class="small" style="margin-top:6px">${r.q.type === 'mcq' ? `<b>Answer:</b> ${rich(r.q.o[0])}${r.ok ? '' : ` · <span style="color:var(--bad)">you chose: ${rich(r.q.o[r.q.order[r.given]])}</span>`}${r.q.x ? `<br><span class="muted">${rich(r.q.x)}</span>` : ''}` : `<b>Answer:</b> ${fmtAns(r.q.ans)} ${r.q.unit} · you gave ${r.given == null ? '—' : fmtAns(r.given)}`}</div></div>`).join('')}</div>`;
      $('#retry').onclick = () => { o.retry ? o.retry() : runQuiz(host, items, o); };
      S.stats.quizzes++; if (p === 100) S.stats.perfect++; save();
      o.onDone && o.onDone({ correct, total: qs.length, p, res });
      checkBadges();
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const q = qs[i]; if (!q) return;
      if (res.length > i && e.key === 'Enter') { $('#nextq')?.click(); return; }
      if (q.type === 'mcq' && res.length <= i) { const k = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (k != null && k < q.o.length) answer(k); } };
    addEventListener('keydown', key);
    if (o.timeLimit) { const end = Date.now() + o.timeLimit * 1000; tick = setInterval(() => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = $('#qtimer'); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (!document.body.contains(host)) clearInterval(tick); if (left <= 0) { while (res.length < qs.length) res.push({ ok: false, given: null, q: qs[res.length] }); i = qs.length; finish(); } }, 500); }
    const prevCleanup = cleanup; cleanup = () => { clearInterval(tick); removeEventListener('keydown', key); prevCleanup && prevCleanup(); };
    render();
  }

  function calcTab(host, t) {

      const q = GEN[pick(V_(t).gens)]();
      host.innerHTML = `<div class="quiz-wrap"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow">Unlimited calculation practice · new values every time</span><span class="pill good">${s.calc || 0} correct · streak ${streak}</span></div>
        <div class="card"><div class="calc-q">${rich(q.q)}</div><div class="calc-in"><input id="cin" inputmode="decimal" autocomplete="off" placeholder="your answer" aria-label="Your answer"><span class="unit">${q.unit}</span><button class="btn primary" id="cgo">Check</button><button class="btn ghost" id="cshow">Show solution</button></div><p class="kbd-hint">Answers within 2% are accepted. Use e-notation for powers of ten (e.g. 3.0e8). Take g = 9.8 N/kg unless told otherwise.</p><div id="cfb"></div></div></div>`;
      const inp = $('#cin'); inp.focus();

      const check = () => { const v = parseNum(inp.value); if (!isFinite(v)) { toast('Enter a number, e.g. 2.4e-3'); return; } const ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * 0.02 + 1e-12; if (ok) { s.calc = (s.calc || 0) + 1; S.stats.calcOK++; streak++; save(); addXP(15, 'Calculation correct'); sfx.good(); if (streak % 5 === 0) burst(); } else { streak = 0; sfx.bad(); } s.calcN = (s.calcN || 0) + 1; save(); reveal(ok); };
      $('#cgo').onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); }; $('#cshow').onclick = () => { streak = 0; reveal(null); };

  /* ---------- Structured exam questions (topic tab, bank and papers) ----------
     A question is {q, m, ms} or {q (stem), parts:[{q, m, ms, lv?}]}. Parts with lv:true are extended answers marked in
     bands: ms is then indicative content, and the learner awards a mark using WJEC-style band descriptors. */
  const QTAGS = { short: 'Short answer', struct: 'Structured', ext: 'Extended (levels)', data: 'Data response', graph: 'Graphs', calc: 'Calculation', synoptic: 'Synoptic', nea: 'NEA practice' };
  const qParts = q => q.parts || [{ q: '', m: q.m, ms: q.ms, lv: q.lv }];
  const qMarks = q => qParts(q).reduce((a, p) => a + p.m, 0);
  const qTag = q => q.tag || (qParts(q).some(p => p.lv) ? 'ext' : q.parts ? 'struct' : 'short');
  const BANDS = { 4: [[3, 4], [2, 2], [1, 1]], 5: [[4, 5], [2, 3], [1, 1]], 6: [[5, 6], [3, 4], [1, 2]], 7: [[6, 7], [3, 5], [1, 2]], 8: [[7, 8], [4, 6], [1, 3]], 9: [[7, 9], [4, 6], [1, 3]], 10: [[8, 10], [4, 7], [1, 3]] };
  const BAND_TXT = ['Detailed, accurate knowledge applied consistently to the context; thorough analysis and evaluation that weighs both sides; a supported conclusion; accurate specialist terms; well structured.',
    'Sound knowledge with some application; some analysis or evaluation, but one-sided or undeveloped; a conclusion that is not fully supported; some specialist terms.',
    'Limited knowledge, mostly descriptive; little application, analysis or evaluation; few specialist terms; limited structure.'];
  function partHTML(p, j, multi) {
    p = { ...p, q: String(p.q || '').replace(/\s*\[\d+\]\s*$/, '') };
    const lab = multi ? `<span class="pl">(${'abcdefgh'[j]})</span>` : '';
    const box = `<textarea rows="${p.m >= 6 ? 7 : p.m >= 3 ? 3 : 2}" aria-label="Your answer"></textarea>`;
    if (p.lv) { const b = BANDS[p.m] || BANDS[8];
      return `<div class="xq-part" data-m="${p.m}" data-lv="1"><div>${lab}${rich(p.q)} <b class="mono">[${p.m}]</b> <span class="tag qt sm">levels-marked</span></div>${box}
        <div class="ms" hidden><div class="eyebrow" style="margin-bottom:4px">Indicative content — tick what you covered (a guide, not a checklist)</div>${p.ms.map(x => `<label><input type="checkbox" data-ic> <span>${rich(x)}</span></label>`).join('')}
        <div class="eyebrow" style="margin:12px 0 2px">Choose the band that best fits, then the mark</div><div class="bands">${b.map((r, k) => `<button type="button" data-band="${k}" data-lo="${r[0]}" data-hi="${r[1]}"><b>Band ${3 - k} · ${r[0]}–${r[1]}</b><span>${BAND_TXT[k]}</span></button>`).join('')}</div>
        <div class="mk-pick">${Array.from({ length: p.m + 1 }, (_, k) => `<button type="button" data-mk="${k}">${k}</button>`).join('')}</div></div></div>`; }
    return `<div class="xq-part" data-m="${p.m}"><div>${lab}${rich(p.q)} <b class="mono">[${p.m}]</b></div>${box}
      <div class="ms" hidden><div class="eyebrow" style="margin-bottom:4px">Mark scheme — tick the points you made (1 mark each, up to ${p.m})</div>${p.ms.map(x => `<label><input type="checkbox"> <span>${rich(x)}</span></label>`).join('')}</div></div>`;
  }
  function xqHTML(q, n, o = {}) {
    const ps = qParts(q), multi = !!q.parts, tp = q.topic && TOPIC[q.topic], tg = qTag(q);
    if (q.mcq) return `<div class="xq" data-xq="${n}" style="--uc:${tp ? acol(tp) : 'var(--accent)'}"><div class="xq-head"><span class="n">${o.num || 'Q' + (n + 1)}</span>${tp && o.showTopic ? `<a class="pill" href="#/t/${tp.id}">${tp.id} ${esc(tp.title)}</a>` : ''}<span class="tag qt sm">Multiple choice</span><span class="spacer" style="flex:1"></span><span class="pill mk">1 mark</span></div>
      <div class="xq-part" data-m="1" data-mcq="1"><div>${rich(q.q)}</div><ol class="mcq-list" type="A">${q.order.map(i => `<li class="${i === 0 ? 'ans-k' : ''}"><label style="display:flex;gap:8px"><input type="radio" name="mcq${n}" value="${i}"> <span>${rich(q.o[i])}</span></label></li>`).join('')}</ol>
      <div class="ms" hidden><div class="small"><b>Answer:</b> ${rich(q.o[0])}${q.x ? ` — <span class="muted">${rich(q.x)}</span>` : ''}</div></div></div></div>`;
    return `<div class="xq" data-xq="${n}" style="--uc:${tp ? acol(tp) : 'var(--accent)'}"><div class="xq-head"><span class="n">${o.num || 'Q' + (n + 1)}</span>${tp && o.showTopic ? `<a class="pill" href="#/t/${tp.id}">${tp.id} ${esc(tp.title)}</a>` : ''}<span class="tag qt sm">${QTAGS[tg] || tg}</span>${tp && o.showTopic ? areaTag(tp, 1) : ''}<span class="spacer" style="flex:1"></span><span class="pill mk">${qMarks(q)} mark${qMarks(q) > 1 ? 's' : ''}</span></div>
