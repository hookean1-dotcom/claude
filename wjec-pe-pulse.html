TOPICS.push({
  id: '1.18', unit: '1', area: 'soc', ref: 'Social differentiation within sport', title: 'Social differentiation within sport', short: 'Stratification; prejudice, stereotyping, discrimination; barriers; stacking; strategies',
  summary: 'Not everyone has the same chance to take part or succeed in sport. Learn social stratification, prejudice, stereotyping and discrimination towards ethnic minorities, women, disabled and socially deprived people, barriers of opportunity, provision and esteem, the self-fulfilling prophecy, centrality and racial stacking, social mobility, and the strategies used to widen participation.',
  spec: [
    'Definition of social stratification and its application to sport',
    'Prejudice, stereotyping and discrimination towards ethnic minorities, women, disabled and socially deprived people',
    'Barriers to participation: opportunity, provision and esteem for disadvantaged groups',
    'Economic and socio-cultural factors affecting participation and achievement; class divisions',
    'Indicators relating to education, location, culture and social capital, e.g. independently educated Team GB medallists at London 2012',
    'Self-fulfilling prophecy; centrality and racial stacking and the lack of BAME managers and coaches',
    'Sport as an avenue for social mobility; influence of the media and role models',
    'Strategies and reformative policies, e.g. Kick It Out, adapted sports for disabled people'
  ],
  learn: [
    { h: 'Stratification, prejudice, stereotyping and discrimination', html: `
<p><b>Social stratification</b> is the division of society into a <b>hierarchy of layers</b> (strata) based on factors such as social class, wealth, income, occupation, education, ethnicity and gender. Those higher up usually have more power, wealth and opportunity — including in sport.</p>
<div class="tbl"><table><tr><th>Term</th><th>Meaning</th><th>Sporting example</th></tr>
<tr><td><b>Prejudice</b></td><td>a pre-judgement; an unfavourable attitude towards a group formed without knowledge</td><td>believing women are not interested in watching football</td></tr>
<tr><td><b>Stereotyping</b></td><td>a simplified, generalised belief about all members of a group</td><td>“black players lack the intelligence to be quarterbacks”; “girls can’t play contact sports”</td></tr>
<tr><td><b>Discrimination</b></td><td>acting unfairly towards a person or group because of prejudice. <b>Overt</b>: open (racist chanting); <b>covert</b>: hidden (not selecting, fewer opportunities)</td><td>fewer coaching jobs for BAME candidates; unequal pay and media coverage for women</td></tr></table></div>` },
    { h: 'Barriers to participation', html: `
<p>Barriers can be grouped as <b>opportunity</b> (the chance to take part: time, money, family commitments, transport), <b>provision</b> (facilities, clubs, coaches, equipment, programmes being available and accessible) and <b>esteem</b> (confidence, self-worth, feeling welcome, role models).</p>
<div class="tbl"><table><tr><th>Group</th><th>Typical barriers</th></tr>
<tr><td><b>Ethnic minorities</b></td><td>racism and abuse; religious and cultural factors (dress, single-sex provision, fasting); stereotyping and stacking; few role models in coaching and management</td></tr>
<tr><td><b>Women</b></td><td>stereotypes about femininity; less media coverage and sponsorship; lower pay and prize money; family and caring commitments; body-image concerns; fewer female coaches and officials; fewer clubs and teams</td></tr>
<tr><td><b>Disabled people</b></td><td>inaccessible facilities and transport; cost of specialist equipment; lack of trained coaches and adapted clubs; negative attitudes; low confidence; fewer role models (improving since London 2012)</td></tr>
<tr><td><b>Socially deprived / lower socio-economic groups</b></td><td>cost (fees, equipment, travel); poorer local facilities; less time (shift work); fewer school opportunities; less family support and social capital</td></tr></table></div>` },
    { h: 'Class, education, location and social capital', html: `
<p>Historically, sports were class-divided: the upper classes had polo, rowing, real tennis and amateur rugby union; the working classes football, rugby league and boxing. Class still affects participation and achievement today:</p>
<ul><li><b>Education</b> — independent schools have better facilities, specialist coaches, more PE time and fixtures. About 30% of Team GB’s medallists at <b>London 2012</b> were privately educated, compared with about 7% of the population; in sports like rowing, equestrian and sailing the proportion was far higher.</li>
<li><b>Location</b> — urban/rural differences and deprived areas with fewer facilities; distance and transport.</li>
<li><b>Culture</b> — family traditions and community values (e.g. rugby in the valleys of south Wales).</li>
<li><b>Social capital</b> — the networks, contacts and support that help people progress (parents who can drive to training, knowledge of pathways, connections).</li></ul>` },
    { h: 'Self-fulfilling prophecy, centrality and stacking', html: `
<p><b>Self-fulfilling prophecy</b> (Rosenthal): a coach’s expectations of a performer (often based on stereotypes) affect how the coach treats them — more attention and feedback for those expected to succeed — and the performer’s behaviour then matches the expectation. E.g. if a coach believes girls are poor at football and gives them less coaching, they do perform worse, “confirming” the stereotype.</p>
[[d:stacking]]
<p><b>Centrality</b> (Loy and McElvogue): <b>central</b> positions involve more interaction, decision-making and leadership (e.g. quarterback, central midfield, fly-half, pitcher). <b>Racial stacking</b> is the over-representation of ethnic-minority players in <b>non-central</b> positions that emphasise speed and power (e.g. wingers), and of white players in central positions — reflecting stereotypes about intelligence and leadership.</p>
<p>Because coaches and managers are often recruited from central-position players, stacking contributes to the <b>lack of BAME managers and coaches</b>. Responses include the NFL’s <b>Rooney Rule</b> (interview at least one minority candidate) and the English Football League’s voluntary recruitment code.</p>` },
    { h: 'Social mobility, media and strategies', html: `
<p><b>Social mobility</b> is the movement of a person between levels of the social hierarchy. Sport can be an avenue for upward mobility (professional footballers and boxers from working-class backgrounds), but only a tiny minority make it, and many who try miss out on education.</p>
<p><b>The media and role models</b>: under-representation of women, disabled and minority athletes limits role models; positive coverage (the 2012 Paralympics, the growth of women’s football and rugby) raises esteem and participation.</p>
<div class="tbl"><table><tr><th>Strategy / policy</th><th>Aim</th></tr>
<tr><td><b>Kick It Out</b> (1993) and Show Racism the Red Card</td><td>anti-racism campaigns in football: education, reporting, sanctions</td></tr>
<tr><td>Adapted sports (wheelchair basketball, boccia, goalball, polybat) and Disability Sport Wales</td><td>provision and inclusion for disabled people</td></tr>
<tr><td>This Girl Can (Sport England) and Sport Wales campaigns for women and girls</td><td>esteem and participation among women</td></tr>
<tr><td>Equality Act 2010; targeted funding; subsidised or free sessions; women-only sessions; accessible facilities</td><td>opportunity and provision</td></tr>
<tr><td>Coaching courses for under-represented groups; positive-action recruitment</td><td>diversity in coaching and leadership</td></tr></table></div>
<p>Effects on sports: more diverse participation and talent pools, changing attitudes; but progress is uneven and deep-rooted barriers remain.</p>` }
  ],
  eqs: [],
  worked: [
    { q: 'Explain how racial stacking may lead to a lack of BAME managers in football. (3 marks)', s: ['Stacking places ethnic-minority players disproportionately in non-central, peripheral positions (e.g. wingers) that emphasise speed and power, based on stereotypes.', 'Central positions involve decision-making and leadership, so players in these positions are seen as having leadership qualities.', 'Managers are often recruited from former central players, so fewer BAME players are considered — reinforced by the self-fulfilling prophecy and lack of role models.'], a: 'Stacking → fewer central/leadership roles → fewer seen as future managers.' }

  summary: 'The heart is a dual-action pump whose output rises five- to eightfold in exercise. Learn heart rate, stroke volume and cardiac output and how each responds to exercise and training, the Frank–Starling mechanism and venous return, the cardiac cycle and conduction system, and how the cardiac control centre uses nerves, receptors and hormones to regulate the heart.',

  learn: [
    { h: 'A dual-action pump', html: `
[[d:heart]]
<p>The heart is two pumps side by side, separated by the septum:</p>
<ul><li><b>Right side → pulmonary circulation:</b> deoxygenated blood from the body (vena cavae) → right atrium → tricuspid valve → right ventricle → pulmonary artery → lungs, where it picks up oxygen and loses carbon dioxide.</li>
<li><b>Left side → systemic circulation:</b> oxygenated blood from the lungs (pulmonary veins) → left atrium → bicuspid (mitral) valve → left ventricle → aorta → body. The left ventricle has the thickest wall because it pumps blood all round the body.</li></ul>
<p>Valves (tricuspid, bicuspid and the semilunar valves) prevent backflow.</p>` },
    { h: 'Heart rate, stroke volume and cardiac output', html: `
<p>$Q = "HR" × "SV"$ — <b>cardiac output</b> (Q, litres per minute) is the volume of blood ejected from the left ventricle per minute; <b>heart rate</b> (HR, beats per minute) is the number of beats per minute; <b>stroke volume</b> (SV, ml) is the volume of blood ejected from the left ventricle per beat.</p>
<div class="tbl"><table><tr><th></th><th>Untrained, rest</th><th>Trained, rest</th><th>Untrained, maximal</th><th>Trained, maximal</th></tr>
<tr><td>HR (bpm)</td><td>≈ 72</td><td>≈ 50 (bradycardia)</td><td>≈ 200 (220 − age)</td><td>≈ 190–200</td></tr>
<tr><td>SV (ml)</td><td>≈ 70</td><td>≈ 100</td><td>≈ 100–120</td><td>≈ 160–200</td></tr>
<tr><td>Q (L/min)</td><td>≈ 5</td><td>≈ 5</td><td>≈ 20–24</td><td>≈ 30–40</td></tr></table></div>
<p>Resting cardiac output is the same for trained and untrained people — the trained heart does it with a bigger stroke volume and a lower heart rate.</p>
[[d:hrresponse]]
<p><b>Heart rate response:</b> an <b>anticipatory rise</b> before exercise (adrenaline); a rapid rise at the start; a plateau (<b>steady state</b>) in submaximal exercise when oxygen supply meets demand; in maximal exercise HR keeps rising to maximum. In recovery, a rapid then slower fall. Trained performers have a lower resting and submaximal HR and recover faster.</p>
<p><b>Stroke volume response:</b> SV increases with intensity up to about 40–60% of maximum, then plateaus (because at high HR there is less time for the ventricles to fill). Trained endurance athletes can keep increasing SV to higher intensities.</p>` },
    { h: 'Venous return and the Frank–Starling mechanism', html: `
<p><b>Venous return</b> is the volume of blood returning to the right atrium per minute. The heart can only pump out what it receives, so venous return controls stroke volume.</p>
<p><b>Mechanisms of venous return:</b></p><ul><li><b>skeletal muscle pump</b> — contracting muscles squeeze veins, pushing blood towards the heart;</li><li><b>respiratory pump</b> — pressure changes in the chest during breathing draw blood into the thorax;</li><li><b>pocket valves</b> in veins prevent backflow;</li><li><b>venoconstriction</b> — smooth muscle in vein walls contracts (sympathetic stimulation);</li><li><b>gravity</b> helps blood from above the heart.</li></ul>
<p><b>Frank–Starling mechanism (Starling’s law):</b> increased venous return → more blood fills the ventricles (greater end-diastolic volume) → the ventricular walls are stretched more → they contract more forcefully → a greater stroke volume.</p>
<div class="box why"><b class="lbl">Why an active cool-down helps</b><p>Keeping the muscle and respiratory pumps working maintains venous return, preventing blood pooling in the legs (dizziness) and helping remove lactic acid.</p></div>` },
    { h: 'The cardiac cycle and conduction system', html: `
[[d:conduction]]
<p>The heart is <b>myogenic</b> — it generates its own impulse. One <b>cardiac cycle</b> (≈ 0.8 s at 75 bpm) has two phases:</p>
<ul><li><b>Diastole</b> (≈ 0.5 s at rest) — the chambers relax and fill with blood; AV valves open, semilunar valves closed.</li>
<li><b>Systole</b> (≈ 0.3 s) — atrial systole (atria contract, pushing blood into ventricles), then ventricular systole (ventricles contract; AV valves close; semilunar valves open; blood ejected into aorta and pulmonary artery).</li></ul>
<p><b>Conduction system:</b> the <b>sinoatrial (SA) node</b> (pacemaker, right atrium) sends an impulse across the atria → atria contract → the <b>atrioventricular (AV) node</b> delays the impulse ≈ 0.1 s so the atria finish emptying → <b>bundle of His</b> → bundle branches → <b>Purkinje fibres</b> → ventricles contract from the apex upwards.</p>
<p>In exercise, diastole shortens much more than systole — which is why stroke volume plateaus at very high heart rates.</p>` },
    { h: 'Regulating the heart', html: `
<p>The <b>cardiac control centre (CCC)</b> in the <b>medulla oblongata</b> changes the rate at which the SA node fires, using the autonomic nervous system:</p>
<ul><li><b>Sympathetic nervous system</b> (accelerator nerve) → increases HR and the force of contraction.</li><li><b>Parasympathetic nervous system</b> (vagus nerve) → decreases HR back towards resting.</li></ul>
<div class="tbl"><table><tr><th>Receptor</th><th>Detects</th><th>In exercise</th></tr>
<tr><td><b>Chemoreceptors</b> (aorta, carotid arteries, muscles)</td><td>chemical changes: ↑ CO₂, ↓ pH (↑ lactic acid), ↓ O₂</td><td>→ CCC → sympathetic → HR ↑</td></tr>
<tr><td><b>Proprioceptors</b> (muscles, tendons, joints)</td><td>movement and muscle tension</td><td>→ HR ↑ at the start of exercise</td></tr>
<tr><td><b>Baroreceptors</b> (aorta, carotid arteries)</td><td>blood pressure (stretch of vessel walls)</td><td>↑ BP → parasympathetic → HR ↓ (important in recovery)</td></tr>
<tr><td><b>Thermoreceptors</b></td><td>temperature of blood/skin</td><td>↑ temperature → HR ↑</td></tr></table></div>
<p><b>Hormonal control:</b> <b>adrenaline</b> (released from the adrenal glands under sympathetic stimulation) increases HR and contractility — including the anticipatory rise.</p>` }

  summary: 'In exercise, blood is redirected from the gut and kidneys to the working muscles. Learn the structure of arteries, arterioles, capillaries and veins, blood pressure as a function of cardiac output and resistance, and how the vasomotor centre controls the vascular shunt through vasodilation, vasoconstriction and pre-capillary sphincters.',

[[d:vessels]]
<div class="tbl"><table><tr><th>Vessel</th><th>Structure</th><th>Function</th></tr>
<tr><td><b>Arteries</b></td><td>thick walls of smooth muscle and elastic tissue; small lumen; no valves (except at the heart)</td><td>carry blood away from the heart under high pressure; elastic recoil smooths flow</td></tr>
<tr><td><b>Arterioles</b></td><td>smaller; lots of smooth muscle; <b>pre-capillary sphincters</b> at the entrance to capillaries</td><td>vasodilate or vasoconstrict to control blood flow into capillary beds</td></tr>

    { h: 'Blood pressure', html: `
<p>$"blood pressure" = Q × "resistance"$</p>
<p><b>Blood pressure</b> is the force exerted by blood against the walls of the blood vessels. <b>Systolic</b> pressure (≈ 120 mmHg at rest) is the pressure when the ventricles contract; <b>diastolic</b> (≈ 80 mmHg) when they relax.</p>
<p>Resistance to flow depends on the <b>diameter</b> of vessels (the main factor — vasoconstriction increases resistance), blood <b>viscosity</b> (raised by dehydration), and vessel length.</p>
<p>In <b>aerobic exercise</b> systolic pressure rises (cardiac output increases) but diastolic stays about the same, because vasodilation in the muscles lowers resistance. In <b>isometric</b> and heavy resistance exercise both rise sharply, because contracted muscles squeeze the vessels. Long-term endurance training can lower resting blood pressure.</p>` },
    { h: 'Vasomotor control and the vascular shunt', html: `
[[d:shunt]]
<p>At rest only about <b>15–20%</b> of cardiac output goes to skeletal muscles; in maximal exercise about <b>80–85%</b> does. This redistribution is the <b>vascular shunt</b>.</p>
<p>The <b>vasomotor centre (VCC)</b> in the medulla oblongata receives information from <b>chemoreceptors</b> (↑ CO₂, ↑ lactic acid, ↓ pH) and <b>baroreceptors</b> (blood pressure), and adjusts <b>sympathetic stimulation</b> of the smooth muscle in arterioles and pre-capillary sphincters:</p>
<ul><li>To the <b>working muscles</b>: sympathetic stimulation is <b>reduced</b> → arterioles <b>vasodilate</b> and <b>pre-capillary sphincters open</b> → more blood flows into the muscles’ capillaries.</li>
<li>To <b>non-essential organs</b> (stomach, intestines, liver, kidneys): sympathetic stimulation is <b>increased</b> → arterioles <b>vasoconstrict</b> and pre-capillary sphincters <b>close</b> → less blood flow.</li>
<li><b>Veins venoconstrict</b> → increases venous return.</li></ul>
<div class="tbl"><table><tr><th>Region</th><th>Rest (Q ≈ 5 L/min)</th><th>Maximal exercise (Q ≈ 25 L/min)</th></tr>
<tr><td>Skeletal muscle</td><td>≈ 20% (1.0 L)</td><td>≈ 84% (21 L)</td></tr>
<tr><td>Brain</td><td>≈ 15% (0.75 L)</td><td>≈ 3% (0.75 L — same volume)</td></tr>
<tr><td>Heart muscle</td><td>≈ 5% (0.25 L)</td><td>≈ 4% (1.0 L)</td></tr>
<tr><td>Liver and gut</td><td>≈ 25% (1.25 L)</td><td>≈ 1–2% (0.3 L)</td></tr>
<tr><td>Kidneys</td><td>≈ 20% (1.0 L)</td><td>≈ 1% (0.25 L)</td></tr>
<tr><td>Skin</td><td>≈ 5% (0.25 L)</td><td>≈ 2–4% (rises to lose heat; more in the heat)</td></tr></table></div>
<p>The brain receives a constant <b>volume</b> even though its <b>percentage</b> falls. Eating a large meal before exercise is unwise because the gut needs blood for digestion.</p>` }
  ],

TOPICS.push({
  id: '3.3', unit: '3', area: 'phys', ref: 'Short-term responses to exercise', title: 'Respiratory and neuromuscular responses', short: 'Tidal volume, frequency, minute ventilation; control of breathing; gas exchange; steady state; neuromuscular changes',
  summary: 'Breathing rises from about 6 L/min at rest to well over 100 L/min in maximal exercise. Learn how tidal volume, breathing frequency and minute ventilation respond to different intensities, how the respiratory control centre and receptors regulate breathing, how gas exchange speeds up, what steady state and VO₂max mean, and how the neuromuscular system responds as muscles warm up.',

  learn: [
    { h: 'Lung volumes in exercise', html: `
<p>$V_E = "TV" × f$ — <b>minute ventilation</b> (V<sub>E</sub>, L/min) = <b>tidal volume</b> (TV, the volume of air breathed in or out per breath) × <b>breathing frequency</b> (f, breaths per minute).</p>
<div class="tbl"><table><tr><th></th><th>Rest</th><th>Submaximal</th><th>Maximal</th></tr>
<tr><td>Tidal volume</td><td>≈ 0.5 L</td><td>increases (≈ 2–2.5 L)</td><td>≈ 2.5–3 L (plateaus)</td></tr>
<tr><td>Frequency</td><td>≈ 12–15 /min</td><td>increases, then steady</td><td>≈ 40–60 /min</td></tr>
<tr><td>Minute ventilation</td><td>≈ 6–7.5 L/min</td><td>≈ 60–100 L/min</td><td>≈ 120–180 L/min</td></tr></table></div>
<p>Tidal volume increases first; at high intensity tidal volume plateaus and further increases in V<sub>E</sub> come from frequency.</p>
[[d:veresponse]]
<p><b>Pattern of minute ventilation:</b> an anticipatory rise (adrenaline) → a rapid rise at the start (neural — proprioceptors) → a slower rise (chemical — chemoreceptors, temperature) → a plateau in submaximal exercise (steady state) or a continued rise in maximal exercise. In recovery, a rapid fall then a slower fall while the oxygen debt is repaid (restoring PC, removing lactic acid).</p>` },
    { h: 'Mechanics and control of breathing', html: `
<div class="tbl"><table><tr><th></th><th>At rest</th><th>During exercise</th></tr>
<tr><td>Inspiration</td><td>diaphragm and external intercostals contract; thoracic volume ↑, pressure ↓, air flows in</td><td>plus sternocleidomastoid, scalenes and pectoralis minor lift the ribs further → deeper breaths</td></tr>
<tr><td>Expiration</td><td>passive: muscles relax, lungs recoil</td><td>active: internal intercostals and abdominals contract to force air out faster</td></tr></table></div>
<p>The <b>respiratory control centre (RCC)</b> in the <b>medulla oblongata</b> has an inspiratory centre and an expiratory centre and sends impulses through the phrenic and intercostal nerves. It is stimulated by:</p>
<ul><li><b>chemoreceptors</b> — ↑ CO₂ (the most powerful stimulus), ↓ pH, ↓ O₂;</li><li><b>proprioceptors</b> — movement at the start of exercise;</li><li><b>thermoreceptors</b> — rising body temperature;</li><li><b>baroreceptors</b> — changes in blood pressure;</li><li><b>stretch receptors</b> in the lungs — stop over-inflation and trigger expiration (the Hering–Breuer reflex).</li></ul>` },
    { h: 'Gas exchange in exercise', html: `
<p>Oxygen and carbon dioxide move by <b>diffusion</b> from high to low <b>partial pressure</b>. In exercise the working muscles use more O₂ and produce more CO₂, so the partial pressure gradients between blood and muscle become steeper and diffusion is faster.</p>
<p>At the muscles, higher temperature, more CO₂ and lower pH cause haemoglobin to release its oxygen more readily (the <b>Bohr shift</b> of the oxyhaemoglobin dissociation curve to the right). Myoglobin in muscle holds oxygen and carries it to the mitochondria. The <b>arterio-venous oxygen difference</b> (a-vO₂ diff) — how much O₂ the muscles extract — increases.</p>` },
    { h: 'Steady state and VO₂max', html: `
<p><b>Steady state</b> — in submaximal exercise, after a few minutes, oxygen supply meets oxygen demand: HR, ventilation and VO₂ plateau and energy is supplied aerobically. Before steady state is reached there is an <b>oxygen deficit</b>, covered by anaerobic energy, which must be repaid after exercise.</p>
<p><b>VO₂max</b> — the maximum volume of oxygen that can be taken in, transported and used per minute. As exercise intensity rises, VO₂ rises in a straight line until it levels off at VO₂max; beyond this, extra energy must come anaerobically and fatigue follows. Trained athletes reach steady state faster, have a higher VO₂max and can work at a higher % of it.</p>` },
    { h: 'Neuromuscular responses', html: `
<ul><li>A <b>warm-up</b> raises muscle temperature, increasing the <b>speed of nerve impulse transmission</b> and the speed and force of contraction; it also reduces viscosity in muscles and improves enzyme activity.</li>
<li>As intensity increases, more <b>motor units</b> are recruited (type I first, then IIa, then IIb) — <b>spatial summation</b> — and impulses arrive more frequently (<b>wave summation</b>), increasing the force of contraction.</li>
<li><b>Proprioceptors</b> (muscle spindles, Golgi tendon organs) send information about stretch and tension, triggering reflexes and informing the heart and breathing control centres.</li>
<li><b>Fatigue</b>: depletion of PC and glycogen, accumulation of H⁺ ions, and reduced neurotransmitter release reduce force and co-ordination.</li></ul>` }

<p>A <b>force</b> is a push or pull that can change a body’s state of motion or shape; unit: newton (N). Forces are <b>vectors</b> (size and direction). Weight $W = mg$ (g = 9.8 N/kg) acts downward from the centre of mass; the <b>ground reaction force</b> acts upward from the ground.</p>

[[d:freebody]]
<p><b>Net (resultant) force</b>: if forces are <b>balanced</b> the body stays at rest or constant velocity; if <b>unbalanced</b> it accelerates in the direction of the net force.</p>` },

<p>$p = m × v$ — <b>momentum</b> is the quantity of motion a body possesses (kg m/s). Because velocity has direction, momentum is a <b>vector</b>.</p>

<p>A force–time graph shows the horizontal ground reaction force during a foot contact. The <b>area under the curve = impulse</b>.</p>

  id: '3.7', unit: '3', area: 'bio', ref: 'Biomechanical principles', title: 'Stability, centre of mass and friction', short: 'Stable, unstable and neutral equilibrium; base of support; centre of mass; coefficient of friction',
  summary: 'Some performers want to be as stable as possible, others want to be ready to move instantly. Learn the three states of equilibrium, how the base of support, the height of the centre of mass, the line of gravity and mass affect stability, and the factors that influence the coefficient of friction.',
  spec: [

  ],
  learn: [
    { h: 'Centre of mass and equilibrium', html: `
<p>The <b>centre of mass (COM)</b> is the point at which the mass of a body is concentrated and balanced — the point through which weight acts. In a standing person it is roughly at the hips; it moves as the body changes shape, and can lie <b>outside</b> the body (a Fosbury flop, a pike).</p>
<div class="tbl"><table><tr><th>Equilibrium</th><th>What happens when disturbed</th><th>Example</th></tr>
<tr><td><b>Stable</b></td><td>the COM is raised by a small displacement and returns to its original position</td><td>a wrestler on all fours; a rugby front row in a crouched, wide stance</td></tr>
<tr><td><b>Unstable</b></td><td>a small displacement lowers the COM and the body topples</td><td>a sprinter in the “set” position; a gymnast in a handstand; a diver balancing on the toes</td></tr>
<tr><td><b>Neutral</b></td><td>the COM stays at the same height; the body stays in its new position</td><td>a ball rolling on flat ground; a swimmer floating</td></tr></table></div>` },
    { h: 'Factors affecting stability', html: `
[[d:stability]]
<ul><li><b>Size of the base of support</b> — the area enclosed by the points of contact with the ground. Wider = more stable (a wide stance in judo; a three-point stance).</li>
<li><b>Height of the centre of mass</b> — lower = more stable (bending the knees before a tackle).</li>
<li><b>Position of the line of gravity</b> — the vertical line down from the COM. The more central within the base, the more stable; if it falls outside the base, the body topples. A sprinter in the set position moves the line of gravity to the front edge of the base so they can move off quickly.</li>
<li><b>Mass</b> — greater mass = greater inertia = more stable (sumo, front-row forwards).</li>
<li><b>Number of points of contact</b> and <b>friction</b> with the surface.</li></ul>
<p>Performers <b>maximise</b> stability to resist being moved (rugby scrum, judo defence, a golfer’s stance) and <b>minimise</b> it to move quickly (sprint start, a goalkeeper’s ready position, a swimmer’s dive).</p>` },
    { h: 'Friction', html: `
<p><b>Friction</b> is a force that opposes the motion (or attempted motion) of two surfaces in contact. It acts parallel to the surfaces. $F = μR$, where <b>μ</b> is the <b>coefficient of friction</b> and <b>R</b> is the normal reaction force.</p>
<p><b>Factors affecting the coefficient of friction</b> (how “grippy” the two surfaces are):</p>
<ul><li><b>Surface characteristics</b> — rougher surfaces grip more: spikes, studs, tread, chalk on a gymnast’s hands, grip tape on a racket.</li>
<li><b>Materials</b> of the two surfaces — rubber on a sprung floor, a tyre on tarmac.</li>
<li><b>Temperature</b> — warm racing tyres grip better (F1 tyre warmers); cold ice is slipperier for skaters at very low temperatures.</li>
<li><b>Dry or wet, clean or dirty</b> — water, mud or dust act as lubricants and reduce μ (wet-weather tyres, clean boots).</li></ul>
<p>The friction <b>force</b> also rises with the <b>normal reaction</b> (heavier body or downforce: F1 wings, see 3.10). Friction is sometimes reduced on purpose: waxed skis, smooth curling stones, sweeping the ice in curling.</p>` }
  ],
  eqs: [['F = μ R', 'friction force = coefficient of friction × normal reaction']],
  worked: [
    { q: 'Explain how a sprinter reduces stability in the “set” position and why. (3 marks)', s: ['The hips are raised, raising the centre of mass.', 'The body leans forward so the line of gravity moves to the front edge of the base of support (the hands), creating unstable equilibrium.', 'A small force then makes the sprinter move forward quickly, reducing the time to leave the blocks.'], a: 'Raise COM; line of gravity at the edge of the base; ready to move.' }

  ],

TOPICS.push({
  id: '3.9', unit: '3', area: 'bio', ref: 'Linear motion', title: 'Angular motion', short: 'Angular displacement, velocity and acceleration; moment of inertia; conservation of angular momentum',
  summary: 'Divers, gymnasts, skaters and throwers all rotate. Learn angular displacement, velocity and acceleration, moment of inertia and how it depends on mass and its distribution (radius of gyration), and how the conservation of angular momentum lets a performer spin faster or slower by changing body shape — with calculations.',
  spec: [
    'Angular displacement, angular velocity and angular acceleration',
    'Moment of inertia: factors affecting it — mass and distribution of mass about the axis of rotation (radius of gyration)',
    'Conservation of angular momentum; the rate of spin and its links to body shape',
    'Definitions of key terms and calculations involving spinning subjects'
  ],
  learn: [
    { h: 'Angular quantities', html: `
<p>Angular motion is movement around an axis (see 1.3), caused by an <b>eccentric force</b> (a force applied off-centre, creating a <b>torque</b>).</p>
<div class="tbl"><table><tr><th>Quantity</th><th>Definition</th><th>Unit</th></tr>
<tr><td>Angular displacement (θ)</td><td>the smallest change in angle between the start and finish position</td><td>degrees or radians (1 rad ≈ 57.3°; 360° = 2π rad)</td></tr>
<tr><td>Angular velocity (ω)</td><td>$ω = θ/t$ — rate of change of angular displacement</td><td>rad/s (or °/s)</td></tr>
<tr><td>Angular acceleration (α)</td><td>$α = (ω_2 − ω_1)/t$ — rate of change of angular velocity</td><td>rad/s²</td></tr></table></div>
<p>A gymnast who completes 1.5 somersaults has turned 540° (3π rad) — but their angular displacement from the start is 180° (π rad), since only the difference in position counts.</p>` },
    { h: 'Moment of inertia', html: `
<p>The <b>moment of inertia (I)</b> is a body’s resistance to change in its state of angular motion (kg m²) — the rotational equivalent of mass (inertia). $I = Σ m r^2$</p>
<p>It depends on:</p>
<ul><li><b>Mass</b> — more mass → greater I.</li>
<li><b>Distribution of mass about the axis</b> — the further the mass is from the axis, the greater I. Because r is squared, distribution has a large effect. The <b>radius of gyration</b> is the effective distance of the body’s mass from the axis ($I = m k^2$).</li></ul>
[[d:inertia]]
<p>A diver in a <b>tuck</b> has a small I (mass close to the axis); in a <b>straight/layout</b> position a large I (mass spread out). A sprinter flexes the knee tightly in the recovery phase to reduce the leg’s I, so it swings through faster.</p>` },
    { h: 'Angular momentum and its conservation', html: `
<p>$L = I × ω$ — <b>angular momentum</b> is the quantity of angular motion (kg m²/s).</p>
<p><b>Conservation of angular momentum:</b> angular momentum remains constant unless an external torque acts. In the air (flight), no external torque acts (ignoring air resistance), so <b>L is constant</b>. Therefore <b>I and ω are inversely proportional</b>:</p>
<ul><li>tucking reduces I → ω <b>increases</b> (spins faster);</li><li>opening out increases I → ω <b>decreases</b> (spin slows) — to control entry into the water or a landing.</li></ul>
[[d:angmom]]
<p>The amount of angular momentum is generated <b>at take-off</b> (from the board, floor or ice), where external forces can act; after that the performer can only redistribute it. An ice skater in a spin pulls the arms in to spin faster and spreads them out to slow down.</p>` }
  ],
  eqs: [['ω = θ/t', 'angular velocity (rad/s)'], ['α = (ω_2 − ω_1)/t', 'angular acceleration (rad/s²)'], ['I = Σ m r^2', 'moment of inertia (kg m²)'], ['L = I ω', 'angular momentum (kg m²/s)'], ['I_1 ω_1 = I_2 ω_2', 'conservation of angular momentum in flight']],
  worked: [
    { q: 'A diver has a moment of inertia of 15 kg m² in a straight position and 3.5 kg m² in a tuck. Leaving the board straight, her angular velocity is 4 rad/s. Calculate her angular velocity in the tuck. (3 marks)', s: ['Angular momentum is conserved in flight: $L = Iω = 15 × 4 = 60$ kg m²/s.', 'In the tuck: $ω = L/I = 60 ÷ 3.5$', '<b>≈ 17.1 rad/s</b> — more than four times faster.'], a: '≈ 17.1 rad/s.' },
    { q: 'A discus thrower turns through 1.5 revolutions in 1.2 s. Calculate the average angular velocity in rad/s. (2 marks)', s: ['1.5 revolutions = 1.5 × 2π = 9.42 rad.', '$ω = 9.42 ÷ 1.2 ≈$ <b>7.85 rad/s</b>.'], a: '≈ 7.9 rad/s.' }
  ],
  pitfalls: ['Saying angular momentum increases when a performer tucks — L stays the same; ω increases.', 'Forgetting that distribution of mass matters more than mass because r is squared.', 'Believing a performer can create more spin in the air — L is fixed at take-off.', 'Mixing degrees and radians in calculations.'],
  cards: [
    ['Angular velocity?', 'Rate of change of angular displacement; ω = θ ÷ t (rad/s).'], ['Angular acceleration?', 'Rate of change of angular velocity (rad/s²).'], ['Moment of inertia?', 'Resistance to change in angular motion; I = Σmr² (kg m²).'],
    ['Two factors affecting moment of inertia?', 'Mass and distribution of mass about the axis.'], ['Radius of gyration?', 'Effective distance of a body’s mass from the axis of rotation.'], ['Angular momentum?', 'L = Iω (kg m²/s).'],
    ['Conservation of angular momentum?', 'L stays constant unless an external torque acts — in flight, I↓ → ω↑.'], ['Why do divers tuck?', 'Smaller I → greater ω → more somersaults.'], ['Why open out before entry?', 'Larger I → smaller ω → controlled entry.'], ['1 revolution in radians?', '2π rad (≈ 6.28 rad).']
  ],
  quiz: [
    { q: 'When a diver changes from a straight position into a tuck, her angular velocity…', o: ['increases', 'decreases', 'stays the same', 'becomes zero'], x: 'I decreases, L constant.' },
    { q: 'Moment of inertia depends on mass and…', o: ['the distribution of mass about the axis', 'velocity', 'gravity', 'friction'], x: 'Radius of gyration.' },
    { q: 'L = 40 kg m²/s and I = 5 kg m². Angular velocity is…', o: ['8 rad/s', '200 rad/s', '45 rad/s', '0.125 rad/s'], x: 'ω = L ÷ I.' },

TOPICS.push({
  id: '3.10', unit: '3', area: 'bio', ref: 'Projectile motion', title: 'Projectile motion, lift and spin', short: 'Release velocity, angle and height; air resistance; Bernoulli lift; Magnus effect',
  summary: 'Why does a shot fly in a parabola but a shuttlecock does not, and how does a free kick bend? Learn the factors affecting the flight of a projectile, free-body diagrams in flight, the Bernoulli principle and lift (discus, javelin, F1 downforce), and the Magnus effect of topspin, backspin and sidespin on flight and bounce.',
  spec: [
    'Gravity and weight; factors affecting flight: velocity, height of release and air resistance',
    'Newton’s laws and the flight path of an object following a parabolic arc',
    'Lift forces: the Bernoulli principle — upward lift (discus) and downward lift (Formula 1 cornering); boundary layer',
    'Spin: Magnus effect, pressure differentials and Magnus force; topspin, backspin and sidespin/swerve and their effect on flight and bounce'
  ],
  learn: [
    { h: 'Factors affecting horizontal distance', html: `
<ul><li><b>Speed (velocity) of release</b> — the most important factor: the faster the release, the further the projectile travels (distance increases with the square of speed).</li>
<li><b>Angle of release</b> — when release and landing heights are equal, <b>45°</b> gives the maximum distance. When release height is <b>above</b> landing height (shot put), the optimum is <b>less than 45°</b> (about 38–42°). When the landing is above the release, the optimum is more than 45°. Long jumpers take off at about 20–22° because they cannot keep their speed at steeper angles.</li>
<li><b>Height of release</b> — the higher the release, the further the flight (tall shot putters release above head height).</li>
<li><b>Air resistance</b> and aerodynamic lift.</li></ul>
[[d:projectile]]` },
    { h: 'Parabolic and non-parabolic flight', html: `
<p>In flight, the forces are <b>weight</b> (down) and <b>air resistance</b> (opposite to the direction of motion). If weight is much larger than air resistance (a shot, a hammer, a long jumper) the path is a <b>symmetrical parabola</b>. If air resistance is large relative to weight (a shuttlecock, a table-tennis ball with spin) the path is <b>non-parabolic</b> — it drops steeply at the end.</p>
<p><b>Free-body diagrams</b>: draw the weight arrow from the centre of mass straight down; air resistance opposite to the direction of travel, sized relative to weight. The resultant force determines the flight.</p>` },
    { h: 'Lift and the Bernoulli principle', html: `
[[d:bernoulli]]
<p><b>Bernoulli principle:</b> the faster a fluid (air) flows, the lower the pressure it exerts. A discus or javelin held at a small <b>angle of attack</b> acts like an <b>aerofoil</b>: air travelling over the top has further to go and moves faster, so pressure above is lower than below. The <b>pressure differential</b> creates an upward <b>lift force</b>, keeping the discus in the air longer and increasing distance. Too great an angle of attack increases drag and the object “stalls”.</p>
<p><b>Downward lift:</b> Formula 1 cars and some racing bikes have inverted aerofoils (wings/spoilers). The air under the wing moves faster → lower pressure below → a <b>downforce</b> that pushes the tyres into the track, increasing the normal reaction and friction so the car can corner faster without skidding.</p>` },
    { h: 'Spin and the Magnus effect', html: `
[[d:magnus]]
<p>A spinning ball drags a thin <b>boundary layer</b> of air round with it. On one side the ball’s surface moves <b>in the same direction</b> as the air flowing past it (air speeds up → <b>lower pressure</b>); on the other side it moves <b>against</b> the airflow (air slows → <b>higher pressure</b>). The pressure differential creates the <b>Magnus force</b> from high to low pressure, and the ball swerves in that direction.</p>
<div class="tbl"><table><tr><th>Spin</th><th>Magnus force</th><th>Flight</th><th>Bounce</th><th>Example</th></tr>
<tr><td><b>Topspin</b> (top of ball rotates forwards)</td><td>downwards</td><td>dips sharply — shorter flight</td><td>skids on, lower and faster; bounces further forward</td><td>tennis topspin forehand, table-tennis loop</td></tr>
<tr><td><b>Backspin</b> (bottom rotates forwards)</td><td>upwards (lift)</td><td>floats — longer flight</td><td>checks, bounces higher and slows or stops</td><td>golf drive and approach shots, tennis slice, snooker screw shot</td></tr>
<tr><td><b>Sidespin</b></td><td>sideways</td><td>curves (hook or slice; swerve)</td><td>kicks sideways</td><td>a curling free kick, a spin bowler’s delivery</td></tr></table></div>` }
  ],
  eqs: [],
  worked: [
    { q: 'Explain how topspin affects the flight of a tennis ball. (4 marks)', s: ['Topspin: the top of the ball rotates forwards, against the oncoming airflow; the bottom rotates with it.', 'Air above the ball slows → higher pressure; air below speeds up → lower pressure (Bernoulli).', 'The pressure differential produces a downward Magnus force.', 'The ball dips sharply, so it can be hit hard yet land in the court, and it skids on quickly after the bounce.'], a: 'Downward Magnus force → dipping flight, fast low bounce.' }
  ],

  cards: [
    ['Three factors affecting projectile distance?', 'Speed, angle and height of release (plus air resistance/lift).'], ['Most important factor?', 'Speed of release.'], ['Optimum angle with equal release and landing heights?', '45°.'], ['Optimum for shot put?', 'Less than 45° (≈ 38–42°) because release is above landing.'],
    ['Parabolic flight?', 'Symmetrical path when weight dominates air resistance (shot put).'], ['Non-parabolic flight?', 'When air resistance is large relative to weight (shuttlecock).'],
    ['Bernoulli principle?', 'Faster-moving air exerts lower pressure.'], ['How does a discus gain lift?', 'Angle of attack → faster air over top → lower pressure above → upward lift.'], ['Downward lift example?', 'F1 inverted wings → downforce → more friction for cornering.'],
    ['Magnus force?', 'Force from high to low pressure caused by a spinning ball’s boundary layer.'], ['Topspin effect?', 'Downward force: dips in flight; fast, low bounce.'], ['Backspin effect?', 'Upward force: longer flight; ball checks on bounce.'], ['Sidespin effect?', 'Ball curves (swerve, hook, slice).']
  ],

    { q: 'A shot putter releases above landing height, so the optimum angle is…', o: ['less than 45°', 'exactly 45°', 'more than 45°', '90°'], x: 'About 38–42°.' },
    { q: 'A shuttlecock follows a non-parabolic path because…', o: ['air resistance is large compared with its weight', 'it has no weight', 'it spins', 'gravity is weaker indoors'], x: 'Drag dominates.' },

<p><b>Drag</b> (fluid friction) is a force that opposes the motion of a body through a fluid — <b>air resistance</b> in air, water resistance in water. Water is about 800 times denser than air, so drag is a far bigger factor in swimming.</p>
<div class="tbl"><table><tr><th>Factor</th><th>Effect</th><th>Example</th></tr>
<tr><td><b>Velocity</b></td><td>drag rises steeply with speed (roughly ∝ v²): double the speed → about four times the drag</td><td>sprint cyclists; downhill skiers</td></tr>

TOPICS.push({
  id: '3.12', unit: '3', area: 'psych', ref: 'Attitudes', title: 'Attitudes', short: 'Triadic model; origins; prejudice and stereotyping; persuasion and cognitive dissonance',
  summary: 'Attitudes decide whether people take up sport, stick with it or drop out. Learn the triadic model (cognitive, affective, behavioural), why attitudes can be inconsistent, where attitudes and prejudices come from, and how coaches can change negative attitudes using persuasive communication and cognitive dissonance.',
  spec: [
    'Attitudes, inconsistencies and prejudices in sporting situations',
    'Components of attitudes: triadic model (cognitive, affective and behavioural), with sporting examples',

    'Attitude change: methods of changing attitudes from negative to positive, e.g. cognitive dissonance and persuasion',

  ],
  learn: [
    { h: 'What is an attitude?', html: `
<p>An <b>attitude</b> is a learned, relatively stable predisposition to respond in a particular way — positively or negatively — towards an <b>attitude object</b> (a person, activity, place or idea), e.g. towards fitness training, a referee, or women’s football.</p>
[[d:triadic]]
<div class="tbl"><table><tr><th>Component</th><th>What it is</th><th>Example: attitude towards swimming</th></tr>
<tr><td><b>Cognitive</b></td><td>beliefs and knowledge</td><td>“Swimming is good for fitness and low impact.”</td></tr>
<tr><td><b>Affective</b></td><td>feelings and emotions</td><td>“I enjoy being in the water.”</td></tr>
<tr><td><b>Behavioural</b></td><td>how the person actually behaves (intentions and actions)</td><td>“I swim twice a week.”</td></tr></table></div>
<p><b>Inconsistency:</b> the components do not always match. Someone may believe exercise is healthy (cognitive) but dislike it (affective) and never do it (behavioural). This is why attitudes are poor predictors of behaviour, and why changing only beliefs (e.g. telling people exercise is healthy) often fails.</p>` },
    { h: 'Where attitudes come from; prejudice and stereotyping', html: `
<p>Attitudes are <b>learned</b> through socialisation and experience:</p>
<ul><li><b>Past experience</b> — enjoyable PE lessons create positive attitudes; being picked last or humiliated creates negative ones.</li>
<li><b>Significant others</b> — parents, peers, teachers and coaches (social learning); family traditions.</li>
<li><b>Media and role models</b>; culture; <b>conditioning</b> (rewards and punishments).</li></ul>
<p><b>Prejudice</b> is a pre-judgement — a fixed, usually negative attitude towards a group, often based on <b>stereotypes</b> (over-simplified, generalised beliefs, e.g. “netball is a girls’ game”). Prejudice can lead to discrimination (see 1.18) and to people avoiding certain activities.</p>` },
    { h: 'Changing attitudes', html: `
<p><b>Persuasive communication</b> (Hovland) — changing someone’s attitude by persuading them. Its effectiveness depends on:</p>
<div class="tbl"><table><tr><th>Factor</th><th>More effective when…</th></tr>
<tr><td><b>The persuader</b></td><td>high status, expert, credible, trustworthy, likeable, similar to the audience (a respected coach, a role model)</td></tr>
<tr><td><b>The message</b></td><td>clear, balanced (both sides), repeated, relevant, backed by evidence</td></tr>
<tr><td><b>The recipient</b></td><td>willing to listen; the attitude is not deeply held; lower self-esteem people are more easily persuaded</td></tr>
<tr><td><b>The situation</b></td><td>relaxed, informal, with others changing too; positive reinforcement follows</td></tr></table></div>
<p><b>Cognitive dissonance</b> (Festinger) — creating <b>conflict</b> between the components of an attitude causes psychological discomfort (dissonance). To remove it, the person changes one component, and the attitude shifts. A coach can:</p>
<ul><li>give <b>new information</b> (cognitive): “You burn more calories playing badminton than you think”;</li>
<li>create <b>enjoyable experiences</b> (affective): fun, success, a friendly group;</li>
<li>encourage <b>new behaviour</b> (behavioural): a taster session, a different role, modified rules.</li></ul>
<p>Dissonance is more effective when the new information comes from a credible source, the person values the issue, the conflict is large enough to cause discomfort, and the new behaviour is rewarded.</p>` }
  ],
  eqs: [],
  worked: [
    { q: 'A teenager says “Gym is boring and I’m no good at it”. Explain how a teacher could use cognitive dissonance to change this attitude. (4 marks)', s: ['Identify the components: affective (“boring”), cognitive (“I’m no good”), behavioural (avoids gym).', 'Create conflict in the cognitive component: show her fitness test improvements or explain the benefits for her netball.', 'Create conflict in the affective component: make sessions enjoyable — music, friends, circuit variety — so she enjoys them.', 'The mismatch between “gym is boring” and her actual enjoyment/success causes dissonance, so she changes her attitude to restore consistency.'], a: 'Create conflict between components; change one to shift the attitude.' }
  ],
  pitfalls: ['Describing the triadic model without a sporting example for each component.', 'Saying attitudes are innate — they are learned.', 'Explaining persuasion without naming the factors (persuader, message, recipient, situation).', 'Confusing prejudice (attitude) with discrimination (action).'],
  cards: [

    { q: '“I love playing hockey” is the ___ component.', o: ['affective', 'cognitive', 'behavioural', 'instrumental'], x: 'Feelings.' },

<div class="tbl"><table><tr><th>Type</th><th>Definition</th><th>Example</th></tr>
<tr><td><b>Hostile (reactive) aggression</b></td><td>behaviour intended to harm another person, often with anger, where harm is the main goal; usually outside the rules</td><td>punching an opponent after a foul</td></tr>
<tr><td><b>Instrumental (channelled) aggression</b></td><td>intent to harm, but as a <b>means to achieve a goal</b> (winning), usually without anger; may be within the rules</td><td>a boxer’s punch; a deliberately hard hit to intimidate a quarterback</td></tr>
<tr><td><b>Assertive behaviour</b></td><td>forceful, goal-directed behaviour <b>within the rules</b> with <b>no intent to harm</b>; uses legitimate force</td><td>a strong, legal rugby tackle; a hard shoulder charge in football</td></tr></table></div>
<p>The key differences are <b>intent</b> (to harm or not) and whether behaviour is <b>within the rules</b>. Coaches want assertion, not aggression.</p>` },
    { h: 'Theories of aggression', html: `
[[d:aggression]]
<div class="tbl"><table><tr><th>Theory</th><th>Key idea</th><th>Criticism</th></tr>
<tr><td><b>Instinct theory</b> (Lorenz, Freud)</td><td>aggression is <b>innate</b> — an instinct that builds up and must be released. Sport offers a socially acceptable release: <b>catharsis</b> (a cleansing of pent-up aggression).</td><td>aggression varies between cultures and individuals (it is learned); sport can increase rather than release aggression; no evidence of a “build-up”</td></tr>
<tr><td><b>Frustration–aggression hypothesis</b> (Dollard)</td><td>frustration (having a goal blocked) <b>always</b> leads to aggression; aggression then releases the frustration (catharsis). If the aggression is punished, frustration increases further.</td><td>frustration does not always cause aggression; aggression can occur without frustration</td></tr>
<tr><td><b>Cue arousal theory</b> (Berkowitz, aggressive-cue hypothesis)</td><td>frustration raises arousal and creates a <b>readiness</b> for aggression, but aggression only occurs if an <b>aggressive cue</b> (trigger) is present — e.g. a hockey stick, a bat, a particular opponent, crowd chants, a violent sport</td><td>more realistic, but cues are hard to predict</td></tr>
<tr><td><b>Social learning theory</b> (Bandura)</td><td>aggression is <b>learned</b> by observing and imitating significant others (role models), especially when their aggression is <b>reinforced</b> (praised, successful, unpunished)</td><td>explains learning well, but not individual differences in reacting to the same models</td></tr></table></div>` },
    { h: 'Causes of aggression', html: `
<ul><li><b>Frustration</b> — losing, poor personal performance, being fouled.</li><li><b>Poor officiating</b> — inconsistent or unfair decisions.</li><li><b>Temperature and discomfort</b> — heat raises arousal and irritability.</li><li><b>A partisan or hostile crowd</b>; local derbies and rivalry; high stakes (a cup final, relegation).</li>
<li><b>Provocation and retaliation</b>; sledging.</li><li><b>Reinforcement</b> — coaches, teammates or media praising aggressive acts; role models behaving aggressively.</li><li>Personality (Type A, low stability), high arousal, alcohol or drugs, the nature of the sport (contact sports provide cues).</li></ul>` },

<div class="grid g2"><div class="box"><b class="lbl">Individual strategies</b><ul><li>cognitive: self-talk, imagery, counting to ten, focusing on the task, thought stopping</li><li>somatic: breathing control, progressive muscular relaxation</li><li>avoid provocative situations and cues; walk away</li><li>positive reinforcement of assertive, non-aggressive behaviour; punishment of aggression (substitution, fines)</li><li>give responsibility (captaincy); positive role models; reward fair play</li></ul></div>

TOPICS.push({

  summary: 'Performing in front of others can lift or sink a performance. Learn how audiences and co-actors facilitate or inhibit performance, Zajonc’s drive theory, evaluation apprehension, distraction–conflict and self-presentation theories, home-field advantage, and strategies to reduce the negative effects of an audience.',

  learn: [
    { h: 'Facilitation and inhibition', html: `
<p><b>Social facilitation</b> is the positive effect of others on performance; <b>social inhibition</b> is the negative effect. The “others” can be:</p>
<ul><li><b>passive others</b> — an <b>audience</b> watching, or <b>co-actors</b> doing the same task at the same time but not competing (e.g. others running on treadmills);</li>

[[d:zajonc]]
<p>The mere presence of others increases <b>arousal</b>, which makes the <b>dominant response</b> more likely (as in drive theory, 1.11):</p>
<ul><li><b>Facilitates:</b> experts (autonomous stage) whose dominant response is correct; simple and gross skills; extroverts.</li>
<li><b>Inhibits:</b> novices (cognitive stage) whose dominant response is likely to be wrong; complex and fine skills; introverts.</li></ul>` },
    { h: 'Other theories', html: `
<div class="tbl"><table><tr><th>Theory</th><th>Key idea</th></tr>
<tr><td><b>Evaluation apprehension</b> (Cottrell)</td><td>it is not mere presence but the performer’s perception that they are being <b>judged</b> that raises arousal and anxiety. An expert audience, a selector or a scout causes more anxiety than a crowd who cannot see or does not understand.</td></tr>
<tr><td><b>Distraction–conflict</b> (Baron)</td><td>an audience is a <b>distraction</b>; the performer experiences <b>conflict</b> between attending to the task and to the audience. This attentional overload raises arousal: it can help simple tasks but harms complex tasks requiring concentration.</td></tr>
<tr><td><b>Self-presentation</b> (Baumeister)</td><td>performers want to present a <b>positive image</b> to others. For confident experts this motivates them to try harder; for those worried about how they look it causes anxiety and self-consciousness, so they focus on appearance rather than the skill — leading to “choking” (e.g. in front of a supportive home crowd in a final).</td></tr></table></div>` },

<p>Teams generally win more at home. Reasons: supportive crowd (social reinforcement, may influence officials), familiarity with the venue and conditions, no travel fatigue, territorial behaviour, routine. However, home crowds can increase <b>evaluation apprehension</b> and self-presentation concerns in high-pressure matches — the <b>home disadvantage</b> in finals and deciding games.</p>` },

<ul><li><b>Familiarisation</b> — train with an audience present, play crowd noise, visit the venue.</li><li><b>Selective attention</b> — focus on relevant cues, block out the crowd.</li><li><b>Stress-management</b> — cognitive (imagery, self-talk, mental rehearsal) and somatic (breathing, PMR) techniques.</li>
<li>Build <b>confidence</b> and skill to the autonomous stage; overlearn skills.</li><li>Reduce evaluation — emphasise process/performance goals rather than outcome; the coach reduces the importance of the result.</li><li>Positive feedback and support from teammates and coach.</li></ul>` }

  summary: 'A team of stars is not always a star team. Learn what makes a group, how teams form (forming, storming, norming, performing), task and social cohesion and their link to productivity, why coordination and motivation losses occur, the Ringelmann effect and social loafing — and what coaches do about them.',

  ],
  learn: [
    { h: 'What makes a group?', html: `
<p>A <b>group</b> is two or more people who <b>interact</b>, are <b>mutually aware</b> of each other and share a <b>common goal</b> and a sense of collective identity. A crowd at a bus stop is not a group; a netball team is.</p>
<p>The specification’s features of a group (the “6 Is”): <b>interaction</b> (communicating and working together), <b>interdependence</b> (relying on each other to succeed), <b>interpersonal relationships</b>, <b>identical norms, goals and values</b>, a shared <b>identity</b> (kit, name, “we”), and a degree of <b>independence</b> — members still have their own roles and contribution.</p>` },
    { h: 'Forming a team: Tuckman', html: `
[[d:tuckman]]
<div class="tbl"><table><tr><th>Stage</th><th>What happens</th></tr>
<tr><td><b>Forming</b></td><td>members get to know each other, assess each other’s abilities, find out whether they belong; polite, dependent on the leader</td></tr>
<tr><td><b>Storming</b></td><td>conflict: members compete for status and roles, challenge the leader; can be the most difficult stage</td></tr>
<tr><td><b>Norming</b></td><td>conflict is resolved, roles and norms are agreed; cohesion and co-operation develop</td></tr>
<tr><td><b>Performing</b></td><td>the team works together towards the goal; roles are clear; energy goes into performance</td></tr></table></div>
<p>(A fifth stage, <b>adjourning</b>, happens when the group breaks up.) Teams can slip back to storming when new players join or results are poor.</p>` },
    { h: 'Cohesion and productivity', html: `
<p><b>Cohesion</b> is the tendency of a group to stick together and remain united in pursuit of its goals (Carron).</p>
<ul><li><b>Task cohesion</b> — members work together to achieve the team’s goals (co-ordinated tactics, shared commitment to winning).</li>
<li><b>Social cohesion</b> — members like each other and enjoy each other’s company.</li></ul>
<p>Task cohesion is more closely linked to success, especially in <b>interactive</b> sports (basketball, netball, football) where players depend on each other. In <b>co-active</b> sports (a golf team, a relay squad of sprinters) task cohesion matters less. Teams with low social cohesion can still win if task cohesion is high; but high social cohesion with low task cohesion (cliques, “just for fun”) can harm performance.</p>
<p><b>Steiner’s model:</b> $"actual productivity" = "potential productivity" − "losses due to faulty processes"$. Potential productivity is what the team could achieve with its members’ abilities; <b>faulty processes</b> are:</p>
<ul><li><b>Coordination losses</b> — poor timing, communication, tactics or understanding between players (e.g. two players going for the same ball).</li>
<li><b>Motivational losses</b> — individuals not giving full effort (social loafing).</li></ul>` },
    { h: 'The Ringelmann effect and social loafing', html: `
[[d:ringelmann]]
<p>The <b>Ringelmann effect</b>: as group size increases, the average performance of each individual decreases (in Ringelmann’s rope-pulling experiment, 8 people pulled less than 8 times one person). Some of the loss is coordination loss, some is motivation loss.</p>
<p><b>Social loafing</b>: individuals reduce their effort when working in a group because their contribution cannot be <b>identified</b> (“hiding in the team”). Causes: low identifiability, lack of confidence (low self-efficacy), belief that others are not trying, low task importance, lack of cohesion, unclear roles, being with low-ability teammates.</p>
<div class="box why"><b class="lbl">Overcoming social loafing</b><ul><li>make individual contributions <b>identifiable</b> and give feedback: stats on tackles made, distance covered (GPS), passes completed;</li><li>give each player a <b>specific role</b> and personal goals;</li><li>praise and reward individual effort (player of the match, credit for “number of tackles made”);</li><li>build cohesion with team-building and shared goals; small groups in training;</li><li>raise self-efficacy; reinforce effort; select players who are motivated.</li></ul></div>` },
    { h: 'Building a cohesive team', html: `
<ul><li>set clear team and individual goals; involve players in setting them;</li><li>team-building activities, social events and shared experiences (training camps);</li><li>keep a stable squad; clear roles; a strong captain and leadership group;</li><li>effective communication; resolve conflicts early; avoid cliques;</li><li>reward team achievement as well as individuals; team identity (kit, rituals, name).</li></ul>` }
  ],
  eqs: [['"actual productivity" = "potential productivity" − "faulty processes"', 'Steiner’s model']],
  worked: [
    { q: 'A rugby coach notices that some forwards appear to “hide” in rucks. Explain the cause and suggest how the coach can overcome it. (4 marks)', s: ['This is <b>social loafing</b> — reduced effort because individual contribution is hard to identify in a large group.', 'The coach can make effort identifiable: use video and GPS to record rucks hit, tackles made and work rate for each player.', 'Give each forward a specific role and personal targets, and give feedback after each match.', 'Praise and reward individual effort (e.g. “work-rate player of the match”), raising motivation and self-efficacy.'], a: 'Social loafing → identify contributions, roles, feedback, rewards.' }
  ],
  pitfalls: ['Confusing coordination losses (organisation) with motivational losses (effort).', 'Saying social cohesion is more important than task cohesion for success.', 'Describing Tuckman’s stages without saying what happens in each.', 'Saying the Ringelmann effect is only about laziness — part of it is coordination loss.'],
  cards: [
    ['Group?', 'Two or more people who interact, are mutually aware and share a common goal/identity.'], ['Tuckman’s stages?', 'Forming, storming, norming, performing (adjourning).'], ['Storming?', 'Conflict over roles and status; challenging the leader.'],

  ],

  id: '3.16', unit: '3', area: 'psych', ref: 'Group Dynamics and Leadership', title: 'Leadership', short: 'Great man theory; Fiedler; prescribed and emergent leaders; autocratic, democratic, laissez-faire; Chelladurai; LSS',

  learn: [
    { h: 'Leaders and how they are chosen', html: `
<ul><li><b>Great man theory</b> — leaders are <b>born, not made</b>; leadership qualities are innate traits (often linked to men from powerful backgrounds). Criticism: it ignores learning and the situation; there is no set of traits that guarantees leadership.</li>
<li><b>Prescribed leader</b> — appointed from <b>outside</b> the group by a higher authority (e.g. a national coach appointed by the WRU). Can bring new ideas, but may lack the group’s respect at first, and can cause conflict.</li>
<li><b>Emergent leader</b> — comes from <b>within</b> the group, chosen by the members or rising naturally (e.g. a captain voted by the team). Already respected and knows the group; may struggle to discipline former peers.</li></ul>
<p>Most sport psychologists accept that leadership skills can be <b>learned</b> (social learning) and that effectiveness depends on the situation.</p>` },
    { h: 'Leadership styles', html: `
<div class="tbl"><table><tr><th>Style</th><th>What it involves</th><th>Works best when…</th><th>Weaknesses</th></tr>
<tr><td><b>Autocratic</b> (task-oriented)</td><td>the leader makes all decisions and gives instructions</td><td>large groups; beginners (cognitive stage); dangerous situations; little time (half-time, a time-out); hostile groups; many members prefer it in team contact sports</td><td>can demotivate experienced players; no ownership; resentment</td></tr>
<tr><td><b>Democratic</b> (person-oriented)</td><td>the leader shares decisions and consults the group</td><td>small groups; experienced, intelligent performers; friendly atmosphere; time available (pre-season planning); individual sports</td><td>slow; can lack direction; not suited to emergencies</td></tr>
<tr><td><b>Laissez-faire</b></td><td>the leader steps back and lets the group make decisions</td><td>highly experienced, motivated, creative groups (elite squads working on tactics)</td><td>lack of direction and structure; group may lose focus; beginners flounder</td></tr></table></div>
<p>The best style depends on <b>the situation</b> (time, danger, size of group, task), the <b>members</b> (age, gender, ability, experience, personality, preferences) and the <b>leader’s own personality</b>.</p>` },
    { h: 'Fiedler’s contingency theory', html: `
[[d:fiedler]]
<p>Leadership effectiveness depends on matching the leader’s style — <b>task-oriented</b> (autocratic) or <b>person-oriented</b> (relationship-focused, democratic) — to how <b>favourable</b> the situation is. Favourableness depends on: leader–member relations (good/poor), task structure (clear/unclear), and the leader’s position power (strong/weak).</p>
<ul><li><b>Highly favourable</b> (good relations, clear task, strong power) or <b>highly unfavourable</b> (poor relations, unclear task, weak power) → a <b>task-oriented</b> leader is most effective.</li>
<li><b>Moderately favourable</b> → a <b>person-oriented</b> leader is most effective.</li></ul>` },
    { h: 'Chelladurai’s multi-dimensional model and the LSS', html: `
[[d:chelladurai]]
<p><b>Antecedents</b> — situational characteristics, leader characteristics and member characteristics — determine three types of leader behaviour:</p>
<ul><li><b>Required behaviour</b> — what the situation demands;</li><li><b>Actual behaviour</b> — what the leader actually does;</li><li><b>Preferred behaviour</b> — what the group members want.</li></ul>
<p>The <b>consequences</b> (performance and member satisfaction) are best when all three are <b>congruent</b> (match). If actual behaviour differs from what is required, performance suffers; if it differs from what members prefer, satisfaction falls.</p>
<p>The <b>Leadership Scale for Sport (LSS)</b> (Chelladurai and Saleh) is a questionnaire measuring five dimensions of coaching behaviour — <b>training and instruction</b>, <b>democratic behaviour</b>, <b>autocratic behaviour</b>, <b>social support</b> and <b>positive feedback</b> — from the athletes’ perception (actual and preferred) or the coach’s own view.</p>` },
    { h: 'Qualities of an effective leader', html: `
<p>Effective communication (with players and fellow coaches), detailed knowledge of the sport, the ability to motivate, empathy, decision-making, confidence, charisma, organisation, adaptability of style, consistency and fairness, leading by example, and good interpersonal skills.</p>` }

  summary: 'The reasons people give for winning and losing shape their future motivation. Learn Weiner’s model (locus of causality and stability), common attribution errors — the self-serving bias, the actor–observer effect and gender differences — and how learned helplessness develops and can be reversed with attributional retraining.',
  spec: [

    'Strategies to overcome learned helplessness: attributional retraining',
    'Interpret graphical representations associated with sport psychology theories'
  ],
  learn: [
    { h: 'Weiner’s model', html: `
[[d:weiner]]
<p><b>Attributions</b> are the reasons we give for the outcome of an event (success or failure). Weiner classified them on two dimensions:</p>
<ul><li><b>Locus of causality</b> — <b>internal</b> (within the performer: ability, effort) or <b>external</b> (outside: task difficulty, luck, the referee, the weather).</li>
<li><b>Stability</b> — <b>stable</b> (fixed, unlikely to change: ability, task difficulty) or <b>unstable</b> (changeable: effort, luck).</li></ul>
<div class="tbl"><table><tr><th></th><th>Internal</th><th>External</th></tr>
<tr><td><b>Stable</b></td><td>ability</td><td>task difficulty (strength of opposition)</td></tr>
<tr><td><b>Unstable</b></td><td>effort</td><td>luck</td></tr></table></div>
<p>Weiner later added <b>controllability</b> (whether the performer can control the cause — effort is controllable; ability, luck and task difficulty are not).</p>
<p><b>Why it matters:</b> attributions affect <b>expectations</b> of future success, <b>motivation</b>, <b>pride and shame</b>. Attributing success to <b>internal, stable</b> causes (ability) builds confidence and expectation of success; attributing failure to <b>external or unstable, controllable</b> causes (effort, luck, tactics) protects self-esteem and keeps motivation.</p>` },

<ul><li><b>Self-serving bias</b> — attributing success to internal factors (“we were brilliant”) and failure to external factors (“the referee cost us”), to protect self-esteem. Common among high achievers (NAch).</li>
<li><b>Actor–observer effect</b> — performers (actors) attribute their own failure to external, situational factors (the pitch, the wind); observers (coaches, spectators) attribute the same failure to internal factors in the performer (lack of ability or effort). This can cause conflict between coach and player. Team members also give different reasons for the same result depending on their role.</li>
<li><b>Gender differences</b> — traditional research suggested males more often attribute success to ability and failure to bad luck, while females more often attribute success to luck or effort and failure to lack of ability — linked to socialisation and lower expectations; recent research shows this is changing.</li></ul>` },
    { h: 'Learned helplessness', html: `
<p><b>Learned helplessness</b> (Dweck) is the belief, acquired through repeated failure, that failure is <b>inevitable</b> and <b>beyond one’s control</b> — “whatever I do, I’ll fail”.</p>
<ul><li><b>Global (general)</b> learned helplessness — believing you are bad at all sports.</li><li><b>Specific</b> learned helplessness — believing you are bad at one skill or sport (“I can’t take penalties”).</li></ul>
<p><b>Causes:</b> repeated failure, especially when attributed to <b>internal, stable, uncontrollable</b> factors (“I’ve no ability”); negative feedback from significant others; comparison with more able peers; being selected last; unrealistic goals.</p>
<p><b>Effects:</b> low self-efficacy, low motivation, NAF behaviour, reduced effort, avoidance of challenge, poor performance, and <b>disaffection and drop-out</b> — a major reason young people stop taking part in sport.</p>` },

<p>Supporting strategies: set realistic, achievable goals (success experiences); positive feedback and praise for effort; use Bandura’s sources of self-efficacy; focus on performance/process goals rather than outcomes; mastery climate; avoid comparison with others; small-sided games and modified activities; point out improvements.</p>` }

<li><b>Decision making</b> (translatory mechanism) — choosing the response and the motor programme.</li>

[[d:whiting]]
<p>Whiting’s model breaks the process into: <b>input data from the display</b> → <b>receptor systems</b> (the senses) → <b>perceptual mechanism</b> (interprets, uses selective attention and memory) → <b>translatory mechanism</b> (decision making) → <b>effector mechanism</b> (sends impulses to the muscles) → <b>muscular system</b> → <b>output data</b> → <b>feedback data</b> (back to the receptor systems and perceptual mechanism).</p>
<p><b>How models help a coach:</b> they show where a performance can break down — e.g. a player who reacts late may have a <b>perception</b> problem (not picking up cues) rather than a <b>decision</b> problem — so the coach can target practice at that stage: cue recognition drills, decision-making games, feedback to refine output.</p>` },

<tr><td><b>Short-term memory (STM)</b> — “working memory”</td><td>limited: about 7 ± 2 items</td><td>about 30 s unless rehearsed</td><td>holds and works on information; compares it with the LTM; decision making happens here</td></tr>

<p><b>Selective attention</b> filters relevant information (the ball, the opponent’s racket) from irrelevant (the crowd), preventing overload of the limited STM and speeding up reactions. It improves with experience, practice, intensity of the stimulus, optimal arousal and cue highlighting by the coach.</p>` },

  learn: [
    { h: 'Reaction, movement and response time', html: `
<p>$"response time" = "reaction time" + "movement time"$</p>
<ul><li><b>Reaction time</b> — the time from the onset of a stimulus to the <b>start</b> of the response (the gun fires → the sprinter starts to push).</li>

[[d:hicks]]
<p><b>Hick’s law</b>: choice reaction time increases as the number of stimulus–response alternatives increases — linearly with the <b>logarithm</b> of the number of choices ($"RT" = a + b × log_2 n$). Going from 1 to 2 choices adds more time than going from 7 to 8.</p>
<p><b>Using it in sport:</b> attackers try to give defenders more choices (disguise, varied serves, dummies) to slow their reactions; defenders reduce their choices by anticipation and by forcing the attacker into limited options (showing them one way).</p>` },
    { h: 'The psychological refractory period (PRP)', html: `
[[d:prp]]
<p>The <b>single-channel hypothesis</b>: the brain can only process one stimulus at a time. If a second stimulus arrives before the first has been processed, the response to the second is <b>delayed</b> — the <b>psychological refractory period</b>. The performer may “freeze”.</p>
<p><b>In sport:</b> a dummy pass, a head fake or a step-over (first stimulus) followed by the real move (second stimulus) makes the defender react late. A ball deflecting off a defender or clipping the net creates a PRP for the receiver.</p>` },
    { h: 'Factors affecting and improving response time', html: `
<div class="grid g2"><div class="box"><b class="lbl">Factors</b><ul><li>number of choices (Hick’s law)</li><li>previous experience; level of skill</li><li><b>anticipation</b> — <b>spatial</b> (predicting <i>where</i>) and <b>temporal</b> (predicting <i>when</i>); wrong anticipation increases response time</li><li>intensity and clarity of the stimulus</li><li>arousal, alertness, fatigue, age, gender, fitness, drugs/alcohol</li><li>the PRP; stimulus–response compatibility</li></ul></div>
<div class="box"><b class="lbl">Improving response time</b><ul><li>practise to make responses autonomous; reaction drills with the actual stimulus</li><li>learn to anticipate — study opponents’ cues and habits (video)</li><li>selective attention to the relevant cue (the gun, the ball)</li><li>mental rehearsal; optimal arousal; warm-up</li><li>improve fitness (speed, power) to cut movement time</li><li>reduce choices by tactics; disguise your own actions to slow opponents</li></ul></div></div>` },
    { h: 'Motor programmes and sub-routines', html: `
<p>A <b>motor programme</b> (executive programme) is a generalised series of movements stored in the <b>LTM</b> that can be retrieved to perform a skill. It is made up of <b>sub-routines</b> — the short, fixed sequences that make up the skill (e.g. a tennis serve: stance → ball toss → backswing → contact → follow-through).</p>
<ul><li>Motor programmes are organised <b>hierarchically</b>: the executive programme at the top, sub-routines below, which can themselves be broken down further.</li>
<li>They are built and strengthened in the LTM through <b>practice</b> (rehearsal) and reinforcement, becoming <b>autonomous</b> — run without conscious thought (open-loop control) — freeing attention for tactics.</li>
<li>Well-learned programmes are stored permanently (you do not forget how to ride a bike).</li></ul>` },
    { h: 'Feedback in information processing', html: `
<p>Feedback types: <b>intrinsic</b> (kinaesthetic, from proprioceptors), <b>extrinsic</b> (from coach, video), <b>knowledge of results</b> (outcome), <b>knowledge of performance</b> (quality of movement) — see 1.15.</p>

  id: '3.20', unit: '3', area: 'soc', ref: 'Ethics and deviance within sport', title: 'Ethics, deviance and doping', short: 'Sportsmanship and gamesmanship; relative and absolute deviance; over- and under-conformity; violence; doping and WADA',
  summary: 'Sport is supposed to be fair — so why do people cheat? Learn sportsmanship and gamesmanship, relative and absolute deviance, under- and over-conformity and Coakley’s sports ethic, the causes of deviance, on-field violence and hooliganism, and doping: why athletes dope, its ethics and implications, and how WADA, testing and biological passports fight it.',
  spec: [
    'Sporting ethics: fair play, sportsmanship and gamesmanship — with examples',
    'Deviance in sport: behaviour at a tangent to the norm; relative and absolute deviance',
    'Types of deviance: under-conformity, over-conformity and Coakley’s sports ethic',
    'Reasons for deviant behaviour: commercialisation, desire to win, sponsorship',
    'On-field and off-field violence and its causes, including hooliganism',
    'Doping: the use of, and reasons for using, illegal performance-enhancing drugs and methods; the ethics of doping and its implications',
