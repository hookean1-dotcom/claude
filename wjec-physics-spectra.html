  ],
  learn: [
    { h: 'X-rays', html: `
<p>In an X-ray tube, electrons are released from a heated filament (<b>thermionic emission</b>) and accelerated through a large pd (tens to ~150 kV) onto a tungsten <b>target</b> anode. They decelerate rapidly, producing a continuous spectrum (braking radiation) plus characteristic lines from electron transitions in the target atoms.</p>
<ul><li>Maximum photon energy = electron kinetic energy = eV, so $λ_{min} = @frac{hc}{eV}$.</li>
<li>Only about 1% of the energy becomes X-rays; the rest heats the target, so tungsten (high melting point) is used, often on a <b>rotating anode</b> with oil cooling.</li>
<li>The tube current controls the <b>intensity</b>; the tube pd controls the photon energy (penetration/“hardness”).</li>
<li>An aluminium filter removes low-energy photons that would be absorbed by the skin without contributing to the image.</li></ul>
<p><b>Nature and properties:</b> X-rays are high-energy EM photons (λ ~ 10<sup>−10</sup>–10<sup>−12</sup> m). They travel in straight lines, are not deflected by fields, penetrate matter (less so for high atomic number and density), ionise, and blacken photographic film / excite fluorescent screens.</p>
<p><b>Diagnosis and therapy:</b> <b>low-energy</b> (tens of keV) X-rays are used for <b>diagnosis</b>, as they are absorbed differently by bone and soft tissue. <b>High-energy</b> (MeV) X-rays are used for <b>therapy</b> — beams aimed from several directions to destroy tumour cells while spreading the dose to healthy tissue.</p>
<h4>Attenuation</h4>
<div class="box eq">$I = I_0@,"exp"(-μx)$ &nbsp; (μ = attenuation coefficient)</div>
[[d:attenuation]]
<p>Bone (higher atomic number, denser) attenuates much more than soft tissue, giving contrast. Soft tissues differ little, so <b>contrast media</b> with high atomic number (barium meal, iodine injected into blood) are used. <p><b>Fluoroscopy</b> produces real-time moving X-ray images (e.g. following a barium meal or guiding a catheter) using an <b>image intensifier</b>, which converts the X-ray image to light, then electrons that are accelerated and focused onto a small bright screen. <b>Digital image receptors</b> (flat-panel detectors) replace film: the image is available immediately, can be processed and stored, and usually needs a lower dose.</p>
<p><b>CT scanning</b>: an X-ray tube and ring of detectors rotate around the patient; a computer reconstructs cross-sectional “slices” and 3-D images — excellent detail, but a higher dose.</p>` },
    { h: 'Ultrasound', html: `
<p>Ultrasound is sound above 20 kHz; medical imaging uses 1–15 MHz. A <b>piezoelectric</b> crystal (e.g. quartz, PZT) vibrates when an alternating pd is applied — generating ultrasound pulses — and produces a pd when struck by returning echoes, so one transducer both sends and receives.</p>
<div class="box eq">$Z = ρc$</div>
<p>Z is the acoustic impedance. At a boundary between tissues, the <b>greater the difference in Z</b>, the greater the fraction reflected and the less transmitted. Similar Z → mostly transmitted. Air–skin: nearly 100% reflected, so a <b>coupling gel</b> (Z close to skin) removes the air layer.</p>
<ul><li><b>A-scan</b> (amplitude): echo amplitude plotted against time; the time delay gives the depth of boundaries (distance = ct/2). Used e.g. to measure the eye.</li>
<li><b>B-scan</b> (brightness): the transducer is moved/swept; echoes shown as bright dots building a 2-D image (e.g. fetal scans).</li></ul>
<p>Ultrasound is non-ionising, cheap and portable, but cannot image through bone or air (e.g. lungs) well.</p>
<div class="box def"><b class="lbl">Doppler ultrasound</b><p>Ultrasound reflected from moving red blood cells is frequency-shifted: $@frac{Δf}{f} = @frac{2v@,"cos"@,θ}{c}$, where θ is the angle between the beam and the blood flow. Used to measure blood flow speed and detect blockages.</p></div>` },
    { h: 'MRI', html: `
<p>Hydrogen nuclei (protons) behave like tiny magnets. In a very strong uniform field (1–3 T, from a superconducting magnet) they <b>precess</b> about the field direction at the <b>Larmor frequency</b>, which is proportional to B (42.6 MHz per tesla for protons).</p>
<ol><li>A radio-frequency pulse at the Larmor frequency tips the protons out of alignment (resonance).</li>
<li>When the pulse stops, the protons relax back, emitting RF signals that are detected.</li>
<li>Relaxation times differ between tissues (e.g. fat, water, tumour), giving contrast.</li>
<li>Gradient coils vary B across the body, so the Larmor frequency identifies the position the signal came from.</li></ol>
<p>The Larmor frequency is $f = 42.6 × 10^6 B$ (Hz, B in tesla): at 1.5 T it is 63.9 MHz.</p>
<div class="tbl"><table><tr><th></th><th>Advantages</th><th>Disadvantages</th></tr><tr><td>X-ray / CT</td><td>quick, cheap (plain X-ray); excellent for bone; CT gives detailed 3-D images</td><td>ionising radiation (CT gives a large dose); poor soft-tissue contrast without contrast media</td></tr><tr><td>Ultrasound</td><td>non-ionising; cheap, portable; real-time; blood-flow studies</td><td>poor through bone and air; lower resolution; operator-dependent</td></tr><tr><td>MRI</td><td>non-ionising; excellent soft-tissue contrast; any slice orientation</td><td>expensive; slow and noisy; claustrophobic; unsuitable with some metal implants / pacemakers</td></tr></table></div>` },
    { h: 'Dosimetry and radionuclide imaging', html: `
<p><b>Effects on living matter:</b> α, β and γ radiations ionise atoms in cells, damaging DNA. This can kill cells (radiation burns, radiation sickness at high doses) or cause mutations leading to cancer. α is the most ionising, so it does the most damage per gray if the source is <b>inside</b> the body, but it cannot penetrate the skin from outside; β and γ penetrate further.</p>
<ul><li><b>Absorbed dose</b> D = energy absorbed per unit mass (gray, Gy = J kg<sup>−1</sup>).</li>
<li><b>Equivalent dose</b> H = D × W<sub>R</sub>, the radiation weighting factor (1 for X, γ, β; 20 for α). Unit: sievert (Sv).</li>
<li><b>Effective dose</b> E = H × W<sub>T</sub>, the tissue weighting factor, which reflects how sensitive each organ is; unit Sv.</li></ul>
<p><b>Tracers</b>: technetium-99m is ideal — pure γ emitter (140 keV, penetrates body but easily detected), half-life 6 h (long enough to image, short enough to limit dose), easily attached to different compounds.</p>
<p><b>Gamma camera</b>: lead collimator (only γ travelling parallel to the holes reach the crystal) → NaI scintillator crystal (γ produces flashes of light) → photomultiplier tubes (or CCD) → computer finds position of each flash → image of tracer distribution.</p>
<p><b>PET</b>: a positron-emitting tracer (e.g. fluorine-18 in glucose) concentrates in active tissue. Each positron annihilates with an electron, producing two 511 keV γ photons travelling in opposite directions. Detectors in a ring record coincident pairs; the source lies on the line joining them. PET is used to detect <b>tumours</b>, which take up the tracer faster than normal tissue.</p>` }

TOPICS.push({
  id: 'C', unit: 'O', title: 'The Physics of Sports', short: 'Rotation, restitution, drag, stability',

  learn: [
    { h: 'Stability and centre of mass', html: `
<p>A body on a base is stable while the vertical line through its centre of mass falls <b>inside</b> its base. If it is tilted so the line falls outside, the weight produces a toppling moment. Stability is increased by a <b>lower</b> centre of mass and a <b>wider</b> base — why wrestlers crouch with feet apart, and a sprinter in the “set” position deliberately moves the centre of mass forward, close to the edge, to start quickly.</p>` },
    { h: 'Rotational dynamics', html: `
<p>Each linear quantity has a rotational analogue:</p>
<div class="tbl"><table><tr><th>Linear</th><th>Rotational</th></tr>
<tr><td>displacement x</td><td>angular displacement θ (rad)</td></tr>
<tr><td>velocity v</td><td>angular velocity ω</td></tr>
<tr><td>acceleration a</td><td>angular acceleration α (rad s<sup>−2</sup>)</td></tr>
<tr><td>mass m</td><td>moment of inertia $I = Σmr^2$ (kg m<sup>2</sup>)</td></tr>
<tr><td>force F = ma</td><td>torque τ = Iα (N m)</td></tr>
<tr><td>E<sub>k</sub> = ½mv²</td><td>E<sub>k</sub> = ½Iω²</td></tr>
<tr><td>momentum p = mv</td><td>angular momentum L = Iω</td></tr></table></div>
<p>The moment of inertia depends on how the mass is distributed: mass further from the axis contributes much more (r²). For a <b>solid sphere</b> $I = @frac{2}{5}mr^2$; for a <b>thin spherical shell</b> $I = @frac{2}{3}mr^2$ (the shell’s mass is all at radius r, so it is larger).</p>
<p><b>Angular acceleration</b> is the rate of change of angular velocity: $α = @frac{ω_2 - ω_1}{t}$, and torque $τ = Iα$.</p>
<div class="box def"><b class="lbl">Conservation of angular momentum</b><p>If no external torque acts, the total angular momentum Iω of a system is constant.</p></div>
<p>A spinning skater who pulls in her arms reduces I, so ω increases. Her rotational KE ½Iω² = L²/2I <b>increases</b>: the extra energy comes from the work her muscles do pulling her arms in. Divers and gymnasts tuck to spin faster and open out to slow down before entry/landing.</p>` },
    { h: 'Collisions: restitution and impulse', html: `
<div class="box def"><b class="lbl">Coefficient of restitution</b><p>$e = @frac{"relative speed of separation"}{"relative speed of approach"}$. e = 1 for a perfectly elastic collision, e = 0 when the bodies stick together.</p></div>
<p>For a ball dropped from height h<sub>1</sub> bouncing to h<sub>2</sub> on a fixed surface: $e = @frac{v_2}{v_1} = @sqrt{@frac{h_2}{h_1}}$.</p>
<p>Newton’s 2nd law in the form $Ft = mv - mu$: <b>following through</b> in golf, tennis or cricket keeps the club/bat in contact longer, giving the ball a greater change of momentum. Catching a ball while drawing the hands back increases Δt and reduces the force.</p>` },
    { h: 'Fluid forces', html: `
<div class="box eq">$F_D = @frac{1}{2}ρC_dAv^2$</div>
<p>Drag increases with the square of speed, with frontal area A and with the drag coefficient C<sub>d</sub> (shape). Cyclists crouch, swimmers wear smooth suits, and at high speed drag power $F_Dv ∝ v^3$ dominates.</p>
<div class="box eq">$p = p_0 - @frac{1}{2}ρv^2$ &nbsp; (Bernoulli)</div>
<p><b>Bernoulli’s equation</b>: where a fluid moves faster relative to a surface, its pressure p is lower than the still-air pressure p₀ by ½ρv². Example: air flowing at 20 m s<sup>−1</sup> over one side of a ball (ρ = 1.2 kg m<sup>−3</sup>) has its pressure reduced by ½ × 1.2 × 20² = 240 Pa. A spinning ball drags air round with it: on one side the air flows faster relative to the ball, on the other side slower. The pressure difference gives a sideways force — the <b>Magnus effect</b> — making the ball swerve (top-spin dips, back-spin lifts, side-spin curves).</p>` },
    { h: 'Moments in the body: muscles as levers', html: `
<p>The principle of moments finds the forces in muscles and joints. In the forearm held horizontally, the <b>elbow</b> is the pivot, the <b>biceps</b> pulls upwards very close to the pivot, and the weight in the hand acts far from it.</p>
<div class="box def"><b class="lbl">Example</b><p>A 40 N weight is held 0.35 m from the elbow; the forearm’s own weight of 15 N acts 0.15 m from the elbow; the biceps is attached 0.040 m from the elbow. Moments about the elbow: F × 0.040 = 40 × 0.35 + 15 × 0.15, so F = 406 N — about ten times the load. Muscles trade force for range of movement.</p></div>
<p>The same method applies to other sports, e.g. the moments of the wind force on a sail and the crew’s weight when a sailor leans out to keep a dinghy upright.</p>` },
    { h: 'Energy and projectiles in sport', html: `
<p>Energy conservation in sport may include <b>rotational</b> kinetic energy as well as linear KE and gravitational and elastic PE. A ball rolling down a slope without slipping shares its lost GPE between both: $mgh = @frac{1}{2}mv^2 + @frac{1}{2}Iω^2$ with v = ωr. For a solid sphere this gives $v = @sqrt{10gh/7}$ — slower than a sliding object.</p>
<p>A pole vaulter converts KE → elastic PE in the pole → GPE. A trampolinist converts GPE → KE → elastic PE of the bed and back.</p>
<p><b>Projectiles</b> (Unit 1 methods): treat horizontal and vertical motion separately — a long-jumper, a shot put or a rugby kick. Ignoring air resistance, maximum range on level ground needs a launch angle of 45°; in practice drag and launch height change the best angle.</p>` }
  ],

TOPICS.push({
  id: 'D', unit: 'O', title: 'Energy and the Environment', short: 'Climate, renewables, nuclear, conduction',
  summary: 'Option D: the Earth’s energy balance and greenhouse effect, sea-level change, renewable and nuclear sources, fuel cells, and thermal conduction in buildings.',
  spec: [
    "(a)(i) Thermal equilibrium: balance between energy from the Sun and energy re-radiated by the Earth; global energy demand and CO₂ levels",
    "(a)(ii) Origin and transmission of solar energy; the Sun’s power spectrum; wavelengths converted into the near infrared in the atmosphere",
    "(a)(iii) Wien’s law and the Stefan–Boltzmann T⁴ law in the context of solar power",
    "(a)(iv) Density and Archimedes’ principle: melting land ice raises sea level, melting icebergs do not",
    "(b) Compare renewable and non-renewable sources in the UK and internationally",
    "(b)(i) Solar: the proton–proton chain; intensity I = P/A and the inverse square law; photovoltaic energy conversions and efficiency",
    "(b)(ii) Wind: power available ½ρAv³; factors affecting turbine efficiency",
    "(b)(iii) Tidal barrages, hydroelectric and pumped storage: Ep → Ek conversions; energy and power calculations; comparison with wind",
    "(b)(iv) Fission: breeding and enrichment. Fusion: the difficulties of sustained fusion power — the fusion triple product",
    "(c) Fuel cell operation and benefits for greenhouse gas emissions",
    "(d) The thermal conduction equation ΔQ/Δt = −AK Δθ/Δx",
    "(e) Effect of insulation; heat loss through parallel surfaces using rate = UAΔθ, including different materials in contact"
  ],
  learn: [
    { h: 'Earth’s energy balance and the greenhouse effect', html: `
<p>The <b>solar constant</b> is the intensity of the Sun’s radiation at the top of Earth’s atmosphere: about 1.36 kW m<sup>−2</sup>. The Earth intercepts it over a disc of area πR² but radiates from its whole surface, 4πR². About 30% is reflected (the <b>albedo</b>).</p>
<p>Balance: $(1 - "albedo") × S × πR^2 = 4πR^2σT^4$ gives T ≈ 255 K. The actual mean surface temperature is about 288 K. The difference is the <b>greenhouse effect</b>.</p>
[[d:greenhouse]]
<p><b>Origin of solar energy:</b> in the Sun’s core, hydrogen nuclei fuse to helium, mainly by the <b>proton–proton chain</b>: overall 4 ¹H → ⁴He + 2e<sup>+</sup> + 2ν<sub>e</sub> + energy (about 26.7 MeV). The energy reaches us as EM radiation through the vacuum of space. At distance d from the Sun, intensity $I = @frac{P}{A} = @frac{P}{4πd^2}$ (inverse square law).</p>
<p>The Sun (≈5800 K, λ<sub>max</sub> ≈ 500 nm by Wien) emits mostly visible and near-IR, which passes through the atmosphere; much of the absorbed short-wavelength energy is converted into <b>near infrared</b> within the atmosphere and at the surface. The Earth (≈288 K) radiates long-wavelength infrared (λ<sub>max</sub> ≈ 10 μm, by Wien’s law). Greenhouse gases (CO<sub>2</sub>, H<sub>2</sub>O, CH<sub>4</sub>) absorb this IR and re-emit it in all directions, including back towards the surface, raising the surface temperature. Increasing their concentration enhances the effect.</p>` },
    { h: 'Sea level', html: `
<ul><li><b>Thermal expansion</b>: warmer oceans expand (currently the larger contribution).</li>
<li><b>Melting land ice</b> (glaciers, Greenland and Antarctic ice sheets) adds water to the oceans.</li>
<li><b>Floating sea ice</b> already displaces its own weight of water (Archimedes’ principle: upthrust = weight of fluid displaced), so when it melts the level is (almost) unchanged.</li></ul>` },
    { h: 'Renewable sources', html: `
<div class="box def"><b class="lbl">Wind</b><p>Kinetic energy of air passing through the swept area A per second: mass per second = ρAv, so $P = @frac{1}{2}ρAv^3$. Doubling wind speed gives 8 × the power. Only a fraction can be extracted, since the air must keep moving. Efficiency depends on blade design and number, the wind speed (turbines cut out in very high winds), friction and generator losses, and turbulence from nearby turbines.</p></div>
<ul><li><b>Hydroelectric</b>: water’s E<sub>p</sub> is converted to E<sub>k</sub> and then electrical energy: P = (mass per second) × gh × efficiency.</li><li><b>Pumped storage</b> (e.g. Dinorwig in Wales): water is pumped uphill when demand is low and released through turbines when demand peaks, responding within seconds.</li>
<li><b>Tidal</b>: a barrage traps water at high tide; energy = ρgAh²/2 per emptying for a basin of area A and tidal range h. Predictable but limited sites.</li>
<li><b>Solar</b>: photovoltaic cells convert light directly to electricity. Efficiency = electrical power out ÷ (intensity × area) × 100%, typically 15–25%. Example: 1.5 m² of panels in 800 W m<sup>−2</sup> sunlight producing 216 W is 18% efficient.</li>
<li><b>Fuel cells</b>: hydrogen and oxygen combine to produce electricity, heat and water directly, with no combustion and no CO<sub>2</sub> at the point of use. The hydrogen must be produced (e.g. by electrolysis) using another energy source.</li></ul>
<p>Many renewables are <b>intermittent</b>, so storage (batteries, pumped storage, hydrogen) and a mix of sources are needed.</p>` },
    { h: 'Nuclear fission and fusion power', html: `
<p><b>Enrichment</b>: natural uranium is 99.3% U-238 and only 0.7% U-235, the isotope that undergoes fission with slow neutrons. Enrichment (e.g. in gas centrifuges, separating by the small mass difference) raises the U-235 fraction to about 3–5% for reactor fuel.</p>
<p><b>Breeding</b>: U-238 can absorb a neutron to form U-239, which β-decays twice to <b>plutonium-239</b> — itself fissile. A breeder reactor makes more fissile fuel than it uses, greatly extending uranium reserves (but Pu-239 raises security concerns).</p>
<p>Fission produces no CO<sub>2</sub> during generation, but long-lived radioactive waste must be stored safely for thousands of years.</p>
<p><b>Fusion</b> (e.g. D–T) is difficult to sustain because the nuclei must overcome their electrostatic repulsion. Three conditions must be met together, summarised by the <b>fusion triple product</b>: plasma density n × temperature T × energy confinement time τ must exceed about 3 × 10<sup>21</sup> keV s m<sup>−3</sup>. That needs temperatures above ~10<sup>8</sup> K (no material container can hold the plasma, so it is confined by magnetic fields in a tokamak such as JET or ITER), high density, and a long enough confinement time — all at once.</p>` },

    { h: 'Thermal conduction and buildings', html: `
<div class="box eq">$@frac{ΔQ}{Δt} = -KA@frac{Δθ}{Δx}$</div>
<p>K is the thermal conductivity (W m<sup>−1</sup> K<sup>−1</sup>); Δθ/Δx is the temperature gradient (the minus sign shows heat flows down the gradient). Metals have large K; still air and foams very small K.</p>
<p>Builders use <b>U-values</b>: rate of heat loss per unit area per unit temperature difference, ΔQ/Δt = UAΔθ (W m<sup>−2</sup> K<sup>−1</sup>). Double glazing, cavity-wall and loft insulation trap still air to reduce U.</p>
<h4>Materials in contact</h4><p>For layers in series (e.g. brick + insulation + plasterboard) the <b>same rate of heat flow</b> passes through every layer in the steady state. So for each layer $ΔQ/Δt = KAΔθ/Δx$ with the temperature drops adding up to the total. The layer with the lowest K/Δx has the largest temperature drop across it.</p><div class="box def"><b class="lbl">Example</b><p>A wall of area 10 m² is 0.10 m brick (K = 0.60) with 0.050 m foam (K = 0.030); inside 20 °C, outside 5 °C. Let the rate be P: brick drop = P × 0.10/(0.60 × 10), foam drop = P × 0.050/(0.030 × 10). Sum = P(0.0167 + 0.167) = 15 K, so P = 82 W.</p></div>` }
  ],
  eqs: [['I = @frac{P}{A} = @frac{P}{4πd^2}', 'solar intensity'], ['P = @frac{1}{2}ρAv^3', 'wind power'], ['P = @frac{m}{t}gh', 'hydro power'], ['@frac{ΔQ}{Δt} = -AK@frac{Δθ}{Δx}', 'conduction'], ['@frac{ΔQ}{Δt} = UAΔθ', 'U-value'], ['(1 - a)Sπ R^2 = 4πR^2σT^4', 'Earth energy balance']],
  worked: [
    { q: 'A wind turbine has blades of length 40 m. Find the power in the wind at 12 m s<sup>−1</sup> (ρ = 1.2 kg m<sup>−3</sup>) and the output at 40% efficiency.', s: ['A = π × 40² = 5030 m².', 'P = ½ × 1.2 × 5030 × 12³ = 5.2 × 10<sup>6</sup> W.', 'Output = 0.40 × 5.2 MW.'], a: '5.2 MW in the wind; 2.1 MW output' },
    { q: 'Estimate the Earth’s temperature without an atmosphere (S = 1360 W m<sup>−2</sup>, albedo 0.30).', s: ['Absorbed per m² of surface (average) = (1 − 0.30) × 1360/4 = 238 W m<sup>−2</sup>.', 'σT⁴ = 238, so T = (238/5.67 × 10<sup>−8</sup>)<sup>¼</sup>.'], a: '≈ 255 K (−18 °C)' },

<div class="box def"><b class="lbl">Vocabulary</b><p><b>Accurate</b>: close to the true value. <b>Precise</b>: readings close to each other (small spread). <b>Resolution</b>: the smallest change an instrument can detect. <b>Repeatable</b>: same result when the same experimenter repeats; <b>reproducible</b>: same result by a different person/method.</p></div>` },

<p>Percentage uncertainty = (absolute uncertainty ÷ value) × 100%.</p>
<div class="box def"><b class="lbl">Example</b><p>Times for 10 swings: 15.2, 15.6, 15.4 s. Mean = 15.4 s, uncertainty = (15.6 − 15.2)/2 = 0.2 s. So T = 1.54 ± 0.02 s (1.3%).</p></div>` },

/* ==========================================================
   Numerical question generators.
   Each returns { q, ans, unit, steps[], sf?, tol? } with fresh values.
   Answers are computed, so every question is self-consistent.
   ========================================================== */
const GEN = {};
const s3 = x => sf(x, 3), s2 = x => sf(x, 2);
const deg = Math.PI / 180;
const g = 9.81;

/* ---------- 1.1 ---------- */
GEN.vecres = () => { const a = rnd(3, 15, 1), b = rnd(4, 20, 1), R = Math.hypot(a, b);
  return { q: `Forces of ${a}.0 N east and ${b}.0 N north act on an object. Calculate the magnitude of the resultant force.`, ans: R, unit: 'N', steps: [`Perpendicular forces: $R = @sqrt{${a}^2 + ${b}^2}$`, `$R = ${s3(R)} "N"$ (at ${s3(Math.atan2(b, a) / deg)}° north of east)`] }; };
GEN.moments1 = () => { const F = rnd(10, 60, 5), d1 = rnd(0.2, 0.8, 0.05), d2 = rnd(0.3, 0.9, 0.05), W = F * d1 / d2;
  return { q: `A light beam is pivoted at its centre. A ${F} N weight hangs ${d1.toFixed(2)} m to the left of the pivot. What weight must hang ${d2.toFixed(2)} m to the right for balance?`, ans: W, unit: 'N', steps: ['Principle of moments: clockwise = anticlockwise', `$W × ${d2.toFixed(2)} = ${F} × ${d1.toFixed(2)}$`, `$W = ${s3(W)} "N"$`] }; };
GEN.density1 = () => { const s = rnd(1.5, 4.0, 0.5), m = rnd(20, 200, 5), V = s ** 3, rho = m / V * 1000;
  return { q: `A cube of side ${s.toFixed(1)} cm has mass ${m} g. Calculate its density in kg m<sup>−3</sup>.`, ans: rho, unit: 'kg m<sup>−3</sup>', steps: [`$V = ${s.toFixed(1)}^3 = ${s3(V)} "cm"^3 = ${s3(V * 1e-6)} "m"^3$`, `$ρ = m/V = ${m / 1000} / ${s3(V * 1e-6)}$`, `$ρ = ${s3(rho)} "kg m"^{-3}$`] }; };

/* ---------- 1.2 ---------- */
GEN.suvat1 = () => { const u = rnd(10, 35, 1), x = rnd(Math.ceil(u * u / 16 / 5) * 5, Math.max(Math.ceil(u * u / 16 / 5) * 5, Math.floor(u * u / 5 / 5) * 5), 5), a = u * u / (2 * x);
  return { q: `A car travelling at ${u} m s<sup>−1</sup> brakes uniformly to rest in ${x} m. Calculate the magnitude of its deceleration.`, ans: a, unit: 'm s<sup>−2</sup>', steps: ['$v^2 = u^2 + 2ax$ with v = 0', `$0 = ${u}^2 + 2a(${x})$`, `$a = -${s3(a)} "m s"^{-2}$, deceleration ${s3(a)} m s<sup>−2</sup>`] }; };

  return { q: `A stone is dropped from rest from a height of ${h} m. How long does it take to reach the ground? (Ignore air resistance.)`, ans: t, unit: 's', steps: ['$x = ut + @frac{1}{2}at^2$ with u = 0', `$${h} = @frac{1}{2}(9.81)t^2$`, `$t = @sqrt{2 × ${h}/9.81} = ${s3(t)} "s"$`] }; };
GEN.proj1 = () => { const u = rnd(8, 25, 1), H = rnd(10, 50, 5), t = Math.sqrt(2 * H / g), R = u * t;
  return { q: `A ball is thrown horizontally at ${u} m s<sup>−1</sup> from the top of a ${H} m high cliff. How far from the foot of the cliff does it land?`, ans: R, unit: 'm', steps: [`Vertical: $${H} = @frac{1}{2}(9.81)t^2$ → t = ${s3(t)} s`, `Horizontal (constant velocity): $x = ${u} × ${s3(t)}$`, `$x = ${s3(R)} "m"$`] }; };

/* ---------- 1.3 ---------- */
GEN.mom1 = () => { const m1 = rnd(1, 5, 0.5), u1 = rnd(2, 8, 0.5), m2 = rnd(1, 5, 0.5), v = m1 * u1 / (m1 + m2);

GEN.mom2 = () => { const m = rnd(40, 450, 10), u = rnd(10, 40, 1), v = rnd(10, 50, 1), t = rnd(2, 10, 1), F = m / 1000 * (u + v) / (t / 1000);
  return { q: `A ${m} g ball arrives at ${u} m s<sup>−1</sup> and rebounds at ${v} m s<sup>−1</sup> in the opposite direction. Contact lasts ${t} ms. Calculate the mean force.`, ans: F, unit: 'N', steps: [`$Δp = ${m / 1000} × (${v} - (-${u})) = ${s3(m / 1000 * (u + v))} "kg m s"^{-1}$`, `$F = Δp/Δt = ${s3(m / 1000 * (u + v))} / ${t / 1000}$`, `$F = ${s3(F)} "N"$`] }; };

GEN.eff1 = () => { const m = rnd(20, 120, 5), h = rnd(3, 20, 1), t = rnd(5, 30, 1), Pin = rnd(300, 1500, 50), Pu = m * g * h / t, e = Pu / Pin * 100;

/* ==========================================================
   Simulation framework + Unit 1 & 2 simulations
   ========================================================== */
const SIMS = {};
let simTheme = null;
function refreshSimTheme() { simTheme = themeColors(); }

/* ---- canvas helpers ---- */
const CV = {
  line(c, x1, y1, x2, y2, col, w = 1.5, dash) { c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]); },
  arrow(c, x1, y1, x2, y2, col, w = 2, hs = 9) {
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 1) return; const a = Math.atan2(y2 - y1, x2 - x1);
    CV.line(c, x1, y1, x2 - Math.cos(a) * hs * .6, y2 - Math.sin(a) * hs * .6, col, w);
    c.fillStyle = col; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(a - .42), y2 - hs * Math.sin(a - .42)); c.lineTo(x2 - hs * Math.cos(a + .42), y2 - hs * Math.sin(a + .42)); c.closePath(); c.fill();
  },
  text(c, s, x, y, col, size = 12, align = 'left', weight = 500, font = 'IBM Plex Sans, system-ui, sans-serif') { c.fillStyle = col; c.font = `${weight} ${size}px ${font}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); },
  mono(c, s, x, y, col, size = 12, align = 'left') { CV.text(c, s, x, y, col, size, align, 500, 'IBM Plex Mono, ui-monospace, monospace'); },
  circle(c, x, y, r, fill, stroke, w = 1.5) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = w; c.stroke(); } },
  rrect(c, x, y, w, h, r, fill, stroke, lw = 1.5) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } },
  grid(c, w, h, C, step = 24) { c.strokeStyle = C.grid; c.lineWidth = 1; c.beginPath(); for (let x = 0; x <= w; x += step) { c.moveTo(x + .5, 0); c.lineTo(x + .5, h); } for (let y = 0; y <= h; y += step) { c.moveTo(0, y + .5); c.lineTo(w, y + .5); } c.stroke(); },
  /* mini plot: box {x,y,w,h}, ranges, series [{pts|f, col, w, dash}] */
  plot(c, C, b, o) {
    const { x, y, w, h } = b, [x0, x1] = o.xr, [y0, y1] = o.yr;
    const X = v => x + (v - x0) / (x1 - x0) * w, Y = v => y + h - (v - y0) / (y1 - y0) * h;
    CV.rrect(c, x - 8, y - 8, w + 16, h + 26, 8, C.surface, C.line, 1);
    c.save(); c.beginPath(); c.rect(x, y - 2, w, h + 4); c.clip();
    (o.fills || []).forEach(f => { c.fillStyle = f.col; c.beginPath(); c.moveTo(X(f.pts[0][0]), Y(0)); f.pts.forEach(p => c.lineTo(X(p[0]), Y(p[1]))); c.lineTo(X(f.pts[f.pts.length - 1][0]), Y(0)); c.fill(); });
    (o.series || []).forEach(s => {
      c.strokeStyle = s.col; c.lineWidth = s.w || 2; c.setLineDash(s.dash || []); c.beginPath(); let pen = false;
      if (s.f) { for (let i = 0; i <= 200; i++) { const xv = x0 + (x1 - x0) * i / 200, yv = s.f(xv); if (!isFinite(yv)) { pen = false; continue; } pen ? c.lineTo(X(xv), Y(yv)) : c.moveTo(X(xv), Y(yv)); pen = true; } }
      else s.pts.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])));
      c.stroke(); c.setLineDash([]);
    });
    (o.dots || []).forEach(d => CV.circle(c, X(d[0]), Y(d[1]), d[3] || 4.5, d[2] || C.accent));
    c.restore();
    const ay = (y0 < 0 && y1 > 0) ? Y(0) : y + h;
    CV.line(c, x, ay, x + w, ay, C.ink, 1.2); CV.line(c, x, y, x, y + h, C.ink, 1.2);
    if (o.xl) CV.text(c, o.xl, x + w, y + h + 10, C.muted, 10.5, 'right');
    if (o.yl) CV.text(c, o.yl, x + 4, y + 4, C.muted, 10.5, 'left');
    return { X, Y };
  }
};
function hexA(col, a) { // accepts #rrggbb or rgb(...) → rgba
  if (!col) return `rgba(0,0,0,${a})`;
  if (col.startsWith('#')) { const n = parseInt(col.slice(1).length === 3 ? col.slice(1).split('').map(x => x + x).join('') : col.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
  return col.replace('rgb(', 'rgba(').replace(')', `,${a})`);
}

function mountSim(host, key) {
  const def = SIMS[key]; if (!def) { host.innerHTML = '<div class="empty">Simulation unavailable.</div>'; return () => { }; }
  refreshSimTheme();
  const st = { t: 0, run: def.autoplay !== false, p: {}, key };

  const cv = $('canvas', host), stage = $('.sim-stage', host), c = cv.getContext('2d');
  let W = 0, H = 0;
  const size = () => { const r = stage.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); st.W = W; st.H = H; def.resize && def.resize(st); };

      <div style="text-align:center;margin-top:16px" class="big-prompt" aria-live="polite">${nm}</div></div>
      <div class="sim-ctl"><div class="sim-title">Particle Forge</div>
      <div class="readouts"><div class="ro"><span>Charge</span><b>${slot.length ? fr(q) + ' e' : '—'}</b></div><div class="ro"><span>Baryon number</span><b>${slot.length ? fr(b) : '—'}</b></div><div class="ro"><span>Quarks</span><b>${nq}</b></div><div class="ro"><span>Antiquarks</span><b>${na}</b></div></div>
      <div class="card flat" style="padding:14px"><div class="eyebrow">Challenge ${ci + 1}/${chal.length} · score ${score}</div><p style="margin:8px 0 10px;font-weight:600">Build a valid hadron with ${chal[ci][0]}</p><button class="btn sm primary" data-check="1">Check</button></div>

    let score = 0, streak = 0, left = total, cur = null, answered = 0, right = 0;
    const next = () => { const item = pick(bank); const others = shuffle(bank.filter(b => b[1] !== item[1])).slice(0, 3); cur = { item, opts: shuffle([item, ...others]) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Streak', streak], ['Time', Math.ceil(left) + 's']])}<div class="timer"><i style="width:${left / total * 100}%"></i></div>

        <div class="opts">${cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${id === 'sprint' ? o[1] : M(o[1])}</span></button>`).join('')}</div><p class="kbd-hint">Keys 1–4 to answer.</p></div>`;
      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => { if (!alive) return; answered++; const ok = cur.opts[i] === cur.item; const btn = $$('.opt', host)[i]; if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btn.classList.add('right'); } else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btn.classList.add('wrong'); $$('.opt', host)[cur.opts.indexOf(cur.item)].classList.add('right'); } setTimeout(() => alive && left > 0 && next(), ok ? 250 : 900); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= 4 && !$('.opt.right', host)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();

      $('#mg-go', host).onclick = () => { const L = Math.log10(q[1]), g0 = +inp.value, d = Math.min(Math.abs(g0 - Math.floor(L)), Math.abs(g0 - Math.round(L))), pts = d === 0 ? 10 : d === 1 ? 6 : d === 2 ? 2 : 0; score += pts; (pts >= 6 ? sfx.good : sfx.bad)();
        $('#mg-fb', host).innerHTML = `<div class="explain" style="margin-top:14px"><b class="v ${pts >= 6 ? 'good' : 'bad'}">${pts ? '+' + pts : 'Off by ' + d}</b> Actual value: <span class="m">${sf(q[1], 3)}</span> ${q[2]} — order of magnitude <span class="m">10<sup>${String(Math.round(L)).replace('-', '−')}</sup></span></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="mg-next">${i < 9 ? 'Next' : 'Finish'}</button></div>`;

const ucol = uid => unitOf(uid)?.css || 'var(--accent)';

function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100;
  const ck = t.cards.length ? Object.values(s.cards).filter(b => b >= 3).length / t.cards.length : 0;
  const sp = t.spec.reduce((a, _, i) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / t.spec.length;
  const calc = t.gens.length ? Math.min(s.calc || 0, 5) / 5 : q;
  return clamp(0.4 * q + 0.2 * ck + 0.2 * sp + 0.2 * calc, 0, 1);
}
const pct = x => Math.round(x * 100) + '%';
const unitMastery = uid => { const ts = unitTopics(uid); return ts.reduce((a, t) => a + mastery(t), 0) / ts.length; };

  function drawSpectrum(cv) {

  /* ---------- Quiz engine (also used by mock exam & daily challenge) ---------- */
  function runQuiz(host, items, o = {}) {
    const exam = o.mode === 'exam';
    const qs = items.map(it => it.type === 'num' ? it : { ...it, type: 'mcq', order: shuffle(it.o.map((_, i) => i)) });
    let i = 0, res = [], t0 = Date.now(), tick = null;
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${q.topic}</a>` : ''}${o.timeLimit ? '<span class="pill warn mono" id="qtimer"></span>' : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : exam ? 'cur' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.type === 'num' ? q.q : q.q)}</div>
        ${q.type === 'mcq' ? `<div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p>`
          : `<div class="calc-in"><input id="numin" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5e-3" aria-label="Your answer"><span class="unit">${q.unit || ''}</span><button class="btn primary" id="numgo">Submit</button></div><p class="kbd-hint">Give 2–3 significant figures. Use e for powers of ten, e.g. 6.6e-34.</p>`}
        <div id="fb"></div>`;
      if (q.type === 'mcq') $$('.opt', host).forEach(b => b.onclick = () => answer(+b.dataset.k));
      else { const inp = $('#numin'); inp.focus(); $('#numgo').onclick = () => answer(inp.value); inp.onkeydown = e => { if (e.key === 'Enter') answer(inp.value); }; }
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i) return;
      let ok, given;
      if (q.type === 'mcq') { ok = q.order[k] === 0; given = k; } else { const v = parseNum(k); if (!isFinite(v)) { toast('Enter a number, e.g. 3.2e-5'); return; } ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * (q.tol || 0.02) + 1e-12; given = v; }
      res.push({ ok, given, q }); (ok ? sfx.good : sfx.bad)();
      if (exam) { i++; render(); return; }
      if (q.type === 'mcq') { $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); }); }
      else { $('#numin').disabled = true; $('#numgo').disabled = true; }
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${q.type === 'num' ? `Answer: <b>${sf(q.ans, 3)}</b> ${q.unit}<div class="steps"><b class="small">Solution</b><ol>${q.steps.map(x => `<li>${rich(x)}</li>`).join('')}</ol></div>` : rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      clearInterval(tick); removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100), secs = Math.round((Date.now() - t0) / 1000);
      if (p === 100) { burst(); sfx.win(); }
      const byTopic = {}; res.forEach(r => { const k = r.q.topic || '—'; byTopic[k] ??= [0, 0]; byTopic[k][1]++; if (r.ok) byTopic[k][0]++; });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete · ${Math.floor(secs / 60)}m ${secs % 60}s</div><div class="big">${p}%</div><p class="lede" style="margin:6px auto 0">${correct} of ${qs.length} correct${p >= 80 ? ' — excellent.' : p >= 50 ? ' — good progress.' : ' — revisit the notes and try again.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>
        ${Object.keys(byTopic).length > 1 ? `<div class="sec"><div class="eyebrow">By topic</div><div class="grid gauto" style="margin-top:10px">${Object.entries(byTopic).map(([k, [a, b]]) => `<a class="tcard" href="#/t/${k}" style="--uc:${TOPIC[k] ? ucol(TOPIC[k].unit) : 'var(--accent)'}"><span class="no" style="font-size:22px">${k}</span><span class="tt">${TOPIC[k] ? esc(TOPIC[k].title) : ''}</span><span class="ts">${a}/${b} correct</span></a>`).join('')}</div></div>` : ''}
        <div class="sec"><div class="eyebrow">Review</div>${res.map((r, j) => `<div class="explain" style="margin-top:10px"><b class="v ${r.ok ? 'good' : 'bad'}">${j + 1}. ${r.ok ? '✓' : '✗'}</b> ${rich(r.q.q)}<div class="small" style="margin-top:6px">${r.q.type === 'mcq' ? `<b>Answer:</b> ${rich(r.q.o[0])}${r.ok ? '' : ` · <span style="color:var(--bad)">you chose: ${rich(r.q.o[r.q.order[r.given]])}</span>`}${r.q.x ? `<br><span class="muted">${rich(r.q.x)}</span>` : ''}` : `<b>Answer:</b> ${sf(r.q.ans, 3)} ${r.q.unit} · you gave ${sf(r.given, 3)}`}</div></div>`).join('')}</div>`;
      $('#retry').onclick = () => { o.retry ? o.retry() : runQuiz(host, items, o); };
      S.stats.quizzes++; if (p === 100) S.stats.perfect++; save();
      o.onDone && o.onDone({ correct, total: qs.length, p, res });
      checkBadges();
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const q = qs[i]; if (!q) return;
      if (res.length > i && e.key === 'Enter') { $('#nextq')?.click(); return; }
      if (q.type === 'mcq' && res.length <= i) { const k = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (k != null && k < q.o.length) answer(k); } };
    addEventListener('keydown', key);
    if (o.timeLimit) { const end = Date.now() + o.timeLimit * 1000; tick = setInterval(() => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = $('#qtimer'); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (!document.body.contains(host)) clearInterval(tick); if (left <= 0) { while (res.length < qs.length) res.push({ ok: false, given: null, q: qs[res.length] }); i = qs.length; finish(); } }, 500); }
    const prevCleanup = cleanup; cleanup = () => { clearInterval(tick); removeEventListener('keydown', key); prevCleanup && prevCleanup(); };
    render();
  }

    crumbs('<b>Practicals</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(34px,5vw,54px)">Specified practicals</h1><p class="lede">Method, analysis and examiner tips for the specified practical work. Practical skills are examined in the written papers and in the Unit 5 practical examination.</p>
      ${['1', '2', '3', '4'].map(uid => { const u = unitOf(uid); return `<div class="sec" style="--uc:${u.css}"><div class="sec-head"><h2 class="h3" style="color:${u.css}">${u.code}</h2><span class="muted">${esc(u.name)}</span></div>${PRACTICALS.filter(p => p.unit === uid).map(p => `<details class="prac"><summary><span class="pno">${p.topic}</span><span><b>${esc(p.title)}</b><br><span class="small muted">${esc(p.aim)}</span></span>${ICON.chev}</summary><div class="pb"><h5>Method</h5><ol>${p.method.map(m => `<li>${rich(m)}</li>`).join('')}</ol><h5>Analysis</h5><p style="margin:0">${rich(p.analysis)}</p><h5>Examiner tips</h5><ul>${p.tips.map(m => `<li>${rich(m)}</li>`).join('')}</ul><div style="margin-top:12px"><a class="btn sm" href="#/t/${p.topic}">Open topic ${p.topic}</a></div></div></details>`).join('')}</div>`; }).join('')}
      <div class="card flat sec"><div class="eyebrow">Unit 5 · Practical examination (10% of A level)</div><p style="margin:8px 0 0">Two externally marked tasks in the spring term of the second year: an <b>Experimental Task</b> (25 marks, 90 minutes — carry out an experiment with the apparatus provided) and a <b>Practical Analysis Task</b> (25 marks, 60 minutes — analyse experimental data you are given). WJEC releases the main topic areas for both tasks to centres early in the spring term each year.</p></div>
      <div class="note-strip">These are the specified practicals listed in the WJEC specification (keep a record of each in your lab book). Your centre may use different apparatus.</div>`;
  }

  /* ---------- ARCADE ---------- */
  function arcade() {
    crumbs('<b>Arcade</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(34px,5vw,54px)">Arcade</h1><p class="lede">Short, replayable games for the things that need to become automatic: units, equations, estimates and quick recall.</p>
      <div class="grid g3 sec">${Object.entries(GAMES).map(([id, g]) => `<a class="game-card" href="#/game/${id}"><div class="art"><canvas data-art="${id}"></canvas></div><div class="row" style="justify-content:space-between"><span class="eyebrow">${g.skill}</span><span class="pill">${S.games[id] ? 'best ' + S.games[id].best : 'new'}</span></div><div class="h3">${g.title}</div><p class="small muted" style="margin:0">${g.blurb}</p></a>`).join('')}
      <a class="game-card" href="#/daily"><div class="art" style="display:grid;place-items:center"><span style="font:800 44px var(--f-display);color:#FFB547">${new Date().getDate()}</span></div><div class="row" style="justify-content:space-between"><span class="eyebrow">Daily</span><span class="pill">${S.daily[today()] != null ? S.daily[today()] + '/5 today' : 'not played'}</span></div><div class="h3">Daily challenge</div><p class="small muted" style="margin:0">Five questions from across the course, the same for everyone today.</p></a></div>`;
    $$('[data-art]').forEach(cv => drawGameArt(cv, cv.dataset.art));
  }

  function daily() {
    crumbs('<a href="#/arcade" style="color:inherit">Arcade</a> / <b>Daily challenge</b>');
    let seed = +today().replace(/-/g, ''); const rng = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const pool = CORE.flatMap(t => t.quiz.map(q => ({ ...q, topic: t.id }))); const items = []; while (items.length < 5) { const q = pool[Math.floor(rng() * pool.length)]; if (!items.includes(q)) items.push(q); }
    V().innerHTML = `<div class="quiz-wrap" style="margin:0 auto"><h1 class="display" style="font-size:40px;margin-bottom:6px">Daily challenge</h1><p class="muted">${new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}</p><div id="qz" style="margin-top:18px"></div></div>`;
    runQuiz($('#qz'), items, { title: 'Daily', back: '#/home', onDone: r => { const first = S.daily[today()] == null; S.daily[today()] = Math.max(S.daily[today()] || 0, r.correct); save(); if (first) addXP(r.correct * 12 + 10, 'Daily challenge'); } });
  }

  /* ---------- MOCK EXAM ---------- */
  function mock() {
    crumbs('<b>Mock exam</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(34px,5vw,54px)">Mock exam</h1><p class="lede">A timed, mixed paper with no feedback until the end — like the real thing. Multiple-choice checks recall; calculations use fresh numbers every time.</p>
      <div class="card sec" style="max-width:720px"><form id="mockf" class="stack"><div><div class="eyebrow" style="margin-bottom:8px">Units</div><div class="row">${UNITS.filter(u => u.id !== 'S').map(u => `<label class="pill" style="cursor:pointer;padding:6px 12px"><input type="checkbox" name="u" value="${u.id}" ${u.id === '1' || u.id === '2' ? 'checked' : ''}> ${u.code}</label>`).join('')}</div></div>
      <div class="grid g3"><div><label class="eyebrow" for="mq">Questions</label><select id="mq" style="width:100%;margin-top:6px"><option>10</option><option selected>20</option><option>30</option></select></div><div><label class="eyebrow" for="mc">Calculations</label><select id="mc" style="width:100%;margin-top:6px"><option value="0.3" selected>30%</option><option value="0.5">50%</option><option value="0">None</option></select></div><div><label class="eyebrow" for="mt">Time</label><select id="mt" style="width:100%;margin-top:6px"><option value="75" selected>75 s per question</option><option value="45">45 s per question</option><option value="0">Untimed</option></select></div></div>
      <div><button class="btn primary" type="submit">${ICON.clock} Start mock exam</button></div></form></div>
      ${S.mocks?.length ? `<div class="sec"><div class="eyebrow">Recent results</div><div class="row" style="margin-top:8px">${S.mocks.slice(-8).reverse().map(m => `<span class="pill ${m.p >= 70 ? 'good' : m.p >= 40 ? 'warn' : 'bad'}">${m.d} · ${m.u} · ${m.p}%</span>`).join('')}</div></div>` : ''}`;
    $('#mockf').onsubmit = e => { e.preventDefault(); const us = $$('input[name=u]:checked').map(x => x.value); if (!us.length) { toast('Choose at least one unit'); return; }
      const n = +$('#mq').value, cf = +$('#mc').value, tl = +$('#mt').value, ts = TOPICS.filter(t => us.includes(t.unit));
      const nCalc = Math.round(n * cf), calcTopics = ts.filter(t => t.gens.length);
      const calcs = Array.from({ length: calcTopics.length ? nCalc : 0 }, () => { const t = pick(calcTopics); return { type: 'num', ...GEN[pick(t.gens)](), topic: t.id }; });
      const mcqs = shuffle(ts.flatMap(t => t.quiz.map(q => ({ ...q, topic: t.id })))).slice(0, n - calcs.length);
      const items = shuffle([...mcqs, ...calcs]);
      V().innerHTML = '<div class="quiz-wrap" style="margin:0 auto" id="qz"></div>';
      runQuiz($('#qz'), items, { mode: 'exam', title: 'Mock exam', timeLimit: tl ? tl * items.length : 0, back: '#/mock', retry: () => mock(), onDone: r => { S.stats.mocks++; S.mocks ??= []; S.mocks.push({ d: today(), u: us.map(x => x === 'O' ? 'Opt' : 'U' + x).join('+'), p: r.p }); save(); addXP(r.correct * 12, 'Mock exam'); } });
    };
  }

  /* ---------- PROGRESS ---------- */
  function progress() {
    crumbs('<b>Progress</b>');
    const L = level(), days = Array.from({ length: 14 }, (_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5); const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); return [d, S.days[k] || 0]; });
    const mx = Math.max(50, ...days.map(d => d[1]));
    const chart = `<svg viewBox="0 0 560 170" width="100%" role="img" aria-label="XP earned over the last 14 days" style="max-width:100%">${[0, .5, 1].map(f => `<line x1="34" x2="556" y1="${140 - f * 120}" y2="${140 - f * 120}" stroke="var(--line)" stroke-width="1"/><text x="28" y="${144 - f * 120}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${Math.round(mx * f)}</text>`).join('')}${days.map(([d, v], i) => { const hh = v / mx * 120; return `<rect x="${40 + i * 37}" y="${140 - hh}" width="26" height="${Math.max(hh, 1)}" rx="4" fill="${i === 13 ? 'var(--accent)' : 'var(--u4)'}" opacity="${v ? 1 : .25}"><title>${v} XP</title></rect><text x="${53 + i * 37}" y="158" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${d.getDate()}</text>`; }).join('')}</svg>`;
    V().innerHTML = `<h1 class="display" style="font-size:clamp(34px,5vw,54px)">Progress</h1>
      <div class="grid g4 sec">${[['Level', L.l, L.name], ['Total XP', S.xp, `${Math.max(0, Math.round(L.next - S.xp))} to next level`], ['Streak', S.streak.n || 0, 'days in a row'], ['Lines lit', CORE.filter(t => mastery(t) >= .7).length + '/' + CORE.length, 'topics at 70%+']].map(([a, b, c]) => `<div class="card"><div class="eyebrow">${a}</div><div style="font:800 44px/1.05 var(--f-display);margin-top:6px">${b}</div><div class="small muted">${c}</div></div>`).join('')}</div>
      <div class="grid g2 sec" style="align-items:start"><div class="card"><div class="eyebrow">XP · last 14 days</div><div style="margin-top:10px">${chart}</div></div>
      <div class="card"><div class="eyebrow">Topic mastery</div><p class="small muted" style="margin:6px 0 10px">Each tile is a topic. Brighter = stronger.</p><div class="heat">${TOPICS.map(t => { const m = mastery(t); return `<a href="#/t/${t.id}" title="${esc(t.title)}: ${pct(m)}" style="background:color-mix(in srgb, ${ucol(t.unit)} ${Math.round(8 + m * 80)}%, var(--surface));${m > .5 ? 'color:#fff;border-color:transparent' : ''}">${t.id}</a>`; }).join('')}</div></div></div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Badges</h2><span class="muted">${S.badges.length} of ${BADGES.length} earned</span></div><div class="badge-grid">${BADGES.map(([id, n, d, , ic]) => `<div class="badge ${S.badges.includes(id) ? 'got' : ''}"><div class="ic">${ic}</div><b>${n}</b><span>${d}</span></div>`).join('')}</div></div>
      <div class="sec grid g3">${[['Quizzes finished', S.stats.quizzes], ['Calculations correct', S.stats.calcOK], ['Flashcards reviewed', S.stats.cardsSeen], ['Simulations tried', S.stats.sims.length], ['Mock exams', S.stats.mocks], ['Exam marks self-assessed', S.stats.examMarks]].map(([a, b]) => `<div class="card flat row" style="justify-content:space-between"><span>${a}</span><b class="mono" style="font-size:20px">${b}</b></div>`).join('')}</div>
      <div class="sec card flat"><div class="eyebrow">Your data</div><p class="small muted">Progress is stored only in this browser. You can copy it as a backup and paste it back later, or on another device.</p><div class="row"><button class="btn sm" id="exp">Copy backup</button><button class="btn sm" id="imp">Restore from backup</button><button class="btn sm" id="rst" style="color:var(--bad)">Reset all progress</button></div><div id="datazone"></div></div>`;
    $('#exp').onclick = () => { const txt = JSON.stringify(S); navigator.clipboard?.writeText(txt).then(() => toast('Backup copied to clipboard'), () => { $('#datazone').innerHTML = `<textarea style="width:100%;min-height:100px;margin-top:10px" readonly>${esc(txt)}</textarea>`; $('#datazone textarea').select(); }); if (!navigator.clipboard) { $('#datazone').innerHTML = `<textarea style="width:100%;min-height:100px;margin-top:10px" readonly>${esc(txt)}</textarea>`; } };
    $('#imp').onclick = () => { $('#datazone').innerHTML = `<textarea id="impt" aria-label="Paste backup" placeholder="Paste your backup here" style="width:100%;min-height:100px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2)"></textarea><button class="btn sm primary" id="impgo" style="margin-top:8px">Restore</button>`; $('#impgo').onclick = () => { try { const d = JSON.parse($('#impt').value); if (typeof d !== 'object' || d.xp == null) throw 0; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, d); save(); toast('Progress restored'); route(); } catch (e) { toast('That backup could not be read. Paste the full text you copied.'); } }; };
    $('#rst').onclick = () => { $('#datazone').innerHTML = `<div class="box warn" style="margin-top:12px"><b class="lbl">Are you sure?</b><p>This permanently deletes all XP, scores, flashcard boxes and badges in this browser.</p><div class="row"><button class="btn sm" id="rsty" style="background:var(--bad);color:#fff;border-color:var(--bad)">Delete everything</button><button class="btn sm" id="rstn">Cancel</button></div></div>`; $('#rstn').onclick = () => $('#datazone').innerHTML = ''; $('#rsty').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.hash = '#/home'; location.reload(); }; };
  }

  /* ---------- ABOUT ---------- */
  function about() {
    crumbs('<b>About &amp; help</b>');
    V().innerHTML = `<div class="notes"><h1 class="display" style="font-size:clamp(34px,5vw,54px);margin-bottom:12px">About Spectra</h1>
      <p class="lede">A complete study companion for the WJEC GCE AS and A level Physics specification (Wales): Units 1–4, the four Unit 4 options, and the practical and mathematical skills examined throughout.</p>
      <section><h3>How to study a topic</h3><ol><li><b>Learn</b> — read the notes, try each worked example step by step, and rate yourself on the specification checklist.</li><li><b>Explore</b> — play with the simulation until the key relationship feels obvious.</li><li><b>Flashcards</b> — spaced repetition: cards you know move to higher boxes and come up less often.</li><li><b>Quiz</b> — ten questions with instant explanations. Your best score counts towards mastery.</li><li><b>Calculate</b> — unlimited numerical questions with fresh values and full worked solutions.</li><li><b>Exam questions</b> — structured questions with examiner-style mark schemes to self-mark.</li></ol></section>
      <section><h3>Mastery and your spectrum</h3><p>Topic mastery combines your best quiz score (40%), flashcards known (20%), specification confidence (20%) and correct calculations (20%). A topic’s line glows at full brightness as mastery approaches 100%; 70% counts as “lit”.</p></section>
      <section><h3>Keyboard shortcuts</h3><div class="tbl"><table><tr><th>Key</th><th>Action</th></tr><tr><td><kbd>/</kbd> or <kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>Search everything</td></tr><tr><td><kbd>A</kbd>–<kbd>D</kbd> / <kbd>1</kbd>–<kbd>4</kbd></td><td>Answer a quiz question</td></tr><tr><td><kbd>Enter</kbd></td><td>Next question</td></tr><tr><td><kbd>Space</kbd></td><td>Flip a flashcard</td></tr><tr><td><kbd>1</kbd>–<kbd>4</kbd> (flipped card)</td><td>Rate: again / hard / good / easy</td></tr></table></div></section>
      <section><h3>About the content</h3><div class="box why"><b class="lbl">Please note</b><p>The notes, questions and mark schemes were written for this app to follow the WJEC specification and data booklet conventions (for example ΔU = Q − W with W the work done <i>by</i> the gas, and x = A cos(ωt + ε)). They are not official WJEC materials. Always check the current specification, data booklet and past papers on the WJEC website, and follow your teacher’s guidance on which Unit 4 option you are taking.</p></div></section>
      <section><h3>Your data</h3><p>Everything you do is stored in this browser only. Use <a href="#/progress">Progress</a> to back up or restore.</p></section></div>`;
  }

  /* ---------- Search palette ---------- */
  let index = null;
  function buildIndex() {
    index = [];
    TOPICS.forEach(t => { index.push({ k: 'Topic', t: `${t.id} ${t.title}`, s: t.short, h: `#/t/${t.id}`, x: (t.id + ' ' + t.title + ' ' + t.short + ' ' + t.summary).toLowerCase() });
      t.learn.forEach((l, i) => index.push({ k: 'Notes', t: l.h.replace(/<[^>]+>/g, ''), s: `${t.id} ${t.title}`, h: `#/t/${t.id}`, x: (l.h + ' ' + l.html.replace(/<[^>]+>/g, ' ')).toLowerCase() }));
      t.eqs.forEach(([e, d]) => index.push({ k: 'Equation', t: M(e), s: `${d || ''} · ${t.id}`, h: `#/t/${t.id}`, x: (e + ' ' + d + ' ' + t.title).toLowerCase(), raw: true }));
      t.cards.forEach(([q, a]) => index.push({ k: 'Card', t: q.replace(/<[^>]+>/g, ''), s: a.replace(/<[^>]+>/g, '').slice(0, 80), h: `#/t/${t.id}/cards`, x: (q + ' ' + a).toLowerCase() })); });
    PRACTICALS.forEach(p => index.push({ k: 'Practical', t: p.title, s: p.aim, h: '#/practicals', x: (p.title + ' ' + p.aim).toLowerCase() }));
    Object.entries(GAMES).forEach(([id, g]) => index.push({ k: 'Game', t: g.title, s: g.blurb, h: '#/game/' + id, x: (g.title + ' ' + g.blurb).toLowerCase() }));
    [['Equation sheet', '#/equations'], ['Mock exam', '#/mock'], ['Progress', '#/progress'], ['Daily challenge', '#/daily']].forEach(([t, hh]) => index.push({ k: 'Page', t, s: '', h: hh, x: t.toLowerCase() }));
  }
  function openPalette() {
    if ($('.palette-back')) return; index || buildIndex();
    const back = h('div', { class: 'palette-back', role: 'dialog', 'aria-label': 'Search' }, `<div class="palette"><input id="pal" placeholder="Search topics, notes, equations, flashcards…" aria-label="Search" autocomplete="off"><ul id="palres"></ul></div>`);
    document.body.append(back); const inp = $('#pal'), ul = $('#palres'); let sel = 0, res = [];
    const close = () => back.remove();
    const show = () => { const q = inp.value.toLowerCase().trim(); const terms = q.split(/\s+/).filter(Boolean);
      res = q ? index.filter(it => terms.every(w => it.x.includes(w))).sort((a, b) => ({ Topic: 0, Page: 1, Equation: 2, Notes: 3, Practical: 4, Game: 5, Card: 6 }[a.k] - { Topic: 0, Page: 1, Equation: 2, Notes: 3, Practical: 4, Game: 5, Card: 6 }[b.k])).slice(0, 40) : index.filter(it => it.k === 'Topic' || it.k === 'Page').slice(0, 14);
      sel = 0; ul.innerHTML = res.length ? res.map((r, i) => `<li><a href="${r.h}" class="${i === sel ? 'sel' : ''}"><span class="kind">${r.k}</span><span><span class="t">${r.raw ? r.t : esc(r.t)}</span><br><span class="s">${esc(r.s)}</span></span><span class="muted">↵</span></a></li>`).join('') : '<li class="empty" style="margin:8px">No matches. Try a symbol like λ or a word like “capacitor”.</li>'; };
    inp.oninput = show; show(); inp.focus();
    back.onclick = e => { if (e.target === back) close(); if (e.target.closest('a')) close(); };
    inp.onkeydown = e => { const as = $$('a', ul); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = clamp(sel + (e.key === 'ArrowDown' ? 1 : -1), 0, as.length - 1); as.forEach((a, i) => a.classList.toggle('sel', i === sel)); as[sel]?.scrollIntoView({ block: 'nearest' }); } else if (e.key === 'Enter') { as[sel] && (location.hash = as[sel].getAttribute('href')); close(); } else if (e.key === 'Escape') close(); };
  }

  function init() {
    if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
    chrome(); touchStreak();
    addEventListener('hashchange', route);
    addEventListener('keydown', e => { if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !e.target.matches('input,textarea,select'))) { e.preventDefault(); openPalette(); } if (e.key === 'Escape') { $('.palette-back')?.remove(); toggleSide(false); } });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { refreshSimTheme(); refreshChrome(); });
    route();
  }
  return { init, route, refreshChrome };
})();
window.App = App;

</script>
<script>App.init();</script>
