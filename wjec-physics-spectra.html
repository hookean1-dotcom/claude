TOPICS.push({
  id: '1.7', unit: '1', title: 'Particles and Nuclear Structure', short: 'Quarks, leptons, forces, conservation',
  summary: 'The Standard Model at A level: first-generation quarks and leptons, how they build hadrons, the four forces and the conservation laws that decide which reactions happen.',
  spec: [
    "(a) Matter is composed of quarks and leptons; there are three generations (only the first generation is examined: e⁻, νₑ, u, d and their charges)",
    "(b) Antiparticles exist for these particles, with identical properties apart from opposite charge; particles and antiparticles annihilate",
    "(c) Symbols for the positron and for antiparticles of quarks and hadrons",
    "(d) Quarks are never observed in isolation but are bound into hadrons: baryons (3 quarks), antibaryons (3 antiquarks) and mesons (quark–antiquark)",
    "(e) The quark compositions of the neutron and proton",
    "(f) Suggest the quark make-up of less well known first-generation baryons and of charged pions",
    "(g) The properties of the four interactions: gravitational, weak, electromagnetic and strong — what experiences them and their range",
    "(h) Apply conservation of charge, lepton number and baryon (quark) number to simple reactions",
    "(i) Neutrino involvement and quark flavour changes are exclusive to weak interactions"
  ],
  learn: [
    { h: 'Nuclear structure', html: `
<p>A nucleus contains <b>protons</b> and <b>neutrons</b> (nucleons). Nuclide notation $^A_Z"X"$: Z = proton (atomic) number, A = nucleon (mass) number, so the number of neutrons is N = A − Z. <b>Isotopes</b> have the same Z but different N.</p>
<p>Example: $^{235}_{92}"U"$ has 92 protons and 143 neutrons.</p>` },
    { h: 'The fundamental particles (first generation)', html: `
<div class="tbl"><table><tr><th>Particle</th><th>Symbol</th><th>Charge / e</th><th>Baryon no. B</th><th>Lepton no. L</th></tr>
<tr><td>up quark</td><td>u</td><td>+⅔</td><td>+⅓</td><td>0</td></tr>
<tr><td>down quark</td><td>d</td><td>−⅓</td><td>+⅓</td><td>0</td></tr>
<tr><td>electron</td><td>e<sup>−</sup></td><td>−1</td><td>0</td><td>+1</td></tr>
<tr><td>electron neutrino</td><td>ν<sub>e</sub></td><td>0</td><td>0</td><td>+1</td></tr>
<tr><td>anti-up</td><td>ū</td><td>−⅔</td><td>−⅓</td><td>0</td></tr>
<tr><td>anti-down</td><td>d̄</td><td>+⅓</td><td>−⅓</td><td>0</td></tr>
<tr><td>positron</td><td>e<sup>+</sup></td><td>+1</td><td>0</td><td>−1</td></tr>
<tr><td>electron antineutrino</td><td>ν̄<sub>e</sub></td><td>0</td><td>0</td><td>−1</td></tr></table></div>
<p>These are the <b>first generation</b>. There are three generations of quarks and leptons, but no questions are set on the second or third generations.</p>
<p>Every particle has an <b>antiparticle</b> with identical properties apart from opposite charge (and opposite baryon and lepton numbers). A particle and its antiparticle can <b>annihilate</b>, their mass being converted into energy (e.g. two γ photons from e<sup>−</sup> + e<sup>+</sup>). Antiparticles are shown with a bar (ū, d̄, p̄, ν̄<sub>e</sub>); the positron is e<sup>+</sup>.</p>` },
    { h: 'Hadrons: baryons and mesons', html: `
<p>Particles made of quarks are <b>hadrons</b>. Quarks are never found on their own.</p>
<ul><li><b>Baryons</b> — three quarks, B = +1. Proton <b>uud</b> (charge +1), neutron <b>udd</b> (0), Δ<sup>++</sup> <b>uuu</b> (+2), Δ<sup>−</sup> <b>ddd</b> (−1). Antibaryons are three antiquarks, B = −1.</li>
<li><b>Mesons</b> — a quark and an antiquark, B = 0. π<sup>+</sup> = <b>ud̄</b>, π<sup>−</sup> = <b>dū</b>, π<sup>0</sup> = uū or dd̄.</li></ul>
<p><b>Leptons</b> (electron, neutrino) are fundamental — not made of quarks — and do not feel the strong force.</p>
<div class="box tip"><b class="lbl">Try it</b><p>Open the <b>Explore</b> tab to build hadrons from quarks in the Particle Forge.</p></div>` },
    { h: 'The four interactions', html: `
<div class="tbl"><table><tr><th>Interaction</th><th>Experienced by</th><th>Range</th><th>Comments</th></tr>
<tr><td>gravitational</td><td>all matter</td><td>infinite</td><td>very weak — negligible except between large objects such as planets</td></tr>
<tr><td>weak</td><td>all leptons and all quarks, so all hadrons</td><td>very short</td><td>only significant when the e-m and strong interactions do not operate</td></tr>
<tr><td>electromagnetic (e-m)</td><td>all charged particles</td><td>infinite</td><td>also experienced by neutral hadrons, as these are made of (charged) quarks</td></tr>
<tr><td>strong</td><td>all quarks, so all hadrons</td><td>short</td><td>holds quarks together in hadrons and nucleons together in nuclei</td></tr></table></div>
<ul><li>The <b>strong</b> interaction holds quarks together in hadrons and nucleons together in the nucleus.</li>
<li>The <b>weak</b> interaction is the only one that can change one quark flavour into another (d → u) and the only one that involves neutrinos.</li></ul>` },
    { h: 'Conservation laws and deciding which interaction', html: `
<div class="box def"><b class="lbl">Always conserved</b><p>Charge Q, baryon number B and lepton number L are conserved in <b>every</b> interaction. If any one fails, the reaction cannot happen.</p></div>
<p>Baryon number conservation is the same as <b>quark number</b> conservation (each quark counts +⅓, each antiquark −⅓).</p>
<p>Also: in <b>strong</b> and <b>electromagnetic</b> interactions the number of up quarks and the number of down quarks (counting antiquarks as −1) are each conserved. Only the <b>weak</b> interaction changes quark flavour.</p>
<div class="box def"><b class="lbl">β<sup>−</sup> decay</b><p>n → p + e<sup>−</sup> + ν̄<sub>e</sub>, which at quark level is d → u + e<sup>−</sup> + ν̄<sub>e</sub>.</p><p>Check: Q: 0 = 1 − 1 + 0 ✓ B: 1 = 1 ✓ L: 0 = +1 − 1 ✓. A neutrino is involved and the quark flavour changes, so it is weak.</p></div>
<div class="box def"><b class="lbl">β<sup>+</sup> decay (inside a nucleus)</b><p>p → n + e<sup>+</sup> + ν<sub>e</sub>, i.e. u → d + e<sup>+</sup> + ν<sub>e</sub>.</p></div>
<div class="box tip"><b class="lbl">Deciding which interaction</b><ol><li>Any neutrino, or a change in quark flavour → <b>weak</b>.</li><li>Only hadrons, with u and d numbers unchanged → <b>strong</b>.</li><li>Charged leptons/photons without neutrinos, no flavour change → <b>electromagnetic</b>.</li></ol></div>` }
  ],
  eqs: [['N = A - Z', 'neutron number'], ['"p" = "uud",  "n" = "udd"', 'nucleon quark content'], ['"d" → "u" + "e"^- + @bar{ν}_e', 'β⁻ decay at quark level']],
  worked: [

TOPICS.push({
  id: '2.4', unit: '2', title: 'The Nature of Waves', short: 'Progressive waves, polarisation, phase',
  summary: 'What a wave is, how to describe it with amplitude, wavelength, frequency and phase, and why polarisation proves light is transverse.',
  spec: [
    "(a) A progressive wave transfers energy without any transfer of matter",
    "(b) The difference between transverse and longitudinal waves",
    "(c) The term polarisation",
    "(d) The terms in phase and in antiphase",
    "(e) Displacement, amplitude, wavelength, frequency, period and velocity of a wave",
    "(f) Graphs of displacement against time and against position (transverse waves only)",
    "(g) Use c = fλ",
    "(h) All points on a wavefront oscillate in phase; rays (propagation directions) are at right angles to wavefronts"
  ],
  learn: [
    { h: 'Progressive waves', html: `
<p>A <b>progressive wave</b> is a disturbance that transfers energy from one place to another without transferring matter. The particles of the medium oscillate about fixed equilibrium positions.</p>
<div class="box def"><b class="lbl">Transverse and longitudinal</b><p><b>Transverse</b>: particle oscillations are perpendicular to the direction of energy transfer (e.g. EM waves, waves on a string, S-waves).</p><p><b>Longitudinal</b>: oscillations are parallel to the direction of energy transfer, forming compressions and rarefactions (e.g. sound, P-waves).</p></div>` },
    { h: 'Describing a wave', html: `
<ul><li><b>Displacement</b> — distance of a particle from its equilibrium position (in a given direction).</li>
<li><b>Amplitude</b> A — the maximum displacement from the equilibrium position.</li>
<li><b>Wavelength</b> λ — the distance between adjacent points oscillating in phase (e.g. crest to crest).</li>
<li><b>Period</b> T — the time for one complete oscillation; <b>frequency</b> f = 1/T is the number of oscillations per second (Hz).</li>
<li><b>Wave speed</b> c — the distance a wave front moves per unit time.</li></ul>
<div class="box eq">$c = fλ$</div>
<p>In one period the wave moves forward one wavelength, so c = λ/T = fλ.</p>
[[d:wave-xd]]
<p>A displacement–<b>distance</b> graph is a snapshot of the whole wave at one instant. A displacement–<b>time</b> graph shows how one particle moves; the horizontal spacing of peaks gives T.</p>` },
    { h: 'In phase and antiphase', html: `
<p>Two points on a wave are <b>in phase</b> if they are always at the same stage of their oscillation — same displacement, moving the same way. Points one whole wavelength apart are in phase.</p>
<p>Two points are in <b>antiphase</b> if one is at a crest when the other is at a trough — always opposite displacements. Points half a wavelength apart are in antiphase.</p>` },
    { h: 'Wavefronts and rays', html: `
<p>A <b>wavefront</b> is a line (or surface) joining points on a wave that are in phase — for example, a crest. All points on a wavefront oscillate in phase.</p>
<p>A <b>ray</b> shows the direction in which the wave travels. Rays are always at <b>right angles</b> to wavefronts: parallel straight wavefronts ↔ parallel rays; circular wavefronts from a point source ↔ rays radiating outwards.</p>` },
    { h: 'Polarisation', html: `
<div class="box def"><b class="lbl">Definition</b><p>A wave is <b>plane polarised</b> if its oscillations take place in one plane only (a plane containing the direction of propagation).</p></div>
<p>Only transverse waves can be polarised; longitudinal oscillations are already along the direction of travel. So polarisation of light shows that light is transverse.</p>
<ul><li>Unpolarised light through a Polaroid filter: transmitted light is plane polarised with half the intensity.</li>
<li>A second Polaroid (the analyser) rotated through 90° relative to the first blocks the light completely (crossed Polaroids). Rotating it through 360° gives two maxima and two minima.</li>
<li>Microwaves from a transmitter are already polarised: a metal grille rotated between transmitter and receiver shows the same effect.</li></ul>
<p>Applications: Polaroid sunglasses (reducing glare from reflected light, which is partially polarised), LCD screens, photographic filters, stress analysis in plastics.</p>` }
  ],
  eqs: [['c = fλ', 'wave equation'], ['f = @frac{1}{T}', 'frequency and period']],
  worked: [
    { q: 'A radio station broadcasts at 97.4 MHz. Find the wavelength.', s: ['λ = c/f = 3.00 × 10<sup>8</sup> / 97.4 × 10<sup>6</sup>.'], a: '3.08 m' },
    { q: 'A wave on a rope has wavelength 0.60 m. Point P is 1.20 m from point Q and point R is 0.90 m from Q. Which points oscillate in phase with Q, and which in antiphase?', s: ['PQ = 1.20/0.60 = 2 whole wavelengths → P is in phase with Q.', 'RQ = 0.90/0.60 = 1½ wavelengths → R is in antiphase with Q.'], a: 'P in phase; R in antiphase' },
    { q: 'A particle on a sound wave takes 2.5 ms to complete one oscillation. The wave speed is 340 m s<sup>−1</sup>. Find the frequency and wavelength.', s: ['f = 1/T = 1/2.5 × 10<sup>−3</sup> = 400 Hz.', 'λ = c/f = 340/400 = 0.85 m.'], a: '400 Hz; 0.85 m' }
  ],
  pitfalls: ['Saying waves transfer matter.', 'Calling sound transverse or claiming it can be polarised.', 'Reading the period from a displacement–distance graph (that axis gives λ).', 'Confusing amplitude with peak-to-trough height (that is 2A).'],
  cards: [
    ['What does a progressive wave transfer?', 'Energy (not matter).'],
    ['Define a transverse wave.', 'Oscillations perpendicular to the direction of energy transfer.'],
    ['Define a longitudinal wave.', 'Oscillations parallel to the direction of energy transfer.'],
    ['Define wavelength.', 'Distance between adjacent points oscillating in phase.'],
    ['Define amplitude.', 'Maximum displacement from equilibrium.'],
    ['Wave equation?', 'c = fλ'],
    ['Points λ/2 apart on a progressive wave oscillate…', 'in antiphase.'],
    ['Define a wavefront.', 'A line joining points on a wave that are in phase.'],
    ['Angle between rays and wavefronts?', '90°'],
    ['Define plane polarised.', 'Oscillations in one plane only.'],
    ['Which waves can be polarised?', 'Only transverse waves.'],
    ['What does polarisation show about light?', 'Light is a transverse wave.'],
    ['Crossed Polaroids transmit…', 'no light.']

  quiz: [
    { q: 'Which type of wave can be polarised?', o: ['light', 'sound in air', 'ultrasound', 'a compression wave on a slinky'], x: 'Only transverse waves.' },
    { q: 'Which is a longitudinal wave?', o: ['sound', 'microwaves', 'a wave on a guitar string', 'X-rays'], x: 'Compressions and rarefactions.' },
    { q: 'A wave has frequency 50 Hz and wavelength 6.0 m. Its speed is', o: ['300 m s<sup>−1</sup>', '8.3 m s<sup>−1</sup>', '0.12 m s<sup>−1</sup>', '56 m s<sup>−1</sup>'], x: 'c = fλ.' },
    { q: 'Two points on a progressive wave are half a wavelength apart. They oscillate', o: ['in antiphase', 'in phase', 'with a phase difference of π/2', 'with different frequencies'], x: 'Phase difference π rad.' },
    { q: 'A wave has period 20 ms. Its frequency is', o: ['50 Hz', '20 Hz', '0.05 Hz', '500 Hz'], x: 'f = 1/0.020.' },
    { q: 'Progressive waves transfer', o: ['energy but not matter', 'matter but not energy', 'both energy and matter', 'neither energy nor matter'], x: 'Particles oscillate about fixed positions.' },

TOPICS.push({
  id: '2.5', unit: '2', title: 'Wave Properties', short: 'Diffraction, interference, stationary waves',
  summary: 'What waves do when they meet gaps and each other: diffraction, two-source interference, the diffraction grating and stationary waves.',
  spec: [
    "(a) Diffraction occurs when waves encounter slits or obstacles",
    "(b) Little diffraction when λ is much smaller than the obstacle or slit",
    "(c) If λ ≥ slit width, waves spread as roughly semicircular wavefronts; if λ < slit width the main beam spreads through less than 180°",
    "(d) How two-source interference occurs",
    "(e) The historical importance of Young’s experiment",
    "(f) The principle of superposition, with sketch graphs",
    "(g) Path difference rules for constructive and destructive interference from in-phase sources",
    "(h) Use λ = ay/D",
    "(i) Derive and use d sin θ = nλ for a diffraction grating",
    "(j) A grating’s very small d spreads orders much further apart than in Young’s experiment; the large number of slits makes the beams much sharper",
    "(k) Coherent sources are monochromatic, with wavefronts continuous across the beam and (for two or more sources) a constant phase relationship",
    "(l) Examples of coherent and incoherent sources",
    "(m) For two-source interference the sources need zero or constant phase difference and oscillations in the same direction",
    "(n) The differences between stationary and progressive waves",
    "(o) A stationary wave is the superposition of two progressive waves of equal amplitude and frequency travelling in opposite directions; internodal distance = λ/2"
  ],
  learn: [
    { h: 'Diffraction', html: `
<p><b>Diffraction</b> is the spreading out of waves as they pass through a gap or around an obstacle. It is most noticeable when the gap is similar in size to the wavelength. A gap much wider than λ gives little spreading.</p>
<ul><li>If λ is <b>much smaller</b> than the slit or obstacle, there is little diffraction.</li><li>If λ is <b>equal to or greater than</b> the slit width, waves spread out as roughly <b>semicircular</b> wavefronts.</li><li>If λ is <b>less than</b> the slit width, the main beam spreads through <b>less than 180°</b>.</li></ul>
<p>This is why you can hear round corners (sound λ ~ 1 m) but not see round them (light λ ~ 500 nm).</p>` },
    { h: 'Superposition and interference', html: `
<div class="box def"><b class="lbl">Principle of superposition</b><p>When two or more waves meet at a point, the resultant displacement is the (vector) sum of the individual displacements.</p></div>
<div class="box def"><b class="lbl">Coherence</b><p>A <b>coherent</b> source is monochromatic, with wavefronts continuous across the width of the beam; two or more coherent sources have a <b>constant phase relationship</b>.</p></div>
<p><b>Examples.</b> Coherent: a laser; two slits illuminated by the same laser; two loudspeakers driven by one signal generator; two dippers on one bar in a ripple tank. Incoherent: two separate lamps or two separate lasers, a filament lamp, a candle — their light is emitted in random, unrelated bursts.</p>
<div class="box def"><b class="lbl">Conditions for observable two-source interference</b><ol><li>The sources have a zero or constant phase difference (coherent).</li><li>The oscillations are in the same direction (e.g. same plane of polarisation).</li></ol></div>
<p><b>Path difference</b> is the difference in distance travelled from the two sources to a point. For coherent sources oscillating <b>in phase</b>:</p>
<ul><li>Constructive interference (maximum) when path difference = nλ.</li><li>Destructive interference (minimum) when path difference = (n + ½)λ.</li></ul>
<p>For a clear pattern the waves should also have similar amplitudes, so the minima are nearly zero. When sketching superposition, add the displacements of the two waves point by point.</p>` },
    { h: 'Young’s double slits', html: `
[[d:double-slit]]
<div class="box eq">$λ = @frac{ay}{D}$</div>
<p>a = slit separation, y = fringe separation (centre-to-centre spacing of adjacent bright fringes), D = slit-to-screen distance. Valid when D ≫ a and y.</p>
<p>Increase the fringe spacing by increasing D or λ, or by decreasing a. Measure across several fringes (e.g. 10y) with a ruler to reduce percentage uncertainty.</p>
<div class="box why"><b class="lbl">Historical importance</b><p>Young’s experiment (1801) produced interference fringes with light — something only waves can do. It was key evidence for the <b>wave nature of light</b>, against Newton’s particle (corpuscular) theory, and gave the first measurement of the wavelength of light.</p></div>
<div class="box warn"><b class="lbl">Safety</b><p>Never look directly into a laser beam or its reflection.</p></div>` },
    { h: 'The diffraction grating', html: `
[[d:grating]]
<div class="box eq">$d@,"sin"@,θ = nλ$</div>
<p>d = spacing between adjacent lines (d = 1/N where N is lines per metre), θ = angle of the n<sup>th</sup> order maximum from the straight-through direction. Since sin θ ≤ 1, the highest order visible is the largest whole number ≤ d/λ.</p>
<p><b>Deriving the equation.</b> Light from adjacent slits reaching a distant point at angle θ has path difference d sin θ. All the slits reinforce when this equals a whole number of wavelengths: d sin θ = nλ.</p>
<p>Compared with Young’s slits: the <b>very small d</b> spreads the orders much further apart, and the <b>large number of slits</b> makes the bright beams much sharper (and brighter), so λ can be measured more precisely. With white light, the central maximum is white and each order is a spectrum with violet (shortest λ) nearest the centre.</p>` },
    { h: 'Stationary waves', html: `
<p>A <b>stationary (standing) wave</b> forms when two progressive waves of the same frequency (and similar amplitude) travelling in opposite directions superpose — typically a wave and its reflection.</p>
<ul><li><b>Nodes</b>: points of zero amplitude. <b>Antinodes</b>: points of maximum amplitude.</li><li>Adjacent nodes (or antinodes) are λ/2 apart.</li></ul>
[[d:harmonics]]
<div class="tbl"><table><tr><th></th><th>Progressive</th><th>Stationary</th></tr>
<tr><td>Energy</td><td>transferred</td><td>no net transfer</td></tr>
<tr><td>Amplitude</td><td>same for all points (no losses)</td><td>varies from zero (node) to maximum (antinode)</td></tr>
<tr><td>Phase</td><td>varies continuously along one λ</td><td>all points between adjacent nodes in phase; antiphase with the next segment</td></tr>
<tr><td>Wavelength</td><td>distance between adjacent points in phase</td><td>twice the node–node distance</td></tr></table></div>
<p>On a string fixed at both ends, the ends must be nodes, so the stationary waves that can form have a whole number of λ/2 loops along the string (see diagram).</p>
<div class="box def"><b class="lbl">Specified practical: speed of sound</b><p>A loudspeaker faces a flat reflector; a small microphone connected to an oscilloscope is moved along the line between them to locate successive nodes (minimum signal). Node–node spacing = λ/2. Measure the distance across several nodes, find λ, then c = fλ using the signal generator frequency.</p></div>` }
  ],

TOPICS.push({
  id: '2.6', unit: '2', title: 'Refraction of Light', short: 'Snell’s law, TIR, optical fibres',
  summary: 'Light changes speed between media. Snell’s law, total internal reflection and why multimode fibres limit how fast data can travel.',
  spec: [
    "(a) Refractive index n = c/v",
    "(b) Use n₁v₁ = n₂v₂ and n₁ sin θ₁ = n₂ sin θ₂ (Snell’s law)",
    "(c) How Snell’s law relates to the wave model: plane waves refracted at a plane boundary",
    "(d) The conditions for total internal reflection",
    "(e) Derive and use sin θc = n₂/n₁ for the critical angle",
    "(f) Apply total internal reflection to multimode optical fibres",
    "(g) Multimode dispersion limits the rate of data transfer and transmission distance",
    "(h) Monomode fibres have allowed much greater transmission rates and distances"
  ],
  learn: [
    { h: 'Refractive index and Snell’s law', html: `
<div class="box def"><b class="lbl">Definition</b><p>The <b>refractive index</b> of a medium is $n = @frac{c}{v}$, the speed of light in a vacuum divided by the speed of light in the medium. n ≥ 1; for air n ≈ 1.00.</p></div>
[[d:snell]]
<div class="box eq">$n_1@,"sin"@,θ_1 = n_2@,"sin"@,θ_2$</div>
<p>Angles are measured from the normal. Going into a medium of higher n, light slows down and bends <b>towards</b> the normal. The <b>frequency stays the same</b>, so the wavelength decreases in proportion to the speed.</p>
<p>Since n = c/v, the product nv is the same in every medium: $n_1v_1 = n_2v_2$.</p>
<div class="box why"><b class="lbl">Snell’s law and the wave model</b><p>Draw plane wavefronts approaching the boundary obliquely. The part of each wavefront that enters the slower medium first travels a shorter distance in the same time, so the wavefront swings round and the ray (perpendicular to the wavefronts) bends towards the normal. In one period the wavefront moves λ₁ = v₁T in medium 1 and λ₂ = v₂T in medium 2; the geometry of the wavefronts across the boundary gives sin θ₁/sin θ₂ = v₁/v₂ = n₂/n₁ — Snell’s law.</p></div>` },
    { h: 'Total internal reflection', html: `
<p>When light travels from a higher to a lower refractive index, the refracted ray bends away from the normal. At the <b>critical angle</b> θ<sub>c</sub> the refracted ray travels along the boundary (θ<sub>2</sub> = 90°):</p>
<div class="box eq">$"sin"@,θ_c = @frac{n_2}{n_1}$</div>
<div class="box def"><b class="lbl">Conditions for TIR</b><ol><li>Light travels from a medium of higher refractive index towards one of lower refractive index.</li><li>The angle of incidence is greater than the critical angle.</li></ol></div>
<p>Glass (n = 1.50) to air: θ<sub>c</sub> = sin<sup>−1</sup>(1/1.50) = 41.8°.</p>` },
    { h: 'Optical fibres and multimode dispersion', html: `
<p>A step-index fibre has a <b>core</b> surrounded by <b>cladding</b> of slightly lower refractive index. Light travels along the core by repeated total internal reflection at the core–cladding boundary. The cladding also protects the core surface from scratches and prevents light leaking into adjacent fibres (crosstalk).</p>
[[d:fibre]]
<p>In a <b>multimode</b> fibre (wide core), rays can take many paths. A ray reflecting at close to the critical angle travels further than a ray along the axis, so it arrives later. A short pulse of light therefore spreads out in time — <b>multimode dispersion</b>. Adjacent pulses can overlap, so this limits the rate at which data can be sent and the distance between repeaters.</p>
<div class="box def"><b class="lbl">Time difference</b><p>Axial ray: $t_1 = @frac{L}{v} = @frac{Ln_1}{c}$. Ray at the critical angle travels $L/"sin"@,θ_c$, so $t_2 = @frac{t_1}{"sin"@,θ_c} = t_1 @frac{n_1}{n_2}$.</p></div>
<p>The introduction of <b>monomode</b> fibres — with a very narrow core (a few μm) so there is essentially only one path — removed multimode dispersion and has allowed much greater transmission rates and distances. They are used for long-distance telecommunications and internet backbones.</p>
<div class="box def"><b class="lbl">Specified practical: refractive index</b><p>Trace rays through a rectangular glass block with ray box (or pins) for a range of incidence angles. Measure θ<sub>1</sub> and θ<sub>2</sub> with a protractor; plot sin θ<sub>1</sub> against sin θ<sub>2</sub>: gradient = n of the glass.</p></div>` }
  ],
  eqs: [['n = @frac{c}{v}', 'refractive index'], ['n_1v_1 = n_2v_2', ''], ['n_1@,"sin"@,θ_1 = n_2@,"sin"@,θ_2', 'Snell’s law'], ['"sin"@,θ_c = @frac{n_2}{n_1}', 'critical angle']],
  worked: [
    { q: 'Light in air hits glass (n = 1.52) at 40° to the normal. Find the angle of refraction and the speed of light in the glass.', s: ['sin θ<sub>2</sub> = sin 40° / 1.52 = 0.423, so θ<sub>2</sub> = 25.0°.', 'v = c/n = 3.00 × 10<sup>8</sup> / 1.52 = 1.97 × 10<sup>8</sup> m s<sup>−1</sup>.'], a: '25°; 1.97 × 10<sup>8</sup> m s<sup>−1</sup>' },
    { q: 'An optical fibre has core index 1.50 and cladding index 1.45. Find the critical angle.', s: ['sin θ<sub>c</sub> = 1.45/1.50 = 0.967.'], a: '75.2°' },
    { q: 'For the fibre above, 1.0 km long, find the difference in time between the axial ray and a ray travelling at the critical angle.', s: ['Axial: t<sub>1</sub> = Ln<sub>1</sub>/c = 1000 × 1.50 / 3.00 × 10<sup>8</sup> = 5.00 μs.', 'Critical ray: t<sub>2</sub> = t<sub>1</sub> × n<sub>1</sub>/n<sub>2</sub> = 5.00 × 1.50/1.45 = 5.17 μs.', 'Δt = 0.17 μs.'], a: '≈ 1.7 × 10<sup>−7</sup> s' }
  ],
  pitfalls: ['Measuring angles from the surface rather than the normal.', 'Saying frequency changes on refraction.', 'Writing sin θ<sub>c</sub> = n<sub>1</sub>/n<sub>2</sub> (it must be less than 1: lower index over higher).', 'Saying cladding “reflects” light — TIR happens because of its lower refractive index.'],
  cards: [
    ['Define refractive index.', 'n = c/v: speed in vacuum ÷ speed in medium.'],
    ['State Snell’s law.', 'n₁ sin θ₁ = n₂ sin θ₂'],
    ['What stays constant when light refracts?', 'Frequency.'],
    ['Two conditions for TIR?', 'Travelling to a lower n; angle of incidence > critical angle.'],
    ['Critical angle formula?', 'sin θ<sub>c</sub> = n₂/n₁ (n₁ > n₂)'],
    ['Critical angle of glass n = 1.50 in air?', '41.8°'],
    ['Purpose of cladding?', 'Lower n for TIR at the core boundary; protects core; prevents crosstalk.'],
    ['What is multimode dispersion?', 'Different ray paths take different times → pulses spread out.'],
    ['How to reduce multimode dispersion?', 'Use a very narrow core (monomode fibre).'],
    ['Graph for n of a glass block?', 'sin θ<sub>1</sub> (air) against sin θ<sub>2</sub> (glass): gradient = n.'],
    ['Why have monomode fibres allowed greater data rates?', 'Very narrow core → only one path → no multimode dispersion, so pulses don’t spread.']
  ],
  quiz: [
    { q: 'Light travels at 2.26 × 10<sup>8</sup> m s<sup>−1</sup> in water. The refractive index of water is', o: ['1.33', '0.75', '2.26', '1.50'], x: 'n = 3.00/2.26.' },
    { q: 'When light passes from air into glass, which quantity is unchanged?', o: ['frequency', 'wavelength', 'speed', 'direction (at non-zero incidence)'], x: 'Frequency is set by the source.' },
    { q: 'Total internal reflection can occur when light travels', o: ['from glass towards air at more than the critical angle', 'from air towards glass at more than the critical angle', 'from glass towards air at less than the critical angle', 'from air to glass at any angle'], x: 'Higher n → lower n and θ > θ<sub>c</sub>.' },
    { q: 'The critical angle for glass of refractive index 1.50 in air is about', o: ['42°', '48°', '34°', '56°'], x: 'sin<sup>−1</sup>(1/1.50).' },
    { q: 'The cladding of an optical fibre must have', o: ['a lower refractive index than the core', 'a higher refractive index than the core', 'the same refractive index as the core', 'a reflective metal coating'], x: 'Otherwise TIR cannot happen.' },
    { q: 'Multimode dispersion occurs because', o: ['rays taking different paths take different times', 'different wavelengths travel at different speeds', 'the fibre absorbs light', 'the cladding scatters light'], x: 'Path length differences.' },
    { q: 'Multimode dispersion can be reduced by', o: ['making the core narrower', 'making the core wider', 'increasing the difference between core and cladding indices', 'using a brighter source'], x: 'A monomode fibre has a very narrow core.' },
    { q: 'A ray enters glass from air at an angle to the normal. It', o: ['bends towards the normal', 'bends away from the normal', 'does not change direction', 'is totally internally reflected'], x: 'Speed decreases.' },
    { q: 'When the angle of incidence equals the critical angle, the angle of refraction is', o: ['90°', '0°', '45°', 'equal to the critical angle'], x: 'Refracted ray along the boundary.' },
    { q: 'Light travels from glass (n = 1.50) into water (n = 1.33). The critical angle is about', o: ['62°', '42°', '49°', '28°'], x: 'sin θ<sub>c</sub> = 1.33/1.50 = 0.887.' },
    { q: 'Light travels at 2.00 × 10<sup>8</sup> m s<sup>−1</sup> in glass of refractive index 1.50. In water (n = 1.33) its speed is', o: ['2.26 × 10<sup>8</sup> m s<sup>−1</sup>', '1.77 × 10<sup>8</sup> m s<sup>−1</sup>', '3.00 × 10<sup>8</sup> m s<sup>−1</sup>', '2.66 × 10<sup>8</sup> m s<sup>−1</sup>'], x: 'n₁v₁ = n₂v₂: 1.50 × 2.00 × 10⁸ / 1.33.' }
  ],
  exam: [
    { q: 'Explain what is meant by multimode dispersion in an optical fibre and why it is a problem for data transmission.', m: 4, ms: ['Rays travel along different paths (axial vs repeated TIR at large angles).', 'Longer paths take longer time.', 'A pulse spreads out (broadens) in time.', 'Pulses may overlap, limiting data rate / distance before regeneration.'] },
    { q: 'A step-index fibre has a core of refractive index 1.48 and cladding of 1.46. Calculate the critical angle at the core–cladding boundary and the speed of light in the core.', m: 3, ms: ['sin θ<sub>c</sub> = 1.46/1.48', 'θ<sub>c</sub> = 80.6°', 'v = c/n = 2.03 × 10<sup>8</sup> m s<sup>−1</sup>'] },
    { q: 'Describe how you would determine the refractive index of a glass block.', m: 5, ms: ['Place block on paper, draw round it; draw normal.', 'Ray box/pins: incident ray at measured θ<sub>1</sub>; mark emergent ray; join to find refracted ray.', 'Measure θ<sub>2</sub> with protractor.', 'Repeat for several θ<sub>1</sub>.', 'Plot sin θ<sub>1</sub> vs sin θ<sub>2</sub>; gradient = n.'] }

TOPICS.push({
  id: '2.7', unit: '2', title: 'Photons', short: 'Photoelectric effect, energy levels, de Broglie',
  summary: 'Light comes in packets. The photoelectric effect, energy levels and line spectra, and the discovery that particles behave as waves.',
  spec: [
    "(a) Light consists of discrete packets (photons) of energy",
    "(b) How the photoelectric effect can be demonstrated",
    "(c) Use a vacuum photocell to measure Ek max of emitted electrons in eV and hence in J",
    "(d) The graph of Ek max against frequency",
    "(e) The photon picture leads to Einstein’s equation Ek max = hf − φ, and how it correlates with the graph",
    "(f) The visible spectrum runs from about 700 nm (red) to 400 nm (violet); orders of magnitude of wavelengths of the other EM regions",
    "(g) Typical photon energies for these radiations",
    "(h) How to produce line emission and line absorption spectra from atoms",
    "(i) The appearance of such spectra seen through a diffraction grating",
    "(j) Simple atomic energy-level diagrams with the photon hypothesis, line emission and absorption spectra",
    "(k) Determine ionisation energies from an energy-level diagram",
    "(l) Electron diffraction shows particles have a wave-like aspect",
    "(m) Use p = h/λ for both particles of matter and photons",
    "(n) Calculate the radiation pressure on a surface absorbing or reflecting photons"
  ],
  learn: [
    { h: 'Photons', html: `
<p>EM radiation is emitted and absorbed in discrete packets called <b>photons</b>. Each photon carries energy:</p>
<div class="box eq">$E = hf = @frac{hc}{λ}$ &nbsp;&nbsp; h = 6.63 × 10<sup>−34</sup> J s</div>
<h4>The electromagnetic spectrum</h4><div class="tbl"><table><tr><th>Region</th><th>Wavelength (order of magnitude)</th><th>Typical photon energy</th></tr><tr><td>γ rays</td><td>10<sup>−12</sup> m and below</td><td>~1 MeV</td></tr><tr><td>X-rays</td><td>10<sup>−10</sup> m</td><td>~10 keV</td></tr><tr><td>ultraviolet</td><td>10<sup>−8</sup> m</td><td>~10–100 eV</td></tr><tr><td>visible</td><td>700 nm (red) to 400 nm (violet)</td><td>~2–3 eV</td></tr><tr><td>infrared</td><td>10<sup>−5</sup> m</td><td>~0.1 eV</td></tr><tr><td>microwaves</td><td>10<sup>−2</sup> m</td><td>~10<sup>−4</sup> eV</td></tr><tr><td>radio</td><td>1 m and above</td><td>~10<sup>−6</sup> eV or less</td></tr></table></div>
<p>The <b>electron volt</b> is the energy gained by an electron accelerated through a pd of 1 V: 1 eV = 1.60 × 10<sup>−19</sup> J. A 500 nm photon has E = 3.98 × 10<sup>−19</sup> J = 2.49 eV.</p>` },
    { h: 'The photoelectric effect', html: `
<p>When EM radiation of high enough frequency shines on a clean metal surface, electrons are emitted. Observations:</p>
<ol><li>No electrons are emitted below a <b>threshold frequency</b> f<sub>0</sub>, however intense the light.</li>
<li>Above f<sub>0</sub>, the maximum kinetic energy of the photoelectrons depends on frequency, not intensity.</li>
<li>The rate of emission is proportional to the intensity.</li>
<li>Emission is effectively instantaneous, even for very dim light.</li></ol>
<p>Wave theory predicts energy should build up gradually with any frequency. It cannot explain 1, 2 or 4.</p>
<div class="box def"><b class="lbl">Einstein’s explanation</b><p>Each photon gives <b>all</b> its energy to <b>one</b> electron. Some of it (at least φ) is needed to escape; the rest becomes kinetic energy:</p><p style="text-align:center">$E_{k max} = hf - φ$</p><p>The <b>work function</b> φ is the minimum energy needed to remove an electron from the surface of the metal. Threshold: $hf_0 = φ$.</p></div>
<p>More intense light means more photons per second, so more electrons per second — but each photon still has the same energy.</p>
[[d:ek-f]]` },
    { h: 'Measuring E<sub>k max</sub>: stopping potential', html: `
<p>A simple demonstration: a clean zinc plate on a negatively charged gold-leaf electroscope loses its charge (the leaf falls) when UV light shines on it, but not with visible light, however bright.</p>
<p>In a <b>vacuum photocell</b>, make the collecting electrode negative relative to the emitting surface. Increase this reverse pd until the photocurrent just falls to zero. This <b>stopping potential</b> V<sub>s</sub> stops even the fastest electrons:</p>
<div class="box eq">$eV_s = E_{k max} = hf - φ$</div>
<p>A graph of V<sub>s</sub> against f is a straight line with gradient h/e and x-intercept f<sub>0</sub>.</p>` },
    { h: 'Energy levels and line spectra', html: `
<p>Electrons in atoms can only have certain discrete energies — <b>energy levels</b>. Energies are negative, with zero corresponding to a free (ionised) electron.</p>
[[d:levels]]
<ul><li><b>Excitation</b>: an electron moves to a higher level by absorbing a photon of exactly the right energy or by collision with another particle.</li>
<li><b>De-excitation</b>: the electron drops to a lower level, emitting a photon with $hf = E_{upper} - E_{lower}$.</li>
<li><b>Ionisation</b>: an electron gains enough energy to escape the atom completely.</li></ul>
<p>The <b>ionisation energy</b> is the energy needed to remove an electron from the ground state completely: on the diagram, the gap from the ground level to 0 eV (13.6 eV for hydrogen).</p>
<p>Only certain energy differences are possible, so a hot gas gives a <b>line emission spectrum</b>. Cool gas in front of a continuous source absorbs the same wavelengths, giving a <b>line absorption spectrum</b> (see 1.6).</p>
<p><b>Producing them:</b> for emission, pass a current through a low-pressure gas discharge tube (e.g. hydrogen, sodium, neon); for absorption, shine white light through a cool gas or vapour (e.g. sodium vapour). <b>Seen through a diffraction grating</b>, an emission spectrum appears as a set of sharp coloured lines on a dark background, repeated in each order either side of the central (undeviated) image; an absorption spectrum appears as dark lines crossing a continuous rainbow spectrum.</p>` },
    { h: 'Wave–particle duality', html: `
<p>Photons carry momentum: $p = @frac{h}{λ}$. Conversely, de Broglie proposed that any particle of momentum p has a wavelength:</p>
<div class="box eq">$λ = @frac{h}{p} = @frac{h}{mv}$</div>
<p>Evidence: <b>electron diffraction</b>. A beam of electrons through a thin film of graphite produces diffraction rings on a fluorescent screen, just as waves would. Their de Broglie wavelength (~10<sup>−10</sup> m) is similar to the spacing between atoms. Faster electrons have shorter wavelength, so the rings get smaller.</p>
<h4>Radiation pressure</h4><p>Each photon carries momentum p = h/λ. When a beam of photons hits a surface, the rate of change of momentum is a force, and the force per unit area is the <b>radiation pressure</b>.</p><ul><li>Absorbing surface: each photon gives up momentum h/λ. Force = (photons per second) × h/λ = P/c for a beam of power P (since E = pc for a photon).</li><li>Reflecting surface (normal incidence): momentum changes from +h/λ to −h/λ, so 2h/λ per photon — <b>twice</b> the force: F = 2P/c.</li></ul><p>Radiation pressure = F/A. Example: sunlight of intensity 1.4 kW m<sup>−2</sup> absorbed by a surface gives pressure I/c = 1400/3.00 × 10<sup>8</sup> ≈ 4.7 μPa. This is what drives a solar sail.</p>
<div class="box def"><b class="lbl">Specified practical: h using LEDs</b><p>Each LED only starts to conduct and emit light when the pd reaches a threshold V, where eV ≈ hc/λ. Measure V for LEDs of known λ (several colours). Plot V against 1/λ: gradient = hc/e, so h = gradient × e/c.</p></div>` }

TOPICS.push({
  id: '3.2', unit: '3', title: 'Vibrations', short: 'SHM, damping, resonance',
  summary: 'Simple harmonic motion — the most important oscillation in physics — plus energy, damping, forced vibrations and resonance.',
  spec: [
    "(a) Define simple harmonic motion in words",
    "(b) a = −ω²x as the defining equation of SHM",
    "(c) Graph of acceleration against displacement in SHM",
    "(d) x = A cos(ωt + ε) as a solution of a = −ω²x",
    "(e) Frequency, period, amplitude and phase",
    "(f) Period T = 1/f or 2π/ω",
    "(g) v = −Aω sin(ωt + ε) for the velocity",
    "(h) Graphs of displacement and velocity against time",
    "(i) T = 2π√(m/k) for a system of stiffness k and mass m",
    "(j) T = 2π√(l/g) for a simple pendulum",
    "(k) Graphs of the interchange of kinetic and potential energy in undamped SHM; simple energy calculations",
    "(l) Free oscillations and the effect of damping in real systems",
    "(m) Practical examples of damped oscillations",
    "(n) The importance of critical damping, e.g. vehicle suspensions",
    "(o) Forced oscillations and resonance, with practical examples",
    "(p) Amplitude of a forced oscillation against driving frequency; increased damping broadens the resonance curve",
    "(q) When resonance is useful (circuit tuning, microwave cooking) and when it should be avoided (bridge design)"
  ],
  learn: [
    { h: 'Defining SHM', html: `
<div class="box def"><b class="lbl">Definition</b><p>A body moves with <b>simple harmonic motion</b> if its acceleration is directly proportional to its displacement from a fixed point (the equilibrium position) and is always directed towards that point:</p><p style="text-align:center">$a = -ω^2 x$</p></div>
<p>The minus sign says the acceleration is opposite to the displacement. The solution is:</p>
<div class="box eq">$x = A@,"cos"(ωt + ε)$</div>
<p>A = amplitude, ω = angular frequency (rad s<sup>−1</sup>), ε = phase constant. The period does not depend on amplitude: $T = @frac{2π}{ω}$.</p>
<p>The velocity is $v = -Aω@,"sin"(ωt + ε)$, and the acceleration is $a = -Aω^2@,"cos"(ωt + ε) = -ω^2x$.</p>
<p>A graph of <b>acceleration against displacement</b> is a straight line through the origin with <b>negative gradient</b> −ω², running from x = −A to x = +A.</p>
<ul><li>At the equilibrium position (x = 0): speed is maximum, $v_{max} = Aω$; acceleration is zero.</li>
<li>At the extremes (x = ±A): speed is zero; acceleration is maximum, $a_{max} = Aω^2$.</li></ul>
[[d:shm-graphs]]
<div class="box tip"><b class="lbl">Calculator</b><p>ωt is in <b>radians</b>. Switch your calculator to RAD for x = A cos(ωt + ε).</p></div>` },
    { h: 'Mass–spring and pendulum', html: `
<p><b>Mass on a spring</b>: restoring force F = −kx, so a = −(k/m)x. Comparing with a = −ω²x gives ω² = k/m:</p>
<div class="box eq">$T = 2π@sqrt{@frac{m}{k}}$</div>
<p><b>Simple pendulum</b> (small amplitude, less than about 10°):</p>
<div class="box eq">$T = 2π@sqrt{@frac{l}{g}}$</div>
<p>The pendulum’s period is independent of the mass of the bob and (for small swings) the amplitude.</p>
<div class="box def"><b class="lbl">Specified practical: g with a pendulum</b><p>Time 20 oscillations for a range of lengths l (measured to the centre of the bob), using a fiducial marker at the centre of the swing and small amplitudes. Plot T² against l: a straight line through the origin of gradient 4π²/g, so g = 4π²/gradient.</p></div>
<div class="box def"><b class="lbl">Specified practical: damping of a spring</b><p>Attach a card to a mass on a spring; set it oscillating and record the amplitude against a vertical scale after successive oscillations (video helps). Repeat with different card areas and compare how quickly the amplitude decays.</p></div>` },
    { h: 'Energy in SHM', html: `
<p>Energy transfers continuously between kinetic and potential. With no damping the total is constant. For a mass–spring system:</p>
<div class="box eq">$E_{total} = @frac{1}{2}kA^2 = @frac{1}{2}mv_{max}^2$</div>
<p>E<sub>k</sub> is maximum at the equilibrium position; E<sub>p</sub> is maximum at the extremes. Total energy ∝ A².</p>` },
    { h: 'Free, damped and forced oscillations', html: `
<ul><li><b>Free oscillation</b>: the system oscillates at its natural frequency with no external force acting other than the restoring force (no energy lost).</li>
<li><b>Damped oscillation</b>: resistive forces remove energy, so the amplitude decreases.</li>
<li><b>Forced oscillation</b>: an external periodic driving force makes the system oscillate at the driving frequency.</li></ul>
[[d:damping]]
<ul><li><b>Light damping</b>: amplitude decays gradually (exponentially); many oscillations.</li>
<li><b>Critical damping</b>: returns to equilibrium in the shortest possible time without oscillating (e.g. car suspension, meter needles).</li>
<li><b>Heavy damping</b>: returns slowly, without oscillating.</li></ul>` },
    { h: 'Resonance', html: `
<div class="box def"><b class="lbl">Resonance</b><p>When the driving frequency equals the natural frequency of the system, the amplitude of the forced oscillation is a maximum, because energy is transferred most efficiently from the driver.</p></div>
[[d:resonance]]
<p>Increasing the damping lowers and broadens the peak, and moves it to slightly lower frequency.</p>
<p><b>Useful</b>: tuning a radio circuit, <b>microwave cooking</b> (microwaves at a frequency that makes water molecules oscillate strongly), musical instruments. <b>Problematic</b>: bridges (Tacoma Narrows; Millennium Bridge wobble caused by pedestrians), vibrating machinery, car panels at certain engine speeds — reduced by adding damping or changing the natural frequency.</p>` }
  ],
  eqs: [['a = -ω^2x', 'definition of SHM'], ['x = A@,"cos"(ωt + ε)', 'displacement'], ['v = -Aω@,"sin"(ωt + ε)', 'velocity'], ['v_{max} = Aω,  a_{max} = Aω^2', 'maxima'], ['T = @frac{2π}{ω}', 'period'], ['T = 2π@sqrt{@frac{m}{k}}', 'mass–spring'], ['T = 2π@sqrt{@frac{l}{g}}', 'simple pendulum'], ['E = @frac{1}{2}kA^2', 'total energy (spring)']],
  worked: [

TOPICS.push({
  id: '3.3', unit: '3', title: 'Kinetic Theory', short: 'Ideal gases, pV = nRT, molecular speeds',
  summary: 'Linking the behaviour of gases to billions of molecules in random motion: the gas laws, the mole, and why temperature measures mean molecular kinetic energy.',
  spec: [
    "(a) The equation of state pV = nRT and pV = NkT",
    "(b) The assumptions of kinetic theory, including the random distribution of energy among the molecules",
    "(c) Molecular movement causes gas pressure; use p = ⅓ρc̄² = ⅓(N/V)mc̄²",
    "(d) The definition of the Avogadro constant and hence the mole",
    "(e) Molar mass M = Mr/1000 kg; n = total mass ÷ molar mass",
    "(f) Combine pV = ⅓Nmc̄² with pV = nRT: total translational KE of a mole of monatomic gas = (3/2)RT; mean KE of a molecule = (3/2)kT, k = R/N_A; T ∝ mean KE"
  ],
  learn: [
    { h: 'The mole', html: `
<p>The <b>mole</b> is the SI unit of amount of substance. One mole contains N<sub>A</sub> = 6.02 × 10<sup>23</sup> particles (the <b>Avogadro constant</b>). Molar mass M is the mass of one mole (e.g. 0.028 kg mol<sup>−1</sup> for N<sub>2</sub>).</p>
<p>The molar mass in kg is the relative molecular mass divided by 1000: $M = @frac{M_r}{1000} "kg"$ (e.g. N<sub>2</sub>, M<sub>r</sub> = 28 → M = 0.028 kg). Number of moles $n = @frac{"total mass"}{"molar mass"}$; number of molecules $N = nN_A$.</p>` },
    { h: 'The gas laws and the ideal gas equation', html: `
<ul><li><b>Boyle’s law</b>: pV = constant at constant temperature.</li>
<li><b>Charles’s law</b>: V ∝ T at constant pressure.</li>
<li><b>Pressure law</b>: p ∝ T at constant volume.</li></ul>
<p>Combined, these give the <b>ideal gas equation</b>:</p>
<div class="box eq">$pV = nRT = NkT$</div>
<p>R = 8.31 J mol<sup>−1</sup> K<sup>−1</sup> (molar gas constant); $k = R/N_A = 1.38 × 10^{-23} "J K"^{-1}$ (Boltzmann constant). T <b>must</b> be in kelvin.</p>
[[d:isotherms]]
<p>Extrapolating p against θ (°C) at constant volume to p = 0 gives <b>absolute zero</b>, about −273 °C (0 K) — the temperature at which the molecules would have minimum kinetic energy.</p>` },
    { h: 'Assumptions of kinetic theory', html: `
<ol><li>A gas consists of a very large number of molecules in continuous, random motion, with the energy <b>randomly distributed</b> among the molecules (they have a range of speeds).</li>
<li>The volume of the molecules themselves is negligible compared with the volume of the container.</li>
<li>There are no intermolecular forces except during collisions.</li>
<li>Collisions (with each other and the walls) are perfectly elastic.</li>
<li>The duration of a collision is negligible compared with the time between collisions.</li>
<li>Newton’s laws apply to the molecules.</li></ol>` },
    { h: 'How molecules cause pressure', html: `
<p>Molecules continually collide with the walls. Each collision reverses the component of a molecule’s momentum perpendicular to the wall, so the wall exerts a force on the molecule and (Newton’s 3rd law) the molecule exerts a force on the wall. Averaged over enormous numbers of collisions, this gives a steady force per unit area — the <b>pressure</b>:</p>
<div class="box eq">$p = @frac{1}{3}ρ@bar{c^2} = @frac{1}{3}@frac{N}{V}m@bar{c^2}$</div>
<p>c̄² is the <b>mean square speed</b>. The outline below shows where the equation comes from (you need to be able to use it).</p>
<p>Consider N molecules each of mass m in a cube of side l.</p>
<ol><li>A molecule with velocity component u along x hits a wall and rebounds: change of momentum = 2mu.</li>
<li>Time between hits on the same wall = 2l/u, so rate of change of momentum (force) = 2mu ÷ 2l/u = mu²/l.</li>
<li>Total force from all molecules = (m/l)Σu². Pressure = force ÷ l² = (m/l³)Σu² = (Nm/V) × mean(u²).</li>
<li>Motion is random, so mean(u²) = mean(v²) = mean(w²) and c̄² = mean(u²) + mean(v²) + mean(w²) = 3 mean(u²).</li>
<li>So $p = @frac{1}{3}@frac{Nm}{V}@bar{c^2}$, and since ρ = Nm/V: $p = @frac{1}{3}ρ@bar{c^2}$.</li></ol>` },
    { h: 'Temperature and molecular kinetic energy', html: `
<p>From $pV = @frac{1}{3}Nm@bar{c^2}$ and $pV = NkT$:</p>
<div class="box eq">$@frac{1}{2}m@bar{c^2} = @frac{3}{2}kT$</div>
<p>For one mole (N = N<sub>A</sub>): pV = RT = ⅓N<sub>A</sub>mc̄², so the <b>total translational kinetic energy of a mole</b> of a monatomic gas is $@frac{1}{2}N_Am@bar{c^2} = @frac{3}{2}RT$. Dividing by N<sub>A</sub> gives the mean KE of one molecule, (3/2)kT, with $k = R/N_A$.</p>
<p>The mean translational kinetic energy of a molecule is proportional to the absolute temperature, and is the same for all ideal gases at the same temperature. Lighter molecules therefore move faster: the <b>rms speed</b> is $c_{rms} = @sqrt{@bar{c^2}} = @sqrt{@frac{3kT}{m}}$.</p>
<p>At 300 K, nitrogen molecules have c<sub>rms</sub> ≈ 520 m s<sup>−1</sup>; hydrogen molecules about 1900 m s<sup>−1</sup>.</p>` }
  ],
  eqs: [['pV = nRT', 'ideal gas (n moles)'], ['pV = NkT', 'ideal gas (N molecules)'], ['k = @frac{R}{N_A}', 'Boltzmann constant'], ['p = @frac{1}{3}ρ@bar{c^2}', 'kinetic theory'], ['@frac{1}{2}m@bar{c^2} = @frac{3}{2}kT', 'mean KE of a molecule'], ['n = @frac{"mass"}{M}', 'moles from mass']],
  worked: [
    { q: 'How many moles and molecules are in 0.024 m³ of gas at 1.01 × 10<sup>5</sup> Pa and 20 °C?', s: ['T = 293 K.', 'n = pV/RT = 1.01 × 10<sup>5</sup> × 0.024 / (8.31 × 293) = 0.996 mol.', 'N = nN<sub>A</sub> = 6.0 × 10<sup>23</sup>.'], a: '1.0 mol; 6.0 × 10<sup>23</sup> molecules' },
    { q: 'Find the rms speed of nitrogen molecules (M = 0.028 kg mol<sup>−1</sup>) at 300 K.', s: ['m = M/N<sub>A</sub> = 0.028 / 6.02 × 10<sup>23</sup> = 4.65 × 10<sup>−26</sup> kg.', 'c<sub>rms</sub> = √(3kT/m) = √(3 × 1.38 × 10<sup>−23</sup> × 300 / 4.65 × 10<sup>−26</sup>).'], a: '517 m s<sup>−1</sup>' },
    { q: 'A sealed container of gas at 1.0 × 10<sup>5</sup> Pa is heated from 20 °C to 100 °C. Find the new pressure.', s: ['Constant V: p/T = constant.', 'p<sub>2</sub> = 1.0 × 10<sup>5</sup> × 373/293.'], a: '1.27 × 10<sup>5</sup> Pa' }
  ],
  pitfalls: ['Using °C in pV = nRT.', 'Confusing n (moles) and N (molecules), or R and k.', 'Using molar mass (per mole) as the mass of one molecule.', 'Calling c̄² the “mean speed squared”: it is the mean of the squares of the speeds.', 'Forgetting that doubling T increases c<sub>rms</sub> by √2, not 2.'],
  cards: [
    ['Value of the Avogadro constant?', '6.02 × 10<sup>23</sup> mol<sup>−1</sup>'],
    ['Ideal gas equation (moles)?', 'pV = nRT'],
    ['Ideal gas equation (molecules)?', 'pV = NkT'],
    ['k in terms of R?', 'k = R/N<sub>A</sub>'],

TOPICS.push({

  summary: 'Internal energy, heat and work, and the first law of thermodynamics — plus specific heat capacity and reading p–V diagrams.',
  spec: [
    "(a) Internal energy is the sum of the potential and kinetic energies of the molecules",

  ],
  learn: [
    { h: 'Internal energy', html: `
<div class="box def"><b class="lbl">Definition</b><p>The <b>internal energy</b> U of a system is the sum of the random kinetic energies and potential energies of all its molecules.</p></div>
<p>In an ideal gas there are no intermolecular forces, so the potential energy is zero and U is all kinetic. For a <b>monatomic</b> ideal gas (e.g. He, Ne, Ar):</p>
<div class="box eq">$U = N × @frac{3}{2}kT = @frac{3}{2}nRT$</div>
<p>U depends only on T: heat an ideal gas and its internal energy rises in proportion to its kelvin temperature.</p>
<p><b>Absolute zero</b> (0 K, −273.15 °C) is the temperature at which a system has its <b>minimum internal energy</b>.</p>` },
    { h: 'Heat, work and the first law', html: `
<ul><li><b>Heat</b> Q: energy that enters or leaves a system through its boundary (container wall) because its temperature is lower or higher than its surroundings. Heat is <b>energy in transit</b> — a system does not “contain heat”.</li>
<li><b>Work</b> W: energy can also enter or leave by work being done — for a gas, expanding against (or being compressed by) an external pressure. Work is also energy in transit.</li>
<li><b>Thermal equilibrium</b>: no net flow of heat between bodies; they are at the same temperature.</li></ul>
<div class="box def"><b class="lbl">First law of thermodynamics</b><p>$ΔU = Q - W$</p><p>ΔU = increase in internal energy, Q = heat supplied <b>to</b> the system, W = work done <b>by</b> the system.</p></div>
<p>At constant pressure, $W = pΔV$. Even if p changes, W = area under the p–V graph.</p>
<div class="box tip"><b class="lbl">Interpreting signs</b><ul><li>Q negative: heat flows <b>out</b> of the system.</li><li>W negative: work is done <b>on</b> the gas (it is compressed).</li><li>ΔU negative: the internal energy (and, for an ideal gas, the temperature) falls.</li></ul></div>
<p>For a <b>solid or liquid</b> the volume change is tiny, so W is usually negligible and <b>Q = ΔU</b>.</p>
<div class="tbl"><table><tr><th>Process</th><th>What’s zero</th><th>First law becomes</th></tr>
<tr><td>constant volume</td><td>W = 0</td><td>ΔU = Q</td></tr>
<tr><td>constant temperature (ideal gas)</td><td>ΔU = 0</td><td>Q = W</td></tr>
<tr><td>no heat exchange (fast / insulated)</td><td>Q = 0</td><td>ΔU = −W</td></tr>
<tr><td>complete cycle</td><td>ΔU = 0</td><td>net Q = net W = area enclosed by the loop</td></tr></table></div>` },
    { h: 'Specific heat capacity', html: `
<div class="box def"><b class="lbl">Definition</b><p>The <b>specific heat capacity</b> c of a substance is the energy needed to raise the temperature of 1 kg of it by 1 K (or 1 °C). $Q = mcΔθ$, unit J kg<sup>−1</sup> K<sup>−1</sup>.</p></div>
<p>Water: 4200 J kg<sup>−1</sup> K<sup>−1</sup>; aluminium ≈ 900; copper ≈ 390.</p>
<div class="box def"><b class="lbl">Specified practical: c of a solid</b><p>Insert an electrical heater and a thermometer into holes in an insulated metal block (a drop of oil improves thermal contact). Record V and I, and the temperature every 30 s. Energy supplied = VIt. Plot θ against t: in the linear region the gradient = VI/(mc), so c = VI/(m × gradient). Insulation reduces heat loss; using the gradient (not start/end values) avoids the effect of the heater warming up.</p></div>` }
  ],
  eqs: [['U = @frac{3}{2}nRT', 'monatomic ideal gas'], ['ΔU = Q - W', 'first law (W by the gas)'], ['W = pΔV', 'work at constant pressure'], ['Q = mcΔθ', 'specific heat capacity']],
  worked: [
    { q: '2.0 mol of helium is heated from 300 K to 400 K. Find the increase in internal energy.', s: ['ΔU = (3/2)nRΔT = 1.5 × 2.0 × 8.31 × 100.'], a: '2.5 kJ' },
    { q: 'A gas at a constant 1.0 × 10<sup>5</sup> Pa expands from 2.0 × 10<sup>−3</sup> m³ to 3.0 × 10<sup>−3</sup> m³ while 250 J of heat is supplied. Find W and ΔU.', s: ['W = pΔV = 1.0 × 10<sup>5</sup> × 1.0 × 10<sup>−3</sup> = 100 J (done by the gas).', 'ΔU = Q − W = 250 − 100.'], a: 'W = 100 J; ΔU = 150 J' },

TOPICS.push({
  id: '3.5', unit: '3', title: 'Nuclear Decay', short: 'α, β, γ, half-life, exponential decay',
  summary: 'Unstable nuclei decay randomly. The properties of the radiations, background radiation, and the exponential mathematics of half-life.',
  spec: [
    "(a) The spontaneous nature of nuclear decay; the nature of α, β and γ radiation; nuclear equations using ᴬ_Z X notation",

    "(f) The decay constant λ and A = λN",

  ],
  learn: [
    { h: 'The three radiations', html: `
<div class="tbl"><table><tr><th></th><th>α</th><th>β<sup>−</sup></th><th>γ</th></tr>
<tr><td>Nature</td><td>helium nucleus $^4_2"He"$</td><td>fast electron (β<sup>+</sup>: positron)</td><td>high-energy EM photon</td></tr>
<tr><td>Charge</td><td>+2e</td><td>−e (β<sup>+</sup>: +e)</td><td>0</td></tr>
<tr><td>Ionising</td><td>strongly</td><td>moderately</td><td>weakly</td></tr>
<tr><td>Range in air</td><td>a few cm</td><td>up to about 1 m</td><td>very large (intensity follows inverse square law)</td></tr>
<tr><td>Stopped by</td><td>paper / skin</td><td>a few mm of aluminium</td><td>reduced by several cm of lead</td></tr></table></div>
<p>The more strongly a radiation ionises, the faster it loses energy, so the shorter its range.</p>` },
    { h: 'Nuclear equations', html: `
<p>Nucleon number and proton number (charge) are conserved.</p>
<ul><li><b>α decay</b>: $^A_Z"X" → ^{A-4}_{Z-2}"Y" + ^4_2"α"$, e.g. $^{238}_{92}"U" → ^{234}_{90}"Th" + ^4_2"α"$.</li>
<li><b>β<sup>−</sup> decay</b> (a neutron becomes a proton): $^A_Z"X" → ^A_{Z+1}"Y" + ^0_{-1}"β" + @bar{ν}_e$.</li>
<li><b>β<sup>+</sup> decay</b> (a proton becomes a neutron): $^A_Z"X" → ^A_{Z-1}"Y" + ^0_{+1}"β" + ν_e$.</li>
<li><b>γ emission</b> often follows α or β decay as the daughter nucleus loses excess energy; A and Z are unchanged.</li></ul>` },
    { h: 'Background radiation and randomness', html: `
<p><b>Background radiation</b> is always present: radon gas from rocks (the largest source in much of the UK, especially granite areas), rocks and buildings, cosmic rays, food and drink, and medical sources. Measure the background count rate with no source present and subtract it from every reading.</p>
<p>Decay is <b>random</b> — it is impossible to predict which nucleus will decay next or when — and <b>spontaneous</b> — it is not affected by external conditions such as temperature, pressure or chemical combination. However, with huge numbers of nuclei, the fraction that decays per second is predictable.</p>` },
    { h: 'Activity, decay constant and half-life', html: `
<div class="box def"><b class="lbl">Definitions</b><ul>
<li><b>Activity</b> A: the number of nuclei decaying per second. Unit: becquerel, 1 Bq = 1 decay per second.</li>
<li><b>Decay constant</b> λ: the probability per unit time that a nucleus will decay (s<sup>−1</sup>). $A = λN$.</li>
<li><b>Half-life</b> T<sub>½</sub>: the time taken for the number of undecayed nuclei (or the activity) to halve.</li></ul></div>
<div class="box eq">$N = N_0e^{-λt}$ &nbsp;&nbsp; $A = A_0e^{-λt}$ &nbsp;&nbsp; $λ = @frac{"ln"@,2}{T_{½}}$</div>
<p><b>Deriving λ = ln 2 / T½:</b> after one half-life N = N₀/2, so ½ = e<sup>−λT½</sup>. Taking natural logs: ln 2 = λT½.</p>
[[d:decay]]
<p>After x half-lives, $N = N_0/2^x$ and $A = A_0/2^x$, where x need not be a whole number (x = t/T<sub>½</sub>). Taking logs: $"ln"@,A = "ln"@,A_0 - λt$, so a graph of ln A against t is a straight line of gradient −λ.</p>
[[d:ln-decay]]
<p>Example: carbon-14 (T<sub>½</sub> = 5730 years) dating. If a sample’s activity per gram is 25% of that of living material, two half-lives have passed: about 11 500 years.</p>` },
    { h: 'Practical work', html: `
<p><b>Dice analogy</b>: roll a large number of dice; remove those showing a six (“decayed”); record the number remaining each throw. The probability per throw is 1/6, playing the role of λ. Plot N against throw number, and ln N against throw number.</p>
<p><b>γ inverse square law</b>: measure count rate at various distances d from a γ source with a GM tube, correcting for background. Since I ∝ 1/d², plot (corrected count rate)<sup>−½</sup> against d: a straight line. Handle sources with tongs, keep them at arm’s length and minimise exposure time.</p>` }
  ],
  eqs: [['A = λN', 'activity'], ['N = N_0e^{-λt}', 'undecayed nuclei'], ['A = A_0e^{-λt}', 'activity'], ['λ = @frac{"ln"@,2}{T_{½}}', 'half-life'], ['N = @frac{N_0}{2^x}', 'x half-lives'], ['I ∝ @frac{1}{d^2}', 'γ intensity']],

<p>A <b>capacitor</b> is two conducting plates separated by an insulator. Connected to a supply, electrons are pushed onto one plate and pulled off the other, so the plates carry equal and opposite charges +Q and −Q. (“The charge on a capacitor” means Q — the net charge is zero.)</p>
<div class="box def"><b class="lbl">Definition</b><p><b>Capacitance</b> $C = @frac{Q}{V}$: charge stored per unit pd. Unit: farad, 1 F = 1 C V<sup>−1</sup>. Practical values are μF, nF or pF.</p></div>` },

<p>A = area of overlap of the plates, d = separation (vacuum or air). Larger plates hold more charge; closer plates give a larger C.</p>
<p>The field between the plates is <b>uniform</b> (except near the edges): $E = @frac{V}{d}$.</p>
<p>Inserting a <b>dielectric</b> (an insulator such as polythene) between the plates <b>increases</b> the capacitance. Its molecules become polarised in the field, creating an internal field that opposes the plates’ field; for the same charge the pd is smaller, so C = Q/V is larger.</p>` },

<p>Potential energy = qV (electric) or mV<sub>g</sub> (gravitational). Work done moving between two points: $W = qΔV$ or $W = mΔV_g$.</p>
<p>Field strength is minus the potential gradient: $E = -@frac{ΔV}{Δr}$. For a uniform field between plates, E = V/d. The area under an E–r graph gives a potential difference.</p>
<div class="box def"><b class="lbl">Near the Earth’s surface</b><p>Over heights where the variation of g is negligible, the change in gravitational potential energy is simply $ΔU_P = mgΔh$ — the Unit 1 result is a special case of mΔV<sub>g</sub>.</p></div>` },

<div class="tbl"><table><tr><th></th><th>Electric (point charge)</th><th>Gravitational (point mass)</th></tr>

<tr><td>Field strength</td><td>E = Q/4πε<sub>0</sub>r²</td><td>g = GM/r²</td></tr>
<tr><td>Potential</td><td>V = Q/4πε<sub>0</sub>r (+ or −)</td><td>V<sub>g</sub> = −GM/r (always −)</td></tr>
<tr><td>Nature</td><td>attractive or repulsive</td><td>attractive only</td></tr>
<tr><td>Similarities</td><td colspan="2">inverse-square force; 1/r potential; field lines radial; potential is zero at infinity</td></tr></table></div>
<p>Between two protons, the electric force is about 10<sup>36</sup> times the gravitational force.</p>` }

TOPICS.push({
  id: '4.3', unit: '4', title: 'Orbits and the Wider Universe', short: 'Kepler, dark matter, Hubble, binaries',
  summary: 'From planetary orbits to the expanding universe: Kepler’s laws, orbital mechanics, dark matter, the Doppler effect, exoplanets and cosmology.',
  spec: [
    "(a) Kepler’s three laws of planetary motion",
    "(b) Newton’s law of gravitation in simple examples, including planets and satellites",
    "(c) Derive Kepler’s 3rd law for a circular orbit from Newton’s law of gravitation and centripetal acceleration",
    "(d) Use orbital data (period or orbital speed) to find the mass of the central object",
    "(e) How orbital speeds of objects in spiral galaxies imply dark matter",
    "(f) How the recently discovered Higgs boson may be related to dark matter",
    "(g) Position of the centre of mass of two spherically symmetric objects, and their mutual orbital period for circular orbits",
    "(h) The Doppler relationship Δλ/λ = v/c",
    "(i) Determine a star’s radial velocity from the Doppler shift of spectral lines",
    "(j) Use radial-velocity data for a double system (e.g. star and exoplanet) and the orbital period to find the masses (circular orbit, edge on)",
    "(k) The Hubble constant: v = H₀D",
    "(l) Why 1/H₀ approximates the age of the universe",
    "(m) Derive ρc = 3H₀²/8πG for a flat universe using conservation of energy"
  ],
  learn: [
    { h: 'Kepler’s laws', html: `
<ol><li>Each planet moves in an <b>ellipse</b> with the Sun at one focus.</li>
<li>The line joining a planet to the Sun sweeps out <b>equal areas in equal times</b>. (So a planet moves fastest when closest to the Sun.)</li>
<li>The square of the orbital period is proportional to the cube of the semi-major axis (mean radius): <b>T² ∝ r³</b>.</li></ol>` },
    { h: 'Circular orbits', html: `
<p>Gravity provides the centripetal force: $@frac{GMm}{r^2} = mω^2 r = m(@frac{2π}{T})^2 r$</p>
<div class="box eq">$T^2 = @frac{4π^2}{GM}r^3$ &nbsp;&nbsp;&nbsp; $v = @sqrt{@frac{GM}{r}}$</div>
<p>This is Kepler’s third law, and it lets us “weigh” a central body from any satellite’s period and radius. The satellite’s own mass cancels.</p>
<p>A <b>geostationary</b> satellite orbits above the equator with a period of 24 h, radius ≈ 4.2 × 10<sup>7</sup> m, so it stays above the same point on Earth.</p>` },
    { h: 'Dark matter', html: `
[[d:rotation-curve]]
<p>If most of a galaxy’s mass were in the bright central bulge, stars far out should orbit more slowly, with v ∝ 1/√r. Observed rotation curves (from Doppler shifts of stars and hydrogen gas) stay roughly <b>flat</b> out to large radii.</p>
<div class="box why"><b class="lbl">Dark matter and the Higgs boson</b><p>Dark matter does not emit or absorb light, so it is thought to be made of particles that interact only through gravity (and perhaps the weak interaction). The Higgs boson, discovered at the Large Hadron Collider in 2012, is associated with the field that gives fundamental particles their mass. One proposal is that dark-matter particles gain their mass through the Higgs field, so Higgs bosons might decay into dark-matter particles — searches at the LHC look for such “invisible” decays.</p></div>
<p>From $v = @sqrt{GM/r}$, the mass inside radius r is $M = @frac{v^2 r}{G}$. A flat curve means M keeps increasing in proportion to r beyond the visible edge. The extra, invisible mass is called <b>dark matter</b>. Most of a galaxy’s mass appears to be dark matter.</p>` },
    { h: 'Doppler shift, binaries and exoplanets', html: `
<div class="box eq">$@frac{Δλ}{λ} = @frac{v}{c}$ &nbsp; (for v ≪ c; v = radial velocity)</div>
<p>Receding sources are <b>red-shifted</b> (λ increases); approaching sources are blue-shifted.</p>
<p>In a <b>binary system</b>, two bodies orbit their common <b>centre of mass</b> with the same period. The centre of mass satisfies $m_1r_1 = m_2r_2$, so the more massive body moves in a smaller circle, more slowly. For separation d:</p>
<div class="box eq">$T = 2π@sqrt{@frac{d^3}{G(M_1 + M_2)}}$</div>
<p>The <b>radial velocity</b> of a star is the component of its velocity along the line joining it to an observer on Earth; it is found from the Doppler shift of its spectral lines.</p>
<h4>Finding the masses in a double system</h4><p>For a circular orbit seen edge on, each body’s radial velocity varies sinusoidally with the orbital period T. The maximum radial velocities v₁ and v₂ are the orbital speeds, so:</p><ol><li>orbit radii r₁ = v₁T/2π and r₂ = v₂T/2π; separation d = r₁ + r₂;</li><li>total mass from $M_1 + M_2 = @frac{4π^2d^3}{GT^2}$;</li><li>mass ratio from the centre of mass: $@frac{M_1}{M_2} = @frac{r_2}{r_1} = @frac{v_2}{v_1}$.</li></ol>
<p><b>Exoplanets</b>: a planet and its star orbit their common centre of mass, so the star “wobbles”. Its spectral lines shift periodically — red then blue — with the planet’s orbital period. Knowing the star’s mass, Kepler’s third law gives the planet’s orbit radius, hence its orbital speed; then $M_{planet} = M_{star} v_{star}/v_{planet}$.</p>` },
    { h: 'Hubble’s law and the expanding universe', html: `
<div class="box def"><b class="lbl">Hubble’s law</b><p>The recession velocity of a distant galaxy is proportional to its distance: $v = H_0 D$. H<sub>0</sub> ≈ 2.2 × 10<sup>−18</sup> s<sup>−1</sup> (≈ 68 km s<sup>−1</sup> Mpc<sup>−1</sup>).</p></div>
<p>The redshift of almost all distant galaxies shows the universe is expanding. Running the expansion backwards at a constant rate, all galaxies were together at time $t ≈ 1/H_0 ≈ 14$ billion years — an estimate of the age of the universe.</p>
<h4>Critical density</h4>
<p>Consider a galaxy of mass m at the edge of a sphere of radius r and density ρ, moving at v = H<sub>0</sub>r. It just escapes to infinity if its total energy is zero: $@frac{1}{2}mv^2 = @frac{GMm}{r}$ with $M = @frac{4}{3}πr^3ρ$. Substituting:</p>
<div class="box eq">$ρ_c = @frac{3H_0^2}{8πG}$ ≈ 9 × 10<sup>−27</sup> kg m<sup>−3</sup></div>
<p>If the mean density is greater than ρ<sub>c</sub>, gravity would eventually stop the expansion; if less, it would expand forever.</p>` }
  ],
  eqs: [['T^2 = @frac{4π^2}{GM}r^3', 'Kepler 3 (circular orbit)'], ['v = @sqrt{@frac{GM}{r}}', 'orbital speed'], ['M = @frac{v^2r}{G}', 'mass inside orbit'], ['@frac{Δλ}{λ} = @frac{v}{c}', 'Doppler'], ['T = 2π@sqrt{@frac{d^3}{G(M_1 + M_2)}}', 'binary system'], ['v = H_0D', 'Hubble'], ['ρ_c = @frac{3H_0^2}{8πG}', 'critical density']],
  worked: [

<div class="box def"><b class="lbl">The tesla</b><p>Magnetic flux density B is 1 T when a wire of length 1 m carrying 1 A at right angles to the field experiences a force of 1 N. 1 T = 1 N A<sup>−1</sup> m<sup>−1</sup>.</p></div>

<div class="box def"><b class="lbl">Key result</b><p>For a constant current, <b>V<sub>H</sub> ∝ B</b>. A larger B deflects carriers more strongly, so a larger pd is needed to balance it.</p></div>

<p>The flux is maximum when the coil’s plane is perpendicular to the field (θ = 0) and zero when the plane is parallel to the field.</p>` },
    { h: 'Faraday’s and Lenz’s laws', html: `
<div class="box def"><b class="lbl">Faraday’s law</b><p>The induced emf is equal to the rate of change of magnetic flux linkage: $E = -@frac{Δ(NΦ)}{Δt}$.</p></div>
<div class="box def"><b class="lbl">Lenz’s law</b><p>The direction of the induced emf (current) is such as to oppose the change that produces it.</p></div>
<p>Lenz’s law is a consequence of <b>conservation of energy</b>. If the induced current helped the change, it would produce more current from nothing — energy would be created. Instead, work must be done against the opposing force, and that work becomes the electrical energy.</p>
<p>Examples: push a north pole into a coil and the coil’s near end becomes a north pole, repelling the magnet. A magnet dropped down a copper pipe falls slowly because eddy currents induced in the pipe oppose its motion. Eddy-current brakes on trains and rollercoasters work the same way.</p>
<p>On a graph of flux linkage against time, the magnitude of the induced emf is the <b>gradient</b>.</p>` },
    { h: 'A moving straight conductor', html: `
<p>A rod of length l moves at speed v perpendicular to a field B. In time Δt it sweeps an area lvΔt, so the flux cut is BlvΔt:</p>
<div class="box eq">$E = Blv$</div>
<p>If the rod is part of a complete circuit, the induced current experiences a force BIl opposing the motion (Lenz). The mechanical power needed to keep it moving, Fv = BIlv = EI, equals the electrical power generated.</p>
<p>Example: an aircraft with a 30 m wingspan flying at 250 m s<sup>−1</sup> through a vertical field component of 4.0 × 10<sup>−5</sup> T has an emf of 0.30 V between its wingtips.</p>` },

<p>When a flat coil of N turns and area A rotates at angular velocity ω in a uniform field B, the angle between the coil’s normal and the field keeps changing, so its flux linkage changes and an emf is induced (this is how an a.c. generator works).</p>
<ul><li><b>Coil plane perpendicular to B</b> (normal parallel to B): flux linkage is <b>maximum</b> but momentarily not changing, so the emf is <b>zero</b>.</li>
<li><b>Coil plane parallel to B</b>: flux linkage is <b>zero</b> but changing fastest, so the emf is <b>maximum</b>.</li>
<li>The emf alternates sinusoidally. Its peak value is larger if B, the coil area, the number of turns or the angular velocity is increased (and a faster rotation also increases the frequency).</li></ul>
<div class="box tip"><b class="lbl">Link</b><p>The quantitative treatment (V = ωBAN sin ωt) is part of Option A, Alternating Currents.</p></div>` }

<p>A flat coil of N turns and area A rotates at constant angular velocity ω in a uniform field B. The angle between the coil’s normal and the field is θ = ωt, so the flux linkage is</p>
<div class="box eq">$NΦ = BAN@,"cos"@,ωt$</div>
<p>By Faraday’s law the induced emf is minus the rate of change of flux linkage, which gives</p>
<div class="box eq">$V = ωBAN@,"sin"@,ωt$</div>
<p>The peak emf is V₀ = ωBAN (when the coil plane is parallel to B), and the frequency is f = ω/2π. So $V_{rms} = @frac{BANω}{@sqrt{2}}$.</p>` },
    { h: 'Describing ac', html: `
<p>A sinusoidal alternating pd: $V = V_0@,"sin"@,2πft$. V<sub>0</sub> is the peak value; peak-to-peak = 2V<sub>0</sub>; period T = 1/f. UK mains: 230 V rms, 50 Hz.</p>
[[d:ac-rms]]
<div class="box def"><b class="lbl">Root mean square</b><p>The <b>rms value</b> of an alternating current is the value of the steady direct current that would dissipate energy at the same rate in a given resistor. For a sinusoid:</p><p style="text-align:center">$V_{rms} = @frac{V_0}{@sqrt{2}}$ &nbsp;&nbsp; $I_{rms} = @frac{I_0}{@sqrt{2}}$</p></div>
<p>Mean power in a resistor: $P = I_{rms}V_{rms} = I_{rms}^2R = @frac{1}{2}I_0V_0$. Peak power is I<sub>0</sub>V<sub>0</sub>, twice the mean.</p>
<div class="box def"><b class="lbl">The oscilloscope</b><p>Vertical: Y-gain (V/div) × number of divisions → pd (for ac read the peak or peak-to-peak height; for dc the trace is a horizontal line displaced from zero). Horizontal: time-base (s/div or ms/div) × divisions for one cycle → period T; f = 1/T. A current is measured as the pd across a known resistor (I = V/R). A PC-based oscilloscope (via USB or sound card) works in the same way.</p></div>` },

<p><b>Capacitor</b>: charge flows on and off the plates each half-cycle, so ac “passes”. Its opposition is the <b>capacitive reactance</b> $X_C = @frac{V_{rms}}{I_{rms}} = @frac{1}{ωC} = @frac{1}{2πfC}$ (Ω). The current <b>leads</b> the pd by 90° (π/2). X<sub>C</sub> falls as f rises.</p>
<p><b>Inductor</b>: a changing current induces a back emf (self-induction) that opposes the change. <b>Inductive reactance</b> $X_L = @frac{V_{rms}}{I_{rms}} = ωL = 2πfL$ (Ω), where L is the inductance (henry, H). The current <b>lags</b> the pd by 90°. X<sub>L</sub> rises with f.</p>
<p>In a resistor, pd and current are in phase. The <b>mean power</b> dissipated in an ideal inductor or capacitor is <b>zero</b>: energy is stored and returned each cycle.</p>
<p>Phasor treatment of <b>RC</b> and <b>RL</b> circuits is the same as RCL with the missing component’s pd set to zero: e.g. RC: $V^2 = V_R^2 + V_C^2$, $Z = @sqrt{R^2 + X_C^2}$.</p>` },
    { h: 'Series RCL circuits and phasors', html: `
<p>In series the <b>current</b> is common to all components, so draw it as the reference phasor. V<sub>R</sub> is in phase with I; V<sub>L</sub> leads by 90°; V<sub>C</sub> lags by 90°. The supply pd is the phasor sum:</p>
<div class="box eq">$V^2 = V_R^2 + (V_L - V_C)^2$ &nbsp;&nbsp; $Z = @sqrt{R^2 + (X_L - X_C)^2}$</div>
<p>Impedance Z = V/I (rms or peak). The phase angle between supply pd and current: $"tan"@,φ = @frac{X_L - X_C}{R}$.</p>
<div class="box warn"><b class="lbl">Watch out</b><p>The component rms pds do <b>not</b> add arithmetically to the supply rms pd — they are out of phase. V<sub>L</sub> or V<sub>C</sub> can even be larger than the supply pd.</p></div>` },
    { h: 'Resonance', html: `
<p>At the resonant frequency X<sub>L</sub> = X<sub>C</sub>, so Z = R (minimum), the current is maximum and in phase with the supply pd:</p>
<p><b>Deriving it:</b> resonance occurs when X<sub>L</sub> = X<sub>C</sub>: ω₀L = 1/ω₀C, so ω₀² = 1/LC and</p>
<div class="box eq">$f_0 = @frac{1}{2π@sqrt{LC}}$</div>
[[d:lcr-res]]
<p>The <b>Q factor</b> measures the sharpness of resonance: $Q = @frac{V_L}{V_R} = @frac{V_C}{V_R} = @frac{2πf_0L}{R}$ at resonance. A small R gives a large Q and a sharp peak — good selectivity when tuning a radio to one station while rejecting neighbouring frequencies.</p>` }

TOPICS.push({
  id: 'B', unit: 'O', title: 'Medical Physics', short: 'X-rays, ultrasound, MRI, dosimetry',
  summary: 'Option B: imaging the body with X-rays, CT, ultrasound and MRI; measuring radiation dose; and diagnosis with radioactive tracers.',
  spec: [
    "(a) The nature and properties of X-rays",
