<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectra Physics</title>
<meta name="description" content="Spectra: an interactive study app for the WJEC AS and A level Physics specification — notes, simulations, flashcards, quizzes, unlimited calculations and exam practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* ==========================================================
   Spectra · WJEC A-Level Physics
   Tokens: light = graph paper, dark = observatory night
   ========================================================== */
:root{
  --paper:#EDF1F3;
  --paper-2:#E3E9ED;
  --grid:#D5DEE4;
  --grid-2:#C4D0D8;
  --surface:#FFFFFF;
  --surface-2:#F6F8F9;
  --ink:#13202B;
  --ink-2:#2B3A47;
  --muted:#5B6C79;
  --faint:#8A99A5;
  --line:#D3DCE2;
  --line-2:#BAC7D0;
  --accent:#E39B12;          /* sodium D line 589 nm */
  --accent-ink:#8F5A00;
  --accent-soft:#FBEBC8;
  --good:#1F8A4C; --good-soft:#DDF3E5;
  --bad:#C4372F;  --bad-soft:#FBE2DF;
  --warn:#B7791F; --warn-soft:#FCEFD6;
  --info:#1C6FA8; --info-soft:#DCEBF6;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 4px 16px rgba(19,32,43,.06);
  --shadow-lg:0 12px 40px rgba(19,32,43,.16);
  --canvas-bg:#FBFCFD;
  --canvas-grid:#E4EAEE;
  --canvas-ink:#13202B;
  --u1:#E5484D; --u2:#F2A516; --u3:#3DAE5B; --u4:#16A3C6; --u5:#7B5BD6; --u6:#5B6C79;
  --uc:var(--accent);
  --r:10px; --r-lg:16px;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",Times,serif;
  --side:256px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1017; --paper-2:#0E151E; --grid:#141E29; --grid-2:#1B2735;
    --surface:#111A24; --surface-2:#16212D; --ink:#E4ECF2; --ink-2:#C5D1DB;
    --muted:#8C9DAB; --faint:#627383; --line:#1F2C3A; --line-2:#2B3B4C;
    --accent:#FFB547; --accent-ink:#FFC56E; --accent-soft:#3A2A0E;
    --good:#4CC67A; --good-soft:#12301F; --bad:#FF6B61; --bad-soft:#3A1614;
    --warn:#F2B34C; --warn-soft:#352812; --info:#5AB0EA; --info-soft:#10283A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
    --shadow-lg:0 16px 50px rgba(0,0,0,.5);
    --canvas-bg:#0C131B; --canvas-grid:#18232F; --canvas-ink:#E4ECF2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1017; --paper-2:#0E151E; --grid:#141E29; --grid-2:#1B2735;
  --surface:#111A24; --surface-2:#16212D; --ink:#E4ECF2; --ink-2:#C5D1DB;
  --muted:#8C9DAB; --faint:#627383; --line:#1F2C3A; --line-2:#2B3B4C;
  --accent:#FFB547; --accent-ink:#FFC56E; --accent-soft:#3A2A0E;
  --good:#4CC67A; --good-soft:#12301F; --bad:#FF6B61; --bad-soft:#3A1614;
  --warn:#F2B34C; --warn-soft:#352812; --info:#5AB0EA; --info-soft:#10283A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
  --shadow-lg:0 16px 50px rgba(0,0,0,.5);
  --canvas-bg:#0C131B; --canvas-grid:#18232F; --canvas-ink:#E4ECF2;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
[hidden]{display:none!important}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:18px 14px 20px;
  scrollbar-width:thin;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#0A1017;position:relative;overflow:hidden;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand-mark i{position:absolute;top:5px;bottom:5px;width:2px;border-radius:1px;filter:drop-shadow(0 0 3px currentColor)}
.brand-name{font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand-sub{font:500 10.5px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a,.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;
  color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;text-align:left
}
.nav a:hover,.nav button:hover{background:var(--surface-2)}
.nav a.on{background:var(--paper-2);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .unit-a{align-items:flex-start}
.unit-line{width:3px;align-self:stretch;border-radius:2px;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.unit-a small{display:block;font:500 11px/1.3 var(--f-mono);color:var(--faint);letter-spacing:.03em}
.nav .meter{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--faint);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;gap:10px;padding:10px 28px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.crumbs{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.crumbs b{color:var(--ink);font-weight:600}
.search-btn{display:flex;align-items:center;gap:8px;min-width:220px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
.search-btn:hover{border-color:var(--line-2)}
.search-btn kbd{margin-left:auto}
kbd{font:500 11px var(--f-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{padding:28px 28px 80px;max-width:1240px;width:100%;margin:0 auto}
.view.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Mobile ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:60;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,10,15,.45);z-index:55}
  .top{padding:8px 16px}
  .search-btn{min-width:0;flex:none}
  .search-btn span,.search-btn kbd{display:none}
  .view{padding:18px 16px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10.5px var(--f-body);color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabbar a.on{color:var(--ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .hide-m{display:none!important}
}
@media (min-width:901px){.menu-btn{display:none!important}}

/* ---------- Type ---------- */
h1,h2,h3,h4{text-wrap:balance;margin:0}
.display{font:800 clamp(38px,6vw,68px)/.92 var(--f-display);letter-spacing:.005em;text-transform:uppercase}
.h2{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.h3{font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font:600 11.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;color:var(--ink-2);max-width:62ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.sec-head .h2,.sec-head .h3{flex:none}
.sec-head .muted{font-size:14px}

/* ---------- Math ---------- */
.m{font-family:var(--f-math);font-size:1.08em;white-space:nowrap;letter-spacing:.01em}
.m i{font-style:italic;padding-right:.04em}
.m .rm{font-style:normal}
.m sub,.m sup{font-size:.7em;line-height:0}
.m sub{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.15}
.fr>.nu{border-bottom:1px solid currentColor;padding:0 .15em}
.fr>.de{padding:0 .15em}
.sq{position:relative;display:inline-block;padding-left:.66em;white-space:nowrap}
.sq .rs{position:absolute;left:0;top:0;width:.66em;height:100%;overflow:visible;fill:none;stroke:currentColor}
.sq .rs path{stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}
.sq .ra{display:inline-block;border-top:1.3px solid currentColor;padding:.14em .1em 0 .06em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ov{text-decoration:overline}
.eqbig .m{font-size:1.4em}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1B1203}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--uc);border-radius:3px;transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--f-mono);letter-spacing:.02em;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--uc);box-shadow:0 0 6px var(--uc);flex:none}

/* ---------- Home ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#070B10;color:#E8EEF3;padding:30px 30px 26px;border:1px solid #1B2632;box-shadow:var(--shadow-lg)}
.hero canvas.spec{display:block;width:100%;height:120px;border-radius:10px;margin-top:22px;background:#020406}
.hero .display{color:#F3F6F8}
.hero .eyebrow{color:#8FA2B1}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:end}
.hero p{color:#B9C6D0;max-width:52ch;margin:12px 0 0}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px}
.hstat b{display:block;font:800 32px/1 var(--f-display);color:#fff;font-variant-numeric:tabular-nums}
.hstat span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#8FA2B1}
.spec-axis{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:#6D8091;margin-top:6px;letter-spacing:.05em}
.hero .btn{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff}
.hero .btn.accent{background:#FFB547;border-color:#FFB547;color:#1B1203}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding:22px 18px}}

.unit-card{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:18px 18px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.unit-card:hover{transform:translateY(-2px);border-color:var(--uc)}
.unit-card .line{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.unit-card .nm{font:500 11px var(--f-mono);color:var(--muted)}
.unit-card .h3{font-size:22px}

.topic-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--uc);transform:translateY(-1px)}
.tcard .no{grid-row:span 3;font:800 30px/1 var(--f-display);color:var(--uc);min-width:52px}
.tcard .tt{font-weight:600;font-size:15px;line-height:1.3}
.tcard .ts{font-size:12.5px;color:var(--muted);line-height:1.4}
.tcard .bar{margin-top:6px}

/* ---------- Topic page ---------- */
.topic-head{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:end;margin-bottom:18px}
.topic-no{grid-row:span 2;font:800 clamp(64px,10vw,112px)/.8 var(--f-display);color:var(--uc);text-shadow:0 0 30px color-mix(in srgb,var(--uc) 35%,transparent)}
.topic-head .display{font-size:clamp(32px,5vw,54px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--uc);box-shadow:0 0 8px var(--uc)}
.tab .n{font:500 11px var(--f-mono);color:var(--faint)}
.layout-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:1100px){.layout-2{grid-template-columns:1fr}}
.aside{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.aside{position:static}}

/* notes */
.notes{max-width:74ch}
.notes section{margin-bottom:34px;scroll-margin-top:130px}
.notes h3{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.notes h3 .k{font:600 12px var(--f-mono);color:var(--uc);letter-spacing:.06em}
.notes h4{font-size:16px;margin:18px 0 6px}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin:4px 0}
.notes table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;width:100%}
.notes th,.notes td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.notes th{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0 14px}
.tbl table{margin:0}
.box{position:relative;border-radius:12px;padding:14px 16px 12px;margin:14px 0;background:var(--surface);border:1px solid var(--line)}
.box>b.lbl{display:inline-block;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.def{border-left:3px solid var(--uc)}
.box.def>b.lbl{color:var(--uc)}
.box.tip{background:var(--accent-soft);border-color:transparent}
.box.tip>b.lbl{color:var(--accent-ink)}
.box.warn{background:var(--bad-soft);border-color:transparent}
.box.warn>b.lbl{color:var(--bad)}
.box.eq{text-align:center;font-size:18px;padding:18px}
.box.why{background:var(--info-soft);border-color:transparent}
.box.why>b.lbl{color:var(--info)}
.fig{margin:16px 0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;font-size:13.5px}
.toc a:hover{color:var(--ink);border-color:var(--uc)}

.spec-list{display:flex;flex-direction:column;gap:6px}
.spec-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.45;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.rag{display:flex;gap:3px;margin-top:1px}
.rag button{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-2);background:none;padding:0}
.rag button.on[data-v="1"]{background:var(--bad);border-color:var(--bad)}
.rag button.on[data-v="2"]{background:var(--warn);border-color:var(--warn)}
.rag button.on[data-v="3"]{background:var(--good);border-color:var(--good)}

.eq-row{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 16px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.eq-row:last-child{border:0}
.eq-row .m{font-size:1.2em}
.eq-row span.d{font-size:13px;color:var(--muted)}
.eq-tag{font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--paper-2);color:var(--muted);margin-left:6px;vertical-align:middle}
.eq-tag.nb{background:var(--warn-soft);color:var(--warn)}

/* worked */
.worked{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:16px}
.worked .wq{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.worked ol{margin:0;padding:12px 18px 12px 42px}
.worked li{margin:6px 0}
.worked li.hid{display:none}
.worked .wf{display:flex;gap:10px;padding:10px 18px 14px;align-items:center;flex-wrap:wrap}
.ans{font-weight:600;padding:8px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:760px}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.q-prog{flex:1;min-width:120px;display:flex;gap:3px}
.q-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.q-prog i.c{background:var(--good)} .q-prog i.w{background:var(--bad)} .q-prog i.cur{background:var(--uc)}
.q-text{font-size:19px;line-height:1.5;margin:6px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;line-height:1.45;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--line-2);transform:translateX(2px)}
.opt .k{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--paper-2);font:600 13px var(--f-mono)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.explain b.v{font:700 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.explain b.v.good{color:var(--good)} .explain b.v.bad{color:var(--bad)}
.result{text-align:center;padding:30px 20px}
.result .big{font:800 88px/1 var(--f-display);color:var(--uc)}

/* calc practice */
.calc-q{font-size:17.5px;line-height:1.55;margin-bottom:14px}
.calc-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc-in input{width:200px;max-width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font:500 17px var(--f-mono)}
.calc-in input:focus{outline:none;border-color:var(--uc)}
.calc-in .unit{font-family:var(--f-math);font-size:17px}
.steps{margin-top:14px;padding:14px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.steps ol{margin:6px 0 0;padding-left:20px}
.steps li{margin:5px 0}

/* exam */
.examq{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.examq .eh{display:flex;gap:12px;padding:16px 18px;align-items:flex-start}
.examq .eh .mk{margin-left:auto;flex:none}
.examq textarea{display:block;width:calc(100% - 36px);margin:0 18px 12px;min-height:90px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);resize:vertical;font-size:14.5px}
.ms{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px;cursor:pointer}
.ms input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}

/* flashcards */
.fc-stage{perspective:1400px;max-width:640px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:19px;line-height:1.5;overflow:auto}
.fc>div .eyebrow{position:absolute;top:18px;left:0;right:0}
.fc .back{transform:rotateY(180deg);background:var(--surface-2)}
.fc .front::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.fc-ctl{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.boxes{display:flex;gap:6px;justify-content:center;margin-top:14px}
.boxes span{font:500 11px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--paper-2);color:var(--muted)}

/* ---------- Sims ---------- */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sim-stage{position:relative;background:var(--canvas-bg);min-height:360px;border-right:1px solid var(--line)}
.sim-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.sim-ctl{padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.sim-title{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px;gap:8px}
.ctl label output{font:600 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:10px;background:var(--paper-2)}
.seg button{flex:1;padding:6px 8px;border:0;border-radius:7px;background:none;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.ro span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ro b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sim-note{font-size:13px;color:var(--ink-2);line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.sim-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
@media (max-width:900px){.sim{grid-template-columns:1fr}.sim-stage{border-right:0;border-bottom:1px solid var(--line);min-height:300px}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--uc) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--uc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--uc);margin-top:-7px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--uc)}
select{padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)}

/* ---------- Search palette ---------- */
.palette-back{position:fixed;inset:0;background:rgba(5,10,15,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.palette{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;background:none;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:55vh;overflow-y:auto}
.palette li a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none}
.palette li a.sel,.palette li a:hover{background:var(--surface-2)}
.palette li .t{font-weight:500}
.palette li .s{font-size:12.5px;color:var(--muted)}
.palette .kind{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---------- Toast & fx ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
@media (max-width:900px){.toasts{bottom:84px;right:12px;left:12px;align-items:stretch}}
.toast{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow-lg);font-size:14px;animation:tin .3s ease}
.toast b{font:800 18px var(--f-display);color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:150;width:100%;height:100%}

/* ---------- Arcade ---------- */
.game-card{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .15s}
.game-card:hover{transform:translateY(-2px)}
.game-card .art{height:110px;border-radius:12px;background:#070B10;position:relative;overflow:hidden}
.game-card .art canvas{width:100%;height:100%;display:block}
.game{max-width:760px;margin:0 auto}
.game-hud{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hud{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:90px}
.hud span{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud b{font:800 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.big-prompt{font:700 clamp(26px,4vw,38px)/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:10px 0 20px;text-align:center}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.quark-bin{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.quark{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:600 26px var(--f-math);font-style:italic;border:2px solid;background:var(--surface);transition:transform .1s}
.quark:hover{transform:scale(1.06)}
.quark small{display:block;font:500 10.5px var(--f-mono);font-style:normal;margin-top:-18px}
.hadron{min-height:120px;display:flex;gap:12px;justify-content:center;align-items:center;border:2px dashed var(--line-2);border-radius:60px;padding:16px;margin:0 auto;max-width:360px}

/* ---------- Equation sheet ---------- */
.eq-section{break-inside:avoid;margin-bottom:18px}
.eq-cols{columns:2 420px;column-gap:22px}
.eq-card{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px;display:inline-block;width:100%}
.eq-card h4{font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px;display:flex;align-items:center;gap:8px}
.const-table{width:100%;border-collapse:collapse;font-size:14px}
.const-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
.const-table td:last-child{font-family:var(--f-mono);font-size:13px;white-space:nowrap}

/* misc */
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.kbd-hint{font-size:12px;color:var(--faint);margin-top:10px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;opacity:.45;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--accent)}
.badge .ic{font:800 30px var(--f-display);color:var(--accent-ink)}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.heat a{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font:600 10.5px var(--f-mono);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.prac{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
.prac summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.prac summary::-webkit-details-marker{display:none}
.prac summary .pno{font:800 20px var(--f-display);color:var(--uc);min-width:44px}
.prac[open] summary{border-bottom:1px solid var(--line)}
.prac .pb{padding:14px 18px}
.prac .pb h5{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.prac .pb h5:first-child{margin-top:0}
.prac .pb ul,.prac .pb ol{margin:0;padding-left:20px}
.chev{margin-left:auto;transition:transform .2s;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.prac[open] .chev{transform:rotate(180deg)}
.note-strip{font-size:12.5px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed var(--line-2);margin-top:24px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* fixes */
.search-btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.search-btn span{white-space:nowrap}
.tab{text-decoration:none}
.lc{text-transform:none;letter-spacing:.02em}
@media (max-width:640px){.spec-axis span:nth-child(2){display:none}}

TOPICS.push({
  id: '1.2', unit: '1', title: 'Kinematics', short: 'Describing motion, suvat, projectiles',
  summary: 'Describing motion with displacement, velocity and acceleration: graphs, the equations of uniformly accelerated motion, free fall and projectiles.',
  spec: [
    "(a) Displacement, and mean and instantaneous values of speed, velocity and acceleration",
    "(b) Represent displacement, speed, velocity and acceleration graphically",
    "(c) Properties of displacement–time and velocity–time graphs; interpret speed and displacement–time graphs for non-uniform acceleration",
    "(d) Derive and use the equations for uniformly accelerated motion in a straight line",
    "(e) Bodies falling in a gravitational field with and without air resistance — terminal velocity",
    "(f) The independence of vertical and horizontal motion of a body moving freely under gravity",
    "(g) Motion with uniform velocity in one direction and uniform acceleration in a perpendicular direction; simple calculations"
  ],
  learn: [
    { h: 'Definitions', html: `
<div class="box def"><b class="lbl">Definitions</b><ul>
<li><b>Displacement</b> — the distance in a straight line from a fixed point in a specified direction (vector).</li>
<li><b>Mean speed</b> = total distance ÷ total time (scalar). <b>Instantaneous speed</b> is the rate of change of distance at one instant.</li>
<li><b>Velocity</b> = rate of change of displacement (vector).</li>
<li><b>Acceleration</b> = rate of change of velocity (vector), unit m s<sup>−2</sup>.</li></ul></div>
<p>A runner completing one lap of a 400 m track in 50 s has mean speed 8.0 m s<sup>−1</sup> but mean velocity zero, because the displacement is zero.</p>` },
    { h: 'Motion graphs', html: `
<p>Two rules cover almost everything:</p>
<ul><li>Gradient of a displacement–time graph = velocity. For a curve, draw a tangent to find the instantaneous value.</li>
<li>Gradient of a velocity–time graph = acceleration. <b>Area</b> under a velocity–time graph = displacement.</li></ul>
[[d:st-graph]]
[[d:vt-area]]
<p>For <b>non-uniform acceleration</b> the graphs are curves: the instantaneous velocity is the gradient of the <b>tangent</b> to a displacement–time curve (which differs from the mean velocity over an interval), and the displacement is still the area under the velocity–time curve — estimate it by counting squares.</p>
<div class="box tip"><b class="lbl">Exam tip</b><p>When calculating an area under a v–t graph, split it into rectangles and triangles, and read the scales carefully (km h<sup>−1</sup> or minutes are common traps).</p></div>` },
    { h: 'Equations of uniformly accelerated motion', html: `
<p>For <b>constant acceleration</b> in a straight line, with u = initial velocity, v = final velocity, a = acceleration, t = time and x = displacement:</p>
<div class="box eq">$v = u + at$ &nbsp;&nbsp; $x = @frac{1}{2}(u + v)t$ &nbsp;&nbsp; $x = ut + @frac{1}{2}at^2$ &nbsp;&nbsp; $v^2 = u^2 + 2ax$</div>
<h4>Where they come from</h4>
<p>From the definition of acceleration, $a = (v - u)/t$, so $v = u + at$. The v–t graph is a straight line, so the displacement (area) is the average velocity × time: $x = @frac{1}{2}(u + v)t$. Substituting for v gives $x = ut + @frac{1}{2}at^2$; eliminating t gives $v^2 = u^2 + 2ax$.</p>
<div class="box tip"><b class="lbl">Method</b><p>List s, u, v, a, t. Mark the one you want and the three you know, then pick the equation that contains exactly those four. Choose a positive direction and stick to it (e.g. up = positive so g = −9.81 m s<sup>−2</sup>).</p></div>` },
    { h: 'Free fall and terminal velocity', html: `
<p>Near the Earth’s surface, with negligible air resistance, all bodies fall with the same acceleration g = 9.81 m s<sup>−2</sup>, independent of mass.</p>
<p>With air resistance, drag increases with speed. The resultant force (weight − drag) falls, so acceleration decreases until drag equals weight. The body then falls at <b>terminal velocity</b>.</p>
[[d:terminal]]` },
    { h: 'Projectiles', html: `
<p>Horizontal and vertical motions are <b>independent</b>. With no air resistance:</p>
<ul><li>Horizontal: no force, so constant velocity $u_x = u@,"cos"@,θ$ and $x = u_x t$.</li>
<li>Vertical: constant acceleration g downwards, initial velocity $u_y = u@,"sin"@,θ$; use suvat.</li></ul>
<p>Time links the two. At the top of the path, the vertical velocity is zero but the horizontal velocity is unchanged, and the acceleration is still g downwards.</p>
[[d:projectile]]
<div class="box why"><b class="lbl">Why?</b><p>A ball dropped and a ball projected horizontally from the same height land at the same time: the horizontal motion has no effect on the vertical motion.</p></div>` },
    { h: 'Specified practical: g by free fall', html: `
<p>Drop a steel ball from rest through a measured height h, timing the fall with an electromagnet and trapdoor switch connected to an electronic timer (or with light gates). Repeat for a range of heights.</p>
<p>Since $h = @frac{1}{2}gt^2$, a graph of h against t<sup>2</sup> is a straight line through the origin with gradient g/2 (or 2h against t<sup>2</sup> has gradient g). Measure h to the bottom of the ball; keep the ball small and dense so that air resistance is negligible.</p>` }
  ],
  eqs: [['v = u + at', ''], ['x = @frac{1}{2}(u + v)t', ''], ['x = ut + @frac{1}{2}at^2', ''], ['v^2 = u^2 + 2ax', ''], ['u_x = u@,"cos"@,θ, u_y = u@,"sin"@,θ', 'projectile components']],
  worked: [
    { q: 'A car travelling at 25 m s<sup>−1</sup> brakes uniformly and stops in 50 m. Find the deceleration and the stopping time.', s: ['Known: u = 25, v = 0, x = 50. Use $v^2 = u^2 + 2ax$.', '0 = 625 + 100a, so a = −6.25 m s<sup>−2</sup>.', 't = (v − u)/a = (0 − 25)/(−6.25) = 4.0 s.'], a: 'Deceleration 6.25 m s<sup>−2</sup>; time 4.0 s' },
    { q: 'A ball is kicked horizontally at 15 m s<sup>−1</sup> from the top of a 20 m cliff. Find (a) the time to land, (b) how far out it lands, (c) its speed on landing.', s: ['Vertical: u<sub>y</sub> = 0, x = 20 m, a = 9.81 m s<sup>−2</sup>. $20 = @frac{1}{2}(9.81)t^2$ so t = 2.02 s.', 'Horizontal: 15 × 2.02 = 30.3 m.', 'Vertical velocity at landing: v<sub>y</sub> = 9.81 × 2.02 = 19.8 m s<sup>−1</sup>.', 'Speed = √(15² + 19.8²) = 24.8 m s<sup>−1</sup>.'], a: '(a) 2.02 s (b) 30 m (c) 25 m s<sup>−1</sup>' },
    { q: 'A ball is launched at 20 m s<sup>−1</sup> at 30° above horizontal ground. Find its maximum height and range.', s: ['u<sub>x</sub> = 20 cos 30° = 17.3 m s<sup>−1</sup>; u<sub>y</sub> = 20 sin 30° = 10.0 m s<sup>−1</sup>.', 'Max height: 0 = 10.0² − 2(9.81)h, so h = 5.10 m.', 'Time to top = 10.0/9.81 = 1.02 s; total time = 2.04 s.', 'Range = 17.3 × 2.04 = 35.3 m.'], a: 'Height 5.1 m; range 35 m' }
  ],
  pitfalls: ['Using suvat when the acceleration is not constant.', 'Mixing sign conventions: if up is positive, g is −9.81 m s<sup>−2</sup>.', 'Thinking the velocity is zero at the top of a projectile path — only the vertical component is.', 'Using the whole launch speed in the horizontal or vertical equation instead of the component.', 'Reading a displacement–time gradient from a chord when an instantaneous value (tangent) is needed.'],
  cards: [
    ['Define acceleration.', 'Rate of change of velocity.'],
    ['What does the gradient of a v–t graph give?', 'Acceleration.'],
    ['What does the area under a v–t graph give?', 'Displacement.'],
    ['What does the gradient of an s–t graph give?', 'Velocity.'],
    ['Condition for suvat equations?', 'Constant (uniform) acceleration in a straight line.'],
    ['State the suvat equation without t.', '$v^2 = u^2 + 2ax$'],
    ['State the suvat equation without v.', '$x = ut + @frac{1}{2}at^2$'],
    ['State the suvat equation without a.', '$x = @frac{1}{2}(u + v)t$'],
    ['Horizontal acceleration of a projectile (no air resistance)?', 'Zero — horizontal velocity is constant.'],
    ['Acceleration at the top of a projectile’s path?', 'g = 9.81 m s<sup>−2</sup> downwards.'],
    ['Why does a skydiver reach terminal velocity?', 'Drag rises with speed until it equals the weight; resultant force and acceleration become zero.'],
    ['Graph to plot for g by free fall?', 'h against t<sup>2</sup>: gradient = g/2.']
  ],
  quiz: [
    { q: 'The gradient of a displacement–time graph represents', o: ['velocity', 'acceleration', 'displacement', 'force'], x: 'Velocity = rate of change of displacement.' },
    { q: 'The area under a velocity–time graph represents', o: ['displacement', 'acceleration', 'velocity', 'momentum'], x: 'v × t has units of m.' },
    { q: 'An object is dropped from rest and falls freely for 3.0 s. How far does it fall? (g = 9.81 m s<sup>−2</sup>)', o: ['44 m', '29 m', '88 m', '15 m'], x: 'x = ½ × 9.81 × 3.0² = 44.1 m.' },
    { q: 'A car accelerates uniformly from rest to 20 m s<sup>−1</sup> in 8.0 s. The distance it travels is', o: ['80 m', '160 m', '40 m', '20 m'], x: 'x = ½(u + v)t = ½ × 20 × 8.0 = 80 m.' },
    { q: 'At the highest point of a projectile’s path (no air resistance)', o: ['its acceleration is 9.81 m s<sup>−2</sup> downwards', 'its acceleration is zero', 'its velocity is zero', 'its horizontal velocity is zero'], x: 'Only the vertical velocity is zero; gravity still acts.' },
    { q: 'Ball P is dropped from rest; ball Q is thrown horizontally at the same instant from the same height. Ignoring air resistance', o: ['both land at the same time', 'P lands first', 'Q lands first', 'it depends on their masses'], x: 'Vertical motions are identical; horizontal motion is independent.' },
    { q: 'A runner completes one 400 m lap in 50 s, finishing where they started. Their mean velocity is', o: ['0', '8.0 m s<sup>−1</sup>', '4.0 m s<sup>−1</sup>', '16 m s<sup>−1</sup>'], x: 'Displacement is zero, so mean velocity is zero (mean speed is 8.0 m s<sup>−1</sup>).' },
    { q: 'The equations of uniformly accelerated motion can only be used when', o: ['acceleration is constant', 'velocity is constant', 'the object starts from rest', 'there is no gravity'], x: 'They are derived assuming a straight-line v–t graph.' },
    { q: 'A ball is thrown vertically upwards at 12 m s<sup>−1</sup>. Its maximum height is about', o: ['7.3 m', '14.7 m', '1.2 m', '3.7 m'], x: '0 = 12² − 2(9.81)h, so h = 7.3 m.' },
    { q: 'A horizontal line above the time axis on a velocity–time graph means', o: ['constant velocity', 'constant acceleration', 'the object is stationary', 'increasing displacement at an increasing rate'], x: 'Gradient zero → acceleration zero.' },
    { q: 'In a g by free fall experiment, a graph of h (y-axis) against t² (x-axis) has gradient', o: ['g / 2', 'g', '2g', '√g'], x: 'h = ½gt², so gradient = ½g.' },
    { q: 'A ball is thrown horizontally at 8.0 m s<sup>−1</sup> from a height of 4.9 m. Ignoring air resistance, its horizontal distance travelled before landing is about', o: ['8.0 m', '4.0 m', '16 m', '5.6 m'], x: 'Time to fall 4.9 m = √(2 × 4.9/9.81) = 1.0 s; horizontal distance = 8.0 × 1.0 m.' }
  ],
  exam: [
    { q: 'A cyclist accelerates uniformly from 4.0 m s<sup>−1</sup> to 10.0 m s<sup>−1</sup> in 5.0 s. Calculate (i) the acceleration and (ii) the distance travelled in this time.', m: 3, ms: ['a = (10.0 − 4.0)/5.0', '= 1.2 m s<sup>−2</sup>', 'x = ½(4.0 + 10.0) × 5.0 = 35 m'] },
    { q: 'Describe how to determine the acceleration due to gravity, g, using a free-fall method. Include how the result is obtained from a graph.', m: 6, ms: ['Steel ball held by electromagnet above trapdoor/light gates; timer starts on release, stops on arrival.', 'Measure height h with a metre rule (to bottom of ball); vary h over a suitable range.', 'Repeat each timing and take the mean; identify anomalies.', 'Plot h against t².', 'Straight line through origin as h = ½gt².', 'g = 2 × gradient; state one source of error / improvement (e.g. switch delay, air resistance, use a small dense ball).'] },
    { q: 'A stone is thrown at 18 m s<sup>−1</sup> at 40° above the horizontal from ground level. Calculate its maximum height and horizontal range, assuming air resistance is negligible.', m: 5, ms: ['u<sub>y</sub> = 18 sin 40° = 11.6 m s<sup>−1</sup>; u<sub>x</sub> = 18 cos 40° = 13.8 m s<sup>−1</sup>', 'h = u<sub>y</sub>²/2g = 6.82 m', 't to top = 11.6/9.81 = 1.18 s', 'total time 2.36 s', 'range = 13.8 × 2.36 = 32.5 m'] },
    { q: 'Explain, in terms of forces, why a parachutist reaches a terminal velocity.', m: 3, ms: ['Initially weight > air resistance so she accelerates.', 'Air resistance increases with speed, so resultant force (and acceleration) decreases.', 'When air resistance = weight, resultant force is zero so velocity is constant.'] }

TOPICS.push({
  id: '1.3', unit: '1', title: 'Dynamics', short: 'Newton’s laws and momentum',
  summary: 'Why things move the way they do: Newton’s three laws, free-body diagrams, momentum, collisions and explosions.',
  spec: [
    "(a) The concept of force and Newton’s 3rd law of motion",
    "(b) Use free-body diagrams to represent forces on a particle or body",
    "(c) Use F = ma where mass is constant",
    "(d) Linear momentum is the product of mass and velocity",
    "(e) Force is the rate of change of momentum (mass constant)",
    "(f) Conservation of momentum in one dimension: elastic collisions (no loss of kinetic energy) and inelastic collisions (loss of kinetic energy)"
  ],
  learn: [
    { h: 'Newton’s laws', html: `
<div class="box def"><b class="lbl">Newton’s 1st law</b><p>A body continues at rest or moving with constant velocity unless acted on by a resultant force.</p></div>
<div class="box def"><b class="lbl">Newton’s 2nd law</b><p>The rate of change of momentum of a body is proportional to the resultant force and takes place in the direction of the force: $F = @frac{Δp}{Δt}$. For constant mass this becomes $F = ma$.</p></div>
<div class="box def"><b class="lbl">Newton’s 3rd law</b><p>If body A exerts a force on body B, then B exerts a force on A that is equal in magnitude and opposite in direction.</p></div>
<p>A third-law pair: acts on <b>different</b> bodies, is the <b>same type</b> of force, equal in size, opposite in direction. Your weight (Earth pulls you) pairs with you pulling the Earth — not with the floor’s push on you.</p>` },
    { h: 'Free-body diagrams', html: `
<p>Draw <b>one</b> body and only the forces acting <b>on</b> it: weight (mg), normal contact force, tension, friction, drag, thrust, upthrust. Arrows start on the body and point in the direction of the force.</p>
<p>Then resolve and apply $ΣF = ma$ in each direction. For a car of mass 1200 kg with driving force 3000 N and resistive forces 600 N: $a = (3000 - 600)/1200 = 2.0 "m s"^{-2}$.</p>` },
    { h: 'Momentum', html: `
<p>$p = mv$ — a vector, unit kg m s<sup>−1</sup> or N s.</p>
<div class="box def"><b class="lbl">Principle of conservation of momentum</b><p>The total momentum of a system of interacting bodies remains constant, provided no resultant external force acts on the system.</p></div>
<p>In an <b>explosion</b> from rest, total momentum is zero before and after: the pieces move off in opposite directions with $m_1 v_1 = m_2 v_2$.</p>
<p>Rearranging $F = Δp/Δt$: for the same change in momentum, a longer impact time means a smaller force. That is how crumple zones, airbags, crash mats and bending your knees on landing all reduce injury.</p>` },
    { h: 'Elastic and inelastic collisions', html: `
<div class="tbl"><table><tr><th></th><th>Momentum</th><th>Kinetic energy</th></tr>
<tr><td><b>Elastic</b></td><td>conserved</td><td>conserved</td></tr><tr><td><b>Inelastic</b></td><td>conserved</td><td>not conserved (some transferred to heat, sound, deformation)</td></tr></table></div>
<p>Total energy is always conserved. When bodies stick together the collision is inelastic (though not every inelastic collision involves sticking).</p>
<div class="box tip"><b class="lbl">Exam tip</b><p>To decide if a collision is elastic, calculate the total KE before and after. Always check momentum with directions: a velocity to the left is negative.</p></div>` },
    { h: 'Specified practical: Newton’s 2nd law', html: `
<p>Use a trolley on a friction-compensated runway pulled by a hanging mass. Keep the <b>total</b> mass of the system constant by moving masses from the trolley to the hanger, so the accelerating force changes but the mass being accelerated does not. Measure acceleration with light gates or a motion sensor. A graph of a against F should be a straight line through the origin with gradient 1/(total mass).</p>` }
  ],
  eqs: [['F = ma', 'constant mass'], ['F = @frac{Δp}{Δt}', 'Newton’s 2nd law'], ['p = mv', 'momentum']],
  worked: [
    { q: 'A 2.0 kg trolley moving at 3.0 m s<sup>−1</sup> collides with a stationary 1.0 kg trolley and they stick together. Find their common velocity and decide whether the collision is elastic.', s: ['Momentum before = 2.0 × 3.0 = 6.0 kg m s<sup>−1</sup>.', 'After: 3.0 v = 6.0, so v = 2.0 m s<sup>−1</sup>.', 'KE before = ½ × 2.0 × 3.0² = 9.0 J; KE after = ½ × 3.0 × 2.0² = 6.0 J.', 'KE is not conserved (3.0 J transferred), so it is inelastic.'], a: '2.0 m s<sup>−1</sup>; inelastic' },

TOPICS.push({
  id: '1.4', unit: '1', title: 'Energy Concepts', short: 'Work, energy, power, efficiency',
  summary: 'Energy is the currency of physics. Work transfers it, power is its rate, and it is always conserved.',
  spec: [
    "(a) Work = force × distance moved in the direction of the force (constant force)",
    "(b) Work done when the force is not along the line of motion: W = Fx cos θ",
    "(c) Conservation of energy, including gravitational PE mgΔh, elastic PE ½kx² and kinetic energy ½mv²",
    "(d) The work–energy relationship Fx = ½mv² − ½mu²",
    "(e) Power is the rate of energy transfer",
    "(f) Dissipative forces (e.g. friction, drag) transfer energy from a system and reduce its efficiency",
    "(g) Efficiency = useful energy transfer ÷ total energy input × 100%"
  ],
  learn: [
    { h: 'Work', html: `
<div class="box def"><b class="lbl">Definition</b><p><b>Work done</b> = force × distance moved in the direction of the force: $W = Fx@,"cos"@,θ$, where θ is the angle between F and the displacement. 1 J is the work done when a force of 1 N moves its point of application 1 m in the direction of the force.</p></div>
<p>If the force is perpendicular to the motion (θ = 90°) no work is done — e.g. the tension in a string keeping a ball in circular motion.</p>
<p>When the force varies, work done = <b>area under the force–displacement graph</b>.</p>` },
    { h: 'Kinetic and potential energy', html: `
<p>$E_k = @frac{1}{2}mv^2$ and, near the Earth’s surface, $ΔE_p = mgΔh$.</p>
<h4>Deriving the kinetic energy formula</h4>
<p>A constant resultant force F accelerates a mass m from rest through distance x. Work done $= Fx = ma × x$. From $v^2 = 0 + 2ax$, $ax = @frac{1}{2}v^2$, so work done $= @frac{1}{2}mv^2$. This is the energy the body now has because of its motion.</p>
<div class="box def"><b class="lbl">Work–energy relationship</b><p>Work done by the resultant force = change in kinetic energy: $Fx = @frac{1}{2}mv^2 - @frac{1}{2}mu^2$.</p></div>` },
    { h: 'Conservation of energy', html: `
<div class="box def"><b class="lbl">Principle of conservation of energy</b><p>Energy cannot be created or destroyed, only transferred from one form to another. The total energy of a closed system is constant.</p></div>
<div class="box def"><b class="lbl">Dissipative forces</b><p>Friction and drag are <b>dissipative</b>: the work done against them transfers energy out of the useful stores into internal energy (heating) of the surroundings, so it is no longer available to do useful work. They therefore reduce the efficiency of a system.</p></div>
<p>For a falling body with no air resistance, loss in E<sub>p</sub> = gain in E<sub>k</sub>: $mgh = @frac{1}{2}mv^2$ so $v = @sqrt{2gh}$, independent of mass. With friction, the missing energy equals the work done against friction: <i>loss of E<sub>p</sub> = gain in E<sub>k</sub> + work done against friction</i>.</p>` },
    { h: 'Power and efficiency', html: `
<p>Power is the rate of doing work (rate of energy transfer): $P = @frac{W}{t}$, unit W = J s<sup>−1</sup>.</p>
<p>For a force moving at constant velocity: $P = @frac{Fx}{t} = Fv$. A car at constant speed has driving force = resistive force, so power output = resistive force × speed.</p>
<div class="box eq">$"efficiency" = @frac{"useful energy (or power) out"}{"total energy (or power) in"} × 100%$</div>` }
  ],
  eqs: [['W = Fx@,"cos"@,θ', 'work done'], ['E_k = @frac{1}{2}mv^2', 'kinetic energy'], ['ΔE_p = mgΔh', 'change in GPE near Earth'], ['Fx = @frac{1}{2}mv^2 - @frac{1}{2}mu^2', 'work–energy'], ['P = @frac{W}{t} = @frac{ΔE}{t}', 'power'], ['P = Fv', 'power at constant velocity']],
  worked: [
    { q: 'A sledge is pulled 50 m along level snow by a rope at 25° to the horizontal with tension 60 N. How much work is done by the tension?', s: ['$W = Fx@,"cos"@,θ = 60 × 50 × "cos"@,25°$', '= 2719 J'], a: '2.7 kJ' },
    { q: 'A car travels at a constant 30 m s<sup>−1</sup>. The total resistive force is 800 N. What is the useful power output of the engine?', s: ['Constant velocity, so driving force = resistive force = 800 N.', 'P = Fv = 800 × 30 = 24 000 W.'], a: '24 kW' },
    { q: 'A motor with input power 400 W lifts a 50 kg load through 12 m in 20 s. Find its efficiency.', s: ['Useful energy = mgh = 50 × 9.81 × 12 = 5886 J.', 'Useful power = 5886 / 20 = 294 W.', 'Efficiency = 294 / 400 = 0.736.'], a: '74%' }
  ],
  pitfalls: ['Using W = Fx when the force is at an angle — include cos θ.', 'Forgetting to square the velocity in ½mv².', 'Using P = Fv with the wrong force: at constant speed the driving force equals the total resistive force.', 'Giving efficiency greater than 100%.'],
  cards: [
    ['Define work done.', 'Force × distance moved in the direction of the force.'],
    ['Define the joule.', 'Work done when a 1 N force moves its point of application 1 m in the direction of the force.'],
    ['Work done by a force perpendicular to motion?', 'Zero.'],
    ['Area under a force–displacement graph?', 'Work done.'],
    ['Define power.', 'Rate of doing work / rate of energy transfer.'],
    ['Derive P = Fv.', 'P = W/t = Fx/t = Fv (constant force and velocity).'],
    ['State the principle of conservation of energy.', 'Energy cannot be created or destroyed; total energy of a closed system is constant.'],
    ['Speed after falling h from rest (no drag)?', '$v = @sqrt{2gh}$'],
    ['What do dissipative forces do?', 'Friction and drag transfer energy out of the system (as heating), reducing efficiency.'],
    ['Work–energy relationship?', 'Work done by resultant force = change in kinetic energy.'],
    ['Base units of the watt?', 'kg m<sup>2</sup> s<sup>−3</sup>'],
    ['If speed doubles, KE…', 'quadruples.']
  ],
  quiz: [
    { q: 'A force acts perpendicular to the direction of motion. The work done by the force is', o: ['zero', 'maximum', 'negative', 'equal to force × distance'], x: 'cos 90° = 0.' },
    { q: 'A 2.0 kg ball moves at 3.0 m s<sup>−1</sup>. Its kinetic energy is', o: ['9.0 J', '6.0 J', '3.0 J', '18 J'], x: '½ × 2.0 × 3.0² = 9.0 J.' },
    { q: 'If the speed of a car doubles, its kinetic energy', o: ['increases by a factor of 4', 'doubles', 'halves', 'is unchanged'], x: 'E<sub>k</sub> ∝ v².' },
    { q: 'One watt is equal to', o: ['1 J s<sup>−1</sup>', '1 J s', '1 N s', '1 N m<sup>−1</sup>'], x: 'Power = energy / time.' },
    { q: 'A car’s engine delivers 40 kW of useful power at a constant 20 m s<sup>−1</sup>. The driving force is', o: ['2000 N', '800 kN', '500 N', '20 N'], x: 'F = P/v = 40 000 / 20.' },
    { q: 'A 5.0 kg mass is lifted through 2.0 m. Its gravitational potential energy increases by about', o: ['98 J', '10 J', '49 J', '25 J'], x: 'mgh = 5.0 × 9.81 × 2.0 = 98.1 J.' },
    { q: 'A machine is 25% efficient. It is supplied with 800 J. The useful energy output is', o: ['200 J', '600 J', '3200 J', '25 J'], x: '0.25 × 800.' },
    { q: 'The work done in stretching a spring is given by', o: ['the area under the force–extension graph', 'the gradient of the force–extension graph', 'force × extension', 'extension ÷ force'], x: 'Area = ½Fx for a Hooke’s law spring.' },
    { q: 'The watt in SI base units is', o: ['kg m<sup>2</sup> s<sup>−3</sup>', 'kg m<sup>2</sup> s<sup>−2</sup>', 'kg m s<sup>−3</sup>', 'kg m<sup>2</sup> s<sup>−1</sup>'], x: 'J s<sup>−1</sup> = kg m<sup>2</sup> s<sup>−2</sup> s<sup>−1</sup>.' },
    { q: 'A ball is dropped from rest from 5.0 m. Ignoring air resistance, its speed just before landing is', o: ['9.9 m s<sup>−1</sup>', '49 m s<sup>−1</sup>', '7.0 m s<sup>−1</sup>', '98 m s<sup>−1</sup>'], x: 'v = √(2 × 9.81 × 5.0) = 9.9 m s<sup>−1</sup>.' },
    { q: 'Two objects of different mass slide from rest down the same frictionless slope. At the bottom', o: ['they have the same speed', 'the heavier one is faster', 'the lighter one is faster', 'they have the same kinetic energy'], x: 'v = √(2gh) is independent of mass (their KEs differ).' }
  ],
  exam: [
    { q: 'Starting from the equations of motion, show that the kinetic energy of a body of mass m moving at speed v is ½mv².', m: 3, ms: ['Work done by constant force from rest: W = Fx = max.', 'v² = u² + 2ax with u = 0 gives ax = ½v².', 'W = ½mv² = kinetic energy gained.'] },
    { q: 'A cyclist and bike (total mass 80 kg) freewheel from rest down a slope, descending a vertical height of 15 m. At the bottom their speed is 12 m s<sup>−1</sup>. Calculate the work done against resistive forces.', m: 4, ms: ['Loss of E<sub>p</sub> = 80 × 9.81 × 15 = 11 772 J', 'Gain of E<sub>k</sub> = ½ × 80 × 12² = 5760 J', 'Work against resistance = difference', '= 6000 J (6.0 kJ)'] },
    { q: 'A lorry’s engine provides a useful power of 150 kW when travelling at a constant 25 m s<sup>−1</sup>. Calculate the total resistive force and explain your reasoning.', m: 3, ms: ['P = Fv', 'F = 150 000 / 25 = 6000 N', 'Constant velocity so resultant force zero: resistive force = driving force.'] }
  ],
  sims: ['energy'], gens: ['work1', 'power1', 'energy1', 'eff1']
});

TOPICS.push({
  id: '1.5', unit: '1', title: 'Solids under Stress', short: 'Hooke’s law, Young modulus, materials',
  summary: 'How materials respond to forces: stiffness, strength, the Young modulus, and what dislocations, cracks and tangled polymer chains have to do with it.',
  spec: [
    "(a) Hooke’s law, F = kx, where the spring constant k is the force per unit extension",
    "(b) Tensile stress σ = F/A, tensile strain ε = Δl/l and Young modulus E = σ/ε when Hooke’s law applies",
    "(c) Work done deforming a solid = area under the force–extension graph = ½Fx if Hooke’s law is obeyed",
    "(d) Classify solids as crystalline, amorphous (including glasses and ceramics) and polymeric",
    "(e) Force–extension (stress–strain) graph for a metal such as copper: elastic and plastic strain; dislocations; strengthening by barriers to dislocation movement (foreign atoms, other dislocations, more grain boundaries); necking and ductile fracture",
    "(f) Graph for a brittle material such as glass: Hooke’s law obeyed up to fracture; brittle fracture by crack propagation; effect of surface imperfections; increasing breaking stress by reducing imperfections (thin fibres) or putting the surface under compression (toughened glass, pre-stressed concrete)",
    "(g) Graph for rubber: Hooke’s law only approximately obeyed, low Young modulus, extension due to straightening of chain molecules against thermal opposition; hysteresis"
  ],
  learn: [
    { h: 'Hooke’s law', html: `
<div class="box def"><b class="lbl">Hooke’s law</b><p>The extension of a spring (or wire) is directly proportional to the applied force, provided the limit of proportionality is not exceeded: $F = kx$, where k is the spring constant (N m<sup>−1</sup>).</p></div>
[[d:hooke]]
<p>Work done stretching = area under the F–x graph. Within the Hooke’s law region this is a triangle, so the elastic potential energy stored is $@frac{1}{2}Fx = @frac{1}{2}kx^2$.</p>` },
    { h: 'Stress, strain and the Young modulus', html: `
<div class="box def"><b class="lbl">Definitions</b><ul>
<li><b>Stress</b> $σ = @frac{F}{A}$ — force per unit cross-sectional area (Pa).</li>
<li><b>Strain</b> $ε = @frac{Δl}{l}$ — extension ÷ original length (no units).</li>
<li><b>Young modulus</b> $E = @frac{σ}{ε}$ — stress ÷ strain within the Hooke’s law region (Pa).</li></ul></div>
<p>Combining: $E = @frac{Fl}{AΔl}$. The Young modulus is a property of the material, not of a particular sample. Steel: about 2 × 10<sup>11</sup> Pa; rubber: about 10<sup>6</sup>–10<sup>7</sup> Pa.</p>
<div class="box def"><b class="lbl">Elastic vs plastic</b><p><b>Elastic</b> deformation: the material returns to its original shape when the load is removed. <b>Plastic</b> deformation: permanent deformation that remains after the load is removed. The <b>elastic limit</b> is the point beyond which deformation is plastic.</p></div>` },
    { h: 'Types of solid and stress–strain curves', html: `
<div class="tbl"><table><tr><th>Type</th><th>Structure</th><th>Examples</th></tr>
<tr><td>Crystalline</td><td>atoms in a regular, repeating 3-D lattice (metals: many small crystals or grains)</td><td>metals, salt, diamond</td></tr>
<tr><td>Amorphous</td><td>no long-range order</td><td>glasses and ceramics</td></tr>
<tr><td>Polymeric</td><td>long chain molecules</td><td>rubber, polythene</td></tr></table></div>
[[d:stress-strain]]
<ul><li><b>Ductile</b> (copper): elastic region, then yields and undergoes large plastic deformation before necking and breaking. Can be drawn into wires.</li>
<li><b>Brittle</b> (glass, cast iron): elastic almost to breaking; fractures suddenly with little or no plastic deformation.</li>
<li><b>Polymeric</b> (rubber): very large elastic strains (several hundred per cent), non-linear curve, hysteresis.</li></ul>
<p>A ductile metal such as copper stretches plastically until one region thins rapidly — <b>necking</b> — and it then breaks by <b>ductile fracture</b>.</p>` },
    { h: 'Metals: dislocations and strength', html: `
<p>Metal crystals contain <b>dislocations</b> — lines where an extra half-plane of atoms ends. Under stress, a dislocation moves through the lattice one row of bonds at a time, so planes of atoms slip past each other much more easily than if all the bonds broke at once. This slip is <b>plastic deformation</b> and is why metals are <b>ductile</b>.</p>
<p>Anything that blocks dislocation movement makes a metal stronger and harder (but less ductile):</p>
<ul><li><b>Grain boundaries</b> — dislocations cannot easily cross from one grain to the next, so smaller grains mean a stronger metal.</li>
<li><b>Foreign atoms</b> (alloying, e.g. carbon in steel) — they distort the lattice and pin dislocations.</li>
<li><b>Other dislocations</b> — when there are many, dislocations become tangled and jam each other (work hardening).</li></ul>` },
    { h: 'Brittle fracture', html: `
<p>Brittle materials such as glass have no mechanism (no mobile dislocations) for plastic flow. Surface scratches and cracks act as <b>stress concentrators</b>: under <b>tension</b> the stress at the sharp tip of a crack is many times the average, so bonds there break, the crack lengthens, the tip stays sharp and the crack propagates rapidly across the material.</p>
<p>The breaking stress can be increased by <b>reducing surface imperfections</b> — very <b>thin fibres</b> of glass have few surface cracks and are remarkably strong — or by putting the surface <b>under compression</b>.</p>
<p>In <b>compression</b> cracks are pushed closed, so brittle materials are much stronger in compression than tension. <b>Prestressed concrete</b> is cast around steel rods held under tension; when released, the rods keep the concrete in compression so cracks cannot open. <b>Toughened glass</b> has surface layers in compression for the same reason.</p>` },
    { h: 'Rubber and hysteresis', html: `
<p>Rubber has a <b>low Young modulus</b> and obeys Hooke’s law only <b>approximately</b>. It consists of long, tangled, coiled polymer chains with a few cross-links. With a small stress the chains uncoil and straighten easily (low stiffness); once they are nearly straight, further strain requires stretching the bonds within the chains, so it becomes much stiffer. The chains are straightened against <b>thermal opposition</b>: when released, the thermal motion of the chains makes them re-tangle, so rubber returns to its original length.</p>
[[d:hysteresis]]
<p>Rubber shows <b>elastic hysteresis</b>: the unloading curve lies below the loading curve. The area of the loop is the energy transferred to internal energy (heating) in one loading–unloading cycle. Rubber tyres get warm for this reason.</p>` },
    { h: 'Specified practical: Young modulus of a wire', html: `
<p>A long (≈2 m) thin wire is clamped and loaded. A reference wire with a vernier (Searle’s apparatus) or a marker against a fixed scale measures the extension. Measure the diameter at several points and orientations with a micrometer and average; $A = πd^2/4$. Plot F against Δl: gradient = EA/l, so $E = "gradient" × @frac{l}{A}$.</p>
<p>A long, thin wire gives a larger, more measurable extension. The diameter causes the largest percentage uncertainty, which is doubled because it is squared.</p>` }
  ],
  eqs: [['F = kx', 'Hooke’s law'], ['E_p = @frac{1}{2}Fx = @frac{1}{2}kx^2', 'elastic PE'], ['σ = @frac{F}{A}', 'stress'], ['ε = @frac{Δl}{l}', 'strain'], ['E = @frac{σ}{ε} = @frac{Fl}{AΔl}', 'Young modulus']],
  worked: [
    { q: 'A steel wire 2.0 m long with diameter 0.50 mm supports a load of 50 N. E for steel = 2.0 × 10<sup>11</sup> Pa. Find the extension.', s: ['A = π(0.25 × 10<sup>−3</sup>)² = 1.96 × 10<sup>−7</sup> m².', 'σ = 50 / 1.96 × 10<sup>−7</sup> = 2.55 × 10<sup>8</sup> Pa.', 'ε = σ/E = 1.27 × 10<sup>−3</sup>.', 'Δl = εl = 1.27 × 10<sup>−3</sup> × 2.0 = 2.5 × 10<sup>−3</sup> m.'], a: '2.5 mm' },
    { q: 'A spring of spring constant 40 N m<sup>−1</sup> is stretched by 15 cm. Find the force and the energy stored.', s: ['F = kx = 40 × 0.15 = 6.0 N.', 'E = ½kx² = ½ × 40 × 0.15² = 0.45 J.'], a: '6.0 N; 0.45 J' }
  ],
  pitfalls: ['Using diameter instead of radius in A = πr² (or forgetting to square).', 'Giving strain a unit; it is a ratio.', 'Saying brittle materials are “weak” — glass has a high breaking stress in compression; brittleness is about the lack of plastic deformation.', 'Explaining metal ductility by “bonds breaking” rather than dislocation movement.', 'Confusing limit of proportionality with elastic limit.'],
  cards: [
    ['State Hooke’s law.', 'Extension ∝ force applied, provided the limit of proportionality is not exceeded.'],

TOPICS.push({
  id: '1.6', unit: '1', title: 'Using Radiation to Investigate Stars', short: 'Black bodies, Wien, Stefan, spectra',
  summary: 'Everything we know about stars comes from their light. Black-body radiation gives temperature and size; absorption lines give composition.',
  spec: [
    "(a) A stellar spectrum is a continuous emission spectrum from the dense gas of the star’s surface plus a line absorption spectrum from radiation passing through the tenuous atmosphere of the star",
    "(b) Bodies that absorb all incident radiation are black bodies; stars are very good approximations to black bodies",
    "(c) The shape of the black-body spectrum; peak wavelength ∝ 1/absolute temperature, T (K) = θ (°C) + 273.15",
    "(d) Use Wien’s law, Stefan’s law and the inverse square law to find stellar luminosity, size, temperature and distance (magnitudes not required)",
    "(e) Multiwavelength astronomy: studying a region at different wavelengths (photon energies) reveals the different processes taking place there"
  ],
  learn: [
    { h: 'Black bodies', html: `
<div class="box def"><b class="lbl">Definition</b><p>A <b>black body</b> is a body that absorbs all the electromagnetic radiation that falls on it. It is also the best possible emitter: at any temperature it emits a continuous spectrum with the maximum possible power at each wavelength.</p></div>
<p>Stars are good approximations to black bodies. Their spectra have a characteristic shape that depends only on temperature.</p>
[[d:blackbody]]
<p>As temperature rises, (1) the peak moves to shorter wavelength and (2) the intensity at every wavelength rises, so total power rises steeply.</p>` },
    { h: 'Wien’s law and Stefan’s law', html: `
<div class="box def"><b class="lbl">Wien’s displacement law</b><p>$λ_{max} = @frac{W}{T}$, where W = 2.90 × 10<sup>−3</sup> m K is Wien’s constant and T is the absolute temperature.</p></div>
<p>The Sun peaks at about 500 nm, so $T = 2.90 × 10^{-3} / 500 × 10^{-9} = 5800 "K"$. Red stars are cooler; blue-white stars are hotter.</p>
<div class="box def"><b class="lbl">Stefan–Boltzmann law</b><p>The total power emitted by a black body is $P = AσT^4$, where A is surface area and σ = 5.67 × 10<sup>−8</sup> W m<sup>−2</sup> K<sup>−4</sup>. For a spherical star, $A = 4πr^2$.</p></div>
<p>A star’s total power output is its <b>luminosity</b>. Two stars at the same temperature: the one with the larger luminosity must be bigger (e.g. red giants are cool but very luminous, so they are enormous).</p>
<p>Temperatures must be in kelvin: $T/"K" = θ/"°C" + 273.15$.</p>` },
    { h: 'Intensity and the inverse square law', html: `
<p>Radiation from a star spreads out over a sphere. At distance d, the intensity (power per unit area) is $I = @frac{P}{4πd^2}$, unit W m<sup>−2</sup>.</p>
<p>Example: the Sun’s luminosity 3.85 × 10<sup>26</sup> W at 1.50 × 10<sup>11</sup> m gives I ≈ 1.36 kW m<sup>−2</sup> at the top of the atmosphere.</p>
<div class="box tip"><b class="lbl">Chain of reasoning</b><p>Measure λ<sub>max</sub> → T (Wien). Measure intensity at Earth and know distance → luminosity P. Then P and T → surface area → radius (Stefan).</p></div>` },
    { h: 'Absorption spectra and composition', html: `
<p>The hot, dense interior of a star emits a continuous spectrum. Light passing through the cooler gas of the star’s outer atmosphere is absorbed at particular wavelengths — photons whose energy exactly matches the difference between energy levels of the atoms there. This leaves <b>dark absorption lines</b> on the continuous spectrum.</p>
<p>Each element has its own unique pattern of lines (its “fingerprint”), so comparing the lines with laboratory spectra identifies the elements present in the star’s atmosphere. Hydrogen and helium lines dominate in most stars.</p>` },
    { h: 'The electromagnetic spectrum and multiwavelength astronomy', html: `
<div class="tbl"><table><tr><th>Region</th><th>Approx. wavelength range</th></tr>
<tr><td>gamma rays</td><td>&lt; 10<sup>−11</sup> m (overlaps X-rays)</td></tr><tr><td>X-rays</td><td>10<sup>−13</sup> – 10<sup>−8</sup> m</td></tr>
<tr><td>ultraviolet</td><td>10<sup>−8</sup> – 4 × 10<sup>−7</sup> m</td></tr><tr><td>visible</td><td>4 × 10<sup>−7</sup> – 7 × 10<sup>−7</sup> m (400–700 nm)</td></tr>
<tr><td>infrared</td><td>7 × 10<sup>−7</sup> – 10<sup>−3</sup> m</td></tr><tr><td>microwaves</td><td>10<sup>−3</sup> – 10<sup>−1</sup> m</td></tr><tr><td>radio</td><td>&gt; 10<sup>−1</sup> m</td></tr></table></div>
<p>Different objects and processes emit in different regions: cool dust clouds and forming stars in the infrared, very hot gas (e.g. near black holes) in X-rays, cold hydrogen at 21 cm radio. Observing across the whole spectrum — <b>multiwavelength astronomy</b> — gives a far more complete picture than visible light alone.</p>
<p>Earth’s atmosphere absorbs most gamma, X-ray, UV and much infrared radiation, so telescopes for these regions must be in space. Visible light and most radio waves reach the ground.</p>` }
  ],
  eqs: [['λ_{max} = @frac{W}{T}', 'Wien, W = 2.90 × 10⁻³ m K'], ['P = AσT^4', 'Stefan–Boltzmann'], ['I = @frac{P}{4πd^2}', 'intensity at distance d'], ['T/"K" = θ/"°C" + 273.15', 'kelvin conversion']],
  worked: [
    { q: 'The spectrum of the star Rigel peaks at 240 nm. Find its surface temperature.', s: ['$T = W/λ_{max} = 2.90 × 10^{-3} / 240 × 10^{-9}$', '= 12 100 K'], a: '1.2 × 10<sup>4</sup> K' },
    { q: 'The Sun has radius 6.96 × 10<sup>8</sup> m and surface temperature 5780 K. Find its luminosity and the intensity at Earth, 1.50 × 10<sup>11</sup> m away.', s: ['A = 4πr² = 6.09 × 10<sup>18</sup> m².', 'P = AσT⁴ = 6.09 × 10<sup>18</sup> × 5.67 × 10<sup>−8</sup> × 5780⁴ = 3.85 × 10<sup>26</sup> W.', 'I = P/4πd² = 3.85 × 10<sup>26</sup> / (4π × (1.50 × 10<sup>11</sup>)²) = 1360 W m<sup>−2</sup>.'], a: 'P = 3.9 × 10<sup>26</sup> W; I ≈ 1.4 kW m<sup>−2</sup>' },
    { q: 'Star X has the same surface temperature as the Sun but is 100 times as luminous. How does its radius compare with the Sun’s?', s: ['P ∝ r²T⁴; T is the same so P ∝ r².', 'r² is 100 times greater, so r is 10 times greater.'], a: '10 × the Sun’s radius' }
  ],
  pitfalls: ['Using °C instead of K in Wien’s or Stefan’s law.', 'Forgetting that P ∝ T⁴ — doubling T multiplies power by 16.', 'Using the diameter for r in 4πr².', 'Saying absorption lines come from the core of the star; they come from cooler gas in the outer layers / atmosphere.', 'Confusing luminosity (total power, W) with intensity (W m<sup>−2</sup>).'],
  cards: [
    ['Define a black body.', 'A body that absorbs all the EM radiation incident on it (and is the best possible emitter).'],
    ['State Wien’s law.', 'λ<sub>max</sub> = W/T, W = 2.90 × 10<sup>−3</sup> m K.'],
    ['State the Stefan–Boltzmann law.', 'P = AσT⁴.'],
    ['Value and unit of σ?', '5.67 × 10<sup>−8</sup> W m<sup>−2</sup> K<sup>−4</sup>'],
    ['Intensity at distance d from a star?', 'I = P / 4πd².'],
    ['What causes dark lines in a star’s spectrum?', 'Cooler gas in the star’s atmosphere absorbs photons whose energies match energy-level differences.'],
    ['How do absorption lines reveal composition?', 'Each element has a unique set of line wavelengths; compare with lab spectra.'],
    ['Wavelength range of visible light?', 'About 400 nm to 700 nm.'],
    ['Why put X-ray telescopes in space?', 'Earth’s atmosphere absorbs X-rays.'],
    ['If T of a star doubles (same radius), luminosity…', 'increases by a factor of 16.'],
    ['What is multiwavelength astronomy?', 'Observing objects across many regions of the EM spectrum to reveal different processes.'],
    ['Convert 27 °C to kelvin.', '300 K']
  ],
  quiz: [
    { q: 'Star A has λ<sub>max</sub> = 400 nm; star B has λ<sub>max</sub> = 800 nm. Compared with B, the surface temperature of A is', o: ['twice as high', 'half as high', 'four times as high', 'the same'], x: 'λ<sub>max</sub> ∝ 1/T.' },
    { q: 'The absolute temperature of a black body is doubled with no change in size. Its emitted power increases by a factor of', o: ['16', '2', '4', '8'], x: 'P ∝ T⁴.' },
    { q: 'Two stars have the same temperature, but star P has three times the radius of star Q. The ratio of luminosities P : Q is', o: ['9 : 1', '3 : 1', '27 : 1', '81 : 1'], x: 'P ∝ r².' },
    { q: 'The dark lines in the spectrum of a star are caused by', o: ['absorption by cooler gas in the star’s atmosphere', 'emission by hot gas in the core', 'absorption in the Earth’s atmosphere only', 'diffraction in the telescope'], x: 'Photons of specific energies excite atoms in the outer layers.' },
    { q: 'The distance from a star is doubled. The intensity received', o: ['falls to one quarter', 'halves', 'is unchanged', 'falls to one eighth'], x: 'Inverse square law.' },
    { q: 'The approximate wavelength range of visible light is', o: ['400–700 nm', '4–7 nm', '400–700 μm', '40–70 nm'], x: '4 × 10<sup>−7</sup> to 7 × 10<sup>−7</sup> m.' },
    { q: 'A black body is best described as a body that', o: ['absorbs all radiation incident on it', 'reflects all radiation incident on it', 'emits radiation of one wavelength only', 'is always black in colour'], x: 'A hot black body glows — the Sun is a near black body.' },
    { q: 'The peak wavelength of radiation from a body at 290 K is about', o: ['10 μm (infrared)', '10 nm (UV)', '500 nm (visible)', '10 mm (microwave)'], x: '2.90 × 10<sup>−3</sup> / 290 = 1.0 × 10<sup>−5</sup> m.' },
    { q: 'X-ray telescopes are placed in orbit because', o: ['the atmosphere absorbs X-rays', 'X-rays are too faint to detect', 'X-rays are deflected by Earth’s magnetic field', 'X-rays only come from the Sun'], x: 'Similarly for gamma, most UV and much IR.' },
    { q: 'The unit of the Stefan constant σ is', o: ['W m<sup>−2</sup> K<sup>−4</sup>', 'W m<sup>2</sup> K<sup>4</sup>', 'W K<sup>−4</sup>', 'm K'], x: 'σ = P / (AT⁴).' },

  ],
  exam: [

    { q: 'The star Betelgeuse has λ<sub>max</sub> = 850 nm and luminosity 4.5 × 10<sup>31</sup> W. Calculate its surface temperature and radius.', m: 5, ms: ['T = 2.90 × 10<sup>−3</sup> / 850 × 10<sup>−9</sup> = 3410 K', 'P = 4πr²σT⁴', 'r² = P / (4πσT⁴)', 'r² = 4.5 × 10<sup>31</sup> / (4π × 5.67 × 10<sup>−8</sup> × 3410⁴)', 'r ≈ 6.8 × 10<sup>11</sup> m'] },
