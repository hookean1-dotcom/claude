  { id: 'nettleship', n: 'Nettleship v Weston', y: 1971, a: '1', t: '1.D2', c: 'CA', f: 'A learner driver hit a lamp post, injuring her instructor, a friend.', p: 'A learner driver is judged by the standard of a reasonably competent qualified driver. The instructor had not consented to the risk (no volenti), though damages were reduced for his contributory negligence.' },
  { id: 'bolam', n: 'Bolam v Friern Hospital Management Committee', y: 1957, a: '1', t: '1.D2', c: 'HC', f: 'A patient was given electro-convulsive therapy without relaxant drugs or restraint and suffered fractures. Medical opinion was divided on the practice.', p: 'A professional is not negligent if they acted in accordance with a practice accepted as proper by a responsible body of professional opinion.' },
  { id: 'mullin', n: 'Mullin v Richards', y: 1998, a: '1', t: '1.D2', c: 'CA', f: 'Two 15-year-old girls were fencing with plastic rulers; one ruler snapped and a fragment blinded one girl in one eye.', p: 'A child is judged by the standard of a reasonable child of the same age. It was not foreseeable to a reasonable 15-year-old — no breach.' },
  { id: 'wellscooper', n: 'Wells v Cooper', y: 1958, a: '1', t: '1.D2', c: 'CA', f: 'An amateur carpenter fitted a new door handle, which came off when a visitor pulled it; he fell and was injured.', p: 'A person doing DIY work is judged by the standard of a reasonably competent amateur carpenter — which he met. No breach.' },
  { id: 'boltonstone', n: 'Bolton v Stone', y: 1951, a: '1', t: '1.D2', c: 'HL', f: 'A cricket ball was hit out of the ground and struck Miss Stone. Balls had left the ground only about six times in 30 years.', p: 'No breach: the risk was so small that a reasonable person would not have taken further precautions.' },
  { id: 'paris', n: 'Paris v Stepney Borough Council', y: 1951, a: '1', t: '1.D2', c: 'HL', f: 'A garage worker who was already blind in one eye was not given goggles; a metal chip blinded his good eye.', p: 'Breach: the seriousness of potential harm to this particular employee required extra precautions.' },
  { id: 'haley', n: 'Haley v London Electricity Board', y: 1965, a: '1', t: '1.D2', c: 'HL', f: 'A blind man tripped over a small warning hammer left by workmen at a trench on the pavement; it was adequate for sighted people.', p: 'Breach: it was foreseeable that blind people would use the pavement, and precautions should reflect that.' },
  { id: 'latimer', n: 'Latimer v AEC', y: 1953, a: '1', t: '1.D2', c: 'HL', f: 'A factory floor flooded and became slippery. The employer spread sawdust but not everywhere; a worker slipped. The only way to remove all risk was to close the factory.', p: 'No breach: the cost and practicality of further precautions (closing the factory) outweighed the small risk.' },
  { id: 'watthert', n: 'Watt v Hertfordshire County Council', y: 1954, a: '1', t: '1.D2', c: 'CA', f: 'Firefighters rushed to rescue a woman trapped under a lorry, carrying a heavy jack on a lorry not designed for it. It slipped and injured a firefighter.', p: 'No breach: the social utility of saving life justified taking greater risks. Emergency services are not expected to meet the same standard in emergencies.' },
  { id: 'roe', n: 'Roe v Minister of Health', y: 1954, a: '1', t: '1.D2', c: 'CA', f: 'In 1947 anaesthetic stored in glass ampoules in phenol became contaminated through invisible cracks, paralysing two patients.', p: 'Defendants are judged by the state of knowledge at the time; the risk was not then known, so no breach. “We must not look at the 1947 accident with 1954 spectacles.”' },
  { id: 'millerjackson', n: 'Miller v Jackson', y: 1977, a: '1', t: '1.D2', c: 'CA', f: 'Cricket balls from a village club that had played there for 70 years kept landing in the gardens of new houses built next to the ground.', p: 'The club was liable in negligence and nuisance, but the majority refused an injunction, preferring the public interest in cricket to the private interests of the householders (damages instead). Lord Denning dissented on liability.' },
  { id: 'barnett', n: 'Barnett v Chelsea and Kensington Hospital Management Committee', y: 1969, a: '1', t: '1.D3', c: 'HC', f: 'Three night-watchmen went to hospital after drinking tea and vomiting. The doctor sent them home without examination. One died of arsenic poisoning.', p: 'The hospital was in breach, but not liable: he would have died even with proper treatment, so the breach failed the “but for” test.' },
  { id: 'wagonmound', n: 'Overseas Tankship v Morts Dock (The Wagon Mound No 1)', y: 1961, a: '1', t: '1.D3', c: 'Privy Council', f: 'Oil spilled from a ship into Sydney Harbour. Days later, sparks from welding on a wharf ignited cotton waste floating in the oil and the wharf burned down.', p: 'The defendant is liable only for damage of a kind that was reasonably foreseeable. Fire damage was not foreseeable (oil on water was thought not to ignite). Rejected the “direct consequence” test in Re Polemis (1921).' },
  { id: 'hughes', n: 'Hughes v Lord Advocate', y: 1963, a: '1', t: '1.D3', c: 'HL', f: 'Workmen left an open manhole covered by a tent with paraffin lamps. Two boys took a lamp into the hole; it fell and caused an unexpected explosion, burning one boy.', p: 'Liable: the type of harm (burns) was foreseeable, even if the precise way it happened was not.' },
  { id: 'doughty', n: 'Doughty v Turner Manufacturing', y: 1964, a: '1', t: '1.D3', c: 'CA', f: 'An asbestos-cement lid fell into a vat of molten metal. A chemical reaction, unknown to science at the time, caused an eruption that burned the claimant.', p: 'Not liable: splashing was foreseeable, but an eruption caused by a chemical reaction was a different kind of harm.' },
  { id: 'smithleech', n: 'Smith v Leech Brain & Co', y: 1962, a: '1', t: '1.D3', c: 'HC', f: 'A worker was burned on the lip by molten metal because of inadequate protection. The burn triggered a pre-malignant cancer and he died.', p: 'The “thin skull” rule: you take your victim as you find them. Once some injury is foreseeable, the defendant is liable for its full extent.' },
  { id: 'bradford', n: 'Bradford v Robinson Rentals', y: 1967, a: '1', t: '1.D3', c: 'HC', f: 'An employee was sent on a long journey in severe winter weather in a van with no heater and suffered frostbite.', p: 'Liable: injury from cold was foreseeable, so frostbite was within the type of harm, even though rare.' },
  { id: 'jolley', n: 'Jolley v Sutton London Borough Council', y: 2000, a: '1', t: '1.D3', c: 'HL', f: 'A council left an abandoned, rotting boat on its land. Two boys propped it up to repair it; it fell on one, causing serious spinal injuries.', p: 'Liable: some kind of injury from children meddling with the boat was foreseeable; the precise way need not be. The ingenuity of children should be anticipated.' },
  { id: 'froom', n: 'Froom v Butcher', y: 1976, a: '1', t: '1.D4', c: 'CA', f: 'A driver was injured in a crash caused by the defendant; he was not wearing a seatbelt.', p: 'Guidelines for contributory negligence: 25% reduction if a seatbelt would have prevented the injury altogether; 15% if it would have reduced its severity; nothing if it would have made no difference.' },
  { id: 'jonesliviox', n: 'Jones v Livox Quarries', y: 1952, a: '1', t: '1.D4', c: 'CA', f: 'A worker rode on the back towbar of a traxcavator against instructions; another vehicle ran into the back of it.', p: 'Contributory negligence: he exposed himself to the risk of being thrown off or run into; damages reduced.' },
  { id: 'sayers', n: 'Sayers v Harlow UDC', y: 1957, a: '1', t: '1.D4', c: 'CA', f: 'A woman was locked in a public toilet with no inside handle. She tried to climb out by standing on the toilet-roll holder, which rotated and she fell.', p: 'Damages reduced by 25% for her contributory negligence in the way she tried to escape.' },
  { id: 'owens', n: 'Owens v Brimmell', y: 1977, a: '1', t: '1.D4', c: 'HC', f: 'A passenger went drinking with the driver and then accepted a lift home; the driver crashed.', p: 'Damages reduced by 20% for contributory negligence in travelling with a driver he knew had been drinking heavily.' },
  { id: 'pittshunt', n: 'Pitts v Hunt', y: 1991, a: '1', t: '1.D4', c: 'CA', f: 'A pillion passenger encouraged a 16-year-old unlicensed, drunk motorcyclist to drive dangerously; they crashed.', p: 'Volenti was barred by s149 Road Traffic Act 1988, and a 100% reduction for contributory negligence was impossible, but the claim failed on the ground of illegality (ex turpi causa).' },
  { id: 'jayes', n: 'Jayes v IMI (Kynoch)', y: 1985, a: '1', t: '1.D4', c: 'CA', f: 'An experienced worker put his hand into a moving machine while its guard was off, knowing it was dangerous. The employer had breached its statutory duty to keep the machine guarded.', p: 'The Court of Appeal upheld a 100% reduction for contributory negligence. Later cases, especially Pitts v Hunt (1991), said a 100% reduction is logically impossible because the Act assumes responsibility is shared, so Jayes is now treated as doubtful.' },
  { id: 'gough', n: 'Gough v Thorne', y: 1966, a: '1', t: '1.D4', c: 'CA', f: 'A 13½-year-old girl crossed a road when a lorry driver waved her across; a car overtook the lorry and hit her.', p: 'No contributory negligence: she acted as a reasonable child of her age would.' },
  { id: 'scottdocks', n: 'Scott v London and St Katherine Docks', y: 1865, a: '1', t: '1.D5', c: 'Court of Exchequer Chamber', f: 'Six bags of sugar fell from a crane in the defendant’s warehouse onto a customs officer.', p: 'Res ipsa loquitur (“the thing speaks for itself”): where the thing was under the defendant’s control and the accident would not normally happen without negligence, breach can be inferred.' },
  { id: 'halsey', n: 'Halsey v Milton Keynes General NHS Trust', y: 2004, a: '1', t: '1.A3', c: 'CA', f: 'A widow claimed her husband’s death was caused by hospital negligence; the hospital refused mediation and won at trial.', p: 'Courts cannot compel ADR (a view later overruled), but a party who unreasonably refuses ADR may be penalised in costs, even if it wins.' },
  { id: 'churchill', n: 'Churchill v Merthyr Tydfil County Borough Council', y: 2023, a: '1', t: '1.A3', c: 'CA', f: 'Mr Churchill sued the council in nuisance over Japanese knotweed spreading from its land, without using the council’s complaints procedure.', p: 'Courts can lawfully order parties to engage in ADR, or stay proceedings for it, provided this does not impair the essence of the right to a fair trial and is proportionate. Led to CPR changes in October 2024.' },
  { id: 'dunnett', n: 'Dunnett v Railtrack', y: 2002, a: '1', t: '1.A3', c: 'CA', f: 'Railtrack refused an offer of ADR suggested by the court and then won the appeal.', p: 'Railtrack was denied its costs because it had unreasonably refused to consider ADR.' },
  { id: 'youngbristol', n: 'Young v Bristol Aeroplane Co', y: 1944, a: '1', t: '1.C1a', c: 'CA', f: 'An injured worker sued his employer. The question was whether the Court of Appeal was bound by its own earlier decisions.', p: 'The Court of Appeal is bound by its own decisions except where: (1) there are two conflicting previous decisions; (2) its previous decision conflicts with a later House of Lords (Supreme Court) decision; (3) the previous decision was made per incuriam.' },
  { id: 'londonstreet', n: 'London Street Tramways v London County Council', y: 1898, a: '1', t: '1.C1a', c: 'HL', f: 'The House of Lords considered whether it was bound by its own decisions.', p: 'The House of Lords held it was bound by its own previous decisions, for certainty. This rule lasted until the 1966 Practice Statement.' },
  { id: 'ps1966', n: 'Practice Statement (Judicial Precedent)', y: 1966, a: '1', t: '1.C1a', c: 'HL', f: 'Lord Gardiner LC announced that the House of Lords would no longer always be bound by its own previous decisions.', p: 'The House (now the Supreme Court) may depart from a previous decision “when it appears right to do so”, bearing in mind the danger of disturbing contracts, property rights and the need for certainty in criminal law.' },
  { id: 'hedleybyrne', n: 'Hedley Byrne v Heller & Partners', y: 1964, a: '1', t: '1.C1a', c: 'HL', f: 'A bank gave a careless, favourable credit reference about a client, but with a disclaimer (“without responsibility”). The advertising agency relying on it lost money.', p: 'Obiter, a duty of care can exist for negligent misstatements causing pure economic loss where there is a special relationship and reasonable reliance. The disclaimer protected the bank here, so the statement was obiter — later adopted as law.' },
  { id: 'willers', n: 'Willers v Joyce', y: 2016, a: '1', t: '1.C1a', c: 'UKSC', f: 'A claim for malicious prosecution of civil proceedings raised whether the Privy Council’s decision in Crawford Adjusters v Sagicor (2013) represented English law.', p: 'Privy Council decisions are persuasive only, but the Board may expressly direct that its decision represents English law; lower courts then follow it rather than an earlier inconsistent decision.' },
  { id: 'davisjohnson', n: 'Davis v Johnson', y: 1979, a: '1', t: '1.C1a', c: 'CA / HL', f: 'A woman sought an injunction to exclude her violent partner from their jointly rented flat. Earlier CA decisions said she could not.', p: 'Lord Denning in the CA refused to follow the CA’s own earlier decisions. The HL agreed with the result but firmly restated that the CA is bound by its own decisions (subject to Young).' },
  { id: 'herrington', n: 'British Railways Board v Herrington', y: 1972, a: '1', t: '1.C1b', c: 'HL', f: 'A six-year-old boy was badly burnt on an electrified railway line after getting through a broken fence the Board knew about.', p: 'Using the Practice Statement, the HL overruled Addie v Dumbreck (1929): occupiers owe trespassers a “duty of common humanity”. Later replaced by the Occupiers’ Liability Act 1984.' },
  { id: 'shivpuri', n: 'R v Shivpuri', y: 1986, a: '1', t: '1.C1b', c: 'HL', f: 'The defendant believed he was dealing in heroin; the substance was harmless vegetable matter (snuff or similar).', p: 'Guilty of attempting to deal in a controlled drug: s1(2) Criminal Attempts Act 1981 makes attempting the impossible an offence. The HL used the Practice Statement to overrule Anderton v Ryan (1985) just one year after deciding it.' },
  { id: 'balfour', n: 'Balfour v Balfour', y: 1919, a: '1', t: '1.C1b', c: 'CA', f: 'A husband working in Ceylon promised to pay his wife £30 a month while she stayed in England for her health. After they separated, he stopped paying.', p: 'Agreements between spouses living together are presumed not to be intended to create legal relations. Distinguished in Merritt v Merritt.' },
  { id: 'merritt', n: 'Merritt v Merritt', y: 1970, a: '1', t: '1.C1b', c: 'CA', f: 'After the husband left, he signed a written agreement to transfer the house to his wife if she paid off the mortgage. She did; he refused.', p: 'Where spouses have separated (or are about to), the presumption against legal intention is rebutted, especially when the agreement is in writing.' },
  { id: 'knuller', n: 'Knuller v DPP', y: 1973, a: '1', t: '1.C1b', c: 'HL', f: 'A magazine published contact adverts for gay men, when homosexual acts in private had been decriminalised by the Sexual Offences Act 1967.', p: 'The conviction for conspiracy to corrupt public morals was upheld: legal acts could still be “corrupting”. Shows judges enforcing a conventional morality.' },
  { id: 'gould', n: 'R v Gould', y: 1968, a: '1', t: '1.C1b', c: 'CA (Criminal Division)', f: 'Another bigamy appeal, about honest belief that a first spouse was dead or the marriage dissolved.', p: 'Confirmed that the Criminal Division has greater flexibility than the Civil Division to depart from its own decisions where liberty is at stake.' },
  { id: 'holley', n: 'Attorney General for Jersey v Holley', y: 2005, a: '1', t: '1.C1b', c: 'Privy Council (nine members)', f: 'Holley, an alcoholic, killed his partner with an axe after she taunted him. The issue was which characteristics count for the reasonable man in provocation.', p: 'A nine-member Privy Council declined to follow the House of Lords in R v Smith (Morgan) (2000). In R v James and Karimi (2006) the Court of Appeal followed Holley instead of the House of Lords.' },
  { id: 'horncastle', n: 'R v Horncastle', y: 2009, a: '1', t: '1.C1b', c: 'UKSC', f: 'Defendants were convicted partly on hearsay evidence of absent witnesses; the ECtHR in Al-Khawaja had said a conviction based “solely or decisively” on such evidence breached Art 6.', p: 'The Supreme Court declined to follow the Strasbourg chamber, explaining its concerns about English procedure. The Grand Chamber later softened its approach. Shows s2 HRA means “take into account”, not “follow”.' },
  { id: 'jameskarimi', n: 'R v James and Karimi', y: 2006, a: '1', t: '1.C1b', c: 'CA', f: 'Two appeals on the provocation defence raised the conflict between Smith (Morgan) (HL) and Holley (PC).', p: 'The CA followed the Privy Council in Holley instead of the House of Lords, because Holley had in effect overruled Smith. A rare exception to the hierarchy.' },
  { id: 'rtaylor', n: 'R v Taylor', y: 1950, a: '1', t: '1.C1b', c: 'Court of Criminal Appeal', f: 'A defendant appealed against a bigamy conviction.', p: 'The Criminal Division may depart from its own previous decision if the law was misapplied or misunderstood and a person’s liberty is at stake.' },
  { id: 'jackson', n: 'R (Jackson) v Attorney General', y: 2005, a: '2', t: '2.A3', c: 'HL', f: 'The Countryside Alliance argued the Hunting Act 2004 was invalid because it was passed under the Parliament Act 1949, which had itself been passed without the Lords’ consent using the 1911 Act.', p: 'The Parliament Act 1949 and the Hunting Act 2004 were valid. Obiter, several Law Lords suggested there may be limits to parliamentary sovereignty (e.g. abolishing judicial review).' },
  { id: 'miller2017', n: 'R (Miller) v Secretary of State for Exiting the EU', y: 2017, a: '2', t: '2.A3', c: 'UKSC', f: 'The government planned to trigger Article 50 (notice to leave the EU) using the royal prerogative, without an Act of Parliament.', p: 'The prerogative cannot be used to change domestic law or remove rights created by statute; an Act of Parliament was needed. The Sewel convention is political, not legally enforceable.' },
  { id: 'miller2019', n: 'R (Miller) v Prime Minister; Cherry v Advocate General', y: 2019, a: '2', t: '2.A3', c: 'UKSC', f: 'The Prime Minister advised the Queen to prorogue (suspend) Parliament for five weeks in the run-up to the Brexit deadline.', p: 'The prorogation was unlawful and void because it frustrated Parliament’s constitutional functions without reasonable justification. The courts will police the limits of prerogative powers to protect parliamentary sovereignty and accountability.' },
  { id: 'whiteley', n: 'Whiteley v Chappell', y: 1868, a: '2', t: '2.A4', c: 'QB', f: 'It was an offence to impersonate “any person entitled to vote”. The defendant voted in the name of a dead man.', p: 'Literal rule: a dead person is not “entitled to vote”, so no offence. Shows the literal rule can defeat Parliament’s obvious purpose.' },
  { id: 'berriman', n: 'London & North Eastern Railway v Berriman', y: 1946, a: '2', t: '2.A4', c: 'HL', f: 'A railway worker was killed while oiling points. Compensation was only payable if a lookout was provided for workers “relaying or repairing” track.', p: 'Literal rule: oiling was “maintaining”, not relaying or repairing, so the widow received nothing. A harsh result.' },
  { id: 'rallen', n: 'R v Allen', y: 1872, a: '2', t: '2.A4', c: 'Court for Crown Cases Reserved', f: 'Bigamy (s57 OAPA 1861): “whosoever being married shall marry any other person”. A married person cannot legally “marry” again.', p: 'Golden rule (narrow approach): “marry” was read as “go through a ceremony of marriage”, avoiding an absurdity.' },
  { id: 'adler', n: 'Adler v George', y: 1964, a: '2', t: '2.A4', c: 'Divisional Court', f: 'The Official Secrets Act 1920 made it an offence to obstruct a member of the armed forces “in the vicinity of” a prohibited place. The defendant was inside the base.', p: 'Golden rule (narrow approach): “in the vicinity of” was read to include “in” to avoid an absurd result.' },
  { id: 'sigsworth', n: 'Re Sigsworth', y: 1935, a: '2', t: '2.A4', c: 'HC', f: 'A son murdered his mother, who died without a will. Under the Administration of Estates Act 1925 he was her next of kin and would inherit.', p: 'Golden rule (wide approach): although the words were clear, applying them would be repugnant; a murderer cannot benefit from his crime.' },
  { id: 'heydon', n: 'Heydon’s Case', y: 1584, a: '2', t: '2.A4', c: 'Court of Exchequer', f: 'A dispute over land leases. The court set out how statutes should be interpreted.', p: 'Mischief rule: ask (1) what was the common law before the Act? (2) what was the mischief or defect? (3) what remedy did Parliament provide? (4) what was the true reason for the remedy?' },
  { id: 'smithhughes', n: 'Smith v Hughes', y: 1960, a: '2', t: '2.A4', c: 'Divisional Court', f: 'Prostitutes tapped on windows and called from balconies to men in the street. The Street Offences Act 1959 made it an offence to solicit “in a street”.', p: 'Mischief rule: the Act aimed to stop people being molested by prostitutes in the street, so soliciting from a building counted.' },
  { id: 'rcn', n: 'Royal College of Nursing v DHSS', y: 1981, a: '2', t: '2.A4', c: 'HL', f: 'The Abortion Act 1967 required abortions to be carried out by a “registered medical practitioner”. Medically induced abortions were carried out mostly by nurses.', p: 'Mischief rule (3–2 majority): the mischief was unsafe back-street abortions; the Act was satisfied because a doctor was in charge. Dissent: this was “redrafting with a vengeance”.' },
  { id: 'pepper', n: 'Pepper v Hart', y: 1993, a: '2', t: '2.A4', c: 'HL', f: 'Teachers at a private school paid reduced fees for their children. The tax due depended on the meaning of “cost of a benefit” in the Finance Act 1976.', p: 'Hansard may be consulted where legislation is ambiguous or obscure or leads to an absurdity, the statement is by a minister or promoter of the Bill, and it is clear. Overruled Davis v Johnson using the Practice Statement.' },
  { id: 'fisherbell', n: 'Fisher v Bell', y: 1960, a: '2', t: '2.A4', c: 'Divisional Court', f: 'A shopkeeper displayed a flick knife in his window. The Restriction of Offensive Weapons Act 1959 made it an offence to “offer for sale” such knives.', p: 'Literal rule, using the technical contract meaning: a display is an invitation to treat, not an offer, so no offence. Parliament amended the Act in 1961.' },
  { id: 'aylesbury', n: 'Agricultural Training Board v Aylesbury Mushrooms', y: 1972, a: '2', t: '2.B1', c: 'HC', f: 'The Minister of Labour had to consult interested organisations before making an order; the Mushroom Growers’ Association was not consulted.', p: 'Procedural ultra vires: the order did not apply to mushroom growers because the required procedure (consultation) was not followed.' },
  { id: 'strickland', n: 'Strickland v Hayes Borough Council', y: 1896, a: '2', t: '2.B1', c: 'Divisional Court', f: 'A by-law banned singing or reciting obscene songs “in any street or public place” and anywhere else — including private places.', p: 'The by-law was unreasonable (too wide) and so ultra vires.' },
  { id: 'wednesbury', n: 'Associated Provincial Picture Houses v Wednesbury Corporation', y: 1948, a: '2', t: '2.B1', c: 'CA', f: 'A council allowed a cinema to open on Sundays on condition that no children under 15 were admitted.', p: 'The condition was not unreasonable. A decision is only unlawful for unreasonableness if it is so unreasonable that no reasonable authority could have made it (“Wednesbury unreasonableness”).' },
  { id: 'unison', n: 'R (UNISON) v Lord Chancellor', y: 2017, a: '2', t: '2.B1', c: 'UKSC', f: 'The Employment Tribunals and the Employment Appeal Tribunal Fees Order 2013 introduced fees of up to £1,200; claims fell by about 70%.', p: 'The Fees Order was quashed as ultra vires: it prevented access to justice, which is inherent in the rule of law. Over £30 million of fees was refunded.' },
  { id: 'curedeeley', n: 'Customs and Excise Commissioners v Cure & Deeley', y: 1962, a: '2', t: '2.B1', c: 'HC', f: 'Commissioners given power to make regulations for collecting purchase tax made a regulation letting them decide the amount of tax due themselves.', p: 'Substantive ultra vires: the regulation went beyond the powers in the enabling Act and was void.' },
  { id: 'factortame', n: 'R v Secretary of State for Transport, ex p Factortame (No 2)', y: 1991, a: '2', t: '2.B2', c: 'HL', f: 'The Merchant Shipping Act 1988 restricted the registration of fishing boats owned by Spanish nationals, contrary to EU law on freedom of establishment.', p: 'While the UK was in the EU, UK courts could disapply an Act of Parliament that conflicted with directly effective EU law (European Communities Act 1972 s2(4)).' },
  { id: 'vangend', n: 'Van Gend en Loos v Nederlandse Administratie der Belastingen', y: 1963, a: '2', t: '2.B2', c: 'CJEU', f: 'A Dutch importer was charged increased customs duty on chemicals, contrary to a treaty article banning new customs duties.', p: 'Treaty articles that are clear, precise and unconditional have direct effect: individuals can rely on them in their national courts. The EU is “a new legal order”.' },
  { id: 'costa', n: 'Costa v ENEL', y: 1964, a: '2', t: '2.B2', c: 'CJEU', f: 'An Italian shareholder of a nationalised electricity company refused to pay his bill, arguing nationalisation breached the EEC Treaty.', p: 'EU law has supremacy over conflicting national law, including later national law. Member states have limited their sovereign rights.' },
  { id: 'marshall', n: 'Marshall v Southampton and South West Hampshire AHA', y: 1986, a: '2', t: '2.B2', c: 'CJEU', f: 'A dietitian was forced to retire at 62 when men could work until 65, contrary to the Equal Treatment Directive. Her employer was a health authority.', p: 'Directives have vertical direct effect: they can be enforced against the state and its bodies, but not horizontally against private individuals.' },
  { id: 'francovich', n: 'Francovich v Italy', y: 1991, a: '2', t: '2.B2', c: 'CJEU', f: 'Italy failed to implement a directive guaranteeing employees’ wages when an employer went insolvent. Workers were left unpaid.', p: 'State liability: an individual can claim damages from a member state that fails to implement a directive, if the directive confers rights, they are identifiable, and there is a causal link.' },
  { id: 'fraill', n: 'Attorney General v Fraill', y: 2011, a: '2', t: '2.C3', c: 'Divisional Court', f: 'A juror contacted an acquitted defendant on Facebook during a drugs trial and discussed the case.', p: 'Contempt of court: the juror was jailed for eight months. The trial collapsed at great cost. Now an offence under the Juries Act 1974 (as amended in 2015).' },
  { id: 'twomey', n: 'R v Twomey', y: 2009, a: '2', t: '2.C3', c: 'CA', f: 'Three earlier trials for an armed robbery at Heathrow collapsed, one because of serious attempted jury tampering.', p: 'The first Crown Court trial without a jury in England and Wales for over 350 years was ordered under s44 Criminal Justice Act 2003.' },
  { id: 'ponting', n: 'R v Ponting', y: 1985, a: '2', t: '2.C3', c: 'Crown Court', f: 'A civil servant leaked documents about the sinking of the General Belgrano. The judge said there was no defence under the Official Secrets Act 1911.', p: 'The jury acquitted anyway — jury equity. Parliament responded with the Official Secrets Act 1989.' },
  { id: 'young', n: 'R v Young', y: 1995, a: '2', t: '2.C3', c: 'CA', f: 'In a double murder trial, some jurors used a Ouija board in their hotel overnight to “contact” one of the victims.', p: 'The conviction was quashed and a retrial ordered. Because it happened in the hotel, not the jury room, the court could investigate it.' },
  { id: 'mirza', n: 'R v Mirza; R v Connor and Rollock', y: 2004, a: '2', t: '2.C3', c: 'HL', f: 'After conviction, jurors wrote alleging other jurors had shown racial prejudice or wanted to convict to get home quickly.', p: 'The courts cannot inquire into what was said in the jury room: jury secrecy is essential. Evidence of outside influence is different.' },
  { id: 'dallas', n: 'Attorney General v Dallas', y: 2012, a: '2', t: '2.C3', c: 'Divisional Court', f: 'A juror researched the defendant online, found he had been accused of rape before, and told other jurors.', p: 'Jailed for six months for contempt. Led to specific offences of juror research and sharing information (Criminal Justice and Courts Act 2015).' },
  { id: 'pinochet', n: 'R v Bow Street Metropolitan Stipendiary Magistrate, ex p Pinochet Ugarte (No 2)', y: 1999, a: '2', t: '2.C4', c: 'HL', f: 'The House of Lords decided the former Chilean dictator could be extradited. One of the Law Lords, Lord Hoffmann, was an unpaid director of a charity linked to Amnesty International, which had intervened in the case.', p: 'The decision was set aside and reheard by a new panel: a judge is automatically disqualified if they have an interest in the outcome, to preserve impartiality and public confidence.' },
  { id: 'pittwood', n: 'R v Pittwood', y: 1902, a: '2', t: '2.D1', c: 'Assizes', f: 'A railway gatekeeper went to lunch leaving the crossing gate open. A hay cart was hit by a train and the driver killed.', p: 'A duty to act can arise from a contract of employment; failure to perform it can be the actus reus of manslaughter.' },
  { id: 'stone', n: 'R v Stone and Dobinson', y: 1977, a: '2', t: '2.D1', c: 'CA', f: 'Stone’s sister, who had anorexia, came to live with the couple, who were of limited ability. They made only feeble efforts to get help as she became bedridden and died.', p: 'By voluntarily taking her in and trying to care for her, they assumed a duty of care; their failure was gross negligence manslaughter.' },
  { id: 'gibbins', n: 'R v Gibbins and Proctor', y: 1918, a: '2', t: '2.D1', c: 'Court of Criminal Appeal', f: 'A father and his partner deliberately withheld food from his seven-year-old daughter, who starved to death.', p: 'A parent has a duty to care for their child (special relationship); the partner had assumed a duty. Both guilty of murder.' },
  { id: 'miller', n: 'R v Miller', y: 1983, a: '2', t: '2.D1', c: 'HL', f: 'A squatter fell asleep with a lit cigarette, woke to find the mattress on fire, and simply moved to another room. The house was damaged.', p: 'A person who accidentally creates a dangerous situation and becomes aware of it has a duty to take reasonable steps to limit the harm. Guilty of arson.' },
  { id: 'white', n: 'R v White', y: 1910, a: '2', t: '2.D1', c: 'Court of Criminal Appeal', f: 'White poisoned his mother’s drink, intending to kill her. She died of an unrelated heart attack before the poison could work.', p: 'Not guilty of murder: she would have died anyway — no factual causation (but-for test). Guilty of attempted murder.' },
  { id: 'pagett', n: 'R v Pagett', y: 1983, a: '2', t: '2.D1', c: 'CA', f: 'Pagett used his pregnant girlfriend as a human shield and fired at armed police, who fired back and killed her.', p: 'But for his actions she would not have died; the police’s reasonable reaction in self-defence did not break the chain of causation.' },
  { id: 'smith', n: 'R v Smith', y: 1959, a: '2', t: '2.D1', c: 'Courts-Martial Appeal Court', f: 'A soldier was stabbed in a barracks fight. He was dropped twice while being carried to the medical station and received poor treatment; he died.', p: 'The stab wound was still an “operating and substantial” cause of death, so the chain was not broken.' },
  { id: 'jordan', n: 'R v Jordan', y: 1956, a: '2', t: '2.D1', c: 'Court of Criminal Appeal', f: 'A stab victim was given an antibiotic to which he was known to be allergic, and excessive fluids, when his wound had almost healed.', p: 'The “palpably wrong” treatment broke the chain of causation; the conviction for murder was quashed. Exceptional case.' },
  { id: 'cheshire', n: 'R v Cheshire', y: 1991, a: '2', t: '2.D1', c: 'CA', f: 'A man shot in the leg and stomach developed breathing problems from a tracheotomy performed negligently in hospital, and died.', p: 'Negligent medical treatment breaks the chain only if it is so independent of the defendant’s acts, and so potent in causing death, that the original injury becomes insignificant.' },
  { id: 'blaue', n: 'R v Blaue', y: 1975, a: '2', t: '2.D1', c: 'CA', f: 'Blaue stabbed a young woman. She was a Jehovah’s Witness and refused a blood transfusion that would have saved her.', p: 'The thin skull rule: the defendant must take the victim as he finds her, including her beliefs. Guilty of manslaughter.' },
  { id: 'cunningham', n: 'R v Cunningham', y: 1957, a: '2', t: '2.D1', c: 'Court of Criminal Appeal', f: 'Cunningham ripped a gas meter from the wall of an empty house to steal the money; gas seeped next door and a woman was affected.', p: 'Recklessness is subjective: the defendant must foresee the risk of harm and go on to take it. He did not foresee it — conviction quashed. “Maliciously” means intentionally or recklessly.' },
  { id: 'rvg', n: 'R v G and another', y: 2003, a: '2', t: '2.D1', c: 'HL', f: 'Two boys aged 11 and 12 set fire to newspapers behind a shop; the fire spread and caused about £1 million of damage. They did not foresee the risk.', p: 'Recklessness is subjective: the defendant must be aware of a risk and unreasonably take it. The HL overruled the objective test in MPC v Caldwell (1982).' },
  { id: 'storkwain', n: 'Pharmaceutical Society of GB v Storkwain', y: 1986, a: '2', t: '2.D1', c: 'HL', f: 'A pharmacist supplied drugs on prescriptions that turned out to be forgeries, which he could not have detected.', p: 'Strict liability: the Medicines Act 1968 offence did not require knowledge.' },
  { id: 'shah', n: 'Harrow LBC v Shah and Shah', y: 1999, a: '2', t: '2.D1', c: 'Divisional Court', f: 'A newsagent’s employee sold a lottery ticket to a 13-year-old, believing him to be over 16. The owners had told staff to ask for ID.', p: 'Strict liability offence — no mens rea as to age was needed. The owners were guilty.' },
  { id: 'sweetparsley', n: 'Sweet v Parsley', y: 1970, a: '2', t: '2.D1', c: 'HL', f: 'A teacher sublet a farmhouse to students who smoked cannabis there without her knowledge. She was charged with being concerned in the management of premises used for smoking cannabis.', p: 'There is a presumption that Parliament intends mens rea to be required in criminal offences; it was not rebutted. Conviction quashed.' },
  { id: 'thabomeli', n: 'Thabo Meli v R', y: 1954, a: '2', t: '2.D1', c: 'Privy Council', f: 'The defendants hit a man over the head intending to kill him, then, thinking he was dead, threw his body over a cliff. He died of exposure.', p: 'Where there is a series of acts forming one transaction, it is enough that the mens rea existed at some point during it.' },
  { id: 'woollin', n: 'R v Woollin', y: 1998, a: '2', t: '2.D1', c: 'HL', f: 'Woollin lost his temper and threw his three-month-old son across the room at a pram; the baby hit a wall and died.', p: 'The jury may “find” intention if death or serious bodily harm was a virtual certainty (barring some unforeseen intervention) as a result of the defendant’s actions, and the defendant appreciated this. Murder conviction replaced with manslaughter.' },
  { id: 'logdon', n: 'Logdon v DPP', y: 1976, a: '2', t: '2.D2a', c: 'Divisional Court', f: 'As a joke, Logdon showed a woman a gun in a drawer and said he would hold her hostage. It was a replica.', p: 'An assault: she apprehended immediate unlawful force, even though the gun was fake.' },
  { id: 'ireland', n: 'R v Ireland; R v Burstow', y: 1997, a: '2', t: '2.D2a', c: 'HL', f: 'Ireland made silent phone calls to women; Burstow stalked a woman for months. The victims suffered psychiatric illness.', p: 'Silent phone calls can be an assault if they cause fear of immediate force. Recognised psychiatric illness can be ABH or GBH, and GBH can be “inflicted” without a physical assault.' },
  { id: 'tuberville', n: 'Tuberville v Savage', y: 1669, a: '2', t: '2.D2a', c: 'King’s Bench', f: 'The defendant put his hand on his sword and said: “If it were not assize time, I would not take such language from you.”', p: 'Words can negate an assault: as the judges were in town, he was indicating he would not use force.' },
  { id: 'constanza', n: 'R v Constanza', y: 1997, a: '2', t: '2.D2a', c: 'CA', f: 'A man stalked a woman for 20 months and sent 800 letters, two of which she read as clear threats.', p: 'Words, including written words, can amount to an assault; fear of violence “at some time not excluding the immediate future” was enough.' },
  { id: 'collinswilcock', n: 'Collins v Wilcock', y: 1984, a: '2', t: '2.D2a', c: 'Divisional Court', f: 'A police officer held a woman’s arm to stop her walking away when she had not been arrested.', p: 'Battery is the application of unlawful force; the officer went beyond the ordinary touching of everyday life, which people are taken to accept.' },
  { id: 'dppk', n: 'DPP v K', y: 1990, a: '2', t: '2.D2a', c: 'Divisional Court', f: 'A schoolboy hid acid in a hand dryer after a chemistry lesson; another pupil used the dryer and was scarred.', p: 'Battery can be committed indirectly.' },
  { id: 'haystead', n: 'Haystead v Chief Constable of Derbyshire', y: 2000, a: '2', t: '2.D2a', c: 'Divisional Court', f: 'Haystead punched a woman holding her baby, causing her to drop the child, who hit the floor.', p: 'Indirect battery on the baby.' },
  { id: 'thomas', n: 'R v Thomas', y: 1985, a: '2', t: '2.D2a', c: 'CA', f: 'A school caretaker touched the bottom of a girl’s skirt and rubbed it.', p: 'Touching a person’s clothing is equivalent to touching the person for battery.' },
  { id: 'fagan', n: 'Fagan v Metropolitan Police Commissioner', y: 1969, a: '2', t: '2.D2a', c: 'Divisional Court', f: 'A driver accidentally drove onto a police officer’s foot, then refused to move for a while.', p: 'Battery as a continuing act: the actus reus continued while the car remained on the foot, so it coincided with the mens rea formed later.' },
  { id: 'rmiller', n: 'R v Miller', y: 1954, a: '2', t: '2.D2b', c: 'Assizes', f: 'A husband attacked his wife, causing hysteria and a nervous condition.', p: 'Actual bodily harm is “any hurt or injury calculated to interfere with the health or comfort” of the victim.' },
  { id: 'chanfook', n: 'R v Chan-Fook', y: 1994, a: '2', t: '2.D2b', c: 'CA', f: 'A man accused of stealing a ring was questioned aggressively and locked in a room; he escaped and injured himself.', p: 'ABH can include psychiatric injury, but not mere emotions such as fear, distress or panic.' },
  { id: 'roberts', n: 'R v Roberts', y: 1971, a: '2', t: '2.D2b', c: 'CA', f: 'A woman jumped from a moving car to escape the driver’s sexual advances and was injured.', p: 'The driver caused the injury: the victim’s reaction was reasonably foreseeable — only a “daft” reaction would break the chain.' },
  { id: 'savage', n: 'R v Savage; DPP v Parmenter', y: 1991, a: '2', t: '2.D2b', c: 'HL', f: 'Savage threw beer over a woman in a pub; the glass slipped and cut her wrist. Parmenter threw his baby about roughly, not realising it could cause injury.', p: 'For s47 the mens rea is only that for the assault or battery — no need to foresee any harm. For s20 the defendant must foresee some harm, though not serious harm.' },
  { id: 'dppsmith', n: 'DPP v Smith', y: 1961, a: '2', t: '2.D2c', c: 'HL', f: 'A driver with stolen goods sped off when a police officer clung to his car, and the officer was thrown off and killed.', p: 'Grievous bodily harm means “really serious harm”. (The objective test of intention in the case was reversed by s8 Criminal Justice Act 1967.)' },
  { id: 'eisenhower', n: 'JCC (a minor) v Eisenhower', y: 1984, a: '2', t: '2.D2c', c: 'Divisional Court', f: 'A boy fired an air gun; a pellet hit the victim near the eye, rupturing blood vessels under the skin.', p: 'A wound requires a break in both layers of the skin (dermis and epidermis); internal bleeding is not a wound.' },
  { id: 'bollom', n: 'R v Bollom', y: 2003, a: '2', t: '2.D2c', c: 'CA', f: 'A 17-month-old child suffered bruises and abrasions on her body, arms and legs.', p: 'Whether injuries amount to GBH depends on all the circumstances, including the age and health of the victim.' },
  { id: 'dica', n: 'R v Dica', y: 2004, a: '2', t: '2.D2c', c: 'CA', f: 'Dica, knowing he was HIV positive, had unprotected sex with two women who did not know and became infected.', p: 'Recklessly infecting someone with HIV can be inflicting GBH under s20; informed consent to the risk could be a defence, but they had not consented.' },
  { id: 'mowatt', n: 'R v Mowatt', y: 1968, a: '2', t: '2.D2c', c: 'CA', f: 'Mowatt was accused of theft and repeatedly punched the man who challenged him, causing serious injury.', p: 'For s20 the defendant need only foresee that some physical harm might result, not the particular harm or serious harm.' },
  { id: 'belfon', n: 'R v Belfon', y: 1976, a: '2', t: '2.D2c', c: 'CA', f: 'Belfon slashed a man with a razor during an attack.', p: 'For s18, recklessness is not enough — there must be specific intent to cause GBH.' }
]);

/* ---------- A1 Features of civil law ---------- */
TOPICS.push({
  id: '1.A1', unit: '1', ref: 'A1', title: 'Features of civil law',
  short: 'The aim and purpose of civil law; the standard and burden of proof in civil cases',
  summary: 'Civil law deals with disputes between private individuals and organisations — for example, a claim for compensation after a car crash. Its purpose is to put right a wrong, usually by awarding compensation, rather than to punish. The person bringing the claim must prove it on the balance of probabilities.',
  spec: ['Aim and purpose of civil law', 'Standard of proof in civil cases', 'Burden of proof in civil cases'],
  learn: [
    { h: 'Civil and criminal law compared', html: `
<div class="tbl"><table><tr><th></th><th>Civil law</th><th>Criminal law</th></tr>
<tr><td><b>Purpose</b></td><td>To resolve disputes and compensate for loss; put the claimant back in the position they would have been in</td><td>To punish wrongdoing and protect society</td></tr>
<tr><td><b>Parties</b></td><td>Claimant v defendant (e.g. <i>Smith v Jones</i>)</td><td>The Crown (R) v defendant (e.g. <i>R v Jones</i>)</td></tr>
<tr><td><b>Who starts the case</b></td><td>The person wronged (claimant)</td><td>Usually the state — police and CPS</td></tr>
<tr><td><b>Standard of proof</b></td><td><b>Balance of probabilities</b></td><td>Beyond reasonable doubt</td></tr>
<tr><td><b>Outcome</b></td><td>Liable or not liable; remedies such as damages or an injunction</td><td>Guilty or not guilty; sentence</td></tr>
<tr><td><b>Courts</b></td><td>County Court, High Court</td><td>Magistrates’ court, Crown Court</td></tr>
<tr><td><b>Examples</b></td><td>Negligence, contract, family, employment, housing</td><td>Assault, theft, murder</td></tr></table></div>
<p>The same event can lead to both: a driver who injures a pedestrian may be prosecuted for careless driving <i>and</i> sued in negligence ([[c:simpsoncivil]]).</p>` },
    { h: 'Aim and purpose of civil law', html: `
<ul><li>To provide a way of <b>resolving disputes</b> peacefully between individuals, businesses and public bodies.</li>
<li>To <b>compensate</b> people who have suffered loss because of another’s wrongdoing — in negligence, <b>damages</b> aim to put the claimant in the position they would have been in if the tort had not happened (D4).</li>
<li>To set <b>standards of behaviour</b> — for example, the duty to take reasonable care — and encourage safety.</li>
<li>To provide other <b>remedies</b>: injunctions (orders to do or stop doing something), specific performance, declarations.</li></ul>` },
    { h: 'Burden and standard of proof', html: `
<ul><li>The <b>burden of proof</b> is on the <b>claimant</b> — they must prove each element of their claim ([[c:reb]]).</li>
<li>The <b>standard of proof</b> is the <b>balance of probabilities</b>: the court must be satisfied the claimant’s version is more likely than not (more than 50%) to be true.</li>
<li>In some negligence cases, <b>res ipsa loquitur</b> (“the thing speaks for itself”) helps the claimant by allowing the court to infer negligence from the facts (D5).</li></ul>` }
  ],

/* ---------- A2 Civil courts ---------- */
TOPICS.push({
  id: '1.A2', unit: '1', ref: 'A2', title: 'The civil courts and appeals',
  short: 'Civil courts of first instance and appeal, tracks, reasons and permission to appeal, and the role of judges',
  summary: 'Most negligence claims are heard in the County Court; larger and more complex claims go to the High Court. Claims are allocated to a track according to their value and complexity. Appeals need permission and go up the hierarchy to the Court of Appeal and, rarely, the Supreme Court. Judges manage cases, decide liability and damages, and create precedent.',
  spec: ['Civil court hierarchy: civil courts of first instance', 'Civil courts of appeal', 'Reasons, permissions and how to appeal', 'Role of judges in civil cases'],
  learn: [
    { h: 'Courts of first instance', html: `
<ul><li><b>County Court</b> — a single national court sitting in local hearing centres. It hears most negligence and other civil claims.</li>
<li><b>High Court</b> — three divisions. The <b>King’s Bench Division</b> hears larger negligence and personal injury claims (personal injury claims worth £50,000 or more can be started there); the Chancery Division deals with business and property; the Family Division with family cases.</li>
<li>Claims are started with a claim form (many money claims online). Before starting, parties should follow the relevant <b>pre-action protocol</b> (e.g. for personal injury) — exchanging information and trying to settle ([[c:multitrack]]).</li></ul>` },
    { h: 'The track system', html: `
<p>If the defendant defends the claim, a judge allocates it to a track (Civil Procedure Rules Part 26), mainly by value but also by complexity:</p>
<div class="tbl"><table><tr><th>Track</th><th>Value</th><th>Features</th></tr>
<tr><td><b>Small claims</b></td><td>Up to £10,000 (personal injury where the injury part is up to £1,000; road traffic whiplash claims up to £5,000)</td><td>District Judge, informal hearing, parties often unrepresented, costs generally not recoverable; many claims referred first to free mediation</td></tr>
<tr><td><b>Fast track</b></td><td>£10,000–£25,000</td><td>Trial usually within a day; strict timetable; fixed recoverable costs</td></tr>
<tr><td><b>Intermediate track</b></td><td>£25,000–£100,000 (since October 2023)</td><td>Trial of up to three days; limited expert evidence; fixed recoverable costs</td></tr>
<tr><td><b>Multi-track</b></td><td>Over £100,000, or complex cases</td><td>Circuit Judge or High Court judge; case management conferences; costs budgeting</td></tr></table></div>
<p>Try the <b>track allocation</b> tool in Explore.</p>` },
    { h: 'Appeals', html: `
<ul><li><b>Reasons to appeal</b>: the decision was <b>wrong</b> (e.g. the judge misapplied the law or reached a finding on the facts no reasonable judge could make), or <b>unjust because of a serious procedural irregularity</b> (CPR 52.21). A party may appeal against liability or the amount of damages.</li>
<li><b>Permission</b> is needed for almost all appeals — from the trial court or the appeal court. It is granted only if the appeal has a <b>real prospect of success</b> or there is some other compelling reason (CPR 52.6). A second appeal needs an <b>important point of principle or practice</b>.</li>
<li><b>Routes</b>: District Judge → Circuit Judge; County Court (Circuit Judge) → High Court judge, or to the <b>Court of Appeal (Civil Division)</b>; High Court → Court of Appeal (Civil Division) → <b>Supreme Court</b> (only on arguable points of law of general public importance). A “leapfrog” appeal can go straight from the High Court to the Supreme Court.</li>
<li><b>How</b>: file an appellant’s notice within 21 days of the decision (usually), with grounds of appeal.</li>
<li><b>Powers</b> of the appeal court: affirm, set aside or vary the decision; order a new trial; award costs.</li></ul>` },
    { h: 'The role of judges', html: `
<ul><li><b>District Judges</b> — small claims and fast-track cases, case management.</li><li><b>Circuit Judges</b> — multi-track cases in the County Court, appeals from District Judges.</li><li><b>High Court judges</b> — high-value and complex claims.</li><li><b>Lord and Lady Justices of Appeal; Justices of the Supreme Court</b> — appeals and precedent.</li></ul>
<p>In negligence cases there is <b>no jury</b>: the judge decides the facts, liability and the amount of damages, gives a reasoned judgment and manages the case under the <b>overriding objective</b> (dealing with cases justly and at proportionate cost). Appeal judges develop the law through precedent (C1).</p>` }
  ],
  debate: [{ q: 'Is the civil court system accessible and efficient?', for: ['Tracks match procedure and cost to the size of the claim.', 'Online claims and mediation make small claims simpler.', 'Fixed costs make spending predictable.'], ag: ['Delays: waiting times for fast- and multi-track trials have been long.', 'Court fees and legal costs are high.', 'Many people represent themselves after legal aid cuts.', 'Permission to appeal is hard to get.'] }],
  cases: ['multitrack'],
  worked: [],
  pitfalls: ['Saying negligence cases are heard by a jury.', 'Forgetting that permission is needed to appeal.', 'Out-of-date track limits — the intermediate track has existed since October 2023.'],
  cards: [
    ['Which court hears most negligence claims?', 'The County Court.'],
    ['Which High Court division hears negligence claims?', 'The King’s Bench Division.'],

  learn: [
    { h: 'Conditional fee agreements (CFAs)', html: `
<ul><li>A “<b>no win, no fee</b>” agreement (Courts and Legal Services Act 1990 s58). If the claim fails, the client pays no fee to their own lawyer. If it succeeds, the lawyer receives their normal fee plus a <b>success fee</b> (up to 100% of basic costs).</li>
<li>Since the <b>Legal Aid, Sentencing and Punishment of Offenders Act 2012</b> (LASPO), the success fee is <b>not recoverable</b> from the losing defendant — it comes out of the claimant’s damages, and in personal injury claims it is capped at <b>25%</b> of general damages and past losses.</li>
<li>Usually combined with <b>after-the-event (ATE) insurance</b> to cover the other side’s costs and disbursements (such as expert fees) if the claim fails. In personal injury, claimants are largely protected from paying the defendant’s costs by qualified one-way costs shifting (B3).</li>
<li>Damages-based agreements (the lawyer takes a percentage of the damages) are also possible.</li></ul>` },

<div class="tbl"><table><tr><th>Source</th><th>How it works</th><th>Limitations</th></tr>
<tr><td><b>Own resources</b></td><td>Paying privately — hourly rates or fixed fees</td><td>Expensive; risk of paying the other side’s costs</td></tr>
<tr><td><b>Insurance</b></td><td>Before-the-event (BTE) legal expenses insurance, often added to home or motor policies</td><td>Many people do not know they have it; limits on cover; insurer may choose the lawyer</td></tr>

TOPICS.push({
  id: '1.B3', unit: '1', ref: 'B3', title: 'The cost of taking legal action',
  short: 'Court costs, legal representation costs, costs against the unsuccessful party, and hidden costs including reputation and enforcing an award',
  summary: 'Before advising a client to sue, a lawyer must explain the costs and risks. This topic covers court fees, lawyers’ fees, the “loser pays” rule and its exceptions, and hidden costs such as time, stress, damage to reputation and the difficulty of enforcing a judgment.',
  spec: ['Court costs', 'Legal representation costs', 'Awarding of costs against the unsuccessful party', 'Hidden costs, loss of reputation, enforcement of award'],
  learn: [
    { h: 'Court and legal costs', html: `
<ul><li><b>Court fees</b> — an issue fee to start the claim (rising with the value of the claim; for larger claims it is a percentage of the amount claimed) and a hearing fee. People on low incomes may get help with fees (fee remission).</li>
<li><b>Legal representation costs</b> — solicitors’ and barristers’ fees, often charged by the hour, plus <b>disbursements</b> such as medical experts’ reports.</li>
<li><b>Fixed recoverable costs</b> apply to most fast-track and intermediate-track claims (extended in October 2023), so the amount the winner can recover from the loser is set in advance.</li></ul>` },
    { h: 'Who pays? Costs orders', html: `
<ul><li>The general rule is that <b>the loser pays the winner’s costs</b> (“costs follow the event”, CPR Part 44), though the court has discretion.</li>
<li><b>Small claims track</b>: costs are generally <b>not</b> recoverable, apart from fixed court fees and limited expenses.</li>
<li><b>Qualified one-way costs shifting (QOCS)</b>: since 2013, in personal injury claims an unsuccessful claimant usually does not have to pay the defendant’s costs (unless the claim is fundamentally dishonest or struck out).</li>
<li><b>Part 36 offers</b>: if a party rejects a settlement offer and then does no better at trial, it faces costs penalties — a strong incentive to settle.</li>
<li>Unreasonable refusal of ADR can lead to a costs penalty (A3).</li></ul>` },
    { h: 'Hidden costs and enforcement', html: `
<ul><li><b>Hidden costs</b>: time off work, travel, stress and anxiety, damaged relationships, the length of proceedings (often years for serious injury claims).</li>
<li><b>Loss of reputation</b>: public hearings and judgments can harm the reputation of both individuals and businesses (e.g. a hospital or a company found negligent).</li>
<li><b>Enforcement of the award</b>: winning does not guarantee payment. If the defendant does not pay, the claimant must apply to enforce — a <b>warrant of control</b> (enforcement agents seize goods), an <b>attachment of earnings order</b>, a <b>charging order</b> on property or a <b>third-party debt order</b> (freezing a bank account). A defendant with no money or insurance may never pay. In most negligence cases the defendant is insured, which makes recovery more likely.</li></ul>` }
  ],

  short: 'Stare decisis, the hierarchy of courts, ratio decidendi, obiter dicta, law reporting, binding and persuasive precedent',
  summary: 'Much of the law of negligence was made by judges, not Parliament. The doctrine of precedent means that decisions of higher courts bind lower courts in later cases with similar facts. This topic explains how precedent works in the civil court hierarchy, how to find the binding part of a judgment and how cases are reported.',
  spec: ['The doctrine of precedent in the court hierarchy and its role in the development of the law of negligence', 'Hierarchy of courts', 'Ratio decidendi', 'Obiter dicta', 'Law reporting of decisions', 'Following precedent: powers of the appeal courts, binding precedents, persuasive precedents'],
  learn: [
    { h: 'Stare decisis and the hierarchy', html: `
<p><b>Stare decisis</b> — “stand by what has been decided”. Like cases should be decided alike, giving certainty and fairness.</p>
<div class="tbl"><table><tr><th>Court</th><th>Bound by</th><th>Binds</th></tr>
<tr><td><b>Supreme Court</b></td><td>Not bound by its own decisions — can depart under the Practice Statement ([[c:ps1966]]) when “it appears right to do so”</td><td>All lower courts</td></tr>
<tr><td><b>Court of Appeal (Civil Division)</b></td><td>The Supreme Court; normally its own past decisions, except in the [[c:youngbristol]] situations</td><td>The High Court and County Court</td></tr>
<tr><td><b>High Court</b></td><td>The Supreme Court and Court of Appeal</td><td>The County Court</td></tr>
<tr><td><b>County Court</b></td><td>All higher courts</td><td>Does not create binding precedent</td></tr></table></div>
<p>Before 1966 the House of Lords was bound by its own decisions ([[c:londonstreet]]). Try the <b>Is it binding?</b> tool in Explore.</p>` },
    { h: 'Ratio decidendi and obiter dicta', html: `
<ul><li><b>Ratio decidendi</b> — “the reason for deciding”: the legal principle needed to decide the case on its material facts. This is the <b>binding</b> part. In [[c:donoghue]], the ratio is that a manufacturer owes a duty of care to the ultimate consumer of its products.</li>
<li><b>Obiter dicta</b> — “things said by the way”: other comments, such as Lord Atkin’s wider <b>neighbour principle</b>, or what would have happened on different facts. Obiter is <b>persuasive</b> only — but can later become law: the obiter in [[c:hedleybyrne]] on negligent misstatement became accepted law.</li>
<li>Finding the ratio can be hard: judgments are long, and in appeal courts several judges may give different reasons.</li></ul>` },
    { h: 'Binding and persuasive precedents', html: `
<ul><li><b>Binding precedent</b> — the ratio of a higher court (or the same court in some cases) must be followed.</li>
<li><b>Persuasive precedent</b> — may be followed but need not be: obiter dicta; decisions of lower courts; dissenting judgments; decisions of the Judicial Committee of the Privy Council (which can bind English courts if the Board expressly says it states English law — [[c:willers]]); decisions from other common law countries.</li>
<li><b>Powers of the appeal courts</b> — to affirm, reverse or vary decisions; to overrule earlier precedents (the Supreme Court) or depart from their own decisions in limited situations (the Court of Appeal under Young, and see [[c:davisjohnson]]).</li></ul>` },
    { h: 'Law reporting', html: `
<p>Precedent depends on accurate reports of judgments. The official <b>Law Reports</b> (published by the Incorporated Council of Law Reporting since 1865) include the judges’ checked text and arguments; other series include the Weekly Law Reports (WLR) and All England Law Reports (All ER). Since 2001 judgments have <b>neutral citations</b> (e.g. [2018] UKSC 4), and many are free online through the National Archives’ Find Case Law and BAILII. A case is cited by name, year, volume, report series and page: <i>Caparo Industries plc v Dickman</i> [1990] 2 AC 605.</p>` },
    { h: 'Precedent and the development of negligence', html: `
<ol><li><b>[[c:donoghue]] (1932)</b> — the modern law of negligence begins: the neighbour principle.</li>
<li><b>[[c:hedleybyrne]] (1964)</b> — extended to careless statements causing financial loss.</li>
<li><b>[[c:dorsetyacht]] (1970)</b> — the neighbour principle applies unless there is a reason to exclude it.</li>
<li><b>[[c:anns]] (1978)</b> — a broad two-stage test.</li>
<li><b>[[c:murphy]] (1991)</b> — Anns overruled; <b>[[c:caparo]] (1990)</b> — the three-stage test.</li>
<li><b>[[c:robinson]] (2018)</b> — Caparo applies to new situations; established categories follow existing precedent; the law develops incrementally by analogy.</li></ol>` }

/* ---------- C1b Following and avoiding precedent ---------- */
TOPICS.push({
  id: '1.C1b', unit: '1', ref: 'C1', title: 'Avoiding precedent and reading case law',
  short: 'Distinguishing, overruling and reversing; how to research, find, read and interpret case law',
  summary: 'Precedent is not completely rigid. Judges can avoid following an earlier decision by distinguishing it on its facts, higher courts can overrule earlier precedents, and appeal courts reverse decisions in the same case. This topic explains each method, with examples from negligence, and how to read and interpret a case.',
  spec: ['Avoiding binding precedents: distinguishing', 'Overruling', 'Reversing', 'How to research, find, read and interpret case law'],
  learn: [
    { h: 'Distinguishing', html: `
<p>A court finds that the <b>material facts</b> of the present case are sufficiently different from the precedent, so it does not have to follow it. Any court can do this.</p>
<ul><li>[[c:boltonstone]] (1951): a cricket ball hit someone about six times in 30 years — the risk was so small it was not negligent. [[c:millerjackson]] (1977): balls were hit out about eight or nine times a season — distinguished; the club was liable (in negligence and nuisance).</li>
<li>[[c:balfour]] and [[c:merritt]]: agreements between spouses — living together v separated.</li></ul>` },
    { h: 'Overruling and reversing', html: `
<ul><li><b>Overruling</b> — a higher court (or the Supreme Court using the Practice Statement) decides that the legal rule in an <b>earlier, different case</b> was wrong. [[c:murphy]] overruled [[c:anns]]; [[c:herrington]] (1972) used the Practice Statement to overrule Addie v Dumbreck (1929) and hold that occupiers owe a duty of common humanity to child trespassers; [[c:shivpuri]] overruled a decision made only a year earlier.</li>
<li><b>Reversing</b> — a higher court changes the decision of a lower court <b>in the same case</b> on appeal. In [[c:robinson]], the Court of Appeal held the police owed no duty; the Supreme Court reversed that decision in 2018.</li>
<li>Also: departing from own decisions (Court of Appeal under [[c:youngbristol]]); the Privy Council’s influence ([[c:holley]] and [[c:jameskarimi]]).</li></ul>` },
    { h: 'Reading and interpreting a case', html: `
<ol><li><b>Headnote</b> — the reporter’s summary (useful, but not part of the judgment).</li><li><b>Facts and procedural history</b> — which courts heard it before.</li><li><b>Issues</b> the court had to decide.</li><li><b>Judgments</b> — lead judgment, concurring and dissenting judgments.</li><li><b>Ratio</b> — the principle necessary for the decision on the material facts.</li><li><b>Obiter</b> — wider comments.</li><li><b>Outcome</b> — appeal allowed or dismissed.</li></ol>
<p>Then <b>interpret</b>: how wide is the principle? Which future cases will it affect? Can your client’s case be distinguished from it? This is AO3 in the Unit 1 assessment.</p>` }
  ],

  cases: ['boltonstone', 'millerjackson', 'balfour', 'merritt', 'anns', 'murphy', 'herrington', 'shivpuri', 'robinson', 'holley', 'jameskarimi', 'knuller', 'gould', 'horncastle', 'rtaylor'],

/* ---------- D1 Duty of care ---------- */
TOPICS.push({
  id: '1.D1', unit: '1', ref: 'D1', title: 'Duty of care',
  short: 'The neighbour principle and the three-stage test: proximity, foreseeability, and whether it is fair, just and reasonable',
  summary: 'The first thing a claimant in negligence must prove is that the defendant owed them a duty of care. Established categories (drivers to road users, doctors to patients, employers to employees) are straightforward; in new situations the courts use the three-stage Caparo test.',
  spec: ['Three stage test: proximity', 'Foreseeability', 'Fair, just and reasonable'],
  learn: [
    { h: 'From Donoghue to Robinson', html: `
<p>In [[c:donoghue]], Lord Atkin said: “You must take reasonable care to avoid acts or omissions which you can reasonably foresee would be likely to injure your neighbour.” Neighbours are “persons who are so closely and directly affected by my act that I ought reasonably to have them in contemplation”.</p>
<p>[[c:robinson]] (2018) explained that where there is an <b>established category</b> of duty (road users, doctor and patient, employer and employee, manufacturer and consumer), the court simply applies the existing law. The three-stage test in [[c:caparo]] is used for <b>novel</b> situations.</p>` },
    { h: 'The three-stage test (Caparo)', html: `
<ol><li><b>Was damage to the claimant reasonably foreseeable?</b> Would a reasonable person foresee harm to someone in the claimant’s position? In [[c:bourhill]] a pregnant woman who heard a crash and later saw blood was not a foreseeable victim.</li>
<li><b>Was there sufficient proximity</b> (closeness) between the parties — in time, space or relationship? In [[c:kent]], once the ambulance service accepted the 999 call, it owed a duty to the patient.</li>
<li><b>Is it fair, just and reasonable to impose a duty?</b> A policy question: would a duty open the “floodgates”, be unfair to the defendant, or harm public services? In [[c:hillccwy]] police owed no duty to a future victim of a serial killer they had not caught. In [[c:michael]] (2015) the police owed no general duty to protect a woman from an attacker.</li></ol>
<p>But police (and other public bodies) do owe a duty for their own <b>positive acts</b> that cause harm — [[c:robinson]], where officers knocked over a pedestrian while arresting a suspect.</p>` }

<div class="tbl"><table><tr><th>Defendant</th><th>Standard</th><th>Case</th></tr>

/* ---------- D3 Damage ---------- */
TOPICS.push({
  id: '1.D3', unit: '1', ref: 'D3', title: 'Damage: causation and remoteness',
  short: 'Factual causation — the “but for” test; remoteness — reasonable foreseeability, the type of damage and the thin skull rule',
  summary: 'The claimant must prove that the breach caused their damage (factual causation) and that the damage was not too remote — it must be of a type that was reasonably foreseeable. Once the type of damage is foreseeable, the defendant must take the victim as they find them.',
  spec: ['Factual causation: the “but for” test', 'Remoteness of damage: reasonable foreseeability', 'The type of damage caused', 'The thin skull rule'],
  learn: [
    { h: 'Factual causation', html: `<p><b>“But for” the defendant’s breach, would the claimant have suffered the damage?</b> If the damage would have happened anyway, the breach did not cause it. In [[c:barnett]], a doctor negligently refused to examine a night watchman who had drunk poisoned tea, but he would have died even with treatment — so the hospital was not liable.</p>` },
    { h: 'Remoteness: reasonable foreseeability', html: `
<ul><li>The defendant is liable only for damage of a <b>type</b> that was <b>reasonably foreseeable</b> — [[c:wagonmound]] (1961), which rejected the older rule of liability for all direct consequences.</li>
<li>If the <b>type</b> of damage was foreseeable, it does not matter that it happened in an unforeseeable <b>way</b> or was more extensive than expected: [[c:hughes]] (burns from a paraffin lamp in an unexpected explosion); [[c:jolley]] (children and an abandoned boat).</li>
<li>If the type was not foreseeable, the defendant is not liable: [[c:doughty]] (an asbestos lid falling into molten liquid caused an unforeseeable explosion, not a splash).</li>
<li>[[c:bradford]]: frostbite from a long journey in an unheated van was a foreseeable type of harm.</li></ul>` },
    { h: 'The thin skull rule', html: `<p>“You take your victim as you find them.” If some injury was foreseeable, the defendant is liable for the full extent of the harm, even if it is much worse because of the claimant’s pre-existing weakness. In [[c:smithleech]], a burn to the lip from molten metal triggered cancer in a man with a pre-cancerous condition — the employers were liable for his death.</p>` }
  ],

TOPICS.push({
  id: '1.D4', unit: '1', ref: 'D4', title: 'Damages',
  short: 'The aim of damages; special and general damages; mitigation; contributory negligence; lump sums and structured settlements',
  summary: 'If the claimant proves negligence, the court awards damages — money compensation. This topic covers the aim of damages, the difference between special and general damages, how damages are reduced if the claimant failed to mitigate their loss or was partly to blame, and how damages are paid.',
  spec: ['The aim of awarding damages in negligence', 'Special damages (pecuniary)', 'General damages: pain and suffering, loss of earnings, loss of amenity, future medical expenses', 'Mitigation of loss', 'Contributory negligence', 'Payment: lump sum, structured settlement'],
  learn: [
    { h: 'Aim and types of damages', html: `
<p>Compensatory damages aim to put the claimant, as far as money can, in the position they would have been in if the tort had not happened (<i>restitutio in integrum</i>).</p>
<div class="tbl"><table><tr><th>Special damages</th><th>General damages</th></tr>
<tr><td>Pecuniary losses that can be calculated precisely up to the date of trial or settlement: lost earnings to date, medical and care bills paid, travel costs, repairs to property</td><td>Losses that cannot be precisely calculated: <b>pain, suffering and loss of amenity</b> (PSLA — set using the Judicial College Guidelines and increased by 10% since 2013, [[c:simmons]]; [[c:heil]]); <b>future loss of earnings</b>; <b>future medical and care expenses</b></td></tr></table></div>
<p><b>Loss of amenity</b> means losing the ability to enjoy life as before — hobbies, sport, relationships.</p>` },
    { h: 'Reducing damages', html: `
<ul><li><b>Mitigation of loss</b> — the claimant must take reasonable steps to limit their loss (e.g. follow medical advice, return to suitable work). The defendant must prove a failure to mitigate ([[c:geest]]).</li>
<li><b>Contributory negligence</b> — under s1 <b>Law Reform (Contributory Negligence) Act 1945</b>, damages are reduced “to such extent as the court thinks just and equitable” according to the claimant’s share of responsibility. [[c:froom]] (seatbelts: 25% / 15% / 0%); [[c:jonesliviox]] (riding on the back of a vehicle); [[c:sayers]]; [[c:owens]] (accepting a lift from a drunk driver); [[c:gough]] (children are rarely contributorily negligent). A 100% reduction is not possible ([[c:pittshunt]]). Try the calculator in Explore.</li></ul>` },
    { h: 'Payment', html: `
<ul><li><b>Lump sum</b> — a single, once-and-for-all payment. Simple and final, but future needs must be predicted, so the claimant may be over- or under-compensated ([[c:wellswells]]).</li>
<li><b>Structured settlement / periodical payments</b> — regular payments (often for life), usually for future care and loss of earnings in serious injury cases. The court can order periodical payments for future pecuniary loss (Damages Act 1996, as amended in 2003). They protect against the money running out and can be index-linked.</li>
<li><b>Interim payments</b> can be made before trial where liability is admitted.</li></ul>` }

/* ---------- D5 Burden of proof and res ipsa loquitur ---------- */
TOPICS.push({
  id: '1.D5', unit: '1', ref: 'D5', title: 'Burden of proof and res ipsa loquitur',
  short: 'Who must prove what in a negligence claim, and when “the thing speaks for itself”',
  summary: 'In negligence the claimant must prove duty, breach and damage on the balance of probabilities. Sometimes the claimant cannot know exactly what the defendant did wrong. Res ipsa loquitur — “the thing speaks for itself” — allows the court to infer negligence from the circumstances, shifting the burden to the defendant to explain.',
  spec: ['Burden of proof in negligence cases', 'Res ipsa loquitur'],
  learn: [
    { h: 'The burden of proof', html: `<p>The <b>claimant</b> must prove, on the <b>balance of probabilities</b> ([[c:reb]]), that the defendant owed a duty, breached it, and caused foreseeable damage. The defendant must prove any defence (such as contributory negligence or a failure to mitigate).</p>` },
    { h: 'Res ipsa loquitur', html: `
<p>From [[c:scottdocks]] (1865), where bags of sugar fell from a warehouse onto a customs officer, res ipsa loquitur applies where:</p>
<ol><li>the thing causing the damage was <b>under the control</b> of the defendant (or their employees);</li><li>the accident is one that would <b>not normally happen without negligence</b>; and</li><li>there is <b>no other explanation</b> for the accident.</li></ol>
<p>Examples: [[c:mahon]] (a swab left inside a patient after surgery); [[c:wardtesco]] (yoghurt on a supermarket floor).</p>
<p><b>Effect</b>: the court may infer negligence, so the defendant must provide an explanation showing they took reasonable care. If they cannot, the claimant wins.</p>` }
  ],
  debate: [{ q: 'Is res ipsa loquitur fair to defendants?', for: ['Claimants often cannot know what happened inside a defendant’s business or operating theatre.', 'The defendant is best placed to explain.'], ag: ['Defendants may be found liable without proof of actual fault.', 'It can be hard to prove a negative (that reasonable care was taken).'] }],
  cases: ['scottdocks', 'mahon', 'wardtesco', 'reb'],
  worked: [],
  pitfalls: ['Treating res ipsa as a separate tort — it is a rule of evidence.', 'Forgetting the three conditions.'],
  cards: [
    ['What does res ipsa loquitur mean?', 'The thing speaks for itself.'],
    ['Three conditions for res ipsa loquitur?', 'Defendant in control; would not normally happen without negligence; no other explanation.'],
    ['Effect of res ipsa?', 'Negligence may be inferred; the defendant must explain.'],
    ['Scott v London & St Katherine Docks?', 'Sugar bags falling from a warehouse — origin of res ipsa.'],
    ['Ward v Tesco?', 'Yoghurt spill — Tesco could not show a reasonable cleaning system.']
  ],
  quiz: [
    { q: 'Which is NOT a condition of res ipsa loquitur?', o: ['The claimant was a child', 'The defendant controlled the thing', 'It would not normally happen without negligence', 'No other explanation'], x: '' },
    { q: 'Leaving a swab inside a patient is an example from…', o: ['Mahon v Osborne', 'Bolam', 'Paris v Stepney', 'Barnett'], x: '' }
  ],

});

  short: 'Separation of powers and parliamentary sovereignty; Green and White Papers; types of bills; legislative stages; Royal Assent and commencement',
  summary: 'Acts of Parliament are the highest form of law in the UK. This topic explains the constitutional principles behind Parliament’s law making — the separation of powers and parliamentary sovereignty — and the process by which a Bill becomes an Act.',
  spec: ['Separation of powers and parliamentary sovereignty', 'Pre-legislative stages: Green and White Papers', 'Types of bills: public, private members’, private, hybrid', 'Legislative stages in the House of Commons: first reading, second reading, committee stage, report stage', 'House of Lords', 'Royal Assent', 'Commencement of an Act'],
  learn: [
    { h: 'Constitutional principles', html: `
<ul><li><b>Separation of powers</b> (Montesquieu): power should be divided between the <b>legislature</b> (Parliament — makes law), the <b>executive</b> (government — puts law into effect) and the <b>judiciary</b> (courts — interpret and apply law). In the UK the separation is partial: ministers sit in Parliament. The Constitutional Reform Act 2005 strengthened judicial independence and created the Supreme Court. The courts check the executive ([[c:miller2019]]).</li>
<li><b>Parliamentary sovereignty</b> (Dicey): Parliament can make or unmake any law; no Parliament can bind its successors; no court can set aside an Act ([[c:jackson]]). Limits in practice: EU membership until 2020, the Human Rights Act (declarations of incompatibility), devolution, and political reality. [[c:miller2017]] confirmed Parliament, not ministers, had to authorise leaving the EU.</li></ul>` },
    { h: 'Before a Bill', html: `
<ul><li><b>Green Paper</b> — a consultation document setting out ideas for discussion.</li><li><b>White Paper</b> — firm proposals for legislation.</li><li>Draft Bills may receive pre-legislative scrutiny by a committee.</li></ul>
<div class="tbl"><table><tr><th>Type of Bill</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>Public Bill</b></td><td>Government Bill affecting the whole country</td><td>Domestic Abuse Act 2021</td></tr>
<tr><td><b>Private Member’s Bill</b></td><td>Introduced by a backbench MP or peer (ballot, ten minute rule, presentation); few become law without government support</td><td>Abortion Act 1967; Assaults on Emergency Workers (Offences) Act 2018</td></tr>
<tr><td><b>Private Bill</b></td><td>Affects a particular organisation, place or person</td><td>Bills for local authorities or universities</td></tr>
<tr><td><b>Hybrid Bill</b></td><td>A public Bill that affects particular private interests differently</td><td>High Speed Rail (London–West Midlands) Act 2017</td></tr></table></div>` },
    { h: 'The legislative stages', html: `
<ol><li><b>First Reading</b> — formal introduction; no debate.</li><li><b>Second Reading</b> — main debate on the principles; vote.</li><li><b>Committee Stage</b> — detailed, clause-by-clause scrutiny by a Public Bill Committee; amendments.</li><li><b>Report Stage</b> — the whole House considers amendments.</li><li><b>Third Reading</b> — final debate and vote.</li><li><b>House of Lords</b> — the same stages; the Lords revise and suggest amendments; “ping-pong” between the Houses. Under the Parliament Acts 1911 and 1949 the Lords can only delay most Bills for about a year (money Bills for one month).</li><li><b>Royal Assent</b> — the monarch’s formal agreement; the Bill becomes an Act.</li><li><b>Commencement</b> — the Act comes into force on Royal Assent, on a date in the Act, or by a commencement order made by a minister (so parts may start at different times).</li></ol>

  learn: [
    { h: 'The literal rule', html: `<p>Give words their <b>plain, ordinary, grammatical meaning</b>, even if the result is harsh or absurd. [[c:whiteley]] — a dead person was not “entitled to vote”, so impersonating one was not an offence. [[c:berriman]] — “relaying or repairing” did not include oiling. [[c:fisherbell]] — goods in a shop window were not “offered for sale”.</p><p><b>Evaluation</b>: respects Parliament’s words and sovereignty; certain — but can produce absurd and unjust results and assumes words have one meaning.</p>` },
    { h: 'The golden rule', html: `<p>A modification of the literal rule to avoid an <b>absurd</b> result. <b>Narrow</b> approach — where words have more than one meaning, choose the one that avoids absurdity: [[c:rallen]]; [[c:adler]] (“in the vicinity of” includes inside). <b>Wide</b> approach — where words have one meaning but it would be repugnant: [[c:sigsworth]] (a murderer could not inherit from his victim).</p><p><b>Evaluation</b>: avoids absurdity — but there is no clear test of what is “absurd”.</p>` },
    { h: 'The mischief rule', html: `<p>From [[c:heydon]] (1584): ask what the <b>common law was before the Act</b>, what <b>mischief</b> (problem) the Act was meant to remedy, and interpret the Act to <b>suppress the mischief</b>. [[c:smithhughes]] — soliciting from windows was “in a street”. [[c:rcn]] — nurses could carry out abortions under medical supervision.</p><p><b>Evaluation</b>: fulfils Parliament’s intention and avoids loopholes — but can give judges too much power, and it was developed when statutes were less detailed.</p>` },
    { h: 'The purposive approach', html: `<p>The modern approach: interpret words in light of the <b>purpose</b> of the Act as a whole, considering its context. [[c:quintavalle]] (cloned embryos). Judges can use <b>extrinsic aids</b> such as Hansard ([[c:pepper]]), Law Commission reports and explanatory notes, and <b>intrinsic aids</b> such as the long title and headings. It was encouraged by EU law and by s3 Human Rights Act 1998 (read legislation compatibly with Convention rights where possible).</p><p><b>Evaluation</b>: flexible and fits modern drafting — but gives judges more discretion and less certainty.</p>` }
  ],
