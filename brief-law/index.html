<li><b>Selection and appointment</b>: applicants apply to a local <b>Advisory Committee</b>, which interviews them and recommends candidates. They are appointed by the <b>Lord Chief Justice</b>. They must sit at least 13 days (26 half-days) a year.</li>
<li><b>Training</b>: overseen by the Judicial College — initial training, a mentor, observations and regular appraisals.</li>
<li><b>Role</b>: usually sit as a bench of three with a qualified <b>legal adviser</b> who advises on law. They try summary and many either-way cases, decide guilt and sentence (up to 12 months’ custody for a single either-way offence, restored in November 2024), deal with bail and early hearings, send serious cases to the Crown Court, and sit in the youth court.</li></ul>` },
    { h: 'Juries: qualification and disqualification', html: `
<ul><li><b>Qualified</b> (Juries Act 1974 s1): aged 18–75; registered to vote; resident in the UK for at least five years since the age of 13.</li>

<li><b>Excusal and deferral</b>: people can ask to defer or be excused for good reason (illness, caring, exams); serving members of the armed forces may be excused if their commanding officer certifies absence would harm efficiency.</li></ul>` },

<ul><li><b>Summoning</b>: the Jury Central Summoning Bureau randomly selects names from the electoral register. From the panel at court, 12 are chosen by ballot.</li>

<li><b>Challenging</b>: <b>challenge to the array</b> (the whole panel was chosen unfairly); <b>challenge for cause</b> (a juror knows a party or is biased); the prosecution’s right to <b>stand by</b> a juror (rarely used). Peremptory challenges without reason were abolished in 1988.</li>
<li><b>Role</b>: in the Crown Court, the jury decides the facts and gives the verdict — guilty or not guilty — after the judge’s directions on law. Verdicts should be unanimous, but a <b>majority verdict</b> of 10–2 or 11–1 can be accepted after at least two hours. Deliberations are secret ([[c:mirza]]). Juries do not give reasons; they can acquit against the law (<b>jury equity</b> — [[c:ponting]]).</li>
<li>Trial without a jury is possible where there is a danger of jury tampering ([[c:twomey]]).</li></ul>` },

TOPICS.push({

  summary: 'Most crimes need a guilty act (actus reus) and a guilty mind (mens rea) at the same time. This topic explains each element — including when failing to act is a crime, how causation is established, the types of mens rea and crimes that need no mens rea at all.',

  learn: [
    { h: 'Actus reus: acts and omissions', html: `
<p>The actus reus is the physical element: a voluntary act, an omission (failure to act) where there is a duty, or a state of affairs. An omission is only criminal where there is a <b>duty to act</b>:</p>
<ul><li><b>Contractual duty</b> — [[c:pittwood]] (a level-crossing keeper who left the gate open).</li><li><b>Duty from a relationship</b> — [[c:gibbins]] (a father who starved his child).</li><li><b>Voluntarily assumed duty</b> — [[c:stone]] (a couple who took in a relative and neglected her).</li><li><b>Duty from creating a dangerous situation</b> — [[c:miller]] (a squatter who started a fire and did nothing).</li><li><b>Statutory duty</b> — e.g. failing to provide a breath specimen.</li></ul>` },
    { h: 'Causation', html: `
<ul><li><b>Factual causation</b> — “but for” the defendant’s act, would the result have happened? [[c:white]] (the poisoned mother died of a heart attack — not caused by D).</li>
<li><b>Legal causation</b> — the act must be an operating and substantial cause ([[c:smith]]); it need not be the only cause ([[c:pagett]]).</li>
<li><b>Intervening acts</b> — medical treatment rarely breaks the chain unless it is “palpably wrong” ([[c:jordan]]) or so independent that the original wound is insignificant ([[c:cheshire]]).</li>
<li><b>Thin skull rule</b> — take the victim as you find them, including their beliefs ([[c:blaue]]).</li></ul>` },
    { h: 'Mens rea', html: `
<ul><li><b>Intention</b> — <b>direct</b>: the defendant’s aim or purpose; <b>oblique</b>: the jury may find intention where the result was a virtual certainty and the defendant appreciated this ([[c:woollin]]).</li>
<li><b>Recklessness</b> — subjective: the defendant foresaw the risk and unreasonably took it ([[c:cunningham]]; [[c:rvg]]).</li></ul>` },
    { h: 'Strict liability and coincidence', html: `
<ul><li><b>Strict liability</b> offences need no mens rea for at least one element of the actus reus — usually regulatory offences (selling alcohol to under-18s, food safety, driving). [[c:storkwain]]; [[c:shah]]. Courts presume mens rea is required unless Parliament clearly excludes it ([[c:sweetparsley]]). Justification: public protection and efficiency; criticism: unfair to people who took care.</li>
<li><b>Coincidence</b> — actus reus and mens rea must coincide in time. A <b>continuing act</b> ([[c:fagan]]) or a single <b>series of acts</b> ([[c:thabomeli]]) satisfies this.</li></ul>` }

        <div class="opts">${cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${o}</span></button>`).join('')}</div><div id="gfb"></div><p class="kbd-hint">Keys 1–${cur.opts.length} to answer.</p></div>`;
      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => {
      if (!alive || locked) return; locked = true; answered++;
      const ok = cur.opts[i] === cur.ans, btns = $$('.opt', host);
      if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btns[i].classList.add('right'); }
      else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btns[i].classList.add('wrong'); btns[cur.opts.indexOf(cur.ans)].classList.add('right'); if (cur.fb) $('#gfb', host).innerHTML = `<div class="explain small">${rich(cur.fb)}</div>`; }
      setTimeout(() => alive && left > 0 && next(), ok ? 350 : 2200);
    };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= (cur?.opts.length || 4)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();
    return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'year') {
    const qs = shuffle(YEAR_BANK).slice(0, 10); let i = 0, score = 0;
    const render = () => {
      const q = qs[i];
      host.innerHTML = `<div class="game">${hud([['Round', (i + 1) + '/10'], ['Score', score]])}<div class="eyebrow" style="text-align:center">In which year?</div><div class="big-prompt"><i class="cn">${esc(q[0])}</i></div>
        <div class="card" style="text-align:center"><div style="font:700 56px var(--f-display)" id="yr-out">1950</div>
        <input id="yr-in" type="range" min="1500" max="2026" step="1" value="1950" style="margin:14px 0" aria-label="Year"><div class="row" style="justify-content:center"><button class="btn sm" id="yr-m">−1</button><button class="btn primary" id="yr-go">Lock in</button><button class="btn sm" id="yr-p">+1</button></div><div id="yr-fb"></div></div></div>`;
      const inp = $('#yr-in', host); const upd = () => { $('#yr-out', host).textContent = inp.value; inp.style.setProperty('--p', ((+inp.value - 1500) / 526 * 100) + '%'); }; inp.oninput = upd; upd();
      $('#yr-m', host).onclick = () => { inp.value = +inp.value - 1; upd(); }; $('#yr-p', host).onclick = () => { inp.value = +inp.value + 1; upd(); };
      $('#yr-go', host).onclick = () => {
        const d = Math.abs(+inp.value - q[1]), pts = d === 0 ? 10 : d <= 2 ? 8 : d <= 5 ? 5 : d <= 15 ? 2 : 0; score += pts; pts >= 5 ? sfx.good() : sfx.bad();
        $('#yr-fb', host).innerHTML = `<div class="explain" style="margin-top:14px"><b class="v ${pts >= 5 ? 'good' : 'bad'}">${pts ? '+' + pts : 'Off by ' + d + ' years'}</b> The answer is <b>${q[1]}</b>.</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="yr-next">${i < 9 ? 'Next' : 'Finish'}</button></div>`;
        $('#yr-go', host).disabled = true; $('#yr-next', host).onclick = () => { i++; i < 10 ? render() : endScreen(score, '<p class="muted">10 points for exact, 8 within 2 years, 5 within 5, 2 within 15.</p>'); };
      };
    };
    render(); return stop;
  }

  if (id === 'blitz') {
    const pool = TOPICS.filter(t => unitInScope(t.unit)).flatMap(t => t.quiz.map(q => ({ q, t }))); let score = 0, lives = 3, cur;
    const next = () => { const { q, t } = pick(pool); const truth = Math.random() < 0.5; cur = { q, t, truth, opt: truth ? q.o[0] : pick(q.o.slice(1)) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Lives', '♥'.repeat(lives) || '0']])}<div class="card"><div class="eyebrow">${cur.t.id} · ${esc(cur.t.title)}</div><p class="q-text">${rich(cur.q.q)}</p><div class="box def" style="font-size:17px"><b class="lbl">Proposed answer</b><p>${rich(cur.opt)}</p></div>
      <div class="row" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn primary" data-a="1" style="min-width:130px">True <kbd>T</kbd></button><button class="btn" data-a="0" style="min-width:130px">False <kbd>F</kbd></button></div><div id="bz-fb"></div></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => answer(b.dataset.a === '1'));
    };
    const answer = a => {
      if ($('#bz-fb', host).innerHTML) return; const ok = a === cur.truth; ok ? (score += 10, sfx.good()) : (lives--, sfx.bad());
      $('#bz-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Sustained' : 'Overruled'}</b> ${cur.truth ? 'That answer is right.' : 'The correct answer is: ' + rich(cur.q.o[0])} ${cur.q.x ? '<br><span class="muted">' + rich(cur.q.x) + '</span>' : ''}</div>`;
      setTimeout(() => { if (!alive) return; lives > 0 ? next() : endScreen(score); }, ok ? 900 : 2600);
    };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 't' || e.key === 'T') answer(true); if (e.key === 'f' || e.key === 'F') answer(false); };
    addEventListener('keydown', key); next(); return () => { stop(); removeEventListener('keydown', key); };
  }
  return stop;
}

const areaTag = uid => { const u = unitOf(uid); return u?.kind === 'ext' ? '<span class="tag pub">External · set by Pearson</span>' : u?.kind === 'int' ? '<span class="tag priv">Internal · assignments</span>' : ''; };

/* flashcard deck for a topic: concept cards + case cards */
function deck(t) {
  const d = (t.cards || []).map((c, i) => ({ k: 'k' + i, q: c[0], a: c[1] }));
  (t.cases || []).forEach(id => { const c = CASES[id]; if (c) d.push({ k: 'c:' + id, q: `<span class="eyebrow" style="position:static;display:block;margin-bottom:10px">Name the case</span>${esc(c.f)}`, a: `<b><i class="cn">${esc(c.n)}</i> (${c.y})</b><br><br>${esc(c.p)}` }); });
  return d;
}
function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, d = deck(t);
  const ck = d.length ? d.filter(c => (s.cards[c.k] || 0) >= 3).length / d.length : 0;
  const sp = (t.spec || []).reduce((a, _, i) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / Math.max(1, (t.spec || []).length);
  const ex = t.exam?.length ? (s.exam || 0) : q;
  return clamp(0.4 * q + 0.2 * ck + 0.2 * sp + 0.2 * ex, 0, 1);
}
const unitMastery = uid => { const ts = unitTopics(uid); return ts.length ? ts.reduce((a, t) => a + mastery(t), 0) / ts.length : 0; };

  /* ---------- Quiz engine ---------- */
  function caseQs(t, n) {
    const ids = (t.cases || []).filter(id => CASES[id]); if (ids.length < 2) return [];
    return shuffle(ids).slice(0, n).map(id => { const c = CASES[id], pool = Object.values(CASES).filter(x => x !== c && (x.a === c.a || ids.includes(x.id))); const w = shuffle(pool).slice(0, 3); return { q: `Which case? <span class="muted">${esc(c.f)}</span>`, o: [`<i class="cn">${esc(c.n)}</i> (${c.y})`, ...w.map(x => `<i class="cn">${esc(x.n)}</i> (${x.y})`)], x: esc(c.p) }; });
  }
  function runQuiz(host, items, o = {}) {
    const qs = items.map(it => ({ ...it, order: shuffle(it.o.map((_, i) => i)) }));
    let i = 0, res = [];
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${esc(q.topic)}</a>` : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.q)}</div>
        <div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p><div id="fb"></div>`;
      $$('.opt', host).forEach(b => b.onclick = e => { if (e.target.closest('.case')) return; answer(+b.dataset.k); });
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i || k >= q.order.length) return;
      const ok = q.order[k] === 0; res.push({ ok, q }); (ok ? sfx.good : sfx.bad)();
      $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100);
      S.stats.quizzes++; if (p === 100) { S.stats.perfect++; burst(); sfx.win(); } save();
      o.onDone && o.onDone({ correct, total: qs.length, pct: p });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete</div><div class="big">${p}%</div><p class="lede" style="margin:8px auto">${correct} of ${qs.length} correct${p === 100 ? ' — unanimous!' : p >= 70 ? ' — strong.' : ' — review the notes and try again.'}</p>

        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>`;

    render();
  }
  function quizTab(host, t) {
    const s = T(t.id);
    const gen = () => shuffle([...t.quiz, ...caseQs(t, 4)]).slice(0, 14);
    host.innerHTML = `<div class="quiz-wrap" id="qz"></div>`;
    runQuiz($('#qz'), gen(), { title: t.id + ' quiz', regen: gen, onDone: r => { s.quiz = Math.max(s.quiz || 0, r.pct); save(); addXP(r.correct * 5 + (r.pct === 100 ? 20 : 0), 'Quiz complete'); } });
  }

  /* ---------- Exam practice (self-marked) ---------- */
  function examBlock(q, key, onMark) {
    const draftKey = 'ratio.draft.' + key; let draft = ''; try { draft = localStorage.getItem(draftKey) || ''; } catch (e) { }
    const el = h('div', { class: 'examq' }, `<div class="eh"><div>${rich(q.q)}</div><span class="pill mk">${q.m} marks</span></div>${q.scen ? `<div class="scen">${rich(q.scen)}</div>` : ''}
      <textarea placeholder="Plan or write your answer here (saved in this browser)…" aria-label="Your answer">${esc(draft)}</textarea>
      <div class="row" style="padding:0 18px 14px"><button class="btn sm" data-show>Show mark scheme</button><span class="small muted">${q.bands ? 'Tick the content you covered, then check it against the criteria.' : q.m >= 6 ? 'Levels-marked: tick the content you covered, then judge the level.' : 'Tick each point you made.'}</span></div>
      <div class="ms" hidden><div class="eyebrow" style="margin-bottom:6px">Indicative content</div>${q.ms.map((p, i) => `<label><input type="checkbox" data-i="${i}"> <span>${rich(p)}</span></label>`).join('')}
      ${q.bands ? `<div class="tbl levels"><table><tr><th>Criterion</th><th>What the assessor looks for</th></tr>${q.bands.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>` : q.m >= 6 ? `<div class="tbl levels"><table><tr><th>Level</th><th>What it looks like</th></tr>${LEVELS_TXT(q.m).map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>` : ''}
      <div class="row" style="margin-top:10px"><span class="pill acc" data-score>0 / ${q.m}</span><button class="btn sm primary" data-save>Record my mark</button></div></div>`);
    const ta = $('textarea', el); ta.oninput = () => { try { localStorage.setItem(draftKey, ta.value); } catch (e) { } };
    $('[data-show]', el).onclick = () => { $('.ms', el).hidden = !$('.ms', el).hidden; };
    const score = () => { const n = $$('input:checked', el).length; return Math.min(q.m, Math.round(n / q.ms.length * q.m)); };
    $$('input', el).forEach(c => c.onchange = () => { $('[data-score]', el).textContent = `${score()} / ${q.m}`; });
    $('[data-save]', el).onclick = e => { const sc = score(); e.target.disabled = true; e.target.textContent = 'Recorded'; onMark(sc, q.m); };
    return el;
  }
  const LEVELS_TXT = m => [['Distinction-style', 'Critically evaluates and justifies; applies precedents accurately to the facts; analyses how the law affects the outcome; professional communication; justified recommendations'], ['Merit-style', 'Clear application of relevant law and cases to the facts, with some analysis of likely outcomes'], ['Pass-style', 'Relevant knowledge with some cases; some recommendations; limited application or analysis']];
  function examTab(host, t) {
    const s = T(t.id); s.examMarks ??= {};
    host.innerHTML = unitOf(t.unit).kind === 'int' ? `<div class="box warn" style="max-width:none"><b class="lbl">Practice only</b><p class="small">Unit 2 is assessed by assignments set by your centre. These practice tasks use different case studies, so you can rehearse the skill. Your real assignment must be your own work. The criteria shown are the Pearson Pass, Merit and Distinction criteria for this learning aim.</p></div><div id="eqs"></div>` : `<p class="small muted" style="max-width:70ch">Practice tasks in the style of the Unit 1 supervised assessment. They test AO1 (knowledge), AO2 (applying the law and advising clients), AO3 (analysing legal information) and AO4 (evaluating and justifying). Write or plan an answer, then mark it honestly.</p><div id="eqs"></div>`;
    t.exam.forEach((q, i) => $('#eqs').append(examBlock(q, t.id + '.' + i, (sc, m) => { s.examMarks[i] = sc / m; const vals = t.exam.map((_, j) => s.examMarks[j] || 0); s.exam = vals.reduce((a, b) => a + b, 0) / t.exam.length; S.stats.examMarks += sc; save(); addXP(sc * 2, 'Exam question marked'); })));
  }

  /* ---------- CASEBOOK ---------- */
  function casebook() {
    crumbs('<b>Casebook</b>');
    let area = 'all', q = '', cover = false;
    const areas = [['all', 'All'], ...UNITS.filter(u => u.kind).map(u => [u.id, u.short])];
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">The casebook</h1><p class="lede">Every case in Brief, with its facts and the principle it established. Case names in the notes open the same summary. Hide the facts to test yourself.</p>
      <div class="filters"><input id="cq" type="search" placeholder="Search cases, facts or principles…" aria-label="Search cases"><div class="seg" id="cv"><button data-c="0" class="on">Show all</button><button data-c="1">Hide facts</button></div></div>
      <div class="row" id="ca" style="margin-bottom:16px">${areas.map(([k, l]) => `<button class="btn sm ${k === 'all' ? 'primary' : ''}" data-a="${k}" ${k !== 'all' && !unitInScope(k) ? 'style="opacity:.5"' : ''}>${esc(l)}</button>`).join('')}</div><div id="clist"></div>`;
    const render = () => {
      const list = Object.values(CASES).filter(c => (area === 'all' ? unitInScope(c.a) : c.a === area) && (!q || (c.n + ' ' + c.f + ' ' + c.p).toLowerCase().includes(q))).sort((a, b) => a.n.localeCompare(b.n));
      $('#clist').innerHTML = `<p class="small muted">${list.length} cases</p><div class="case-grid">${list.map(c => caseCard(c, cover)).join('')}</div>`;
      $$('.case-card.cover').forEach(cd => cd.onclick = () => cd.classList.toggle('peek'));
    };
    $('#cq').oninput = e => { q = e.target.value.toLowerCase().trim(); render(); };
    $$('#ca button').forEach(b => b.onclick = () => { area = b.dataset.a; $$('#ca button').forEach(x => x.classList.toggle('primary', x === b)); render(); });
    $$('#cv button').forEach(b => b.onclick = () => { cover = b.dataset.c === '1'; $$('#cv button').forEach(x => x.classList.toggle('on', x === b)); render(); });
    render();
  }
  function statutes(tab) {
    crumbs('<b>Statutes & terms</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Statutes &amp; terms</h1><p class="lede">The key Acts and sections for both units, and the Latin and legal terms you are expected to use.</p>
      <nav class="tabs" style="position:static"><a class="tab ${tab === 'acts' ? 'on' : ''}" href="#/statutes/acts">Statute book<span class="n">${STATUTES.length}</span></a><a class="tab ${tab === 'terms' ? 'on' : ''}" href="#/statutes/terms">Glossary<span class="n">${GLOSSARY.length}</span></a></nav>
      <div class="filters"><input id="sq" type="search" placeholder="Filter…" aria-label="Filter"></div><div id="slist"></div>`;
    const render = q => {
      if (tab === 'terms') $('#slist').innerHTML = `<div class="gloss">${GLOSSARY.filter(g => !q || (g[0] + g[1]).toLowerCase().includes(q)).sort((a, b) => a[0].localeCompare(b[0])).map(g => `<div><b>${esc(g[0])}</b><span>${esc(g[1])}</span></div>`).join('')}</div>`;
      else $('#slist').innerHTML = `<div class="stat-list">${STATUTES.filter(st => !q || (st.n + st.s.flat().join(' ')).toLowerCase().includes(q)).map(st => `<div class="statute" style="--uc:${ucol(st.a)}"><h4>${esc(st.n)}</h4><dl>${st.s.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${rich(v)}</dd>`).join('')}</dl></div>`).join('')}</div>`;
    };
    $('#sq').oninput = e => render(e.target.value.toLowerCase().trim()); render('');
  }

  /* ---------- ASSESSMENT ---------- */
  function assess() {
    crumbs('<b>Assessment</b>'); if (!S.assessSeen) { S.assessSeen = 1; save(); checkBadges(); }
    V().innerHTML = `<div class="notes" style="max-width:none">${ASSESS_HTML}</div>`; wireSettingsLinks();
  }

  /* ---------- MOCK PAPERS ---------- */
  function mock() {
    crumbs('<b>Practice papers</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Practice papers</h1><p class="lede">Unit 1 practice tasks with a pre-release case (research it first, then do the timed 1½-hour task), and Unit 2 practice assignment briefs mapped to the Pass, Merit and Distinction criteria. Your answers stay in this browser.</p>
      <div class="grid g3 sec">${MOCKS.map(m => `<a class="card linkcard" href="#/mock/${m.id}"><div class="eyebrow">${esc(m.meta)}</div><div class="h3" style="margin:6px 0">${esc(m.title)}</div><p class="small muted" style="margin:0">${esc(m.blurb)}</p></a>`).join('')}</div>`;
  }
  function mockPaper(id) {
    const m = MOCKS.find(x => x.id === id); if (!m) return mock();
    crumbs(`<a href="#/mock">Practice papers</a> / <b>${esc(m.title)}</b>`);
    const secs = m.build();
    let secsLeft = m.mins * 60, running = false, iv = null, got = 0, total = 0;
    V().innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">${esc(m.meta)}</div><h1 class="display" style="font-size:clamp(28px,4.4vw,44px);margin-top:6px">${esc(m.title)}</h1></div>
      <div class="card flat" style="padding:12px 16px;text-align:center"><div class="eyebrow">Time</div><div class="timer-big" id="mt">${fmt(secsLeft)}</div><div class="row" style="justify-content:center;margin-top:6px"><button class="btn sm primary" id="mgo">Start</button><button class="btn sm" id="mrs">Reset</button></div></div></div>
      <div class="box tip"><b class="lbl">Instructions</b><p>${m.instr}</p></div><div id="mq"></div>
      <div class="card sec" style="text-align:center"><div class="eyebrow">Your total</div><div style="font:700 48px var(--f-display)" id="mtot">0 / ${secs.reduce((a, s) => a + s.qs.reduce((b, q) => b + q.m, 0), 0)}</div><button class="btn primary" id="mdone">Finish paper</button></div>`;
    secs.forEach((s, si) => { $('#mq').insertAdjacentHTML('beforeend', `<h2 class="h3" style="margin:28px 0 6px;color:${s.css || 'inherit'}">${esc(s.h)}</h2>${s.note ? (s.note.length > 140 ? `<div class="brief-box">${rich(s.note)}</div>` : `<p class="small muted">${esc(s.note)}</p>`) : ''}`); s.qs.forEach((q, qi) => { total += q.m; $('#mq').append(examBlock(q, `mock.${id}.${si}.${qi}`, sc => { got += sc; $('#mtot').textContent = `${got} / ${$('#mtot').textContent.split('/ ')[1]}`; S.stats.examMarks += sc; save(); })); }); });
    function fmt(x) { x = Math.max(0, x); return Math.floor(x / 3600) + ':' + pad2(Math.floor(x % 3600 / 60)) + ':' + pad2(Math.floor(x % 60)); }
    $('#mgo').onclick = () => { running = !running; $('#mgo').textContent = running ? 'Pause' : 'Resume'; if (running) iv = setInterval(() => { secsLeft--; $('#mt').textContent = fmt(secsLeft); if (secsLeft <= 0) { clearInterval(iv); running = false; toast('<b>Time</b> Pens down'); sfx.gavel(); } }, 1000); else clearInterval(iv); };
    $('#mrs').onclick = () => { clearInterval(iv); running = false; secsLeft = m.mins * 60; $('#mt').textContent = fmt(secsLeft); $('#mgo').textContent = 'Start'; };
    $('#mdone').onclick = () => { clearInterval(iv); S.stats.mocks++; save(); addXP(50, 'Mock paper completed'); burst(); };
    cleanup = () => clearInterval(iv);
  }

  /* ---------- ARCADE / DAILY / PROGRESS / ABOUT ---------- */
  function arcade() {
    crumbs('<b>Arcade</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Arcade</h1><p class="lede">Quick games to drill case law, legal principles and terminology from both units.</p>
      <div class="grid g3 sec">${Object.entries(GAMES).map(([id, g]) => `<a class="game-card" href="#/game/${id}" style="--uc:${g.col}"><div class="art"><canvas data-art="${id}"></canvas></div><div class="eyebrow">${esc(g.skill)}</div><div class="h3">${esc(g.title)}</div><p class="small muted" style="margin:0">${esc(g.blurb)}</p><span class="small mono">Best: ${S.games[id]?.best || 0}</span></a>`).join('')}</div>`;
    $$('[data-art]').forEach(cv => drawGameArt(cv, cv.dataset.art));
  }
  function daily() {
    crumbs('<b>Daily brief</b>');
    let seed = +today().replace(/-/g, ''); const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const pool = allTopics().flatMap(t => t.quiz.map(q => ({ ...q, topic: t.id })));
    const items = []; const used = new Set(); while (items.length < 5 && used.size < pool.length) { const k = Math.floor(rnd() * pool.length); if (!used.has(k)) { used.add(k); items.push(pool[k]); } }
    V().innerHTML = `<div class="quiz-wrap" style="margin:0 auto"><h1 class="display" style="font-size:clamp(28px,4vw,40px);margin-bottom:6px">Today’s brief</h1><p class="muted">Five questions, the same for everyone today. ${S.daily[today()] != null ? `You scored ${S.daily[today()]}/5 today.` : ''}</p><div id="qz" style="margin-top:18px"></div></div>`;
    runQuiz($('#qz'), items, { title: 'Daily brief', onDone: r => { const first = S.daily[today()] == null; S.daily[today()] = Math.max(S.daily[today()] || 0, r.correct); save(); if (first) addXP(r.correct * 10, 'Daily brief'); } });
  }
  function progress() {
    crumbs('<b>Progress</b>');
    const L = level(), days = Array.from({ length: 28 }, (_, i) => { const d = dstr(new Date(Date.now() - (27 - i) * 864e5)); return [d, S.days[d] || 0]; }), mx = Math.max(10, ...days.map(d => d[1]));
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Progress</h1>
      <div class="grid g3 sec" style="margin-top:18px"><div class="card"><div class="eyebrow">Level ${L.l}</div><div class="h2" style="margin:8px 0">${esc(L.name)}</div><div class="bar" style="--uc:var(--gilt)"><i style="width:${clamp(L.frac, 0, 1) * 100}%"></i></div><p class="small muted">${S.xp} XP · next level at ${Math.round(L.next)}</p></div>
      <div class="card"><div class="eyebrow">Last 28 days</div><svg viewBox="0 0 280 90" width="100%" height="110" role="img" aria-label="XP earned per day">${days.map(([d, v], i) => `<rect x="${i * 10 + 1}" y="${80 - v / mx * 70}" width="8" height="${Math.max(1, v / mx * 70)}" rx="1.5" fill="${v ? 'var(--accent)' : 'var(--line-2)'}"><title>${d}: ${v} XP</title></rect>`).join('')}<line x1="0" y1="81" x2="280" y2="81" stroke="var(--line-2)"/><text x="0" y="90" font-size="7" fill="var(--muted)">4 weeks ago</text><text x="280" y="90" font-size="7" fill="var(--muted)" text-anchor="end">today</text></svg></div>
      <div class="card"><div class="eyebrow">Totals</div><div class="readouts" style="margin-top:10px"><div class="ro"><span>Quizzes</span><b>${S.stats.quizzes}</b></div><div class="ro"><span>Cards reviewed</span><b>${S.stats.cardsSeen}</b></div><div class="ro"><span>Exam marks</span><b>${S.stats.examMarks}</b></div><div class="ro"><span>Tools tried</span><b>${S.stats.tools.length}</b></div></div></div></div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Mastery by topic</h2><span class="muted">40% quiz · 20% flashcards · 20% checklist · 20% practice tasks</span></div>
      ${UNITS.filter(u => unitTopics(u.id).length).map(u => `<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:6px;color:${u.css}">${esc(u.name)}</div><div class="heat">${unitTopics(u.id).map(t => { const m = mastery(t); return `<a href="#/t/${t.id}" title="${esc(t.title)} · ${pct(m)}" style="background:color-mix(in srgb,${u.css} ${Math.round(8 + m * 80)}%,var(--surface))">${esc(t.id)}</a>`; }).join('')}</div></div>`).join('')}</div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Badges</h2><span class="muted">${S.badges.length} of ${BADGES.length}</span></div><div class="badge-grid">${BADGES.map(([id, n, d, , ic]) => `<div class="badge ${S.badges.includes(id) ? 'got' : ''}"><div class="ic">${ic}</div><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('')}</div></div>
      <div class="sec"><button class="btn sm" id="reset">${ICON.reset} Reset all progress</button><span id="reset-c"></span></div>`;
    $('#reset').onclick = () => { $('#reset-c').innerHTML = ` <span class="small">This deletes all XP, marks and cards. </span><button class="btn sm" id="reset-y" style="border-color:var(--bad);color:var(--bad)">Yes, reset</button>`; $('#reset-y').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.hash = '#/home'; location.reload(); }; };
  }
  function about() {
    crumbs('<b>About &amp; help</b>');
    V().innerHTML = `<div class="notes"><h1 class="display" style="font-size:clamp(32px,5vw,50px);margin-bottom:14px">About Brief</h1>
      <p class="lede">Brief covers the Pearson BTEC Level 3 National Certificate in Applied Law: Unit 1 Dispute Solving in Civil Law (external) and Unit 2 Investigating Aspects of Criminal Law and the Legal System (internal). Every content area in the specification has its own topic.</p>
      <h3 style="margin-top:24px">How to use it</h3><ul><li><b>Learn</b> — notes for each content area, with evaluation points, worked answers and common mistakes. Tap any <button class="case" type="button" data-case="donoghue">case name</button> for its facts and principle.</li><li><b>Key cases</b> — the cases for the topic; hide the facts to test yourself.</li><li><b>Explore</b> — interactive tools: the negligence test, precedent, civil tracks, contributory negligence, the non-fatal offence ladder, sentencing and more.</li><li><b>Flashcards</b> — spaced repetition in five boxes.</li><li><b>Quiz</b> and <b>practice tasks</b> — Unit 1 exam-style tasks, and Unit 2 assignment practice with the real Pass, Merit and Distinction criteria.</li><li><b>Practice papers</b> — Unit 1 pre-release cases with timed tasks, and Unit 2 practice assignment briefs.</li><li><b>Grade calculator</b> — the chip at the top of the page turns unit grades into points and a qualification grade.</li></ul>
      <h3 style="margin-top:24px">Keyboard shortcuts</h3><ul><li><kbd>/</kbd> search · <kbd>A</kbd>–<kbd>D</kbd> answer a quiz question · <kbd>Space</kbd> flip a card · <kbd>1</kbd>–<kbd>4</kbd> rate a card</li></ul>
      <h3 style="margin-top:24px">Accuracy</h3><p>The law is stated as understood in September 2026. Where reforms had been proposed but were not in force, the notes say so. Assessment details follow Pearson’s published specification (Issue 6, October 2023); check your teacher’s guidance and Pearson’s sample assessment materials for the exact format. Brief is an independent study aid and is not produced or endorsed by Pearson.</p>
      <p>Your progress is stored only in this browser. Clearing site data will reset it.</p></div>`;
  }

  /* ---------- SEARCH ---------- */
  function buildIndex() {
    const ix = [];
    allTopics().forEach(t => { ix.push({ k: 'Topic', t: `${t.id} ${t.title}`, s: t.short, href: '#/t/' + t.id, txt: (t.title + ' ' + t.short + ' ' + t.summary).toLowerCase() }); t.learn.forEach((sec, i) => ix.push({ k: 'Notes', t: sec.h, s: `${t.id} ${t.title}`, href: '#/t/' + t.id, txt: (sec.h + ' ' + plain(sec.html)).toLowerCase() })); });
    Object.values(CASES).forEach(c => ix.push({ k: 'Case', t: c.n + ' (' + c.y + ')', s: c.p, href: c.t && TOPIC[c.t] ? '#/t/' + c.t + '/cases' : '#/cases', txt: (c.n + ' ' + c.f + ' ' + c.p).toLowerCase() }));
    STATUTES.forEach(st => ix.push({ k: 'Statute', t: st.n, s: st.s.map(x => x[0]).join(', '), href: '#/statutes/acts', txt: (st.n + ' ' + st.s.flat().join(' ')).toLowerCase() }));
    GLOSSARY.forEach(g => ix.push({ k: 'Term', t: g[0], s: g[1], href: '#/statutes/terms', txt: (g[0] + ' ' + g[1]).toLowerCase() }));
    Object.entries(GAMES).forEach(([id, g]) => ix.push({ k: 'Game', t: g.title, s: g.blurb, href: '#/game/' + id, txt: (g.title + ' ' + g.blurb).toLowerCase() }));
    return ix;
  }
  function openPalette() {
    if ($('.palette-back')) return; index ??= buildIndex();
    const back = h('div', { class: 'palette-back', role: 'dialog', 'aria-label': 'Search' }, `<div class="palette"><input id="pq" placeholder="Search topics, cases, statutes, terms…" autocomplete="off" aria-label="Search"><ul id="pl"></ul></div>`);
    document.body.append(back);
    const inp = $('#pq'), ul = $('#pl'); let sel = 0, res = [];
    const draw = () => {
      const q = inp.value.toLowerCase().trim(); const words = q.split(/\s+/).filter(Boolean);
      res = q ? index.map(r => { let sc = 0; for (const w of words) { if (!r.txt.includes(w)) return null; sc += r.t.toLowerCase().includes(w) ? 3 : 1; } return { r, sc: sc + (r.k === 'Topic' ? 2 : r.k === 'Case' ? 1 : 0) }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 14).map(x => x.r) : index.filter(r => r.k === 'Topic').slice(0, 10);
      sel = Math.min(sel, Math.max(0, res.length - 1));
      ul.innerHTML = res.length ? res.map((r, i) => `<li><a href="${r.href}" class="${i === sel ? 'sel' : ''}"><span class="kind">${r.k}</span><span><span class="t">${esc(r.t)}</span><span class="s">${esc(plain(r.s))}</span></span></a></li>`).join('') : '<li class="empty" style="margin:8px">No matches. Try a case name, an Act or a topic.</li>';
    };
    const close = () => back.remove();
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter' && res[sel]) { location.hash = res[sel].href; close(); } else if (e.key === 'Escape') close(); };
    back.onclick = e => { if (e.target === back || e.target.closest('a')) close(); };
    draw(); inp.focus();
  }
  addEventListener('keydown', e => { if (e.key === '/' && !e.target.matches('input,textarea,select')) { e.preventDefault(); openPalette(); } if (e.key === 'Escape') closePop(); });

  /* ---------- boot ---------- */
  function boot() {
    if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
    chrome(); addEventListener('hashchange', route); route();
  }
  return { boot, refreshChrome, route };
})();
App.boot();

</script>
