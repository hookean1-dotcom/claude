<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stride GCSE PE</title>
<meta name="description" content="Stride: an interactive study app for WJEC Eduqas GCSE (9–1) Physical Education — notes, explorations, flashcards, quizzes, calculations, levels-marked exam questions, practice papers and Component 2 guides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* ==========================================================
   Stride · WJEC Eduqas GCSE (9–1) Physical Education
   Tokens: light = a floodlit athletics track, cool and clear;
           dark  = the stadium at night, scoreboard glow.
   Colour carries meaning: each area of study has its own lane colour.
   ========================================================== */
:root{
  --paper:#F1F4F8; --paper-2:#E7ECF2; --grid:#E0E6EE; --grid-2:#D0D8E3;
  --surface:#FFFFFF; --surface-2:#F6F8FB;
  --ink:#0E1A2C; --ink-2:#24344B; --muted:#56647A; --faint:#8793A6;
  --line:#DFE5EE; --line-2:#C6D0DE;
  --accent:#1D54D6; --accent-ink:#163F9F; --accent-soft:#DDE6FB;
  --good:#1F8A4C; --good-soft:#DCF1E4; --bad:#D22F45; --bad-soft:#FBE0E4;
  --warn:#B06A08; --warn-soft:#FCEFD8; --info:#1D6FC2; --info-soft:#DCEBFA;
  --shadow:0 1px 2px rgba(14,26,44,.06),0 4px 16px rgba(14,26,44,.07);
  --shadow-lg:0 12px 40px rgba(14,26,44,.18);
  --canvas-bg:#FFFFFF; --canvas-grid:#EDF1F6; --canvas-ink:#0E1A2C;
  /* units */
  --u1:#1D54D6; --u2:#1F8A4C; --u3:#B4235A; --u4:#B06A08; --u5:#C77A0A; --u6:#0E8C7A; --u7:#D22F45; --u8:#6A8A1A; --u9:#5E6B80;
  /* areas of study (lanes) */
  --a1:#D22F45; --a2:#7446D1; --a3:#0E8C7A; --a4:#B8740A; --a5:#E0621C;
  --uc:var(--accent);
  --r:10px; --r-lg:16px;
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",Times,serif;
  --side:256px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1020; --paper-2:#0F1629; --grid:#141C31; --grid-2:#1B2540;
    --surface:#121A2E; --surface-2:#172139; --ink:#E9EFF8; --ink-2:#C9D4E5;
    --muted:#98A6BD; --faint:#6F7C93; --line:#222D46; --line-2:#2F3B59;
    --accent:#6F9BFF; --accent-ink:#9DBBFF; --accent-soft:#18264A;
    --good:#4FCB82; --good-soft:#10301F; --bad:#FF6478; --bad-soft:#3A1520;
    --warn:#F2B04E; --warn-soft:#352610; --info:#63AEF2; --info-soft:#112A42;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
    --shadow-lg:0 16px 50px rgba(0,0,0,.55);
    --canvas-bg:#0F1629; --canvas-grid:#1A2340; --canvas-ink:#E9EFF8;
    --u1:#6F9BFF; --u2:#4FCB82; --u3:#F2709A; --u4:#F2B04E; --u5:#F0B54F; --u6:#3CCBB4; --u7:#FF6478; --u8:#A9CB55; --u9:#98A6BD;
    --a1:#FF6478; --a2:#A98BFF; --a3:#3CCBB4; --a4:#F2B04E; --a5:#FF9152;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#0A1020; --paper-2:#0F1629; --grid:#141C31; --grid-2:#1B2540;
    --surface:#121A2E; --surface-2:#172139; --ink:#E9EFF8; --ink-2:#C9D4E5;
    --muted:#98A6BD; --faint:#6F7C93; --line:#222D46; --line-2:#2F3B59;
    --accent:#6F9BFF; --accent-ink:#9DBBFF; --accent-soft:#18264A;
    --good:#4FCB82; --good-soft:#10301F; --bad:#FF6478; --bad-soft:#3A1520;
    --warn:#F2B04E; --warn-soft:#352610; --info:#63AEF2; --info-soft:#112A42;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
    --shadow-lg:0 16px 50px rgba(0,0,0,.55);
    --canvas-bg:#0F1629; --canvas-grid:#1A2340; --canvas-ink:#E9EFF8;
    --u1:#6F9BFF; --u2:#4FCB82; --u3:#F2709A; --u4:#F2B04E; --u5:#F0B54F; --u6:#3CCBB4; --u7:#FF6478; --u8:#A9CB55; --u9:#98A6BD;
    --a1:#FF6478; --a2:#A98BFF; --a3:#3CCBB4; --a4:#F2B04E; --a5:#FF9152;
    color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--grid-2) 1px,transparent 1.5px);
  background-size:22px 22px;background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
[hidden]{display:none!important}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:18px 14px 20px;
  scrollbar-width:thin;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#0A1017;position:relative;overflow:hidden;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand-mark i{position:absolute;top:5px;bottom:5px;width:2px;border-radius:1px;filter:drop-shadow(0 0 3px currentColor)}
.brand-name{font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand-sub{font:500 10.5px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a,.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;
  color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;text-align:left
}
.nav a:hover,.nav button:hover{background:var(--surface-2)}
.nav a.on{background:var(--paper-2);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .unit-a{align-items:flex-start}
.unit-line{width:3px;align-self:stretch;border-radius:2px;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.unit-a small{display:block;font:500 11px/1.3 var(--f-mono);color:var(--faint);letter-spacing:.03em}
.nav .meter{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--faint);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;gap:10px;padding:10px 28px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.crumbs{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.crumbs b{color:var(--ink);font-weight:600}
.search-btn{display:flex;align-items:center;gap:8px;min-width:220px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
.search-btn:hover{border-color:var(--line-2)}
.search-btn kbd{margin-left:auto}
kbd{font:500 11px var(--f-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{padding:28px 28px 80px;max-width:1240px;width:100%;margin:0 auto}
.view.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Mobile ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:60;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,10,15,.45);z-index:55}
  .top{padding:8px 16px}
  .search-btn{min-width:0;flex:none}
  .search-btn span,.search-btn kbd{display:none}
  .view{padding:18px 16px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10.5px var(--f-body);color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabbar a.on{color:var(--ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .hide-m{display:none!important}
}
@media (min-width:901px){.menu-btn{display:none!important}}

/* ---------- Type ---------- */
h1,h2,h3,h4{text-wrap:balance;margin:0}
.display{font:800 clamp(38px,6vw,68px)/.92 var(--f-display);letter-spacing:.005em;text-transform:uppercase}
.h2{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.h3{font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font:600 11.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;color:var(--ink-2);max-width:62ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.sec-head .h2,.sec-head .h3{flex:none}
.sec-head .muted{font-size:14px}

/* ---------- Math ---------- */
.m{font-family:var(--f-math);font-size:1.08em;white-space:nowrap;letter-spacing:.01em}
.m i{font-style:italic;padding-right:.04em}
.m .rm{font-style:normal}
.m sub,.m sup{font-size:.7em;line-height:0}
.m sub{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.15}
.fr>.nu{border-bottom:1px solid currentColor;padding:0 .15em}
.fr>.de{padding:0 .15em}
.sq{position:relative;display:inline-block;padding-left:.66em;white-space:nowrap}
.sq .rs{position:absolute;left:0;top:0;width:.66em;height:100%;overflow:visible;fill:none;stroke:currentColor}
.sq .rs path{stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}
.sq .ra{display:inline-block;border-top:1.3px solid currentColor;padding:.14em .1em 0 .06em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ov{text-decoration:overline}
.eqbig .m{font-size:1.4em}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1B1203}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--uc);border-radius:3px;transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--f-mono);letter-spacing:.02em;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--uc);box-shadow:0 0 6px var(--uc);flex:none}

/* ---------- Home ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#070B10;color:#E8EEF3;padding:30px 30px 26px;border:1px solid #1B2632;box-shadow:var(--shadow-lg)}
.hero canvas.spec{display:block;width:100%;height:120px;border-radius:10px;margin-top:22px;background:#020406}
.hero .display{color:#F3F6F8}
.hero .eyebrow{color:#8FA2B1}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:end}
.hero p{color:#B9C6D0;max-width:52ch;margin:12px 0 0}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px}
.hstat b{display:block;font:800 32px/1 var(--f-display);color:#fff;font-variant-numeric:tabular-nums}
.hstat span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#8FA2B1}
.spec-axis{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:#6D8091;margin-top:6px;letter-spacing:.05em}
.hero .btn{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff}
.hero .btn.accent{background:#FFB547;border-color:#FFB547;color:#1B1203}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding:22px 18px}}

.unit-card{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:18px 18px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.unit-card:hover{transform:translateY(-2px);border-color:var(--uc)}
.unit-card .line{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.unit-card .nm{font:500 11px var(--f-mono);color:var(--muted)}
.unit-card .h3{font-size:22px}

.topic-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--uc);transform:translateY(-1px)}
.tcard .no{grid-row:span 3;font:800 30px/1 var(--f-display);color:var(--uc);min-width:52px}
.tcard .tt{font-weight:600;font-size:15px;line-height:1.3}
.tcard .ts{font-size:12.5px;color:var(--muted);line-height:1.4}
.tcard .bar{margin-top:6px}

/* ---------- Topic page ---------- */
.topic-head{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:end;margin-bottom:18px}
.topic-no{grid-row:span 2;font:800 clamp(64px,10vw,112px)/.8 var(--f-display);color:var(--uc);text-shadow:0 0 30px color-mix(in srgb,var(--uc) 35%,transparent)}
.topic-head .display{font-size:clamp(32px,5vw,54px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--uc);box-shadow:0 0 8px var(--uc)}
.tab .n{font:500 11px var(--f-mono);color:var(--faint)}
.layout-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:1100px){.layout-2{grid-template-columns:1fr}}
.aside{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.aside{position:static}}

/* notes */
.notes{max-width:74ch}
.notes section{margin-bottom:34px;scroll-margin-top:130px}
.notes h3{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.notes h3 .k{font:600 12px var(--f-mono);color:var(--uc);letter-spacing:.06em}
.notes h4{font-size:16px;margin:18px 0 6px}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin:4px 0}
.notes table,.tbl table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;width:100%}
.notes th,.notes td,.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.notes th,.tbl th{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0 14px}
.tbl table{margin:0}
.box{position:relative;border-radius:12px;padding:14px 16px 12px;margin:14px 0;background:var(--surface);border:1px solid var(--line)}
.box>b.lbl{display:inline-block;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.def{border-left:3px solid var(--uc)}
.box.def>b.lbl{color:var(--uc)}
.box.tip{background:var(--accent-soft);border-color:transparent}
.box.tip>b.lbl{color:var(--accent-ink)}
.box.warn{background:var(--bad-soft);border-color:transparent}
.box.warn>b.lbl{color:var(--bad)}
.box.eq{text-align:center;font-size:18px;padding:18px}
.box.why{background:var(--info-soft);border-color:transparent}
.box.why>b.lbl{color:var(--info)}
.fig{margin:16px 0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;font-size:13.5px}
.toc a:hover{color:var(--ink);border-color:var(--uc)}

.spec-list{display:flex;flex-direction:column;gap:6px}
.spec-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.45;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.rag{display:flex;gap:3px;margin-top:1px}
.rag button{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-2);background:none;padding:0}
.rag button.on[data-v="1"]{background:var(--bad);border-color:var(--bad)}
.rag button.on[data-v="2"]{background:var(--warn);border-color:var(--warn)}
.rag button.on[data-v="3"]{background:var(--good);border-color:var(--good)}

.eq-row{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 16px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.eq-row:last-child{border:0}
.eq-row .m{font-size:1.2em}
.eq-row span.d{font-size:13px;color:var(--muted)}
.eq-tag{font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--paper-2);color:var(--muted);margin-left:6px;vertical-align:middle}
.eq-tag.nb{background:var(--warn-soft);color:var(--warn)}

/* worked */
.worked{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:16px}
.worked .wq{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.worked ol{margin:0;padding:12px 18px 12px 42px}
.worked li{margin:6px 0}
.worked li.hid{display:none}
.worked .wf{display:flex;gap:10px;padding:10px 18px 14px;align-items:center;flex-wrap:wrap}
.ans{font-weight:600;padding:8px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:760px}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.q-prog{flex:1;min-width:120px;display:flex;gap:3px}
.q-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.q-prog i.c{background:var(--good)} .q-prog i.w{background:var(--bad)} .q-prog i.cur{background:var(--uc)}
.q-text{font-size:19px;line-height:1.5;margin:6px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;line-height:1.45;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--line-2);transform:translateX(2px)}
.opt .k{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--paper-2);font:600 13px var(--f-mono)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.explain b.v{font:700 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.explain b.v.good{color:var(--good)} .explain b.v.bad{color:var(--bad)}
.result{text-align:center;padding:30px 20px}
.result .big{font:800 88px/1 var(--f-display);color:var(--uc)}

/* calc practice */
.calc-q{font-size:17.5px;line-height:1.55;margin-bottom:14px}
.calc-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc-in input{width:200px;max-width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font:500 17px var(--f-mono)}
.calc-in input:focus{outline:none;border-color:var(--uc)}
.calc-in .unit{font-family:var(--f-math);font-size:17px}
.steps{margin-top:14px;padding:14px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.steps ol{margin:6px 0 0;padding-left:20px}
.steps li{margin:5px 0}

/* exam */
.examq{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.examq .eh{display:flex;gap:12px;padding:16px 18px;align-items:flex-start}
.examq .eh .mk{margin-left:auto;flex:none}
.examq textarea{display:block;width:calc(100% - 36px);margin:0 18px 12px;min-height:90px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);resize:vertical;font-size:14.5px}
.ms{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px;cursor:pointer}
.ms input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}

/* flashcards */
.fc-stage{perspective:1400px;max-width:640px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:19px;line-height:1.5;overflow:auto}
.fc>div .eyebrow{position:absolute;top:18px;left:0;right:0}
.fc .back{transform:rotateY(180deg);background:var(--surface-2)}
.fc .front::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.fc-ctl{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.boxes{display:flex;gap:6px;justify-content:center;margin-top:14px}
.boxes span{font:500 11px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--paper-2);color:var(--muted)}

/* ---------- Sims ---------- */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sim-stage{position:relative;background:var(--canvas-bg);min-height:360px;border-right:1px solid var(--line)}
.sim-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.sim-ctl{padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.sim-title{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px;gap:8px}
.ctl label output{font:600 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:10px;background:var(--paper-2)}
.seg button{flex:1;padding:6px 8px;border:0;border-radius:7px;background:none;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.ro span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ro{min-width:0}
.ro b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sim-note{font-size:13px;color:var(--ink-2);line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.sim-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
@media (max-width:900px){.sim{grid-template-columns:1fr}.sim-stage{border-right:0;border-bottom:1px solid var(--line);min-height:300px}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--uc) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--uc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--uc);margin-top:-7px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--uc)}
select{padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)}

/* ---------- Search palette ---------- */
.palette-back{position:fixed;inset:0;background:rgba(5,10,15,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.palette{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;background:none;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:55vh;overflow-y:auto}
.palette li a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none}
.palette li a.sel,.palette li a:hover{background:var(--surface-2)}
.palette li .t{font-weight:500}
.palette li .s{font-size:12.5px;color:var(--muted)}
.palette .kind{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---------- Toast & fx ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
@media (max-width:900px){.toasts{bottom:84px;right:12px;left:12px;align-items:stretch}}
.toast{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow-lg);font-size:14px;animation:tin .3s ease}
.toast b{font:800 18px var(--f-display);color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:150;width:100%;height:100%}

/* ---------- Arcade ---------- */
.game-card{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .15s}
.game-card:hover{transform:translateY(-2px)}
.game-card .art{height:110px;border-radius:12px;background:#070B10;position:relative;overflow:hidden}
.game-card .art canvas{width:100%;height:100%;display:block}
.game{max-width:760px;margin:0 auto}
.game-hud{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hud{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:90px}
.hud span{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud b{font:800 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.big-prompt{font:700 clamp(26px,4vw,38px)/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:10px 0 20px;text-align:center}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.quark-bin{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.quark{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:600 26px var(--f-math);font-style:italic;border:2px solid;background:var(--surface);transition:transform .1s}
.quark:hover{transform:scale(1.06)}
.quark small{display:block;font:500 10.5px var(--f-mono);font-style:normal;margin-top:-18px}
.hadron{min-height:120px;display:flex;gap:12px;justify-content:center;align-items:center;border:2px dashed var(--line-2);border-radius:60px;padding:16px;margin:0 auto;max-width:360px}

/* ---------- Equation sheet ---------- */
.eq-section{break-inside:avoid;margin-bottom:18px}
.eq-cols{columns:2 420px;column-gap:22px}
.eq-card{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px;display:inline-block;width:100%}
.eq-card h4{font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px;display:flex;align-items:center;gap:8px}
.const-table{width:100%;border-collapse:collapse;font-size:14px}
.const-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
.const-table td:last-child{font-family:var(--f-mono);font-size:13px;white-space:nowrap}

/* misc */
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.kbd-hint{font-size:12px;color:var(--faint);margin-top:10px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;opacity:.45;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--accent)}
.badge .ic{font:800 30px var(--f-display);color:var(--accent-ink)}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.heat a{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font:600 10.5px var(--f-mono);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.prac{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
.prac summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.prac summary::-webkit-details-marker{display:none}
.prac summary .pno{font:800 20px var(--f-display);color:var(--uc);min-width:44px}
.prac[open] summary{border-bottom:1px solid var(--line)}
.prac .pb{padding:14px 18px}
.prac .pb h5{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.prac .pb h5:first-child{margin-top:0}
.prac .pb ul,.prac .pb ol{margin:0;padding-left:20px}
.chev{margin-left:auto;transition:transform .2s;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.prac[open] .chev{transform:rotate(180deg)}
.note-strip{font-size:12.5px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed var(--line-2);margin-top:24px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* fixes */
.search-btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.search-btn span{white-space:nowrap}
.tab{text-decoration:none}
.lc{text-transform:none;letter-spacing:.02em}
@media (max-width:640px){.spec-axis span:nth-child(2){display:none}}

/* ================= Live Wire additions ================= */
.brand-mark.lw{display:grid;place-items:center;background:linear-gradient(135deg,#1A1204,#0A1017)}
.brand-mark.lw svg{width:22px;height:22px;fill:#FFC24B;stroke:#FFE08A;stroke-width:1;filter:drop-shadow(0 0 5px rgba(255,190,70,.8))}
.hero canvas.circuit{height:clamp(230px,34vw,300px);background:#05080B;border:1px solid #16212C}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-body);letter-spacing:.02em;padding:4px 8px;border-radius:999px;vertical-align:middle;margin-right:6px;white-space:nowrap}
.tag.sm{font-size:10px;padding:3px 6px;margin-right:5px}
.tag.ht{background:color-mix(in srgb,var(--u7) 16%,transparent);color:var(--u7);border:1px solid color-mix(in srgb,var(--u7) 40%,transparent)}
.tag.po{background:color-mix(in srgb,var(--u4) 14%,transparent);color:var(--u4);border:1px solid color-mix(in srgb,var(--u4) 40%,transparent)}
.tier-chip{cursor:pointer;border:1px solid var(--line-2);font-weight:600}
.tier-chip:hover{border-color:var(--accent)}
.settings-dlg{padding:22px;max-width:560px}
.seg.big{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-top:6px;flex-wrap:wrap}
.seg.big button{flex:1;min-width:150px;border:0;background:transparent;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.seg.big button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.unit-a.off,.unit-card.off{opacity:.45}
.onboard{border:1px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.linkcard{text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s}
.linkcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.grid.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid.g4{grid-template-columns:1fr}}
.nuc{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.62em;line-height:1.05;vertical-align:-.42em;margin-right:1px;font-family:var(--f-math)}
.nuc b{font-weight:400}
.eq-row.out{opacity:.4}
.eq-row .eqm{min-width:0}
#eqlists.covered .eq-row .eqm{filter:blur(7px);cursor:pointer;transition:filter .2s}
#eqlists.covered .eq-row.peek .eqm{filter:none}
.prac h5{margin:14px 0 6px}
.prac .pno{font:800 20px var(--f-display);color:var(--uc,var(--accent));min-width:52px}
.ht-inline{border-left:3px solid var(--u7);padding-left:10px}
[data-ht]{border-left:3px solid var(--u7);padding-left:10px}
[data-po]{border-left:3px solid var(--u4);padding-left:10px}
.toc a{white-space:normal}
.fig svg{max-width:100%;height:auto}
.game-sym{display:grid;place-items:center;min-height:150px}
.game-sym svg{width:min(260px,70vw);height:auto}

/* ---------- Stride (from Pulse) overrides: condensed scoreboard display, night-stadium hero ---------- */
.display{font:800 clamp(40px,6vw,70px)/.92 var(--f-display);letter-spacing:.005em;text-transform:uppercase}
.h2{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.h3{font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.brand-name{font:800 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.tcard .no,.topic-no{font-family:var(--f-display);font-weight:800}
.topic-no{font-size:clamp(60px,9vw,108px)}
.hstat b{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.hero{background:linear-gradient(180deg,#0B1428 0%,#0A1020 70%);border-color:#1B2742;color:#E9EFF8}
.hero .display{color:#F4F7FC}
.hero .eyebrow,.hstat span{color:#93A3C0}
.hero p{color:#C3CEE0}
.hero .btn.accent{background:#FF5468;border-color:#FF5468;color:#fff}
.hero canvas.track{display:block;width:100%;height:clamp(300px,38vw,400px);margin-top:18px;border-radius:14px;background:#0B1326;border:1px solid #1B2742}
.brand-mark.pl{display:grid;place-items:center;background:linear-gradient(160deg,#10204A,#0A1020);border-radius:9px}

  coachcycle: () => cycleDiag(520, 330, 260, 168, 118, [['Plan', 'goals, session', A3], ['Deliver', 'coach the session', A3], ['Observe', 'watch performance', A1], ['Analyse', 'video, notation, data', A1], ['Feedback', 'KR, KP, targets', A2]], { center: ['the coaching', 'process'], label: 'The coaching process as a cycle' }) + cap('Real-time observation is the weak link: technology makes “observe” and “analyse” objective, repeatable and recordable.'),

  levers: () => { const W = 620, H = 250; let s = '';
    const panel = (x0, title, order, ex) => { const y = 110, L = 170; let p = ln(x0, y, x0 + L, y, INK, 5);
      const pos = { 1: { F: .5, E: .08, L: .92 }, 2: { F: .06, L: .5, E: .94 }, 3: { F: .06, E: .42, L: .94 } }[order];
      const fx = x0 + L * pos.F, ex_ = x0 + L * pos.E, lx = x0 + L * pos.L;
      p += `<polygon points="${fx},${y + 4} ${fx - 13},${y + 26} ${fx + 13},${y + 26}" fill="${A3}" fill-opacity=".25" stroke="${A3}" stroke-width="2"/>` + tx(fx, y + 42, 'F', { a: 'middle', c: A3, w: 700, fs: 13 });
      p += arrow(ex_, y + 50, ex_, y + 6, A1, 2.4) + tx(ex_, y + 64, 'E', { a: 'middle', c: A1, w: 700, fs: 13 });
      p += box(lx - 13, y - 30, 26, 26, 'var(--surface-2)', A2, 4, 2) + arrow(lx, y - 4, lx, y + 22, A2, 2) + tx(lx, y - 38, 'L', { a: 'middle', c: A2, w: 700, fs: 13 });
      p += tx(x0 + L / 2, 30, title, { a: 'middle', c: INK, w: 700, fs: 14 }) + tx(x0 + L / 2, 48, `${['', 'fulcrum', 'load', 'effort'][order]} in the middle`, { a: 'middle', fs: 11.5 }) + lines(x0 + L / 2, 200, ex, { fs: 11.5, c: INK });
      return p; };
    s += panel(20, '1st order', 1, ['neck (heading)', 'elbow extension (triceps)']) + panel(225, '2nd order', 2, ['ankle plantar flexion', 'mechanical advantage']) + panel(430, '3rd order', 3, ['elbow flexion, knee extension', 'speed and range; MA < 1']);
    return svg(W, H, s, 'Three orders of lever with fulcrum, effort and load') + cap('Remember “FLE 1-2-3”: what is in the middle — Fulcrum (1st), Load (2nd), Effort (3rd).'); },

  planes: () => { const W = 620, H = 250; let s = '';
    const P = (x0, title, plane, axis, eg, col) => { let p = tx(x0 + 95, 22, title, { a: 'middle', c: INK, w: 700, fs: 14 }) + figure(x0 + 95, 40, 1, INK, { armsOut: plane === 'frontal', legsOut: plane === 'frontal' });
      if (plane === 'sagittal') p += `<rect x="${x0 + 93}" y="36" width="4" height="138" fill="${col}" fill-opacity=".45"/>` + ln(x0 + 40, 118, x0 + 150, 118, col, 2.4, '6 4') + tx(x0 + 152, 122, 'axis', { fs: 11, c: col });
      if (plane === 'frontal') p += `<rect x="${x0 + 40}" y="36" width="110" height="138" rx="6" fill="${col}" fill-opacity=".12" stroke="${col}"/>` + circ(x0 + 95, 118, 6, col, col) + tx(x0 + 105, 112, 'axis (into page)', { fs: 11, c: col });
      if (plane === 'transverse') p += `<ellipse cx="${x0 + 95}" cy="118" rx="58" ry="12" fill="${col}" fill-opacity=".18" stroke="${col}"/>` + ln(x0 + 95, 30, x0 + 95, 176, col, 2.4, '6 4') + tx(x0 + 102, 34, 'axis', { fs: 11, c: col });
      return p + lines(x0 + 95, 200, [plane + ' plane · ' + axis + ' axis', eg], { fs: 11.5, c: INK }); };
    s += P(10, 'Sagittal', 'sagittal', 'transverse', 'flexion/extension · somersault', A1) + P(215, 'Frontal', 'frontal', 'frontal (AP)', 'abduction/adduction · cartwheel', A2) + P(420, 'Transverse', 'transverse', 'longitudinal', 'rotation · full twist', A3);
    return svg(W, H, s, 'Three planes and their axes') + cap('The movement happens <i>in</i> the plane and turns <i>about</i> the axis at right angles to it.'); },

  synovial: () => { const W = 520, H = 300; let s = '';
    s += pth('M200,20 L200,110 Q260,150 320,110 L320,20', INK, 2, 'var(--surface-2)') + pth('M200,280 L200,180 Q260,150 320,180 L320,280', INK, 2, 'var(--surface-2)');
    s += pth('M203,108 Q260,146 317,108', 'var(--info)', 7) + pth('M203,182 Q260,152 317,182', 'var(--info)', 7);
    s += pth('M182,92 Q170,145 182,198 M338,92 Q350,145 338,198', A1, 3) + `<path d="M204,118 Q260,152 316,118 L316,172 Q260,154 204,172 Z" fill="var(--info)" fill-opacity=".14"/>`;
    s += pth('M190,70 L186,220 M330,70 L334,220', A4, 4, 'none', '2 5');
    const lab = (x, y, x2, y2, t) => ln(x, y, x2, y2, MUT, 1) + tx(x2 + (x2 > x ? 4 : -4), y2 + 4, t, { a: x2 > x ? 'start' : 'end', fs: 12, c: INK });
    s += lab(300, 120, 400, 60, 'articular cartilage') + lab(260, 145, 400, 140, 'synovial fluid (cavity)') + lab(345, 150, 400, 200, 'synovial membrane / joint capsule') + lab(188, 210, 110, 240, 'ligament') + lab(230, 40, 110, 40, 'bone');
    return svg(W, H, s, 'Structure of a synovial joint') + cap('Cartilage reduces friction and absorbs shock; synovial fluid lubricates; ligaments join bone to bone; the capsule encloses the joint.'); },

  musclemap: () => { const W = 620, H = 360; let s = '';
    const body = (cx) => circ(cx, 34, 20, 'var(--surface-2)', INK) + box(cx - 42, 58, 84, 120, 'var(--surface-2)', INK, 18) + box(cx - 66, 62, 22, 108, 'var(--surface-2)', INK, 10) + box(cx + 44, 62, 22, 108, 'var(--surface-2)', INK, 10) + box(cx - 38, 178, 34, 150, 'var(--surface-2)', INK, 12) + box(cx + 4, 178, 34, 150, 'var(--surface-2)', INK, 12);
    const m = (x, y, rx, ry, c) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${c}" fill-opacity=".55"/>`;
    const L = (x, y, x2, y2, t) => ln(x, y, x2, y2, MUT, 1) + tx(x2 + (x2 > x ? 4 : -4), y2 + 4, t, { a: x2 > x ? 'start' : 'end', fs: 11.5, c: INK });
    s += tx(150, 352, 'FRONT', { a: 'middle', fs: 11, w: 700 }) + tx(470, 352, 'BACK', { a: 'middle', fs: 11, w: 700 });
    s += body(150) + m(130, 82, 17, 12, A1) + m(170, 82, 17, 12, A1) + m(98, 70, 10, 10, A2) + m(202, 70, 10, 10, A2) + m(95, 110, 8, 18, A3) + m(205, 110, 8, 18, A3) + m(150, 135, 18, 30, A4) + m(129, 220, 13, 32, A5) + m(171, 220, 13, 32, A5) + m(128, 285, 8, 26, A2) + m(172, 285, 8, 26, A2);
    s += L(130, 82, 40, 70, 'pectoralis major') + L(98, 70, 40, 44, 'deltoid') + L(95, 115, 40, 120, 'biceps brachii') + L(150, 140, 250, 150, 'abdominals') + L(171, 220, 250, 215, 'quadriceps') + L(172, 285, 250, 290, 'tibialis anterior');
    s += body(470) + m(470, 70, 34, 10, A1) + m(450, 115, 14, 30, A2) + m(490, 115, 14, 30, A2) + m(470, 150, 7, 32, A3) + m(418, 112, 8, 18, A4) + m(522, 112, 8, 18, A4) + m(450, 190, 16, 14, A5) + m(490, 190, 16, 14, A5) + m(451, 236, 13, 30, A1) + m(489, 236, 13, 30, A1) + m(451, 290, 11, 18, A3) + m(489, 290, 11, 18, A3) + m(451, 314, 9, 8, A4) + m(489, 314, 9, 8, A4);
    s += L(470, 70, 560, 50, 'trapezius') + L(490, 115, 560, 100, 'latissimus dorsi') + L(470, 158, 560, 150, 'erector spinae') + L(418, 112, 350, 100, 'triceps brachii') + L(450, 190, 350, 190, 'gluteus maximus') + L(451, 236, 350, 236, 'hamstrings') + L(489, 290, 560, 280, 'gastrocnemius') + L(489, 314, 560, 318, 'soleus');
    return svg(W, H, s, 'Major skeletal muscles, front and back') + cap('The fourteen muscles named in the specification (schematic positions).'); },

  antag: () => { const W = 520, H = 250; let s = '';
    s += box(60, 110, 200, 22, 'var(--surface-2)', INK, 10) + pth('M260,121 L380,40', INK, 22, 'none') + pth('M260,121 L380,40', 'var(--surface-2)', 18, 'none') + circ(260, 121, 12, 'var(--surface)', INK) + tx(260, 160, 'elbow (fulcrum)', { a: 'middle', fs: 11.5 });
    s += `<ellipse cx="165" cy="98" rx="80" ry="18" fill="${A1}" fill-opacity=".6"/>` + tx(165, 70, 'biceps — agonist (contracts, shortens)', { a: 'middle', fs: 12, c: A1, w: 700 });
    s += `<ellipse cx="160" cy="143" rx="86" ry="10" fill="${A2}" fill-opacity=".45"/>` + tx(160, 172, 'triceps — antagonist (relaxes, lengthens)', { a: 'middle', fs: 12, c: A2, w: 700 });
    s += pth('M400,90 A80,80 0 0 0 360,30', A3, 2) + arrowHead(360, 30, -2.4, A3) + tx(410, 70, 'flexion', { fs: 12, c: A3, w: 700 }) + tx(60, 220, 'Muscles can only pull, so they work in pairs on opposite sides of a joint.', { fs: 11.5 });
    return svg(W, H, s, 'Antagonistic pair at the elbow') + cap('Upward phase of a biceps curl: biceps concentric (agonist), triceps relaxing (antagonist).'); },

  periodise: () => { const W = 620, H = 270; let s = '';
    const ph = [['General prep', 0, 3, A3], ['Specific prep', 3, 5.5, A3], ['Pre-competition', 5.5, 7, A4], ['Competition', 7, 10.5, A1], ['Transition', 10.5, 12, A2]], X = m => 40 + m * 45;
    ph.forEach(([n, a, b, c]) => s += cell(X(a) + 1, 196, X(b) - X(a) - 2, 26, c, n, { op: .25, fs: 10.5 }));
    for (let w = 0; w <= 52; w += 1) s += ln(X(w / 52 * 12), 226, X(w / 52 * 12), 232, MUT, 1);
    s += tx(40, 250, 'macrocycle = 1 year · mesocycles = coloured blocks · microcycles = weekly ticks', { fs: 11.5 });
    s += pth(`M${X(0)},60 C${X(3)},55 ${X(5)},90 ${X(7)},130 S${X(10)},165 ${X(12)},150`, A3, 2.6) + tx(X(1), 50, 'volume', { fs: 12, c: A3, w: 700 });
    s += pth(`M${X(0)},170 C${X(3)},160 ${X(5)},110 ${X(7)},80 S${X(9.5)},62 ${X(10.3)},70 L${X(12)},160`, A1, 2.6) + tx(X(5.4), 100, 'intensity', { fs: 12, c: A1, w: 700 });
    s += arrow(X(9.8), 40, X(9.8), 64, INK, 1.6) + tx(X(9.8), 34, 'taper → peak', { a: 'middle', fs: 11.5, c: INK });
    return svg(W, H, s, 'Periodisation of a training year') + cap('Volume falls and intensity rises towards the competition phase; tapering cuts volume before the main event.'); },

  atp: () => { const W = 560, H = 160; let s = '';
    s += node(80, 60, 90, 36, 'Adenosine', INK) + ['P', 'P', 'P'].map((p, i) => circ(150 + i * 40, 60, 15, 'var(--surface-2)', A1) + tx(150 + i * 40, 65, p, { a: 'middle', w: 700, c: A1 })).join('') + ln(125, 60, 135, 60) + ln(165, 60, 175, 60) + ln(205, 60, 215, 60, A1, 3, '4 3');
    s += arrow(250, 60, 320, 60, INK, 2) + tx(285, 48, 'ATPase', { a: 'middle', fs: 12, w: 700, c: INK });
    s += node(380, 60, 90, 36, 'ADP', INK) + circ(450, 60, 15, 'var(--surface-2)', A1) + tx(450, 65, 'Pᵢ', { a: 'middle', w: 700, c: A1 }) + tx(490, 64, '+ energy', { fs: 13, c: A4, w: 700 });
    s += tx(40, 120, 'The bond to the last phosphate holds the energy used for muscle contraction.', { fs: 12 }) + tx(40, 140, 'ATP stores last 2–3 s; ATP is resynthesised by the ATP-PC, lactic acid and aerobic systems.', { fs: 12 });
    return svg(W, H, s, 'ATP breakdown'); },

  energycont: () => plot({ w: 560, h: 300, x: [0, 180], y: [0, 105], xt: [0, 10, 30, 60, 120, 180], yt: [0, 50, 100], xl: 'duration of maximal exercise (s)', yl: '% contribution', label: 'Energy continuum',
    fns: [{ f: t => 100 * Math.exp(-Math.pow(t / 8, 2)), c: A1, label: 'ATP-PC', lx: 6, ldy: -6 }, { f: t => 85 * Math.exp(-Math.pow((t - 40) / 38, 2)), c: A4, label: 'anaerobic glycolysis', lx: 40, ldy: -10, la: 'middle' }, { f: t => 100 * (1 - Math.exp(-t / 70)), c: A3, label: 'aerobic', lx: 150, ldy: -10 }],
    vl: [{ x: 10, label: '≈10 s' }, { x: 120, label: '≈2 min' }], cap: 'All three systems work together; the intensity and duration decide which predominates. Thresholds are where one system’s supply runs short.' }),

  gicurve: () => plot({ w: 540, h: 290, x: [0, 150], y: [3, 9], xt: [0, 30, 60, 90, 120, 150], yt: [4, 5, 6, 7, 8], xl: 'time after eating (min)', yl: 'blood glucose (mmol/L)', label: 'Blood glucose after high- and low-GI foods',
    fns: [{ f: t => 4.5 + 3.8 * Math.exp(-Math.pow((t - 35) / 20, 2)) - 0.9 * Math.exp(-Math.pow((t - 95) / 22, 2)), c: A1, label: 'high GI', lx: 40, ldy: -8 }, { f: t => 4.5 + 1.5 * Math.exp(-Math.pow((t - 70) / 40, 2)), c: A3, label: 'low GI', lx: 120, ldy: -8 }],
    hl: [{ y: 4.5, label: 'fasting level' }], cap: 'High-GI food gives a rapid spike and can cause a dip below normal (rebound hypoglycaemia); low-GI food gives a slower, steadier release.' }),

  /* ============ UNIT 1 · psychology ============ */
  hollander: () => { const W = 520, H = 280; let s = '';
    s += circ(200, 140, 120, 'var(--surface-2)', A2, 2) + circ(200, 140, 80, 'var(--surface)', A2, 2) + circ(200, 140, 40, `color-mix(in srgb, ${A2} 25%, transparent)`, A2, 2);
    s += tx(200, 144, 'core', { a: 'middle', w: 700, c: INK }) + tx(200, 88, 'typical responses', { a: 'middle', fs: 12, c: INK }) + tx(200, 34, 'role-related behaviour', { a: 'middle', fs: 12, c: INK });
    s += arrow(470, 60, 330, 90, MUT) + arrow(470, 220, 330, 190, MUT) + lines(470, 130, ['social', 'environment', '(situation)'], { fs: 12, c: INK });
    s += tx(20, 272, 'inner = stable, deep beliefs · outer = most changeable, shaped by the situation', { fs: 11.5 });
    return svg(W, H, s, 'Hollander’s model of personality'); },

  eysenck: () => { const W = 520, H = 320, cx = 260, cy = 160; let s = '';
    s += arrow(40, cy, 480, cy) + arrow(480, cy, 40, cy) + arrow(cx, 300, cx, 20) + arrow(cx, 20, cx, 300);
    s += tx(40, cy - 8, 'INTROVERT', { fs: 12, w: 700, c: INK }) + tx(480, cy - 8, 'EXTROVERT', { a: 'end', fs: 12, w: 700, c: INK }) + tx(cx + 8, 32, 'NEUROTIC (unstable)', { fs: 12, w: 700, c: INK }) + tx(cx + 8, 296, 'STABLE', { fs: 12, w: 700, c: INK });
    s += lines(150, 80, ['anxious, moody,', 'rigid, reserved'], { c: A2 }) + lines(370, 80, ['touchy, restless,', 'impulsive, excitable'], { c: A1 }) + lines(150, 230, ['calm, careful,', 'reliable, thoughtful'], { c: A3 }) + lines(370, 230, ['sociable, lively,', 'carefree, leader'], { c: A4 });
    return svg(W, H, s, 'Eysenck’s personality dimensions') + cap('Extroverts: low natural arousal, seek stimulation (team, gross skills). Introverts: high natural arousal (individual, fine, closed skills).'); },

  iceberg: () => { const W = 540, H = 280; let s = ''; const moods = ['tension', 'depression', 'anger', 'vigour', 'fatigue', 'confusion'], elite = [42, 40, 43, 66, 40, 41], other = [52, 50, 50, 48, 53, 51];
    const X = i => 70 + i * 78, Y = v => 240 - (v - 30) * 5;
    s += ln(40, Y(50), 520, Y(50), 'var(--info)', 1.6, '6 4') + tx(520, Y(50) - 6, 'population mean (“waterline”)', { a: 'end', fs: 11, c: 'var(--info)' });
    s += pth(elite.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' '), A1, 3) + pth(other.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' '), MUT, 2, 'none', '5 4');
    elite.forEach((v, i) => s += dot(X(i), Y(v), A1, 4)); moods.forEach((m, i) => s += tx(X(i), 262, m, { a: 'middle', fs: 11.5, c: INK }));
    s += tx(X(3) + 10, Y(66) - 8, 'elite: iceberg profile', { fs: 12, c: A1, w: 700 }) + tx(X(4), Y(55) - 8, 'less successful', { fs: 11.5, c: MUT });
    return svg(W, H, s, 'POMS iceberg profile'); },

  arousaltheories: () => { const W = 640, H = 230; let s = '';
    const panel = (x0, title, path, extra = '') => box(x0, 20, 190, 170, 'var(--surface)', 'var(--line-2)', 10, 1) + arrow(x0 + 20, 170, x0 + 180, 170, INK, 1.2) + arrow(x0 + 20, 170, x0 + 20, 32, INK, 1.2) + tx(x0 + 100, 206, title, { a: 'middle', fs: 12.5, w: 700, c: INK }) + tx(x0 + 176, 186, 'arousal', { a: 'end', fs: 10.5 }) + tx(x0 + 26, 42, 'performance', { fs: 10.5 }) + pth(path, A2, 2.6) + extra;
    s += panel(10, 'Drive theory', 'M40,160 L180,50', tx(110, 80, 'P = H × D', { fs: 11, c: A2 }));
    s += panel(225, 'Inverted-U', 'M245,160 Q320,-10 395,160', ln(320, 170, 320, 76, MUT, 1, '4 3') + tx(320, 64, 'optimum', { a: 'middle', fs: 10.5 }));
    s += panel(440, 'Catastrophe', 'M460,160 Q520,40 555,50 L560,150 L600,160', pth('M600,150 Q540,140 520,120', MUT, 1.4, 'none', '4 3') + tx(566, 110, 'drop', { fs: 10.5, c: A1 }) + tx(470, 64, 'high cognitive anxiety', { fs: 9.5 }));
    return svg(W, H, s, 'Three theories of arousal and performance') + cap('Drive: straight line. Inverted-U: best at moderate arousal. Catastrophe: with high cognitive anxiety, a sudden drop past the optimum.'); },

  bandura: () => { const W = 580, H = 270; let s = '';
    [['Performance accomplishments', 'past success — strongest'], ['Vicarious experiences', 'seeing similar others succeed'], ['Verbal persuasion', 'encouragement'], ['Emotional arousal', 'interpreting and controlling nerves']].forEach(([a, b], i) => { const y = 40 + i * 60; s += node(130, y, 220, 44, a, A2, { sub: b, fs: 12.5 }) + arrow(242, y, 330, 135, MUT, 1.4); });
    s += node(400, 135, 130, 50, 'Self-efficacy', A2, { fill: 'var(--accent-soft)', fs: 14 }) + arrow(466, 135, 500, 135) + lines(540, 120, ['expectation', 'of success →', 'performance'], { fs: 11.5, c: INK });
    return svg(W, H, s, 'Bandura’s four sources of self-efficacy'); },

  /* ============ UNIT 1 · skill acquisition ============ */
  continua: () => { const W = 600, H = 300; let s = '';
    [['closed', 'open', .82], ['self-paced', 'externally paced', .75], ['simple', 'complex', .7], ['low organisation', 'high organisation', .35], ['discrete · serial', 'continuous', .12], ['fine', 'gross', .72]].forEach(([a, b, p], i) => { const y = 36 + i * 44; s += ln(150, y, 450, y, 'var(--line-2)', 4) + tx(140, y + 4, a, { a: 'end', fs: 12, c: INK }) + tx(460, y + 4, b, { fs: 12, c: INK }) + circ(150 + p * 300, y, 8, A3, 'var(--surface)', 2); });
    s += tx(300, 290, '● a netball pass placed on each continuum', { a: 'middle', fs: 11.5, c: A3 });
    return svg(W, H, s, 'Skill classification continua') + cap('Place skills on continua and justify — most skills have elements of both ends.'); },

  curves: () => { const W = 640, H = 200; let s = '';
    const panel = (x0, title, d) => box(x0, 16, 145, 140, 'var(--surface)', 'var(--line-2)', 10, 1) + arrow(x0 + 14, 140, x0 + 138, 140, INK, 1.2) + arrow(x0 + 14, 140, x0 + 14, 26, INK, 1.2) + pth(d, A3, 2.6) + tx(x0 + 72, 178, title, { a: 'middle', fs: 12.5, w: 700, c: INK });
    s += panel(10, 'Linear', 'M24,130 L130,40') + panel(170, 'Positive', 'M184,130 Q260,128 290,40') + panel(330, 'Negative', 'M344,130 Q360,40 450,36') + panel(490, 'Plateau', 'M504,130 Q530,80 560,78 L585,78 Q600,70 612,40');

  stacking: () => { const W = 540, H = 300; let s = '';

/* ---- diagramsG.js ---- */
/* ==========================================================
   GCSE diagrams (Stride · Eduqas GCSE PE). Added to DIAG; a few A level figures are replaced
   with GCSE wording (lever classes, plane/axis pairs, the nine named muscles).
   ========================================================== */
const gLab = (x, y, x2, y2, t, o = {}) => ln(x, y, x2, y2, MUT, 1) + dot(x, y, MUT, 2) + tx(x2 + (x2 > x ? 4 : -4), y2 + 4, t, { a: x2 > x ? 'start' : 'end', fs: o.fs || 12, c: o.c || INK, w: o.w });
Object.assign(DIAG, {
  golden: () => { const W = 560, H = 300; let s = '';
    const N = { sport: [280, 40], media: [100, 250], spons: [460, 250] };
    const two = (a, b, off, tr = 34) => { const [x1, y1] = N[a], [x2, y2] = N[b], L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy * off, ny = ux * off;
      return arrow(x1 + ux * tr + nx, y1 + uy * tr + ny, x2 - ux * tr + nx, y2 - uy * tr + ny, MUT, 1.6) + arrow(x2 - ux * tr - nx, y2 - uy * tr - ny, x1 + ux * tr - nx, y1 + uy * tr - ny, MUT, 1.6); };
    s += two('media', 'sport', 5) + two('spons', 'sport', 5) + two('media', 'spons', 5, 72);
    s += node(280, 40, 130, 40, 'SPORT', A5) + node(100, 250, 130, 40, 'MEDIA', A2) + node(460, 250, 130, 40, 'SPONSORS', A4);
    s += lines(160, 128, ['media pay for', 'broadcast rights;', 'sport gives content'], { fs: 11, a: 'end', c: INK }) + lines(400, 128, ['sponsors pay money;', 'gain exposure', 'and image'], { fs: 11, a: 'start', c: INK }) + tx(280, 234, 'advertising money', { a: 'middle', fs: 11, c: INK }) + tx(280, 276, 'audiences for adverts', { a: 'middle', fs: 11, c: INK });
    return svg(W, H, s, 'The golden triangle of sport, media and sponsorship') + cap('Each side depends on the others: bigger audiences bring more media and sponsorship money into sport.'); },

  veresponse: () => plot({ w: 560, h: 300, x: [0, 45], y: [0, 140], xt: [0, 5, 15, 25, 35, 45], xtl: ['', '0', '10', '20', '30', '40'], yt: [40, 80, 120], xl: 'time from start of exercise (min)', xlDy: 46, pb: 58, yl: 'minute ventilation (L/min)', label: 'Minute ventilation response to exercise',
    fns: [{ f: x => { const t = x - 5; return t < -1 ? 7 : t < 0 ? 7 + (t + 1) * 5 : t < 20 ? 12 + 50 * (1 - Math.exp(-t / 1.4)) : 7 + 55 * Math.exp(-(t - 20) / 3); }, c: A3, label: 'submaximal', lx: 12, ldy: 18 },
      { f: x => { const t = x - 5; return t < -1 ? 7 : t < 0 ? 7 + (t + 1) * 5 : t < 20 ? 12 + 40 * (1 - Math.exp(-t / 1.4)) + 3.4 * t : 7 + 113 * Math.exp(-(t - 20) / 4.5); }, c: A1, label: 'maximal', lx: 16, ldy: -10 }],
    vl: [{ x: 5, label: 'start', dy: 30 }, { x: 25, label: 'stop', dy: 30 }], text: [[32, 50, 'recovery: rapid,', { fs: 11 }], [32, 39, 'then slow', { fs: 11 }]],
    cap: 'Minute ventilation (tidal volume × breathing frequency) rises quickly at the start of exercise, levels off in submaximal work or keeps rising in maximal work, then falls quickly and then slowly in recovery.' }),

  hrresponse: () => plot({ w: 560, h: 300, x: [0, 45], y: [50, 210], xt: [0, 5, 15, 25, 35, 45], xtl: ['', '0', '10', '20', '30', '40'], yt: [60, 100, 140, 180], xl: 'time from start of exercise (min)', xlDy: 46, pb: 58, yl: 'heart rate (bpm)', label: 'Heart rate response to exercise',
    fns: [{ f: x => { const t = x - 5; return t < -2 ? 70 : t < 0 ? 70 + (t + 2) * 8 : t < 20 ? 86 + 64 * (1 - Math.exp(-t / 1.6)) : 70 + 80 * Math.exp(-(t - 20) / 3.5); }, c: A3, label: 'submaximal', lx: 14, ldy: 18 },
      { f: x => { const t = x - 5; return t < -2 ? 70 : t < 0 ? 70 + (t + 2) * 8 : t < 20 ? 86 + 110 * (1 - Math.exp(-t / 5)) : 70 + 125 * Math.exp(-(t - 20) / 5); }, c: A1, label: 'maximal', lx: 19, ldy: -10 }],
    vl: [{ x: 5, label: 'start', dy: 30 }, { x: 25, label: 'stop', dy: 30 }], text: [[32, 128, 'recovery: rapid,', { fs: 11 }], [32, 115, 'then slow', { fs: 11 }]],
    cap: 'Heart rate rises slightly before exercise (anticipatory rise, caused by adrenaline), increases rapidly, levels off (steady state) in submaximal work or keeps rising in maximal work, then falls quickly and then slowly in recovery.' }),

  synovial: () => { const W = 620, H = 300; let s = '';
    s += pth('M240,20 L240,110 Q300,150 360,110 L360,20', INK, 2, 'var(--surface-2)') + pth('M240,280 L240,180 Q300,150 360,180 L360,280', INK, 2, 'var(--surface-2)');
    s += pth('M243,108 Q300,146 357,108', 'var(--info)', 7) + pth('M243,182 Q300,152 357,182', 'var(--info)', 7);
    s += pth('M222,92 Q210,145 222,198 M378,92 Q390,145 378,198', A1, 3) + `<path d="M244,118 Q300,152 356,118 L356,172 Q300,154 244,172 Z" fill="var(--info)" fill-opacity=".14"/>`;
    s += pth('M230,70 L226,220 M370,70 L374,220', A4, 4, 'none', '2 5');
    s += gLab(340, 120, 430, 60, 'articular cartilage') + gLab(300, 145, 430, 140, 'synovial fluid') + gLab(385, 150, 430, 200, 'joint capsule / synovial membrane') + gLab(228, 210, 150, 240, 'ligament') + gLab(270, 40, 150, 40, 'bone');
    return svg(W, H, s, 'Structure of a synovial joint') + cap('Cartilage reduces friction and absorbs shock; synovial fluid lubricates the joint; ligaments join bone to bone and keep the joint stable; the capsule encloses the joint.'); },

  levers: () => { const W = 620, H = 250; let s = '';
    const panel = (x0, title, order, ex) => { const y = 110, L = 170; let p = ln(x0, y, x0 + L, y, INK, 5);
      const pos = { 1: { F: .5, E: .08, L: .92 }, 2: { F: .06, L: .5, E: .94 }, 3: { F: .06, E: .42, L: .94 } }[order];
      const fx = x0 + L * pos.F, ex_ = x0 + L * pos.E, lx = x0 + L * pos.L;
      p += `<polygon points="${fx},${y + 4} ${fx - 13},${y + 26} ${fx + 13},${y + 26}" fill="${A3}" fill-opacity=".25" stroke="${A3}" stroke-width="2"/>` + tx(fx, y + 42, 'F', { a: 'middle', c: A3, w: 700, fs: 13 });
      p += arrow(ex_, y + 50, ex_, y + 6, A1, 2.4) + tx(ex_, y + 64, 'E', { a: 'middle', c: A1, w: 700, fs: 13 });
      p += box(lx - 13, y - 30, 26, 26, 'var(--surface-2)', A2, 4, 2) + arrow(lx, y - 4, lx, y + 22, A2, 2) + tx(lx, y - 38, 'L', { a: 'middle', c: A2, w: 700, fs: 13 });
      p += tx(x0 + L / 2, 30, title, { a: 'middle', c: INK, w: 700, fs: 14 }) + tx(x0 + L / 2, 48, `${['', 'fulcrum', 'load', 'effort'][order]} in the middle`, { a: 'middle', fs: 11.5 }) + lines(x0 + L / 2, 200, ex, { fs: 11.5, c: INK });
      return p; };
    s += panel(20, 'First class', 1, ['neck: nodding (heading)', 'elbow extension (triceps)']) + panel(225, 'Second class', 2, ['ankle: rising onto the toes', 'mechanical advantage']) + panel(430, 'Third class', 3, ['elbow flexion, knee, hip, shoulder', 'speed and range; MA < 1']);
    return svg(W, H, s, 'Three classes of lever with fulcrum, effort and load') + cap('Remember “F-L-E, 1-2-3”: what is in the middle — Fulcrum (first class), Load (second class), Effort (third class).'); },

  planes: () => { const W = 620, H = 250; let s = '';
    const P = (x0, title, plane, axis, eg, col) => { let p = tx(x0 + 95, 22, title, { a: 'middle', c: INK, w: 700, fs: 14 }) + figure(x0 + 95, 40, 1, INK, { armsOut: plane === 'frontal', legsOut: plane === 'frontal' });
      if (plane === 'sagittal') p += `<rect x="${x0 + 93}" y="36" width="4" height="138" fill="${col}" fill-opacity=".45"/>` + ln(x0 + 40, 118, x0 + 150, 118, col, 2.4, '6 4') + tx(x0 + 152, 122, 'axis', { fs: 11, c: col });
      if (plane === 'frontal') p += `<rect x="${x0 + 40}" y="36" width="110" height="138" rx="6" fill="${col}" fill-opacity=".12" stroke="${col}"/>` + circ(x0 + 95, 118, 6, col, col) + tx(x0 + 105, 112, 'axis (into page)', { fs: 11, c: col });

/* wrap a string into lines of at most n characters */
function wrapTxt(t, n) { const out = []; let cur = ''; t.split(' ').forEach(w => { if ((cur + ' ' + w).trim().length > n) { out.push(cur.trim()); cur = w; } else cur += ' ' + w; }); if (cur.trim()) out.push(cur.trim()); return out; }

<p>These three words are linked but not the same — exam questions often test whether you can tell them apart.</p>
<div class="tbl"><table><tr><th>Term</th><th>Definition</th><th>Example</th></tr>
<tr><td><b>Health</b></td><td>A state of complete physical, mental and social well-being, and not merely the absence of disease or infirmity (World Health Organization).</td><td>A person can be free of illness but still be unhealthy if they are lonely and stressed.</td></tr>

<tr><td><b>Well-being</b></td><td>Feeling good and functioning well: being physically healthy, mentally positive and socially connected.</td><td>Enjoying a weekly park run with friends.</td></tr></table></div>
[[d:wellbeing]]
<div class="box why"><b class="lbl">The relationship</b><p>Exercise improves fitness, and fitness usually improves health. But they can be separate: an elite athlete can be very fit yet unhealthy (injured, ill or over-stressed), and someone can be healthy without being fit enough for a particular sport. Being ill or injured lowers fitness because you cannot train.</p></div>` },

<p>Regular physical activity benefits all three parts of health — and they affect each other. Feeling fitter (physical) raises self-esteem (mental), which makes it easier to join a club (social).</p>

    { h: 'Lifestyle choices and adherence', html: `
<p><b>Lifestyle choices</b> are the decisions people make about how they live: how active they are, what they eat, how much they sleep, and whether they smoke or drink alcohol. Good choices add to the benefits of exercise; poor choices (smoking, excess alcohol, a high-fat diet, too much screen time) cancel them out.</p>
<p><b>Adherence</b> means sticking to an exercise programme over a long period. Many people start and then stop.</p>
<div class="tbl"><table><tr><th>Helps adherence</th><th>Reduces adherence</th></tr>
<tr><td>Enjoyment — <b>intrinsic motivation</b></td><td>Boredom; activity feels like a chore</td></tr>
<tr><td>Friends and family who take part (social support)</td><td>Lack of time (work, school, caring)</td></tr>
<tr><td>Realistic, SMART goals and seeing progress</td><td>Unrealistic goals → failure → give up</td></tr>
<tr><td>Convenient, affordable facilities</td><td>Cost, travel, lack of access</td></tr>
<tr><td>Variety in training; the right level of challenge</td><td>Injury, illness, fatigue</td></tr></table></div>
<div class="box tip"><b class="lbl">Link to motivation (key area 4)</b><p>People who exercise because they enjoy it (intrinsic) usually adhere for longer than people who exercise only for rewards such as trophies or weight loss (extrinsic). Rewards can help beginners start — but enjoyment keeps them going.</p></div>` }

<p>A <b>sedentary lifestyle</b> is a way of life with little or no physical activity — long periods of sitting or lying, for example at a desk, in a car or in front of a screen. It is becoming more common because of desk jobs, cars, online entertainment and fewer people walking or cycling.</p>

    { h: 'Energy balance', html: `
<p>Energy is measured in <b>kilocalories (kcal)</b> or kilojoules. The <b>energy balance equation</b> compares energy taken in with energy used:</p>
<p style="text-align:center;font-weight:700">energy balance = energy in (food and drink) − energy out (basal metabolic rate + physical activity)</p>
[[d:energybal]]
<div class="tbl"><table><tr><th>Energy balance</th><th>Result</th><th>Who might want it</th></tr>
<tr><td><b>Positive</b> (in &gt; out)</td><td>weight gain</td><td>a rugby prop gaining muscle mass (with strength training)</td></tr>
<tr><td><b>Balanced</b> (in = out)</td><td>weight stays the same</td><td>most healthy adults; a footballer in season</td></tr>
<tr><td><b>Negative</b> (in &lt; out)</td><td>weight loss</td><td>an overweight person; a boxer making a weight category</td></tr></table></div>
<p>A typical guideline is about <b>2000 kcal/day for women</b> and <b>2500 kcal/day for men</b>; active people need more. Energy used depends on age, sex, body size and — most of all — how active you are.</p>` },
    { h: 'Nutrients and their functions', html: `
<div class="tbl"><table><tr><th>Nutrient</th><th>Main function</th><th>Sources</th><th>Use in sport</th></tr>
<tr><td><b>Carbohydrate</b></td><td>The main source of <b>energy</b>, especially for moderate–high intensity exercise. Stored as glycogen in muscles and liver.</td><td>pasta, rice, bread, potatoes, cereals</td><td>Endurance athletes eat extra before events (carbo-loading).</td></tr>
<tr><td><b>Protein</b></td><td><b>Growth and repair</b> of muscle and other tissues.</td><td>meat, fish, eggs, dairy, beans, nuts</td><td>Power athletes, and anyone recovering from hard training or injury.</td></tr>
<tr><td><b>Fat</b></td><td><b>Energy</b> for low-intensity, long-duration exercise; <b>insulation</b>; protects organs.</td><td>oils, butter, cheese, nuts, oily fish</td><td>Used during long, slow activity (a walk, a long-distance cycle at low intensity).</td></tr>
<tr><td><b>Vitamins</b></td><td>Keep the body healthy: e.g. vitamin C for the immune system, vitamin D for bone, B vitamins for energy release.</td><td>fruit, vegetables, dairy</td><td>Help recovery and prevent illness that would stop training.</td></tr>
<tr><td><b>Minerals</b></td><td>e.g. <b>calcium for bone growth</b> and strength; iron for red blood cells (oxygen transport).</td><td>dairy, green vegetables, red meat</td><td>Strong bones reduce fracture risk; iron helps endurance.</td></tr>
<tr><td><b>Water</b></td><td><b>Hydration</b>: keeps blood fluid, controls temperature through sweat, removes waste.</td><td>drinks, food</td><td>Replace sweat losses, especially in the heat.</td></tr>
<tr><td>Fibre</td><td>Healthy digestion; helps you feel full.</td><td>wholegrains, fruit, vegetables</td><td>Helps weight control.</td></tr></table></div>
<div class="box tip"><b class="lbl">Intensity decides the fuel</b><p>At <b>low intensity</b> (walking, jogging slowly) the body uses a mix with more <b>fat</b>. As intensity rises, <b>carbohydrate</b> becomes the main fuel. Protein is used for energy only when carbohydrate stores are very low — its job is repair.</p></div>

<p>During exercise we lose water through sweat and breathing. Losing about <b>2% of body mass</b> as fluid is enough to reduce performance.</p>
<div class="tbl"><table><tr><th>Dehydration (under-hydration)</th><th>Over-hydration (hyponatraemia)</th></tr>
<tr><td>Blood thickens (more viscous) → heart works harder; heart rate rises</td><td>Drinking far too much water dilutes the salt (sodium) in the blood</td></tr>
<tr><td>Body overheats — less sweat to cool down</td><td>Cells swell — headaches, confusion, nausea</td></tr>
<tr><td>Muscle cramps, fatigue, dizziness, headaches</td><td>In extreme cases seizures, coma, even death</td></tr>

    { h: 'The training methods', html: `
<div class="tbl"><table><tr><th>Method</th><th>What it involves</th><th>Develops</th><th>Suits</th></tr>
<tr><td><b>Continuous</b></td><td>Steady, moderate intensity exercise for at least 20–30 minutes without rest (running, cycling, swimming) in the aerobic zone (60–80% max HR).</td><td>Cardiovascular endurance, muscular endurance</td><td>Long-distance runners; beginners; health and weight loss</td></tr>
<tr><td><b>Interval</b></td><td>Periods of work followed by periods of rest or recovery, repeated. High-intensity work with short rest trains the anaerobic system; longer, lower-intensity work trains the aerobic system.</td><td>Speed, anaerobic and aerobic fitness</td><td>Sprinters, swimmers, games players</td></tr>
<tr><td><b>Fartlek</b> (“speed play”)</td><td>Continuous running with changes of speed and terrain — jogging, striding, sprinting, hills — with no rest.</td><td>Cardiovascular endurance and speed (aerobic and anaerobic)</td><td>Games players whose sport changes pace (football, hockey)</td></tr>
<tr><td><b>Circuit</b></td><td>A series of exercises (stations) done one after another with short rests; e.g. 30 s work, 30 s rest. Can be fitness-based or skill-based.</td><td>Muscular endurance, CV endurance, strength, skills — depends on stations</td><td>Almost anyone; groups; sport-specific circuits</td></tr>
<tr><td><b>Weight training</b></td><td>Resistance from free weights or machines, in sets and reps. <b>Strength</b>: heavy loads, few reps (e.g. 3 sets of 3–6 reps at 80%+ of 1RM). <b>Muscular endurance</b>: light loads, many reps (e.g. 3 × 15–20 at 50–60%).</td><td>Strength, muscular endurance, power</td><td>Rugby players, throwers; anyone, with correct technique</td></tr>
<tr><td><b>Plyometrics</b></td><td>Explosive jumping, bounding and hopping (e.g. box jumps, depth jumps). The muscle stretches (eccentric) then immediately contracts powerfully (concentric).</td><td>Power</td><td>Jumpers, sprinters, basketball and volleyball players</td></tr></table></div>
<div class="box warn"><b class="lbl">Correct technique</b><p>Every method should be taught with correct technique — e.g. a straight back when lifting, landing softly with bent knees in plyometrics, and a spotter for heavy lifts — to prevent injury and make training effective.</p></div>` },
    { h: 'Flexibility training', html: `
<div class="tbl"><table><tr><th>Type</th><th>How</th><th>Example</th></tr>
<tr><td><b>Active stretching</b></td><td>You stretch a muscle by contracting the opposite muscle and holding the position, with no outside help.</td><td>Holding the leg up in front (quadriceps working to stretch the hamstrings).</td></tr>
<tr><td><b>Passive stretching</b></td><td>An outside force — a partner, a wall, gravity or a band — moves the limb further and holds it.</td><td>A partner pushing a straight leg up to stretch the hamstrings.</td></tr>
<tr><td><b>Dynamic stretching</b></td><td>Moving a joint through its full range in a controlled, sport-like movement.</td><td>Leg swings, walking lunges, arm circles — ideal in a warm-up.</td></tr>

<tr><td><b>Overload</b></td><td>Working harder than normal to force the body to adapt. Achieved by increasing <b>F</b>requency, <b>I</b>ntensity or <b>T</b>ime (duration) — the FIT principle.</td><td>Run 3 → 4 times a week (F); faster pace (I); 20 → 30 minutes (T).</td></tr>

<div class="box why"><b class="lbl">Progression and overload work together</b><p>Overload makes the body adapt; progression keeps applying overload as the body gets fitter. Without progression, a session that was overload in week 1 is just maintenance by week 4. Also remember <b>rest</b> and <b>recovery</b>: adaptations happen during rest — and stopping training causes <b>reversibility</b> (fitness is lost).</p></div>` },

<p>The heart is a muscular pump with four chambers: two <b>atria</b> at the top (receive blood) and two <b>ventricles</b> below (pump blood out). The right side deals with <b>deoxygenated</b> blood; the left side with <b>oxygenated</b> blood. The left ventricle has the thickest wall because it pumps blood all round the body.</p>

<tr><td>Fuel</td><td>creatine phosphate stored in muscles</td><td>glucose (glycogen) without oxygen</td></tr>
<tr><td>Duration</td><td>up to about <b>8–10 seconds</b></td><td>about 10 seconds to <b>1–2 minutes</b></td></tr>

<div class="box good"><b class="lbl">Benefits</b><p>Increases confidence and motivation; controls anxiety and nerves; improves concentration and focus; helps the performer get “in the zone”; prepares the muscles and nervous system; useful when injured (practice without physical stress). Works best for closed, self-paced skills and for experienced performers who know what success looks and feels like.</p></div>` },

<div class="tbl"><table><tr><th>Characteristic</th><th>Meaning</th></tr>
<tr><td><b>Technique</b></td><td>Correct, well-co-ordinated movements</td></tr>
<tr><td><b>Consistency</b></td><td>Able to repeat the skill to a high standard time after time</td></tr>
<tr><td><b>Accuracy</b></td><td>Achieves the intended target (e.g. a pass to a team-mate’s feet)</td></tr>
<tr><td><b>Efficiency</b></td><td>No wasted energy or unnecessary movement; looks effortless</td></tr>

<tr><td><b>Control</b></td><td>Movements are controlled, even under pressure</td></tr>
<tr><td><b>Aesthetics</b></td><td>The movement looks good / pleasing to watch</td></tr></table></div>
<p>A skilled performance is <b>learned</b>, with a pre-determined outcome, achieved with maximum certainty and minimum time and energy. Compare an expert’s smooth, consistent tennis serve with a beginner’s.</p>` },
    { h: 'Classification continua', html: `
[[d:continua]]
<div class="tbl"><table><tr><th>Continuum</th><th>One end</th><th>Other end</th></tr>
<tr><td><b>Basic – complex</b></td><td><b>Basic</b>: simple, few decisions, little information to process, easy to learn (e.g. running, a simple chest pass)</td><td><b>Complex</b>: many decisions, lots of information, high co-ordination (e.g. a tennis serve, a somersault with a twist, a rugby pass under pressure)</td></tr>
<tr><td><b>Open – closed</b></td><td><b>Open</b>: environment changes all the time; performer must adapt and make decisions (e.g. a pass in a football match)</td><td><b>Closed</b>: stable environment, not affected by others; same each time (e.g. a free throw, a golf putt, a gymnastics vault)</td></tr>

<p>Skills are placed on a <b>continuum</b> (a line) rather than in a box, because most skills have features of both ends. Always <b>justify</b> the placement.</p>
