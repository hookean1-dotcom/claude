/* ---- gens.js ---- */
/* ==========================================================
   Numerical question generators — PE maths: fitness data, physiology and biomechanics.
   Each returns { q, ans, unit, steps[] } with fresh values; answers are computed so every
   question is self-consistent. Answers within 2% are accepted by the checker. g = 9.8 N/kg.
   ========================================================== */
const GEN = {};
const GEN_FLAGS = {};
const s3 = x => sf(x, 3);
const r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100;
const pk = a => a[Math.floor(Math.random() * a.length)];
const G = 9.8;

/* ---------- Data handling ---------- */
const TESTS = [['multi-stage fitness test level', 6, 13, 0.1, ''], ['vertical jump', 30, 65, 1, 'cm'], ['sit and reach', 5, 35, 1, 'cm'], ['30 m sprint', 3.9, 5.2, 0.01, 's'], ['handgrip strength', 25, 60, 1, 'kg'], ['1 minute press-up test', 15, 55, 1, 'reps'], ['VO₂max', 35, 65, 0.5, 'ml/kg/min']];
GEN.pctchange = () => { const [n, lo, hi, st, u] = pk(TESTS), a = rnd(lo, hi, st), b = +(a * (1 + (n.includes('sprint') ? -rnd(2, 8, 0.5) : rnd(3, 20, 1)) / 100)).toFixed(st < 0.1 ? 2 : st < 1 ? 1 : 0), pc = (b - a) / a * 100;
  return { q: `An athlete’s ${n} changes from ${a}${u ? ' ' + u : ''} to ${b}${u ? ' ' + u : ''} after training. Calculate the percentage change (use a negative value for a decrease).`, ans: pc, unit: '%', steps: ['% change = (new − old) ÷ old × 100', `= (${b} − ${a}) ÷ ${a} × 100`, `= ${r1(pc)}%`] }; };
GEN.mean1 = () => { const [n, lo, hi, st, u] = pk(TESTS), xs = Array.from({ length: pk([3, 4, 5]) }, () => rnd(lo, hi, st)), m = xs.reduce((a, b) => a + b, 0) / xs.length;
  return { q: `An athlete completes ${xs.length} trials of the ${n}: ${xs.join(', ')}${u ? ' ' + u : ''}. Calculate the mean.`, ans: m, unit: u || '', steps: [`sum = ${r2(xs.reduce((a, b) => a + b, 0))}`, `mean = sum ÷ ${xs.length} = ${r2(m)}`] }; };
GEN.partdata = () => { const pop = rnd(800, 4000, 50), p = rnd(0.2, 0.65, 0.01), n = Math.round(pop * p), pc = n / pop * 100;
  const who = pk(['pupils in a school', 'adults in a town survey', 'girls aged 11–16 in a region', 'members of a leisure centre']);
  return { q: `In a survey of ${pop} ${who}, ${n} took part in sport three or more times a week. Calculate the participation rate.`, ans: pc, unit: '%', steps: ['rate = participants ÷ total × 100', `= ${n} ÷ ${pop} × 100 = ${r1(pc)}%`] }; };
GEN.unitconv = () => { const t = pk(['kmh', 'ml', 'min', 'rev']);
  if (t === 'kmh') { const k = rnd(10, 72, 1); return { q: `Convert ${k} km/h to m/s.`, ans: k / 3.6, unit: 'm/s', steps: ['m/s = km/h ÷ 3.6', `${k} ÷ 3.6 = ${r2(k / 3.6)} m/s`] }; }
  if (t === 'ml') { const m = rnd(60, 180, 5), hr = rnd(60, 190, 1); return { q: `Stroke volume is ${m} ml and heart rate is ${hr} bpm. Give the cardiac output in L/min.`, ans: m * hr / 1000, unit: 'L/min', steps: [`Q = HR × SV = ${hr} × ${m} = ${m * hr} ml/min`, `÷ 1000 = ${r2(m * hr / 1000)} L/min`] }; }
  if (t === 'min') { const mm = rnd(1, 4, 1), ss = rnd(0, 59, 1), d = pk([400, 800, 1500]); const tt = mm * 60 + ss; return { q: `An athlete runs ${d} m in ${mm} min ${ss} s. Calculate the average speed.`, ans: d / tt, unit: 'm/s', steps: [`time = ${mm} × 60 + ${ss} = ${tt} s`, `speed = ${d} ÷ ${tt} = ${r2(d / tt)} m/s`] }; }
  const r = rnd(0.5, 4, 0.5), t2 = rnd(0.6, 2.5, 0.1), w = r * 2 * Math.PI / t2; return { q: `A skater completes ${r} revolutions in ${t2} s. Calculate the average angular velocity in rad/s.`, ans: w, unit: 'rad/s', steps: [`θ = ${r} × 2π = ${r2(r * 2 * Math.PI)} rad`, `ω = θ ÷ t = ${r2(w)} rad/s`] }; };

/* ---------- Levers ---------- */
GEN.lever1 = () => { const ea = rnd(2, 12, 0.5), la = rnd(ea < 6 ? 20 : 3, 40, 1), ma = ea / la;
  return { q: `A lever has an effort arm of ${ea} cm and a load arm of ${la} cm. Calculate the mechanical advantage.`, ans: ma, unit: '', steps: ['MA = effort arm ÷ load arm', `= ${ea} ÷ ${la} = ${r2(ma)}`, ma > 1 ? 'MA > 1: mechanical advantage (as in a 2nd-order lever)' : 'MA < 1: mechanical disadvantage (as in a 3rd-order lever) — gains speed and range'] }; };

/* ---------- Heart rate and training zones ---------- */
GEN.maxhr = () => { const age = rnd(14, 60, 1); return { q: `Estimate the maximum heart rate of a ${age}-year-old using 220 − age.`, ans: 220 - age, unit: 'bpm', steps: [`HRmax = 220 − ${age} = ${220 - age} bpm`] }; };
GEN.karvonen = () => { const age = rnd(15, 45, 1), rest = rnd(48, 78, 1), pc = pk([60, 65, 70, 75, 80, 85]), mx = 220 - age, thr = rest + pc / 100 * (mx - rest);
  return { q: `A ${age}-year-old has a resting heart rate of ${rest} bpm. Using the Karvonen formula, calculate the training heart rate at ${pc}% intensity.`, ans: thr, unit: 'bpm', steps: [`HRmax = 220 − ${age} = ${mx}`, `HR reserve = ${mx} − ${rest} = ${mx - rest}`, `THR = ${rest} + ${pc / 100} × ${mx - rest} = ${r1(thr)} bpm`] }; };
GEN.wr1 = () => { const w = pk([10, 15, 20, 30, 45, 60, 90]), r = w * pk([0.5, 1, 2, 3, 5]);
  return { q: `An interval session uses ${w} s of work and ${r} s of recovery. Express the work : rest ratio as 1 : x — find x.`, ans: r / w, unit: '', steps: [`ratio = ${w} : ${r}`, `divide by ${w}: 1 : ${r2(r / w)}`] }; };
GEN.rm1 = () => { const rm = rnd(40, 180, 5), pc = pk([50, 60, 70, 75, 80, 85, 90]), load = rm * pc / 100, goal = pc >= 85 ? 'maximum strength' : pc >= 70 ? 'hypertrophy' : 'muscular endurance';
  return { q: `An athlete’s one-rep max (1RM) for squats is ${rm} kg. Calculate the load for sets at ${pc}% of 1RM.`, ans: load, unit: 'kg', steps: [`load = ${pc}% × ${rm} = ${r1(load)} kg`, `${pc}% of 1RM suits ${goal} training`] }; };

/* ---------- Energy systems and VO2 ---------- */
GEN.pcrecover = () => { const t = pk([30, 60, 90, 120, 180]), pc = { 30: 50, 60: 75, 90: 87, 120: 93, 180: 98 }[t];
  return { q: `PC stores recover about ${pc}% after ${t} s of rest. A sprinter’s PC stores were depleted by 80 mmol/kg. Estimate how much PC (mmol/kg) has been restored after ${t} s.`, ans: 80 * pc / 100, unit: 'mmol/kg', steps: [`restored = ${pc}% × 80 = ${r1(80 * pc / 100)} mmol/kg`, 'full restoration takes about 2–3 minutes'] }; };
GEN.vo2rel = () => { const abs = rnd(2.4, 5.2, 0.1), kg = rnd(50, 95, 1), rel = abs * 1000 / kg;
  return { q: `An athlete’s absolute VO₂max is ${abs} L/min and body mass is ${kg} kg. Calculate the relative VO₂max in ml/kg/min.`, ans: rel, unit: 'ml/kg/min', steps: [`${abs} L/min = ${Math.round(abs * 1000)} ml/min`, `relative = ${Math.round(abs * 1000)} ÷ ${kg} = ${r1(rel)} ml/kg/min`] }; };

/* ---------- Nutrition and hydration ---------- */
GEN.dehyd = () => { const m = rnd(50, 100, 0.5), loss = rnd(0.4, 2.5, 0.1), pc = loss / m * 100;
  return { q: `A player weighs ${m} kg before training and ${r1(m - loss)} kg after. Calculate the percentage of body mass lost.`, ans: pc, unit: '%', steps: [`mass lost = ${loss} kg`, `% = ${loss} ÷ ${m} × 100 = ${r2(pc)}%`, pc >= 2 ? 'at or above 2% — performance is likely to be impaired' : 'below 2%, but still rehydrate'] }; };
GEN.rehyd = () => { const loss = rnd(0.3, 2.8, 0.1); return { q: `An athlete loses ${loss} kg of body mass through sweat. How much fluid should she drink to rehydrate (use 1.5 L per kg lost)?`, ans: loss * 1.5, unit: 'L', steps: [`fluid = 1.5 × ${loss} = ${r2(loss * 1.5)} L`] }; };
GEN.energybal = () => { const c = rnd(250, 700, 10), f = rnd(60, 140, 5), p = rnd(80, 200, 5), E = c * 17 + f * 37 + p * 17;
  return { q: `An endurance athlete eats ${c} g carbohydrate, ${f} g fat and ${p} g protein in a day. Calculate her energy intake in kJ (17, 37 and 17 kJ/g).`, ans: E, unit: 'kJ', steps: [`carbohydrate ${c} × 17 = ${c * 17}`, `fat ${f} × 37 = ${f * 37}`, `protein ${p} × 17 = ${p * 17}`, `total = ${E} kJ`] }; };
GEN.carbneed = () => { const kg = rnd(50, 95, 1), gk = pk([5, 6, 7, 8, 10]); return { q: `An athlete of ${kg} kg in ${gk >= 8 ? 'heavy endurance' : 'moderate'} training needs ${gk} g of carbohydrate per kg per day. Calculate the daily carbohydrate requirement.`, ans: kg * gk, unit: 'g', steps: [`${kg} × ${gk} = ${kg * gk} g`] }; };
GEN.creatine = () => { const kg = rnd(55, 110, 1), dose = 0.3, d = kg * dose; return { q: `A creatine loading phase uses 0.3 g per kg of body mass per day. Calculate the daily dose for a ${kg} kg rugby player.`, ans: d, unit: 'g', steps: [`${kg} × 0.3 = ${r1(d)} g per day (split into several doses)`] }; };
GEN.caffeine = () => { const kg = rnd(50, 95, 1), mg = pk([3, 4, 5, 6]); return { q: `A cyclist of ${kg} kg plans ${mg} mg of caffeine per kg of body mass. Calculate the dose in mg.`, ans: kg * mg, unit: 'mg', steps: [`${kg} × ${mg} = ${kg * mg} mg`] }; };
GEN.carbload = () => { const kg = rnd(50, 90, 1), gk = pk([8, 9, 10, 12]), days = pk([2, 3]); return { q: `During carbo-loading a ${kg} kg marathon runner eats ${gk} g of carbohydrate per kg per day for ${days} days. Calculate the total carbohydrate eaten over the loading phase.`, ans: kg * gk * days, unit: 'g', steps: [`per day ${kg} × ${gk} = ${kg * gk} g`, `× ${days} days = ${kg * gk * days} g`] }; };

/* ---------- Cardiovascular and respiratory ---------- */
GEN.cardout = () => { const hr = rnd(55, 195, 1), sv = rnd(60, 190, 5), q = hr * sv / 1000;
  return { q: `Calculate cardiac output when heart rate is ${hr} bpm and stroke volume is ${sv} ml.`, ans: q, unit: 'L/min', steps: ['Q = HR × SV', `= ${hr} × ${sv} = ${hr * sv} ml/min`, `= ${r2(q)} L/min`] }; };
GEN.svcalc = () => { const hr = rnd(50, 190, 1), sv = rnd(60, 180, 5), q = r2(hr * sv / 1000), ml = Math.round(q * 1000);
  return { q: `An athlete’s cardiac output is ${q} L/min at a heart rate of ${hr} bpm. Calculate the stroke volume in ml.`, ans: ml / hr, unit: 'ml', steps: ['SV = Q ÷ HR', `= ${ml} ml/min ÷ ${hr}`, `≈ ${r1(ml / hr)} ml`] }; };
GEN.hrcalc = () => { const sv = rnd(70, 180, 5), qv = rnd(4.5, 30, 0.5), hr = qv * 1000 / sv;
  return { q: `Cardiac output is ${qv} L/min and stroke volume is ${sv} ml. Calculate the heart rate.`, ans: hr, unit: 'bpm', steps: ['HR = Q ÷ SV', `= ${Math.round(qv * 1000)} ÷ ${sv} = ${r1(hr)} bpm`] }; };
GEN.shuntcalc = () => { const q = pk([5, 15, 20, 25, 30]), pc = q <= 5 ? rnd(15, 22, 1) : rnd(70, 88, 1), v = q * pc / 100;
  return { q: `Cardiac output is ${q} L/min and ${pc}% goes to skeletal muscle. Calculate the blood flow to the muscles.`, ans: v, unit: 'L/min', steps: [`${pc}% × ${q} = ${r2(v)} L/min`] }; };
GEN.bpcalc = () => { const q = rnd(5, 25, 0.5), r = rnd(3, 20, 0.5), bp = q * r; return { q: `Using BP = Q × R, calculate blood pressure (arbitrary units) when cardiac output is ${q} L/min and resistance is ${r} units.`, ans: bp, unit: 'units', steps: [`BP = ${q} × ${r} = ${r1(bp)}`] }; };
GEN.vecalc = () => { const tv = rnd(0.5, 3, 0.1), f = rnd(12, 55, 1), ve = tv * f; return { q: `Calculate minute ventilation when tidal volume is ${tv} L and breathing frequency is ${f} breaths/min.`, ans: ve, unit: 'L/min', steps: ['V_E = TV × f', `= ${tv} × ${f} = ${r1(ve)} L/min`] }; };
GEN.tvcalc = () => { const tv = rnd(0.5, 3, 0.1), f = rnd(12, 55, 1), ve = +(tv * f).toFixed(1); return { q: `Minute ventilation is ${ve} L/min and breathing frequency is ${f} breaths/min. Calculate tidal volume.`, ans: ve / f, unit: 'L', steps: ['TV = V_E ÷ f', `= ${ve} ÷ ${f} = ${r2(ve / f)} L`] }; };
GEN.efcalc = () => { const edv = rnd(100, 200, 5), sv = Math.round(edv * rnd(0.5, 0.85, 0.01)), ef = sv / edv * 100;
  return { q: `The left ventricle holds ${edv} ml at the end of diastole and ejects ${sv} ml. Calculate the ejection fraction.`, ans: ef, unit: '%', steps: ['EF = SV ÷ EDV × 100', `= ${sv} ÷ ${edv} × 100 = ${r1(ef)}%`] }; };
GEN.bradycalc = () => { const q = rnd(4.6, 5.4, 0.1), sv = rnd(80, 130, 5), hr = q * 1000 / sv;
  return { q: `After training, an athlete’s resting stroke volume is ${sv} ml and resting cardiac output is ${q} L/min. Calculate her resting heart rate.`, ans: hr, unit: 'bpm', steps: [`HR = ${Math.round(q * 1000)} ÷ ${sv} = ${r1(hr)} bpm`, hr < 60 ? 'below 60 bpm — bradycardia' : 'above 60 bpm'] }; };

/* ---------- Biomechanics ---------- */
GEN.fma = () => { const t = pk(['F', 'a', 'm']), m = rnd(0.4, 110, 0.1), a = rnd(0.5, 12, 0.1), F = m * a;
  if (t === 'F') return { q: `A ${m} kg ${m < 5 ? 'ball' : 'athlete'} accelerates at ${a} m/s². Calculate the net force.`, ans: F, unit: 'N', steps: ['F = ma', `= ${m} × ${a} = ${r1(F)} N`] };
  if (t === 'a') return { q: `A net force of ${r1(F)} N acts on a ${m} kg ${m < 5 ? 'ball' : 'athlete'}. Calculate the acceleration.`, ans: r1(F) / m, unit: 'm/s²', steps: ['a = F ÷ m', `= ${r1(F)} ÷ ${m} = ${r2(r1(F) / m)} m/s²`] };
  return { q: `A net force of ${r1(F)} N gives an acceleration of ${a} m/s². Calculate the mass.`, ans: r1(F) / a, unit: 'kg', steps: ['m = F ÷ a', `= ${r1(F)} ÷ ${a} = ${r2(r1(F) / a)} kg`] }; };
GEN.weight = () => { const m = rnd(45, 130, 0.5); return { q: `Calculate the weight of a ${m} kg athlete (g = 9.8 N/kg).`, ans: m * G, unit: 'N', steps: ['W = mg', `= ${m} × 9.8 = ${r1(m * G)} N`] }; };
GEN.momentum = () => { const m = rnd(0.06, 120, 0.01), v = rnd(1, 40, 0.5), obj = m < 1 ? 'ball' : m < 10 ? 'shot' : 'player';
  return { q: `Calculate the momentum of a ${r2(m)} kg ${obj} moving at ${v} m/s.`, ans: r2(m) * v, unit: 'kg m/s', steps: ['p = mv', `= ${r2(m)} × ${v} = ${r2(r2(m) * v)} kg m/s`] }; };
GEN.impulse = () => { const m = rnd(0.05, 0.45, 0.01), u = 0, v = rnd(15, 45, 1), I = m * (v - u);
  return { q: `A ${m} kg ball is struck from rest and leaves at ${v} m/s. Calculate the impulse applied.`, ans: I, unit: 'N s', steps: ['impulse = change in momentum = m(v − u)', `= ${m} × (${v} − 0) = ${r2(I)} N s`] }; };
GEN.impforce = () => { const m = rnd(60, 110, 1), v = rnd(3, 9, 0.5), t = rnd(0.2, 0.8, 0.05), F = m * v / t;
  return { q: `A ${m} kg player running at ${v} m/s is stopped in a tackle lasting ${t} s. Calculate the average force needed.`, ans: F, unit: 'N', steps: [`change in momentum = ${m} × ${v} = ${m * v} kg m/s`, `F = impulse ÷ t = ${m * v} ÷ ${t} = ${r1(F)} N`] }; };
GEN.friction = () => { const mu = rnd(0.3, 1.2, 0.05), m = rnd(50, 100, 1), R = m * G, F = mu * R;
  return { q: `A ${m} kg sprinter stands on a track. The coefficient of friction between spikes and track is ${mu}. Calculate the maximum friction force (R = weight, g = 9.8 N/kg).`, ans: F, unit: 'N', steps: [`R = mg = ${m} × 9.8 = ${r1(R)} N`, `F = μR = ${mu} × ${r1(R)} = ${r1(F)} N`] }; };

const CV = {

  rrect(c, x, y, w, h, r, fill, stroke, lw = 1.5) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } },

  raf = requestAnimationFrame(loop);
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}

SIMS.notation = DS('Notational analysis: code the match', 'Events from a netball centre’s quarter appear in the feed. Tap the matching button as fast as you can. At the end, compare your tally with the true record — this is <b>inter-observer reliability</b>, and it shows why live coding is harder than it looks.', body => {

  const next = () => { if (i >= 24) return finish(); cur = pick([0, 0, 0, 0, 1, 2, 3, 4]); log.push(cur); i++; draw(); clearTimeout(tm); tm = setTimeout(next, speed); };
  const draw = () => { body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="pill">Event ${i} / 24</span>${dsSelect('ns-sp', 'Speed', [[1800, 'slow'], [1400, 'match pace'], [900, 'fast']], speed)}</div>

  init(st) { let seed = 7; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280; st.f = Array.from({ length: 260 }, () => ({ a: r() * Math.PI * 2, d: Math.sqrt(r()), u: r(), v: r() })); },
  types(st) { const pI = st.p.pI / 100, rest = 1 - pI; return st.f.map(f => f.u < pI ? 0 : f.u < pI + rest * 0.55 ? 1 : 2); },

    const x0 = cx + R + 50; ['Type I · slow oxidative', 'Type IIa · fast oxidative glycolytic', 'Type IIb · fast glycolytic'].forEach((n, i) => { CV.circle(c, x0, 60 + i * 30, 7, col[i]); CV.text(c, n, x0 + 16, 60 + i * 30, C.ink, 12.5); });

  },

};

/* ---- 1.6 Interval session designer ---- */
SIMS.interval = DS('Interval session designer', 'Set the work time, intensity, recovery and reps. The tool estimates the predominant energy system and checks whether the recovery suits it — the way you should justify a session in an exam answer.', body => {
  body.innerHTML = `<div class="grid g2">${dsRange('iv-w', 'Work period', 5, 300, 5, 10, ' s')}${dsRange('iv-i', 'Intensity', 50, 100, 5, 95, '%')}${dsRange('iv-r', 'Recovery', 10, 300, 10, 60, ' s')}${dsRange('iv-n', 'Repetitions', 2, 20, 1, 8, '')}</div><div id="iv-out" style="margin-top:12px"></div>`;
  dsWire(body, () => { const w = val(body, 'iv-w'), i = val(body, 'iv-i'), r = val(body, 'iv-r'), n = val(body, 'iv-n');
    const sys = w <= 10 && i >= 90 ? 'ATP-PC' : w <= 120 && i >= 75 ? 'anaerobic glycolysis (lactic acid)' : 'aerobic', ratio = r / w;
    const ok = sys === 'ATP-PC' ? ratio >= 5 : sys.startsWith('anaerobic') ? ratio >= 1.5 && ratio <= 4 : ratio <= 1.5;
    const advice = sys === 'ATP-PC' ? (ok ? 'Recovery long enough for PC to be largely restored (≈ 2–3 min for full recovery).' : 'Recovery too short: PC will not restore, so later reps become lactic. Aim for at least 1:5.') : sys.startsWith('anaerobic') ? (ok ? 'Good: incomplete recovery trains lactate tolerance and buffering.' : ratio < 1.5 ? 'Very short recovery — the session will drift aerobic/fatigue quickly. Try 1:2–1:3.' : 'Recovery is long; fine for quality, but less lactate tolerance stress.') : (ok ? 'Short recoveries keep heart rate in the aerobic zone.' : 'Long rests for aerobic work — reduce recovery to about 1:1.');
    const tot = (w + r) * n; let bars = ''; for (let k = 0; k < n; k++) bars += `<i style="display:inline-block;height:28px;width:${w / tot * 100}%;background:var(--a1);opacity:${i / 100}"></i><i style="display:inline-block;height:28px;width:${r / tot * 100}%;background:var(--line)"></i>`;
    $('#iv-out', body).innerHTML = `<div style="border-radius:8px;overflow:hidden;white-space:nowrap;font-size:0">${bars}</div><div class="tbl" style="margin-top:10px"><table><tr><td>Work : rest</td><td class="mono">1 : ${ratio.toFixed(1)}</td></tr><tr><td>Predominant system</td><td><b>${sys}</b></td></tr><tr><td>Session time</td><td class="mono">${Math.floor(tot / 60)} min ${tot % 60} s</td></tr></table></div><div class="box ${ok ? 'good' : 'warn'}"><b class="lbl">${ok ? 'Well designed' : 'Check the recovery'}</b><p>${advice}</p></div>`; });
});

/* ---- 1.7 Periodisation planner ---- */
SIMS.periodise = DS('Periodisation planner', 'Move the main competition and see how the training year is organised into phases. Add a second peak for double periodisation (e.g. indoor and outdoor seasons).', body => {
  body.innerHTML = `<div class="grid g2">${dsRange('pz-p', 'Main competition (week)', 20, 48, 1, 38, '')}${dsRange('pz-q', 'Second peak (week, 0 = none)', 0, 30, 1, 0, '')}</div><div id="pz-o"></div>`;
  dsWire(body, () => { const pk1 = val(body, 'pz-p'), pk2 = val(body, 'pz-q'), W = 620, X = w => 20 + w / 52 * 580; let s = '';
    const phases = []; const addPeak = (p, lenPrep) => { phases.push(['General prep', Math.max(0, p - lenPrep), p - Math.round(lenPrep * 0.45), 'var(--a3)'], ['Specific prep', p - Math.round(lenPrep * 0.45), p - 4, 'var(--a3)'], ['Competition + taper', p - 4, p + 1, 'var(--a1)']); };
    if (pk2 && pk2 < pk1 - 10) { addPeak(pk2, Math.min(pk2, 16)); addPeak(pk1, Math.min(pk1 - pk2 - 2, 14)); } else addPeak(pk1, Math.min(pk1, 26));
    phases.push(['Transition', pk1 + 1, 52, 'var(--a2)']);
    phases.forEach(([n, a, b, c]) => { if (b > a) s += `<rect x="${X(a)}" y="120" width="${X(b) - X(a) - 1}" height="30" rx="4" fill="${c}" fill-opacity=".3"/><text x="${(X(a) + X(b)) / 2}" y="140" font-size="10.5" text-anchor="middle" fill="var(--ink)">${b - a > 4 ? n : ''}</text>`; });
    [pk1, pk2].filter(Boolean).forEach(p => s += `<line x1="${X(p)}" y1="30" x2="${X(p)}" y2="160" stroke="var(--a1)" stroke-width="2" stroke-dasharray="4 3"/><text x="${X(p)}" y="24" font-size="11" text-anchor="middle" fill="var(--a1)">peak wk ${p}</text>`);
    let vol = '', inten = ''; for (let w = 0; w <= 52; w++) { const d1 = Math.min(...[pk1, pk2].filter(Boolean).map(p => Math.abs(w - p))); const I = 0.35 + 0.6 * Math.exp(-d1 / 7), V = w > pk1 ? 0.3 : 0.9 - 0.55 * Math.exp(-d1 / 6); vol += (w ? 'L' : 'M') + X(w) + ',' + (110 - V * 70); inten += (w ? 'L' : 'M') + X(w) + ',' + (110 - I * 70); }
    s += `<path d="${vol}" fill="none" stroke="var(--a3)" stroke-width="2.4"/><path d="${inten}" fill="none" stroke="var(--a1)" stroke-width="2.4"/><text x="24" y="44" font-size="11" fill="var(--a3)">volume</text><text x="24" y="58" font-size="11" fill="var(--a1)">intensity</text>`;
    for (let w = 0; w <= 52; w += 4) s += `<text x="${X(w)}" y="172" font-size="10" text-anchor="middle" fill="var(--muted)">${w}</text>`;
    $('#pz-o', body).innerHTML = `<svg viewBox="0 0 ${W} 180" width="100%" style="max-width:100%">${s}</svg><p class="small muted">Each coloured block is a mesocycle; each week is a microcycle; the whole year is the macrocycle. Volume falls and intensity rises into each peak; the taper cuts volume in the last 1–3 weeks.</p>`; });
});

  readouts: ['O₂ partial pressure at altitude', 'Red cell mass change', 'Effect at sea level', 'Drawback to watch'],

  calc(p) { const pO2 = 21.2 * Math.exp(-p.alt / 8400), stim = clamp((p.alt - 1200) / 1800, 0, 1.3), gain = 9 * stim * (1 - Math.exp(-p.days / 14)), now = gain * Math.exp(-p.back / 21); return { pO2, gain, now }; },
  draw(c, W, H, st, C) { const r = this.calc(st.p), x0 = 60, bw = W - 120;
    CV.text(c, 'Partial pressure of O₂ (kPa)', x0, 36, C.muted, 12); CV.rrect(c, x0, 46, bw, 16, 8, C.line); CV.rrect(c, x0, 46, bw * r.pO2 / 21.2, 16, 8, C.info); CV.text(c, r.pO2.toFixed(1) + ' kPa (sea level 21.2)', x0 + 6, 76, C.ink, 12);
    CV.text(c, 'Red blood cell mass: gain at the end of the camp', x0, 116, C.muted, 12); CV.rrect(c, x0, 126, bw, 16, 8, C.line); CV.rrect(c, x0, 126, bw * r.gain / 12, 16, 8, C.a1); CV.text(c, '+' + r.gain.toFixed(1) + '%', x0 + 6, 156, C.ink, 12);
    CV.text(c, 'Remaining benefit at sea level now', x0, 196, C.muted, 12); CV.rrect(c, x0, 206, bw, 16, 8, C.line); CV.rrect(c, x0, 206, bw * r.now / 12, 16, 8, C.a3); CV.text(c, '+' + r.now.toFixed(1) + '% red cell mass', x0 + 6, 236, C.ink, 12);
    let d = ''; for (let k = 0; k <= 42; k++) { const v = r.gain * Math.exp(-k / 21), x = x0 + k / 42 * bw, y = H - 30 - v / 12 * 60; d += (k ? 'L' : 'M') + x + ',' + y; } c.strokeStyle = C.a3; c.lineWidth = 2; c.stroke(new Path2D(d)); CV.circle(c, x0 + st.p.back / 42 * bw, H - 30 - r.now / 12 * 60, 5, C.a3); CV.text(c, 'days after return →', x0 + bw, H - 16, C.muted, 11, 'right');
  },
  read(st) { const r = this.calc(st.p); return [r.pO2.toFixed(1) + ' kPa', '+' + r.gain.toFixed(1) + '%', r.now > 3 ? 'meaningful O₂-carrying boost' : r.now > 1 ? 'small boost' : 'little or none left', st.p.alt > 3000 ? 'altitude sickness; much lower training intensity' : st.p.alt > 1800 ? 'lower training intensity; dehydration' : 'altitude too low for a strong stimulus']; }

SIMS.energy = {
  title: 'Energy systems through a race', h: 360,
  controls: [{ id: 'I', label: 'Intensity (% of maximum)', min: 40, max: 100, step: 5, value: 100, fmt: v => v + '%' }, { id: 'T', label: 'Time into exercise (s)', min: 1, max: 180, step: 1, value: 8 }],

  note: 'Press play to run the clock. All three systems contribute all the time; intensity is the main factor deciding which predominates. (Illustrative model.)',
  share(t, I) { const i = I / 100, pc = Math.exp(-Math.pow(t / 10, 2)) * i * i, gl = (1 - Math.exp(-t / 15)) * Math.exp(-t / 90) * i * i * i * 1.2, ae = (1 - Math.exp(-t / 25)) * (1.1 - 0.6 * i) + 0.05, s = pc + gl + ae; return [pc / s, gl / s, ae / s]; },

    CV.text(c, '% of energy', b.x - 6, b.y - 14, C.muted, 11);

  title: 'Glycaemic index: blood glucose after eating', h: 340, noPlay: true,
  controls: [{ type: 'seg', id: 'a', label: 'Food A', value: 0, options: GI_FOODS.slice(0, 6).map((f, i) => [i, f[0]]) }, { type: 'seg', id: 'b', label: 'Food B', value: 9, options: GI_FOODS.slice(6).map((f, i) => [i + 6, f[0]]) }],
  readouts: ['Food A (GI)', 'Food B (GI)', 'Best before competition', 'Best straight after'],
  note: 'High GI (≥ 70) raises blood glucose quickly and can cause a rebound dip; low GI (≤ 55) releases glucose slowly and steadily — ideal 2–4 hours before competition. (Illustrative curves.)',

/* ---- 3.18 Memory: chunking test ---- */
SIMS.memory = DS('Memory span and chunking', 'A sequence of set-play calls flashes up. Recall it. Then try the same length grouped into chunks — the STM holds about 7 ± 2 items, but chunks count as single items.', body => {
  const CALLS = ['cross', 'loop', 'switch', 'post', 'drive', 'skip', 'screen', 'dummy', 'wrap', 'blitz'];
  let round = 0, seq = [], res = [];
  const start = () => { const n = 5 + round * 2, chunk = round >= 2; seq = shuffle(CALLS.concat(CALLS)).slice(0, n); const shown = chunk ? seq.map((w, i) => w + ((i + 1) % 3 === 0 && i < n - 1 ? ' | ' : ' · ')).join('') : seq.join(' · ');
    body.innerHTML = `<div class="card" style="text-align:center;font:700 22px var(--f-mono);padding:22px">${shown}</div><p class="small muted">Memorise… (${chunk ? 'grouped in threes' : 'no grouping'})</p>`;
    setTimeout(() => { if (!document.body.contains(body)) return; body.innerHTML = `<p>Type the calls in order, separated by spaces.</p><input id="mm-in" class="ds-sel" autocomplete="off"><div class="row" style="margin-top:8px"><button class="btn primary" id="mm-go">Check</button></div>`; $('#mm-in', body).focus(); $('#mm-go', body).onclick = check; }, 2600 + n * 500); };
  const check = () => { const ans = $('#mm-in', body).value.trim().toLowerCase().split(/[\s,·|]+/).filter(Boolean); let k = 0; while (k < seq.length && ans[k] === seq[k]) k++; res.push([seq.length, k, round >= 2]); round++;
    body.innerHTML = `<div class="tbl"><table><tr><th>Sequence length</th><th>Correct in order</th><th>Grouped?</th></tr>${res.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2] ? 'yes' : 'no'}</td></tr>`).join('')}</table></div>${round < 4 ? `<button class="btn primary" id="mm-next">Next sequence</button>` : `<p class="small">Most people recall about 7 ± 2 items; grouping (chunking) and meaningful calls help. Coaches chunk set plays into one call word.</p><button class="btn" id="mm-next">Start again</button>`}`;
    $('#mm-next', body).onclick = () => { if (round >= 4) { round = 0; res = []; } start(); }; };
  body.innerHTML = '<button class="btn primary" id="mm-s">Start</button>'; $('#mm-s', body).onclick = start;
});

/* ---- 3.19 Reaction time test (Hick's law) ---- */
SIMS.reaction = DS('Reaction time test: Hick’s law', 'Measure your own simple and choice reaction times. When a coloured target lights up, press the matching key (or tap it) as fast as you can. Five trials per condition; the graph plots your mean against the number of choices.', body => {
  const KEYS = ['f', 'j', 'd', 'k'], COLS = ['var(--a1)', 'var(--a3)', 'var(--a2)', 'var(--a4)'];
  let n = 1, trial = 0, t0 = 0, target = -1, times = {}, tm = null, waiting = false;
  const pads = () => `<div class="row" style="justify-content:center;gap:12px;margin:18px 0">${Array.from({ length: n }, (_, i) => `<button class="btn" data-p="${i}" style="width:84px;height:84px;border-radius:16px;font:800 20px var(--f-display);${i === target ? `background:${COLS[i]};color:#fff;border-color:${COLS[i]}` : ''}">${KEYS[i].toUpperCase()}</button>`).join('')}</div>`;
  const draw = msg => { body.innerHTML = `<div class="row" style="justify-content:space-between"><span class="pill">${n} choice${n > 1 ? 's' : ''} · trial ${Math.min(trial + 1, 5)}/5</span><span class="small muted">${msg || ''}</span></div>${pads()}${chart()}`;
    $$('[data-p]', body).forEach(b => b.onpointerdown = () => press(+b.dataset.p)); };
  const chart = () => { const ks = [1, 2, 4].filter(k => times[k]?.length); if (!ks.length) return ''; const pts = ks.map(k => [k, times[k].reduce((a, b) => a + b, 0) / times[k].length]);
    return `<div class="tbl"><table><tr><th>Choices</th><th>Mean reaction time</th></tr>${pts.map(p => `<tr><td>${p[0]}</td><td class="mono">${Math.round(p[1])} ms</td></tr>`).join('')}</table></div>`; };
  const arm = () => { target = -1; waiting = true; draw('wait for a target…'); clearTimeout(tm); tm = setTimeout(() => { target = Math.floor(Math.random() * n); t0 = performance.now(); waiting = false; draw('GO!'); }, 900 + Math.random() * 1800); };
  const press = i => { if (waiting) { clearTimeout(tm); draw('Too early! Wait for the colour.'); setTimeout(arm, 900); return; } if (target < 0) return; const rt = performance.now() - t0; if (i !== target) { draw('Wrong target — try again.'); setTimeout(arm, 900); return; }
    (times[n] ??= []).push(rt); trial++; target = -1; sfx.tick();
    if (trial >= 5) { trial = 0; n = n === 1 ? 2 : n === 2 ? 4 : 0; if (!n) { finish(); return; } draw(`Next: ${n} choices`); setTimeout(arm, 1200); } else { draw(Math.round(rt) + ' ms'); setTimeout(arm, 700); } };
  const key = e => { if (!document.body.contains(body)) { removeEventListener('keydown', key); return; } const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0 && n && i < n) press(i); };
  const finish = () => { const m = k => times[k].reduce((a, b) => a + b, 0) / times[k].length; body.innerHTML = `${chart()}<p>Your choice reaction time rose from <b>${Math.round(m(1))} ms</b> (1 choice) to <b>${Math.round(m(4))} ms</b> (4 choices) — Hick’s law. Attackers create more choices (disguise) to slow defenders; defenders anticipate to reduce them.</p><button class="btn primary" id="rt-again">Test again</button>`; $('#rt-again', body).onclick = () => { n = 1; trial = 0; times = {}; arm(); }; };
  addEventListener('keydown', key);
  body.innerHTML = `<p>Use keys <b>F</b>, <b>J</b>, <b>D</b>, <b>K</b> or tap the pads. Don’t anticipate — an early press restarts the trial.</p><button class="btn primary" id="rt-go">Start</button>`; $('#rt-go', body).onclick = arm;
  return () => { clearTimeout(tm); removeEventListener('keydown', key); };
});

/* ---- 3.19 PRP ---- */
SIMS.prp = {
  title: 'The psychological refractory period', h: 300, noPlay: true,
  controls: [{ id: 'gap', label: 'Gap between dummy and real move (ms)', min: 0, max: 600, step: 10, value: 120 }, { id: 'proc', label: 'Defender’s processing time for S1 (ms)', min: 150, max: 350, step: 10, value: 220 }],
  readouts: ['Response to S2 starts at', 'PRP delay', 'Outcome', 'Why'],
  note: 'Single-channel hypothesis: the defender cannot start processing the real move (S2) until the dummy (S1) has been processed. A gap shorter than the processing time adds a delay — the PRP.',
  draw(c, W, H, st, C) { const g = st.p.gap, p = st.p.proc, delay = Math.max(0, p - g), sc = (W - 80) / 900, X = t => 40 + t * sc;
    CV.line(c, 40, H - 50, W - 40, H - 50, C.ink, 1.4); [0, 200, 400, 600, 800].forEach(t => CV.text(c, t + ' ms', X(t), H - 34, C.muted, 11, 'center'));
    CV.rrect(c, X(0), 70, p * sc, 30, 6, hexA(C.a2, .4)); CV.text(c, 'processing S1 (dummy)', X(0) + 6, 85, C.ink, 12);
    if (delay) { CV.rrect(c, X(g), 120, delay * sc, 30, 6, hexA(C.a4, .5)); CV.text(c, 'PRP', X(g) + 4, 135, C.ink, 12, 'left', 700); }
    CV.rrect(c, X(g + delay), 120, 220 * sc, 30, 6, hexA(C.a1, .4)); CV.text(c, 'processing S2', X(g + delay) + 6, 135, C.ink, 12);
    CV.arrow(c, X(g), 40, X(g), 118, C.a1, 2); CV.text(c, 'S2 real move', X(g), 30, C.a1, 12, 'center', 700); },
  read(st) { const g = st.p.gap, p = st.p.proc, delay = Math.max(0, p - g); return [(g + delay + 220) + ' ms', delay + ' ms', delay > 60 ? 'attacker gets past' : 'defender reacts in time', delay ? 'S2 arrived before S1 was processed' : 'gap too long — the dummy was “read”']; }
};

SIMS.energyG = {
  title: 'Which energy system? Intensity and duration', h: 340,
  controls: [{ id: 'I', label: 'Intensity (% of maximum)', min: 40, max: 100, step: 5, value: 100, fmt: v => v + '%' }, { id: 'T', label: 'Time into exercise (s)', min: 1, max: 180, step: 1, value: 6 }],
  readouts: ['Creatine phosphate', 'Lactic acid system', 'Aerobic', 'Main system'],
  note: 'Press play to run the clock. All systems work together; intensity and duration decide which is the main one. (Illustrative model.)',
  share(t, I) { const i = I / 100, pc = Math.exp(-Math.pow(t / 10, 2)) * i * i, gl = (1 - Math.exp(-t / 15)) * Math.exp(-t / 90) * i * i * i * 1.2, ae = (1 - Math.exp(-t / 25)) * (1.1 - 0.6 * i) + 0.05, s = pc + gl + ae; return [pc / s, gl / s, ae / s]; },
  step(st, dt) { st.p.T = st.p.T >= 180 ? 1 : Math.min(180, st.p.T + dt * 12); const inp = document.getElementById('sc-energyG-T'); if (inp) { inp.value = Math.round(st.p.T); inp.style.setProperty('--p', (st.p.T / 180 * 100) + '%'); inp.previousElementSibling.querySelector('output').textContent = Math.round(st.p.T); } },
  init(st) { st.run = false; },
  draw(c, W, H, st, C) { const b = { x: 54, y: 24, w: W - 80, h: H - 84 }, cols = [C.a1, C.a4, C.a3], X = t => b.x + t / 180 * b.w, Y = v => b.y + b.h - v * b.h;
    CV.rrect(c, b.x - 8, b.y - 8, b.w + 16, b.h + 26, 8, C.surface, C.line, 1);
    for (let t = 1; t <= 180; t += 1) { const sh = this.share(t, st.p.I); let acc = 0; sh.forEach((v, k) => { c.fillStyle = hexA(cols[k], .72); c.fillRect(X(t - 1), Y(acc + v), X(t) - X(t - 1) + .6, v * b.h); acc += v; }); }
    CV.line(c, X(st.p.T), b.y - 4, X(st.p.T), b.y + b.h + 4, C.ink, 2.5); CV.text(c, 'time (s) →', b.x + b.w, b.y + b.h + 14, C.muted, 11, 'right');
    ['creatine phosphate', 'lactic acid', 'aerobic'].forEach((n, k) => { CV.rrect(c, b.x + k * 150, H - 26, 12, 12, 3, cols[k]); CV.text(c, n, b.x + 18 + k * 150, H - 20, C.ink, 12); }); },
  read(st) { const s = this.share(st.p.T, st.p.I), k = s.indexOf(Math.max(...s)); return [...s.map(x => Math.round(x * 100) + '%'), ['creatine phosphate', 'lactic acid', 'aerobic'][k]]; }
};

    ${dsRange('sm-r', 'How big is the improvement? (realistic)', 1, 40, 1, 4, '%')}</div><div id="sm-o"></div></div>`;
  const chk = () => { const s = $('#sm-s', body).value.trim(), m = $('#sm-m', body).value.trim(), a = $('#sm-a', body).value.trim(), t = $('#sm-t', body).value.trim(), r = val(body, 'sm-r');

SIMS.classifyG = DS('Classify a skill on the continua', 'Choose a skill and drag the sliders to place it on each continuum. Then check against a model answer.', body => {

function drawGameArt(cv, id) {

function mountGame(host, id) {
  let alive = true, timer = null; const stop = () => { alive = false; clearInterval(timer); };
  const hud = (items) => `<div class="game-hud">${items.map(([k, v]) => `<div class="hud"><span>${k}</span><b>${v}</b></div>`).join('')}<span class="spacer"></span><a class="btn sm" href="#/arcade">${ICON.back} Arcade</a></div>`;
  const endScreen = (score, extra = '') => { const nb = gameBest(id, score); if (score > 0) addXP(Math.min(60, Math.round(score / 2)), GAMES[id].title); if (nb && score > 0) { burst(); sfx.win(); }
    host.innerHTML = `<div class="game"><div class="card result"><div class="eyebrow">${GAMES[id].title}</div><div class="big">${score}</div><p class="lede" style="margin:8px auto">${nb ? 'New personal best!' : 'Personal best: ' + S.games[id].best}</p>${extra}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-again>Play again</button><a class="btn" href="#/arcade">Back to arcade</a></div></div></div>`;
    $('[data-again]', host).onclick = () => { stop(); cleanup = mountGame(host, id); }; };
  let cleanup = stop;

  if (id === 'muscle' || id === 'plane' || id === 'tests') {
    const bank = id === 'muscle' ? MUSCLE_BANK : id === 'plane' ? PLANE_BANK : TEST_BANK, total = 60;
    let score = 0, streak = 0, left = total, cur = null, answered = 0, right = 0;
    const next = () => { const item = pick(bank); const seen = new Set([item[1]]), others = shuffle(bank.filter(b => b[1] !== item[1])).filter(b => !seen.has(b[1]) && seen.add(b[1])).slice(0, 3); cur = { item, opts: shuffle([item, ...others]) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Streak', streak], ['Time', Math.ceil(left) + 's']])}<div class="timer"><i style="width:${left / total * 100}%"></i></div>
        <div class="eyebrow" style="text-align:center">${id === 'muscle' ? 'Which muscle is the agonist?' : id === 'plane' ? 'Which plane and axis?' : 'Which component of fitness?'}</div><div class="big-prompt">${esc(cur.item[0])}</div>
        <div class="opts">${cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o[1])}</span></button>`).join('')}</div><p class="kbd-hint">Keys 1–4 to answer.</p></div>`;
      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => { if (!alive) return; answered++; const ok = cur.opts[i] === cur.item; const btn = $$('.opt', host)[i]; if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btn.classList.add('right'); } else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btn.classList.add('wrong'); $$('.opt', host)[cur.opts.indexOf(cur.item)].classList.add('right'); } setTimeout(() => alive && left > 0 && next(), ok ? 250 : 900); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= 4 && !$('.opt.right', host)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();
    return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'reaction') {
    let n = 0, times = [], t0 = 0, armed = false, tm = null;
    const render = (msg, go) => { host.innerHTML = `<div class="game">${hud([['Trial', Math.min(n + 1, 10) + '/10'], ['Mean', times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) + ' ms' : '—']])}<button id="rt-pad" class="card" style="display:block;width:100%;height:220px;border-radius:20px;font:800 34px var(--f-display);text-transform:uppercase;cursor:pointer;background:${go ? 'var(--a5)' : 'var(--surface-2)'};color:${go ? '#fff' : 'var(--ink)'}">${msg}</button><p class="kbd-hint">Tap the pad or press Space when it turns orange.</p></div>`; $('#rt-pad', host).onpointerdown = hit; };
    const arm = () => { armed = false; render('Wait…'); clearTimeout(tm); tm = setTimeout(() => { if (!alive) return; armed = true; t0 = performance.now(); render('Go!', true); }, 1000 + Math.random() * 2200); };
    const hit = () => { if (!armed) { clearTimeout(tm); render('Too early!'); sfx.bad(); setTimeout(() => alive && arm(), 900); return; } const rt = performance.now() - t0; armed = false; times.push(rt); n++; sfx.good();
      if (n >= 10) { const m = times.reduce((a, b) => a + b, 0) / times.length; removeEventListener('keydown', key); endScreen(Math.max(0, Math.round(600 - m)), `<p class="muted">Mean simple reaction time ${Math.round(m)} ms (score = 600 − mean). The ruler drop test measures the same component; choice reactions (several possible stimuli) are slower.</p>`); } else { render(Math.round(rt) + ' ms'); setTimeout(() => alive && arm(), 800); } };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.code === 'Space') { e.preventDefault(); hit(); } };
    addEventListener('keydown', key); arm();
    return () => { stop(); clearTimeout(tm); removeEventListener('keydown', key); };
  }

  if (id === 'blitz') {
    const pool = allTopics().flatMap(t => V_(t).quiz.map(q => ({ q, t }))); let score = 0, lives = 3, cur;
    const next = () => { const { q, t } = pick(pool); const truth = Math.random() < 0.5; const opt = truth ? q.o[0] : pick(q.o.slice(1)); cur = { q, t, truth, opt }; render(); };
    const render = () => { host.innerHTML = `<div class="game">${hud([['Score', score], ['Lives', '♥'.repeat(lives) || '0']])}<div class="card"><div class="eyebrow">${cur.t.id} · ${esc(cur.t.title)}</div><p class="q-text">${rich(cur.q.q)}</p><div class="box def" style="font-size:17px"><b class="lbl">Proposed answer</b><p>${rich(cur.opt)}</p></div>
      <div class="row" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn primary" data-a="1" style="min-width:130px">True <kbd>T</kbd></button><button class="btn" data-a="0" style="min-width:130px">False <kbd>F</kbd></button></div><div id="bz-fb"></div></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => answer(b.dataset.a === '1')); };
    const answer = a => { if ($('#bz-fb', host).innerHTML) return; const ok = a === cur.truth; ok ? (score += 10, sfx.good()) : (lives--, sfx.bad());
      $('#bz-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</b> ${cur.truth ? 'That answer is right.' : 'The correct answer is: ' + rich(cur.q.o[0])} ${cur.q.x ? '<br><span class="muted">' + rich(cur.q.x) + '</span>' : ''}</div>`;
      setTimeout(() => { if (!alive) return; lives > 0 ? next() : endScreen(score); }, ok ? 900 : 2600); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 't' || e.key === 'T') answer(true); if (e.key === 'f' || e.key === 'F') answer(false); };
    addEventListener('keydown', key); next(); return () => { stop(); removeEventListener('keydown', key); };
  }
  return stop;
}

function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, v = V_(t);

    </article>

      <div class="card flat" style="padding:16px"><div class="eyebrow">Specification checklist · ${esc(t.ref)}</div><p class="small muted" style="margin:6px 0 10px">Rate your confidence: red, amber, green.</p><div class="spec-list">${v.spec.map(([sp, i]) => `<div class="spec-item"><div class="rag" data-i="${i}">${[1, 2, 3].map(val => `<button data-v="${val}" class="${s.spec[i] === val ? 'on' : ''}" aria-label="${['Not confident', 'Getting there', 'Confident'][val - 1]}: ${esc(specTxt(sp))}"></button>`).join('')}</div><span>${tagHTML(specFlag(sp), 1)}${rich(esc(specTxt(sp)))}</span></div>`).join('')}</div></div>
      <a class="btn primary" href="#/t/${t.id}/quiz">Test yourself ${ICON.arrow}</a></aside></div>`;

  /* ---------- Flashcards (Leitner boxes) ---------- */
  function cardsTab(host, t) {
    const s = T(t.id), idxs = t.cards.map((c, i) => i).filter(i => inScope(t.cards[i][2] || '')); let queue = shuffle(idxs).sort((a, b) => (s.cards[a] || 0) - (s.cards[b] || 0)), pos = 0, flipped = false, reviewed = 0;
    const render = () => {
      const i = queue[pos], box = s.cards[i] || 0, counts = [0, 1, 2, 3, 4, 5].map(b => idxs.filter(j => (s.cards[j] || 0) === b).length);
      if (pos >= queue.length) { host.innerHTML = `<div class="card result"><div class="eyebrow">Session complete</div><div class="big">${reviewed}</div><p class="lede" style="margin:8px auto">cards reviewed. Known (box 3+): ${idxs.filter(j => s.cards[j] >= 3).length}/${idxs.length}</p><button class="btn primary" id="again">Review again</button></div>`; $('#again').onclick = () => cardsTab(host, t); return; }
      host.innerHTML = `<div class="fc-stage"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow">Card ${pos + 1} of ${queue.length}</span><span class="pill">Box ${box || 'new'}</span></div>
        <div class="fc ${flipped ? 'flip' : ''}" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="front"><span class="eyebrow">Question ${tagHTML(t.cards[i][2] || '', 1)}</span><div>${rich(t.cards[i][0])}</div></div><div class="back"><span class="eyebrow">Answer</span><div>${rich(t.cards[i][1])}</div></div></div>
        <div class="fc-ctl">${flipped ? `<button class="btn" data-r="0" style="border-color:var(--bad);color:var(--bad)">Again <kbd>1</kbd></button><button class="btn" data-r="1">Hard <kbd>2</kbd></button><button class="btn" data-r="2" style="border-color:var(--good);color:var(--good)">Good <kbd>3</kbd></button><button class="btn" data-r="3">Easy <kbd>4</kbd></button>` : `<button class="btn primary" id="flip">Show answer <kbd>Space</kbd></button>`}</div>
        <div class="boxes">${counts.map((n, b) => `<span>${b ? 'Box ' + b : 'New'}: ${n}</span>`).join('')}</div></div>`;
      $('#fc').onclick = () => { flipped = !flipped; sfx.flip(); render(); };
      $('#flip') && ($('#flip').onclick = () => { flipped = true; sfx.flip(); render(); });
      $$('[data-r]', host).forEach(b => b.onclick = () => rate(+b.dataset.r));
    };
    const rate = r => { const i = queue[pos], b = s.cards[i] || 0; s.cards[i] = r === 0 ? 1 : r === 1 ? Math.max(1, b) : r === 2 ? Math.min(5, b + 1) : Math.min(5, b + 2); if (r === 0) queue.push(i); reviewed++; S.stats.cardsSeen++; save(); addXP(2); pos++; flipped = false; render(); };
    const key = e => { if (!document.body.contains(host) || !$('#fc')) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipped = !flipped; render(); } else if (flipped && '1234'.includes(e.key)) rate(+e.key - 1); };
    addEventListener('keydown', key); cleanup = () => removeEventListener('keydown', key);
    render();
  }

  /* ---------- Quiz engine (also used by mock exam & daily challenge) ---------- */
  function runQuiz(host, items, o = {}) {
    const exam = o.mode === 'exam';
    const qs = items.map(it => it.type === 'num' ? it : { ...it, type: 'mcq', order: shuffle(it.o.map((_, i) => i)) });
    let i = 0, res = [], t0 = Date.now(), tick = null;
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${q.topic}</a>` : ''}${o.timeLimit ? '<span class="pill warn mono" id="qtimer"></span>' : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : exam ? 'cur' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.type === 'num' ? q.q : q.q)}</div>
        ${q.type === 'mcq' ? `<div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p>`
          : `<div class="calc-in"><input id="numin" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5e-3" aria-label="Your answer"><span class="unit">${q.unit || ''}</span><button class="btn primary" id="numgo">Submit</button></div><p class="kbd-hint">Give your answer to 2–3 significant figures (answers within 2% are accepted).</p>`}
        <div id="fb"></div>`;
      if (q.type === 'mcq') $$('.opt', host).forEach(b => b.onclick = () => answer(+b.dataset.k));
      else { const inp = $('#numin'); inp.focus(); $('#numgo').onclick = () => answer(inp.value); inp.onkeydown = e => { if (e.key === 'Enter') answer(inp.value); }; }
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i) return;
      let ok, given;
      if (q.type === 'mcq') { ok = q.order[k] === 0; given = k; } else { const v = parseNum(k); if (!isFinite(v)) { toast('Enter a number, e.g. 3.2e-5'); return; } ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * (q.tol || 0.02) + 1e-12; given = v; }
      res.push({ ok, given, q }); (ok ? sfx.good : sfx.bad)();
      if (exam) { i++; render(); return; }
      if (q.type === 'mcq') { $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); }); }
      else { $('#numin').disabled = true; $('#numgo').disabled = true; }
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${q.type === 'num' ? `Answer: <b>${fmtAns(q.ans)}</b> ${q.unit}<div class="steps"><b class="small">Solution</b><ol>${q.steps.map(x => `<li>${rich(x)}</li>`).join('')}</ol></div>` : rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      clearInterval(tick); removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100), secs = Math.round((Date.now() - t0) / 1000);
      if (p === 100) { burst(); sfx.win(); }
      const byTopic = {}; res.forEach(r => { const k = r.q.topic || '—'; byTopic[k] ??= [0, 0]; byTopic[k][1]++; if (r.ok) byTopic[k][0]++; });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete · ${Math.floor(secs / 60)}m ${secs % 60}s</div><div class="big">${p}%</div><p class="lede" style="margin:6px auto 0">${correct} of ${qs.length} correct${p >= 80 ? ' — excellent.' : p >= 50 ? ' — good progress.' : ' — revisit the notes and try again.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>
        ${Object.keys(byTopic).length > 1 ? `<div class="sec"><div class="eyebrow">By topic</div><div class="grid gauto" style="margin-top:10px">${Object.entries(byTopic).map(([k, [a, b]]) => `<a class="tcard" href="#/t/${k}" style="--uc:${TOPIC[k] ? ucol(TOPIC[k].unit) : 'var(--accent)'}"><span class="no" style="font-size:22px">${k}</span><span class="tt">${TOPIC[k] ? esc(TOPIC[k].title) : ''}</span><span class="ts">${a}/${b} correct</span></a>`).join('')}</div></div>` : ''}
        <div class="sec"><div class="eyebrow">Review</div>${res.map((r, j) => `<div class="explain" style="margin-top:10px"><b class="v ${r.ok ? 'good' : 'bad'}">${j + 1}. ${r.ok ? '✓' : '✗'}</b> ${rich(r.q.q)}<div class="small" style="margin-top:6px">${r.q.type === 'mcq' ? `<b>Answer:</b> ${rich(r.q.o[0])}${r.ok ? '' : ` · <span style="color:var(--bad)">you chose: ${rich(r.q.o[r.q.order[r.given]])}</span>`}${r.q.x ? `<br><span class="muted">${rich(r.q.x)}</span>` : ''}` : `<b>Answer:</b> ${fmtAns(r.q.ans)} ${r.q.unit} · you gave ${r.given == null ? '—' : fmtAns(r.given)}`}</div></div>`).join('')}</div>`;
      $('#retry').onclick = () => { o.retry ? o.retry() : runQuiz(host, items, o); };
      S.stats.quizzes++; if (p === 100) S.stats.perfect++; save();
      o.onDone && o.onDone({ correct, total: qs.length, p, res });
      checkBadges();
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const q = qs[i]; if (!q) return;
      if (res.length > i && e.key === 'Enter') { $('#nextq')?.click(); return; }
      if (q.type === 'mcq' && res.length <= i) { const k = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (k != null && k < q.o.length) answer(k); } };
    addEventListener('keydown', key);
    if (o.timeLimit) { const end = Date.now() + o.timeLimit * 1000; tick = setInterval(() => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = $('#qtimer'); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (!document.body.contains(host)) clearInterval(tick); if (left <= 0) { while (res.length < qs.length) res.push({ ok: false, given: null, q: qs[res.length] }); i = qs.length; finish(); } }, 500); }
    const prevCleanup = cleanup; cleanup = () => { clearInterval(tick); removeEventListener('keydown', key); prevCleanup && prevCleanup(); };
    render();
  }

  function calcTab(host, t) {

      const q = GEN[pick(V_(t).gens)]();
      host.innerHTML = `<div class="quiz-wrap"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow">Unlimited calculation practice · new values every time</span><span class="pill good">${s.calc || 0} correct · streak ${streak}</span></div>
        <div class="card"><div class="calc-q">${rich(q.q)}</div><div class="calc-in"><input id="cin" inputmode="decimal" autocomplete="off" placeholder="your answer" aria-label="Your answer"><span class="unit">${q.unit}</span><button class="btn primary" id="cgo">Check</button><button class="btn ghost" id="cshow">Show solution</button></div><p class="kbd-hint">Answers within 2% are accepted. Use e-notation for powers of ten (e.g. 3.0e8). Take g = 9.8 N/kg unless told otherwise.</p><div id="cfb"></div></div></div>`;
      const inp = $('#cin'); inp.focus();

      const check = () => { const v = parseNum(inp.value); if (!isFinite(v)) { toast('Enter a number, e.g. 2.4e-3'); return; } const ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * 0.02 + 1e-12; if (ok) { s.calc = (s.calc || 0) + 1; S.stats.calcOK++; streak++; save(); addXP(15, 'Calculation correct'); sfx.good(); if (streak % 5 === 0) burst(); } else { streak = 0; sfx.bad(); } s.calcN = (s.calcN || 0) + 1; save(); reveal(ok); };
      $('#cgo').onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); }; $('#cshow').onclick = () => { streak = 0; reveal(null); };

  /* ---------- Structured exam questions (topic tab, bank and papers) ----------
     A question is {q, m, ms} or {q (stem), parts:[{q, m, ms, lv?}]}. Parts with lv:true are extended answers marked in
     bands: ms is then indicative content, and the learner awards a mark using WJEC-style band descriptors. */
  const QTAGS = { short: 'Short answer', struct: 'Structured', ext: 'Extended (levels)', data: 'Data response', graph: 'Graphs', calc: 'Calculation', synoptic: 'Synoptic', nea: 'NEA practice' };
  const qParts = q => q.parts || [{ q: '', m: q.m, ms: q.ms, lv: q.lv }];
  const qMarks = q => qParts(q).reduce((a, p) => a + p.m, 0);
  const qTag = q => q.tag || (qParts(q).some(p => p.lv) ? 'ext' : q.parts ? 'struct' : 'short');
  const BANDS = { 4: [[3, 4], [2, 2], [1, 1]], 5: [[4, 5], [2, 3], [1, 1]], 6: [[5, 6], [3, 4], [1, 2]], 7: [[6, 7], [3, 5], [1, 2]], 8: [[7, 8], [4, 6], [1, 3]], 9: [[7, 9], [4, 6], [1, 3]], 10: [[8, 10], [4, 7], [1, 3]] };
  const BAND_TXT = ['Detailed, accurate knowledge applied consistently to the context; thorough analysis and evaluation that weighs both sides; a supported conclusion; accurate specialist terms; well structured.',
    'Sound knowledge with some application; some analysis or evaluation, but one-sided or undeveloped; a conclusion that is not fully supported; some specialist terms.',
    'Limited knowledge, mostly descriptive; little application, analysis or evaluation; few specialist terms; limited structure.'];
  function partHTML(p, j, multi) {
    p = { ...p, q: String(p.q || '').replace(/\s*\[\d+\]\s*$/, '') };
    const lab = multi ? `<span class="pl">(${'abcdefgh'[j]})</span>` : '';
    const box = `<textarea rows="${p.m >= 6 ? 7 : p.m >= 3 ? 3 : 2}" aria-label="Your answer"></textarea>`;
    if (p.lv) { const b = BANDS[p.m] || BANDS[8];
      return `<div class="xq-part" data-m="${p.m}" data-lv="1"><div>${lab}${rich(p.q)} <b class="mono">[${p.m}]</b> <span class="tag qt sm">levels-marked</span></div>${box}
        <div class="ms" hidden><div class="eyebrow" style="margin-bottom:4px">Indicative content — tick what you covered (a guide, not a checklist)</div>${p.ms.map(x => `<label><input type="checkbox" data-ic> <span>${rich(x)}</span></label>`).join('')}
        <div class="eyebrow" style="margin:12px 0 2px">Choose the band that best fits, then the mark</div><div class="bands">${b.map((r, k) => `<button type="button" data-band="${k}" data-lo="${r[0]}" data-hi="${r[1]}"><b>Band ${3 - k} · ${r[0]}–${r[1]}</b><span>${BAND_TXT[k]}</span></button>`).join('')}</div>
        <div class="mk-pick">${Array.from({ length: p.m + 1 }, (_, k) => `<button type="button" data-mk="${k}">${k}</button>`).join('')}</div></div></div>`; }
    return `<div class="xq-part" data-m="${p.m}"><div>${lab}${rich(p.q)} <b class="mono">[${p.m}]</b></div>${box}
      <div class="ms" hidden><div class="eyebrow" style="margin-bottom:4px">Mark scheme — tick the points you made (1 mark each, up to ${p.m})</div>${p.ms.map(x => `<label><input type="checkbox"> <span>${rich(x)}</span></label>`).join('')}</div></div>`;
  }
  function xqHTML(q, n, o = {}) {
    const ps = qParts(q), multi = !!q.parts, tp = q.topic && TOPIC[q.topic], tg = qTag(q);
    if (q.mcq) return `<div class="xq" data-xq="${n}" style="--uc:${tp ? acol(tp) : 'var(--accent)'}"><div class="xq-head"><span class="n">${o.num || 'Q' + (n + 1)}</span>${tp && o.showTopic ? `<a class="pill" href="#/t/${tp.id}">${tp.id} ${esc(tp.title)}</a>` : ''}<span class="tag qt sm">Multiple choice</span><span class="spacer" style="flex:1"></span><span class="pill mk">1 mark</span></div>
      <div class="xq-part" data-m="1" data-mcq="1"><div>${rich(q.q)}</div><ol class="mcq-list" type="A">${q.order.map(i => `<li class="${i === 0 ? 'ans-k' : ''}"><label style="display:flex;gap:8px"><input type="radio" name="mcq${n}" value="${i}"> <span>${rich(q.o[i])}</span></label></li>`).join('')}</ol>
      <div class="ms" hidden><div class="small"><b>Answer:</b> ${rich(q.o[0])}${q.x ? ` — <span class="muted">${rich(q.x)}</span>` : ''}</div></div></div></div>`;
    return `<div class="xq" data-xq="${n}" style="--uc:${tp ? acol(tp) : 'var(--accent)'}"><div class="xq-head"><span class="n">${o.num || 'Q' + (n + 1)}</span>${tp && o.showTopic ? `<a class="pill" href="#/t/${tp.id}">${tp.id} ${esc(tp.title)}</a>` : ''}<span class="tag qt sm">${QTAGS[tg] || tg}</span>${tp && o.showTopic ? areaTag(tp, 1) : ''}<span class="spacer" style="flex:1"></span><span class="pill mk">${qMarks(q)} mark${qMarks(q) > 1 ? 's' : ''}</span></div>

  /* A Component 1 paper with exactly the right marks: questions from all five key areas (each area seeded first),
     no topic repeated until every topic has been tried, and at least one (full: two) levels-marked questions. */
  function paper(kind) {
    const full = kind === 'full', target = full ? 120 : 60, mins = full ? 120 : 60, needLv = full ? 2 : 1, areas = ['1', '2', '3', '4', '5'];
    const pool = bankAll().filter(q => areas.includes(TOPIC[q.topic]?.unit) && qTag(q) !== 'nea');
    const isLv = q => qParts(q).some(p => p.lv), nLv = o => o.filter(isLv).length;
    const build = () => { const out = [], seen = new Set(); let m = 0; const sh = shuffle(pool);
      const add = (q, pass) => { const qm = qMarks(q); if (out.includes(q) || m + qm > target || (!pass && seen.has(q.topic))) return false; out.push(q); seen.add(q.topic); m += qm; return true; };
      shuffle(sh.filter(isLv)).slice(0, needLv).forEach(q => add(q, 0));
      areas.forEach(a => { if (!out.some(q => TOPIC[q.topic].unit === a)) sh.find(q => TOPIC[q.topic].unit === a && !isLv(q) && add(q, 0)); });
      for (const pass of [0, 1]) for (const q of sh) { if (m === target) break; if (isLv(q) && nLv(out) >= needLv + 1) continue; add(q, pass); }
      return out; };
    const tot = o => o.reduce((a, q) => a + qMarks(q), 0), ok = o => nLv(o) >= needLv && areas.every(a => o.some(q => TOPIC[q.topic].unit === a));
    let qs = [], total = 0; for (let k = 0; k < 500; k++) { const o = build(), tt = tot(o); if (!qs.length || Math.abs(tt - target) < Math.abs(total - target) || (tt === target && !ok(qs) && ok(o))) { qs = o; total = tt; } if (total === target && ok(qs)) break; }
    qs.sort((a, b) => { const ta = TOPIC[a.topic], tb = TOPIC[b.topic]; return ta.unit.localeCompare(tb.unit) || (isLv(a) - isLv(b)) || qMarks(a) - qMarks(b); });
    const title = full ? 'Component 1 practice paper' : 'Component 1 half paper';
    crumbs(`<a href="#/mock" style="color:inherit">Practice papers</a> / <b>${title}</b>`);
    V().innerHTML = `<div style="--uc:var(--accent);max-width:880px"><div class="eyebrow">WJEC Eduqas GCSE (9–1) Physical Education · practice paper (not an official paper)</div><h1 class="display" style="font-size:clamp(30px,4.4vw,50px);margin:6px 0">${title}: Introduction to physical education</h1>
      <div class="row"><span class="pill">${full ? '2 hours' : '1 hour'}</span><span class="pill">${total} marks</span><span class="pill warn mono" id="ptimer">${mins}:00</span><button class="btn sm" id="pstart">Start timer</button></div>
      <p class="small muted">Answer all questions. The number of marks is shown in brackets. Use the information in each question — the stimulus — in your answer. Extended answers are marked in bands for the quality of your knowledge, application, analysis and evaluation.</p>
      <div id="plist">${qs.map((q, i) => xqHTML(q, i, { showTopic: true, noFoot: true, num: 'Q' + (i + 1) })).join('')}</div>
      <div class="row" style="margin:24px 0"><button class="btn primary" id="pmark">Finish and show mark schemes</button></div><div id="pres"></div></div>`;
    wireParts(V());
    let tick = null; $('#pstart').onclick = () => { if (tick) return; const end = Date.now() + mins * 60e3; tick = setInterval(() => { const el = $('#ptimer'); if (!el) { clearInterval(tick); return; } const l = Math.max(0, Math.round((end - Date.now()) / 1000)); el.textContent = `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}`; if (!l) { clearInterval(tick); toast('Time is up'); } }, 1000); };
    cleanup = () => clearInterval(tick);
    $('#pmark').onclick = () => { clearInterval(tick); $$('.ms', V()).forEach(m => m.hidden = false); $('#pmark').hidden = true;
      $('#pres').innerHTML = `<div class="card"><p>Tick the creditworthy points for short answers and choose a band and mark for each levels-marked answer, then save your score.</p><button class="btn primary" id="psave">Save my marks</button> <span id="pscore" class="mono"></span></div>`;
      $('#psave').onclick = () => { const got = $$('.xq-part', V()).reduce((a, p) => a + partScore(p), 0), p = Math.round(got / total * 100); $('#pscore').textContent = `${got} / ${total} (${p}%)`; $('#psave').disabled = true; S.stats.mocks++; S.stats.examMarks += got; S.mocks ??= []; S.mocks.push({ d: today(), u: full ? 'Full paper' : 'Half paper', p }); save(); addXP(got * 3, 'Practice paper'); checkBadges(); if (p >= 70) burst(); }; };
  }

  /* ---------- PROGRESS ---------- */
  function progress() {
    crumbs('<b>Progress</b>');
    const L = level(), days = Array.from({ length: 14 }, (_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5); const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); return [d, S.days[k] || 0]; });
    const mx = Math.max(50, ...days.map(d => d[1]));
    const chart = `<svg viewBox="0 0 560 170" width="100%" role="img" aria-label="XP earned over the last 14 days" style="max-width:100%">${[0, .5, 1].map(f => `<line x1="34" x2="556" y1="${140 - f * 120}" y2="${140 - f * 120}" stroke="var(--line)" stroke-width="1"/><text x="28" y="${144 - f * 120}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${Math.round(mx * f)}</text>`).join('')}${days.map(([d, v], i) => { const hh = v / mx * 120; return `<rect x="${40 + i * 37}" y="${140 - hh}" width="26" height="${Math.max(hh, 1)}" rx="4" fill="${i === 13 ? 'var(--accent)' : 'var(--u4)'}" opacity="${v ? 1 : .25}"><title>${v} XP</title></rect><text x="${53 + i * 37}" y="158" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${d.getDate()}</text>`; }).join('')}</svg>`;
    V().innerHTML = `<h1 class="display" style="font-size:clamp(34px,5vw,54px)">Progress</h1>
      <div class="grid g4 sec">${[['Level', L.l, L.name], ['Total XP', S.xp, `${Math.max(0, Math.round(L.next - S.xp))} to next level`], ['Streak', S.streak.n || 0, 'days in a row'], ['Topics mastered', coreTopics().filter(t => mastery(t) >= .7).length + '/' + coreTopics().length, 'topics at 70%+']].map(([a, b, c]) => `<div class="card"><div class="eyebrow">${a}</div><div style="font:800 44px/1.05 var(--f-display);margin-top:6px">${b}</div><div class="small muted">${c}</div></div>`).join('')}</div>
      <div class="grid g2 sec" style="align-items:start"><div class="card"><div class="eyebrow">XP · last 14 days</div><div style="margin-top:10px">${chart}</div></div>
      <div class="card"><div class="eyebrow">Topic mastery</div><p class="small muted" style="margin:6px 0 10px">Each tile is a topic. Brighter = stronger.</p><div class="heat">${allTopics().map(t => { const m = mastery(t); return `<a href="#/t/${t.id}" title="${esc(t.title)}: ${pct(m)}" style="background:color-mix(in srgb, ${ucol(t.unit)} ${Math.round(8 + m * 80)}%, var(--surface));${m > .5 ? 'color:#fff;border-color:transparent' : ''}">${t.id}</a>`; }).join('')}</div></div></div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Badges</h2><span class="muted">${S.badges.length} of ${BADGES.length} earned</span></div><div class="badge-grid">${BADGES.map(([id, n, d, , ic]) => `<div class="badge ${S.badges.includes(id) ? 'got' : ''}"><div class="ic">${ic}</div><b>${n}</b><span>${d}</span></div>`).join('')}</div></div>
      <div class="sec grid g3">${[['Quizzes finished', S.stats.quizzes], ['Calculations correct', S.stats.calcOK], ['Flashcards reviewed', S.stats.cardsSeen], ['Explorations tried', S.stats.sims.length], ['Mock exams', S.stats.mocks], ['Exam marks self-assessed', S.stats.examMarks]].map(([a, b]) => `<div class="card flat row" style="justify-content:space-between"><span>${a}</span><b class="mono" style="font-size:20px">${b}</b></div>`).join('')}</div>
      <div class="sec card flat"><div class="eyebrow">Your data</div><p class="small muted">Progress is stored only in this browser. You can copy it as a backup and paste it back later, or on another device.</p><div class="row"><button class="btn sm" id="exp">Copy backup</button><button class="btn sm" id="imp">Restore from backup</button><button class="btn sm" id="rst" style="color:var(--bad)">Reset all progress</button></div><div id="datazone"></div></div>`;
    $('#exp').onclick = () => { const txt = JSON.stringify(S); navigator.clipboard?.writeText(txt).then(() => toast('Backup copied to clipboard'), () => { $('#datazone').innerHTML = `<textarea style="width:100%;min-height:100px;margin-top:10px" readonly>${esc(txt)}</textarea>`; $('#datazone textarea').select(); }); if (!navigator.clipboard) { $('#datazone').innerHTML = `<textarea style="width:100%;min-height:100px;margin-top:10px" readonly>${esc(txt)}</textarea>`; } };
    $('#imp').onclick = () => { $('#datazone').innerHTML = `<textarea id="impt" aria-label="Paste backup" placeholder="Paste your backup here" style="width:100%;min-height:100px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2)"></textarea><button class="btn sm primary" id="impgo" style="margin-top:8px">Restore</button>`; $('#impgo').onclick = () => { try { const d = JSON.parse($('#impt').value); if (typeof d !== 'object' || d.xp == null) throw 0; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, d); save(); toast('Progress restored'); route(); } catch (e) { toast('That backup could not be read. Paste the full text you copied.'); } }; };
    $('#rst').onclick = () => { $('#datazone').innerHTML = `<div class="box warn" style="margin-top:12px"><b class="lbl">Are you sure?</b><p>This permanently deletes all XP, scores, flashcard boxes and badges in this browser.</p><div class="row"><button class="btn sm" id="rsty" style="background:var(--bad);color:#fff;border-color:var(--bad)">Delete everything</button><button class="btn sm" id="rstn">Cancel</button></div></div>`; $('#rstn').onclick = () => $('#datazone').innerHTML = ''; $('#rsty').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.hash = '#/home'; location.reload(); }; };
  }

  /* ---------- ABOUT ---------- */
  function about() {
    crumbs('<b>About &amp; help</b>');
    V().innerHTML = `<div class="notes"><h1 class="display" style="font-size:clamp(36px,5vw,58px);margin-bottom:12px">About Stride</h1>
      <p class="lede">A complete study companion for WJEC Eduqas GCSE (9–1) Physical Education: every content statement in Component 1 across the five key areas — health, training and exercise; exercise physiology; movement analysis; psychology of sport and physical activity; and socio-cultural issues and sports psychology — plus guides to the Component 2 non-exam assessment and the exam and data skills.</p>

      <section><h3>Mastery and your track</h3><p>Topic mastery combines your best quiz score (40%), flashcards known (20%), specification confidence (20%) and correct calculations (20%). Each topic is a marker on the running track on the home page, in the lane of its key area; it glows brighter as mastery grows, and 70% counts as “mastered”.</p></section>
      <section><h3>The assessment</h3><div class="tbl"><table><tr><th>Section</th><th>Assessment</th></tr>${UNITS.filter(u => u.id !== 'S').map(u => `<tr><td>${u.code} · ${esc(u.name)}</td><td>${esc(u.exam)}</td></tr>`).join('')}</table></div><p>See <a href="#/assess">Assessment &amp; NEA</a> for the AOs, command words, Component 2 guides and a marks calculator.</p></section>
      <section><h3>Keyboard shortcuts</h3><div class="tbl"><table><tr><th>Key</th><th>Action</th></tr><tr><td><kbd>/</kbd> or <kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>Search everything</td></tr><tr><td><kbd>A</kbd>–<kbd>D</kbd> / <kbd>1</kbd>–<kbd>4</kbd></td><td>Answer a quiz question</td></tr><tr><td><kbd>Enter</kbd></td><td>Next question</td></tr><tr><td><kbd>Space</kbd></td><td>Flip a flashcard</td></tr><tr><td><kbd>1</kbd>–<kbd>4</kbd> (flipped card)</td><td>Rate: again / hard / good / easy</td></tr></table></div></section>
      <section><h3>About the content</h3><div class="box why"><b class="lbl">Please note</b><p>The notes, questions, practice papers, mark schemes and band descriptors were written for this app to follow the WJEC Eduqas GCSE (9–1) Physical Education specification (teaching from 2016). They are not official Eduqas materials, and the practice papers are not past papers. Fitness norms and physiological values are typical figures. Always check the current specification, Eduqas’s sample assessment materials and past papers, and follow your teacher’s guidance.</p></div></section>
      <section><h3>Your data</h3><p>Everything you do is stored in this browser only. Use <a href="#/progress">Progress</a> to back up or restore.</p></section></div>`;
  }

  /* ---------- Search palette ---------- */
  let index = null;
  function buildIndex() {
    index = [];
    allTopics().forEach(t => { index.push({ k: 'Topic', t: `${t.id} ${t.title}`, s: t.short, h: `#/t/${t.id}`, x: (t.id + ' ' + t.title + ' ' + t.short + ' ' + t.summary).toLowerCase() });
      t.learn.filter(inScope).forEach((l, i) => index.push({ k: 'Notes', t: l.h.replace(/<[^>]+>/g, ''), s: `${t.id} ${t.title}`, h: `#/t/${t.id}`, x: (l.h + ' ' + l.html.replace(/<[^>]+>/g, ' ')).toLowerCase() }));
      t.eqs.forEach(([e, d]) => index.push({ k: 'Equation', t: M(e), s: `${d || ''} · ${t.id}`, h: `#/t/${t.id}`, x: (e + ' ' + d + ' ' + t.title).toLowerCase(), raw: true }));
      t.cards.filter(c => inScope(c[2] || '')).forEach(([q, a]) => index.push({ k: 'Card', t: q.replace(/<[^>]+>/g, ''), s: a.replace(/<[^>]+>/g, '').slice(0, 80), h: `#/t/${t.id}/cards`, x: (q + ' ' + a).toLowerCase() })); });
    KEY_FACTS.filter(f => unitInScope(f.unit)).forEach(f => f.rows.forEach(r => index.push({ k: 'Fact', t: `${r[0]}${r[1] ? ': ' + r[1] : ''}`, s: f.h, h: '#/facts', x: (f.h + ' ' + r[0] + ' ' + r[1]).toLowerCase() })));
    NEA_GUIDES.filter(g => unitInScope(g.unit)).forEach(g => index.push({ k: 'Page', t: g.title + ' — NEA guide', s: g.time, h: '#/assess', x: (g.title + ' nea ' + g.intro).toLowerCase() }));
    COMMAND_WORDS.forEach(c => index.push({ k: 'Fact', t: 'Command word: ' + c[0], s: c[1], h: '#/assess', x: ('command word ' + c[0] + ' ' + c[1]).toLowerCase() }));
    Object.entries(GAMES).forEach(([id, g]) => index.push({ k: 'Game', t: g.title, s: g.blurb, h: '#/game/' + id, x: (g.title + ' ' + g.blurb).toLowerCase() }));
    [['Key facts', '#/facts'], ['Assessment · exam, NEA, marks calculator', '#/assess'], ['Exam question bank', '#/bank'], ['Practice papers', '#/mock'], ['About and help', '#/about'], ['Progress', '#/progress'], ['Daily challenge', '#/daily']].forEach(([t, hh]) => index.push({ k: 'Page', t, s: '', h: hh, x: t.toLowerCase() }));

  function openPalette() {
    if ($('.palette-back')) return; index || buildIndex();
    const back = h('div', { class: 'palette-back', role: 'dialog', 'aria-label': 'Search' }, `<div class="palette"><input id="pal" placeholder="Search topics, notes, equations, flashcards…" aria-label="Search" autocomplete="off"><ul id="palres"></ul></div>`);
    document.body.append(back); const inp = $('#pal'), ul = $('#palres'); let sel = 0, res = [];
    const close = () => back.remove();
    const show = () => { const q = inp.value.toLowerCase().trim(); const terms = q.split(/\s+/).filter(Boolean);
      res = q ? index.filter(it => terms.every(w => it.x.includes(w))).sort((a, b) => ({ Topic: 0, Page: 1, Equation: 2, Fact: 3, Notes: 4, Game: 5, Card: 6 }[a.k] - { Topic: 0, Page: 1, Equation: 2, Fact: 3, Notes: 4, Game: 5, Card: 6 }[b.k])).slice(0, 40) : index.filter(it => it.k === 'Topic' || it.k === 'Page').slice(0, 14);
      sel = 0; ul.innerHTML = res.length ? res.map((r, i) => `<li><a href="${r.h}" class="${i === sel ? 'sel' : ''}"><span class="kind">${r.k}</span><span><span class="t">${r.raw ? r.t : esc(r.t)}</span><br><span class="s">${esc(r.s)}</span></span><span class="muted">↵</span></a></li>`).join('') : '<li class="empty" style="margin:8px">No matches. Try a word like “lever”, “Weiner” or “VO₂max”.</li>'; };
    inp.oninput = show; show(); inp.focus();
    back.onclick = e => { if (e.target === back) close(); if (e.target.closest('a')) close(); };
    inp.onkeydown = e => { const as = $$('a', ul); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = clamp(sel + (e.key === 'ArrowDown' ? 1 : -1), 0, as.length - 1); as.forEach((a, i) => a.classList.toggle('sel', i === sel)); as[sel]?.scrollIntoView({ block: 'nearest' }); } else if (e.key === 'Enter') { as[sel] && (location.hash = as[sel].getAttribute('href')); close(); } else if (e.key === 'Escape') close(); };
  }

  function init() {

})();
