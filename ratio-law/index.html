/* ---------- 2.1.5 Discharge ---------- */
TOPICS.push({
  id: '2.1.5', unit: 'CT', ref: '2.1.5', title: 'Discharge of contract',
  short: 'Performance and Cutter v Powell, agreement, breach (actual and anticipatory), frustration',
  summary: 'Discharge means the contract comes to an end and the parties are released from their obligations. This happens by performance, by agreement, by breach (where the innocent party chooses to terminate) or by frustration (where an unforeseen event makes performance impossible, illegal or radically different). The strict rule on performance in Cutter v Powell has several important exceptions.',
  spec: ['Discharge by performance: the rule in Cutter v Powell and exceptions (divisible contracts, substantial performance, acceptance of partial performance, prevention)', 'Discharge by agreement: bilateral and unilateral', 'Discharge by breach: actual and anticipatory breach; repudiatory breach and the innocent party’s election', 'Discharge by frustration: impossibility, illegality, commercial frustration, “sterility” of purpose; limits', 'Effects of frustration: common law and the Law Reform (Frustrated Contracts) Act 1943'],
  learn: [
    { h: 'Performance', html: `
<p>The general rule: performance must be <b>complete and exact</b>. In an <b>entire contract</b>, nothing is payable until everything has been done — [[c:cutter]]. This can be harsh, so there are exceptions:</p>
<ul><li><b>Divisible (severable) contracts</b> — payment for each part as it is completed (e.g. instalments).</li>
<li><b>Substantial performance</b> — the price is payable less the cost of putting defects right ([[c:hoenig]]); but not where the defects are serious ([[c:boltonmahadeva]]).</li>
<li><b>Acceptance of partial performance</b> — where the other party freely chooses to accept it, they must pay a reasonable amount (quantum meruit); not where they have no real choice ([[c:sumpter]]).</li>
<li><b>Prevention of performance</b> by the other party — quantum meruit for work done ([[c:planche]]).</li>
<li><b>Tender of performance</b> — an offer to perform that is refused discharges the party who offered (<i>Startup v Macdonald</i>, 1843).</li></ul>
<p>Statute: the Law Reform (Frustrated Contracts) Act 1943 and the Apportionment Act 1870 (wages and rent accrue day by day) soften the rule. Under the CRA 2015, consumers can claim price reductions for defective services rather than all-or-nothing results.</p>` },
    { h: 'Agreement', html: `
<p>The parties can agree to end a contract — but the agreement to release is itself a contract and needs consideration (or a deed).</p>
<ul><li><b>Bilateral discharge</b>: both parties still have obligations to perform, so each gives consideration by releasing the other (mutual release, “accord and satisfaction” in which the accord is the agreement and satisfaction is the consideration). A contract can also be replaced by a new one (novation) or varied.</li>
<li><b>Unilateral discharge</b>: one party has already performed, so releasing the other gives them nothing. Consideration must be provided by the party being released — <b>accord and satisfaction</b> (e.g. paying something different), or the release must be by deed. Promissory estoppel may help (topic 2.1.2b).</li>
<li>The contract may itself provide for discharge: termination clauses, conditions precedent and subsequent.</li></ul>` },
    { h: 'Breach', html: `
<ul><li><b>Actual breach</b>: failing to perform on time, defective performance, or making performance impossible.</li>
<li><b>Anticipatory breach</b>: before performance is due, a party makes clear they will not perform. The innocent party can sue immediately ([[c:hochster]]) or wait for the performance date. If they wait (affirm), they take the risk of later events ([[c:avery]]).</li>
<li><b>Repudiatory breach</b> — breach of a condition, a serious breach of an innominate term, or renunciation — gives the innocent party an <b>election</b>: <b>terminate</b> and claim damages, or <b>affirm</b> and claim damages (and in limited cases perform and claim the price — [[c:whitecarter]]). Breach of a warranty never allows termination.</li>
<li>Termination operates for the future only; accrued rights remain.</li></ul>` },
    { h: 'Frustration', html: `
<div class="box def"><b class="lbl">Definition (Lord Radcliffe in Davis Contractors v Fareham UDC)</b><p>A contract is frustrated when, without the fault of either party, a supervening event makes performance impossible, illegal or “<b>radically different</b> from that which was undertaken by the contract”.</p></div>
<div class="tbl"><table><tr><th>Ground</th><th>Examples</th></tr>
<tr><td><b>Impossibility</b> — destruction of the subject matter</td><td>[[c:taylorcaldwell]] (music hall burned down)</td></tr>
<tr><td>Impossibility — unavailability, death or illness of a party in a personal contract</td><td>[[c:condor]]; <i>Robinson v Davison</i> (1871) (pianist ill); <i>Jackson v Union Marine Insurance</i> (1874) (ship stranded for months)</td></tr>
<tr><td><b>Illegality</b> — a change in the law or outbreak of war</td><td>[[c:fibrosa]]; <i>Metropolitan Water Board v Dick Kerr</i> (1918)</td></tr>
<tr><td><b>Commercial frustration / “sterility”</b> — the whole purpose of the contract disappears</td><td>[[c:krell]]; contrast [[c:hernebay]]</td></tr></table></div>
<h4>Limits</h4><ul><li>Performance becoming more <b>difficult or expensive</b> is not enough: [[c:davis]]; [[c:tsakiroglou]]; [[c:canarywharf]] (Brexit).</li>
<li><b>Self-induced</b> frustration does not count: [[c:supersevant]]; <i>Maritime National Fish v Ocean Trawlers</i> (1935).</li>
<li>Events the parties <b>foresaw or provided for</b> (e.g. a force majeure clause) are governed by the contract. Many COVID-19 disputes turned on such clauses.</li></ul>` },
    { h: 'Effects of frustration', html: `
<p>The contract ends automatically from the moment of frustration; both parties are released from future obligations.</p>
<ul><li><b>Common law</b>: originally the loss “lay where it fell” (<i>Chandler v Webster</i>, 1904); [[c:fibrosa]] allowed money to be recovered where there was a total failure of consideration.</li>
<li><b>Law Reform (Frustrated Contracts) Act 1943</b>:
<ul><li><b>s1(2)</b> — money paid before the frustrating event is <b>recoverable</b>, and money payable ceases to be payable. The court may allow the payee to <b>keep or recover expenses</b> incurred, up to the amount paid or payable ([[c:gamerco]]).</li>
<li><b>s1(3)</b> — a party who has conferred a <b>valuable benefit</b> (other than money) can recover a just sum (<i>BP Exploration v Hunt</i>, 1982).</li></ul></li></ul>` }
  ],
  debate: [{ q: 'Is the rule in Cutter v Powell still justified?', for: ['Certainty: parties know exactly what must be done before payment.', 'Encourages full performance.', 'Parties can agree divisible payments or stage payments.'], ag: ['Harsh — Mrs Cutter got nothing after most of the voyage.', 'Unjust enrichment of the other party.', 'Exceptions (substantial performance, quantum meruit) show the rule is unsatisfactory.', 'The Law Commission (1983) recommended reform, which was not implemented.'] }],
  cases: ['cutter', 'hoenig', 'boltonmahadeva', 'sumpter', 'planche', 'hochster', 'avery', 'whitecarter', 'taylorcaldwell', 'krell', 'hernebay', 'condor', 'davis', 'tsakiroglou', 'supersevant', 'fibrosa', 'gamerco', 'canarywharf'],
  worked: [{ q: '<b>Scenario.</b> Xander books a hotel function room for his company’s product launch on 1 June, paying a £4,000 deposit, with the £6,000 balance due on the day. On 20 May a flood makes the hotel unusable for two months. The hotel had spent £1,500 preparing for the launch. Advise Xander.', s: ['<b class="st">Frustration</b>The room is unavailable because of a flood, without either party’s fault. Performance is impossible — like Taylor v Caldwell. Check the contract for a force majeure clause.', '<b class="st">Not self-induced</b>Nothing suggests the hotel caused the flood (Super Servant Two).', '<b class="st">Effect</b>The contract ends automatically on 20 May. Under s1(2) LR(FC)A 1943, the £4,000 deposit is recoverable and the £6,000 balance ceases to be payable.', '<b class="st">Expenses</b>The court may allow the hotel to keep up to £1,500 of the deposit for expenses (s1(2) proviso), but has discretion — in Gamerco none was allowed.', '<b class="st">Conclude</b>Xander should recover the deposit, possibly minus up to £1,500.'], a: 'Frustrated; recover the deposit under s1(2), subject to an expenses deduction.' }],
  pitfalls: ['Saying a contract is frustrated because it became more expensive (Davis Contractors).', 'Forgetting to check for force majeure clauses or self-induced frustration.', 'Saying breach of any term allows termination — only repudiatory breach does.', 'Confusing substantial performance (Hoenig) with acceptance of partial performance (Sumpter).'],
  cards: [

/* ---------- 2.1.6 Remedies ---------- */
TOPICS.push({
  id: '2.1.6', unit: 'CT', ref: '2.1.6', title: 'Remedies for breach of contract',
  short: 'Compensatory damages, causation, remoteness, mitigation; rescission, specific performance, rectification, injunctions',
  summary: 'The main remedy for breach of contract is damages, available as of right, to put the claimant in the position they would have been in had the contract been performed. Recoverable losses are limited by causation, remoteness and the duty to mitigate. Equitable remedies — specific performance, injunctions, rescission and rectification — are discretionary and granted where damages are inadequate.',
  spec: ['Common law damages: compensatory damages; the expectation, reliance and restitution interests; non-pecuniary loss', 'Tests of causation', 'Remoteness of damage: Hadley v Baxendale and later cases', 'Mitigation of loss', 'Liquidated damages and penalties', 'Equitable remedies: rescission, specific performance, rectification of documents, injunctions'],
  learn: [
    { h: 'Compensatory damages', html: `
<p>Damages in contract aim to put the claimant, so far as money can, in the position they would have been in had the contract been <b>performed</b> ([[c:robinsonharman]]) — the <b>expectation interest</b>. They are not meant to punish.</p>
<ul><li><b>Expectation loss</b>: difference in value (e.g. the extra cost of buying substitute goods), loss of profit, or cost of cure — but not where cure is unreasonable ([[c:ruxley]]).</li>
<li><b>Reliance loss</b>: wasted expenditure, where profits are too speculative ([[c:anglia]]).</li>
<li><b>Restitution</b>: recovering money paid where there is a total failure of consideration.</li>
<li><b>Nominal damages</b> where there is a breach but no loss.</li>
<li><b>Non-pecuniary loss</b>: generally no damages for distress (<i>Addis v Gramophone</i>, 1909), except where the object of the contract was pleasure, relaxation or peace of mind ([[c:jarvis]]; [[c:farley]]), or for physical inconvenience, or loss of amenity ([[c:ruxley]]).</li></ul>` },
    { h: 'Causation', html: `
<p>The breach must be an <b>effective cause</b> of the loss — the “but for” test is a starting point, but the court asks whether the breach was the effective or dominant cause, applying common sense. An intervening act by the claimant or a third party may break the chain: in <i>Quinn v Burch Bros</i> (1966) a contractor’s failure to supply a stepladder did not cause the injury when the claimant chose to use an unfooted trestle instead. The claimant’s own conduct may reduce damages.</p>` },
    { h: 'Remoteness', html: `
<div class="box def"><b class="lbl">Hadley v Baxendale (1854)</b><p>Damages are recoverable for losses that either (1) arise <b>naturally</b>, in the usual course of things, from the breach; or (2) may reasonably be supposed to have been in the <b>contemplation of both parties</b>, when they made the contract, as the probable result of the breach (because of special knowledge).</p></div>
<ul><li>[[c:hadley]]: lost profits too remote — the carrier did not know the mill had no spare shaft.</li>
<li>[[c:victorialaundry]]: ordinary lost profits recoverable; exceptionally lucrative contracts not.</li>
<li>[[c:heron]]: loss must be “not unlikely” — a higher degree of probability than reasonable foreseeability in tort.</li>
<li>[[c:parsons]]: if the <b>type</b> of loss was contemplated, the full extent is recoverable.</li>
<li>[[c:achilleas]]: the defendant is liable only for losses it can be taken to have <b>assumed responsibility</b> for.</li></ul>` },
    { h: 'Mitigation and agreed damages', html: `
<p><b>Mitigation</b>: the claimant must take reasonable steps to reduce the loss and cannot recover for loss that could have been avoided ([[c:brace]]; <i>British Westinghouse v Underground Electric Railways</i>, 1912). They need not take unreasonable risks or complicated legal action ([[c:pilkington]]). Reasonable costs of mitigating are recoverable. The burden is on the defendant to prove failure to mitigate.</p>
<p><b>Liquidated damages</b>: a clause fixing the amount payable on breach is enforceable unless it is a <b>penalty</b> — a detriment out of all proportion to any legitimate interest of the innocent party in performance ([[c:parkingeye]], replacing the “genuine pre-estimate of loss” test from <i>Dunlop v New Garage</i>, 1915).</p>` },
    { h: 'Equitable remedies', html: `
<p>Equitable remedies are <b>discretionary</b>: granted only where damages would be inadequate, and subject to equitable maxims (“clean hands”, “delay defeats equity”, no hardship to the defendant, no constant supervision).</p>
<ul><li><b>Specific performance</b> — an order to carry out the contract. Common for land and unique goods (paintings, rare items); granted in [[c:beswick]]. Refused for personal service contracts (<i>Ryan v Mutual Tontine</i>, 1893), where constant supervision is needed ([[c:argyll]]), or where the claimant has acted unfairly.</li>
<li><b>Injunctions</b> — an order not to do something (prohibitory) or to do something (mandatory). Negative promises can be enforced ([[c:warnernelson]]; <i>Lumley v Wagner</i>, 1852), but not if it would in effect force someone to work for the claimant ([[c:pageone]]).</li>
<li><b>Rescission</b> — setting aside a voidable contract (misrepresentation, duress), restoring the parties to their original positions. Barred by affirmation, delay, third-party rights and impossibility of restitution (topic 2.1.4).</li>
<li><b>Rectification</b> — correcting a written document that does not record what the parties actually agreed ([[c:craddock]]). Needs convincing proof of a common intention that continued up to signing (<i>Joscelyne v Nissen</i>, 1970).</li></ul>
<p>Other remedies: an action for the <b>agreed sum</b> (the price) and <b>quantum meruit</b> (a reasonable sum for work done).</p>` }
  ],
  debate: [{ q: 'Should damages for disappointment and distress be more widely available?', for: ['Many consumer contracts are about enjoyment, not profit (Jarvis, Farley).', 'Ruxley recognised loss of amenity — the “consumer surplus”.', 'Otherwise consumers are under-compensated when their expectations are ruined.'], ag: ['Commercial contracts should compensate financial loss only (Addis).', 'Hard to value and could encourage trivial claims.', 'Certainty and insurance pricing depend on predictable damages.'] }],
  cases: ['robinsonharman', 'anglia', 'ruxley', 'jarvis', 'farley', 'hadley', 'victorialaundry', 'heron', 'parsons', 'achilleas', 'brace', 'pilkington', 'parkingeye', 'beswick', 'argyll', 'warnernelson', 'pageone', 'craddock'],
  worked: [{ q: '<b>Scenario.</b> Yara runs a bakery. Her new oven, due on 1 March, arrives five weeks late. She loses £3,000 of normal profits, and a £20,000 contract to supply a supermarket that the oven supplier did not know about. She also refuses the supplier’s offer to lend her an oven in the meantime. Advise Yara on damages.', s: ['<b class="st">Aim</b>Expectation damages: put Yara where she would have been had the oven arrived on time (Robinson v Harman).', '<b class="st">Remoteness</b>Normal lost profits arise naturally — first limb of Hadley v Baxendale, recoverable (Victoria Laundry). The supermarket contract was not known to the supplier — second limb not satisfied, too remote.', '<b class="st">Mitigation</b>Refusing a reasonable offer of a loan oven may be a failure to mitigate (Brace v Calder). Losses she could have avoided after the offer are not recoverable.', '<b class="st">Conclude</b>She can recover lost normal profits up to the point she could have mitigated; not the supermarket contract.'], a: 'Normal lost profits (reduced for failure to mitigate); supermarket loss too remote.' }],
  pitfalls: ['Using the tort remoteness test (Wagon Mound) in contract — use Hadley v Baxendale and The Heron II.', 'Forgetting that equitable remedies are discretionary.', 'Saying specific performance is available for employment contracts.', 'Ignoring mitigation in a problem question when the facts hint at it.'],
  cards: [

    ['When is specific performance refused?', 'Damages adequate, personal services, constant supervision (Argyll), unclean hands, hardship.'],
    ['Warner Bros v Nelson (1937)?', 'Injunction enforcing a negative promise not to work for rivals.'],
    ['Rectification?', 'Correcting a written document to reflect the true agreement — Craddock v Hunt.']
  ],
  quiz: [
    { q: 'Contract damages usually aim to protect the…', o: ['expectation interest', 'reliance interest only', 'defendant’s interest', 'public interest'], x: 'Robinson v Harman.' },

TOOLS.billpath = { type: 'steps', title: 'From idea to Act: follow a Bill', intro: 'Follow the Terrorism (Protection of Premises) Bill — “Martyn’s Law” — from campaign to Royal Assent in April 2025.', steps: [
  { h: 'The campaign', html: '<p>After her son Martyn Hett was killed in the Manchester Arena bombing (2017), Figen Murray campaigned for venues to prepare for terrorist attacks. The Manchester Arena Inquiry supported the idea. <b>Influences:</b> a victim’s family, a public inquiry, media coverage and a petition.</p>' },
  { h: 'Consultation', html: '<p>The Home Office ran a public <b>consultation</b> (2021) on a “Protect Duty” — the equivalent of a Green Paper stage — then published a draft Bill for <b>pre-legislative scrutiny</b> by the Home Affairs Committee (2023), which criticised the burden on small venues.</p>' },
  { h: 'First reading', html: '<p>The Bill was introduced in the House of Commons in September 2024. First reading is a formality: the title is read and the Bill is printed.</p>' },
  { h: 'Second reading', html: '<p>The main debate on the <b>principles</b> of the Bill, followed by a vote. MPs broadly supported the aim but questioned costs for small venues.</p>' },
  { h: 'Committee stage', html: '<p>A <b>Public Bill Committee</b> examined each clause, heard evidence and considered amendments. The standard tier threshold was raised from 100 to 200 people in response to concerns.</p>' },
  { h: 'Report and third reading', html: '<p>At <b>report stage</b> the whole House considered the amended Bill; at <b>third reading</b> it had a final debate and vote.</p>' },
  { h: 'House of Lords', html: '<p>The Bill passed through the same stages in the Lords. Peers with expertise in security and the events industry proposed amendments. Any Lords amendments go back to the Commons — <b>ping-pong</b> — until both agree. If the Lords refused, the <b>Parliament Acts 1911 and 1949</b> could be used after a year.</p>' },
  { h: 'Royal Assent', html: '<p>Royal Assent was given in <b>April 2025</b>. The Act includes an implementation period of at least 24 months before its duties come into force — commencement will be by <b>statutory instrument</b> (delegated legislation).</p>' }
] };

function deck(t) {
  const d = (t.cards || []).map((c, i) => ({ k: 'k' + i, q: c[0], a: c[1] }));
  (t.cases || []).forEach(id => { const c = CASES[id]; if (c) d.push({ k: 'c:' + id, q: `<span class="eyebrow" style="position:static;display:block;margin-bottom:10px">Name the case</span>${esc(c.f)}`, a: `<b><i class="cn">${esc(c.n)}</i> (${c.y})</b><br><br>${esc(c.p)}` }); });
  return d;
}
function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, d = deck(t);
  const ck = d.length ? d.filter(c => (s.cards[c.k] || 0) >= 3).length / d.length : 0;
  const sp = (t.spec || []).reduce((a, _, i) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / Math.max(1, (t.spec || []).length);

  /* ---------- Quiz engine ---------- */
  function caseQs(t, n) {
    const ids = (t.cases || []).filter(id => CASES[id]); if (ids.length < 2) return [];
    return shuffle(ids).slice(0, n).map(id => { const c = CASES[id], pool = Object.values(CASES).filter(x => x !== c && (x.a === c.a || ids.includes(x.id))); const w = shuffle(pool).slice(0, 3); return { q: `Which case? <span class="muted">${esc(c.f)}</span>`, o: [`<i class="cn">${esc(c.n)}</i> (${c.y})`, ...w.map(x => `<i class="cn">${esc(x.n)}</i> (${x.y})`)], x: esc(c.p) }; });
  }
  function runQuiz(host, items, o = {}) {
    const qs = items.map(it => ({ ...it, order: shuffle(it.o.map((_, i) => i)) }));
    let i = 0, res = [];
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${esc(q.topic)}</a>` : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.q)}</div>
        <div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p><div id="fb"></div>`;
      $$('.opt', host).forEach(b => b.onclick = e => { if (e.target.closest('.case')) return; answer(+b.dataset.k); });
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i || k >= q.order.length) return;
      const ok = q.order[k] === 0; res.push({ ok, q }); (ok ? sfx.good : sfx.bad)();
      $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100);
      S.stats.quizzes++; if (p === 100) { S.stats.perfect++; burst(); sfx.win(); } save();
      o.onDone && o.onDone({ correct, total: qs.length, pct: p });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete</div><div class="big">${p}%</div><p class="lede" style="margin:8px auto">${correct} of ${qs.length} correct${p === 100 ? ' — unanimous!' : p >= 70 ? ' — strong.' : ' — review the notes and try again.'}</p>
        <div class="stack" style="text-align:left;max-width:640px;margin:18px auto 0">${res.filter(r => !r.ok).map(r => `<div class="explain"><b class="v bad">Review</b> ${rich(r.q.q)}<br><span class="small">Answer: <b>${rich(r.q.o[0])}</b></span></div>`).join('')}</div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>`;
      $('#retry').onclick = () => runQuiz(host, o.regen ? o.regen() : items, o);
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const m = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (m != null && res.length === i && i < qs.length) answer(m); else if (e.key === 'Enter' && $('#nextq')) { e.preventDefault(); $('#nextq').click(); } };
    addEventListener('keydown', key);
    if (cleanup) try { cleanup(); } catch (e) { }
    cleanup = () => removeEventListener('keydown', key);
    render();
  }

    const render = q => {
      if (tab === 'terms') $('#slist').innerHTML = `<div class="gloss">${GLOSSARY.filter(g => !q || (g[0] + g[1]).toLowerCase().includes(q)).sort((a, b) => a[0].localeCompare(b[0])).map(g => `<div><b>${esc(g[0])}</b><span>${esc(g[1])}</span></div>`).join('')}</div>`;
      else $('#slist').innerHTML = `<div class="stat-list">${STATUTES.filter(st => unitInScope(st.a) || st.a === '1A' || st.a === '1B').filter(st => !q || (st.n + st.s.flat().join(' ')).toLowerCase().includes(q)).map(st => `<div class="statute" style="--uc:${ucol(st.a)}"><h4>${esc(st.n)}</h4><dl>${st.s.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${rich(v)}</dd>`).join('')}</dl></div>`).join('')}</div>`;
    };
    $('#sq').oninput = e => render(e.target.value.toLowerCase().trim()); render('');
  }

  /* ---------- ASSESSMENT ---------- */
  function assess() {
    crumbs('<b>Assessment</b>'); if (!S.assessSeen) { S.assessSeen = 1; save(); checkBadges(); }
    V().innerHTML = `<div class="notes" style="max-width:none">${ASSESS_HTML}</div>`;
  }

  /* ---------- MOCK PAPERS ---------- */
  function mock() {
    crumbs('<b>Mock papers</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Mock papers</h1><p class="lede">Timed papers in the Eduqas format, built from your three areas. Answer in the boxes (or on paper), then mark against the indicative content. Your answers stay in this browser.</p>
      <div class="grid g3 sec">${MOCKS.map(m => `<a class="card linkcard" href="#/mock/${m.id}"><div class="eyebrow">${esc(m.meta)}</div><div class="h3" style="margin:6px 0">${esc(m.title)}</div><p class="small muted" style="margin:0">${esc(m.blurb)}</p></a>`).join('')}</div>`;
  }
  function mockPaper(id) {
    const m = MOCKS.find(x => x.id === id); if (!m) return mock();
    crumbs(`<a href="#/mock">Mock papers</a> / <b>${esc(m.title)}</b>`);
    const secs = m.build();
    let secsLeft = m.mins * 60, running = false, iv = null, got = 0, total = 0;
    V().innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">${esc(m.meta)}</div><h1 class="display" style="font-size:clamp(28px,4.4vw,44px);margin-top:6px">${esc(m.title)}</h1></div>
      <div class="card flat" style="padding:12px 16px;text-align:center"><div class="eyebrow">Time</div><div class="timer-big" id="mt">${fmt(secsLeft)}</div><div class="row" style="justify-content:center;margin-top:6px"><button class="btn sm primary" id="mgo">Start</button><button class="btn sm" id="mrs">Reset</button></div></div></div>
      <div class="box tip"><b class="lbl">Instructions</b><p>${m.instr}</p></div><div id="mq"></div>
      <div class="card sec" style="text-align:center"><div class="eyebrow">Your total</div><div style="font:700 48px var(--f-display)" id="mtot">0 / ${secs.reduce((a, s) => a + s.qs.reduce((b, q) => b + q.m, 0), 0)}</div><button class="btn primary" id="mdone">Finish paper</button></div>`;
    secs.forEach((s, si) => { $('#mq').insertAdjacentHTML('beforeend', `<h2 class="h3" style="margin:28px 0 6px;color:${s.css || 'inherit'}">${esc(s.h)}</h2>${s.note ? `<p class="small muted">${esc(s.note)}</p>` : ''}`); s.qs.forEach((q, qi) => { total += q.m; $('#mq').append(examBlock(q, `mock.${id}.${si}.${qi}`, sc => { got += sc; $('#mtot').textContent = `${got} / ${$('#mtot').textContent.split('/ ')[1]}`; S.stats.examMarks += sc; save(); })); }); });
    function fmt(x) { x = Math.max(0, x); return Math.floor(x / 3600) + ':' + pad2(Math.floor(x % 3600 / 60)) + ':' + pad2(Math.floor(x % 60)); }
    $('#mgo').onclick = () => { running = !running; $('#mgo').textContent = running ? 'Pause' : 'Resume'; if (running) iv = setInterval(() => { secsLeft--; $('#mt').textContent = fmt(secsLeft); if (secsLeft <= 0) { clearInterval(iv); running = false; toast('<b>Time</b> Pens down'); sfx.gavel(); } }, 1000); else clearInterval(iv); };
    $('#mrs').onclick = () => { clearInterval(iv); running = false; secsLeft = m.mins * 60; $('#mt').textContent = fmt(secsLeft); $('#mgo').textContent = 'Start'; };
    $('#mdone').onclick = () => { clearInterval(iv); S.stats.mocks++; save(); addXP(50, 'Mock paper completed'); burst(); };
    cleanup = () => clearInterval(iv);
  }

  /* ---------- ARCADE / DAILY / PROGRESS / ABOUT ---------- */
  function arcade() {
    crumbs('<b>Arcade</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Arcade</h1><p class="lede">Quick games to drill case law, principles and terminology. Games use only the areas you study.</p>
      <div class="grid g3 sec">${Object.entries(GAMES).map(([id, g]) => `<a class="game-card" href="#/game/${id}" style="--uc:${g.col}"><div class="art"><canvas data-art="${id}"></canvas></div><div class="eyebrow">${esc(g.skill)}</div><div class="h3">${esc(g.title)}</div><p class="small muted" style="margin:0">${esc(g.blurb)}</p><span class="small mono">Best: ${S.games[id]?.best || 0}</span></a>`).join('')}</div>`;
    $$('[data-art]').forEach(cv => drawGameArt(cv, cv.dataset.art));
  }
  function daily() {
    crumbs('<b>Daily docket</b>');
    let seed = +today().replace(/-/g, ''); const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const pool = allTopics().flatMap(t => t.quiz.map(q => ({ ...q, topic: t.id })));
    const items = []; const used = new Set(); while (items.length < 5 && used.size < pool.length) { const k = Math.floor(rnd() * pool.length); if (!used.has(k)) { used.add(k); items.push(pool[k]); } }
    V().innerHTML = `<div class="quiz-wrap" style="margin:0 auto"><h1 class="display" style="font-size:clamp(28px,4vw,40px);margin-bottom:6px">Today’s docket</h1><p class="muted">Five questions, the same for everyone today. ${S.daily[today()] != null ? `You scored ${S.daily[today()]}/5 today.` : ''}</p><div id="qz" style="margin-top:18px"></div></div>`;
    runQuiz($('#qz'), items, { title: 'Daily docket', onDone: r => { const first = S.daily[today()] == null; S.daily[today()] = Math.max(S.daily[today()] || 0, r.correct); save(); if (first) addXP(r.correct * 10, 'Daily docket'); } });
  }
  function progress() {
    crumbs('<b>Progress</b>');
    const L = level(), days = Array.from({ length: 28 }, (_, i) => { const d = dstr(new Date(Date.now() - (27 - i) * 864e5)); return [d, S.days[d] || 0]; }), mx = Math.max(10, ...days.map(d => d[1]));
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Progress</h1>
      <div class="grid g3 sec" style="margin-top:18px"><div class="card"><div class="eyebrow">Level ${L.l}</div><div class="h2" style="margin:8px 0">${esc(L.name)}</div><div class="bar" style="--uc:var(--gilt)"><i style="width:${clamp(L.frac, 0, 1) * 100}%"></i></div><p class="small muted">${S.xp} XP · next level at ${Math.round(L.next)}</p></div>
      <div class="card"><div class="eyebrow">Last 28 days</div><svg viewBox="0 0 280 90" width="100%" height="110" role="img" aria-label="XP earned per day">${days.map(([d, v], i) => `<rect x="${i * 10 + 1}" y="${80 - v / mx * 70}" width="8" height="${Math.max(1, v / mx * 70)}" rx="1.5" fill="${v ? 'var(--accent)' : 'var(--line-2)'}"><title>${d}: ${v} XP</title></rect>`).join('')}<line x1="0" y1="81" x2="280" y2="81" stroke="var(--line-2)"/><text x="0" y="90" font-size="7" fill="var(--muted)">4 weeks ago</text><text x="280" y="90" font-size="7" fill="var(--muted)" text-anchor="end">today</text></svg></div>
      <div class="card"><div class="eyebrow">Totals</div><div class="readouts" style="margin-top:10px"><div class="ro"><span>Quizzes</span><b>${S.stats.quizzes}</b></div><div class="ro"><span>Cards reviewed</span><b>${S.stats.cardsSeen}</b></div><div class="ro"><span>Exam marks</span><b>${S.stats.examMarks}</b></div><div class="ro"><span>Tools tried</span><b>${S.stats.tools.length}</b></div></div></div></div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Mastery by topic</h2><span class="muted">40% quiz · 20% flashcards · 20% checklist · 20% exam practice</span></div>
      ${UNITS.filter(u => unitTopics(u.id).length).map(u => `<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:6px;color:${u.css}">${esc(u.name)}</div><div class="heat">${unitTopics(u.id).map(t => { const m = mastery(t); return `<a href="#/t/${t.id}" title="${esc(t.title)} · ${pct(m)}" style="background:color-mix(in srgb,${u.css} ${Math.round(8 + m * 80)}%,var(--surface))">${esc(t.id)}</a>`; }).join('')}</div></div>`).join('')}</div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Badges</h2><span class="muted">${S.badges.length} of ${BADGES.length}</span></div><div class="badge-grid">${BADGES.map(([id, n, d, , ic]) => `<div class="badge ${S.badges.includes(id) ? 'got' : ''}"><div class="ic">${ic}</div><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('')}</div></div>
      <div class="sec"><button class="btn sm" id="reset">${ICON.reset} Reset all progress</button><span id="reset-c"></span></div>`;
    $('#reset').onclick = () => { $('#reset-c').innerHTML = ` <span class="small">This deletes all XP, marks and cards. </span><button class="btn sm" id="reset-y" style="border-color:var(--bad);color:var(--bad)">Yes, reset</button>`; $('#reset-y').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.hash = '#/home'; location.reload(); }; };
  }
  function about() {
    crumbs('<b>About &amp; help</b>');
    V().innerHTML = `<div class="notes"><h1 class="display" style="font-size:clamp(32px,5vw,50px);margin-bottom:14px">About Ratio</h1>
      <p class="lede">Ratio covers the Eduqas GCE A level in Law (A150QS, first awarded 2019): Component 1 (the nature of law and the English legal system) and all four areas of substantive law for Components 2 and 3.</p>
      <h3 style="margin-top:24px">How to use it</h3><ul><li><b>Learn</b> — notes for each specification point, with evaluation (AO3) debates, worked answers and common mistakes. Tap any <button class="case" type="button" data-case="donoghue">case name</button> for its facts and principle.</li><li><b>Key cases</b> — the cases for the topic; hide the facts to test yourself.</li><li><b>Explore</b> — interactive decision trees and tools that walk through the legal tests step by step.</li><li><b>Flashcards</b> — spaced repetition in five boxes: cards you know well come back less often.</li><li><b>Quiz</b> and <b>Exam practice</b> — multiple-choice checks and Eduqas-style questions you self-mark against indicative content.</li><li><b>Mock papers</b> — full timed papers for Components 1, 2 and 3.</li></ul>
      <h3 style="margin-top:24px">Keyboard shortcuts</h3><ul><li><kbd>/</kbd> search · <kbd>A</kbd>–<kbd>D</kbd> answer a quiz question · <kbd>Space</kbd> flip a card · <kbd>1</kbd>–<kbd>4</kbd> rate a card</li></ul>
      <h3 style="margin-top:24px">Accuracy</h3><p>The law is stated as understood in September 2026, including post-Brexit changes and recent reforms. Where reforms had been proposed but not in force, the notes say so. Exam formats follow the published specification; check your teacher’s guidance and Eduqas’s sample assessment materials for exact question wording. Ratio is an independent study aid and is not produced or endorsed by Eduqas or WJEC.</p>
      <p>Your progress is stored only in this browser. Clearing site data will reset it.</p></div>`;
  }

  /* ---------- SEARCH ---------- */
  function buildIndex() {
    const ix = [];
    allTopics().forEach(t => { ix.push({ k: 'Topic', t: `${t.id} ${t.title}`, s: t.short, href: '#/t/' + t.id, txt: (t.title + ' ' + t.short + ' ' + t.summary).toLowerCase() }); t.learn.forEach((sec, i) => ix.push({ k: 'Notes', t: sec.h, s: `${t.id} ${t.title}`, href: '#/t/' + t.id, txt: (sec.h + ' ' + plain(sec.html)).toLowerCase() })); });
    Object.values(CASES).filter(c => unitInScope(c.a)).forEach(c => ix.push({ k: 'Case', t: c.n + ' (' + c.y + ')', s: c.p, href: c.t && TOPIC[c.t] ? '#/t/' + c.t + '/cases' : '#/cases', txt: (c.n + ' ' + c.f + ' ' + c.p).toLowerCase() }));
    STATUTES.forEach(st => ix.push({ k: 'Statute', t: st.n, s: st.s.map(x => x[0]).join(', '), href: '#/statutes/acts', txt: (st.n + ' ' + st.s.flat().join(' ')).toLowerCase() }));
    GLOSSARY.forEach(g => ix.push({ k: 'Term', t: g[0], s: g[1], href: '#/statutes/terms', txt: (g[0] + ' ' + g[1]).toLowerCase() }));
    Object.entries(GAMES).forEach(([id, g]) => ix.push({ k: 'Game', t: g.title, s: g.blurb, href: '#/game/' + id, txt: (g.title + ' ' + g.blurb).toLowerCase() }));
    return ix;
  }
  function openPalette() {
    if ($('.palette-back')) return; index ??= buildIndex();
    const back = h('div', { class: 'palette-back', role: 'dialog', 'aria-label': 'Search' }, `<div class="palette"><input id="pq" placeholder="Search topics, cases, statutes, terms…" autocomplete="off" aria-label="Search"><ul id="pl"></ul></div>`);
    document.body.append(back);
    const inp = $('#pq'), ul = $('#pl'); let sel = 0, res = [];
    const draw = () => {
      const q = inp.value.toLowerCase().trim(); const words = q.split(/\s+/).filter(Boolean);
      res = q ? index.map(r => { let sc = 0; for (const w of words) { if (!r.txt.includes(w)) return null; sc += r.t.toLowerCase().includes(w) ? 3 : 1; } return { r, sc: sc + (r.k === 'Topic' ? 2 : r.k === 'Case' ? 1 : 0) }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 14).map(x => x.r) : index.filter(r => r.k === 'Topic').slice(0, 10);
      sel = Math.min(sel, Math.max(0, res.length - 1));
      ul.innerHTML = res.length ? res.map((r, i) => `<li><a href="${r.href}" class="${i === sel ? 'sel' : ''}"><span class="kind">${r.k}</span><span><span class="t">${esc(r.t)}</span><span class="s">${esc(plain(r.s))}</span></span></a></li>`).join('') : '<li class="empty" style="margin:8px">No matches. Try a case name, an Act or a topic.</li>';
    };
    const close = () => back.remove();
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter' && res[sel]) { location.hash = res[sel].href; close(); } else if (e.key === 'Escape') close(); };
    back.onclick = e => { if (e.target === back || e.target.closest('a')) close(); };
    draw(); inp.focus();
  }
  addEventListener('keydown', e => { if (e.key === '/' && !e.target.matches('input,textarea,select')) { e.preventDefault(); openPalette(); } if (e.key === 'Escape') closePop(); });

  /* ---------- boot ---------- */
  function boot() {
    if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
    chrome(); addEventListener('hashchange', route); route();
  }
  return { boot, refreshChrome, route };
})();
App.boot();

</script>
</body>
</html>
