<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ratio · A level Law</title>
<meta name="description" content="Ratio: an interactive study app for the Eduqas A level in Law — notes, casebook, flashcards, quizzes, interactive legal tests, exam practice and mock papers for all four areas of substantive law.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================
   Ratio · Eduqas A level Law
   Light: a law library reading room. Dark: an oak-panelled chamber.
   Accent: Commons green. Second: Lords red. Highlight: gilt.
   ========================================================== */
:root{
  --paper:#EEF0EA; --paper-2:#E3E7DF; --grid-2:#D7DDD2;
  --surface:#FBFCF9; --surface-2:#F3F5F0;
  --ink:#1A231E; --ink-2:#34403A; --muted:#5F6B64; --faint:#87928B;
  --line:#DCE1D8; --line-2:#C3CBBF;
  --accent:#1F5C43; --accent-ink:#174A35; --accent-soft:#DCEBE2;
  --seal:#9E2235; --seal-soft:#F6DFE3;
  --gilt:#A07C22; --gilt-soft:#F4EBD2;
  --good:#23794A; --good-soft:#DDF0E3;
  --bad:#B42B3C;  --bad-soft:#F8E0E3;
  --warn:#9A650C; --warn-soft:#F8EDD5;
  --info:#285A9E; --info-soft:#DEE8F5;
  --shadow:0 1px 2px rgba(20,35,28,.06),0 4px 16px rgba(20,35,28,.06);
  --shadow-lg:0 12px 40px rgba(20,35,28,.18);
  --u1a:#1F6B4A; --u1b:#2F5597; --un:#8A6A12; --uct:#0E7580; --uto:#6D48A8; --ucr:#A3243A; --uhr:#B35515; --us:#5E665F;
  --uc:var(--accent);
  --r:10px; --r-lg:16px;
  --f-display:"Libre Caslon Text","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --side:264px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1311; --paper-2:#161B18; --grid-2:#1C231F;
    --surface:#171D1A; --surface-2:#1E2521;
    --ink:#E9EEE9; --ink-2:#C9D2CC; --muted:#98A49C; --faint:#6D786F;
    --line:#26302B; --line-2:#35413A;
    --accent:#6CCB9C; --accent-ink:#8FDCB5; --accent-soft:#16301F;
    --seal:#E57A8A; --seal-soft:#3A1920;
    --gilt:#D9B45A; --gilt-soft:#33290F;
    --good:#5CC784; --good-soft:#12301E; --bad:#FF7082; --bad-soft:#3A161C;
    --warn:#EDB450; --warn-soft:#352810; --info:#7AAEF0; --info-soft:#12253B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
    --shadow-lg:0 16px 50px rgba(0,0,0,.55);
    --u1a:#5FC495; --u1b:#7FA6EC; --un:#D8B24E; --uct:#3CC3CD; --uto:#B395EE; --ucr:#F07A8C; --uhr:#F29A5A; --us:#A3ACA5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#0F1311; --paper-2:#161B18; --grid-2:#1C231F;
    --surface:#171D1A; --surface-2:#1E2521;
    --ink:#E9EEE9; --ink-2:#C9D2CC; --muted:#98A49C; --faint:#6D786F;
    --line:#26302B; --line-2:#35413A;
    --accent:#6CCB9C; --accent-ink:#8FDCB5; --accent-soft:#16301F;
    --seal:#E57A8A; --seal-soft:#3A1920;
    --gilt:#D9B45A; --gilt-soft:#33290F;
    --good:#5CC784; --good-soft:#12301E; --bad:#FF7082; --bad-soft:#3A161C;
    --warn:#EDB450; --warn-soft:#352810; --info:#7AAEF0; --info-soft:#12253B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
    --shadow-lg:0 16px 50px rgba(0,0,0,.55);
    --u1a:#5FC495; --u1b:#7FA6EC; --un:#D8B24E; --uct:#3CC3CD; --uto:#B395EE; --ucr:#F07A8C; --uhr:#F29A5A; --us:#A3ACA5;
    color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.62 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
[hidden]{display:none!important}
i.cn,.cn{font-family:var(--f-display);font-style:italic}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 14px 20px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px;text-decoration:none;color:var(--ink)}
.brand-mark{width:36px;height:36px;border-radius:8px;background:#10261C;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(217,180,90,.35)}
.brand-mark svg{width:22px;height:22px;fill:none;stroke:#D9B45A;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font:700 25px/1 var(--f-display);letter-spacing:.01em}
.brand-name em{font-style:italic;font-weight:400;color:var(--gilt)}
.brand-sub{font:500 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--paper-2);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .unit-a{align-items:flex-start}
.unit-line{width:3px;align-self:stretch;border-radius:2px;flex:none;background:currentColor}
.unit-a small{display:block;font:500 11px/1.3 var(--f-body);color:var(--faint)}
.nav .meter{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.unit-a.off{opacity:.42}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--faint);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 28px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{font:500 13px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs a{color:inherit}
.search-btn{display:flex;align-items:center;gap:8px;min-width:230px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
.search-btn:hover{border-color:var(--line-2)}
.search-btn kbd{margin-left:auto}
.search-btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
kbd{font:500 11px var(--f-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 12px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.route-chip{cursor:pointer;border-color:var(--line-2)}
.route-chip:hover{border-color:var(--accent)}
.route-chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{padding:28px 28px 80px;max-width:1240px;width:100%;margin:0 auto}
.view.enter{animation:rise .3s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:60;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,10,8,.45);z-index:55}
  .top{padding:8px 16px}
  .search-btn{min-width:0;flex:none}
  .search-btn span,.search-btn kbd{display:none}
  .view{padding:18px 16px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10.5px var(--f-body);color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabbar a.on{color:var(--ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .hide-m{display:none!important}
}
@media (min-width:901px){.menu-btn{display:none!important}}

/* ---------- Type ---------- */
h1,h2,h3,h4{text-wrap:balance;margin:0}
.display{font:700 clamp(34px,5.4vw,58px)/1.04 var(--f-display);letter-spacing:-.012em}
.display em{font-weight:400;font-style:italic}
.h2{font:700 27px/1.15 var(--f-display);letter-spacing:-.005em}
.h3{font:700 19px/1.25 var(--f-display)}
.eyebrow{font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;color:var(--ink-2);max-width:66ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.sec-head .muted{font-size:14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--uc);border-radius:3px;transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--f-mono);background:var(--paper-2);color:var(--ink-2);white-space:nowrap;text-decoration:none}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-body);letter-spacing:.02em;padding:4px 7px;border-radius:999px;vertical-align:middle;white-space:nowrap;border:1px solid}
.tag.priv{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:var(--info-soft)}
.tag.pub{color:var(--seal);border-color:color-mix(in srgb,var(--seal) 40%,transparent);background:var(--seal-soft)}
.tag.comp{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}

/* ---------- Home ---------- */
.hero{position:relative;border-radius:20px;overflow:hidden;background:#10261C;color:#E8EFE9;padding:30px 30px 24px;border:1px solid #1D3D2E;box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(217,180,90,.10),transparent 55%);pointer-events:none}
.hero .display{color:#F5F1E4}
.hero .display em{color:#D9B45A}
.hero .eyebrow{color:#A9BFB2}
.hero p{color:#C4D3CA;max-width:54ch;margin:12px 0 0}
.hero-grid{position:relative;display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:end}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hstat{background:rgba(255,255,255,.04);border:1px solid rgba(217,180,90,.18);border-radius:12px;padding:12px 14px}
.hstat b{display:block;font:700 30px/1 var(--f-display);color:#F5F1E4;font-variant-numeric:tabular-nums}
.hstat span{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#A9BFB2}
.hero .btn{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.12)}
.hero .btn.gilt{background:#D9B45A;border-color:#D9B45A;color:#1C1606}
.hero .btn.gilt:hover{background:#E6C36C}
.hero canvas.shelf{position:relative;display:block;width:100%;height:clamp(250px,32vw,330px);margin-top:20px;border-radius:12px;background:#0B1A13;border:1px solid #1D3D2E}
.shelf-tip{position:relative;font:500 12px var(--f-mono);color:#A9BFB2;min-height:18px;margin-top:8px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding:22px 18px}}

.unit-card{position:relative;display:flex;flex-direction:column;gap:9px;text-decoration:none;color:inherit;padding:18px 18px 16px 20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);transition:transform .15s ease,border-color .15s}
.unit-card:hover{transform:translateY(-2px);border-color:var(--uc)}
.unit-card .line{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--uc)}
.unit-card .h3{font-size:20px}
.unit-card.off{opacity:.45}

.topic-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--uc);transform:translateY(-1px)}
.tcard .no{grid-row:span 3;font:700 15px/1.3 var(--f-mono);color:var(--uc);min-width:48px;padding-top:2px}
.tcard .tt{font-weight:600;font-size:15px;line-height:1.3}
.tcard .ts{font-size:12.5px;color:var(--muted);line-height:1.4}
.tcard .bar{margin-top:6px}

/* ---------- Topic page ---------- */
.topic-head{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.topic-ref{display:inline-flex;align-self:flex-start;font:600 13px var(--f-mono);color:var(--uc);border:1.5px solid var(--uc);border-radius:6px;padding:3px 9px;letter-spacing:.04em}
.topic-head .display{font-size:clamp(30px,4.6vw,50px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:10;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:7px;align-items:center;text-decoration:none}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--uc)}
.tab .n{font:500 11px var(--f-mono);color:var(--faint)}
.layout-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
@media (max-width:1100px){.layout-2{grid-template-columns:1fr}}
.aside{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.aside{position:static}}

.notes{max-width:72ch}
.notes section{margin-bottom:34px;scroll-margin-top:130px}
.notes h3{font:700 23px/1.2 var(--f-display);margin:0 0 12px;display:flex;gap:12px;align-items:baseline}
.notes h3 .k{font:600 12px var(--f-mono);color:var(--uc);letter-spacing:.04em;flex:none}
.notes h4{font-size:16px;margin:18px 0 6px}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin:4px 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0 14px}
.tbl table{border-collapse:collapse;font-size:14px;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.box{position:relative;border-radius:12px;padding:14px 16px 12px;margin:14px 0;background:var(--surface);border:1px solid var(--line)}
.box>b.lbl{display:block;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.box.def{border-left:3px solid var(--uc)}
.box.def>b.lbl{color:var(--uc)}
.box.tip{background:var(--gilt-soft);border-color:transparent}
.box.tip>b.lbl{color:var(--gilt)}
.box.warn{background:var(--bad-soft);border-color:transparent}
.box.warn>b.lbl{color:var(--bad)}
.box.stat{border-left:3px solid var(--seal);font-family:var(--f-display);font-size:15.5px}
.box.stat>b.lbl{color:var(--seal);font-family:var(--f-mono)}
.box.stat p{margin:0 0 6px}
.box.news{background:var(--info-soft);border-color:transparent}
.box.news>b.lbl{color:var(--info)}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;font-size:13.5px}
.toc a:hover{color:var(--ink);border-color:var(--uc)}

/* case citations: clickable chips */
.case{display:inline;border:0;padding:0 1px;background:none;font-family:var(--f-display);font-style:italic;font-size:1.02em;color:var(--ink);border-bottom:1.5px dotted var(--uc,var(--accent));cursor:pointer;text-align:left;line-height:inherit}
.case:hover{color:var(--uc,var(--accent));background:color-mix(in srgb,var(--uc,var(--accent)) 10%,transparent)}
.case .yr{font-style:normal;font-family:var(--f-body);font-size:.88em;color:var(--muted)}
.pop{position:fixed;z-index:120;width:min(380px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px 16px;font-size:14px;animation:tin .15s ease}
.pop h4{font:italic 700 17px/1.25 var(--f-display);margin:0 0 2px}
.pop .meta{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.pop p{margin:0 0 8px}
.pop .law{padding:8px 10px;border-radius:9px;background:var(--accent-soft);color:var(--ink)}

.spec-list{display:flex;flex-direction:column;gap:6px}
.spec-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.45;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.rag{display:flex;gap:3px;margin-top:1px}
.rag button{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-2);background:none;padding:0}
.rag button.on[data-v="1"]{background:var(--bad);border-color:var(--bad)}
.rag button.on[data-v="2"]{background:var(--warn);border-color:var(--warn)}
.rag button.on[data-v="3"]{background:var(--good);border-color:var(--good)}

/* evaluation (AO3) */
.debate{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin:10px 0 16px}
.debate>div{padding:14px 16px}
.debate>div+div{border-left:1px solid var(--line)}
.debate h5{margin:0 0 8px;font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.debate .for h5{color:var(--good)}
.debate .ag h5{color:var(--bad)}
.debate ul{margin:0;padding-left:18px;font-size:14px}
.debate li{margin:5px 0}
.debate .q{grid-column:1/-1;background:var(--surface-2);border-bottom:1px solid var(--line);font:italic 600 16px/1.4 var(--f-display)}
@media (max-width:640px){.debate{grid-template-columns:1fr}.debate>div+div{border-left:0;border-top:1px solid var(--line)}}

/* worked answers */
.worked{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:16px}
.worked .wq{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.worked ol{margin:0;padding:12px 18px 12px 42px}
.worked li{margin:7px 0}
.worked li.hid{display:none}
.worked li b.st{font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--uc);margin-right:6px}
.worked .wf{display:flex;gap:10px;padding:10px 18px 14px;align-items:center;flex-wrap:wrap}
.ans{font-weight:600;padding:8px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}

/* case list (topic tab + casebook) */
.case-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.case-card{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--uc)}
.case-card h4{font:italic 700 16.5px/1.3 var(--f-display)}
.case-card .meta{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.03em}
.case-card p{margin:0;font-size:14px}
.case-card .law{font-size:13.5px;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.case-card.cover .f{filter:blur(6px);cursor:pointer;transition:filter .2s}
.case-card.cover.peek .f{filter:none}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:780px}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.q-prog{flex:1;min-width:120px;display:flex;gap:3px}
.q-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.q-prog i.c{background:var(--good)} .q-prog i.w{background:var(--bad)} .q-prog i.cur{background:var(--uc)}
.q-text{font-size:18.5px;line-height:1.5;margin:6px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;line-height:1.45;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--line-2);transform:translateX(2px)}
.opt .k{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--paper-2);font:600 13px var(--f-mono)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.explain b.v{font:700 12.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.explain b.v.good{color:var(--good)} .explain b.v.bad{color:var(--bad)}
.result{text-align:center;padding:30px 20px}
.result .big{font:700 84px/1 var(--f-display);color:var(--uc)}

/* exam / self-mark */
.examq{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.examq .eh{display:flex;gap:12px;padding:16px 18px;align-items:flex-start}
.examq .eh .mk{margin-left:auto;flex:none}
.examq .scen{margin:0 18px 12px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border-left:3px solid var(--uc);font-size:14.5px}
.examq textarea{display:block;width:calc(100% - 36px);margin:0 18px 12px;min-height:110px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);resize:vertical;font-size:14.5px}
.ms{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px;cursor:pointer}
.ms input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}
.levels{font-size:13px;margin-top:10px}
.levels td:first-child{white-space:nowrap;font-family:var(--f-mono)}

/* flashcards */
.fc-stage{perspective:1400px;max-width:660px;margin:0 auto}
.fc{position:relative;height:310px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:34px 30px 26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:18.5px;line-height:1.5;overflow:auto}
.fc>div .eyebrow{position:absolute;top:16px;left:0;right:0}
.fc .back{transform:rotateY(180deg);background:var(--surface-2);font-size:16.5px}
.fc .front{border-top:3px solid var(--uc)}
.fc-ctl{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.boxes{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.boxes span{font:500 11px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--paper-2);color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:10px;background:var(--paper-2)}
.seg button{flex:1;padding:6px 10px;border:0;border-radius:7px;background:none;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Tools (explore) ---------- */
.tool{border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.tool-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tool-head h3{font:700 21px/1.2 var(--f-display)}
.tool-head p{margin:6px 0 0;color:var(--ink-2);font-size:14.5px;max-width:70ch}
.tool-body{padding:18px 20px 20px}
.tool-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tree-path{display:flex;flex-direction:column;gap:10px}
.tree-step{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.tree-step .dotn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--paper-2);color:var(--ink-2)}
.tree-step.done .dotn{background:var(--uc);color:var(--surface)}
.tree-q{font-weight:600;margin:3px 0 8px}
.tree-help{font-size:13.5px;color:var(--muted);margin:-4px 0 8px}
.tree-opts{display:flex;flex-wrap:wrap;gap:8px}
.pickb{padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);text-align:left;font-size:14px;line-height:1.35}
.pickb:hover{border-color:var(--uc)}
.pickb.on{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 12%,var(--surface));font-weight:600}
.pickb[disabled]{cursor:default}
.pickb[disabled]:not(.on){opacity:.5}
.verdict{border-radius:14px;padding:16px 18px;border:1.5px solid var(--uc);background:color-mix(in srgb,var(--uc) 7%,var(--surface))}
.verdict .v{font:700 22px/1.2 var(--f-display);margin-bottom:6px}
.verdict.good{border-color:var(--good);background:var(--good-soft)}
.verdict.bad{border-color:var(--bad);background:var(--bad-soft)}
.verdict.mid{border-color:var(--warn);background:var(--warn-soft)}
.sort-list{display:flex;flex-direction:column;gap:8px}
.sort-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sort-row.ok{border-color:var(--good);background:var(--good-soft)}
.sort-row.no{border-color:var(--bad);background:var(--bad-soft)}
.sort-t{font-size:14.5px}
.sort-b{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.sort-b .pickb{padding:5px 10px;font-size:12.5px}
.sort-why{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
@media (max-width:640px){.sort-row{grid-template-columns:1fr}.sort-b{justify-content:flex-start}}
.stepper{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.stepper .rail{display:flex;flex-direction:column;gap:4px}
.stepper .rail button{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;border:0;background:none;text-align:left;font-size:13.5px;color:var(--muted)}
.stepper .rail button span.n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);background:var(--paper-2)}
.stepper .rail button.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.stepper .rail button.on span.n,.stepper .rail button.past span.n{background:var(--uc);color:var(--surface)}
.stepper .pane{min-height:200px}
.stepper .pane h4{font:700 20px/1.2 var(--f-display);margin:0 0 8px}
@media (max-width:760px){.stepper{grid-template-columns:1fr}.stepper .rail{flex-direction:row;overflow-x:auto}.stepper .rail button{grid-template-columns:24px auto;white-space:nowrap}}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px;gap:8px}
.ctl label output{font:600 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl{margin-bottom:12px}
.ds-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.ds-grid{grid-template-columns:1fr}}
.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ro{padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.ro span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ro b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.rung.on{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 10%,var(--surface));font-weight:600}
.rung .lv{font:600 11px var(--f-mono);color:var(--muted)}
.court-map{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.court{padding:9px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left}
.court.dec{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 12%,var(--surface));font-weight:600}
.court.bind{border-color:var(--bad);background:var(--bad-soft)}
.court.pers{border-color:var(--warn);background:var(--warn-soft)}
.court.free{border-color:var(--good);background:var(--good-soft)}
.court small{font:500 11px var(--f-mono);color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--uc) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--uc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--uc);margin-top:-7px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--uc)}
select,.inp{padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}

/* ---------- Search palette & dialogs ---------- */
.palette-back{position:fixed;inset:0;background:rgba(5,10,8,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.palette{width:min(660px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;background:none;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:55vh;overflow-y:auto}
.palette li a{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none}
.palette li a.sel,.palette li a:hover{background:var(--surface-2)}
.palette li .t{font-weight:500}
.palette li .s{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette .kind{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);min-width:56px}
.settings-dlg{padding:22px;max-width:600px;max-height:84vh;overflow-y:auto}
.route-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.route-opt{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);text-align:left}
.route-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.route-opt b{font-size:14px}
.route-opt span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.route-grid{grid-template-columns:1fr}}

/* ---------- Toast & fx ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
@media (max-width:900px){.toasts{bottom:84px;right:12px;left:12px;align-items:stretch}}
.toast{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow-lg);font-size:14px;animation:tin .3s ease}
.toast b{font:700 17px var(--f-display);color:var(--gilt)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:150;width:100%;height:100%}

/* ---------- Arcade ---------- */
.game-card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.game-card:hover{transform:translateY(-2px);border-color:var(--uc)}
.game-card .art{height:104px;border-radius:12px;background:#10261C;position:relative;overflow:hidden}
.game-card .art canvas{width:100%;height:100%;display:block}
.game{max-width:780px;margin:0 auto}
.game-hud{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hud{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:90px}
.hud span{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud b{font:700 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.big-prompt{font:600 clamp(19px,2.6vw,25px)/1.4 var(--f-display);margin:10px 0 20px;text-align:center;text-wrap:balance}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--gilt);transition:width .1s linear}

/* misc */
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.kbd-hint{font-size:12px;color:var(--faint);margin-top:10px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;opacity:.45;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--gilt)}
.badge .ic{font:700 28px var(--f-display);color:var(--gilt)}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.heat a{aspect-ratio:1.3;border-radius:7px;display:grid;place-items:center;font:600 10px var(--f-mono);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.prac{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
.prac summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.prac summary::-webkit-details-marker{display:none}
.prac[open] summary{border-bottom:1px solid var(--line)}
.prac .pb{padding:14px 18px}
.chev{margin-left:auto;transition:transform .2s;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.prac[open] .chev{transform:rotate(180deg)}
.note-strip{font-size:12.5px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed var(--line-2);margin-top:24px}
.onboard{border:1px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.linkcard{text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s}
.linkcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.filters input[type=search]{flex:1;min-width:200px;max-width:420px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface)}
.stat-list{display:flex;flex-direction:column;gap:10px}
.statute{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;border-left:3px solid var(--uc)}
.statute h4{font:700 17px/1.25 var(--f-display);margin:0 0 8px}
.statute dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.statute dt{font:600 12.5px var(--f-mono);color:var(--uc);white-space:nowrap}
.statute dd{margin:0}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.gloss div{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.gloss b{font:italic 700 16px var(--f-display);display:block}
.gloss span{font-size:13.5px;color:var(--ink-2)}

<script>
/* ---- core.js ---- */
/* ==========================================================
   Ratio · core utilities: DOM, rich text, storage, XP, sound, fx
   ========================================================== */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const h = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if (html) e.innerHTML = html; return e; };

/* ---------- Content registries (filled by data files) ---------- */
const CASES = {};      // id -> { n: name, y: year, a: area, t: topic id, f: facts, p: principle, c: court }
const STATUTES = [];   // { n, a, s: [[section, text]] }
const GLOSSARY = [];   // [term, meaning, area]
const TOPICS = [];
const TOOLS = {};      // id -> tool definition
const addCases = list => list.forEach(c => { CASES[c.id] = c; });

/* ---------- Rich text ----------
   [[c:id]]  -> clickable case citation (opens a popover with facts + principle)
   [[c:id|label]] -> same, with custom label */
function caseChip(id, label) {
  const c = CASES[id];
  if (!c) return `<i class="cn">${esc(label || id)}</i>`;
  return `<button type="button" class="case" data-case="${id}">${esc(label || c.n)}${label ? '' : ` <span class="yr">(${c.y})</span>`}</button>`;
}
function rich(html) {
  if (html == null) return '';
  return String(html).replace(/\[\[c:([\w-]+)(?:\|([^\]]+))?\]\]/g, (_, id, lab) => caseChip(id, lab));
}
/* plain text version for search / games */
const plain = s => String(s || '').replace(/\[\[c:([\w-]+)(?:\|([^\]]+))?\]\]/g, (_, id, lab) => lab || (CASES[id] ? CASES[id].n : id)).replace(/<[^>]+>/g, '');

/* ---------- Storage ---------- */
const STORE_KEY = 'ratio.eduqas.law.v1';
const S = (() => {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { d = {}; }
  d.xp ??= 0; d.topics ??= {}; d.badges ??= []; d.settings ??= { sound: true }; d.settings.areas ??= ['CT', 'TO', 'CR', 'HR'];
  d.streak ??= { last: '', n: 0 }; d.days ??= {}; d.games ??= {}; d.daily ??= {}; d.fav ??= [];
  d.stats ??= { quizzes: 0, perfect: 0, cardsSeen: 0, tools: [], mocks: 0, examMarks: 0, applied: 0 };
  return d;
})();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
function T(id) { return S.topics[id] ??= { quiz: 0, cards: {}, spec: {}, exam: 0, seen: 0, apply: 0 }; }
const pad2 = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => dstr(new Date());
function touchStreak() {
  const t = today(); if (S.streak.last === t) return;
  const ys = dstr(new Date(Date.now() - 864e5));
  S.streak.n = S.streak.last === ys ? S.streak.n + 1 : 1; S.streak.last = t; save();
}
function addXP(n, why) {
  S.xp += n; touchStreak(); S.days[today()] = (S.days[today()] || 0) + n; save();
  window.App && App.refreshChrome();
  if (why) toast(`<b>+${n}</b> ${esc(why)}`);
  checkBadges();
}
const LEVELS = [0, 100, 250, 500, 850, 1300, 1900, 2600, 3500, 4600, 6000, 7700, 9700, 12000, 15000];
const LEVEL_NAMES = ['Law student', 'Paralegal', 'Trainee solicitor', 'Pupil barrister', 'Solicitor', 'Junior barrister', 'Recorder', 'District judge', 'Circuit judge', 'King’s Counsel', 'High Court judge', 'Lord Justice of Appeal', 'Justice of the Supreme Court', 'Deputy President', 'President of the Supreme Court'];
function level() { let l = 0; while (l < LEVELS.length - 1 && S.xp >= LEVELS[l + 1]) l++; const next = LEVELS[l + 1] ?? LEVELS[l] * 1.3; return { l: l + 1, name: LEVEL_NAMES[l], frac: (S.xp - LEVELS[l]) / (next - LEVELS[l]), next }; }

/* ---------- Sound ---------- */
let AC = null;
function tone(freqs, dur = .12, type = 'sine', vol = .06) {
  if (!S.settings.sound) return;
  try {
    AC ??= new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      const s = t0 + i * dur * .8;
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + dur);
      o.start(s); o.stop(s + dur + .02);
    });
  } catch (e) { }
}
const sfx = {
  good: () => tone([660, 880], .11, 'triangle'),
  bad: () => tone([220, 180], .14, 'sawtooth', .03),
  flip: () => tone([520], .05, 'sine', .03),
  win: () => tone([523, 659, 784, 1047], .13, 'triangle'),
  gavel: () => tone([140, 110], .09, 'square', .04)
};

/* ---------- Toasts ---------- */
function toast(html, ms = 2200) {
  let box = $('.toasts'); if (!box) { box = h('div', { class: 'toasts' }); document.body.append(box); }
  const t = h('div', { class: 'toast', role: 'status' }, html); box.append(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, ms);
}

/* ---------- Celebration: gilt and green paper ---------- */
const BURST_COLS = [[217, 180, 90], [108, 203, 156], [229, 122, 138], [122, 174, 240], [245, 241, 228]];
function burst(x = innerWidth / 2, y = innerHeight / 2, n = 90) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = h('canvas', { class: 'fx' }); document.body.append(c);
  const dpr = devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const x2 = c.getContext('2d'); x2.scale(dpr, dpr);
  const P = Array.from({ length: n }, () => { const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 7; return { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, col: pick(BURST_COLS), life: 1, r: Math.random() * 6 }; });
  let f = 0;
  (function step() {
    x2.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .15; p.vx *= .985; p.life -= .012; p.r += .2; x2.save(); x2.translate(p.x, p.y); x2.rotate(p.r); x2.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${Math.max(0, p.life)})`; x2.fillRect(-4, -2, 8, 4); x2.restore(); });
    if (++f < 90) requestAnimationFrame(step); else c.remove();
  })();
}
function cssVar(name, el = document.documentElement) { return getComputedStyle(el).getPropertyValue(name).trim(); }
function hexA(hex, a) {
  hex = (hex || '#888').trim();
  if (hex.startsWith('rgb')) return hex.replace(/rgba?\(([^)]+)\)/, (_, v) => `rgba(${v.split(',').slice(0, 3).join(',')},${a})`);
  let n = hex.replace('#', ''); if (n.length === 3) n = n.split('').map(c => c + c).join('');
  const v = parseInt(n, 16); return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
}

  gavel: '<svg viewBox="0 0 24 24"><path d="M14 4l6 6M11 7l6 6M12.5 5.5l-4 4 6 6 4-4zM9.5 11.5L3 18l3 3 6.5-6.5M13 21h8"/></svg>'
};

/* ---- tools.js ---- */
/* ==========================================================
   Explore tools: three data-driven engines + bespoke tools
   - tree : a decision tree that walks the learner through the legal tests
   - sort : classify statements / facts into categories, then check
   - steps: a stepper through a process or timeline
   ========================================================== */
function toolShell(host, t, body) {
  host.innerHTML = `<div class="tool"><div class="tool-head"><div class="eyebrow">${esc(t.kind || 'Interactive')}</div><h3>${esc(t.title)}</h3>${t.intro ? `<p>${rich(t.intro)}</p>` : ''}</div><div class="tool-body">${body}</div></div>`;
  return $('.tool-body', host);
}

/* ---------- decision tree ---------- */
function mountTree(host, t) {
  let path = [t.start || 'start'];
  const render = () => {
    const body = toolShell(host, { ...t, kind: t.kind || 'Decision tree · apply the legal test' }, '<div class="tree-path" id="tp"></div><div class="row" style="margin-top:16px"><button class="btn sm" id="tr-reset">' + ICON.reset + ' Start again</button></div>');
    const tp = $('#tp', body);
    path.forEach((id, i) => {
      const n = t.nodes[id]; if (!n) return;
      if (n.end) {
        tp.insertAdjacentHTML('beforeend', `<div class="verdict ${n.tone || ''}"><div class="v">${rich(n.v)}</div><div>${rich(n.x || '')}</div>${n.cases ? `<p class="small" style="margin:8px 0 0">Authority: ${n.cases.map(c => caseChip(c)).join(', ')}</p>` : ''}</div>`);
        return;
      }
      const chosen = path[i + 1];
      const step = h('div', { class: 'tree-step' + (chosen ? ' done' : '') }, `<span class="dotn">${i + 1}</span><div><div class="tree-q">${rich(n.q)}</div>${n.help ? `<div class="tree-help">${rich(n.help)}</div>` : ''}<div class="tree-opts">${n.o.map(([lab, nx], k) => `<button class="pickb ${chosen && chosen === nx && path[i + 1] === nx && n._k === k ? 'on' : ''}" data-k="${k}" ${chosen ? 'disabled' : ''}>${rich(lab)}</button>`).join('')}</div></div>`);
      tp.append(step);
      $$('.pickb', step).forEach(b => b.onclick = () => { n._k = +b.dataset.k; path = path.slice(0, i + 1).concat(n.o[+b.dataset.k][1]); sfx.flip(); render(); if (t.nodes[path[path.length - 1]]?.end) sfx.gavel(); });
    });
    $('#tr-reset', body).onclick = () => { path = [t.start || 'start']; Object.values(t.nodes).forEach(n => delete n._k); render(); };
  };
  render();
}

/* ---------- sorter ---------- */
function mountSort(host, t) {
  let items = shuffle(t.items), ans = {}, checked = false;
  const render = () => {
    const body = toolShell(host, { ...t, kind: t.kind || 'Sorter · classify each one' }, `<div class="sort-list">${items.map((it, i) => {
      const cls = checked ? (ans[i] === it[1] ? 'ok' : 'no') : '';
      return `<div class="sort-row ${cls}"><div class="sort-t">${rich(it[0])}</div><div class="sort-b">${t.cats.map(c => `<button class="pickb ${ans[i] === c ? 'on' : ''}" data-i="${i}" data-c="${esc(c)}" ${checked ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>${checked ? `<div class="sort-why">${ans[i] === it[1] ? '✓' : '✗ Answer: <b>' + esc(it[1]) + '</b>.'} ${rich(it[2] || '')}</div>` : ''}</div>`;
    }).join('')}</div><div class="row" style="margin-top:14px">${checked ? `<span class="pill ${score() === items.length ? 'good' : 'warn'}">${score()} / ${items.length} correct</span><button class="btn sm" id="so-again">${ICON.reset} Shuffle and try again</button>` : `<button class="btn primary sm" id="so-check">Check answers</button><span class="small muted">${Object.keys(ans).length} of ${items.length} sorted</span>`}</div>`);
    $$('.pickb', body).forEach(b => b.onclick = () => { ans[+b.dataset.i] = b.dataset.c; render(); });
    const ck = $('#so-check', body); if (ck) ck.onclick = () => { checked = true; const s = score(); if (s === items.length) { sfx.win(); addXP(15, 'Perfect sort'); } else sfx.gavel(); render(); };
    const ag = $('#so-again', body); if (ag) ag.onclick = () => { items = shuffle(t.items); ans = {}; checked = false; render(); };
  };
  const score = () => items.filter((it, i) => ans[i] === it[1]).length;
  render();
}

/* ---------- stepper ---------- */
function mountSteps(host, t) {
  let k = 0;
  const render = () => {
    const s = t.steps[k];
    const body = toolShell(host, { ...t, kind: t.kind || 'Step through the process' }, `<div class="stepper"><div class="rail">${t.steps.map((st, i) => `<button data-i="${i}" class="${i === k ? 'on' : i < k ? 'past' : ''}"><span class="n">${i + 1}</span><span>${esc(st.h)}</span></button>`).join('')}</div>
      <div class="pane"><div class="eyebrow">Stage ${k + 1} of ${t.steps.length}</div><h4>${esc(s.h)}</h4><div class="notes" style="max-width:none">${rich(s.html)}</div>
      <div class="row" style="margin-top:14px"><button class="btn sm" id="st-prev" ${k ? '' : 'disabled'}>${ICON.back} Back</button><button class="btn sm primary" id="st-next" ${k < t.steps.length - 1 ? '' : 'disabled'}>Next ${ICON.arrow}</button></div></div></div>`);
    $$('.rail button', body).forEach(b => b.onclick = () => { k = +b.dataset.i; render(); });
    $('#st-prev', body).onclick = () => { k--; render(); };
    $('#st-next', body).onclick = () => { k++; sfx.flip(); render(); };
  };
  render();
}

/* ---------- bespoke: is this precedent binding? ---------- */
const COURTS = [
  { id: 'echr', n: 'European Court of Human Rights', s: 'Strasbourg · s2 HRA 1998' },
  { id: 'uksc', n: 'Supreme Court', s: 'formerly House of Lords' },
  { id: 'jcpc', n: 'Judicial Committee of the Privy Council', s: 'Commonwealth appeals' },
  { id: 'cacv', n: 'Court of Appeal (Civil Division)', s: '' },
  { id: 'cacr', n: 'Court of Appeal (Criminal Division)', s: '' },
  { id: 'dc', n: 'Divisional Courts of the High Court', s: 'e.g. KBD Divisional Court' },
  { id: 'hc', n: 'High Court (single judge)', s: '' },
  { id: 'crown', n: 'Crown Court', s: '' },
  { id: 'county', n: 'County Court', s: '' },
  { id: 'mags', n: 'Magistrates’ courts', s: '' }
];
function precedentRule(dec, prev) {
  if (prev === 'echr') return ['pers', 'Must take into account (s2 HRA 1998)', 'Strasbourg rulings are not binding on UK courts, but courts must “take into account” them. The Supreme Court usually follows a “clear and constant” line of Strasbourg case law ([[c:horncastle|R v Horncastle]] shows it may decline).'];
  if (prev === 'jcpc') return ['pers', 'Persuasive', 'Privy Council decisions are persuasive only — but a Privy Council board can direct that its decision represents English law, which lower English courts then follow ([[c:holley|AG for Jersey v Holley]]; [[c:jameskarimi|R v James and Karimi]]). The Court of Appeal may also follow the Privy Council rather than its own earlier decision ([[c:willers|Willers v Joyce]]).'];
  if (dec === 'jcpc') return ['pers', 'Persuasive only', 'The Privy Council is outside the English hierarchy; English decisions are persuasive to it.'];
  if (dec === 'echr') return ['pers', 'Persuasive only', 'Strasbourg does not follow UK precedent; it has its own practice of following its earlier rulings unless there is good reason.'];
  const rank = { uksc: 1, cacv: 2, cacr: 2, dc: 3, hc: 4, crown: 5, county: 5, mags: 6 };
  const rd = rank[dec], rp = rank[prev];
  if (dec === 'uksc' && prev === 'uksc') return ['free', 'Normally follows — but can depart', 'The Supreme Court is bound by its own earlier decisions (and those of the House of Lords) but may depart “when it appears right to do so” under the [[c:ps1966|Practice Statement 1966]] — e.g. [[c:herrington|BRB v Herrington]], [[c:shivpuri|R v Shivpuri]], [[c:rvg|R v G]].'];
  if (rp < rd) {
    if ((prev === 'cacv' && dec === 'cacr') || (prev === 'cacr' && dec === 'cacv')) return ['pers', 'Persuasive', 'The two divisions of the Court of Appeal do not bind each other.'];
    return ['bind', 'Binding', 'A court is bound by the decisions of the courts above it in the hierarchy (stare decisis). It must follow the ratio decidendi, even if it disagrees — unless it can distinguish the case on its material facts.'];
  }
  if (dec === prev) {
    if (dec === 'cacv') return ['bind', 'Binding — with three exceptions', 'The Civil Division is bound by its own previous decisions, except in the three [[c:youngbristol|Young v Bristol Aeroplane]] situations: (1) two conflicting decisions — choose one; (2) a decision inconsistent with a later Supreme Court decision; (3) a decision made per incuriam (in error, without considering a relevant statute or binding case).'];
    if (dec === 'cacr') return ['bind', 'Binding — but more flexible', 'The Criminal Division follows [[c:youngbristol|Young v Bristol Aeroplane]] and may also depart if the law was “misapplied or misunderstood” and the liberty of the individual is at stake ([[c:rtaylor|R v Taylor]] (1950); [[c:gould|R v Gould]]).'];
    if (dec === 'dc') return ['bind', 'Binding (usually)', 'Divisional Courts are normally bound by their own previous decisions (with the Young exceptions); in criminal appeals they have the same flexibility as the Criminal Division.'];
    if (dec === 'hc') return ['pers', 'Persuasive', 'A High Court judge is not bound by another High Court judge’s decision, though it is usually followed for consistency.'];
    return ['free', 'Not binding', 'Crown Court, County Court and magistrates’ court decisions do not create binding precedents.'];
  }
  return ['pers', 'Not binding (lower court)', 'A decision of a lower court never binds a higher court. It may be persuasive if the reasoning is strong.'];
}
function mountBinding(host) {
  let dec = 'cacv', prev = 'uksc';
  const render = () => {
    const [cls, v, x] = precedentRule(dec, prev);

/* ---------- bespoke: PACE detention clock ---------- */
function mountDetention(host) {
  let hrs = 20, indictable = true, terror = false;
  const render = () => {
    const stages = terror ? [[0, 'Arrest under s41 Terrorism Act 2000', 'Review by a senior officer at least every 12 hours.'], [48, 'Police may hold for up to 48 hours', 'Then a warrant of further detention is needed from a judge.'], [336, 'Maximum 14 days', 'Judge may extend in stages up to 14 days in total (Protection of Freedoms Act 2012 cut this from 28 days).']]
      : [[0, 'Arrival at the police station (s41 PACE)', 'The custody clock starts. Custody officer decides whether there is enough evidence to charge or whether detention is necessary. Rights read: legal advice (s58), someone informed (s56), codes of practice (Code C).'], [6, 'First review by inspector', 'Review of detention within 6 hours, then every 9 hours (s40).'], [24, 'Basic limit: 24 hours', 'Must be charged or released (s41) unless extended.'], ...(indictable ? [[36, 'Superintendent extension to 36 hours', 'For an indictable offence, if needed to secure or obtain evidence and the investigation is being conducted diligently (s42).'], [96, 'Magistrates’ warrant: maximum 96 hours', 'Magistrates’ court can issue a warrant of further detention up to 96 hours in total (ss43–44). The suspect is entitled to be legally represented at the hearing.']] : [])];
    const max = stages[stages.length - 1][0];
    const cur = stages.filter(s => s[0] <= hrs).pop();
    const lawful = hrs <= max;
    const body = toolShell(host, { kind: 'Interactive · police powers', title: 'The detention clock', intro: 'How long can the police hold a suspect without charge? Drag the clock and change the type of offence.' },
      `<div class="ds-grid"><div><div class="ctl"><label for="dc-h">Hours since arrival at the station <output>${hrs} h</output></label><input id="dc-h" type="range" min="0" max="${terror ? 340 : 100}" step="1" value="${hrs}" style="--p:${hrs / (terror ? 340 : 100) * 100}%"></div>
      <div class="ctl"><label>Offence</label><div class="seg" id="dc-t"><button data-k="s" class="${!indictable && !terror ? 'on' : ''}">Summary</button><button data-k="i" class="${indictable && !terror ? 'on' : ''}">Indictable</button><button data-k="t" class="${terror ? 'on' : ''}">Terrorism</button></div></div>
      <div class="verdict ${lawful ? 'good' : 'bad'}"><div class="v">${lawful ? 'Detention can be lawful' : 'Must be charged or released'}</div><div class="small">${lawful ? esc(cur[1]) + '. ' + esc(cur[2]) : 'Detention beyond the maximum is unlawful: the suspect could sue for <b>false imprisonment</b>, and any evidence obtained may be excluded (s78 PACE).'}</div></div></div>
      <div class="ladder">${stages.map(s => `<div class="rung ${s === cur && lawful ? 'on' : ''}"><span class="lv">${s[0]} h</span><span>${esc(s[1])}<br><span class="small muted" style="font-weight:400">${esc(s[2])}</span></span><span></span></div>`).join('')}</div></div>`);
    $('#dc-h', body).oninput = e => { hrs = +e.target.value; render(); $('#dc-h', host).focus(); };
    $$('#dc-t button', body).forEach(b => b.onclick = () => { indictable = b.dataset.k !== 's'; terror = b.dataset.k === 't'; hrs = Math.min(hrs, terror ? 340 : 100); render(); });
  };
  render();
}

/* ---------- bespoke: contributory negligence calculator ---------- */
function mountApportion(host) {
  let dmg = 40000, pct = 25, belt = false;
  const render = () => {
    const red = Math.round(dmg * pct / 100);
    const body = toolShell(host, { kind: 'Interactive · defences in tort', title: 'Contributory negligence', intro: 'Under the Law Reform (Contributory Negligence) Act 1945 s1, damages are reduced “to such extent as the court thinks just and equitable having regard to the claimant’s share in the responsibility for the damage”. It is a partial defence: the claimant still wins.' },
      `<div class="ds-grid"><div><div class="ctl"><label for="ap-d">Full value of the claim <output>£${dmg.toLocaleString('en-GB')}</output></label><input id="ap-d" type="range" min="1000" max="200000" step="1000" value="${dmg}" style="--p:${(dmg - 1000) / 1990}%"></div>
      <div class="ctl"><label for="ap-p">Claimant’s share of responsibility <output>${pct}%</output></label><input id="ap-p" type="range" min="0" max="75" step="5" value="${pct}" style="--p:${pct / .75}%"></div>
      <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ap-b" ${belt ? 'checked' : ''}> Apply the <i class="cn">Froom v Butcher</i> seatbelt guideline</label></div>
      <div><div class="readouts"><div class="ro"><span>Full damages</span><b>£${dmg.toLocaleString('en-GB')}</b></div><div class="ro"><span>Reduction (${pct}%)</span><b>−£${red.toLocaleString('en-GB')}</b></div><div class="ro"><span>Claimant receives</span><b>£${(dmg - red).toLocaleString('en-GB')}</b></div></div>
      <div class="box tip" style="margin-top:12px"><b class="lbl">Guide from the cases</b><ul class="small"><li>[[c:froom]]: no seatbelt — 25% if wearing one would have prevented the injury entirely; 15% if it would have made it less severe; 0% if it would have made no difference.</li><li>[[c:sayers]]: 25% for climbing out over a toilet-roll holder when locked in a cubicle.</li><li>[[c:owens]]: 20% for accepting a lift from a driver known to have been drinking.</li><li>[[c:jayes]]: 100% reductions are not possible — the Act assumes both parties share fault.</li></ul></div></div></div>`);
    $('#ap-d', body).oninput = e => { dmg = +e.target.value; render(); $('#ap-d', host).focus(); };
    $('#ap-p', body).oninput = e => { pct = +e.target.value; belt = false; render(); $('#ap-p', host).focus(); };
    $('#ap-b', body).onchange = e => { belt = e.target.checked; if (belt) pct = 25; render(); };
  };
  render();
}

/* ---------- bespoke: guilty plea sentence credit ---------- */
function mountPlea(host) {
  let months = 36, stage = 0;
  const STAGES = [['First stage of proceedings', 1 / 3, 'Plea indicated at the first hearing (usually the magistrates’ court).'], ['After the first stage', 1 / 4, 'Maximum one-quarter reduction if the plea is entered after the first stage but before trial.'], ['On the day of trial', 1 / 10, 'Reduced to one-tenth on the first day of trial, and can be decreased further, even to zero, during the trial.']];
  const render = () => {
    const [lab, f, x] = STAGES[stage], after = Math.round(months * (1 - f) * 10) / 10;
    const body = toolShell(host, { kind: 'Interactive · sentencing', title: 'Credit for a guilty plea', intro: 'Section 73 Sentencing Act 2020 requires courts to take a guilty plea into account. The Sentencing Council’s guideline sets a sliding scale: the earlier the plea, the bigger the reduction.' },
      `<div class="ds-grid"><div><div class="ctl"><label for="pl-m">Sentence after trial <output>${months} months</output></label><input id="pl-m" type="range" min="6" max="120" step="1" value="${months}" style="--p:${(months - 6) / 1.14}%"></div>
      <div class="ctl"><label>When is the guilty plea entered?</label><div class="stack" id="pl-s">${STAGES.map((s, i) => `<button class="pickb ${i === stage ? 'on' : ''}" data-i="${i}">${s[0]} · up to ${Math.round(s[1] * 100)}%</button>`).join('')}</div></div></div>
      <div><div class="readouts"><div class="ro"><span>Sentence after trial</span><b>${months} months</b></div><div class="ro"><span>Reduction</span><b>${Math.round(f * 100)}%</b></div><div class="ro"><span>Sentence with plea</span><b>${after} months</b></div></div>
      <p class="small" style="margin-top:12px">${esc(x)}</p><div class="box def"><b class="lbl">Why give credit?</b><p class="small">A guilty plea spares victims and witnesses from giving evidence, saves court time and public money, and gives certainty. Critics say it pressures innocent defendants to plead guilty.</p></div></div></div>`);
    $('#pl-m', body).oninput = e => { months = +e.target.value; render(); $('#pl-m', host).focus(); };
    $$('#pl-s button', body).forEach(b => b.onclick = () => { stage = +b.dataset.i; sfx.flip(); render(); });
  };
  render();
}

const BESPOKE = { binding: mountBinding, track: mountTrack, detention: mountDetention, apportion: mountApportion, plea: mountPlea };
