/* ---------- 2.1.2b Consideration and promissory estoppel ---------- */
TOPICS.push({
  id: '2.1.2b', unit: 'CT', ref: '2.1.2', title: 'Consideration and promissory estoppel',
  short: 'Definition, sufficiency and adequacy, past consideration, existing duties, part payment, promissory estoppel',
  summary: 'English law only enforces promises that are part of a bargain: each side must give something of value — consideration. The rules decide what counts: value but not necessarily adequate value; not past consideration; not merely performing an existing duty (unless there is a practical benefit); and not part payment of a debt. Promissory estoppel, from equity, softens the part-payment rule.',
  spec: ['Definition of consideration: Currie v Misa, Dunlop v Selfridge; executed and executory', 'Consideration must be sufficient but need not be adequate', 'Past consideration and its exceptions', 'Performance of an existing duty: public duty, contractual duty owed to the promisor (Stilk, Hartley, Williams v Roffey), duty owed to a third party', 'Part payment of a debt: Pinnel’s Case and Foakes v Beer, and exceptions', 'Promissory estoppel: High Trees and its requirements'],
  learn: [
    { h: 'What is consideration?', html: `
<p>Consideration is what each party gives or promises in return for the other’s promise: the “<b>price</b> for which the promise of the other is bought” ([[c:dunlopselfridge]]). The classic definition is in [[c:currie]]: a benefit to one party or a detriment to the other.</p>
<ul><li><b>Executory</b> consideration: a promise to do something in the future (“I will pay you on delivery”).</li><li><b>Executed</b> consideration: an act already performed in exchange for a promise (e.g. finding the lost dog in a unilateral contract).</li></ul>
<p>Consideration must <b>move from the promisee</b> — the person enforcing the promise must have provided it ([[c:tweddle]]).</p>` },
    { h: 'Sufficient but not adequate', html: `
<p>Consideration must be <b>sufficient</b> — something the law recognises as having some value — but need not be <b>adequate</b> (a fair price). The courts do not judge bargains.</p>
<ul><li>[[c:thomasthomas]]: £1 a year rent was enough.</li><li>[[c:chappell]]: chocolate wrappers were part of the consideration.</li><li>[[c:whitebluett]]: a son’s promise to stop complaining had no value.</li><li>Natural love and affection is not consideration.</li></ul>` },
    { h: 'Past consideration', html: `
<p>Consideration must be given in return for the promise; something already done before the promise is <b>past consideration</b> and is not good consideration ([[c:mcardle]]; <i>Roscorla v Thomas</i>, 1842).</p>
<div class="box tip"><b class="lbl">Exception</b><p>[[c:lampleigh]], refined in [[c:paoon]]: past consideration is good if (1) the act was done at the promisor’s <b>request</b>; (2) both parties understood it would be <b>paid for</b>; and (3) the payment would have been legally enforceable had it been promised in advance. Example: asking a plumber to fix a leak and afterwards promising £100.</p></div>` },
    { h: 'Performing an existing duty', html: `
<ul><li><b>Existing public duty</b>: not good consideration ([[c:collins]]), but doing <b>more</b> than the duty is ([[c:glasbrook]]).</li>
<li><b>Existing contractual duty owed to the promisor</b>: traditionally not good consideration ([[c:stilk]]), unless the promisee does more than originally required ([[c:hartley]]).</li>
<li>[[c:roffey]] created an important exception: a promise to pay more for the same work is enforceable if the promisor obtains a <b>practical benefit</b> (e.g. avoiding a penalty clause, avoiding the trouble and cost of finding a replacement) and the promise was not obtained by fraud or <b>economic duress</b>.</li>
<li><b>Existing contractual duty owed to a third party</b>: good consideration (<i>Shadwell v Shadwell</i>, 1860; <i>Scotson v Pegg</i>, 1861).</li></ul>` },
    { h: 'Part payment of a debt', html: `
<p>The rule in <b>Pinnel’s Case</b> (1602), confirmed in [[c:foakes]]: payment of a smaller sum on the due date is not consideration for a promise to accept it in full settlement. The creditor can later claim the balance. [[c:selectmove]] held that Williams v Roffey’s practical benefit does not apply to part payment; in [[c:mwb]] the Supreme Court left the rule in place.</p>
<p><b>Exceptions:</b> payment early, at a different place (at the creditor’s request), or with something different in kind (“a horse, hawk or robe” — Pinnel’s Case); payment by a third party; composition agreements with creditors; and <b>promissory estoppel</b>.</p>` },
    { h: 'Promissory estoppel', html: `
<p><b>Promissory estoppel</b> is an equitable doctrine: where one party promises not to enforce their strict legal rights, and the other relies on that promise, the promisor may be <b>prevented (estopped)</b> from going back on it, even without consideration. Based on [[c:hughesmetro]], developed by Denning J in [[c:hightrees]].</p>
<ul><li>There must be an existing <b>legal relationship</b>.</li><li>A clear and unequivocal <b>promise</b> not to enforce strict rights.</li><li><b>Reliance</b> on the promise by the promisee.</li><li>It must be <b>inequitable</b> for the promisor to go back on it — the promisee must have acted fairly ([[c:dcbuilders]]).</li><li>It is a <b>shield, not a sword</b> ([[c:combe]]).</li><li>It is often <b>suspensory</b>: the promisor may be able to reinstate rights for the future with reasonable notice (<i>Tool Metal Manufacturing v Tungsten Electric</i>, 1955), though past arrears may be extinguished (High Trees).</li></ul>` }
  ],
  debate: [{ q: 'Should Foakes v Beer be overruled?', for: ['Creditors often gain a practical benefit from part payment (cash now, avoiding insolvency) — inconsistent with Williams v Roffey.', 'Businesses routinely agree to accept less; the law should reflect commercial reality.', 'Lord Blackburn in Foakes itself had doubts.', 'Promissory estoppel is uncertain as a substitute.'], ag: ['Protects creditors from pressure to accept less (D & C Builders).', 'Certainty: the Supreme Court declined to reconsider it in MWB (2018).', 'Only the Supreme Court can overrule it — CA bound (Selectmove).', 'Economic duress rules may be a better tool than changing consideration.'] }],
  cases: ['currie', 'dunlopselfridge', 'thomasthomas', 'chappell', 'whitebluett', 'mcardle', 'lampleigh', 'paoon', 'collins', 'glasbrook', 'stilk', 'hartley', 'roffey', 'foakes', 'dcbuilders', 'selectmove', 'mwb', 'hightrees', 'combe', 'hughesmetro'],
  worked: [{ q: '<b>Scenario.</b> Jay agreed to rebuild Kim’s wall for £2,000 by 1 May. Half-way through, Jay says he is losing money and will stop unless Kim pays £500 more. Kim, who is hosting a wedding in her garden on 3 May, agrees. Jay finishes on time. Kim now refuses to pay the extra £500. Advise Jay.', s: ['<b class="st">Issue</b>Is Jay’s performance of his existing contractual duty good consideration for Kim’s promise to pay more?', '<b class="st">Rule</b>Stilk v Myrick: performing an existing duty owed to the promisor is not consideration. But Williams v Roffey: it can be, if the promisor gains a practical benefit and there is no economic duress.', '<b class="st">Apply</b>Kim gains a practical benefit: the wall is finished before the wedding, and she avoids the cost and delay of finding another builder.', '<b class="st">Duress?</b>Jay threatened to stop work — was this illegitimate pressure (Atlas Express v Kafco)? He seems genuinely in difficulty and asked rather than exploiting Kim’s position — similar to Roffey, where the extra payment was offered. If it was economic duress, Kim’s promise would be voidable.', '<b class="st">Conclude</b>Jay can probably enforce the promise for £500 under Williams v Roffey, unless Kim can show economic duress.'], a: 'Likely enforceable — practical benefit (Williams v Roffey).' }],
  pitfalls: ['Saying consideration must be adequate or equal in value.', 'Applying Williams v Roffey to part payment of a debt — Re Selectmove says it does not apply.', 'Using promissory estoppel as a cause of action — it is a shield (Combe v Combe).', 'Forgetting the conditions in Pao On for past consideration.'],
  cards: [
    ['Currie v Misa definition?', 'A benefit to one party or a detriment to the other.'],
    ['Consideration must be sufficient but need not be ___?', 'Adequate.'],
    ['Thomas v Thomas (1842)?', '£1 a year was sufficient consideration.'],
    ['Chappell v Nestlé (1960)?', 'Chocolate wrappers were part of the consideration.'],
    ['Re McArdle (1951)?', 'Past consideration is no consideration.'],
    ['Pao On conditions for past consideration?', 'Done at promisor’s request; payment understood; would be enforceable if promised in advance.'],
    ['Stilk v Myrick (1809)?', 'Performing an existing contractual duty is not consideration.'],
    ['Williams v Roffey (1991)?', 'Practical benefit to the promisor can be consideration, absent duress.'],
    ['Foakes v Beer (1884)?', 'Part payment of a debt is not consideration for forgiving the rest.'],
    ['Exceptions to Pinnel’s Case?', 'Early payment, different place, something different in kind, third-party payment, promissory estoppel.'],
    ['Requirements of promissory estoppel?', 'Existing relationship; clear promise; reliance; inequitable to go back.'],
    ['Combe v Combe (1951)?', 'Promissory estoppel is a shield, not a sword.'],
    ['D & C Builders v Rees (1966)?', 'No estoppel where the promisee acted inequitably.'],
    ['Glasbrook Bros v Glamorgan CC (1925)?', 'Exceeding a public duty is good consideration.']
  ],
  quiz: [
    { q: 'In Thomas v Thomas, rent of £1 a year was held to be…', o: ['sufficient consideration', 'inadequate so no contract', 'past consideration', 'a gift'], x: 'Need not be adequate.' },
    { q: 'Which case is an exception to the rule on past consideration?', o: ['Lampleigh v Braithwait', 'Re McArdle', 'Roscorla v Thomas', 'Foakes v Beer'], x: 'Act done at the promisor’s request.' },

  ],
  exam: [

/* ---------- 2.1.2c Intention and privity ---------- */
TOPICS.push({
  id: '2.1.2c', unit: 'CT', ref: '2.1.2', title: 'Intention to create legal relations and privity',
  short: 'Social and domestic presumption, commercial presumption; privity, exceptions, Dunlop v Lambert, the 1999 Act',
  summary: 'An agreement is only a contract if the parties intended it to be legally binding. The courts use presumptions: family and social arrangements are presumed not binding, commercial deals are presumed binding — both can be rebutted. Privity of contract means only the parties can enforce a contract, but there are important exceptions, especially the Contracts (Rights of Third Parties) Act 1999.',
  spec: ['Intention to create legal relations: social and domestic arrangements; rebutting the presumption', 'Commercial and business agreements; honour clauses; comfort letters', 'Privity of contract: the basic rule', 'Exceptions to privity, including Dunlop v Lambert, agency, trusts, collateral contracts and statute', 'The Contracts (Rights of Third Parties) Act 1999'],
  learn: [
    { h: 'Social and domestic agreements', html: `
<p>Agreements between family members and friends are <b>presumed not to be intended to be legally binding</b>.</p>
<ul><li>Spouses living together: [[c:balfour]]. But if they have separated or are about to, the presumption is rebutted: [[c:merritt]].</li>
<li>Parents and children: [[c:jones]].</li>
<li>The presumption can be rebutted by evidence of serious intention: money changing hands or shared contributions ([[c:simpkins]]), major reliance and written terms ([[c:parkerclark]]).</li></ul>` },
    { h: 'Commercial agreements', html: `
<p>In business agreements there is a <b>strong presumption</b> that the parties intend to be legally bound ([[c:edwards]]). The burden of rebutting it is heavy.</p>
<ul><li>An express <b>honour clause</b> can rebut it: [[c:rosefrank]].</li>
<li><b>Letters of comfort</b> (statements of present policy) may not be promises: <i>Kleinwort Benson v Malaysia Mining</i> (1989).</li>
<li>Promotional gifts: [[c:esso]].</li>
<li>Collective agreements between unions and employers are not binding unless in writing and stated to be (Trade Union and Labour Relations (Consolidation) Act 1992 s179).</li></ul>` },
    { h: 'Privity of contract', html: `
<div class="box def"><b class="lbl">The rule</b><p>Only the <b>parties</b> to a contract can sue on it or be bound by it. A third party cannot enforce it, even if it was made for their benefit: [[c:tweddle]]; [[c:dunlopselfridge]].</p></div>
<p>Criticism: it can defeat the parties’ intentions and leave a loss uncompensated — the person with the loss cannot sue, and the person who can sue has no loss. [[c:beswick]] shows the widow only succeeded because she was also her husband’s administratrix.</p>` },
    { h: 'Exceptions to privity', html: `
<ul><li><b>Agency</b>: an agent makes a contract on behalf of a principal, who can sue and be sued.</li>
<li><b>Trusts</b>: a beneficiary under a trust can enforce it.</li>
<li><b>Collateral contracts</b>: [[c:shanklin]].</li>
<li><b>Statute</b>: e.g. third-party motor insurance (Road Traffic Act 1988 s148); Law of Property Act 1925 s56; assignment of rights.</li>
<li><b>Suing for another’s loss</b>: a contracting party may recover damages for a third party’s loss in some situations — family holidays ([[c:jacksonhorizon]]); and the rule in [[c:dunloplambert]]: where it is contemplated that goods (or property) will be transferred to a third party, the original contracting party can recover the third party’s loss for their benefit (extended to building contracts in <i>Linden Gardens Trust v Lenesta Sludge</i>, 1994; limited in <i>Alfred McAlpine v Panatown</i>, 2000, where the third party had its own remedy).</li></ul>` },
    { h: 'The Contracts (Rights of Third Parties) Act 1999', html: `
<p>Following a Law Commission report (1996), the Act allows a third party to enforce a term if:</p>
<ul><li><b>s1(1)(a)</b> the contract <b>expressly</b> provides that they may; or</li>
<li><b>s1(1)(b)</b> the term <b>purports to confer a benefit</b> on them — unless it appears the parties did not intend it to be enforceable by the third party (s1(2)) — [[c:nisshin]].</li>
<li><b>s1(3)</b>: the third party must be expressly identified by <b>name, class or description</b> (they need not exist when the contract is made — e.g. a future owner).</li>
<li><b>s1(5)</b>: the third party has the same remedies as a party.</li>
<li><b>s2</b>: once the third party has assented or relied, the parties cannot vary or cancel the contract without their consent (unless the contract says otherwise).</li>
<li><b>s3</b>: the promisor can raise the same defences against the third party as against the promisee.</li></ul>
<p>Many commercial contracts expressly exclude the Act, and it does not apply to some contracts (e.g. employment contracts against employees).</p>` }
  ],
  debate: [{ q: 'Has the Contracts (Rights of Third Parties) Act 1999 solved the problems of privity?', for: ['Gives effect to the parties’ intentions (e.g. Beswick would now be decided under s1).', 'Clear statutory test; Nisshin shows it working in commercial contracts.', 'Protects third parties who rely on the contract (s2).'], ag: ['Parties routinely contract out of it.', 'The third party must be identified in the contract.', 'Common law exceptions (Dunlop v Lambert, Linden Gardens) remain complex.', 'Uncertainty about when parties “did not intend” enforcement.'] }],
  cases: ['balfour', 'merritt', 'jones', 'simpkins', 'parkerclark', 'rosefrank', 'edwards', 'esso', 'tweddle', 'dunlopselfridge', 'beswick', 'jacksonhorizon', 'dunloplambert', 'shanklin', 'nisshin'],
  worked: [{ q: '<b>Scenario.</b> Mo pays a florist £300 to deliver a wedding bouquet to his sister Nia. The contract says: “Delivery to Nia Jones, the bride.” The bouquet arrives wilted. Advise Nia.', s: ['<b class="st">Privity</b>Nia is not a party to the contract (Tweddle v Atkinson), so at common law she could not sue.', '<b class="st">1999 Act</b>Under s1(1)(b) the delivery term purports to confer a benefit on her, and she is identified by name (s1(3)). Nothing suggests the parties did not intend her to enforce it (s1(2)).', '<b class="st">Remedy</b>She has the same remedies as a party (s1(5)) — damages for breach of the florist’s duty to perform with reasonable care and skill (CRA 2015 s49 applies to Mo as the consumer).', '<b class="st">Alternatively</b>Mo can sue as a party.'], a: 'Nia can enforce the term under the 1999 Act.' }],

  itt: { end: true, tone: 'mid', v: 'Invitation to treat — no offer yet', x: 'The customer makes the offer (at the till or by placing an order); the seller then accepts or refuses.', cases: ['fisherbell', 'boots', 'partridge'] },
  info: { end: true, tone: 'mid', v: 'Supplying information — no offer', x: 'A reply giving a price is not a promise to sell.', cases: ['harvey'] },
  uni: { q: 'Has the other party performed the requested act, knowing of the offer?', o: [['Yes, completely', 'unid'], ['They have started', 'unis'], ['No', 'unin']] },

  unis: { end: true, tone: 'mid', v: 'The offer can no longer be revoked', x: 'Once performance has begun, the offeror cannot revoke.', cases: ['errington'] },
  unin: { end: true, tone: 'mid', v: 'Offer still open — may be revoked', x: 'Revocation of a unilateral offer to the world can be made by the same means used to make it (Shuey v US).' },

  counter: { end: true, tone: 'bad', v: 'Original offer destroyed', x: 'The counter-offer is a new offer that the original offeror may accept. A mere request for information would not destroy the offer (Stevenson v McLean).', cases: ['hyde'] },
  lapse: { end: true, tone: 'bad', v: 'Offer lapsed', x: 'After the stated time or a reasonable time, depending on the subject matter.' },

  inst: { end: true, tone: 'good', v: 'Contract formed when acceptance was received', x: 'Instantaneous communication.', cases: ['entores', 'brinkibon'] },
  email: { end: true, tone: 'good', v: 'Contract probably formed on receipt', x: 'Likely when the email arrives in business hours; websites must acknowledge orders under the E-Commerce Regulations 2002.', cases: ['thomasbpe'] }
} };

  conmore: { end: true, tone: 'good', v: 'Good consideration', x: 'Exceeding the contractual duty.', cases: ['hartley'] },

  partok: { end: true, tone: 'good', v: 'Debt discharged', x: 'An exception to Pinnel’s Case.' },

/* ==========================================================
   SECTION A · LAW OF CONTRACT (continued) — 2.1.3 – 2.1.6
   ========================================================== */
addCases([
  // terms
  { id: 'couchman', n: 'Couchman v Hill', y: 1947, a: 'CT', t: '2.1.3a', c: 'CA', f: 'A heifer was sold at auction “with all faults”. The buyer asked whether it was unserved (not pregnant) and was told it was. It was pregnant and died.', p: 'The oral assurance was a term — the buyer made clear it was vital to him — and it overrode the written “all faults” condition.' },
  { id: 'bannerman', n: 'Bannerman v White', y: 1861, a: 'CT', t: '2.1.3a', c: 'Court of Common Pleas', f: 'A buyer of hops asked whether sulphur had been used, saying he would not buy if it had. The seller said no; it had.', p: 'A statement the buyer makes clear is essential to the deal is a term, not a mere representation.' },
  { id: 'oscarchess', n: 'Oscar Chess v Williams', y: 1957, a: 'CT', t: '2.1.3a', c: 'CA', f: 'A private seller told a car dealer his car was a 1948 model, relying on the registration document (which had been forged). It was a 1939 model.', p: 'A representation, not a term: the seller had no special knowledge and the dealer was the expert.' },
  { id: 'dickbentley', n: 'Dick Bentley Productions v Harold Smith (Motors)', y: 1965, a: 'CT', t: '2.1.3a', c: 'CA', f: 'A car dealer told a private buyer that a Bentley had done only 20,000 miles since a replacement engine. It had done nearly 100,000.', p: 'A term: the dealer had special knowledge and expertise, so the statement was taken as a promise.' },
  { id: 'schawel', n: 'Schawel v Reade', y: 1913, a: 'CT', t: '2.1.3a', c: 'HL', f: 'The buyer began to examine a horse he wanted for stud. The seller said: “You need not look for anything; the horse is perfectly sound.” It was not.', p: 'A term: the seller discouraged the buyer from checking.' },
  { id: 'routledgemckay', n: 'Routledge v McKay', y: 1954, a: 'CT', t: '2.1.3a', c: 'CA', f: 'A seller said a motorcycle was a 1942 model; the written contract a week later did not mention the date. It was a 1930 model.', p: 'A representation, not a term: the time gap and the omission from the written contract suggested it was not intended as a term.' },
  { id: 'moorcock', n: 'The Moorcock', y: 1889, a: 'CT', t: '2.1.3a', c: 'CA', f: 'A ship moored at a wharf on the Thames was damaged when it rested on a ridge of hard ground at low tide.', p: 'A term was implied that the berth would be safe, to give the contract “business efficacy”.' },
  { id: 'shirlaw', n: 'Shirlaw v Southern Foundries', y: 1939, a: 'CT', t: '2.1.3a', c: 'CA', f: 'A managing director’s ten-year contract; the company changed its articles to allow his removal.', p: 'MacKinnon LJ’s “officious bystander” test: a term is implied if it is so obvious that it goes without saying — if a bystander suggested it, both parties would say “Oh, of course!”' },
  { id: 'msbnp', n: 'Marks and Spencer v BNP Paribas Securities', y: 2015, a: 'CT', t: '2.1.3a', c: 'UKSC', f: 'M&S ended a lease early and claimed a refund of rent paid in advance for the period after the break date. The lease said nothing.', p: 'No term was implied. A term will only be implied in fact if it is necessary for business efficacy or so obvious it goes without saying — not merely because it would be reasonable.' },
  { id: 'jacobs', n: 'Jacobs v Batavia & General Plantations Trust', y: 1924, a: 'CT', t: '2.1.3a', c: 'HC', f: 'A party tried to rely on oral evidence to add to the terms of a written document.', p: 'The parol evidence rule: evidence cannot be admitted to add to, vary or contradict a written contract.' },
  { id: 'poussard', n: 'Poussard v Spiers and Pond', y: 1876, a: 'CT', t: '2.1.3a', c: 'QB', f: 'An opera singer fell ill and missed the opening night and the first week of performances. The producers hired a replacement.', p: 'Performing from the opening night was a condition; breach entitled the producers to terminate.' },
  { id: 'bettini', n: 'Bettini v Gye', y: 1876, a: 'CT', t: '2.1.3a', c: 'QB', f: 'A singer arrived three days late for six days of rehearsals, but in time for the performances.', p: 'The rehearsal term was a warranty; breach allowed damages only, not termination.' },
  { id: 'hongkongfir', n: 'Hongkong Fir Shipping v Kawasaki Kisen Kaisha', y: 1962, a: 'CT', t: '2.1.3a', c: 'CA', f: 'A ship chartered for 24 months was “in every way fitted for ordinary cargo service”. The crew was incompetent and the engines old; 20 weeks were lost to repairs.', p: 'Innominate terms: the right to terminate depends on the seriousness of the consequences of the breach. The charterers were not deprived of substantially the whole benefit, so could not terminate.' },
  { id: 'hansanord', n: 'Cehave v Bremer Handelsgesellschaft (The Hansa Nord)', y: 1976, a: 'CT', t: '2.1.3a', c: 'CA', f: 'Citrus pulp pellets had to be shipped “in good condition”; some were damaged. The buyers rejected them, then bought them cheaply and used them anyway.', p: 'The term was innominate; the breach was not serious enough to justify rejection.' },
  { id: 'schuler', n: 'L Schuler AG v Wickman Machine Tool Sales', y: 1974, a: 'CT', t: '2.1.3a', c: 'HL', f: 'A contract called a term requiring weekly visits to car manufacturers a “condition”. A few visits were missed.', p: 'Calling a term a “condition” is not conclusive; the House of Lords would not allow termination for a trivial breach that the parties could not have intended to have that effect.' },
  // exclusion
  { id: 'lestrange', n: 'L’Estrange v Graucob', y: 1934, a: 'CT', t: '2.1.3b', c: 'Divisional Court', f: 'A café owner signed an order form for a cigarette vending machine without reading the small print, which excluded all liability.', p: 'A person who signs a contractual document is bound by its terms whether or not they have read them (subject to misrepresentation and, today, statute).' },
  { id: 'curtis', n: 'Curtis v Chemical Cleaning and Dyeing Co', y: 1951, a: 'CT', t: '2.1.3b', c: 'CA', f: 'A customer asked what she was signing when leaving a wedding dress for cleaning and was told it only excluded liability for beads and sequins. It excluded all damage.', p: 'The cleaners could not rely on the clause because they had misrepresented its effect.' },
  { id: 'olley', n: 'Olley v Marlborough Court', y: 1949, a: 'CT', t: '2.1.3b', c: 'CA', f: 'A hotel guest’s furs were stolen from her room. A notice excluding liability was on the back of the bedroom door, seen after the contract was made at reception.', p: 'Notice of an exclusion clause must be given before or at the time the contract is made.' },
  { id: 'parkerser', n: 'Parker v South Eastern Railway', y: 1877, a: 'CT', t: '2.1.3b', c: 'CA', f: 'A customer left a bag in a left-luggage office and received a ticket with conditions limiting liability to £10.', p: 'An unsigned term is incorporated if reasonable steps were taken to bring it to the other party’s notice.' },
  { id: 'chapelton', n: 'Chapelton v Barry UDC', y: 1940, a: 'CT', t: '2.1.3b', c: 'CA', f: 'A man hired a deckchair and was given a ticket with an exclusion clause on the back. The chair collapsed.', p: 'The ticket was a receipt, not a contractual document a reasonable person would expect to contain terms, so the clause was not incorporated.' },
  { id: 'thornton', n: 'Thornton v Shoe Lane Parking', y: 1971, a: 'CT', t: '2.1.3b', c: 'CA', f: 'A driver took a ticket from a machine at a car park. The ticket referred to conditions displayed inside, including an exclusion of liability for personal injury.', p: 'The contract was made when the driver drove in response to the machine; terms referred to on the ticket came too late. Lord Denning: the more unusual or onerous the term, the clearer the notice needed.' },
  { id: 'interfoto', n: 'Interfoto Picture Library v Stiletto Visual Programmes', y: 1989, a: 'CT', t: '2.1.3b', c: 'CA', f: 'Photographic transparencies were hired with a delivery note imposing a very high holding fee (£5 per transparency per day) for late return.', p: 'Particularly onerous or unusual terms must be fairly and reasonably brought to the other party’s attention; this one was not, so it was not incorporated.' },
  { id: 'spurling', n: 'J Spurling v Bradshaw', y: 1956, a: 'CT', t: '2.1.3b', c: 'CA', f: 'Orange juice stored in a warehouse was damaged. The exclusion clause was on a document sent after the contract, but the parties had dealt with each other for years.', p: 'The clause was incorporated by a consistent course of dealing. Lord Denning’s “red hand rule”: some clauses would need to be printed in red ink with a red hand pointing to them.' },
  { id: 'hollier', n: 'Hollier v Rambler Motors', y: 1972, a: 'CT', t: '2.1.3b', c: 'CA', f: 'A customer had had his car serviced at a garage three or four times in five years, sometimes signing a form with an exclusion clause. This time he did not sign.', p: 'Three or four dealings in five years were not a regular and consistent course of dealing, so the clause was not incorporated.' },
  { id: 'houghton', n: 'Houghton v Trafalgar Insurance', y: 1954, a: 'CT', t: '2.1.3b', c: 'CA', f: 'An insurance policy excluded liability where a car carried a “load” in excess of that for which it was constructed. Six people were in a five-seater car.', p: 'Contra proferentem: ambiguous clauses are read against the party relying on them. “Load” did not include passengers.' },
  { id: 'photoproduction', n: 'Photo Production v Securicor Transport', y: 1980, a: 'CT', t: '2.1.3b', c: 'HL', f: 'A security guard deliberately started a fire in the factory he was guarding, which burned down. The contract excluded liability for acts of employees.', p: 'There is no rule of law that a “fundamental breach” prevents reliance on an exclusion clause; it is a question of construction. Between commercial parties of equal bargaining power, the clause was effective.' },
  { id: 'georgemitchell', n: 'George Mitchell v Finney Lock Seeds', y: 1983, a: 'CT', t: '2.1.3b', c: 'HL', f: 'Farmers bought cabbage seed for £192; it was the wrong type and the crop failed, causing losses of over £61,000. The seller limited liability to the price.', p: 'The limitation clause failed the reasonableness test: the sellers could easily have insured, the breach was due to their negligence, and they usually settled such claims.' },
  { id: 'smithbush', n: 'Smith v Eric S Bush', y: 1990, a: 'CT', t: '2.1.3b', c: 'HL', f: 'A surveyor valued a house for a mortgage lender, with a disclaimer of liability to the buyer. He missed obvious defects; the chimney collapsed.', p: 'The disclaimer was unreasonable under UCTA: modest-priced house buyers rely on the valuation, and the surveyor could insure.' },
  { id: 'watford', n: 'Watford Electronics v Sanderson', y: 2001, a: 'CT', t: '2.1.3b', c: 'CA', f: 'A software supplier limited its liability to the contract price in a negotiated contract with a business buyer.', p: 'The clause was reasonable: experienced commercial parties of equal bargaining power should be left to allocate risk themselves.' },
  // misrep and duress
  { id: 'bisset', n: 'Bisset v Wilkinson', y: 1927, a: 'CT', t: '2.1.4', c: 'Privy Council', f: 'A seller of New Zealand land, which had never been used for sheep, said it could carry 2,000 sheep.', p: 'An honest statement of opinion by someone without special knowledge is not a statement of fact, so not a misrepresentation.' },
  { id: 'smithland', n: 'Smith v Land and House Property Corporation', y: 1884, a: 'CT', t: '2.1.4', c: 'CA', f: 'A hotel was sold described as let to “a most desirable tenant”, when the tenant was behind with the rent.', p: 'A statement of opinion by someone who knows the facts can imply that there are facts to support it — here it was a misrepresentation.' },
  { id: 'edgington', n: 'Edgington v Fitzmaurice', y: 1885, a: 'CT', t: '2.1.4', c: 'CA', f: 'Directors raised money saying it would expand the business, but really intended to pay off debts.', p: 'A false statement of present intention is a statement of fact: “the state of a man’s mind is as much a fact as the state of his digestion”.' },
  { id: 'dimmock', n: 'Dimmock v Hallett', y: 1866, a: 'CT', t: '2.1.4', c: 'Court of Appeal in Chancery', f: 'Land was described as fully let, without saying the tenants had given notice to leave.', p: 'A half-truth can be a misrepresentation.' },
  { id: 'withoflanagan', n: 'With v O’Flanagan', y: 1936, a: 'CT', t: '2.1.4', c: 'CA', f: 'A doctor selling his practice truthfully said it earned £2,000 a year. By the time of sale, months later, illness had reduced it to almost nothing.', p: 'A true statement that becomes false before the contract is made must be corrected; failure to do so is a misrepresentation.' },
  { id: 'spicegirls', n: 'Spice Girls v Aprilia World Service', y: 2002, a: 'CT', t: '2.1.4', c: 'CA', f: 'The Spice Girls took part in a commercial shoot for Aprilia scooters knowing Geri Halliwell intended to leave the group.', p: 'Misrepresentation by conduct: taking part implied that they did not know of any member’s intention to leave.' },
  { id: 'attwood', n: 'Attwood v Small', y: 1838, a: 'CT', t: '2.1.4', c: 'HL', f: 'A buyer of a mine relied on his own agents’ report on its capacity, not on the seller’s exaggerated claims.', p: 'No reliance on the misrepresentation, so no remedy.' },
  { id: 'redgrave', n: 'Redgrave v Hurd', y: 1881, a: 'CT', t: '2.1.4', c: 'CA', f: 'A solicitor selling his practice misstated its income. The buyer did not examine the papers he was offered.', p: 'The buyer could still rely on the misrepresentation; he was not required to check.' },
  { id: 'derry', n: 'Derry v Peek', y: 1889, a: 'CT', t: '2.1.4', c: 'HL', f: 'A tramway company’s prospectus said it had permission to use steam power, honestly believing permission would be granted. It was refused.', p: 'Fraud requires a false statement made knowingly, without belief in its truth, or recklessly as to whether it is true. Honest belief is not fraud.' },
  { id: 'royscot', n: 'Royscot Trust v Rogerson', y: 1991, a: 'CT', t: '2.1.4', c: 'CA', f: 'A car dealer misstated the price and deposit to a finance company. The buyer later sold the car dishonestly.', p: 'Damages under s2(1) Misrepresentation Act 1967 are assessed as if the misrepresentation were fraudulent: all direct losses, even unforeseeable ones.' },
  { id: 'howardmarine', n: 'Howard Marine and Dredging v A Ogden & Sons', y: 1978, a: 'CT', t: '2.1.4', c: 'CA', f: 'A barge owner’s manager misstated the barges’ carrying capacity, relying on his memory of a Lloyd’s Register figure, when the owners’ own documents showed the true figure.', p: 'Under s2(1) the burden is on the representor to prove reasonable grounds for believing the statement was true; he failed.' },
  { id: 'longlloyd', n: 'Long v Lloyd', y: 1958, a: 'CT', t: '2.1.4', c: 'CA', f: 'A lorry advertised as in “exceptional condition” broke down on its first trip; the buyer agreed to share repair costs and used it again before trying to reject it.', p: 'By continuing to use it after discovering the defects, the buyer affirmed the contract and lost the right to rescind.' },
  { id: 'leaf', n: 'Leaf v International Galleries', y: 1950, a: 'CT', t: '2.1.4', c: 'CA', f: 'A painting sold as a Constable turned out, five years later, not to be.', p: 'Rescission for innocent misrepresentation was barred by lapse of time.' },
  { id: 'caldwell', n: 'Car and Universal Finance v Caldwell', y: 1965, a: 'CT', t: '2.1.4', c: 'CA', f: 'Caldwell sold his car to a fraudster whose cheque bounced. He could not find him, so told the police and the AA. The fraudster sold the car on.', p: 'Informing the police and AA was enough to rescind, as the fraudster had deliberately disappeared. Rescission before the car reached an innocent third party meant Caldwell recovered it.' },
  { id: 'atlasexpress', n: 'Atlas Express v Kafco', y: 1989, a: 'CT', t: '2.1.4', c: 'HC', f: 'A carrier agreed to deliver basketware to Woolworths for a small company, then demanded a higher minimum charge per load, refusing to deliver otherwise. Kafco could not find another carrier in time.', p: 'Economic duress: Kafco had no practical alternative, so the variation was not binding (and there was no consideration).' },
  { id: 'universesentinel', n: 'Universe Tankships v International Transport Workers’ Federation (The Universe Sentinel)', y: 1983, a: 'CT', t: '2.1.4', c: 'HL', f: 'A union “blacked” a ship (refused to let it leave port) until the owners paid money into a welfare fund.', p: 'Economic duress requires illegitimate pressure that was a significant cause of the contract. The payment was recoverable.' },
  { id: 'atlanticbaron', n: 'North Ocean Shipping v Hyundai Construction (The Atlantic Baron)', y: 1979, a: 'CT', t: '2.1.4', c: 'HC', f: 'Shipbuilders demanded 10% more for a ship after the dollar fell, threatening not to deliver. The buyers paid, then waited eight months after delivery before claiming the money back.', p: 'There was economic duress, but the buyers had affirmed the contract by their delay, so could not rescind.' },
  { id: 'dsnd', n: 'DSND Subsea v Petroleum Geo-Services', y: 2000, a: 'CT', t: '2.1.4', c: 'HC', f: 'A contractor on an oil project threatened to stop work unless new terms were agreed.', p: 'Dyson J summarised the test: pressure, whose practical effect is compulsion or lack of practical choice, which is illegitimate, and a significant cause. Legitimate commercial pressure is not duress; here there was none.' },
  { id: 'timestravel', n: 'Times Travel (UK) v Pakistan International Airline Corporation', y: 2021, a: 'CT', t: '2.1.4', c: 'UKSC', f: 'A small travel agent, dependent on PIA for tickets, agreed to waive claims for unpaid commission after PIA threatened to stop supplying tickets — which it was lawfully entitled to do.', p: '“Lawful act” duress is very limited: it requires reprehensible conduct, such as a bad-faith demand where the party knows it has no right to what it demands. Not established here.' },
  // discharge
  { id: 'cutter', n: 'Cutter v Powell', y: 1795, a: 'CT', t: '2.1.5', c: 'King’s Bench', f: 'A sailor was to be paid 30 guineas on completion of a voyage from Jamaica to Liverpool. He died seven weeks before the ship arrived.', p: 'An entire contract must be completely performed before payment is due. His widow recovered nothing.' },
  { id: 'hoenig', n: 'Hoenig v Isaacs', y: 1952, a: 'CT', t: '2.1.5', c: 'CA', f: 'A decorator furnished a flat for £750; some furniture had defects costing £55 to put right.', p: 'Substantial performance: the decorator was entitled to the price less the cost of remedying the defects.' },
  { id: 'boltonmahadeva', n: 'Bolton v Mahadeva', y: 1972, a: 'CT', t: '2.1.5', c: 'CA', f: 'A central heating system installed for £560 gave out fumes and heated poorly; it would cost £174 to repair.', p: 'Not substantial performance, so the installer recovered nothing.' },
  { id: 'sumpter', n: 'Sumpter v Hedges', y: 1898, a: 'CT', t: '2.1.5', c: 'CA', f: 'A builder abandoned work on two houses and a stable half-way through. The landowner finished them using materials the builder had left.', p: 'The builder could not claim for the work done, because the landowner had no real choice but to accept it; he recovered only for the materials used.' },
  { id: 'planche', n: 'Planché v Colburn', y: 1831, a: 'CT', t: '2.1.5', c: 'Court of Common Pleas', f: 'An author was commissioned to write a book for a series, which the publishers abandoned before he finished.', p: 'Where performance is prevented by the other party, the claimant can recover a reasonable sum (quantum meruit) for work done.' },
  { id: 'hochster', n: 'Hochster v De La Tour', y: 1853, a: 'CT', t: '2.1.5', c: 'QB', f: 'A courier was engaged in April to start work on 1 June. In May the employer told him he was no longer needed.', p: 'Anticipatory breach: the innocent party can sue immediately, without waiting for the date of performance.' },
  { id: 'avery', n: 'Avery v Bowden', y: 1855, a: 'CT', t: '2.1.5', c: 'QB', f: 'A charterer told a ship’s captain in Odessa there was no cargo. The captain waited, hoping he would change his mind; then the Crimean War broke out.', p: 'By affirming the contract, the captain kept it alive — and it was then frustrated by the war, so he lost his claim.' },
  { id: 'whitecarter', n: 'White & Carter (Councils) v McGregor', y: 1962, a: 'CT', t: '2.1.5', c: 'HL', f: 'A garage owner cancelled a three-year advertising contract on the day it was made. The advertisers went ahead, displayed the adverts and claimed the full price.', p: 'An innocent party may affirm and perform the contract and claim the price, if performance needs no cooperation from the other side and it has a legitimate interest in doing so.' },
  { id: 'taylorcaldwell', n: 'Taylor v Caldwell', y: 1863, a: 'CT', t: '2.1.5', c: 'QB', f: 'A music hall hired for four concerts burned down before the first one.', p: 'Frustration by destruction of the subject matter: both parties were excused from further performance.' },
  { id: 'krell', n: 'Krell v Henry', y: 1903, a: 'CT', t: '2.1.5', c: 'CA', f: 'A flat in Pall Mall was hired for two days to watch Edward VII’s coronation procession, which was cancelled when the King fell ill.', p: 'The contract was frustrated because its whole commercial purpose (viewing the procession) had disappeared — sometimes called frustration of purpose or “commercial sterility”.' },
  { id: 'hernebay', n: 'Herne Bay Steam Boat Co v Hutton', y: 1903, a: 'CT', t: '2.1.5', c: 'CA', f: 'A boat was hired to watch the naval review at Spithead for the coronation and to cruise around the fleet. The review was cancelled, but the fleet remained.', p: 'Not frustrated: part of the purpose could still be achieved — distinguished from Krell v Henry.' },
  { id: 'condor', n: 'Condor v The Barron Knights', y: 1966, a: 'CT', t: '2.1.5', c: 'HC', f: 'A pop group’s 16-year-old drummer had a breakdown and was told he could only play four nights a week instead of seven.', p: 'Frustration by illness or incapacity of a party whose personal performance was essential.' },
  { id: 'davis', n: 'Davis Contractors v Fareham UDC', y: 1956, a: 'CT', t: '2.1.5', c: 'HL', f: 'Builders agreed to build 78 houses in eight months for a fixed price. Labour shortages meant it took 22 months and cost far more.', p: 'Not frustrated: the contract had become more onerous and expensive, not radically different. Lord Radcliffe: frustration occurs when performance would be “a thing radically different from that which was undertaken”.' },
  { id: 'tsakiroglou', n: 'Tsakiroglou v Noblee Thorl', y: 1962, a: 'CT', t: '2.1.5', c: 'HL', f: 'Groundnuts were to be shipped from Sudan to Hamburg. The Suez Canal closed, so the ship would have to go round the Cape of Good Hope.', p: 'Not frustrated: a longer and more expensive route did not make performance radically different.' },
  { id: 'supersevant', n: 'J Lauritzen v Wijsmuller (The Super Servant Two)', y: 1990, a: 'CT', t: '2.1.5', c: 'CA', f: 'A company with two vessels able to carry a drilling rig allocated one to other contracts; the other sank.', p: 'Self-induced frustration: the company chose to use the other vessel elsewhere, so the contract was not frustrated.' },
  { id: 'fibrosa', n: 'Fibrosa Spolka Akcyjna v Fairbairn Lawson Combe Barbour', y: 1943, a: 'CT', t: '2.1.5', c: 'HL', f: 'A Polish company paid £1,000 for machinery. Germany then occupied Gdynia, making delivery illegal (trading with the enemy).', p: 'Frustration by supervening illegality. The buyer could recover the advance payment because there was a total failure of consideration — softening Chandler v Webster.' },
  { id: 'gamerco', n: 'Gamerco v ICM/Fair Warning (Agency)', y: 1995, a: 'CT', t: '2.1.5', c: 'HC', f: 'A Guns N’ Roses concert in Madrid was cancelled when the stadium was found to be unsafe. The promoters had paid $412,500 in advance.', p: 'Under the Law Reform (Frustrated Contracts) Act 1943 s1(2), the advance was recoverable; the court used its discretion to allow no deduction for the band’s expenses.' },
  { id: 'canarywharf', n: 'Canary Wharf (BP4) T1 v European Medicines Agency', y: 2019, a: 'CT', t: '2.1.5', c: 'HC', f: 'The EU agency argued that Brexit frustrated its 25-year lease of London offices.', p: 'Not frustrated: Brexit did not make performance radically different — the lease could be assigned or sublet, and the agency’s own choices were involved.' },
  // remedies
  { id: 'hadley', n: 'Hadley v Baxendale', y: 1854, a: 'CT', t: '2.1.6', c: 'Court of Exchequer', f: 'A mill’s crankshaft broke and was sent for repair, but the carrier delayed its return. The mill had no spare and stood idle.', p: 'Remoteness: damages cover losses (1) arising naturally from the breach, or (2) within the reasonable contemplation of both parties when contracting. Lost profits were too remote because the carrier did not know the mill had no spare.' },
  { id: 'victorialaundry', n: 'Victoria Laundry v Newman Industries', y: 1949, a: 'CT', t: '2.1.6', c: 'CA', f: 'Delivery of a boiler to a laundry was delayed by five months.', p: 'Normal lost profits were recoverable (first limb), but not profits from especially lucrative dyeing contracts the supplier did not know about.' },
  { id: 'heron', n: 'Koufos v C Czarnikow (The Heron II)', y: 1969, a: 'CT', t: '2.1.6', c: 'HL', f: 'A ship carrying sugar arrived nine days late; the sugar market price fell.', p: 'The loss was recoverable: it was “not unlikely” to result from the delay. The test in contract is stricter than reasonable foreseeability in tort.' },
  { id: 'parsons', n: 'H Parsons (Livestock) v Uttley Ingham', y: 1978, a: 'CT', t: '2.1.6', c: 'CA', f: 'A pig-food hopper was installed with its ventilator sealed; the nuts went mouldy and 254 pigs died of a rare disease.', p: 'Illness of the pigs was the type of loss within contemplation, so the full loss was recoverable even though its extent was not foreseen.' },
  { id: 'achilleas', n: 'Transfield Shipping v Mercator Shipping (The Achilleas)', y: 2008, a: 'CT', t: '2.1.6', c: 'HL', f: 'A ship was returned nine days late, causing the owners to lose a lucrative follow-on charter because rates had fallen.', p: 'Only the difference for the nine-day overrun was recoverable: the charterer had not assumed responsibility for the loss of the next fixture, which the market did not expect.' },
  { id: 'robinsonharman', n: 'Robinson v Harman', y: 1848, a: 'CT', t: '2.1.6', c: 'Court of Exchequer', f: 'A lessor who knew he had no right to grant a 21-year lease agreed to do so.', p: 'Contract damages aim to put the claimant in the position they would have been in had the contract been performed (the expectation interest).' },
  { id: 'anglia', n: 'Anglia Television v Reed', y: 1972, a: 'CT', t: '2.1.6', c: 'CA', f: 'An actor pulled out of a TV film at the last minute; the film was abandoned. Profits were impossible to prove.', p: 'The claimant can instead claim wasted expenditure (reliance loss), including expenses incurred before the contract.' },
  { id: 'jarvis', n: 'Jarvis v Swans Tours', y: 1973, a: 'CT', t: '2.1.6', c: 'CA', f: 'A solicitor’s skiing holiday fell far short of the brochure’s promises of a house party and yodeller evening.', p: 'Damages can be awarded for disappointment and distress where the object of the contract was pleasure or relaxation.' },
  { id: 'ruxley', n: 'Ruxley Electronics v Forsyth', y: 1996, a: 'CT', t: '2.1.6', c: 'HL', f: 'A swimming pool was built 6ft deep at the deep end instead of 7ft 6in. It was safe for diving and had no lower value; rebuilding would cost £21,560.', p: 'Cost of cure was unreasonable and disproportionate. Damages of £2,500 were awarded for loss of amenity (consumer surplus).' },
  { id: 'farley', n: 'Farley v Skinner', y: 2001, a: 'CT', t: '2.1.6', c: 'HL', f: 'A surveyor was asked specifically to check whether a house was affected by aircraft noise and wrongly said it was not.', p: 'Damages for disappointment and loss of amenity were recoverable because a major or important object of the contract was pleasure or peace of mind.' },
  { id: 'brace', n: 'Brace v Calder', y: 1895, a: 'CT', t: '2.1.6', c: 'CA', f: 'A manager was technically dismissed when a partnership was reorganised, but was offered the same job on the same terms by the new firm. He refused and sued for the rest of his contract.', p: 'Duty to mitigate: he should have accepted the offer, so recovered only nominal damages.' },
  { id: 'pilkington', n: 'Pilkington v Wood', y: 1953, a: 'CT', t: '2.1.6', c: 'HC', f: 'A solicitor negligently failed to spot a defect in title. He argued the client should have sued the seller first.', p: 'Mitigation does not require the claimant to take complicated or risky legal action.' },
  { id: 'parkingeye', n: 'Cavendish Square Holding v Makdessi; ParkingEye v Beavis', y: 2015, a: 'CT', t: '2.1.6', c: 'UKSC', f: 'Mr Beavis overstayed a two-hour free parking limit at a retail park and was charged £85.', p: 'The penalty rule asks whether a clause imposes a detriment out of all proportion to any legitimate interest of the innocent party in performance. The £85 charge protected the legitimate interest in managing parking, so it was not a penalty.' },
  { id: 'argyll', n: 'Co-operative Insurance Society v Argyll Stores', y: 1997, a: 'CT', t: '2.1.6', c: 'HL', f: 'A supermarket in a shopping centre had agreed to keep trading, but closed because it was losing money.', p: 'Specific performance refused: it would require constant supervision by the court and would force the tenant to trade at a loss. Damages were adequate.' },
  { id: 'warnernelson', n: 'Warner Bros v Nelson', y: 1937, a: 'CT', t: '2.1.6', c: 'HC', f: 'Bette Davis agreed not to act for any other film studio during her contract, then planned to make films in England for another company.', p: 'An injunction enforcing the negative promise (not to work for rivals) was granted; she could still earn a living in other ways.' },
  { id: 'pageone', n: 'Page One Records v Britton', y: 1968, a: 'CT', t: '2.1.6', c: 'HC', f: 'The pop group The Troggs wanted to leave their manager, who sought an injunction preventing them from engaging another manager.', p: 'Injunction refused: the group could not manage without a manager, so it would in effect compel them to work for him — indirect specific performance of a personal service contract.' },
  { id: 'craddock', n: 'Craddock Bros v Hunt', y: 1923, a: 'CT', t: '2.1.6', c: 'CA', f: 'The parties agreed that a plot of land would not be included in a sale of a house, but the conveyance mistakenly included it.', p: 'Rectification: the written document was corrected to reflect the parties’ actual agreement.' }
]);

/* ---------- 2.1.3a Terms ---------- */
TOPICS.push({
  id: '2.1.3a', unit: 'CT', ref: '2.1.3', title: 'Terms: express, implied and types of term',
  short: 'Representations v terms, express terms, parol evidence rule, implied terms, CRA 2015, conditions and warranties',
  summary: 'Once a contract exists, you need to know what its contents are. Pre-contract statements may be terms or mere representations; written terms may be supplemented by terms implied by fact or by statute, especially the Consumer Rights Act 2015. Terms are classified as conditions, warranties or innominate terms, which decides whether a breach allows the innocent party to end the contract.',
  spec: ['Obligations under a contract: representations and terms — the tests', 'Express terms: incorporation; the parol evidence rule and its exceptions', 'Terms implied by fact (business efficacy and officious bystander) and by custom', 'Terms implied by statute: Consumer Rights Act 2015 (goods, digital content, services) and remedies', 'The Consumer Contracts (Information, Cancellation and Additional Charges) Regulations 2013', 'Conditions, warranties and innominate terms'],
  learn: [
    { h: 'Representation or term?', html: `
<p>A <b>term</b> is a promise that forms part of the contract — breach gives a claim for <b>breach of contract</b>. A <b>representation</b> is a statement that induced the contract but is not part of it — if false, the remedy is for <b>misrepresentation</b> (topic 2.1.4). The test is the parties’ objective intention. Courts consider:</p>
<ul><li><b>Importance</b> attached to the statement: [[c:couchman]]; [[c:bannerman]].</li>
<li><b>Special knowledge or skill</b> of the maker: [[c:oscarchess]] (private seller — representation) v [[c:dickbentley]] (dealer — term).</li>
<li>Whether the maker <b>discouraged checking</b>: [[c:schawel]] (term).</li>
<li><b>Timing</b> and whether the statement was put into a later written contract: [[c:routledgemckay]].</li></ul>` },
    { h: 'Express terms and the parol evidence rule', html: `
<p>Express terms are those actually agreed, orally or in writing. For how written terms (and exclusion clauses) become part of a contract — signature, notice, course of dealing — see topic 2.1.3b.</p>
<p>The <b>parol evidence rule</b>: where a contract is in writing, oral or other extrinsic evidence cannot be used to add to, vary or contradict it ([[c:jacobs]]). Exceptions: where the written document was not intended to contain the whole agreement; a <b>collateral contract</b> (<i>City and Westminster Properties v Mudd</i>, 1959); evidence of custom; rectification of a mistake; showing the contract is void or voidable (misrepresentation). Many written contracts include an “<b>entire agreement</b>” clause to prevent reliance on pre-contract statements.</p>` },
    { h: 'Terms implied by fact and custom', html: `
<ul><li><b>Business efficacy</b>: a term is implied if necessary to make the contract work commercially — [[c:moorcock]].</li>
<li><b>Officious bystander</b>: a term so obvious it “goes without saying” — [[c:shirlaw]].</li>
<li>These are cumulative guides; the Supreme Court in [[c:msbnp]] stressed that a term will only be implied if <b>necessary</b>, not merely reasonable or fair.</li>
<li><b>Terms implied by law</b> into all contracts of a particular type (e.g. landlord’s duty to keep common parts in repair — <i>Liverpool CC v Irwin</i>, 1977).</li>
<li><b>Custom</b> of a trade or locality (<i>Hutton v Warren</i>, 1836).</li></ul>` },
    { h: 'Consumer Rights Act 2015: goods', html: `
<p>The CRA 2015 applies to <b>trader-to-consumer</b> contracts. (Business contracts still use the Sale of Goods Act 1979 ss12–15 and the Supply of Goods and Services Act 1982.)</p>
<div class="tbl"><table><tr><th>Section</th><th>Term treated as included</th></tr>
<tr><td><b>s9</b></td><td>Goods must be of <b>satisfactory quality</b> — what a reasonable person would consider satisfactory, taking account of description, price and all circumstances: fitness for usual purposes, appearance and finish, freedom from minor defects, safety and durability</td></tr>
<tr><td><b>s10</b></td><td><b>Fit for a particular purpose</b> the consumer made known to the trader</td></tr>
<tr><td><b>s11</b></td><td>Goods must match their <b>description</b></td></tr>
<tr><td>s13 / s14</td><td>Match a sample / a model seen or examined</td></tr>
<tr><td>s17</td><td>The trader must have the right to sell the goods</td></tr></table></div>
<h4>Remedies for goods</h4><ol><li><b>Short-term right to reject</b> — within <b>30 days</b> for a full refund (s22).</li><li><b>Repair or replacement</b> (s23) at no cost, within a reasonable time.</li><li>If that fails: <b>price reduction</b> or the <b>final right to reject</b> (s24) — a refund which may be reduced for use if more than six months after delivery.</li></ol>
<p>A fault appearing within six months is presumed to have existed at delivery (s19(14)). Digital content has similar rights (ss34–36). These rights <b>cannot be excluded</b> (s31).</p>` },
    { h: 'Consumer Rights Act 2015: services, and the 2013 Regulations', html: `
<ul><li><b>s49</b> — services must be performed with <b>reasonable care and skill</b>.</li>
<li><b>s50</b> — information given by the trader about the service is binding.</li>
<li><b>s51</b> — a reasonable price, if none is agreed. <b>s52</b> — within a reasonable time, if none is agreed.</li>
<li>Remedies: <b>repeat performance</b> (s55) or a <b>price reduction</b> (s56).</li></ul>
<p>The <b>Consumer Contracts (Information, Cancellation and Additional Charges) Regulations 2013</b> (implementing an EU directive) require traders to give consumers key information before a contract (identity, price, delivery, cancellation rights). For <b>distance</b> (online, phone) and <b>off-premises</b> contracts, consumers have a <b>14-day cancellation period</b>, extended by up to 12 months if they were not told about it. There are exceptions (e.g. personalised or perishable goods). Extra payments need express consent — no pre-ticked boxes.</p>` },
    { h: 'Conditions, warranties and innominate terms', html: `
<div class="tbl"><table><tr><th>Type</th><th>Meaning</th><th>Remedy for breach</th><th>Case</th></tr>
<tr><td><b>Condition</b></td><td>A vital term going to the root of the contract</td><td>Terminate (repudiate) and/or damages</td><td>[[c:poussard]]</td></tr>
<tr><td><b>Warranty</b></td><td>A minor, ancillary term</td><td>Damages only</td><td>[[c:bettini]]</td></tr>
<tr><td><b>Innominate term</b></td><td>Can be broken in serious or trivial ways</td><td>Depends on the seriousness of the consequences: terminate only if the innocent party is deprived of substantially the whole benefit</td><td>[[c:hongkongfir]]; [[c:hansanord]]</td></tr></table></div>
<p>A term can be a condition because statute says so (Sale of Goods Act 1979 ss12–15 in business contracts), because the courts have classified it (time clauses in commercial contracts), or because the parties clearly intended it — but a label is not conclusive ([[c:schuler]]).</p>` }
  ],
  debate: [{ q: 'Is the innominate term approach better than fixed classification?', for: ['Prevents parties escaping bad bargains over trivial breaches (Hansa Nord).', 'Flexible and fair — looks at actual consequences.', 'Schuler shows labels can be unfair.'], ag: ['Uncertainty: parties do not know whether they can terminate until a court decides.', 'Commercial parties value certainty (e.g. time clauses treated as conditions).', 'Encourages litigation.'] }],
  cases: ['couchman', 'bannerman', 'oscarchess', 'dickbentley', 'schawel', 'routledgemckay', 'jacobs', 'moorcock', 'shirlaw', 'msbnp', 'poussard', 'bettini', 'hongkongfir', 'hansanord', 'schuler'],
  worked: [{ q: '<b>Scenario.</b> Pat buys a £600 laptop online from TechCo, telling the chat assistant she needs it for professional video editing. It struggles to run editing software and, after five weeks, the hinge snaps. Advise Pat.', s: ['<b class="st">Law</b>This is a consumer contract under the CRA 2015. Relevant terms: s9 satisfactory quality (including durability), s10 fitness for a particular purpose made known.', '<b class="st">s10</b>Pat told TechCo she needed it for video editing; it is not fit for that purpose.', '<b class="st">s9</b>A hinge snapping after five weeks suggests it was not durable — not of satisfactory quality. A fault within six months is presumed to have been present at delivery.', '<b class="st">Remedies</b>The 30-day short-term right to reject has passed (five weeks). She can ask for repair or replacement (s23); if that fails or is impossible, a price reduction or the final right to reject (s24). Any clause excluding these rights is not binding (s31).', '<b class="st">Also</b>Buying online, she had a 14-day cancellation right under the 2013 Regulations, now expired.'], a: 'Repair or replacement first, then price reduction or final right to reject.' }],
  pitfalls: ['Confusing a term with a representation and choosing the wrong remedy.', 'Citing the Sale of Goods Act 1979 for consumer sales — use the CRA 2015.', 'Forgetting the order of CRA remedies (30-day right to reject, then repair/replace, then price reduction/final rejection).', 'Saying a term is a condition just because the contract calls it one (Schuler).'],
  cards: [
    ['Four factors for term v representation?', 'Importance; special knowledge; discouraging verification; timing/written contract.'],

/* ---------- 2.1.3b Exclusion clauses ---------- */
TOPICS.push({
  id: '2.1.3b', unit: 'CT', ref: '2.1.3', title: 'Exclusion clauses',
  short: 'Incorporation (signature, notice, course of dealing), construction, UCTA 1977, CRA 2015 and unfair terms',
  summary: 'An exclusion clause tries to exclude or limit one party’s liability. To rely on one, the defendant must show it was incorporated into the contract, that on its true construction it covers the loss, and that it survives statutory control — the Unfair Contract Terms Act 1977 for business contracts and the Consumer Rights Act 2015 for consumer contracts. The Unfair Terms in Consumer Contracts Regulations 1999 named in the specification were replaced by the CRA 2015.',
  spec: ['Incorporation of exclusion clauses: signature, reasonable notice before or at the time of contracting, onerous terms, course of dealing', 'Construction: contra proferentem, negligence, fundamental breach', 'Unfair Contract Terms Act 1977: ss2, 3, 6, 11 and the reasonableness test', 'Unfair Terms in Consumer Contracts Regulations 1999 and their replacement by the Consumer Rights Act 2015 Part 2', 'Evaluation: protecting consumers and freedom of contract'],
  learn: [
    { h: 'Step 1: incorporation', html: `
<ul><li><b>Signature</b>: a party who signs is bound, whether or not they read the terms — [[c:lestrange]] — unless the clause was misrepresented ([[c:curtis]]).</li>
<li><b>Reasonable notice</b>, given <b>before or at the time</b> the contract is made — [[c:parkerser]]; [[c:olley]] (notice in the room was too late); [[c:thornton]] (ticket from a machine came too late).</li>
<li>The notice must be in a document a reasonable person would expect to contain terms — [[c:chapelton]].</li>
<li><b>Onerous or unusual terms</b> need greater notice — [[c:interfoto]]; Denning’s “red hand rule” in [[c:spurling]].</li>
<li><b>Course of dealing</b>: a clause can be incorporated through regular and consistent previous dealings ([[c:spurling]]) but not occasional ones ([[c:hollier]]).</li></ul>` },
    { h: 'Step 2: construction', html: `
<ul><li><b>Contra proferentem</b>: ambiguity is resolved against the party relying on the clause — [[c:houghton]]. (For consumer contracts, s69 CRA 2015 requires the interpretation most favourable to the consumer.)</li>
<li><b>Negligence</b>: very clear words are needed to exclude liability for negligence (<i>Canada Steamship Lines v R</i>, 1952).</li>
<li><b>Fundamental breach</b>: there is no rule of law that a serious breach prevents reliance on the clause; it depends on construction — [[c:photoproduction]].</li></ul>` },
    { h: 'Step 3: the Unfair Contract Terms Act 1977', html: `
<p>Since 2015, UCTA mainly applies to <b>business-to-business</b> contracts (and non-contractual notices to non-consumers).</p>
<div class="tbl"><table><tr><th>Section</th><th>Effect</th></tr>
<tr><td><b>s2(1)</b></td><td>Liability for <b>death or personal injury</b> caused by negligence cannot be excluded — void</td></tr>
<tr><td><b>s2(2)</b></td><td>Other loss or damage caused by negligence — only if the clause is <b>reasonable</b></td></tr>
<tr><td><b>s3</b></td><td>Where one party deals on the other’s written standard terms, clauses excluding liability for breach or allowing substantially different performance must be reasonable</td></tr>
<tr><td><b>s6</b></td><td>Liability for breach of the implied term of title (SGA s12) cannot be excluded; the terms about description, quality, fitness and sample (ss13–15) can be excluded only if reasonable</td></tr>
<tr><td><b>s11 and Sch 2</b></td><td><b>The reasonableness test</b>: the term must have been fair and reasonable to include, given what the parties knew or should have known when contracting. Guidelines: relative bargaining strength; whether the customer received an inducement; whether they knew of the term; whether compliance with a condition was practicable; whether goods were made to special order. The burden is on the party relying on the clause. For limitation clauses, the resources available and whether insurance was available matter (s11(4))</td></tr></table></div>
<p>Cases: [[c:georgemitchell]] (unreasonable); [[c:smithbush]] (unreasonable); [[c:watford]] (reasonable between equal commercial parties).</p>` },
    { h: 'Step 3 (consumers): the Consumer Rights Act 2015 Part 2', html: `
<p>The <b>Unfair Terms in Consumer Contracts Regulations 1999</b> (implementing an EU directive) protected consumers against unfair standard terms. From <b>1 October 2015</b> they were revoked and replaced by <b>Part 2 of the CRA 2015</b>, which applies to all consumer contracts and consumer notices:</p>
<ul><li><b>s31, s47, s57</b> — the statutory rights about goods, digital content and services cannot be excluded or restricted (s57 allows a limit on services liability only if not below the price).</li>
<li><b>s65</b> — a trader cannot exclude or restrict liability for <b>death or personal injury</b> caused by negligence.</li>
<li><b>s62</b> — an <b>unfair</b> term is not binding on the consumer. A term is unfair if, <b>contrary to the requirement of good faith</b>, it causes a <b>significant imbalance</b> in the parties’ rights and obligations to the detriment of the consumer.</li>
<li><b>Schedule 2</b> — a “grey list” of terms that may be unfair (e.g. allowing the trader to change terms unilaterally, disproportionate cancellation charges).</li>
<li><b>s64</b> — the main subject matter and the price are not assessed for fairness if the term is <b>transparent and prominent</b>.</li>
<li><b>s71</b> — the court must consider fairness even if the consumer does not raise it. The CMA can take enforcement action.</li></ul>
<p>Earlier cases: <i>Director General of Fair Trading v First National Bank</i> (2001); <i>OFT v Abbey National</i> (2009) on bank charges; [[c:parkingeye]] (the £85 charge was not unfair).</p>` }
  ],
  debate: [{ q: 'Does the law strike the right balance between freedom of contract and protection from exclusion clauses?', for: ['Consumers are well protected: CRA 2015 makes statutory rights unexcludable and strikes out unfair terms.', 'UCTA reasonableness allows flexibility between businesses (Watford v Sanderson).', 'Common law incorporation rules stop hidden onerous terms (Interfoto, Thornton).'], ag: ['L’Estrange: signing binds even if you did not read — unrealistic for online “I agree” boxes.', 'The reasonableness test is uncertain and fact-specific.', 'Small businesses are not protected like consumers despite weak bargaining power.', 'Consumers rarely know or enforce their rights.'] }],

  worked: [{ q: '<b>Scenario.</b> Quinn parks at a multi-storey car park. At the barrier a machine issues a ticket saying “Issued subject to conditions displayed inside”. A sign inside, on the third floor, says the owners are not liable for any injury or damage. A badly maintained barrier falls on Quinn, injuring him and damaging his car. Advise Quinn.', s: ['<b class="st">Incorporation</b>The contract was made at the machine (Thornton v Shoe Lane). Conditions displayed inside came too late (Olley). Even if they were visible earlier, such an onerous term needs very clear notice (Interfoto; red hand rule).', '<b class="st">Construction</b>Excluding negligence needs clear words (Canada Steamship); any ambiguity is read against the car park (contra proferentem; s69 CRA).', '<b class="st">Statute</b>Quinn is a consumer. Under s65 CRA 2015 the trader cannot exclude liability for personal injury caused by negligence. The exclusion of liability for damage to the car is subject to the fairness test in s62 and is likely to be unfair.', '<b class="st">Conclude</b>The car park cannot rely on the clause. Quinn can claim in contract (s49 reasonable care and skill) and in negligence/occupiers’ liability.'], a: 'Clause not incorporated; in any case void for injury (s65) and likely unfair for damage (s62).' }],
  pitfalls: ['Jumping straight to UCTA without checking incorporation and construction first.', 'Applying UCTA to consumer contracts — since 2015 use the CRA.', 'Citing the UTCCR 1999 as current law without saying it was replaced in 2015.', 'Forgetting that the burden of proving reasonableness is on the party relying on the clause.'],
  cards: [

    ['CRA 2015 s65?', 'A trader cannot exclude liability for death or personal injury caused by negligence.'],

  quiz: [

/* ---------- 2.1.4 Misrepresentation and economic duress ---------- */
TOPICS.push({
  id: '2.1.4', unit: 'CT', ref: '2.1.4', title: 'Misrepresentation and economic duress',
  short: 'False statements of fact, inducement, fraudulent, negligent and innocent misrepresentation, remedies, economic duress',
  summary: 'A contract induced by a false statement of fact (misrepresentation) or by illegitimate pressure (economic duress) is voidable: the victim can set it aside, and may claim damages for misrepresentation. The type of misrepresentation — fraudulent, negligent or innocent — decides the damages available under the Misrepresentation Act 1967.',
  spec: ['Definition: an untrue statement of fact made by one party to the other which induces the contract', 'Statements of fact v opinion, intention, law; silence and its exceptions; conduct', 'Fraudulent misrepresentation (Derry v Peek)', 'Negligent misrepresentation: at common law and under s2(1) Misrepresentation Act 1967', 'Innocent misrepresentation and s2(2); remedies: rescission and its bars, damages', 'Economic duress'],
  learn: [
    { h: 'What is an actionable misrepresentation?', html: `
<div class="box def"><b class="lbl">Definition</b><p>An <b>untrue statement of fact</b>, made by one party to the contract to the other, which <b>induces</b> the other to enter the contract.</p></div>
<h4>Statement of fact</h4><ul><li><b>Opinion</b> is not fact ([[c:bisset]]) — unless made by someone with special knowledge or implying facts that justify it ([[c:smithland]]; <i>Esso v Mardon</i>, 1976).</li>
<li><b>Intention</b>: a false statement of present intention is a statement of fact ([[c:edgington]]).</li>
<li><b>Sales talk</b> (“puffs”) is not fact.</li>
<li><b>Silence</b> is generally not a misrepresentation (there is no general duty to disclose), except: <b>half-truths</b> ([[c:dimmock]]); statements that become false before the contract ([[c:withoflanagan]]); contracts of utmost good faith (insurance); fiduciary relationships.</li>
<li><b>Conduct</b> can be a representation ([[c:spicegirls]]).</li></ul>
<h4>Inducement</h4><ul><li>The claimant must have relied on it: no remedy if they relied on their own checks ([[c:attwood]]).</li><li>They need not have checked even if they could have ([[c:redgrave]]).</li><li>It need not be the only reason, but must have played a real part.</li></ul>` },
    { h: 'Types and damages', html: `
<div class="tbl"><table><tr><th>Type</th><th>Test</th><th>Damages</th></tr>
<tr><td><b>Fraudulent</b></td><td>Made knowingly, without belief in its truth, or recklessly, careless whether true or false ([[c:derry]])</td><td>Tort of <b>deceit</b>: all direct losses, foreseeable or not (<i>Doyle v Olby</i>, 1969). The claimant must prove fraud — a heavy burden</td></tr>
<tr><td><b>Negligent (s2(1) MA 1967)</b></td><td>The claimant need only prove the misrepresentation and loss; the burden shifts to the representor to prove they had <b>reasonable grounds to believe</b> the statement was true up to the contract ([[c:howardmarine]])</td><td>Assessed as if fraudulent ([[c:royscot]]) — very favourable to claimants</td></tr>
<tr><td>Negligent at common law</td><td>Negligent misstatement where there is a special relationship ([[c:hedleybyrne]])</td><td>Tort damages; now rarely needed between contracting parties</td></tr>
<tr><td><b>Innocent</b></td><td>Honest and reasonable belief</td><td>No right to damages; the court <b>may</b> award damages <b>instead of</b> rescission (<b>s2(2)</b>)</td></tr></table></div>` },
    { h: 'Rescission and its bars', html: `
<p>Misrepresentation makes the contract <b>voidable</b>. <b>Rescission</b> sets it aside and restores the parties to their original positions. It is an equitable remedy, and is lost (barred) where:</p>
<ul><li>the claimant <b>affirms</b> the contract after discovering the truth ([[c:longlloyd]]);</li>
<li>there is <b>lapse of time</b> ([[c:leaf]] — five years);</li>
<li>an innocent <b>third party</b> has acquired rights (e.g. bought the goods) — but rescission can be made by informing the authorities if the rogue disappears ([[c:caldwell]]);</li>
<li><b>restitution</b> is impossible (the subject matter cannot be returned);</li>
<li>the court awards damages in lieu under s2(2).</li></ul>
<p>Section 3 MA 1967: a clause excluding liability for misrepresentation must satisfy the UCTA reasonableness test (for consumer contracts, the CRA 2015 applies). Consumers misled by traders also have rights to “unwind” a contract, a discount or damages for misleading actions and aggressive practices — now under the Digital Markets, Competition and Consumers Act 2024 (from April 2025).</p>` },
    { h: 'Economic duress', html: `
<p>Duress originally meant threats of violence to the person. Since the 1970s the courts have recognised <b>economic duress</b>: illegitimate commercial pressure that leaves the victim no practical choice ([[c:paoon]]).</p>
<div class="box def"><b class="lbl">The test (The Universe Sentinel; DSND Subsea)</b><ol><li><b>Pressure</b> whose practical effect is <b>compulsion or lack of practical choice</b>;</li><li>which is <b>illegitimate</b> (usually a threat to break a contract, or other unlawful act);</li><li>which is a <b>significant cause</b> inducing the contract.</li></ol></div>
<ul><li>[[c:atlasexpress]] — carrier’s threat not to deliver; no practical alternative — duress.</li>
<li>[[c:universesentinel]] — union blacking a ship — duress; money recoverable.</li>
<li>[[c:atlanticbaron]] — duress, but affirmed by eight months’ delay — no rescission.</li>
<li>[[c:dsnd]] — legitimate hard bargaining is not duress.</li>
<li><b>Lawful act duress</b> — threatening something you are entitled to do — is very narrow: [[c:timestravel]].</li></ul>
<p>Relevant factors: did the victim protest? Did they have an alternative course (e.g. going to court)? Were they independently advised? Did they act promptly to avoid the contract? Economic duress makes the contract voidable; the remedy is rescission (subject to the same bars). It is closely linked to [[c:roffey]] — a promise obtained by duress will not be enforced even if there was a practical benefit.</p>` }
  ],
  debate: [{ q: 'Is s2(1) Misrepresentation Act 1967 too generous to claimants?', for: ['Royscot: negligent misrepresentors pay damages as if fraudulent — the “fiction of fraud” is illogical.', 'Unforeseeable losses recoverable against someone who was only careless.', 'Commentators and the Law Commission have criticised Royscot.'], ag: ['Encourages care in pre-contract statements.', 'Reverses the burden of proof — fair, since the representor knows the facts.', 'Claimants would otherwise struggle to prove negligence.', 'Victims of misstatements deserve full compensation.'] }],
  cases: ['bisset', 'smithland', 'edgington', 'dimmock', 'withoflanagan', 'spicegirls', 'attwood', 'redgrave', 'derry', 'hedleybyrne', 'royscot', 'howardmarine', 'longlloyd', 'leaf', 'caldwell', 'paoon', 'atlasexpress', 'universesentinel', 'atlanticbaron', 'dsnd', 'timestravel', 'roffey'],
  worked: [{ q: '<b>Scenario.</b> Seller Tom tells Uma that his café “takes about £2,000 a week” — true when he said it in March. By June, when Uma signs, a new motorway bypass has cut takings to £800 a week, which Tom knows but does not mention. Uma did not look at the accounts she was offered. Advise Uma.', s: ['<b class="st">Statement of fact</b>“About £2,000 a week” is a statement of fact about past takings, not opinion.', '<b class="st">Silence</b>It was true when made but became false before the contract. Failing to correct it is a misrepresentation (With v O’Flanagan).', '<b class="st">Inducement</b>Uma relied on it; she did not have to check the accounts (Redgrave v Hurd).', '<b class="st">Type</b>Tom knew of the change, so this may be fraudulent (Derry v Peek) — but fraud is hard to prove. Uma can more easily sue under s2(1) MA 1967: Tom must prove reasonable grounds to believe the statement was still true, which he cannot. Damages as if fraudulent (Royscot).', '<b class="st">Remedy</b>Rescission (if she acts promptly and does not affirm) and/or damages.'], a: 'Misrepresentation by failing to correct a changed statement; rescission and s2(1) damages.' }],
  pitfalls: ['Treating an opinion or sales puff as a statement of fact.', 'Saying silence is never a misrepresentation — learn the exceptions.', 'Forgetting that s2(1) reverses the burden of proof.', 'Saying innocent misrepresentation gives a right to damages — s2(2) is discretionary and instead of rescission.', 'Calling economic duress “threats of violence”.'],
  cards: [
    ['Definition of misrepresentation?', 'An untrue statement of fact by one party to the other that induces the contract.'],
    ['Bisset v Wilkinson (1927)?', 'An honest opinion without special knowledge is not a statement of fact.'],

    ['Four bars to rescission?', 'Affirmation, lapse of time, third-party rights, restitution impossible.'],

  ],
  quiz: [

    { q: 'The test for fraudulent misrepresentation comes from…', o: ['Derry v Peek', 'Royscot v Rogerson', 'Hedley Byrne', 'Redgrave v Hurd'], x: 'Knowingly, without belief, or recklessly.' },
