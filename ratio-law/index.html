/* ---------- 1.2.4 Access to justice and funding ---------- */
TOPICS.push({
  id: '1.2.4', unit: '1B', ref: '1.2.4', title: 'Access to justice and funding',
  short: 'Civil and criminal legal aid, LASPO 2012, Legal Aid Agency, Public Defender Service, CFAs and other funding',
  summary: 'Rights mean little if people cannot afford to enforce them. This topic covers state funding through civil and criminal legal aid, run by the Legal Aid Agency under the Legal Aid, Sentencing and Punishment of Offenders Act 2012 (LASPO), advice schemes, and private alternatives such as conditional fee (“no win, no fee”) agreements. The key evaluative question is whether cuts since 2013 have created barriers to justice.',
  spec: ['The need for legal services; unmet legal need', 'Civil legal aid under LASPO 2012: scope, means and merits tests, exceptional case funding', 'Criminal legal aid: police station advice, the interests of justice and means tests; the Public Defender Service', 'The Legal Aid Agency and advice schemes', 'Alternative methods of funding: conditional fee agreements, damages-based agreements, insurance, pro bono, advice agencies, trade unions', 'Evaluation: access to justice and barriers to justice'],
  learn: [
    { h: 'Why funding matters', html: `
<p>Access to justice is part of the rule of law (Bingham’s principle that disputes should be resolved without prohibitive cost; [[c:unison]]). Legal problems — housing, debt, employment, family breakdown — cluster among people who can least afford lawyers. Without help, people may not know their rights, may give up, or may represent themselves at a disadvantage (an “inequality of arms”).</p>
<p>State-funded legal aid began with the Legal Aid and Advice Act 1949. The <b>Access to Justice Act 1999</b> created the Legal Services Commission. <b>LASPO 2012</b> abolished it and created the <b>Legal Aid Agency</b> (LAA), an executive agency of the Ministry of Justice, which contracts with solicitors’ firms and not-for-profit organisations to provide legal aid.</p>` },
    { h: 'Civil legal aid after LASPO', html: `
<p>LASPO (in force April 2013) cut spending by removing many areas from <b>scope</b>:</p>
<div class="tbl"><table><tr><th>Still in scope (examples)</th><th>Removed from scope (examples)</th></tr>
<tr><td>Family cases involving domestic abuse or child abuse (with evidence); care proceedings; housing where the home is at risk; homelessness; asylum; mental health; community care; discrimination; judicial review; special educational needs</td><td>Most private family law (divorce, child arrangements without abuse); most clinical negligence (except birth injuries); employment; most welfare benefits (except appeals on law); most debt; non-asylum immigration; most consumer and contract disputes</td></tr></table></div>
<ul><li><b>Means test</b>: gross income, disposable income and capital limits. The thresholds were frozen for years so fewer people qualified; a Means Test Review (2022–23) proposed raising them.</li>
<li><b>Merits test</b>: the prospects of success (usually at least 50%) and whether the likely benefit justifies the cost.</li>
<li><b>Exceptional Case Funding</b> (s10 LASPO) for out-of-scope cases where refusal would breach Convention rights (e.g. Art 6) — but few applications succeed.</li>
<li><b>Civil Legal Advice</b> — a telephone service for some areas.</li></ul>` },
    { h: 'Criminal legal aid', html: `
<ul><li><b>Advice at the police station</b>: free, not means-tested, for anyone detained (s58 PACE; the Duty Solicitor Scheme via the Defence Solicitor Call Centre).</li>
<li><b>Duty solicitors</b> at magistrates’ courts for unrepresented defendants.</li>
<li><b>Representation</b> in court needs a representation order. Two tests:
<ol><li><b>Interests of justice</b> (the “Widgery criteria”, Sch 3 LASPO): the defendant is likely to lose their liberty, livelihood or suffer serious damage to reputation; a substantial question of law; inability to understand the proceedings or state their own case; witnesses need to be traced or cross-examined by an expert; it is in the interests of another person (e.g. a child witness) that the defendant is represented. Crown Court cases automatically pass.</li>
<li><b>Means test</b>: in the magistrates’ court, under-18s and those on certain benefits pass automatically; others are assessed on income. In the Crown Court defendants may have to pay contributions from income or capital, and those with high disposable income are ineligible.</li></ol></li></ul>
<p>The <b>Public Defender Service</b> (2001) employs salaried defence lawyers directly through the LAA — a small service compared with private firms.</p>
<p><b>Problems</b>: low fees have driven firms and barristers away from criminal work — the Bellamy Review (2021) recommended an immediate 15% increase; criminal barristers went on strike in 2022. Some police stations and courts struggle to find duty solicitors. People just above the means threshold must pay privately or represent themselves.</p>` },
    { h: 'Alternative methods of funding', html: `
<ul><li><b>Conditional fee agreements (CFAs)</b> — “no win, no fee” (Courts and Legal Services Act 1990 s58). If the case is lost, the lawyer gets no fee; if it is won, the lawyer receives normal fees plus a <b>success fee</b> of up to 100% of base costs. Since LASPO the success fee is paid by the <b>client</b> (not the losing side), capped at 25% of damages (excluding future losses) in personal injury cases. <b>After-the-event insurance</b> covers the risk of paying the other side’s costs.</li>
<li><b>Damages-based agreements (DBAs)</b> (s45 LASPO) — the lawyer takes a percentage of the damages (capped at 25% in personal injury, 35% in employment, 50% otherwise).</li>
<li><b>Before-the-event legal expenses insurance</b>, often added to home or car insurance.</li>
<li><b>Third-party litigation funding</b> — investors fund big claims in return for a share of damages; thrown into doubt by [[c:paccar]] (2023) and the subject of reform proposals.</li>
<li><b>Trade unions</b> fund members’ employment and injury claims.</li>
<li><b>Free advice</b>: Citizens Advice, law centres, university law clinics, pro bono work by lawyers (e.g. Advocate, LawWorks), the Money and Pensions Service, charities such as Shelter.</li>
<li><b>Litigants in person</b> — representing yourself, sometimes with a McKenzie friend.</li></ul>` },
    { h: 'Evaluation: access to justice or barriers to justice?', html: `
<p><b>Criticisms of LASPO:</b> sharp rise in <b>litigants in person</b>, especially in family courts, causing delay; “<b>advice deserts</b>” — the Law Society reported that many areas have no housing legal aid provider; early advice that could stop problems escalating was removed; exceptional case funding is hard to obtain; frozen means thresholds exclude low-income working people; providers are leaving legal aid. The government’s own post-implementation review (2019) accepted some of these problems. The Bach Commission (2017) proposed a statutory right to justice.</p>
<p><b>Defences of the system:</b> the state still spends around £2 billion a year on legal aid; criminal defendants facing prison still get representation; cases involving the most serious issues (liberty, homes, children at risk, domestic abuse) remain in scope; CFAs make personal injury claims accessible without public money; mediation and online processes can resolve disputes more cheaply.</p>` }
  ],
  debate: [{ q: 'Has LASPO created barriers to justice?', for: ['Litigants in person rose sharply, especially in family cases.', 'Advice deserts: no local housing or immigration legal aid provider in many areas.', 'Loss of early advice leads to bigger problems later (and costs elsewhere).', 'Frozen means test thresholds; ECF rarely granted.', 'Criminal legal aid fees too low (Bellamy).'], ag: ['Public money had to be saved; legal aid remains for the most serious matters.', 'Domestic abuse victims and children are still protected.', 'CFAs, insurance and pro bono fill some gaps.', 'ADR and online courts offer cheaper alternatives.', 'Police station advice remains free for all.'] }],
  cases: ['unison', 'paccar'],
  worked: [{ q: '<b>Scenario.</b> Jess, who works part-time, has been charged with assault occasioning ABH and faces trial in the magistrates’ court. Her neighbour Leo is being evicted by his landlord. Her friend Mo wants to sue his employer for unfair dismissal. Advise each on funding.', s: ['<b class="st">Jess</b>At the police station she was entitled to free advice. For representation she needs a representation order: interests of justice (likely — she could lose her liberty and may need witnesses cross-examined) and the magistrates’ means test (depends on her income; part-time earnings may pass).', '<b class="st">Leo</b>Possession proceedings where the home is at risk remain within the scope of civil legal aid under LASPO. He must pass the means and merits tests. A duty adviser at the possession hearing may help.', '<b class="st">Mo</b>Employment claims were removed from scope (except discrimination). He could use a trade union, legal expenses insurance, a CFA or DBA (up to 35% of damages), Citizens Advice or a law clinic, or represent himself; ACAS early conciliation is compulsory first.'], a: 'Jess: criminal legal aid likely. Leo: civil legal aid in scope. Mo: alternatives to legal aid.' }],
  pitfalls: ['Describing the pre-2013 system (Legal Services Commission, Community Legal Service) as current.', 'Saying CFA success fees are paid by the loser — since LASPO the client pays them.', 'Forgetting that police station advice is free for everyone.', 'Evaluating without evidence (litigants in person, advice deserts, Bellamy, Bach).'],
  cards: [
    ['Which Act governs legal aid today?', 'Legal Aid, Sentencing and Punishment of Offenders Act 2012 (LASPO).'],
    ['Which body administers legal aid?', 'The Legal Aid Agency (an executive agency of the MoJ).'],
    ['Two tests for civil legal aid?', 'Means test and merits test (plus the case must be in scope).'],
    ['What is Exceptional Case Funding?', 'Funding for out-of-scope cases where refusal would breach Convention rights (s10 LASPO).'],
    ['Is police station advice means-tested?', 'No — free for anyone detained (s58 PACE).'],
    ['Two tests for criminal legal aid representation?', 'Interests of justice (Widgery criteria) and means test.'],
    ['Name two Widgery criteria.', 'Risk of losing liberty/livelihood/reputation; substantial question of law; can’t understand proceedings; witnesses to trace/cross-examine; interests of another.'],
    ['What is the Public Defender Service?', 'Salaried criminal defence lawyers employed through the LAA (since 2001).'],
    ['What is a CFA?', 'A “no win, no fee” agreement; success fee up to 100% of base costs, paid by the client, capped at 25% of damages in PI.'],
    ['What is a DBA?', 'A damages-based agreement: the lawyer takes a percentage of damages (s45 LASPO).'],
    ['What did the Bellamy Review (2021) recommend?', 'An immediate 15% increase in criminal legal aid funding.'],
    ['What is an advice desert?', 'An area with no (or very few) legal aid providers for a type of law, e.g. housing.']
  ],
  quiz: [
    { q: 'Legal aid is administered by…', o: ['the Legal Aid Agency', 'the Legal Services Commission', 'the Law Society', 'the CPS'], x: 'Since April 2013.' },
    { q: 'Which is still generally within the scope of civil legal aid after LASPO?', o: ['Possession proceedings where the home is at risk', 'Most employment claims', 'Most divorces without abuse', 'Consumer contract disputes'], x: 'Housing where the home is at risk.' },
    { q: 'Advice for a suspect at the police station is…', o: ['free and not means-tested', 'means-tested', 'only for under-18s', 'only for indictable offences'], x: 's58 PACE.' },
    { q: 'The “interests of justice” test applies to…', o: ['criminal legal aid for representation', 'civil legal aid', 'CFAs', 'arbitration'], x: 'The Widgery criteria.' },
    { q: 'Since LASPO, a CFA success fee is paid by…', o: ['the client, out of damages', 'the losing party', 'the Legal Aid Agency', 'the court'], x: 'Capped at 25% of damages in PI.' },
    { q: 'Which review recommended a 15% increase in criminal legal aid?', o: ['The Bellamy Review', 'The Woolf Report', 'The Leggatt Review', 'The Clementi Review'], x: '2021.' },
    { q: 'Exceptional Case Funding is available where…', o: ['refusing funding would breach Convention rights', 'the claim is worth over £1 million', 'the claimant is a company', 'the case is in the Supreme Court'], x: 's10 LASPO.' },
    { q: 'A “damages-based agreement” means the lawyer…', o: ['takes a percentage of the damages won', 'is paid by the state', 'works for free', 'charges a fixed fee'], x: 's45 LASPO.' }
  ],
  exam: [
    { q: 'Explain how criminal legal aid is provided. [5]', m: 5, ms: ['free police station advice — s58 PACE; duty solicitor', 'representation order — interests of justice (Widgery)', 'means test — magistrates vs Crown Court contributions', 'Legal Aid Agency contracts with firms', 'Public Defender Service'] },
    { q: '(a) Explain the availability of civil legal aid and alternative methods of funding civil cases. [10]<br>(b) Analyse and evaluate whether there is adequate access to justice in England and Wales. [15]', m: 25, ms: ['LASPO scope — in and out', 'means and merits tests; ECF', 'LAA and CLA', 'CFAs — success fee, ATE insurance', 'DBAs, BTE, unions, pro bono, advice agencies', 'litigants in person; advice deserts', 'criminal legal aid fees — Bellamy', 'rule of law — UNISON', 'counter-arguments — cost, alternatives', 'conclusion'] }
  ],

TOOLS.jacsteps = { type: 'steps', title: 'How a judge is appointed', intro: 'The Judicial Appointments Commission process for a Circuit Judge vacancy.', steps: [
  { h: 'Vacancy request', html: '<p>The Lord Chancellor asks the JAC to fill vacancies. The JAC publishes the eligibility rules: for a Circuit Judge, a relevant qualification plus at least seven years gaining legal experience (TCEA 2007).</p>' },
  { h: 'Application', html: '<p>Anyone eligible can apply online — barristers, solicitors, and (for some posts) chartered legal executives. Previous judicial experience (e.g. as a Recorder) is often expected.</p>' },
  { h: 'Qualifying test', html: '<p>Online tests of situational judgement and critical analysis — scenarios about fairness, managing a courtroom and applying the law.</p>' },
  { h: 'Shortlisting and references', html: '<p>Candidates are sifted against the JAC’s competency framework (e.g. exercising judgement, possessing and building knowledge, assimilating and clarifying information, working and engaging with others, managing work efficiently). Independent assessors and referees comment.</p>' },
  { h: 'Selection day', html: '<p>A role play (e.g. dealing with a difficult litigant in person), a situational exercise and an interview with a panel including a lay member and a judge.</p>' },
  { h: 'Recommendation', html: '<p>The JAC selects <b>solely on merit</b>, applying the <b>equal merit</b> provision where two candidates are equally strong. It checks good character and consults senior judges. It recommends one candidate per vacancy.</p>' },

TOPICS.push({

  short: 'Law and other rules, criminal and civil law, sources of law including custom',
  summary: 'Law is one kind of rule among many. This topic distinguishes legal rules from other rules and norms, explains the difference between criminal and civil law, and surveys the sources of English law — custom, statute, common law and equity, and international sources. It gives you the vocabulary the rest of the course depends on.',
  spec: ['The distinction between enforceable legal rules and principles and other rules and norms of behaviour', 'Criminal and civil law: purpose, parties, standard of proof, outcomes', 'Sources of law: custom, statute (and delegated legislation), the common law, equity', 'International sources: EU law (historic and assimilated) and the ECHR', 'Theories of law: natural law and legal positivism'],
  learn: [
    { h: 'Legal rules and other rules', html: `
<p>Societies are governed by many kinds of rules: <b>moral</b> rules (do not lie), <b>social</b> norms and etiquette (queue; do not interrupt), <b>religious</b> rules, <b>organisational</b> rules (school rules, sports rules), and <b>legal</b> rules.</p>
<div class="tbl"><table><tr><th>Legal rules…</th><th>Other rules…</th></tr>
<tr><td>are made by recognised authorities (Parliament, courts)</td><td>develop informally or are made by private bodies</td></tr>
<tr><td>are <b>enforceable by the state</b> through courts, with sanctions (fines, prison, damages)</td><td>rely on informal sanctions: disapproval, exclusion, conscience</td></tr>
<tr><td>apply to everyone in the jurisdiction</td><td>apply to members of a group</td></tr>
<tr><td>change by a formal process (legislation, precedent)</td><td>change gradually</td></tr></table></div>
<p><b>Legal positivists</b> (Bentham, Austin, Hart) define law by its source: Austin’s law is a command of a sovereign backed by a sanction; Hart saw law as a system of primary rules (duties) and secondary rules (including a “rule of recognition” identifying valid law). <b>Natural lawyers</b> (Aquinas, Finnis; Fuller’s “inner morality of law”) argue that an unjust law is not truly law — a view tested after the Nazi era (the Hart–Fuller debate about the “grudge informer”).</p>` },
    { h: 'Criminal and civil law', html: `
<div class="tbl"><table><tr><th></th><th>Criminal law</th><th>Civil law</th></tr>
<tr><td>Purpose</td><td>Maintain order, punish wrongdoing against society</td><td>Resolve disputes; uphold rights; compensate</td></tr>
<tr><td>Started by</td><td>The state (usually the CPS): <i>R v Smith</i></td><td>The claimant: <i>Smith v Jones</i></td></tr>
<tr><td>Standard of proof</td><td>Beyond reasonable doubt (burden on the prosecution — <i>Woolmington v DPP</i>, 1935)</td><td>Balance of probabilities (burden usually on the claimant)</td></tr>
<tr><td>Outcome</td><td>Guilty or not guilty; sentence</td><td>Liable or not liable; remedy (damages, injunction)</td></tr>
<tr><td>Examples</td><td>Theft, assault, murder</td><td>Contract, tort, family, property</td></tr></table></div>
<p>One event can give rise to both: a drunk driver who injures a pedestrian may be prosecuted (criminal) and sued for negligence (civil). <b>Public law</b> (criminal, constitutional, human rights, administrative) concerns the state and individuals; <b>private law</b> (contract, tort, family) concerns relations between individuals.</p>` },
    { h: 'Custom', html: `
<p>Much of the <b>common law</b> began as general customs that judges recognised and applied throughout England after 1066. Today, a <b>local custom</b> can still be recognised by the courts if it meets strict tests:</p>
<ul><li>existed since “<b>time immemorial</b>” (1189, the reign of Richard I) — in practice, as long as anyone can remember;</li><li><b>reasonable</b> ([[c:wolstanton]]);</li><li><b>certain</b> as to area and people affected;</li><li>exercised <b>peaceably, openly and as of right</b> (not by permission);</li><li><b>continuous</b>;</li><li>regarded as <b>obligatory</b>;</li><li>consistent with statute and other customs.</li></ul>
<p>Example: [[c:mercer]] (fishermen drying nets). Custom is now a minor source because statute and precedent cover most areas, but commercial custom still shapes implied terms in contracts.</p>` },
    { h: 'Statute, common law and equity', html: `
<ul><li><b>Legislation</b>: Acts of Parliament (primary) and delegated legislation (secondary). The highest source of law because of parliamentary sovereignty.</li>
<li><b>The common law</b>: law developed by judges through precedent — e.g. murder, negligence ([[c:donoghue]]), most of contract law.</li>
<li><b>Equity</b>: developed by the Lord Chancellor and Court of Chancery to soften the rigidity of the common law, based on fairness and conscience. Equitable remedies — injunctions, specific performance, rescission, rectification — are <b>discretionary</b>. Maxims include “he who comes to equity must come with clean hands” and “delay defeats equity”. The Judicature Acts 1873–75 merged the courts; where common law and equity conflict, equity prevails.</li>
<li><b>International sources</b>: EU law (1973–2020, now assimilated law), and the European Convention on Human Rights, given effect by the Human Rights Act 1998.</li></ul>` }
  ],
  debate: [{ q: 'Is an unjust law still “law”?', for: ['Positivists: law is valid if made by the right procedure (Hart’s rule of recognition) — morality is a separate question.', 'Certainty: citizens and officials need to know what the law is, even if they think it is unjust.', 'Parliament can change unjust laws democratically.'], ag: ['Natural law: an unjust law is a corruption of law (Aquinas).', 'Fuller: law must meet minimum standards (published, clear, prospective) to count as law.', 'Nazi laws show legality alone is not enough (the grudge informer cases).', 'Jury equity (Ponting) shows citizens sometimes refuse to apply unjust law.'] }],
  cases: ['mercer', 'wolstanton'],
  worked: [],
  pitfalls: ['Saying civil cases are “prosecuted” or result in “guilty” verdicts.', 'Confusing custom (a source of law) with convention (constitutional practice).', 'Saying equity replaces the common law — it supplements it, and prevails in a conflict.'],
  cards: [
    ['How do legal rules differ from moral rules?', 'Legal rules are made by recognised authorities and enforced by the state with sanctions; moral rules rely on conscience and social disapproval.'],
    ['Standard of proof in criminal cases?', 'Beyond reasonable doubt.'],
    ['What is “time immemorial”?', '1189 — the date from which a custom must have existed.'],

    ['Mercer v Denne (1905)?', 'Fishermen’s custom of drying nets on a beach was upheld.'],
    ['What is equity?', 'A body of law based on fairness developed by the Court of Chancery; its remedies are discretionary.'],
    ['Public vs private law?', 'Public: state and individual (criminal, constitutional). Private: between individuals (contract, tort).'],

TOPICS.push({

  short: 'The rule of law, human rights, fault, balancing conflicting interests, public v private interests',
  summary: 'Law exists to serve society: it keeps order, settles disputes, protects rights and reflects (and shapes) social values. The specification asks you to consider the rule of law, human rights, the importance of fault, how the law balances conflicting interests, and when individual rights give way to community interests. These themes earn AO3 marks across every paper.',
  spec: ['The rule of law and human rights in society', 'The meaning and importance of fault in civil and criminal law', 'Balancing conflicting interests; identifying the different interests of parties to disputes', 'Public interests against private interests; the subordination of individual rights to community interests', 'Law as a means of social control and social change'],
  learn: [
    { h: 'What law does for society', html: `
<ul><li><b>Social control</b>: defines unacceptable behaviour and punishes it (criminal law).</li>
<li><b>Dispute resolution</b>: peaceful settlement through courts, tribunals and ADR.</li>
<li><b>Protecting rights and freedoms</b>: the Human Rights Act 1998, equality law.</li>
<li><b>Regulating</b> activities: health and safety, consumer protection, the environment.</li>
<li><b>Social change</b>: law can lead opinion (the Race Relations Act 1965, the smoking ban 2007, the Marriage (Same Sex Couples) Act 2013) or follow it (decriminalising homosexuality in 1967 after the Wolfenden Report).</li></ul>
<p><b>Consensus</b> theorists (Durkheim) see law as reflecting shared values; <b>conflict</b> theorists (Marx) see it as protecting the interests of the powerful.</p>` },
    { h: 'Balancing conflicting interests', html: `
<p>The American jurist <b>Roscoe Pound</b> described law as “<b>social engineering</b>”: balancing competing interests to satisfy as many as possible with the least friction. He identified <b>individual</b> interests (personal, property), <b>public</b> interests (of the state) and <b>social</b> interests (general security, morals, conservation, progress).</p>
<p>Examples across the course:</p>
<ul><li><b>Nuisance</b>: a landowner’s right to use land versus a neighbour’s enjoyment of theirs; the community’s interest in recreation — [[c:millerjackson]].</li>
<li><b>Negligence</b>: the courts weigh the cost of precautions and the social value of an activity; the Compensation Act 2006 s1 and the Social Action, Responsibility and Heroism Act 2015 protect “desirable activities” and volunteers.</li>
<li><b>Human rights</b>: privacy (Art 8) against freedom of expression (Art 10) in celebrity cases; protest (Art 11) against the rights of others.</li>
<li><b>Criminal law</b>: autonomy (consent) against protection from harm — [[c:brown]].</li>
<li><b>Contract</b>: freedom of contract against consumer protection.</li></ul>` },
    { h: 'Public versus private interests', html: `
<p>Sometimes individual rights are <b>subordinated</b> to community interests:</p>
<ul><li>Qualified Convention rights (Arts 8–11) may be restricted where necessary in a democratic society for public safety, health, the prevention of crime or the rights of others.</li>
<li>COVID-19 regulations (2020–21) restricted liberty, assembly and worship to protect public health.</li>
<li>Compulsory purchase of land for infrastructure (e.g. HS2).</li>
<li>Police powers of stop and search (PACE 1984) and terrorism powers.</li>
<li>Public policy limits on duty of care — the police are generally not liable for failing to catch a criminal (Hill v Chief Constable of West Yorkshire, 1988).</li></ul>
<p>But the courts also protect individuals against the state: [[c:entick]], [[c:belmarsh]], [[c:unison]].</p>` },
    { h: 'The rule of law and human rights in society', html: `
<p>The rule of law (see topic 1.1.1b) means the state is bound by law, laws are clear and public, everyone is equal before the law, and there is access to independent courts. Human rights — protected by the ECHR and the Human Rights Act 1998 — set minimum standards the state must respect. Both limit what a democratic majority can do to individuals and minorities, and both depend on independent judges and access to justice (legal aid).</p>` },
    { h: 'The importance of fault', html: `
<p><b>Fault</b> means blameworthiness: the defendant could and should have acted differently. It is a basic principle of fairness that people should only be punished or made to pay for harm they are responsible for.</p>
<h4>Criminal law</h4><ul><li>Most offences require <b>mens rea</b>: intention, recklessness or (for gross negligence manslaughter) gross negligence. The level of fault affects the offence (murder v manslaughter) and the sentence (culpability under s63 Sentencing Act 2020).</li>
<li>Defences such as insanity, duress and self-defence remove or reduce fault.</li>
<li><b>Strict liability</b> offences need no fault as to at least one element (e.g. selling alcohol to a child, some pollution and food safety offences) — justified by public protection and ease of enforcement, criticised as unjust (see topic 2.3.2).</li></ul>
<h4>Civil law</h4><ul><li><b>Negligence</b> is fault-based: the defendant must fall below the standard of the reasonable person. Contributory negligence reduces damages by the claimant’s own fault.</li>
<li><b>Strict liability</b> in tort: Rylands v Fletcher, defective products (Consumer Protection Act 1987), and <b>vicarious liability</b>, where an employer is liable without personal fault.</li>
<li>Contract liability is largely strict: breach is enough, whatever the reason.</li>
<li><b>No-fault compensation</b>: the Criminal Injuries Compensation Scheme, vaccine damage payments; New Zealand’s accident compensation scheme replaced personal injury litigation. The Pearson Commission (1978) considered but did not adopt it.</li></ul>` }
  ],
  debate: [{ q: 'Should liability always depend on fault?', for: ['Fairness: people should only be punished for what they could have avoided.', 'Moral blame justifies the stigma of a criminal conviction.', 'Fault-based rules encourage care (deterrence).', 'Strict liability can convict the blameless (Callow v Tillstone).'], ag: ['Strict liability protects the public in regulated activities (food, pollution, alcohol sales).', 'Easier and cheaper to enforce; encourages the highest standards.', 'Victims need compensation whether or not anyone is at fault.', 'Fault-based negligence claims are slow and expensive; no-fault schemes are fairer to victims.'] }],

  id: 'N3', unit: 'N', ref: 'Law and morality', title: 'Law and morality',
  short: 'Distinguishing law and morals, pluralism, the Hart–Devlin debate, enforcing moral values',
  summary: 'Law and morality overlap — murder is both illegal and immoral — but they are not the same. This topic asks how they differ, how a law can reflect morality in a society with many moral views, and whether the state should enforce morality at all: the famous Hart–Devlin debate. Judges and Parliament have faced this question in cases about sexual behaviour, consent to harm, abortion and the end of life.',
  spec: ['The distinction between law and morals', 'The diversity of moral views in a pluralist society', 'The relationship between law and morals and its importance', 'The legal enforcement of moral values: the Hart–Devlin debate, Mill’s harm principle', 'Case law and statute illustrating law and morality'],
  learn: [
    { h: 'How law and morality differ', html: `
<div class="tbl"><table><tr><th>Law</th><th>Morality</th></tr>
<tr><td>Made deliberately by Parliament or judges on a particular date</td><td>Develops gradually; no single author</td></tr>
<tr><td>Enforced by the state; formal sanctions</td><td>Enforced by conscience and social pressure</td></tr>
<tr><td>Clear (ideally) and ascertainable</td><td>Often uncertain and disputed</td></tr>
<tr><td>Can be broken without being immoral (parking offences, strict liability)</td><td>Can be immoral without being illegal (lying, adultery, failing to help a stranger in danger)</td></tr></table></div>
<p>The overlap is large: murder, theft, assault and fraud are both. But in England there is <b>no general legal duty to rescue</b> a stranger — a clear gap between law and morality (see omissions, topic 2.3.2).</p>` },
    { h: 'A pluralist society', html: `
<p>England and Wales is a <b>pluralist</b> society: people hold different religious and secular moral views. Issues on which views sharply differ include abortion, assisted dying, drug use, same-sex relationships, surrogacy and gender identity. Law-makers must decide whether to reflect a majority view, protect minorities, or leave choices to individuals.</p>
<p>Examples of changing law reflecting changing morality: the <b>Suicide Act 1961</b> (suicide decriminalised); the <b>Sexual Offences Act 1967</b> (decriminalised homosexual acts in private, following the Wolfenden Report); the <b>Abortion Act 1967</b>; the abolition of the death penalty (1965); [[c:rvr]] (1991); the <b>Marriage (Same Sex Couples) Act 2013</b>; the Children (Abolition of Defence of Reasonable Punishment) (Wales) Act 2020; the debate on the Terminally Ill Adults (End of Life) Bill (2024–).</p>` },
    { h: 'The Hart–Devlin debate', html: `
<p>The <b>Wolfenden Report</b> (1957) recommended decriminalising private homosexual acts between consenting adults, stating that there must remain “a realm of private morality and immorality which is, in brief and crude terms, not the law’s business”.</p>
<div class="debate"><div class="for"><h5>Lord Devlin — enforce shared morality</h5><ul><li>Society is held together by a <b>shared morality</b>; undermining it threatens society, like treason.</li><li>The law may enforce morality where conduct provokes “<b>intolerance, indignation and disgust</b>” in the reasonable person — “the man on the Clapham omnibus” or the jury box.</li><li>There should be toleration of maximum individual freedom consistent with the integrity of society.</li></ul></div><div class="ag"><h5>Professor Hart — the harm principle</h5><ul><li>Based on <b>John Stuart Mill</b>’s <i>On Liberty</i> (1859): the only purpose for which power can rightfully be exercised over anyone, against their will, is to <b>prevent harm to others</b>.</li><li>No evidence that private immorality threatens society’s survival.</li><li>Disgust is not a reliable guide — majorities can be prejudiced.</li><li>Accepted limited <b>paternalism</b> (protecting people from themselves, e.g. drugs) but not enforcing morality as such.</li></ul></div></div>` },
    { h: 'Morality in the courts', html: `
<ul><li><b>Judges enforcing morality</b>: [[c:shaw]] and [[c:knuller]] (conspiracy to corrupt public morals); [[c:brown]] (no consent to sadomasochistic injuries).</li>
<li><b>Judges respecting autonomy</b>: [[c:wilson]]; [[c:gillick]]; the dissent in Brown (Lords Mustill and Slynn).</li>
<li><b>Life and death</b>: [[c:dudley]] (necessity no defence to murder); [[c:bland]]; [[c:rea]]; [[c:pretty]]; [[c:nicklinson]] — judges repeatedly said the most divisive moral issues are for Parliament.</li>
<li><b>Judge-led moral change</b>: [[c:rvr]] (marital rape).</li>
<li><b>Consent in statute</b>: the Domestic Abuse Act 2021 s71 confirmed that consent to serious harm for sexual gratification is no defence (the “rough sex” defence).</li></ul>` }
  ],
  debate: [{ q: 'Should the law enforce moral values?', for: ['Devlin: a shared morality holds society together.', 'Law protects the vulnerable from exploitation (Brown; Pretty).', 'Public disgust reflects values most citizens share.', 'Law expresses society’s values (e.g. hate crime aggravation).'], ag: ['Hart and Mill: only harm to others justifies coercion.', 'Pluralism: there is no single shared morality to enforce.', 'Enforcing majority morality oppresses minorities (Knuller).', 'Moral values change — the law can become outdated and cruel.'] }],
  cases: ['shaw', 'knuller', 'brown', 'wilson', 'gillick', 'bland', 'rea', 'pretty', 'nicklinson', 'dudley', 'rvr'],
  worked: [],
  pitfalls: ['Describing the Hart–Devlin debate without applying it to cases or statutes.', 'Saying law and morality are the same thing.', 'Forgetting that judges have often sent moral issues back to Parliament (Bland, Nicklinson).'],
  cards: [

TOPICS.push({

  short: 'Meaning of justice, theories of justice, whether rules, institutions and processes achieve justice',
  summary: 'Justice is the ideal the law aims at — but what does it mean? Philosophers from Aristotle to Rawls have given different answers: fairness, desert, equality, utility, entitlement. This topic introduces the main theories and then asks the specification’s question: to what extent do substantive legal rules, legal institutions and processes achieve justice or create barriers to it?',
  spec: ['The meaning of justice: formal, substantive, procedural and natural justice', 'Theories of justice: Aristotle, utilitarianism (Bentham, Mill), natural law, Rawls, Nozick, Marx', 'The extent to which substantive legal rules achieve justice', 'The extent to which legal institutions and processes achieve justice or create barriers to justice'],
  learn: [
    { h: 'Meanings of justice', html: `
<ul><li><b>Formal justice</b>: treating like cases alike (Perelman) — the basis of precedent.</li>
<li><b>Substantive justice</b>: whether the rules themselves are fair in content.</li>
<li><b>Procedural justice</b>: fair procedures — independent judges, a fair hearing, legal representation, a right of appeal.</li>
<li><b>Natural justice</b>: two rules of procedural fairness — <i>audi alteram partem</i> (hear the other side) and <i>nemo iudex in causa sua</i> (no one should be a judge in their own cause: [[c:dimes]], [[c:pinochet]]).</li>
<li><b>Distributive</b> justice (fair sharing of benefits and burdens) and <b>corrective</b> justice (putting right wrongs between individuals — damages in tort) — both from Aristotle.</li></ul>` },
    { h: 'Theories of justice', html: `
<div class="tbl"><table><tr><th>Theory</th><th>Key idea</th><th>Legal example</th></tr>
<tr><td><b>Aristotle</b></td><td>Justice as giving each their due; distributive and corrective justice; equals treated equally</td><td>Tort damages restore the claimant (corrective); taxation and legal aid (distributive)</td></tr>
<tr><td><b>Natural law</b> (Aquinas)</td><td>Human law must conform to a higher moral law</td><td>Human rights; jury equity; [[c:sigsworth]]</td></tr>
<tr><td><b>Utilitarianism</b> (Bentham, Mill)</td><td>The right act produces “the greatest happiness of the greatest number”</td><td>Public policy limits in negligence; [[c:millerjackson]]; strict liability; majority verdicts</td></tr>
<tr><td><b>Rawls</b> (<i>A Theory of Justice</i>, 1971)</td><td>Justice as fairness: principles chosen behind a “<b>veil of ignorance</b>” in the “original position”. (1) Equal basic liberties; (2) inequalities only if they benefit the least advantaged (the <b>difference principle</b>) and offices are open to all</td><td>Legal aid; human rights; equal access to the professions and judiciary</td></tr>
<tr><td><b>Nozick</b> (<i>Anarchy, State and Utopia</i>, 1974)</td><td>Entitlement theory: a distribution is just if property was acquired and transferred justly; a minimal state; redistribution violates rights</td><td>Freedom of contract; property rights; criticism of legal aid funded by taxation</td></tr>
<tr><td><b>Marx</b></td><td>Law is a tool of the ruling class; true justice needs a classless society</td><td>Criticisms of unequal access to justice; the Post Office scandal</td></tr></table></div>` },
    { h: 'Do substantive rules achieve justice?', html: `
<p>Examples you can use from your options:</p>
<ul><li><b>Criminal</b>: the mandatory life sentence for murder treats mercy killers like contract killers; the Law Commission called the law of murder “a rambling edifice”; the OAPA 1861 is outdated; strict liability can convict the blameless; loss of control and diminished responsibility reforms (2009) aimed at fairer outcomes; consent in [[c:brown]].</li>
<li><b>Tort</b>: fault-based negligence leaves many victims uncompensated; limits on psychiatric injury and pure economic loss; contributory negligence achieves fairer apportionment.</li>
<li><b>Contract</b>: consumer protection (Consumer Rights Act 2015) corrects inequality of bargaining power; the postal rule and privity can produce unfair results.</li>
<li><b>Human rights</b>: the HRA gives remedies against the state, but declarations of incompatibility do not help the claimant directly.</li>
<li><b>Precedent and statutory interpretation</b>: rigidity ([[c:berriman]]) versus flexibility (the Practice Statement; the purposive approach).</li></ul>` },
    { h: 'Do institutions and processes achieve justice?', html: `
<ul><li><b>Juries</b>: lay participation and jury equity versus bias and unexplained verdicts.</li>
<li><b>Appeals and the CCRC</b>: correcting miscarriages of justice — [[c:mcilkenny]], the Guildford Four, Stefan Kiszko, Sally Clark, Andrew Malkinson (2023), the Post Office Horizon scandal ([[c:hamilton]]).</li>
<li><b>Access to justice</b>: LASPO cuts and litigants in person; court fees ([[c:unison]]); delays (“justice delayed is justice denied”) with record Crown Court backlogs.</li>
<li><b>Judiciary</b>: independence and impartiality versus lack of diversity.</li>
<li><b>ADR and tribunals</b>: cheaper and quicker, but an inequality of arms.</li></ul>` }
  ],

  cases: ['dimes', 'pinochet', 'sigsworth', 'millerjackson', 'brown', 'berriman', 'mcilkenny', 'hamilton', 'unison'],
  worked: [],
  pitfalls: ['Describing theories without linking them to real rules, cases or institutions.', 'Saying justice has one agreed meaning.', 'Forgetting procedural justice (fair process) as well as substantive justice (fair outcomes).'],
  cards: [
    ['Formal justice?', 'Treating like cases alike (Perelman).'],

  const s = T(t.id), q = (s.quiz || 0) / 100, d = deck(t);

  /* The home bookshelf: one bound volume per topic, grouped by unit on shelves. */
  function drawShelf(cv) {

  /* ---------- Flashcards (Leitner boxes) ---------- */

        if (pos >= queue.length) { host.innerHTML = modeBar + `<div class="card result"><div class="eyebrow">Session complete</div><div class="big">${reviewed}</div><p class="lede" style="margin:8px auto">cards reviewed. Known (box 3+): ${d.filter(c => (s.cards[c.k] || 0) >= 3).length}/${d.length}</p><button class="btn primary" id="again">Review again</button></div>`; $('#again').onclick = start; wireMode(); return; }

          <div class="fc-ctl">${flipped ? `<button class="btn" data-r="0" style="border-color:var(--bad);color:var(--bad)">Again <kbd>1</kbd></button><button class="btn" data-r="1">Hard <kbd>2</kbd></button><button class="btn" data-r="2" style="border-color:var(--good);color:var(--good)">Good <kbd>3</kbd></button><button class="btn" data-r="3">Easy <kbd>4</kbd></button>` : `<button class="btn primary" id="flip">Show answer <kbd>Space</kbd></button>`}</div>
          <div class="boxes">${counts.map((n, b) => `<span>${b ? 'Box ' + b : 'New'}: ${n}</span>`).join('')}</div></div>`;

      };

  /* ---------- Quiz engine ---------- */
  function caseQs(t, n) {
    const ids = (t.cases || []).filter(id => CASES[id]); if (ids.length < 2) return [];
    return shuffle(ids).slice(0, n).map(id => { const c = CASES[id], pool = Object.values(CASES).filter(x => x !== c && (x.a === c.a || ids.includes(x.id))); const w = shuffle(pool).slice(0, 3); return { q: `Which case? <span class="muted">${esc(c.f)}</span>`, o: [`<i class="cn">${esc(c.n)}</i> (${c.y})`, ...w.map(x => `<i class="cn">${esc(x.n)}</i> (${x.y})`)], x: esc(c.p) }; });
  }
  function runQuiz(host, items, o = {}) {
    const qs = items.map(it => ({ ...it, order: shuffle(it.o.map((_, i) => i)) }));
    let i = 0, res = [];
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${esc(q.topic)}</a>` : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.q)}</div>
        <div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p><div id="fb"></div>`;
      $$('.opt', host).forEach(b => b.onclick = e => { if (e.target.closest('.case')) return; answer(+b.dataset.k); });
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i || k >= q.order.length) return;
      const ok = q.order[k] === 0; res.push({ ok, q }); (ok ? sfx.good : sfx.bad)();
      $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100);
      S.stats.quizzes++; if (p === 100) { S.stats.perfect++; burst(); sfx.win(); } save();
      o.onDone && o.onDone({ correct, total: qs.length, pct: p });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete</div><div class="big">${p}%</div><p class="lede" style="margin:8px auto">${correct} of ${qs.length} correct${p === 100 ? ' — unanimous!' : p >= 70 ? ' — strong.' : ' — review the notes and try again.'}</p>
        <div class="stack" style="text-align:left;max-width:640px;margin:18px auto 0">${res.filter(r => !r.ok).map(r => `<div class="explain"><b class="v bad">Review</b> ${rich(r.q.q)}<br><span class="small">Answer: <b>${rich(r.q.o[0])}</b></span></div>`).join('')}</div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>`;
      $('#retry').onclick = () => runQuiz(host, o.regen ? o.regen() : items, o);
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const m = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (m != null && res.length === i && i < qs.length) answer(m); else if (e.key === 'Enter' && $('#nextq')) { e.preventDefault(); $('#nextq').click(); } };
    addEventListener('keydown', key);
    if (cleanup) try { cleanup(); } catch (e) { }
    cleanup = () => removeEventListener('keydown', key);
    render();
  }
  function quizTab(host, t) {
    const s = T(t.id);
    const gen = () => shuffle([...t.quiz, ...caseQs(t, 4)]).slice(0, 14);
    host.innerHTML = `<div class="quiz-wrap" id="qz"></div>`;
    runQuiz($('#qz'), gen(), { title: t.id + ' quiz', regen: gen, onDone: r => { s.quiz = Math.max(s.quiz || 0, r.pct); save(); addXP(r.correct * 5 + (r.pct === 100 ? 20 : 0), 'Quiz complete'); } });
  }

  /* ---------- Exam practice (self-marked) ---------- */
  function examBlock(q, key, onMark) {
    const draftKey = 'ratio.draft.' + key; let draft = ''; try { draft = localStorage.getItem(draftKey) || ''; } catch (e) { }
    const el = h('div', { class: 'examq' }, `<div class="eh"><div>${rich(q.q)}</div><span class="pill mk">${q.m} marks</span></div>${q.scen ? `<div class="scen">${rich(q.scen)}</div>` : ''}
      <textarea placeholder="Plan or write your answer here (saved in this browser)…" aria-label="Your answer">${esc(draft)}</textarea>
      <div class="row" style="padding:0 18px 14px"><button class="btn sm" data-show>Show mark scheme</button><span class="small muted">${q.m >= 15 ? 'Levels-marked: tick the indicative content you covered, then judge the level.' : 'Tick each point you made.'}</span></div>
      <div class="ms" hidden><div class="eyebrow" style="margin-bottom:6px">Indicative content</div>${q.ms.map((p, i) => `<label><input type="checkbox" data-i="${i}"> <span>${rich(p)}</span></label>`).join('')}
      ${q.m >= 10 ? `<div class="tbl levels"><table><tr><th>Level</th><th>What it looks like</th></tr>${LEVELS_TXT(q.m).map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>` : ''}
      <div class="row" style="margin-top:10px"><span class="pill acc" data-score>0 / ${q.m}</span><button class="btn sm primary" data-save>Record my mark</button></div></div>`);
    const ta = $('textarea', el); ta.oninput = () => { try { localStorage.setItem(draftKey, ta.value); } catch (e) { } };
    $('[data-show]', el).onclick = () => { $('.ms', el).hidden = !$('.ms', el).hidden; };
    const score = () => { const n = $$('input:checked', el).length; return Math.min(q.m, Math.round(n / q.ms.length * q.m)); };
    $$('input', el).forEach(c => c.onchange = () => { $('[data-score]', el).textContent = `${score()} / ${q.m}`; });
    $('[data-save]', el).onclick = e => { const sc = score(); e.target.disabled = true; e.target.textContent = 'Recorded'; onMark(sc, q.m); };
    return el;
  }
  const LEVELS_TXT = m => m >= 15 ? [['Top', 'Thorough, accurate knowledge; authority used precisely; sustained, logical argument; well-developed application or evaluation leading to a reasoned conclusion'], ['Upper-middle', 'Good knowledge with some authority; clear application or evaluation, though not always developed'], ['Lower-middle', 'Some relevant knowledge; limited authority; application or evaluation is partial or descriptive'], ['Bottom', 'Basic, fragmented knowledge; little or no authority; assertion rather than argument']] : [['Top', 'Clear, accurate and detailed explanation supported by authority'], ['Middle', 'Some accurate explanation; limited authority or development'], ['Bottom', 'Basic or partly accurate points']];
  function examTab(host, t) {
    const s = T(t.id); s.examMarks ??= {};
    host.innerHTML = `<p class="small muted" style="max-width:70ch">Questions in the style of Eduqas papers. Short questions test knowledge (AO1); scenario questions test application (AO2); “analyse and evaluate” questions test AO3. Write or plan an answer, then mark it honestly against the indicative content.</p><div id="eqs"></div>`;
    t.exam.forEach((q, i) => $('#eqs').append(examBlock(q, t.id + '.' + i, (sc, m) => { s.examMarks[i] = sc / m; const vals = t.exam.map((_, j) => s.examMarks[j] || 0); s.exam = vals.reduce((a, b) => a + b, 0) / t.exam.length; S.stats.examMarks += sc; save(); addXP(sc * 2, 'Exam question marked'); })));
  }

  /* ---------- CASEBOOK ---------- */
  function casebook() {
    crumbs('<b>Casebook</b>');
    let area = 'all', q = '', cover = false;
    const areas = [['all', 'All'], ...UNITS.filter(u => u.id !== 'S').map(u => [u.id, u.short])];
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">The casebook</h1><p class="lede">Every case in Ratio, with its facts and the principle it established. Case names in the notes open the same summary. Hide the facts to test yourself.</p>
      <div class="filters"><input id="cq" type="search" placeholder="Search cases, facts or principles…" aria-label="Search cases"><div class="seg" id="cv"><button data-c="0" class="on">Show all</button><button data-c="1">Hide facts</button></div></div>
      <div class="row" id="ca" style="margin-bottom:16px">${areas.map(([k, l]) => `<button class="btn sm ${k === 'all' ? 'primary' : ''}" data-a="${k}" ${k !== 'all' && !unitInScope(k) ? 'style="opacity:.5"' : ''}>${esc(l)}</button>`).join('')}</div><div id="clist"></div>`;
    const render = () => {
      const list = Object.values(CASES).filter(c => (area === 'all' ? unitInScope(c.a) : c.a === area) && (!q || (c.n + ' ' + c.f + ' ' + c.p).toLowerCase().includes(q))).sort((a, b) => a.n.localeCompare(b.n));
      $('#clist').innerHTML = `<p class="small muted">${list.length} cases</p><div class="case-grid">${list.map(c => caseCard(c, cover)).join('')}</div>`;
      $$('.case-card.cover').forEach(cd => cd.onclick = () => cd.classList.toggle('peek'));
    };
    $('#cq').oninput = e => { q = e.target.value.toLowerCase().trim(); render(); };
    $$('#ca button').forEach(b => b.onclick = () => { area = b.dataset.a; $$('#ca button').forEach(x => x.classList.toggle('primary', x === b)); render(); });
    $$('#cv button').forEach(b => b.onclick = () => { cover = b.dataset.c === '1'; $$('#cv button').forEach(x => x.classList.toggle('on', x === b)); render(); });
    render();
  }
  function statutes(tab) {
    crumbs('<b>Statutes & terms</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Statutes &amp; terms</h1><p class="lede">The key sections you are expected to quote, and the Latin and legal terms examiners reward.</p>
      <nav class="tabs" style="position:static"><a class="tab ${tab === 'acts' ? 'on' : ''}" href="#/statutes/acts">Statute book<span class="n">${STATUTES.length}</span></a><a class="tab ${tab === 'terms' ? 'on' : ''}" href="#/statutes/terms">Glossary<span class="n">${GLOSSARY.length}</span></a></nav>
      <div class="filters"><input id="sq" type="search" placeholder="Filter…" aria-label="Filter"></div><div id="slist"></div>`;
    const render = q => {
      if (tab === 'terms') $('#slist').innerHTML = `<div class="gloss">${GLOSSARY.filter(g => !q || (g[0] + g[1]).toLowerCase().includes(q)).sort((a, b) => a[0].localeCompare(b[0])).map(g => `<div><b>${esc(g[0])}</b><span>${esc(g[1])}</span></div>`).join('')}</div>`;
      else $('#slist').innerHTML = `<div class="stat-list">${STATUTES.filter(st => unitInScope(st.a) || st.a === '1A' || st.a === '1B').filter(st => !q || (st.n + st.s.flat().join(' ')).toLowerCase().includes(q)).map(st => `<div class="statute" style="--uc:${ucol(st.a)}"><h4>${esc(st.n)}</h4><dl>${st.s.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${rich(v)}</dd>`).join('')}</dl></div>`).join('')}</div>`;
    };
    $('#sq').oninput = e => render(e.target.value.toLowerCase().trim()); render('');
  }

  /* ---------- ASSESSMENT ---------- */
  function assess() {
    crumbs('<b>Assessment</b>'); if (!S.assessSeen) { S.assessSeen = 1; save(); checkBadges(); }
    V().innerHTML = `<div class="notes" style="max-width:none">${ASSESS_HTML}</div>`;
  }

  /* ---------- MOCK PAPERS ---------- */
  function mock() {
    crumbs('<b>Mock papers</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Mock papers</h1><p class="lede">Timed papers in the Eduqas format, built from your three areas. Answer in the boxes (or on paper), then mark against the indicative content. Your answers stay in this browser.</p>
      <div class="grid g3 sec">${MOCKS.map(m => `<a class="card linkcard" href="#/mock/${m.id}"><div class="eyebrow">${esc(m.meta)}</div><div class="h3" style="margin:6px 0">${esc(m.title)}</div><p class="small muted" style="margin:0">${esc(m.blurb)}</p></a>`).join('')}</div>`;
  }
  function mockPaper(id) {
    const m = MOCKS.find(x => x.id === id); if (!m) return mock();
    crumbs(`<a href="#/mock">Mock papers</a> / <b>${esc(m.title)}</b>`);
    const secs = m.build();
    let secsLeft = m.mins * 60, running = false, iv = null, got = 0, total = 0;
    V().innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">${esc(m.meta)}</div><h1 class="display" style="font-size:clamp(28px,4.4vw,44px);margin-top:6px">${esc(m.title)}</h1></div>
      <div class="card flat" style="padding:12px 16px;text-align:center"><div class="eyebrow">Time</div><div class="timer-big" id="mt">${fmt(secsLeft)}</div><div class="row" style="justify-content:center;margin-top:6px"><button class="btn sm primary" id="mgo">Start</button><button class="btn sm" id="mrs">Reset</button></div></div></div>
      <div class="box tip"><b class="lbl">Instructions</b><p>${m.instr}</p></div><div id="mq"></div>
      <div class="card sec" style="text-align:center"><div class="eyebrow">Your total</div><div style="font:700 48px var(--f-display)" id="mtot">0 / ${secs.reduce((a, s) => a + s.qs.reduce((b, q) => b + q.m, 0), 0)}</div><button class="btn primary" id="mdone">Finish paper</button></div>`;
    secs.forEach((s, si) => { $('#mq').insertAdjacentHTML('beforeend', `<h2 class="h3" style="margin:28px 0 6px;color:${s.css || 'inherit'}">${esc(s.h)}</h2>${s.note ? `<p class="small muted">${esc(s.note)}</p>` : ''}`); s.qs.forEach((q, qi) => { total += q.m; $('#mq').append(examBlock(q, `mock.${id}.${si}.${qi}`, sc => { got += sc; $('#mtot').textContent = `${got} / ${$('#mtot').textContent.split('/ ')[1]}`; S.stats.examMarks += sc; save(); })); }); });
    function fmt(x) { x = Math.max(0, x); return Math.floor(x / 3600) + ':' + pad2(Math.floor(x % 3600 / 60)) + ':' + pad2(Math.floor(x % 60)); }
    $('#mgo').onclick = () => { running = !running; $('#mgo').textContent = running ? 'Pause' : 'Resume'; if (running) iv = setInterval(() => { secsLeft--; $('#mt').textContent = fmt(secsLeft); if (secsLeft <= 0) { clearInterval(iv); running = false; toast('<b>Time</b> Pens down'); sfx.gavel(); } }, 1000); else clearInterval(iv); };
    $('#mrs').onclick = () => { clearInterval(iv); running = false; secsLeft = m.mins * 60; $('#mt').textContent = fmt(secsLeft); $('#mgo').textContent = 'Start'; };
    $('#mdone').onclick = () => { clearInterval(iv); S.stats.mocks++; save(); addXP(50, 'Mock paper completed'); burst(); };
    cleanup = () => clearInterval(iv);
  }

  /* ---------- ARCADE / DAILY / PROGRESS / ABOUT ---------- */
  function arcade() {
    crumbs('<b>Arcade</b>');
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Arcade</h1><p class="lede">Quick games to drill case law, principles and terminology. Games use only the areas you study.</p>
      <div class="grid g3 sec">${Object.entries(GAMES).map(([id, g]) => `<a class="game-card" href="#/game/${id}" style="--uc:${g.col}"><div class="art"><canvas data-art="${id}"></canvas></div><div class="eyebrow">${esc(g.skill)}</div><div class="h3">${esc(g.title)}</div><p class="small muted" style="margin:0">${esc(g.blurb)}</p><span class="small mono">Best: ${S.games[id]?.best || 0}</span></a>`).join('')}</div>`;
    $$('[data-art]').forEach(cv => drawGameArt(cv, cv.dataset.art));
  }
  function daily() {
    crumbs('<b>Daily docket</b>');
    let seed = +today().replace(/-/g, ''); const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const pool = allTopics().flatMap(t => t.quiz.map(q => ({ ...q, topic: t.id })));
    const items = []; const used = new Set(); while (items.length < 5 && used.size < pool.length) { const k = Math.floor(rnd() * pool.length); if (!used.has(k)) { used.add(k); items.push(pool[k]); } }
    V().innerHTML = `<div class="quiz-wrap" style="margin:0 auto"><h1 class="display" style="font-size:clamp(28px,4vw,40px);margin-bottom:6px">Today’s docket</h1><p class="muted">Five questions, the same for everyone today. ${S.daily[today()] != null ? `You scored ${S.daily[today()]}/5 today.` : ''}</p><div id="qz" style="margin-top:18px"></div></div>`;
    runQuiz($('#qz'), items, { title: 'Daily docket', onDone: r => { const first = S.daily[today()] == null; S.daily[today()] = Math.max(S.daily[today()] || 0, r.correct); save(); if (first) addXP(r.correct * 10, 'Daily docket'); } });
  }
  function progress() {
    crumbs('<b>Progress</b>');
    const L = level(), days = Array.from({ length: 28 }, (_, i) => { const d = dstr(new Date(Date.now() - (27 - i) * 864e5)); return [d, S.days[d] || 0]; }), mx = Math.max(10, ...days.map(d => d[1]));
    V().innerHTML = `<h1 class="display" style="font-size:clamp(32px,5vw,50px)">Progress</h1>
      <div class="grid g3 sec" style="margin-top:18px"><div class="card"><div class="eyebrow">Level ${L.l}</div><div class="h2" style="margin:8px 0">${esc(L.name)}</div><div class="bar" style="--uc:var(--gilt)"><i style="width:${clamp(L.frac, 0, 1) * 100}%"></i></div><p class="small muted">${S.xp} XP · next level at ${Math.round(L.next)}</p></div>
      <div class="card"><div class="eyebrow">Last 28 days</div><svg viewBox="0 0 280 90" width="100%" height="110" role="img" aria-label="XP earned per day">${days.map(([d, v], i) => `<rect x="${i * 10 + 1}" y="${80 - v / mx * 70}" width="8" height="${Math.max(1, v / mx * 70)}" rx="1.5" fill="${v ? 'var(--accent)' : 'var(--line-2)'}"><title>${d}: ${v} XP</title></rect>`).join('')}<line x1="0" y1="81" x2="280" y2="81" stroke="var(--line-2)"/><text x="0" y="90" font-size="7" fill="var(--muted)">4 weeks ago</text><text x="280" y="90" font-size="7" fill="var(--muted)" text-anchor="end">today</text></svg></div>
      <div class="card"><div class="eyebrow">Totals</div><div class="readouts" style="margin-top:10px"><div class="ro"><span>Quizzes</span><b>${S.stats.quizzes}</b></div><div class="ro"><span>Cards reviewed</span><b>${S.stats.cardsSeen}</b></div><div class="ro"><span>Exam marks</span><b>${S.stats.examMarks}</b></div><div class="ro"><span>Tools tried</span><b>${S.stats.tools.length}</b></div></div></div></div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Mastery by topic</h2><span class="muted">40% quiz · 20% flashcards · 20% checklist · 20% exam practice</span></div>
      ${UNITS.filter(u => unitTopics(u.id).length).map(u => `<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:6px;color:${u.css}">${esc(u.name)}</div><div class="heat">${unitTopics(u.id).map(t => { const m = mastery(t); return `<a href="#/t/${t.id}" title="${esc(t.title)} · ${pct(m)}" style="background:color-mix(in srgb,${u.css} ${Math.round(8 + m * 80)}%,var(--surface))">${esc(t.id)}</a>`; }).join('')}</div></div>`).join('')}</div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Badges</h2><span class="muted">${S.badges.length} of ${BADGES.length}</span></div><div class="badge-grid">${BADGES.map(([id, n, d, , ic]) => `<div class="badge ${S.badges.includes(id) ? 'got' : ''}"><div class="ic">${ic}</div><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('')}</div></div>
      <div class="sec"><button class="btn sm" id="reset">${ICON.reset} Reset all progress</button><span id="reset-c"></span></div>`;
    $('#reset').onclick = () => { $('#reset-c').innerHTML = ` <span class="small">This deletes all XP, marks and cards. </span><button class="btn sm" id="reset-y" style="border-color:var(--bad);color:var(--bad)">Yes, reset</button>`; $('#reset-y').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.hash = '#/home'; location.reload(); }; };
  }
  function about() {
    crumbs('<b>About &amp; help</b>');
    V().innerHTML = `<div class="notes"><h1 class="display" style="font-size:clamp(32px,5vw,50px);margin-bottom:14px">About Ratio</h1>
      <p class="lede">Ratio covers the Eduqas GCE A level in Law (A150QS, first awarded 2019): Component 1 (the nature of law and the English legal system) and all four areas of substantive law for Components 2 and 3.</p>
      <h3 style="margin-top:24px">How to use it</h3><ul><li><b>Learn</b> — notes for each specification point, with evaluation (AO3) debates, worked answers and common mistakes. Tap any <button class="case" type="button" data-case="donoghue">case name</button> for its facts and principle.</li><li><b>Key cases</b> — the cases for the topic; hide the facts to test yourself.</li><li><b>Explore</b> — interactive decision trees and tools that walk through the legal tests step by step.</li><li><b>Flashcards</b> — spaced repetition in five boxes: cards you know well come back less often.</li><li><b>Quiz</b> and <b>Exam practice</b> — multiple-choice checks and Eduqas-style questions you self-mark against indicative content.</li><li><b>Mock papers</b> — full timed papers for Components 1, 2 and 3.</li></ul>
      <h3 style="margin-top:24px">Keyboard shortcuts</h3><ul><li><kbd>/</kbd> search · <kbd>A</kbd>–<kbd>D</kbd> answer a quiz question · <kbd>Space</kbd> flip a card · <kbd>1</kbd>–<kbd>4</kbd> rate a card</li></ul>
      <h3 style="margin-top:24px">Accuracy</h3><p>The law is stated as understood in September 2026, including post-Brexit changes and recent reforms. Where reforms had been proposed but not in force, the notes say so. Exam formats follow the published specification; check your teacher’s guidance and Eduqas’s sample assessment materials for exact question wording. Ratio is an independent study aid and is not produced or endorsed by Eduqas or WJEC.</p>
      <p>Your progress is stored only in this browser. Clearing site data will reset it.</p></div>`;
  }

  /* ---------- SEARCH ---------- */
  function buildIndex() {
    const ix = [];
    allTopics().forEach(t => { ix.push({ k: 'Topic', t: `${t.id} ${t.title}`, s: t.short, href: '#/t/' + t.id, txt: (t.title + ' ' + t.short + ' ' + t.summary).toLowerCase() }); t.learn.forEach((sec, i) => ix.push({ k: 'Notes', t: sec.h, s: `${t.id} ${t.title}`, href: '#/t/' + t.id, txt: (sec.h + ' ' + plain(sec.html)).toLowerCase() })); });
    Object.values(CASES).filter(c => unitInScope(c.a)).forEach(c => ix.push({ k: 'Case', t: c.n + ' (' + c.y + ')', s: c.p, href: c.t && TOPIC[c.t] ? '#/t/' + c.t + '/cases' : '#/cases', txt: (c.n + ' ' + c.f + ' ' + c.p).toLowerCase() }));
    STATUTES.forEach(st => ix.push({ k: 'Statute', t: st.n, s: st.s.map(x => x[0]).join(', '), href: '#/statutes/acts', txt: (st.n + ' ' + st.s.flat().join(' ')).toLowerCase() }));
    GLOSSARY.forEach(g => ix.push({ k: 'Term', t: g[0], s: g[1], href: '#/statutes/terms', txt: (g[0] + ' ' + g[1]).toLowerCase() }));
    Object.entries(GAMES).forEach(([id, g]) => ix.push({ k: 'Game', t: g.title, s: g.blurb, href: '#/game/' + id, txt: (g.title + ' ' + g.blurb).toLowerCase() }));
    return ix;
  }
  function openPalette() {
    if ($('.palette-back')) return; index ??= buildIndex();
    const back = h('div', { class: 'palette-back', role: 'dialog', 'aria-label': 'Search' }, `<div class="palette"><input id="pq" placeholder="Search topics, cases, statutes, terms…" autocomplete="off" aria-label="Search"><ul id="pl"></ul></div>`);
    document.body.append(back);
    const inp = $('#pq'), ul = $('#pl'); let sel = 0, res = [];
    const draw = () => {
      const q = inp.value.toLowerCase().trim(); const words = q.split(/\s+/).filter(Boolean);
      res = q ? index.map(r => { let sc = 0; for (const w of words) { if (!r.txt.includes(w)) return null; sc += r.t.toLowerCase().includes(w) ? 3 : 1; } return { r, sc: sc + (r.k === 'Topic' ? 2 : r.k === 'Case' ? 1 : 0) }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 14).map(x => x.r) : index.filter(r => r.k === 'Topic').slice(0, 10);
      sel = Math.min(sel, Math.max(0, res.length - 1));
      ul.innerHTML = res.length ? res.map((r, i) => `<li><a href="${r.href}" class="${i === sel ? 'sel' : ''}"><span class="kind">${r.k}</span><span><span class="t">${esc(r.t)}</span><span class="s">${esc(plain(r.s))}</span></span></a></li>`).join('') : '<li class="empty" style="margin:8px">No matches. Try a case name, an Act or a topic.</li>';
    };
    const close = () => back.remove();
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter' && res[sel]) { location.hash = res[sel].href; close(); } else if (e.key === 'Escape') close(); };
    back.onclick = e => { if (e.target === back || e.target.closest('a')) close(); };
    draw(); inp.focus();
  }
  addEventListener('keydown', e => { if (e.key === '/' && !e.target.matches('input,textarea,select')) { e.preventDefault(); openPalette(); } if (e.key === 'Escape') closePop(); });

  /* ---------- boot ---------- */
  function boot() {
    if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
    chrome(); addEventListener('hashchange', route); route();
  }
  return { boot, refreshChrome, route };
})();
App.boot();

</script>
