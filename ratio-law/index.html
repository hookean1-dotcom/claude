  // statutory interpretation
  { id: 'whiteley', n: 'Whiteley v Chappell', y: 1868, a: '1A', t: '1.1.3', c: 'QB', f: 'It was an offence to impersonate “any person entitled to vote”. The defendant voted in the name of a dead man.', p: 'Literal rule: a dead person is not “entitled to vote”, so no offence. Shows the literal rule can defeat Parliament’s obvious purpose.' },
  { id: 'berriman', n: 'London & North Eastern Railway v Berriman', y: 1946, a: '1A', t: '1.1.3', c: 'HL', f: 'A railway worker was killed while oiling points. Compensation was only payable if a lookout was provided for workers “relaying or repairing” track.', p: 'Literal rule: oiling was “maintaining”, not relaying or repairing, so the widow received nothing. A harsh result.' },
  { id: 'fisherbell', n: 'Fisher v Bell', y: 1960, a: '1A', t: '1.1.3', c: 'Divisional Court', f: 'A shopkeeper displayed a flick knife in his window. The Restriction of Offensive Weapons Act 1959 made it an offence to “offer for sale” such knives.', p: 'Literal rule, using the technical contract meaning: a display is an invitation to treat, not an offer, so no offence. Parliament amended the Act in 1961.' },
  { id: 'adler', n: 'Adler v George', y: 1964, a: '1A', t: '1.1.3', c: 'Divisional Court', f: 'The Official Secrets Act 1920 made it an offence to obstruct a member of the armed forces “in the vicinity of” a prohibited place. The defendant was inside the base.', p: 'Golden rule (narrow approach): “in the vicinity of” was read to include “in” to avoid an absurd result.' },
  { id: 'rallen', n: 'R v Allen', y: 1872, a: '1A', t: '1.1.3', c: 'Court for Crown Cases Reserved', f: 'Bigamy (s57 OAPA 1861): “whosoever being married shall marry any other person”. A married person cannot legally “marry” again.', p: 'Golden rule (narrow approach): “marry” was read as “go through a ceremony of marriage”, avoiding an absurdity.' },
  { id: 'sigsworth', n: 'Re Sigsworth', y: 1935, a: '1A', t: '1.1.3', c: 'HC', f: 'A son murdered his mother, who died without a will. Under the Administration of Estates Act 1925 he was her next of kin and would inherit.', p: 'Golden rule (wide approach): although the words were clear, applying them would be repugnant; a murderer cannot benefit from his crime.' },
  { id: 'heydon', n: 'Heydon’s Case', y: 1584, a: '1A', t: '1.1.3', c: 'Court of Exchequer', f: 'A dispute over land leases. The court set out how statutes should be interpreted.', p: 'Mischief rule: ask (1) what was the common law before the Act? (2) what was the mischief or defect? (3) what remedy did Parliament provide? (4) what was the true reason for the remedy?' },
  { id: 'smithhughes', n: 'Smith v Hughes', y: 1960, a: '1A', t: '1.1.3', c: 'Divisional Court', f: 'Prostitutes tapped on windows and called from balconies to men in the street. The Street Offences Act 1959 made it an offence to solicit “in a street”.', p: 'Mischief rule: the Act aimed to stop people being molested by prostitutes in the street, so soliciting from a building counted.' },
  { id: 'rcn', n: 'Royal College of Nursing v DHSS', y: 1981, a: '1A', t: '1.1.3', c: 'HL', f: 'The Abortion Act 1967 required abortions to be carried out by a “registered medical practitioner”. Medically induced abortions were carried out mostly by nurses.', p: 'Mischief rule (3–2 majority): the mischief was unsafe back-street abortions; the Act was satisfied because a doctor was in charge. Dissent: this was “redrafting with a vengeance”.' },
  { id: 'corkery', n: 'Corkery v Carpenter', y: 1951, a: '1A', t: '1.1.3', c: 'Divisional Court', f: 'A man was drunk in charge of a bicycle. The Licensing Act 1872 made it an offence to be drunk in charge of a “carriage”.', p: 'Mischief rule: the Act aimed to prevent drunken people on the highway in charge of any form of transport, so a bicycle was a carriage.' },
  { id: 'magor', n: 'Magor and St Mellons RDC v Newport Corporation', y: 1950, a: '1A', t: '1.1.3', c: 'CA / HL', f: 'A dispute about compensation after local authority boundaries were reorganised.', p: 'Lord Denning in the CA said judges should “fill in the gaps” to find Parliament’s intention. Lord Simonds in the HL called this “a naked usurpation of the legislative function”.' },
  { id: 'quintavalle', n: 'R (Quintavalle) v Secretary of State for Health', y: 2003, a: '1A', t: '1.1.3', c: 'HL', f: 'The Human Fertilisation and Embryology Act 1990 regulated embryos created by fertilisation. Cloning (cell nuclear replacement) did not exist in 1990.', p: 'Purposive approach: Parliament’s purpose was to regulate all human embryos created outside the body, so cloned embryos were covered. Statutes are “always speaking”.' },
  { id: 'jonestowerboot', n: 'Jones v Tower Boot Co', y: 1997, a: '1A', t: '1.1.3', c: 'CA', f: 'A 16-year-old worker suffered serious racial abuse and assaults from colleagues. The employer was liable only for acts “in the course of employment”.', p: 'Purposive approach: to give effect to the Race Relations Act 1976, “in the course of employment” was read widely, not in its narrow tort meaning.' },
  { id: 'pepper', n: 'Pepper v Hart', y: 1993, a: '1A', t: '1.1.3', c: 'HL', f: 'Teachers at a private school paid reduced fees for their children. The tax due depended on the meaning of “cost of a benefit” in the Finance Act 1976.', p: 'Hansard may be consulted where legislation is ambiguous or obscure or leads to an absurdity, the statement is by a minister or promoter of the Bill, and it is clear. Overruled Davis v Johnson using the Practice Statement.' },
  { id: 'powellkempton', n: 'Powell v Kempton Park Racecourse', y: 1899, a: '1A', t: '1.1.3', c: 'HL', f: 'The Betting Act 1853 banned betting in a “house, office, room or other place”. Betting took place in an outdoor enclosure (Tattersall’s ring).', p: 'Ejusdem generis: general words following specific words are limited to the same kind. The list was of indoor places, so an outdoor area was not covered.' },
  { id: 'inlandfrere', n: 'Inland Revenue Commissioners v Frere', y: 1965, a: '1A', t: '1.1.3', c: 'HL', f: 'A tax provision referred to “interest, annuities or other annual payments”.', p: 'Noscitur a sociis: a word is known by the company it keeps. “Interest” meant only annual interest, given the words around it.' },
  { id: 'tempest', n: 'Tempest v Kilner', y: 1846, a: '1A', t: '1.1.3', c: 'Court of Common Pleas', f: 'The Statute of Frauds 1677 required contracts for the sale of “goods, wares and merchandise” over £10 to be in writing. The contract was for stocks and shares.', p: 'Expressio unius est exclusio alterius: express mention of one thing excludes others. Stocks and shares were not listed, so writing was not required.' },
  { id: 'ghaidan', n: 'Ghaidan v Godin-Mendoza', y: 2004, a: 'HR', t: '1.1.3', c: 'HL', f: 'The Rent Act 1977 allowed a person living with a tenant “as his or her wife or husband” to inherit the tenancy. The survivor of a same-sex couple was refused.', p: 'Section 3 HRA 1998: the words were read as “as if they were his wife or husband” to avoid discrimination (Arts 8 and 14). Section 3 can require a strained meaning, as long as it goes “with the grain” of the legislation.' },
  { id: 'rva2', n: 'R v A (No 2)', y: 2001, a: 'HR', t: '1.1.3', c: 'HL', f: 'The Youth Justice and Criminal Evidence Act 1999 s41 restricted evidence of a rape complainant’s sexual history, including with the defendant.', p: 'Using s3 HRA, the House read an implied provision into s41 so that evidence needed for a fair trial (Art 6) could be admitted. A controversial, strong use of s3.' },
  { id: 'bellinger', n: 'Bellinger v Bellinger', y: 2003, a: 'HR', t: '1.1.3', c: 'HL', f: 'A trans woman sought recognition of her marriage to a man. The Matrimonial Causes Act 1973 required the parties to be “male and female”.', p: 'Section 3 could not stretch the words that far; the House made a declaration of incompatibility under s4. Parliament passed the Gender Recognition Act 2004.' },
  { id: 'pickstone', n: 'Pickstone v Freemans', y: 1988, a: '1A', t: '1.1.3', c: 'HL', f: 'Female warehouse operatives claimed equal pay with male checkers. The UK’s Equal Pay regulations, read literally, did not allow the claim.', p: 'While the UK was in the EU, courts read UK law purposively to comply with EU law (Art 157 TFEU equal pay), adding words where necessary.' },
  // precedent
  { id: 'ps1966', n: 'Practice Statement (Judicial Precedent)', y: 1966, a: '1A', t: '1.1.4', c: 'HL', f: 'Lord Gardiner LC announced that the House of Lords would no longer always be bound by its own previous decisions.', p: 'The House (now the Supreme Court) may depart from a previous decision “when it appears right to do so”, bearing in mind the danger of disturbing contracts, property rights and the need for certainty in criminal law.' },
  { id: 'londonstreet', n: 'London Street Tramways v London County Council', y: 1898, a: '1A', t: '1.1.4', c: 'HL', f: 'The House of Lords considered whether it was bound by its own decisions.', p: 'The House of Lords held it was bound by its own previous decisions, for certainty. This rule lasted until the 1966 Practice Statement.' },
  { id: 'conway', n: 'Conway v Rimmer', y: 1968, a: '1A', t: '1.1.4', c: 'HL', f: 'A probationary police constable sued for malicious prosecution and wanted police documents disclosed.', p: 'The first use of the Practice Statement (on a technical point of evidence): the House overruled Duncan v Cammell Laird on public interest immunity.' },
  { id: 'herrington', n: 'British Railways Board v Herrington', y: 1972, a: 'TO', t: '1.1.4', c: 'HL', f: 'A six-year-old boy was badly burnt on an electrified railway line after getting through a broken fence the Board knew about.', p: 'Using the Practice Statement, the HL overruled Addie v Dumbreck (1929): occupiers owe trespassers a “duty of common humanity”. Later replaced by the Occupiers’ Liability Act 1984.' },
  { id: 'shivpuri', n: 'R v Shivpuri', y: 1986, a: 'CR', t: '2.3.7', c: 'HL', f: 'The defendant believed he was dealing in heroin; the substance was harmless vegetable matter (snuff or similar).', p: 'Guilty of attempting to deal in a controlled drug: s1(2) Criminal Attempts Act 1981 makes attempting the impossible an offence. The HL used the Practice Statement to overrule Anderton v Ryan (1985) just one year after deciding it.' },
  { id: 'rvg', n: 'R v G and another', y: 2003, a: 'CR', t: '2.3.2', c: 'HL', f: 'Two boys aged 11 and 12 set fire to newspapers behind a shop; the fire spread and caused about £1 million of damage. They did not foresee the risk.', p: 'Recklessness is subjective: the defendant must be aware of a risk and unreasonably take it. The HL overruled the objective test in MPC v Caldwell (1982).' },
  { id: 'jogee', n: 'R v Jogee', y: 2016, a: 'CR', t: '1.1.4', c: 'UKSC', f: 'Jogee encouraged his friend, who stabbed and killed a man. He was convicted of murder on the basis that he foresaw his friend might kill.', p: 'The Supreme Court held the law had taken a “wrong turn” in Chan Wing-Siu (1985): foresight is evidence of intention to assist or encourage, not enough on its own. Shows the court correcting an error in the common law.' },
  { id: 'youngbristol', n: 'Young v Bristol Aeroplane Co', y: 1944, a: '1A', t: '1.1.4', c: 'CA', f: 'An injured worker sued his employer. The question was whether the Court of Appeal was bound by its own earlier decisions.', p: 'The Court of Appeal is bound by its own decisions except where: (1) there are two conflicting previous decisions; (2) its previous decision conflicts with a later House of Lords (Supreme Court) decision; (3) the previous decision was made per incuriam.' },
  { id: 'davisjohnson', n: 'Davis v Johnson', y: 1979, a: '1A', t: '1.1.4', c: 'CA / HL', f: 'A woman sought an injunction to exclude her violent partner from their jointly rented flat. Earlier CA decisions said she could not.', p: 'Lord Denning in the CA refused to follow the CA’s own earlier decisions. The HL agreed with the result but firmly restated that the CA is bound by its own decisions (subject to Young).' },
  { id: 'rtaylor', n: 'R v Taylor', y: 1950, a: '1A', t: '1.1.4', c: 'Court of Criminal Appeal', f: 'A defendant appealed against a bigamy conviction.', p: 'The Criminal Division may depart from its own previous decision if the law was misapplied or misunderstood and a person’s liberty is at stake.' },
  { id: 'gould', n: 'R v Gould', y: 1968, a: '1A', t: '1.1.4', c: 'CA (Criminal Division)', f: 'Another bigamy appeal, about honest belief that a first spouse was dead or the marriage dissolved.', p: 'Confirmed that the Criminal Division has greater flexibility than the Civil Division to depart from its own decisions where liberty is at stake.' },
  { id: 'holley', n: 'Attorney General for Jersey v Holley', y: 2005, a: '1A', t: '1.1.4', c: 'Privy Council (nine members)', f: 'Holley, an alcoholic, killed his partner with an axe after she taunted him. The issue was which characteristics count for the reasonable man in provocation.', p: 'A nine-member Privy Council declined to follow the House of Lords in R v Smith (Morgan) (2000). In R v James and Karimi (2006) the Court of Appeal followed Holley instead of the House of Lords.' },
  { id: 'jameskarimi', n: 'R v James and Karimi', y: 2006, a: '1A', t: '1.1.4', c: 'CA', f: 'Two appeals on the provocation defence raised the conflict between Smith (Morgan) (HL) and Holley (PC).', p: 'The CA followed the Privy Council in Holley instead of the House of Lords, because Holley had in effect overruled Smith. A rare exception to the hierarchy.' },
  { id: 'willers', n: 'Willers v Joyce', y: 2016, a: '1A', t: '1.1.4', c: 'UKSC', f: 'A claim for malicious prosecution of civil proceedings raised whether the Privy Council’s decision in Crawford Adjusters v Sagicor (2013) represented English law.', p: 'Privy Council decisions are persuasive only, but the Board may expressly direct that its decision represents English law; lower courts then follow it rather than an earlier inconsistent decision.' },
  { id: 'horncastle', n: 'R v Horncastle', y: 2009, a: 'HR', t: '1.1.4', c: 'UKSC', f: 'Defendants were convicted partly on hearsay evidence of absent witnesses; the ECtHR in Al-Khawaja had said a conviction based “solely or decisively” on such evidence breached Art 6.', p: 'The Supreme Court declined to follow the Strasbourg chamber, explaining its concerns about English procedure. The Grand Chamber later softened its approach. Shows s2 HRA means “take into account”, not “follow”.' },
  { id: 'balfour', n: 'Balfour v Balfour', y: 1919, a: 'CT', t: '2.1.2', c: 'CA', f: 'A husband working in Ceylon promised to pay his wife £30 a month while she stayed in England for her health. After they separated, he stopped paying.', p: 'Agreements between spouses living together are presumed not to be intended to create legal relations. Distinguished in Merritt v Merritt.' },
  { id: 'merritt', n: 'Merritt v Merritt', y: 1970, a: 'CT', t: '2.1.2', c: 'CA', f: 'After the husband left, he signed a written agreement to transfer the house to his wife if she paid off the mortgage. She did; he refused.', p: 'Where spouses have separated (or are about to), the presumption against legal intention is rebutted, especially when the agreement is in writing.' },
  { id: 'hedleybyrne', n: 'Hedley Byrne v Heller & Partners', y: 1964, a: 'TO', t: '2.1.4', c: 'HL', f: 'A bank gave a careless, favourable credit reference about a client, but with a disclaimer (“without responsibility”). The advertising agency relying on it lost money.', p: 'Obiter, a duty of care can exist for negligent misstatements causing pure economic loss where there is a special relationship and reasonable reliance. The disclaimer protected the bank here, so the statement was obiter — later adopted as law.' },
  { id: 'howe', n: 'R v Howe', y: 1987, a: 'CR', t: '2.3.6', c: 'HL', f: 'The defendants took part in torturing and killing victims under threats from a violent man.', p: 'Duress is not a defence to murder, whether as principal or secondary party. Obiter: duress should not be a defence to attempted murder either — followed in R v Gotts (1992).' }
]);

/* ---------- 1.1.1a Parliament and the legislative process ---------- */
TOPICS.push({
  id: '1.1.1a', unit: '1A', ref: '1.1.1', title: 'Parliament and making an Act',
  short: 'Green and White Papers, the legislative process, composition of Parliament, influences',
  summary: 'Parliament is the supreme law-maker in England and Wales. Learn how it is made up, how a Bill becomes an Act, and which pressures — from manifestos and media campaigns to pressure groups and the Law Commission — shape new laws. Be ready to evaluate both the process and the influences.',
  spec: [
    'Composition and role of Parliament: the Monarch, the House of Commons and the House of Lords',
    'Green Papers and White Papers; consultation',
    'Types of Bill: Public, Private Members’, Private and Hybrid',
    'The legislative process: readings, committee, report, the other House, Royal Assent',
    'The Parliament Acts 1911 and 1949',
    'Influences on Parliament: political, media, public opinion, pressure groups, lobbyists, the Law Commission',
    'Advantages and disadvantages of influences on law making and of parliamentary law making'
  ],
  learn: [
    { h: 'What Parliament is', html: `
<p>Parliament is the <b>legislature</b>: the body that makes Acts of Parliament (statutes, or primary legislation). It has three parts, and all three must agree before a Bill becomes law.</p>
<div class="tbl"><table><tr><th>Part</th><th>Make-up</th><th>Role in law making</th></tr>
<tr><td><b>House of Commons</b></td><td>650 elected MPs (first past the post); a general election must be held at least every five years (Dissolution and Calling of Parliament Act 2022)</td><td>The dominant chamber. The government, which has a majority here, introduces most Bills. Can override the Lords using the Parliament Acts.</td></tr>
<tr><td><b>House of Lords</b></td><td>Unelected. Mostly life peers (Life Peerages Act 1958), plus up to 92 hereditary peers (House of Lords Act 1999) and 26 Church of England bishops. A 2024 Bill proposes to remove the remaining hereditary peers.</td><td>A revising chamber: scrutinises Bills in detail, proposes amendments, can delay but not normally block. Includes many experts (judges, doctors, scientists).</td></tr>
<tr><td><b>The Monarch</b></td><td>The King</td><td>Gives Royal Assent — now a formality. The last refusal was by Queen Anne in 1708 (the Scottish Militia Bill).</td></tr></table></div>
<p>Parliament also scrutinises the government (Prime Minister’s Questions, select committees), debates issues of public concern and approves taxation and spending.</p>` },
    { h: 'Green and White Papers', html: `
<p>Most major government Bills begin with <b>consultation</b>:</p>
<ul><li>A <b>Green Paper</b> is a consultative document setting out tentative proposals and inviting comments from interested parties, experts and the public.</li>
<li>A <b>White Paper</b> sets out the government’s firm proposals, taking the consultation responses into account. It is often published with a draft Bill.</li></ul>
<p>Example: the Green Paper <i>Transforming Public Procurement</i> (2020) led to the Procurement Act 2023; the <i>Online Harms</i> White Paper (2019) led to the Online Safety Act 2023.</p>
<div class="box tip"><b class="lbl">Evaluation point</b><p>Consultation makes law better informed and more democratic, but it takes time, and the government is not bound by what consultees say.</p></div>` },
    { h: 'Types of Bill', html: `
<div class="tbl"><table><tr><th>Type</th><th>Introduced by</th><th>Example</th></tr>
<tr><td><b>Public Bill</b></td><td>The government; affects the whole country. Drafted by lawyers in the Office of the Parliamentary Counsel.</td><td>Online Safety Act 2023; Terrorism (Protection of Premises) Act 2025 (“Martyn’s Law”)</td></tr>
<tr><td><b>Private Members’ Bill</b></td><td>An individual MP or peer who is not a minister — through the annual ballot (20 MPs), the Ten Minute Rule, or presentation</td><td>Abortion Act 1967 (David Steel MP); Animal Welfare (Service Animals) Act 2019 (“Finn’s Law”); the Terminally Ill Adults (End of Life) Bill (Kim Leadbeater MP), which passed the Commons in June 2025</td></tr>
<tr><td><b>Private Bill</b></td><td>Promoted by an organisation such as a local council or company; affects only it</td><td>Transport for London Act 2008</td></tr>
<tr><td><b>Hybrid Bill</b></td><td>The government, but it affects particular people or places differently</td><td>High Speed Rail (London–West Midlands) Act 2017 (HS2)</td></tr></table></div>
<p>Private Members’ Bills rarely succeed because there is little parliamentary time for them — but they are often used for issues of conscience that governments avoid.</p>` },
    { h: 'The legislative process', html: `
<p>A Bill must pass through both Houses (it can start in either, but money Bills start in the Commons).</p>
<ol><li><b>First reading</b> — the title is read out; a formality. The Bill is printed.</li>
<li><b>Second reading</b> — the main debate on the principles of the Bill, followed by a vote.</li>
<li><b>Committee stage</b> — detailed, clause-by-clause scrutiny by a <b>Public Bill Committee</b> of about 16–50 MPs reflecting party strength (or a Committee of the Whole House for Budget or constitutional Bills). Amendments are proposed.</li>
<li><b>Report stage</b> — the amended Bill is reported back to the whole House, which votes on amendments.</li>
<li><b>Third reading</b> — a final debate and vote; only minor wording changes allowed.</li>
<li><b>The other House</b> — the Bill goes through the same stages. Amendments pass back and forth (“<b>ping-pong</b>”) until both Houses agree.</li>
<li><b>Royal Assent</b> — the Monarch assents (Royal Assent Act 1967). The Act comes into force on that date, a date stated in the Act, or a date set by a commencement order (a statutory instrument).</li></ol>
<p>Try the stepper in the <b>Explore</b> tab to follow a real Bill.</p>` },
    { h: 'The Parliament Acts 1911 and 1949', html: `
<p>The Lords cannot veto most Bills. Under the <b>Parliament Acts 1911 and 1949</b>, a Bill passed by the Commons in two successive sessions can receive Royal Assent without the Lords’ consent after a one-year delay. Money Bills can only be delayed for one month.</p>
<p>They have been used only seven times, including the War Crimes Act 1991, the Sexual Offences (Amendment) Act 2000 (equal age of consent) and the <b>Hunting Act 2004</b>. In [[c:jackson]] the House of Lords upheld the 1949 Act and the Hunting Act.</p>
<p>By the <b>Salisbury Convention</b>, the Lords do not oppose at second reading a Bill that delivers a manifesto commitment of the elected government.</p>` },
    { h: 'Influences on Parliament', html: `
<div class="tbl"><table><tr><th>Influence</th><th>How it works</th><th>Examples</th></tr>
<tr><td><b>Political parties and manifestos</b></td><td>The party that wins a general election has a mandate to implement its manifesto; most government Bills come from it.</td><td>Renters’ Rights Act 2025; the Brexit legislation after 2019</td></tr>
<tr><td><b>The media</b></td><td>Newspapers, broadcasters and social media raise awareness, run campaigns and shape public opinion.</td><td><i>News of the World</i> “Sarah’s Law” campaign → Child Sex Offender Disclosure Scheme (2011); tabloid pressure → the hurried Dangerous Dogs Act 1991</td></tr>
<tr><td><b>Pressure groups</b></td><td><b>Sectional</b> groups protect members’ interests (BMA, Law Society, trade unions); <b>cause</b> groups promote a belief (Liberty, Greenpeace). <b>Insider</b> groups are consulted by government; <b>outsider</b> groups use protest and direct action.</td><td>Snowdrop Campaign after Dunblane (1996) → Firearms (Amendment) (No 2) Act 1997; Figen Murray’s campaign after the Manchester Arena bombing → Martyn’s Law 2025; League Against Cruel Sports → Hunting Act 2004</td></tr>
<tr><td><b>Public opinion and petitions</b></td><td>E-petitions with 100,000 signatures are considered for debate; MPs respond to constituents.</td><td>Helen’s Law — Prisoners (Disclosure of Information About Victims) Act 2020</td></tr>
<tr><td><b>Lobbyists</b></td><td>Paid professionals who try to persuade MPs and ministers on behalf of businesses and interest groups.</td><td>Regulated by the Transparency of Lobbying … Act 2014, which created a register of consultant lobbyists</td></tr>
<tr><td><b>Law Commission and inquiries</b></td><td>Expert reports recommending reform (see topic 1.1.1c).</td><td>Macpherson Report (1999) → removal of the double jeopardy rule by the Criminal Justice Act 2003</td></tr>
<tr><td><b>The judiciary</b></td><td>Judges point out defects and invite Parliament to act; decisions prompt statutes.</td><td>[[c:fisherbell]] → Restriction of Offensive Weapons Act 1961; [[c:bellinger]] → Gender Recognition Act 2004</td></tr></table></div>` },
    { h: 'Evaluating influences and Parliament', html: `
<p><b>Advantages of influences:</b> they bring expertise and information (insider groups, the Law Commission); they keep law in line with public opinion between elections; the media can expose injustice; pressure groups give minorities a voice (pluralism).</p>
<p><b>Disadvantages:</b> the media can cause <b>knee-jerk</b>, badly drafted laws (the Dangerous Dogs Act 1991 is the classic example) and exaggerate issues to sell papers; powerful, wealthy groups and lobbyists gain unequal access (a threat to democracy); outsider groups may break the law (Just Stop Oil protests led to the Public Order Act 2023, which critics say restricts protest).</p>
<p><b>Advantages of Parliament as law-maker:</b> it is <b>democratic</b> (elected Commons); Bills get <b>thorough scrutiny</b> in both Houses; it can make wide-ranging reforms and whole codes of law; laws apply to the future, not retrospectively; consultation through Green and White Papers.</p>
<p><b>Disadvantages:</b> the process is <b>slow</b> and parliamentary time is limited; the government’s majority can push Bills through (Lord Hailsham’s “<b>elective dictatorship</b>”); the Lords is unelected; Acts can be long and complex, needing interpretation by judges; Private Members’ Bills rarely succeed.</p>` }
  ],
  debate: [{ q: 'Should pressure groups and the media have so much influence on Parliament?', for: ['They inform MPs and bring specialist knowledge (e.g. the BMA on health).', 'They let citizens take part in democracy between elections.', 'They can expose injustice: the Snowdrop Campaign led to a near-total ban on handguns.', 'Campaigns such as Martyn’s Law show how ordinary people can change the law.'], ag: ['Media campaigns can lead to rushed, poorly drafted laws — the Dangerous Dogs Act 1991.', 'Groups with money and contacts gain unfair access (lobbying scandals).', 'Pressure groups represent narrow interests, not the whole public.', 'Direct action can be unlawful and disruptive (Public Order Act 2023 responses).'] }],

    { q: '<b>Scenario.</b> After a series of attacks by e-scooter riders, a tabloid newspaper runs a campaign to ban e-scooters. An MP wins the Private Members’ Bill ballot and introduces a Bill. Explain the stages the Bill must pass through and advise on its chances of becoming law. (Component 1 scenario style)', s: ['<b class="st">Identify</b>The issue is how a Private Members’ Bill becomes law, and the influence of the media.', '<b class="st">Law</b>The Bill must pass first reading, second reading (debate on principle), committee stage (clause-by-clause scrutiny by a Public Bill Committee), report stage and third reading in the Commons, then the same stages in the Lords, then Royal Assent.', '<b class="st">Apply</b>As a ballot Bill it gets some priority on sitting Fridays, but it can easily run out of time or be “talked out”. It needs government support to succeed — the media campaign may help persuade the government.', '<b class="st">Apply</b>If the Lords objected, the Parliament Acts 1911 and 1949 could be used, but this is very rare and in practice used only for government Bills.', '<b class="st">Evaluate</b>The media campaign shows public concern, but risks a knee-jerk law like the Dangerous Dogs Act 1991; consultation would help produce a better-drafted law.'], a: 'The Bill must pass all stages in both Houses and receive Royal Assent; without government support it is unlikely to succeed.' }
  ],

/* ---------- 1.1.1b The UK constitution ---------- */
TOPICS.push({
  id: '1.1.1b', unit: '1A', ref: '1.1.1', title: 'The UK constitution',
  short: 'Parliamentary sovereignty, separation of powers, the rule of law, the royal prerogative',
  summary: 'The UK has an uncodified constitution built from statutes, case law, conventions and works of authority. Three doctrines hold it together: parliamentary sovereignty, the separation of powers and the rule of law. The royal prerogative adds residual powers exercised by ministers. You need to explain each doctrine, apply it to modern examples and evaluate how far it is respected.',
  spec: ['Sources and nature of the UK constitution', 'Concept and application of parliamentary sovereignty (Dicey) and its limits', 'The separation of powers and the Constitutional Reform Act 2005', 'The rule of law: Dicey and Bingham; threats and protections', 'The royal prerogative and its control by the courts'],
  learn: [
    { h: 'An uncodified constitution', html: `
<p>A constitution sets out how a state is governed and the relationship between the state and citizens. Most countries have a single written document; the UK does not. Its constitution is <b>uncodified</b> and <b>flexible</b> — it can be changed by an ordinary Act of Parliament.</p>
<p>Sources: <b>statutes</b> (Magna Carta 1215, Bill of Rights 1689, Parliament Acts, Human Rights Act 1998, Constitutional Reform Act 2005), <b>case law</b> ([[c:entick]], [[c:miller2017]]), <b>conventions</b> (unwritten rules: the Monarch gives Royal Assent; ministers are accountable to Parliament), and <b>works of authority</b> (Dicey’s <i>Introduction to the Study of the Law of the Constitution</i>, 1885).</p>` },
    { h: 'Parliamentary sovereignty', html: `
<div class="box def"><b class="lbl">Dicey’s three principles</b><ol><li>Parliament can make or unmake any law on any subject.</li><li>No Parliament can bind its successors.</li><li>No person or body (including the courts) can override or set aside an Act of Parliament.</li></ol></div>
<p><b>Cases supporting it:</b> [[c:cheney]] (an Act cannot be illegal), [[c:pickin]] (the enrolled Act rule), [[c:mortensen]] (Parliament may legislate contrary to international law), [[c:ellenstreet]] (implied repeal — the later Act wins).</p>
<h4>Limits and pressures</h4>
<ul><li><b>EU membership (1973–2020)</b>: EU law had supremacy; in [[c:factortame]] an Act was disapplied. Brexit restored full sovereignty — though Parliament chose to leave, showing sovereignty was never lost.</li>
<li><b>Human Rights Act 1998</b>: courts must read legislation compatibly with Convention rights “so far as it is possible” (s3), but can only make a <b>declaration of incompatibility</b> (s4) — the Act stays valid, preserving sovereignty.</li>
<li><b>Devolution</b>: Westminster keeps the power to legislate for Wales, Scotland and Northern Ireland, but the <b>Sewel convention</b> says it will not normally do so without consent. In [[c:miller2017]] this was held to be political, not legally enforceable.</li>
<li><b>Constitutional statutes</b>: some Acts (e.g. the HRA, devolution Acts) may only be repealed expressly, not impliedly (Thoburn v Sunderland CC, 2002).</li>
<li><b>Obiter doubts</b>: in [[c:jackson]] Lord Steyn and Baroness Hale suggested courts might not accept an Act abolishing judicial review.</li>
<li><b>Political reality</b>: Parliament could “legally” do anything, but would not pass laws the public would never accept.</li></ul>` },
    { h: 'The separation of powers', html: `
<p><b>Montesquieu</b> (<i>The Spirit of the Laws</i>, 1748) argued that liberty is best protected when the three functions of the state are held by separate bodies that check each other.</p>
<div class="tbl"><table><tr><th>Power</th><th>Function</th><th>In the UK</th></tr>
<tr><td>Legislature</td><td>Makes law</td><td>Parliament</td></tr>
<tr><td>Executive</td><td>Carries out law and runs the country</td><td>The government: Prime Minister, Cabinet, civil service, police</td></tr>
<tr><td>Judiciary</td><td>Interprets and applies law; resolves disputes</td><td>Judges in the courts</td></tr></table></div>
<p>The UK has only a <b>partial</b> separation. The executive and legislature are <b>fused</b>: ministers must be MPs or peers, and the government usually controls the Commons. But the <b>Constitutional Reform Act 2005</b> strengthened the independence of the judiciary:</p>
<ul><li>the <b>Supreme Court</b> replaced the Appellate Committee of the House of Lords (2009), so the top judges no longer sit in the legislature;</li>
<li>the <b>Lord Chancellor</b> is no longer head of the judiciary or a judge — the <b>Lord Chief Justice</b> heads the judiciary;</li>
<li>the <b>Judicial Appointments Commission</b> selects judges;</li>
<li>s3 imposes a duty on ministers to uphold the continued independence of the judiciary.</li></ul>
<p>The judiciary checks the executive by <b>judicial review</b>: [[c:miller2019]], [[c:fbu]], [[c:unison]].</p>` },
    { h: 'The rule of law', html: `
<p>The rule of law means that everyone, including the government, is subject to the law. Section 1 of the Constitutional Reform Act 2005 protects “the existing constitutional principle of the rule of law”.</p>
<div class="box def"><b class="lbl">Dicey (1885)</b><ol><li><b>No sanction without breach</b>: no one can be punished unless they have broken a law established in the ordinary courts.</li><li><b>Equality before the law</b>: one law governs everyone, including officials.</li><li><b>Rights are secured by the courts</b>: individual rights come from decisions of the ordinary courts (the common law), not a written constitution.</li></ol></div>
<p><b>Lord Bingham</b> (<i>The Rule of Law</i>, 2010) gave eight principles, including: law must be accessible, clear and predictable; questions of rights should be decided by law, not discretion; equality; ministers must act within their powers; protection of human rights; access to affordable dispute resolution; fair trials; and compliance with international law.</p>
<p><b>Upheld by:</b> [[c:entick]], [[c:mvhomeoffice]], [[c:belmarsh]], [[c:unison]], [[c:miller2019]].</p>
<p><b>Threats:</b> wide discretionary and delegated powers (Henry VIII clauses); legal aid cuts under LASPO 2012 restricting access to justice; retrospective laws (War Damage Act 1965 reversed a House of Lords decision); statutes disapplying parts of the HRA (Illegal Migration Act 2023 s1(5)); detention without trial.</p>` },
    { h: 'The royal prerogative', html: `
<p>The <b>royal prerogative</b> is the remaining (“residual”) power of the Crown, not granted by Parliament. Most of it is exercised by <b>ministers</b> in the King’s name.</p>
<ul><li>Making and ending <b>treaties</b>; conducting foreign affairs</li><li>Deploying the <b>armed forces</b></li><li>Issuing <b>passports</b></li><li>The prerogative of <b>mercy</b> (pardons — e.g. Alan Turing’s posthumous pardon, 2013)</li><li>Appointing ministers; granting honours; <b>proroguing</b> and (again, since the Dissolution and Calling of Parliament Act 2022) dissolving Parliament</li></ul>
<h4>Control of the prerogative</h4>
<p>Parliament can abolish or limit it by statute. The courts decide whether a prerogative exists and its limits, and can review how it is used: [[c:gchq]] (reviewable, but national security is non-justiciable), [[c:fbu]] (cannot frustrate a statute), [[c:miller2017]] (cannot change domestic law), [[c:miller2019]] (prorogation unlawful).</p>` }
  ],
  debate: [
    { q: 'Is Parliament still sovereign?', for: ['Brexit showed Parliament could remove EU supremacy by statute.', 'Section 4 HRA declarations do not invalidate Acts — Parliament decides whether to change the law.', 'Westminster can still legislate on devolved matters; Sewel is only a convention (Miller 2017).', 'Courts still apply the enrolled Act rule (Pickin).'], ag: ['Section 3 HRA lets courts read words into Acts (Ghaidan), shifting power to judges.', 'Devolution is politically irreversible in practice.', 'Obiter in Jackson suggests courts might refuse to apply some Acts.', 'International obligations (ECHR, trade treaties) constrain Parliament in practice.'] }
  ],
  cases: ['cheney', 'pickin', 'mortensen', 'ellenstreet', 'factortame', 'jackson', 'miller2017', 'miller2019', 'gchq', 'fbu', 'entick', 'mvhomeoffice', 'belmarsh'],
  worked: [{ q: 'Explain, using an example, what is meant by parliamentary sovereignty. [5]', s: ['<b class="st">Define</b>Parliamentary sovereignty means Parliament is the supreme law-maker in the UK (Dicey).', '<b class="st">Principles</b>Parliament can make or unmake any law; no Parliament can bind its successors; no body can set aside an Act.', '<b class="st">Authority</b>Cheney v Conn — an Act cannot be illegal; Pickin v BRB — courts cannot question how an Act was passed.', '<b class="st">Example</b>Ellen Street Estates — implied repeal; Brexit — Parliament passed the EU (Withdrawal) Act 2018 to repeal the European Communities Act 1972.', '<b class="st">Qualification</b>Limited in practice by the HRA (s4 declarations) and devolution, though legally Parliament remains supreme.'], a: 'Parliament is the supreme law-maker; illustrate with Dicey’s three principles and a case.' }],
  pitfalls: ['Saying the UK has no constitution — it has an uncodified one.', 'Claiming judges can strike down Acts under the HRA — they can only issue a declaration of incompatibility (s4).', 'Saying the UK has a complete separation of powers.', 'Forgetting that the royal prerogative is exercised by ministers, not personally by the King.', 'Describing the Sewel convention as legally binding.'],
  cards: [

/* ---------- 1.1.1c Law reform ---------- */
TOPICS.push({
  id: '1.1.1c', unit: '1A', ref: '1.1.1', title: 'Law reform',
  short: 'The Law Commission, pressure groups, judicial influence, inquiries',
  summary: 'Law must change as society changes. Reform comes from Parliament (often prompted by official agencies such as the Law Commission, Royal Commissions and public inquiries), from pressure groups and from judges developing the common law. You must explain how each works, give examples and evaluate how effective each is.',
  spec: ['The need for law reform', 'The Law Commission: composition, role, methods (codification, consolidation, repeal), success rate', 'Other official agencies: Royal Commissions and public inquiries', 'The role of pressure groups in law reform', 'Judicial influences on law reform', 'Advantages and disadvantages of each method'],
  learn: [
    { h: 'Why law needs reform', html: `<p>Law reform can mean creating new law, repealing old law, or changing existing law. Reasons include changing social values (same-sex marriage — Marriage (Same Sex Couples) Act 2013), new technology (Online Safety Act 2023), problems revealed by cases ([[c:fisherbell]]), and the need to make the law accessible (consolidation and codification).</p>` },
    { h: 'The Law Commission', html: `
<p>Set up by the <b>Law Commissions Act 1965</b>, the Law Commission is a <b>full-time, independent</b> body that keeps the law under review and recommends reform. It has <b>five Commissioners</b>, led by a chair who is a High Court or Court of Appeal judge, supported by lawyers and researchers. Scotland has its own Commission.</p>
<h4>How it works</h4><ol><li>A topic is referred by the Lord Chancellor or a department, or chosen in its programme of law reform.</li><li>Research the current law and problems.</li><li>Publish a <b>consultation paper</b> and invite responses.</li><li>Publish a <b>report</b> with recommendations, usually with a <b>draft Bill</b>.</li></ol>
<h4>Its work</h4><ul><li><b>Reform</b> of particular areas — e.g. the Unfair Contract Terms Act 1977, Family Law Act 1996, Consumer Rights Act 2015 (parts), Sentencing Act 2020 (the Sentencing Code).</li>
<li><b>Codification</b> — bringing all the law on a topic into one code. A Draft Criminal Code was published in 1989 but never enacted; the project was abandoned in 2008.</li>
<li><b>Consolidation</b> — combining several Acts on the same topic into one (e.g. Powers of Criminal Courts (Sentencing) Act 2000).</li>
<li><b>Repeal</b> of obsolete law through Statute Law (Repeals) Acts — thousands of old Acts have been removed.</li></ul>
<p>The <b>Law Commission Act 2009</b> requires the Lord Chancellor to report annually to Parliament on how the government has responded, and a 2010 protocol requires departments to respond to reports. Overall about two-thirds of its reports have been implemented, but important ones have been ignored — e.g. <i>Reform of Offences Against the Person</i> (2015) and much of <i>Murder, Manslaughter and Infanticide</i> (2006) (only partial reform in the Coroners and Justice Act 2009).</p>` },
    { h: 'Royal Commissions and public inquiries', html: `
<p><b>Royal Commissions</b> are temporary committees set up to investigate one area and report — e.g. the Runciman Commission on Criminal Justice (1993), which led to the <b>Criminal Cases Review Commission</b> (Criminal Appeal Act 1995). None has been set up since 2000.</p>
<p><b>Public inquiries</b> investigate events of public concern: the <b>Macpherson Report</b> (1999) into the murder of Stephen Lawrence led to the abolition of the double jeopardy rule (Criminal Justice Act 2003 Part 10) — used to convict Gary Dobson and David Norris in 2012. The <b>Post Office Horizon IT Inquiry</b> prompted the Post Office (Horizon System) Offences Act 2024, which quashed hundreds of wrongful convictions.</p>` },
    { h: 'Pressure groups and judges', html: `
<p><b>Pressure groups</b> (see topic 1.1.1a) influence reform by lobbying, campaigning, responding to consultations and bringing test cases (e.g. Liberty and JUSTICE supporting judicial review claims).</p>
<p><b>Judges</b> reform the law in three ways: developing the common law ([[c:rvr|R v R]] (1991) — a husband can be guilty of raping his wife); using the Practice Statement to correct past mistakes ([[c:rvg]], [[c:jogee]]); and calling on Parliament to act (the courts in [[c:bellinger]] and in Nicklinson on assisted dying). But judges cannot consult, are limited to the facts before them, are not elected and change the law retrospectively.</p>` }
  ],

TOPICS.push({

  short: 'EU institutions, sources, direct effect, supremacy and the impact of Brexit',
  summary: 'From 1973 to 2020 the UK was a member of the European Union and EU law was a major source of law in England and Wales, with supremacy over Acts of Parliament. The specification still requires you to know the EU institutions, the sources of EU law and its impact on English law — and you should explain what has happened since Brexit, when retained EU law became “assimilated law”.',
  spec: ['Institutions of the EU: Commission, Council, Parliament, Court of Justice', 'Sources of EU law: treaties, regulations, directives, decisions', 'Direct applicability, direct effect (vertical and horizontal) and state liability', 'Supremacy of EU law and its impact on parliamentary sovereignty', 'The impact of EU law on the law of England and Wales, including after withdrawal'],
  learn: [
    { h: 'The institutions', html: `
<div class="tbl"><table><tr><th>Institution</th><th>Make-up</th><th>Role</th></tr>
<tr><td><b>European Commission</b></td><td>One Commissioner per member state (27), independent of national governments</td><td>Proposes new laws; “guardian of the treaties” — can take member states to the Court of Justice for breach (Art 258 TFEU); runs day-to-day policy</td></tr>
<tr><td><b>Council of the European Union</b></td><td>Government ministers from each member state, depending on the subject</td><td>Main decision-maker; adopts laws jointly with the Parliament; voting by qualified majority or unanimity</td></tr>
<tr><td><b>European Parliament</b></td><td>MEPs directly elected every five years (the UK had 73)</td><td>Shares law-making power with the Council under the ordinary legislative procedure; approves the budget; supervises the Commission</td></tr>
<tr><td><b>Court of Justice of the EU (CJEU)</b></td><td>One judge per member state, assisted by Advocates General</td><td>Ensures EU law is interpreted and applied uniformly; hears preliminary references from national courts (<b>Art 267 TFEU</b>) and enforcement actions against states</td></tr></table></div>
<p>The <b>European Council</b> (heads of state or government) sets the EU’s overall direction. Do not confuse any of these with the Council of Europe and the European Court of Human Rights, which are separate from the EU.</p>` },
    { h: 'Sources of EU law', html: `
<ul><li><b>Treaties</b> (primary law): the Treaty on European Union and the Treaty on the Functioning of the EU (TFEU). Treaty articles can be <b>directly effective</b> — [[c:vangend]]; in <i>Macarthys v Smith</i> (1980) a woman relied on Art 157 (equal pay) directly.</li>
<li><b>Regulations</b> (Art 288): <b>directly applicable</b> — automatically part of national law without implementation; e.g. the General Data Protection Regulation (GDPR). <i>Re Tachographs: Commission v UK</i> (1979) — the UK was in breach for not applying a regulation.</li>
<li><b>Directives</b>: binding as to the result to be achieved, but each state chooses how to implement them, usually by a set deadline. The UK normally used statutory instruments under s2(2) European Communities Act 1972 (e.g. Working Time Regulations 1998).</li>
<li><b>Decisions</b>: binding on those to whom they are addressed (a state, company or individual).</li></ul>` },
    { h: 'Direct effect, indirect effect and state liability', html: `
<p><b>Direct effect</b> lets individuals rely on EU law in their national courts.</p>
<ul><li><b>Vertical</b> direct effect — against the state or an “emanation of the state”: [[c:marshall]]; <i>Foster v British Gas</i> (1990) defined an emanation of the state.</li>
<li><b>Horizontal</b> direct effect — against private individuals or companies. Available for treaty articles and regulations, but <b>not for directives</b> (<i>Duke v GEC Reliance</i>, 1988).</li>
<li><b>Indirect effect</b> — national courts must interpret national law in line with directives as far as possible: [[c:marleasing]].</li>
<li><b>State liability</b> — an individual can claim damages from the state for failing to implement a directive: [[c:francovich]].</li></ul>` },
    { h: 'Supremacy and sovereignty', html: `
<p>In [[c:costa]] the Court of Justice declared EU law supreme over national law. The UK accepted this through the <b>European Communities Act 1972</b> (s2(1) and s2(4)), and in [[c:factortame]] the House of Lords disapplied the Merchant Shipping Act 1988. EU law also shaped statutory interpretation: courts adopted a purposive approach ([[c:pickstone]]).</p>
<p>Membership was a major limit on parliamentary sovereignty — but it rested on an Act of Parliament that Parliament could repeal.</p>` },
    { h: 'After Brexit', html: `
<ul><li>The UK left the EU on <b>31 January 2020</b>; the transition period ended on <b>31 December 2020</b>.</li>
<li>The <b>European Union (Withdrawal) Act 2018</b> repealed the European Communities Act 1972 and kept most EU-derived law in place as <b>“retained EU law”</b> so there was no legal gap.</li>
<li>UK courts are not bound by CJEU decisions made after 2020 and may “have regard” to them (s6). The Supreme Court and Court of Appeal can depart from retained EU case law.</li>
<li>The <b>Retained EU Law (Revocation and Reform) Act 2023</b> revoked some retained law and, from 1 January 2024, renamed the rest <b>“assimilated law”</b>. The principle of supremacy of EU law no longer applies to it, and ministers have powers to amend or replace it by delegated legislation.</li>
<li>Under the <b>Windsor Framework</b>, some EU single-market rules still apply in Northern Ireland.</li></ul>
<div class="box tip"><b class="lbl">Exam tip</b><p>Show you know both the historical EU law the specification lists <i>and</i> its current status. Examiners reward accurate, up-to-date context.</p></div>` }
  ],

/* ---------- 1.1.2 Delegated legislation ---------- */
TOPICS.push({
  id: '1.1.2', unit: '1A', ref: '1.1.2', title: 'Delegated legislation',
  short: 'Statutory instruments, by-laws, Orders in Council, controls, devolved legislatures',
  summary: 'Delegated (secondary) legislation is law made by a person or body other than Parliament, using power granted by Parliament in an enabling (parent) Act. It makes up most new law each year. You must know the types, why Parliament delegates, how Parliament and the courts control it, its advantages and disadvantages — and the law-making role of the devolved legislatures in Wales, Scotland and Northern Ireland.',
  spec: ['The meaning of delegated legislation and the role of the enabling Act', 'Types: statutory instruments, by-laws, Orders in Council', 'Parliamentary controls: enabling Act, affirmative and negative resolution, scrutiny committees, consultation', 'Judicial controls: judicial review, procedural and substantive ultra vires, unreasonableness', 'Reasons for use; advantages and disadvantages; rule of law concerns', 'The role of the devolved legislatures'],
  learn: [
    { h: 'What delegated legislation is', html: `
<div class="box def"><b class="lbl">Definition</b><p><b>Delegated legislation</b> is law made by a body other than Parliament, with Parliament’s authority. The authority is given in an <b>enabling Act</b> (or parent Act), which sets out the framework and limits of the power.</p></div>
<p>Example: the <b>Public Health (Control of Disease) Act 1984</b> gave the Health Secretary power to make the Health Protection (Coronavirus) Regulations 2020 — the lockdown rules. More than 580 COVID-related statutory instruments were made in 2020–22.</p>` },
    { h: 'Types of delegated legislation', html: `
<div class="tbl"><table><tr><th>Type</th><th>Made by</th><th>Examples</th></tr>
<tr><td><b>Statutory instruments (SIs)</b></td><td>Government ministers and departments. About 2,000–3,500 are made each year.</td><td>National Minimum Wage Regulations (updating the rate each April); commencement orders bringing Acts into force; the Restricted Roads (20 mph Speed Limit) (Wales) Order 2022, made by Welsh Ministers</td></tr>
<tr><td><b>By-laws</b></td><td>Local authorities (Local Government Act 1972 s235) and public corporations; must be approved by a minister</td><td>Parking restrictions, bans on drinking alcohol in parks, railway by-laws against smoking or fare evasion</td></tr>
<tr><td><b>Orders in Council</b></td><td>The government; approved by the Privy Council and signed by the Monarch</td><td>Misuse of Drugs Act 1971 (Modification) Order 2003 reclassified cannabis to Class C (reversed in 2009); emergencies under the Civil Contingencies Act 2004; transferring responsibilities between departments</td></tr></table></div>
<p>Some Acts contain <b>Henry VIII clauses</b>, allowing ministers to amend or repeal Acts of Parliament by delegated legislation — e.g. the European Union (Withdrawal) Act 2018 and the Retained EU Law (Revocation and Reform) Act 2023.</p>` },
    { h: 'Why Parliament delegates', html: `
<ul><li><b>Lack of parliamentary time</b> — Parliament could not pass thousands of detailed rules each year.</li>
<li><b>Expertise</b> — technical detail (building regulations, food standards) is best drafted by specialists in departments who consult experts.</li>
<li><b>Local knowledge</b> — councils know what by-laws their area needs.</li>
<li><b>Speed and flexibility</b> — SIs can be made, updated or revoked quickly (minimum wage rates, emergency COVID rules).</li>
<li><b>Emergencies</b> — Orders in Council when Parliament is not sitting.</li></ul>` },
    { h: 'Parliamentary controls', html: `
<ul><li><b>The enabling Act</b> sets the limits: who can make law, on what, and by what procedure. Parliament can repeal the power.</li>
<li><b>Negative resolution procedure</b> — most SIs. The SI is laid before Parliament and becomes law unless either House passes a motion to annul it within <b>40 days</b>. Rarely used: the Commons last annulled an SI in 1979.</li>
<li><b>Affirmative resolution procedure</b> — used for important SIs. Both Houses (or the Commons only, for financial matters) must vote to approve it. Some emergency SIs (e.g. many COVID rules) came into force first and had to be approved within 28 days.</li>
<li><b>Super-affirmative procedure</b> — extra scrutiny for orders under the Legislative and Regulatory Reform Act 2006.</li>
<li><b>Scrutiny committees</b>: the <b>Joint Committee on Statutory Instruments</b> checks the technical legality of SIs (e.g. exceeding powers, unusual use, defective drafting) but <b>not their merits</b>; the Lords’ <b>Secondary Legislation Scrutiny Committee</b> draws attention to SIs of policy interest; the Lords’ <b>Delegated Powers and Regulatory Reform Committee</b> examines the powers in Bills before they pass.</li>
<li><b>Consultation</b> — many enabling Acts require consultation with interested bodies.</li>
<li><b>Ministerial accountability</b> — questions in Parliament.</li></ul>
<div class="box warn"><b class="lbl">Weakness</b><p>Parliament cannot amend an SI — it can only accept or reject it. Very few are debated, and the Lords rejecting an SI (tax credits, 2015) caused a constitutional row.</p></div>` },
    { h: 'Judicial controls', html: `
<p>Anyone directly affected can apply to the High Court (Administrative Court) for <b>judicial review</b>. The court can declare delegated legislation void if it is <b>ultra vires</b> (“beyond the powers”):</p>
<ul><li><b>Procedural ultra vires</b> — the correct procedure in the enabling Act was not followed: [[c:aylesbury]] (no consultation).</li>
<li><b>Substantive ultra vires</b> — the content goes beyond what the enabling Act allows: [[c:curedeeley]]; [[c:plp]] (legal aid residence test); [[c:unison]] (employment tribunal fees blocked access to justice).</li>
<li><b>Unreasonableness</b> — so unreasonable that no reasonable body could have made it: [[c:strickland]]; [[c:wednesbury]].</li>
<li><b>Incompatibility with Convention rights</b> — unlike Acts, delegated legislation can be quashed if it breaches the Human Rights Act 1998 (unless the parent Act requires it).</li></ul>
<p>Judicial control is limited: someone must bring a claim (and pay for it), within a short time limit (usually three months); the court only checks legality, not whether the policy is wise; and a widely drafted enabling Act leaves little to challenge.</p>` },
    { h: 'Advantages and disadvantages', html: `
<div class="debate"><div class="for"><h5>Advantages</h5><ul><li>Saves parliamentary time for major policy</li><li>Uses expertise and consultation</li><li>Local knowledge (by-laws)</li><li>Quick to make and amend; emergency use</li><li>Controlled by Parliament and courts</li></ul></div><div class="ag"><h5>Disadvantages</h5><ul><li><b>Undemocratic</b> — drafted by unelected civil servants</li><li>Sub-delegation — power passed further down</li><li>Huge volume makes law hard to find (rule of law: law must be accessible)</li><li>Weak scrutiny: most SIs are never debated; Parliament cannot amend</li><li>Henry VIII clauses let ministers change Acts</li></ul></div></div>
<p><b>Rule of law link:</b> Bingham argued that law should be clear and accessible and that ministers must act within their powers. The House of Lords Constitution Committee and the Delegated Powers Committee (<i>Democracy Denied?</i>, 2021) warned about the growth of “skeleton Bills” that leave almost everything to ministers.</p>` },
    { h: 'The devolved legislatures', html: `
<p><b>Devolution</b> transferred law-making power from Westminster to legislatures in Wales, Scotland and Northern Ireland (1998–99). The UK Parliament remains sovereign and can still legislate for them, but by the <b>Sewel convention</b> will not normally do so on devolved matters without consent.</p>
<div class="tbl"><table><tr><th>Legislature</th><th>Basis</th><th>Examples of laws</th></tr>
<tr><td><b>Senedd Cymru</b> (Welsh Parliament)</td><td>Government of Wales Act 2006; Wales Act 2017 (reserved powers model); renamed in 2020. From the 2026 election it has 96 Members (Senedd Cymru (Members and Elections) Act 2024)</td><td>Human Transplantation (Wales) Act 2013 (opt-out organ donation); Children (Abolition of Defence of Reasonable Punishment) (Wales) Act 2020; Public Health (Minimum Price for Alcohol) (Wales) Act 2018</td></tr>
<tr><td><b>Scottish Parliament</b></td><td>Scotland Acts 1998, 2012, 2016</td><td>Alcohol (Minimum Pricing) (Scotland) Act 2012; smoking ban (2006)</td></tr>
<tr><td><b>Northern Ireland Assembly</b></td><td>Northern Ireland Act 1998</td><td>Has been suspended several times (most recently 2022–24)</td></tr></table></div>
<p>Devolved bodies can only legislate within their <b>competence</b>. The Supreme Court decides disputes: [[c:uncrc]] (outside competence); <i>Agricultural Sector (Wales) Bill</i> (2014) (within competence). In [[c:axa]] the Court held devolved Acts can be reviewed only for exceeding competence or on extreme rule of law grounds. In 2023 the UK government used s35 Scotland Act for the first time to block the Gender Recognition Reform (Scotland) Bill.</p>` }
  ],
  debate: [{ q: 'Are the controls over delegated legislation effective?', for: ['The enabling Act sets clear limits and can be repealed.', 'The affirmative procedure forces a vote on important SIs.', 'The JCSI scrutinises every SI technically.', 'Courts quash ultra vires legislation: UNISON, Public Law Project.'], ag: ['Most SIs use the negative procedure and are never debated.', 'Parliament cannot amend SIs; rejection is extremely rare.', 'The JCSI cannot consider merits; its reports can be ignored.', 'Judicial review depends on someone challenging, costs money and is limited by wide enabling Acts.', 'Henry VIII clauses and skeleton Bills bypass Parliament.'] }],
  cases: ['aylesbury', 'curedeeley', 'strickland', 'wednesbury', 'plp', 'unison', 'axa', 'uncrc', 'hsc2020'],
  worked: [{ q: '<b>Scenario.</b> The Minister for Transport uses powers under the (fictional) Road Safety Act 2025, which says she may make regulations about e-scooters “after consulting organisations representing users”. She makes regulations without consulting anyone, and bans e-scooters on all roads and in private gardens. Advise the E-Scooter Users’ Association.', s: ['<b class="st">Identify</b>The regulations are delegated legislation (a statutory instrument). The Association could challenge them by judicial review for being ultra vires.', '<b class="st">Procedural</b>The enabling Act requires consultation. Failing to consult is procedural ultra vires — Agricultural Training Board v Aylesbury Mushrooms. The regulations may not apply to the Association’s members.', '<b class="st">Substantive</b>The Act concerns road safety; banning e-scooters in private gardens may go beyond the power given — substantive ultra vires (Customs and Excise v Cure & Deeley; R (Public Law Project) v Lord Chancellor).', '<b class="st">Unreasonable</b>A ban in private places could also be unreasonable, like the by-law in Strickland v Hayes BC; Wednesbury test.', '<b class="st">Conclude</b>The High Court is likely to declare the regulations void, at least in part. The Association must apply promptly (normally within three months).'], a: 'Likely void for procedural and substantive ultra vires (and possibly unreasonableness).' }],
  pitfalls: ['Saying Parliament can amend statutory instruments — it can only approve or reject them.', 'Mixing up the negative and affirmative resolution procedures.', 'Saying the Joint Committee on SIs can reject an SI — it can only report to Parliament.', 'Forgetting that judicial review only checks legality, not merits.', 'Not giving examples of each type of delegated legislation.'],

/* ---------- 1.1.3 Statutory interpretation ---------- */
TOPICS.push({
  id: '1.1.3', unit: '1A', ref: '1.1.3', title: 'Statutory interpretation',
  short: 'Literal, golden, mischief and purposive approaches; intrinsic and extrinsic aids; HRA',
  summary: 'Judges must apply Acts to real disputes, but words can be ambiguous, too broad, or fail to foresee new situations. Statutory interpretation is the set of rules, approaches and aids judges use to find Parliament’s meaning. This is a key legal skill: in a Component 1 scenario you apply each rule to the words of a statute and explain the different outcomes.',
  spec: ['Why interpretation is needed', 'The literal rule, golden rule (narrow and wide), mischief rule and purposive approach, with cases', 'Rules of language: ejusdem generis, noscitur a sociis, expressio unius est exclusio alterius', 'Intrinsic aids: long title, short title, preamble, interpretation sections, headings, explanatory notes', 'Extrinsic aids: dictionaries, Hansard (Pepper v Hart), textbooks, treaties, previous cases, Law Commission reports', 'Impact of EU law and the Human Rights Act 1998 (ss3 and 4)'],
  learn: [
    { h: 'Why interpretation is needed', html: `
<ul><li><b>Broad terms</b> — words chosen to cover many situations (e.g. “vehicle”, “type”).</li>
<li><b>Ambiguity</b> — a word with two or more meanings.</li>
<li><b>Drafting errors</b> — mistakes made when the Bill was drafted or amended.</li>
<li><b>New developments</b> — technology or social change Parliament did not foresee ([[c:quintavalle]]: cloning).</li>
<li><b>Changes in the use of language</b> — words change meaning over time.</li></ul>` },
    { h: 'The literal rule', html: `
<div class="box def"><b class="lbl">Rule</b><p>Words are given their plain, ordinary, dictionary meaning, even if this leads to an absurd or harsh result. Lord Esher (1892): “If the words of an Act are clear, you must follow them, even though they lead to a manifest absurdity.”</p></div>
<p>Cases: [[c:whiteley]] (dead man not “entitled to vote”); [[c:berriman]] (oiling is not “relaying or repairing”); [[c:fisherbell]] (display is not an “offer for sale”).</p>
<p><b>For:</b> respects parliamentary sovereignty and the separation of powers; makes law certain and predictable; encourages precise drafting. <b>Against:</b> can lead to absurd or unjust results that defeat Parliament’s obvious purpose; assumes every Act is perfectly drafted; words have more than one ordinary meaning (the Law Commission (1969) called it “a false perfection of language”).</p>` },
    { h: 'The golden rule', html: `
<div class="box def"><b class="lbl">Rule</b><p>Start with the literal meaning, but modify it to avoid an absurd result (Lord Wensleydale, <i>Grey v Pearson</i>, 1857).</p></div>
<ul><li><b>Narrow approach</b> — where a word has more than one meaning, choose the one that avoids absurdity: [[c:adler]] (“in the vicinity of” includes “in”); [[c:rallen]] (“marry” = go through a ceremony).</li>
<li><b>Wide approach</b> — where there is only one meaning but it would be repugnant or against public policy, modify it: [[c:sigsworth]] (a murderer cannot inherit).</li></ul>
<p><b>For:</b> avoids the worst results of the literal rule; still respects the words. <b>Against:</b> no clear test of what counts as “absurd”; limited use; judges decide.</p>` },
    { h: 'The mischief rule', html: `
<div class="box def"><b class="lbl">Rule — Heydon’s Case (1584)</b><ol><li>What was the common law before the Act?</li><li>What was the mischief or defect the common law did not cover?</li><li>What remedy did Parliament decide on?</li><li>What is the true reason for the remedy?</li></ol></div>
<p>The judge interprets the words to suppress the mischief and advance the remedy. Cases: [[c:smithhughes]] (soliciting from a balcony was “in a street”); [[c:rcn]] (nurses carrying out abortions under a doctor’s supervision); [[c:corkery]] (a bicycle is a “carriage”).</p>
<p><b>For:</b> gives effect to Parliament’s intention; avoids absurdity and injustice; the Law Commission prefers it. <b>Against:</b> created when judges made most law; risk of judicial law-making (the dissent in RCN); historic reasons can be hard to find; makes the law less certain.</p>` },
    { h: 'The purposive approach', html: `
<div class="box def"><b class="lbl">Approach</b><p>Judges look for the purpose (intention) of Parliament in passing the Act as a whole, and interpret the words to achieve it — even if this means departing from, or adding to, the literal words.</p></div>
<p>Lord Denning in [[c:magor]] said judges should “fill in the gaps”; Lord Simonds replied that this was “a naked usurpation of the legislative function”. Today the purposive approach is dominant, encouraged by EU law and the HRA. Cases: [[c:quintavalle]] (statutes are “always speaking” — cloned embryos covered); [[c:jonestowerboot]] (“in the course of employment” read widely to protect victims of racial harassment); [[c:pickstone]].</p>
<p><b>For:</b> achieves justice and Parliament’s aims; flexible for new situations; consistent with the approach of EU and European courts. <b>Against:</b> judges may substitute their own views (separation of powers); uncertainty; finding Parliament’s purpose may require extrinsic aids that are hard to access.</p>` },
    { h: 'Rules of language and presumptions', html: `
<div class="tbl"><table><tr><th>Rule</th><th>Meaning</th><th>Case</th></tr>
<tr><td><b>Ejusdem generis</b></td><td>“Of the same kind”: general words following a list of specific words are limited to things of the same kind as the list</td><td>[[c:powellkempton]] — “house, office, room or other place” = indoor places only</td></tr>
<tr><td><b>Noscitur a sociis</b></td><td>“A word is known by the company it keeps”: read words in their context</td><td>[[c:inlandfrere]]; <i>Muir v Keay</i> (1875) — “entertainment” meant refreshment, given the words around it</td></tr>
<tr><td><b>Expressio unius est exclusio alterius</b></td><td>Expressly mentioning one thing excludes others</td><td>[[c:tempest]] — “goods, wares and merchandise” did not include stocks and shares</td></tr></table></div>
<p><b>Presumptions</b> (which can be rebutted by clear words): no change to the common law; mens rea is required for criminal offences (<i>Sweet v Parsley</i>); the Crown is not bound; no retrospective effect.</p>` },
    { h: 'Intrinsic and extrinsic aids', html: `
<p><b>Intrinsic aids</b> are found <i>within</i> the Act: the <b>long title</b> (states the purpose), <b>short title</b>, <b>preamble</b> (in older Acts, the purpose), <b>interpretation (definition) sections</b> (e.g. s4 Theft Act 1968 defines “property”), headings and schedules. <b>Explanatory notes</b> are published with modern Acts and may be used as context (<i>R (Westminster CC) v NASS</i>, 2002).</p>
<p><b>Extrinsic aids</b> are found <i>outside</i> the Act:</p>
<ul><li><b>Dictionaries</b> — especially dictionaries from the time of the Act (<i>Cheeseman v DPP</i>, 1990: “passengers”).</li>
<li><b>Hansard</b> — the official record of parliamentary debates. Once banned (<i>Davis v Johnson</i>, 1979); now allowed under the conditions in [[c:pepper]]: ambiguity, obscurity or absurdity; a statement by a minister or promoter; and the statement must be clear. <i>Wilson v First County Trust</i> (2003) restricted its use further.</li>
<li><b>Law Commission reports</b>, government reports and White Papers — to find the mischief.</li>
<li><b>Textbooks</b>, <b>treaties</b> and <b>previous cases</b> interpreting the same words.</li></ul>` },
    { h: 'EU law and the Human Rights Act 1998', html: `
<p><b>EU law:</b> while the UK was a member, courts used the purposive approach to make UK law fit EU law ([[c:pickstone]]; <i>Litster v Forth Dry Dock</i>, 1989). Since Brexit, courts interpret assimilated law in the same way but are no longer bound by new CJEU case law.</p>
<p><b>Human Rights Act 1998:</b></p>
<ul><li><b>s3</b> — “so far as it is possible to do so”, legislation must be read and given effect in a way compatible with Convention rights. This can require a strained meaning: [[c:ghaidan]]; [[c:rva2]].</li>
<li><b>s4</b> — if a compatible reading is not possible, the higher courts may make a <b>declaration of incompatibility</b>; the Act remains valid, and Parliament decides whether to amend it: [[c:bellinger]].</li>
<li><b>s2</b> — courts must take into account decisions of the European Court of Human Rights.</li></ul>
<p>This makes the purposive approach dominant, but raises separation of powers concerns: are judges rewriting Acts?</p>` }
  ],
  debate: [{ q: 'Which approach to statutory interpretation is best?', for: ['Purposive/mischief: achieves Parliament’s real aims and justice (Smith v Hughes, Quintavalle).', 'Handles new technology and social change.', 'Consistent with HRA s3 and European methods.', 'Recommended by the Law Commission (1969).'], ag: ['Literal: respects sovereignty and separation of powers — unelected judges should not rewrite law.', 'Literal gives certainty; lawyers can advise clients.', 'Purposive gives judges too much discretion (Lord Simonds in Magor).', 'Using Hansard and other aids adds cost and time.'] }],
  cases: ['whiteley', 'berriman', 'fisherbell', 'adler', 'rallen', 'sigsworth', 'heydon', 'smithhughes', 'rcn', 'corkery', 'magor', 'quintavalle', 'jonestowerboot', 'pepper', 'powellkempton', 'inlandfrere', 'tempest', 'ghaidan', 'rva2', 'bellinger', 'pickstone'],
  worked: [
    { q: '<b>Scenario (Component 1 style).</b> The (fictional) Parks Protection Act 2024 s1 says: “It is an offence to ride any bicycle, scooter, skateboard or other vehicle in a public park.” Advise whether each person commits an offence using the rules of statutory interpretation: (a) Amir rides a mobility scooter because he cannot walk; (b) Bella pushes her baby in a pram; (c) Callum flies a toy drone over the park.', s: ['<b class="st">Literal</b>Plain meaning of “vehicle”: a thing used to transport people or goods. Amir’s mobility scooter is a vehicle (and even a “scooter”) — guilty. A pram carries a baby, so arguably a vehicle — Bella guilty. A drone flies and is not ridden — Callum not guilty. Compare Whiteley v Chappell for harsh results.', '<b class="st">Golden</b>Convicting a disabled person for using a mobility aid, or a parent for using a pram, is absurd and arguably repugnant. Under the narrow approach (Adler v George) “vehicle” would be read to exclude them.', '<b class="st">Mischief</b>Heydon’s Case: the mischief was probably danger and damage caused by fast-moving recreational vehicles. Mobility scooters and prams are slow and not the mischief — not guilty (Smith v Hughes approach).', '<b class="st">Language</b>Ejusdem generis (Powell v Kempton Park): “other vehicle” is limited to things of the same kind as bicycles, scooters and skateboards — ridden, recreational, wheeled. Mobility scooters are arguably different in purpose; prams are pushed, not ridden; drones are not “ridden” at all.', '<b class="st">Purposive/HRA</b>Purpose — safety of park users. Section 3 HRA and the Equality Act context would support reading the Act so as not to discriminate against disabled people (Arts 8 and 14). Hansard or explanatory notes could be checked (Pepper v Hart) if ambiguous.', '<b class="st">Conclude</b>Only the literal rule would convict Amir and Bella; the other approaches suggest no offence. Callum is not guilty under any rule because he does not “ride”.'], a: 'Different rules give different answers — show each and conclude which a modern court is likely to use (purposive).' }
  ],
  pitfalls: ['Describing a rule without a case and without applying it to the scenario.', 'Saying the golden rule is used when words are unclear — it is used when the literal meaning leads to absurdity.', 'Confusing the mischief rule (look at the problem before the Act) and the purposive approach (look at the purpose of the whole Act).', 'Saying courts can use Hansard whenever they like — Pepper v Hart conditions apply.', 'Saying s3 HRA lets judges strike down Acts.'],
