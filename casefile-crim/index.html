/* ---------- AC2.2 Trial processes ---------- */
TOPICS.push({
  id: '3.2.2', unit: '3', ref: 'AC2.2', title: 'Trial processes',
  short: 'Pre-trial, bail, roles, plea bargaining, courts and appeals',
  summary: 'After charge, a case moves through a series of stages: first appearance, bail decisions, plea and allocation, trial, sentence and possibly appeal. This criterion asks you to describe each stage and the roles of the people involved.',
  spec: ['Pre-trial', 'Bail', 'Roles', 'Plea bargaining', 'Courts', 'Appeals', 'The roles of the personnel involved at each stage'],
  learn: [
    { h: 'Classification and courts', html: `
<div class="tbl"><table><tr><th>Offence</th><th>Examples</th><th>Where tried</th></tr>
<tr><td><b>Summary</b></td><td>Common assault, most driving offences, criminal damage under £5,000</td><td>Magistrates’ court</td></tr>
<tr><td><b>Either way</b></td><td>Theft, burglary, assault occasioning ABH</td><td>Magistrates’ court or Crown Court</td></tr>
<tr><td><b>Indictable only</b></td><td>Murder, manslaughter, rape, robbery</td><td>Crown Court (judge and jury)</td></tr></table></div>
<p>Magistrates can impose up to 12 months’ custody for a single either-way offence (restored in November 2024). Young people are usually tried in the <b>youth court</b>. In 2025 the government announced plans to restrict jury trial for some either-way cases after Sir Brian Leveson’s review of the criminal courts — check the current position.</p>` },
    { h: 'Pre-trial and bail', html: `
<ul><li><b>First appearance</b> — all cases start in the magistrates’ court. For either-way offences the defendant indicates a plea; if not guilty, magistrates decide <b>allocation</b> (mode of trial) and the defendant may elect Crown Court trial.</li>
<li><b>Bail</b> — under the <b>Bail Act 1976</b> there is a presumption of bail. It can be refused if there are substantial grounds to believe the defendant would fail to surrender, commit further offences or interfere with witnesses. Conditions may be imposed: curfew, residence, reporting, electronic tag, surety or security. Refusal means <b>remand</b> in custody. Police can also grant bail before charge.</li>
<li><b>Plea and Trial Preparation Hearing</b> (PTPH) in the Crown Court — plea is taken and the trial timetabled.</li>
<li><b>Disclosure</b> and case management (AC2.3).</li></ul>` },
    { h: 'Plea bargaining', html: `
<p>England and Wales has no formal American-style plea bargaining, but similar practices exist:</p>
<ul><li><b>Charge bargaining</b> — the defendant pleads guilty to a lesser offence (manslaughter instead of murder) and the prosecution drops the more serious charge.</li>
<li><b>Sentence discount</b> — up to one-third off for a guilty plea at the first stage, falling to one-quarter and then one-tenth on the first day of trial (see the guilty plea tool).</li>
<li><b>Goodyear indication</b> — a defendant may ask the judge what the maximum sentence would be if they pleaded guilty now.</li></ul>
<p>Benefits: saves time and money, spares victims giving evidence. Risks: innocent people may plead guilty under pressure.</p>` },
    { h: 'Roles in court', html: `<ul><li><b>Magistrates</b> (lay justices, usually three) or a <b>District Judge</b>; the <b>legal adviser</b> advises magistrates on law.</li><li><b>Judge</b> (Crown Court) — rules on law and evidence, sums up, directs the jury, sentences.</li><li><b>Jury</b> — 12 people decide guilt on the facts.</li><li><b>Prosecution</b> — Crown Prosecutor or barrister; <b>defence</b> — solicitor or barrister (solicitor-advocate).</li><li><b>Usher, court clerk, probation officer</b> (pre-sentence reports), <b>witness service</b>, <b>interpreters</b>.</li></ul>` },
    { h: 'Trial and appeals', html: `
<p><b>Trial order</b>: prosecution opening → prosecution witnesses (examination-in-chief, cross-examination, re-examination) → possible submission of no case to answer → defence case → closing speeches → judge’s summing up → jury deliberation and verdict (unanimous or majority 10–2 / 11–1 after at least two hours) → sentencing (pre-sentence report, Victim Personal Statement).</p>
<ul><li><b>From the magistrates’ court</b>: defence appeal to the Crown Court (against conviction or sentence); either side to the High Court (Divisional Court) by way of case stated on a point of law.</li>
<li><b>From the Crown Court</b>: defence appeal to the Court of Appeal (Criminal Division) with permission — the conviction is quashed if it is “unsafe” (Criminal Appeal Act 1995); appeal against sentence.</li>
<li><b>Prosecution</b>: the Attorney General can refer unduly lenient sentences; retrial after acquittal for serious offences with new and compelling evidence (double jeopardy exception, CJA 2003 — used in the Stephen Lawrence case).</li>
<li><b>Supreme Court</b> on a point of law of general public importance.</li>
<li><b>Criminal Cases Review Commission</b> ([[c:ccrc]]).</li></ul>` }
  ],
  debate: [],
  cases: ['ccrc', 'twomey'],

    { q: 'Murder is…', o: ['indictable only', 'summary', 'either way', 'a civil matter'], x: 'Crown Court only.' },
    { q: 'An appeal from the Crown Court against conviction goes to…', o: ['the Court of Appeal (Criminal Division)', 'the magistrates’ court', 'the CCRC first', 'the county court'], x: 'With permission.' },

/* ---------- AC2.3 Rules of evidence ---------- */
TOPICS.push({
  id: '3.2.3', unit: '3', ref: 'AC2.3', title: 'Rules of evidence',
  short: 'Relevance and admissibility, disclosure, the hearsay rule and its exceptions, and key legislation and case law',
  summary: 'Not all evidence can be used in court. Evidence must be relevant and admissible, must be disclosed properly, and hearsay is only allowed in certain circumstances. This criterion asks you to understand these rules and the legislation and cases behind them.',
  spec: ['Relevance and admissibility', 'Disclosure of evidence', 'Hearsay rule and exceptions', 'Legislation and case law', 'How evidence is used in court'],
  learn: [
    { h: 'Relevance and admissibility', html: `
<ul><li>Evidence must be <b>relevant</b> — it must make a fact in issue more or less probable.</li>
<li>Relevant evidence may still be <b>inadmissible</b>. The judge decides admissibility, often in a voir dire (a hearing without the jury).</li>
<li><b>Confessions</b> must be excluded if obtained by <b>oppression</b> or in circumstances making them unreliable (<b>s76 PACE 1984</b>) — [[c:cardiffthree]].</li>
<li>The court may exclude any prosecution evidence whose admission would have an adverse effect on the <b>fairness</b> of proceedings (<b>s78 PACE</b>) — e.g. evidence obtained by breaching PACE or through entrapment.</li>
<li><b>Bad character</b> (previous convictions) is admissible only through the gateways in <b>s101 Criminal Justice Act 2003</b>, e.g. to show a propensity to commit similar offences.</li>
<li><b>Identification evidence</b> — [[c:turnbull]] guidelines.</li>
<li><b>Expert evidence</b> — must be within the expert’s field and they have a duty to the court (Criminal Procedure Rules Part 19).</li></ul>` },
    { h: 'Disclosure', html: `
<p>Under the <b>Criminal Procedure and Investigations Act 1996</b>, the prosecution must disclose any unused material that might reasonably be considered capable of <b>undermining the prosecution case or assisting the defence</b>. The defence must provide a defence statement in Crown Court cases. Failures cause miscarriages of justice ([[c:kiszko]]; [[c:sallyclark]]) and collapsed trials ([[c:liamallan]]). The volume of digital material (phones, social media) makes disclosure much harder.</p>` },
    { h: 'Hearsay and exceptions', html: `
<p><b>Hearsay</b> is a statement made out of court that is presented as evidence of the truth of what it says (e.g. “My friend told me she saw Tom with the knife”). It is generally inadmissible because the maker cannot be cross-examined.</p>
<p>Under the <b>Criminal Justice Act 2003 (ss114–118)</b> hearsay can be admitted:</p>
<ul><li>where the witness is <b>unavailable</b> — dead, unfit, abroad, cannot be found, or in fear (s116);</li><li><b>business documents</b> and records (s117);</li><li>preserved common law exceptions such as <b>res gestae</b> (statements made in the heat of the moment) and confessions (s118);</li><li>by agreement of all parties; or</li><li>where the court decides it is in the <b>interests of justice</b> (s114(1)(d)).</li></ul>` }
  ],
  debate: [{ q: 'Do the rules of evidence strike the right balance?', for: ['Exclusion of oppressive confessions protects the vulnerable (Cardiff Three).', 'Hearsay exceptions allow justice where a witness has died or is too afraid.', 'Disclosure duties protect against wrongful conviction.'], ag: ['Relevant evidence can be excluded, letting the guilty go free.', 'Bad character evidence may prejudice juries.', 'Disclosure failures continue (Liam Allan).', 'Hearsay is hard to test in cross-examination.'] }],
  cases: ['cardiffthree', 'turnbull', 'liamallan', 'kiszko', 'sallyclark'],

  ],

<ul><li><b>Eligibility</b> (Juries Act 1974): aged 18–75, on the electoral register, lived in the UK for at least five years since age 13. Disqualified: some people with criminal convictions, people on bail, and some people with mental disorders.</li>
<li><b>Selection</b>: random selection from the electoral register; 12 jurors sworn in for a trial. Excusals for good reason; deferral possible.</li>
<li><b>Role</b>: decide the facts and give the verdict — guilty or not guilty — in Crown Court trials. The judge decides the law and the sentence. Majority verdicts of 10–2 or 11–1 are allowed.</li>
<li><b>Secrecy</b>: jury deliberations are secret; jurors must not research the case online ([[c:fraill]]; Juries Act 1974 as amended in 2015).</li>
<li>Trials without a jury are possible where there is a danger of jury tampering ([[c:twomey]]).</li></ul>` },

<li>Six key qualities: good character, understanding and communication, social awareness, maturity and sound temperament, sound judgement, commitment and reliability.</li>
<li>Training by the Judicial College; sit in benches of three (or two), advised on law by a legal adviser.</li>

TOPICS.push({
  id: '4.1.1', unit: '4', ref: 'AC1.1', title: 'How criminal law is made',
  short: 'Government processes (the legislative process) and judicial processes (precedent and statutory interpretation)',
  summary: 'Criminal law in England and Wales comes from two main sources: Parliament, which passes Acts through the legislative process, and judges, who develop the common law through precedent and interpret statutes. This criterion asks you to describe both processes.',
  spec: ['Government processes: the legislative process', 'Judicial processes: the role of judges in making criminal law', 'Synoptic: relate to the review of verdicts in Unit 3 and to campaigns and policy change in Unit 1'],
  learn: [
    { h: 'Government processes: making an Act', html: `
<ol><li><b>Ideas</b> come from government manifestos, the Law Commission, public inquiries, campaigns (Unit 1), judges, media and events.</li>
<li><b>Consultation</b> — a <b>Green Paper</b> sets out proposals for discussion; a <b>White Paper</b> sets out firm plans.</li>
<li><b>Bill</b> — most criminal justice Bills are Public Bills introduced by the Home Office or Ministry of Justice (some Private Members’ Bills also succeed, e.g. the Voyeurism (Offences) Act 2019 began as a Private Member’s Bill before the government took it on).</li>
<li><b>Stages in each House</b>: First Reading (formal introduction) → Second Reading (main debate on principles, vote) → Committee Stage (detailed line-by-line scrutiny and amendments) → Report Stage (consider amendments) → Third Reading (final vote). Then the same in the other House, with “ping-pong” to agree amendments.</li>
<li><b>Royal Assent</b> — the monarch signs it into law; a <b>commencement order</b> may bring it into force later.</li></ol>
<p>The House of Commons can override the Lords using the <b>Parliament Acts 1911 and 1949</b> (e.g. the Hunting Act 2004). Ministers can also make <b>delegated legislation</b> (statutory instruments) under powers in an Act. The <b>Senedd Cymru</b> can make laws in devolved areas, including creating offences — for example the smacking ban — but policing and most criminal justice are reserved to Westminster.</p>` },
    { h: 'Judicial processes: precedent', html: `
<ul><li><b>Common law</b> offences such as murder and manslaughter are defined by judges, not statute.</li>
<li><b>Judicial precedent</b> (<i>stare decisis</i> — stand by what has been decided): lower courts must follow the <b>ratio decidendi</b> (the legal reason for a decision) of higher courts. The <b>Supreme Court</b> can depart from its own previous decisions (Practice Statement 1966).</li>
<li>Judges can <b>overrule</b> earlier cases ([[c:jogee]]), <b>distinguish</b> cases on their facts, and develop new law to fit changing values ([[c:rvr]] abolished the marital rape exemption).</li></ul>` },
    { h: 'Judicial processes: statutory interpretation', html: `
<p>When the words of an Act are unclear, judges interpret them using:</p>
<ul><li><b>Literal rule</b> — the ordinary meaning of the words, even if the result is harsh.</li><li><b>Golden rule</b> — modify the literal meaning to avoid an absurd result.</li><li><b>Mischief rule</b> — what problem was the Act meant to remedy? ([[c:smithhughes]])</li><li><b>Purposive approach</b> — what was Parliament’s purpose? Judges may look at Hansard (Pepper v Hart, 1993).</li></ul>
<p>Judges must also interpret laws compatibly with human rights where possible (Human Rights Act 1998 s3).</p>` },
    { h: 'Synoptic links', html: `<p>Unit 1: campaigns lead to new Acts (Helen’s Law, Finn’s Law). Unit 3: miscarriages of justice led to the Criminal Appeal Act 1995 and the Post Office (Horizon System) Offences Act 2024 ([[c:postoffice]]). Unit 2: social change and theories influence what Parliament decides to criminalise.</p>` }

<li><b>Aims met</b>: rehabilitation (treatment), reparation (unpaid work), some public protection (curfews, tags) and punishment; offenders keep jobs, homes and families.</li>
<li><b>Evidence</b>: Ministry of Justice studies have found lower reoffending for community orders than for short prison sentences with similar offenders. The public may see them as a “soft option”.</li></ul>` },

<ul><li><b>Fines</b> — the most common sentence; set by the offence and the offender’s weekly income (bands A–F); plus a victim surcharge. Meets retribution and some deterrence; no rehabilitation or protection; unpaid fines are a problem; unequal impact on poor and rich.</li>
<li><b>Compensation orders</b> — payment to the victim: reparation.</li>
<li><b>Conditional discharge</b> — no punishment unless the offender reoffends within the set period (up to three years): individual deterrence.</li>
<li><b>Absolute discharge</b> — guilty, but no penalty because the offender is not morally to blame or the offence is trivial.</li></ul>` },

function gameBest(id, score) { S.games[id] ??= { best: 0, plays: 0 }; if (score != null) { S.games[id].plays++; if (score > S.games[id].best) { S.games[id].best = score; save(); return true; } save(); } return false; }
function drawGameArt(cv, id) {
  const c = cv.getContext('2d'), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; c.scale(dpr, dpr);
  c.fillStyle = '#141A26'; c.fillRect(0, 0, W, H);
  const col = GAMES[id].col; let seed = id.length * 97;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

  else if (id === 'theory') { for (let i = 0; i < 5; i++) { const x = W - 170 + i * 30; c.fillStyle = hexA(col, .18 + i * .1); c.fillRect(x, 16, 22, 56); c.beginPath(); c.arc(x + 11, 14, 9, 0, Math.PI * 2); c.fill(); } c.strokeStyle = hexA(col, .35); for (let y = 20; y < 76; y += 10) { c.beginPath(); c.moveTo(W - 180, y); c.lineTo(W - 10, y); c.stroke(); } }
  else for (let i = 0; i < 22; i++) { const w = 8 + rnd() * 8, hh = 34 + rnd() * 34, x = 10 + i * (W / 22); c.fillStyle = hexA(col, .15 + rnd() * .5); c.fillRect(x, H - 36 - hh, w, hh); c.fillStyle = hexA('#F2C230', .5); c.fillRect(x, H - 36 - hh + 5, w, 2); }
  c.fillStyle = '#F4F6FA'; c.font = '800 21px "Archivo", "Arial Narrow", sans-serif'; c.textBaseline = 'alphabetic'; c.fillText(GAMES[id].title, 14, H - 14);

      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => {
      if (!alive || locked) return; locked = true; answered++;
      const ok = cur.opts[i] === cur.ans, btns = $$('.opt', host);
      if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btns[i].classList.add('right'); }
      else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btns[i].classList.add('wrong'); btns[cur.opts.indexOf(cur.ans)].classList.add('right'); if (cur.fb) $('#gfb', host).innerHTML = `<div class="explain small">${rich(cur.fb)}</div>`; }
      setTimeout(() => alive && left > 0 && next(), ok ? 350 : 2200);
    };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= (cur?.opts.length || 4)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();
    return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'year') {
    const qs = shuffle(YEAR_BANK).slice(0, 10); let i = 0, score = 0;
    const render = () => {
      const q = qs[i];
      host.innerHTML = `<div class="game">${hud([['Round', (i + 1) + '/10'], ['Score', score]])}<div class="eyebrow" style="text-align:center">In which year?</div><div class="big-prompt"><i class="cn">${esc(q[0])}</i></div>
        <div class="card" style="text-align:center"><div style="font:700 56px var(--f-display)" id="yr-out">1950</div>
        <input id="yr-in" type="range" min="1850" max="2026" step="1" value="1950" style="margin:14px 0" aria-label="Year"><div class="row" style="justify-content:center"><button class="btn sm" id="yr-m">−1</button><button class="btn primary" id="yr-go">Lock in</button><button class="btn sm" id="yr-p">+1</button></div><div id="yr-fb"></div></div></div>`;
      const inp = $('#yr-in', host); const upd = () => { $('#yr-out', host).textContent = inp.value; inp.style.setProperty('--p', ((+inp.value - 1850) / 176 * 100) + '%'); }; inp.oninput = upd; upd();
      $('#yr-m', host).onclick = () => { inp.value = +inp.value - 1; upd(); }; $('#yr-p', host).onclick = () => { inp.value = +inp.value + 1; upd(); };
      $('#yr-go', host).onclick = () => {
        const d = Math.abs(+inp.value - q[1]), pts = d === 0 ? 10 : d <= 2 ? 8 : d <= 5 ? 5 : d <= 15 ? 2 : 0; score += pts; pts >= 5 ? sfx.good() : sfx.bad();
        $('#yr-fb', host).innerHTML = `<div class="explain" style="margin-top:14px"><b class="v ${pts >= 5 ? 'good' : 'bad'}">${pts ? '+' + pts : 'Off by ' + d + ' years'}</b> The answer is <b>${q[1]}</b>.</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="yr-next">${i < 9 ? 'Next' : 'Finish'}</button></div>`;
        $('#yr-go', host).disabled = true; $('#yr-next', host).onclick = () => { i++; i < 10 ? render() : endScreen(score, '<p class="muted">10 points for exact, 8 within 2 years, 5 within 5, 2 within 15.</p>'); };
      };
    };
    render(); return stop;
  }

  if (id === 'blitz') {
    const pool = TOPICS.filter(t => unitInScope(t.unit)).flatMap(t => t.quiz.map(q => ({ q, t }))); let score = 0, lives = 3, cur;
    const next = () => { const { q, t } = pick(pool); const truth = Math.random() < 0.5; cur = { q, t, truth, opt: truth ? q.o[0] : pick(q.o.slice(1)) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Lives', '♥'.repeat(lives) || '0']])}<div class="card"><div class="eyebrow">${cur.t.id} · ${esc(cur.t.title)}</div><p class="q-text">${rich(cur.q.q)}</p><div class="box def" style="font-size:17px"><b class="lbl">Proposed answer</b><p>${rich(cur.opt)}</p></div>
      <div class="row" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn primary" data-a="1" style="min-width:130px">True <kbd>T</kbd></button><button class="btn" data-a="0" style="min-width:130px">False <kbd>F</kbd></button></div><div id="bz-fb"></div></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => answer(b.dataset.a === '1'));
    };
    const answer = a => {
      if ($('#bz-fb', host).innerHTML) return; const ok = a === cur.truth; ok ? (score += 10, sfx.good()) : (lives--, sfx.bad());
      $('#bz-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</b> ${cur.truth ? 'That answer is right.' : 'The correct answer is: ' + rich(cur.q.o[0])} ${cur.q.x ? '<br><span class="muted">' + rich(cur.q.x) + '</span>' : ''}</div>`;
      setTimeout(() => { if (!alive) return; lives > 0 ? next() : endScreen(score); }, ok ? 900 : 2600);
    };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 't' || e.key === 'T') answer(true); if (e.key === 'f' || e.key === 'F') answer(false); };
    addEventListener('keydown', key); next(); return () => { stop(); removeEventListener('keydown', key); };
  }
  return stop;
}

const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const vis = t => unitInScope(t.unit);
const allTopics = () => TOPICS.filter(vis);
const unitTopics = uid => TOPICS.filter(t => t.unit === uid && vis(t));
const ucol = uid => unitOf(uid)?.css || 'var(--accent)';
const pct = x => Math.round(x * 100) + '%';
const areaTag = uid => { const u = unitOf(uid); return u?.kind === 'int' ? '<span class="tag int">Controlled assessment</span>' : u?.kind === 'ext' ? '<span class="tag ext">Exam</span>' : ''; };
const kindWord = c => ({ Case: 'case', Study: 'study', Theory: 'theory', Campaign: 'campaign', Report: 'report' })[c.c] || 'case file';

/* flashcard deck for a topic: concept cards + case cards */
function deck(t) {
  const d = (t.cards || []).map((c, i) => ({ k: 'k' + i, q: c[0], a: c[1] }));
  (t.cases || []).forEach(id => { const c = CASES[id]; if (c) d.push({ k: 'c:' + id, q: `<span class="eyebrow" style="position:static;display:block;margin-bottom:10px">Name the ${kindWord(c)}</span>${esc(c.f)}`, a: `<b><i class="cn">${esc(c.n)}</i> (${c.y})</b><br><br>${esc(c.p)}` }); });
  return d;
}
function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, d = deck(t);
  const ck = d.length ? d.filter(c => (s.cards[c.k] || 0) >= 3).length / d.length : 0;
  const sp = (t.spec || []).reduce((a, _, i) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / Math.max(1, (t.spec || []).length);
  const ex = t.exam?.length ? (s.exam || 0) : q;
  return clamp(0.4 * q + 0.2 * ck + 0.2 * sp + 0.2 * ex, 0, 1);
}
const unitMastery = uid => { const ts = unitTopics(uid); return ts.length ? ts.reduce((a, t) => a + mastery(t), 0) / ts.length : 0; };

  /* ---------- Quiz engine ---------- */
  function caseQs(t, n) {

  }
  function runQuiz(host, items, o = {}) {

      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${esc(q.topic)}</a>` : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.q)}</div>
        <div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p><div id="fb"></div>`;
      $$('.opt', host).forEach(b => b.onclick = e => { if (e.target.closest('.case')) return; answer(+b.dataset.k); });
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i || k >= q.order.length) return;
      const ok = q.order[k] === 0; res.push({ ok, q }); (ok ? sfx.good : sfx.bad)();
      $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100);
      S.stats.quizzes++; if (p === 100) { S.stats.perfect++; burst(); sfx.win(); } save();
      o.onDone && o.onDone({ correct, total: qs.length, pct: p });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete</div><div class="big">${p}%</div><p class="lede" style="margin:8px auto">${correct} of ${qs.length} correct${p === 100 ? ' — case closed!' : p >= 70 ? ' — strong.' : ' — review the notes and try again.'}</p>
        <div class="stack" style="text-align:left;max-width:640px;margin:18px auto 0">${res.filter(r => !r.ok).map(r => `<div class="explain"><b class="v bad">Review</b> ${rich(r.q.q)}<br><span class="small">Answer: <b>${rich(r.q.o[0])}</b></span></div>`).join('')}</div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>`;
      $('#retry').onclick = () => runQuiz(host, o.regen ? o.regen() : items, o);
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const m = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (m != null && res.length === i && i < qs.length) answer(m); else if (e.key === 'Enter' && $('#nextq')) { e.preventDefault(); $('#nextq').click(); } };

  }

      <div class="grid g3 sec" style="margin-top:18px"><div class="card"><div class="eyebrow">Level ${L.l}</div><div class="h2" style="margin:8px 0">${esc(L.name)}</div><div class="bar" style="--uc:var(--gilt)"><i style="width:${clamp(L.frac, 0, 1) * 100}%"></i></div><p class="small muted">${S.xp} XP · next level at ${Math.round(L.next)}</p></div>
      <div class="card"><div class="eyebrow">Last 28 days</div><svg viewBox="0 0 280 90" width="100%" height="110" role="img" aria-label="XP earned per day">${days.map(([d, v], i) => `<rect x="${i * 10 + 1}" y="${80 - v / mx * 70}" width="8" height="${Math.max(1, v / mx * 70)}" rx="1.5" fill="${v ? 'var(--accent)' : 'var(--line-2)'}"><title>${d}: ${v} XP</title></rect>`).join('')}<line x1="0" y1="81" x2="280" y2="81" stroke="var(--line-2)"/><text x="0" y="90" font-size="7" fill="var(--muted)">4 weeks ago</text><text x="280" y="90" font-size="7" fill="var(--muted)" text-anchor="end">today</text></svg></div>
      <div class="card"><div class="eyebrow">Totals</div><div class="readouts" style="margin-top:10px"><div class="ro"><span>Quizzes</span><b>${S.stats.quizzes}</b></div><div class="ro"><span>Cards reviewed</span><b>${S.stats.cardsSeen}</b></div><div class="ro"><span>Exam marks</span><b>${S.stats.examMarks}</b></div><div class="ro"><span>Tools tried</span><b>${S.stats.tools.length}</b></div></div></div></div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Mastery by topic</h2><span class="muted">40% quiz · 20% flashcards · 20% checklist · 20% assessment practice</span></div>
      ${UNITS.filter(u => unitTopics(u.id).length).map(u => `<div style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:6px;color:${u.css}">${esc(u.name)}</div><div class="heat">${unitTopics(u.id).map(t => { const m = mastery(t); return `<a href="#/t/${t.id}" title="${esc(t.title)} · ${pct(m)}" style="background:color-mix(in srgb,${u.css} ${Math.round(8 + m * 80)}%,var(--surface))">${esc(t.ref)}</a>`; }).join('')}</div></div>`).join('')}</div>
      <div class="sec"><div class="sec-head"><h2 class="h2">Badges</h2><span class="muted">${S.badges.length} of ${BADGES.length}</span></div><div class="badge-grid">${BADGES.map(([id, n, d, , ic]) => `<div class="badge ${S.badges.includes(id) ? 'got' : ''}"><div class="ic">${ic}</div><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('')}</div></div>
      <div class="sec"><button class="btn sm" id="reset">${ICON.reset} Reset all progress</button><span id="reset-c"></span></div>`;
    $('#reset').onclick = () => { $('#reset-c').innerHTML = ` <span class="small">This deletes all XP, marks and cards. </span><button class="btn sm" id="reset-y" style="border-color:var(--bad);color:var(--bad)">Yes, reset</button>`; $('#reset-y').onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.hash = '#/home'; location.reload(); }; };
  }
  function about() {
    crumbs('<b>About &amp; help</b>');
    V().innerHTML = `<div class="notes"><h1 class="display" style="font-size:clamp(32px,5vw,50px);margin-bottom:14px">About Casefile</h1>
      <p class="lede">Casefile covers the WJEC Level 3 Applied Diploma in Criminology (also offered as Eduqas in England): all four mandatory units, with the Applied Certificate option of Units 1 and 2. Every topic matches one assessment criterion in the specification.</p>
      <h3 style="margin-top:24px">How to use it</h3><ul><li><b>Learn</b> — notes for each assessment criterion, with evaluation points, worked examples and common mistakes. Tap any <button class="case" type="button" data-case="lawrence">case name</button> for what happened and why it matters.</li><li><b>Case files</b> — the cases, studies, theories and campaigns for the topic; hide the details to test yourself.</li><li><b>Explore</b> — interactive sorters, decision trees and tools such as the attrition funnel, the campaign planner and the CPS Full Code Test.</li><li><b>Flashcards</b> — spaced repetition in five boxes: cards you know well come back less often.</li><li><b>Quiz</b> — multiple-choice checks with explanations.</li><li><b>Exam and assessment practice</b> — WJEC-style questions for Units 2 and 4, and practice tasks for Units 1 and 3 with the real mark bands.</li><li><b>Mock papers and briefs</b> — timed Unit 2 and Unit 4 papers and practice assignment briefs.</li></ul>
      <h3 style="margin-top:24px">Keyboard shortcuts</h3><ul><li><kbd>/</kbd> search · <kbd>A</kbd>–<kbd>D</kbd> answer a quiz question · <kbd>Space</kbd> flip a card · <kbd>1</kbd>–<kbd>4</kbd> rate a card</li></ul>
      <h3 style="margin-top:24px">Accuracy</h3><p>Law, policy and statistics are stated as understood in September 2026. Where a reform had been proposed but was not yet in force, or where figures change every year, the notes say so. Check the latest ONS and Ministry of Justice releases before quoting numbers in an assessment. Exam formats follow the published specification; use your teacher’s guidance and WJEC’s sample assessment materials for exact wording. Casefile is an independent study aid and is not produced or endorsed by WJEC or Eduqas.</p>
      <p>Your progress is stored only in this browser. Clearing site data will reset it.</p></div>`;
  }

  /* ---------- SEARCH ---------- */
  function buildIndex() {
    const ix = [];
    allTopics().forEach(t => { ix.push({ k: 'Topic', t: `${unitOf(t.unit).short} ${t.ref} ${t.title}`, s: t.short, href: '#/t/' + t.id, txt: (t.title + ' ' + t.short + ' ' + t.summary).toLowerCase() }); t.learn.forEach((sec, i) => ix.push({ k: 'Notes', t: sec.h, s: `${unitOf(t.unit).short} ${t.ref} ${t.title}`, href: '#/t/' + t.id, txt: (sec.h + ' ' + plain(sec.html)).toLowerCase() })); });
    Object.values(CASES).filter(c => unitInScope(c.a)).forEach(c => ix.push({ k: c.c || 'Case', t: c.n + ' (' + c.y + ')', s: c.p, href: c.t && TOPIC[c.t] ? '#/t/' + c.t + '/cases' : '#/cases', txt: (c.n + ' ' + c.f + ' ' + c.p).toLowerCase() }));
    STATUTES.forEach(st => ix.push({ k: 'Law', t: st.n, s: st.s.map(x => x[0]).join(', '), href: '#/statutes/acts', txt: (st.n + ' ' + st.s.flat().join(' ')).toLowerCase() }));
    GLOSSARY.forEach(g => ix.push({ k: 'Term', t: g[0], s: g[1], href: '#/statutes/terms', txt: (g[0] + ' ' + g[1]).toLowerCase() }));
    Object.entries(GAMES).forEach(([id, g]) => ix.push({ k: 'Game', t: g.title, s: g.blurb, href: '#/game/' + id, txt: (g.title + ' ' + g.blurb).toLowerCase() }));
    return ix;
  }
  function openPalette() {
    if ($('.palette-back')) return; index ??= buildIndex();
    const back = h('div', { class: 'palette-back', role: 'dialog', 'aria-label': 'Search' }, `<div class="palette"><input id="pq" placeholder="Search topics, case files, theories, laws, terms…" autocomplete="off" aria-label="Search"><ul id="pl"></ul></div>`);
    document.body.append(back);
    const inp = $('#pq'), ul = $('#pl'); let sel = 0, res = [];
    const draw = () => {
      const q = inp.value.toLowerCase().trim(); const words = q.split(/\s+/).filter(Boolean);
      res = q ? index.map(r => { let sc = 0; for (const w of words) { if (!r.txt.includes(w)) return null; sc += r.t.toLowerCase().includes(w) ? 3 : 1; } return { r, sc: sc + (r.k === 'Topic' ? 2 : CASES && ['Case', 'Study', 'Theory', 'Campaign', 'Report'].includes(r.k) ? 1 : 0) }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 14).map(x => x.r) : index.filter(r => r.k === 'Topic').slice(0, 10);
      sel = Math.min(sel, Math.max(0, res.length - 1));
      ul.innerHTML = res.length ? res.map((r, i) => `<li><a href="${r.href}" class="${i === sel ? 'sel' : ''}"><span class="kind">${r.k}</span><span><span class="t">${esc(r.t)}</span><span class="s">${esc(plain(r.s))}</span></span></a></li>`).join('') : '<li class="empty" style="margin:8px">No matches. Try a case, a theorist, an Act or a topic.</li>';
    };
    const close = () => back.remove();
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter' && res[sel]) { location.hash = res[sel].href; close(); } else if (e.key === 'Escape') close(); };
    back.onclick = e => { if (e.target === back || e.target.closest('a')) close(); };
    draw(); inp.focus();
  }
  addEventListener('keydown', e => { if (e.key === '/' && !e.target.matches('input,textarea,select')) { e.preventDefault(); openPalette(); } if (e.key === 'Escape') closePop(); });

  /* ---------- boot ---------- */
  function boot() {
    if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
    chrome(); addEventListener('hashchange', route); route();
  }
  return { boot, refreshChrome, route };
})();
App.boot();

</script>
