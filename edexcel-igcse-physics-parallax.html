    '4.10 explain ways of reducing unwanted energy transfer, such as insulation'
  ],
  learn: [
    { h: 'Conduction', html: `
<p><b>Conduction</b> happens mainly in <b>solids</b>. When one end is heated its particles vibrate more; they pass energy to neighbouring particles by collisions. In <b>metals</b>, <b>free (delocalised) electrons</b> move through the lattice and transfer energy quickly, so metals are good conductors. Non-metals, liquids and especially gases (particles far apart) are poor conductors — <b>insulators</b>. Trapped air is an excellent insulator.</p>` },
    { h: 'Convection', html: `
<p><b>Convection</b> happens in <b>fluids</b> (liquids and gases). The heated fluid <b>expands</b>, becomes <b>less dense</b> and <b>rises</b>; cooler, denser fluid sinks to take its place, forming a <b>convection current</b>. Convection cannot happen in solids because particles cannot move from place to place.</p>
<p><b>Everyday phenomena:</b> a room heated by a radiator (warm air rises, circulates); a kettle heating from the element at the bottom; the freezer compartment at the top of a fridge (cold air sinks); sea breezes by day (land heats faster, air above rises, cooler air from the sea replaces it) and land breezes at night; hot-air balloons; gliders using thermals; weather and ocean currents.</p>` },
    { h: 'Radiation', html: `
[[d:leslie]]
<p><b>Thermal radiation</b> is <b>infrared</b> electromagnetic radiation. All objects emit and absorb it; it needs <b>no medium</b> — it travels through a vacuum (e.g. from the Sun).</p>
<ul><li><b>Hotter</b> objects emit more radiation (and the rate rises steeply with temperature).</li><li><b>Dull, black</b> surfaces are the <b>best emitters and best absorbers</b>.</li><li><b>Shiny, silvered or white</b> surfaces are poor emitters and poor absorbers — good <b>reflectors</b>.</li></ul>
<p>Examples: solar panels painted black; houses in hot countries painted white; emergency blankets shiny; radiators… mostly transfer energy by convection despite their name.</p>` },
    { h: 'Practicals (4.9)', html: `
<ul><li><b>Conduction:</b> rods of different metals (same length and thickness) with wax/drawing pins attached at the far end; heat one end equally; the pin falls first from the best conductor. Or time how long a thermometer at the end takes to rise.</li><li><b>Convection:</b> drop a potassium permanganate crystal at the side of a beaker of water and heat gently below it — the purple streak shows the convection current rising above the heat and sinking elsewhere. Or a smoke/candle convection box.</li><li><b>Radiation:</b> a <b>Leslie cube</b> filled with hot water has faces that are matt black, shiny black, matt white and shiny silver. Measure the radiation from each face at the same distance with an infrared detector/thermometer: matt black emits most, shiny silver least. For <b>absorption</b>: two cans (black, silver) with thermometers at equal distances from a heater — the black can warms faster. Or wax-stuck coins on black and shiny plates either side of a heater.</li></ul>
<p>Control variables: same volume/starting temperature of water, same distance from the source, same time.</p>` },
    { h: 'Reducing unwanted energy transfer', html: `
<div class="tbl"><table><tr><th>Method</th><th>How it works</th></tr>
<tr><td>Loft insulation (fibreglass, mineral wool)</td><td>traps air, a poor conductor; stops convection in the loft</td></tr>
<tr><td>Cavity wall insulation (foam)</td><td>traps air in pockets, preventing convection currents in the cavity</td></tr>
<tr><td>Double/triple glazing</td><td>gap of air or vacuum between panes reduces conduction and convection</td></tr>
<tr><td>Draught excluders, carpets, curtains</td><td>reduce convection and conduction</td></tr>
<tr><td>Reflective foil behind radiators, shiny surfaces</td><td>reflect infrared radiation back</td></tr>
<tr><td><b>Vacuum flask</b></td><td>vacuum between walls stops conduction and convection; silvered walls reduce radiation; stopper reduces convection and evaporation</td></tr>
<tr><td>Clothing, animal fur, feathers, duvets</td><td>trap layers of air</td></tr></table></div>` }
  ],

<p>Water has a very high specific heat capacity (4200 J/kg °C): it takes a lot of energy to heat and it releases a lot when it cools — used in central heating systems and hot-water bottles, and the reason coastal climates are milder. Metals have low values (copper 390, aluminium 900 J/kg °C) so they heat up quickly.</p>` },

<ol><li>An <b>alternating</b> current in the primary coil produces a <b>changing (alternating) magnetic field</b> in the core.</li><li>The soft iron core carries this changing field through the secondary coil.</li><li>The changing field induces an alternating voltage in the secondary coil.</li></ol>
<p>Transformers only work with <b>a.c.</b> — a steady d.c. gives a constant field, so no voltage is induced. More turns on the secondary than the primary → <b>step-up</b> (voltage increases); fewer → <b>step-down</b>.</p>` },

<ul><li><b>From Earth (natural):</b> <b>radon gas</b> seeping from rocks such as granite (the largest source in many places); rocks and building materials; food and drink (e.g. potassium-40 in our bodies).</li><li><b>From space:</b> <b>cosmic rays</b> — high-energy particles from the Sun and stars (more at high altitude, in aircraft).</li><li><b>Artificial (smaller):</b> medical x-rays and treatments, nuclear power and weapons testing fallout, accidents.</li></ul>

[[d:halflife]]
<p>The <b>activity</b> of a source is the number of nuclei that decay each second, measured in <b>becquerels (Bq)</b>: 1 Bq = 1 decay per second. As unstable nuclei decay, fewer remain, so the activity <b>decreases</b> over time.</p>
<div class="box def"><b class="lbl">Definition</b><p>The <b>half-life</b> of a radioactive isotope is the time taken for <b>half the unstable nuclei</b> in a sample to decay — equivalently, the time for the <b>activity</b> (or count rate) to fall to <b>half</b>.</p></div>
<p>Half-lives vary enormously between isotopes: from fractions of a second to billions of years (e.g. technetium-99m: 6 hours; iodine-131: 8 days; carbon-14: 5700 years; uranium-238: 4.5 billion years). A short half-life means a high initial activity that falls quickly.</p>` },

<p>After <b>n</b> half-lives, the activity is $@frac{1}{2^n}$ of the original: 1 → ½ → ¼ → ⅛ → ¹⁄₁₆…</p>
<p><b>From a graph</b> of activity (or count rate) against time: pick a starting activity, read off the time; find half that activity, read off the time; the difference is the half-life. Repeat from another starting point and average. Subtract background count first.</p>
<p>Example: 800 Bq → 400 → 200 → 100 Bq is 3 half-lives. If this takes 24 days, the half-life is 8 days.</p>` }

<p>Nuclear reactions — <b>fission, fusion and radioactive decay</b> — release energy from the nuclear store.</p>

  summary: 'Nuclear fusion joins small nuclei into larger ones with a loss of mass and release of energy; it powers the stars; it needs very high temperatures and pressures to overcome the electrostatic repulsion of protons.',

  ],
  learn: [
    { h: 'Fusion', html: `
[[d:fusion]]
<p><b>Nuclear fusion</b> is the joining of two small (light) nuclei, such as isotopes of hydrogen, to make a <b>larger nucleus</b>. The mass of the new nucleus (and any particles released) is slightly <b>less</b> than the total mass of the original nuclei; this <b>loss of mass</b> is released as a large amount of <b>energy</b>.</p>
<p>Example: ${nuc(2, 1, 'H')} + ${nuc(3, 1, 'H')} → ${nuc(4, 2, 'He')} + ${nuc(1, 0, 'n')} + energy</p>
<p><b>Fusion is the energy source for stars</b>, including the Sun, where hydrogen nuclei fuse to form helium.</p>` },
    { h: 'Why fusion needs extreme conditions', html: `
<p>Nuclei are positively charged (they contain protons), so they <b>repel each other electrostatically</b>. For them to get close enough to fuse, they must be moving extremely fast — which needs a very <b>high temperature</b> (millions of °C) — and be close together, which needs a very high <b>pressure</b> (density) so collisions are frequent. At low temperatures and pressures, nuclei do not have enough kinetic energy to overcome the repulsion, so fusion does not happen. This is why fusion power stations are so hard to build (the hot plasma must be contained by strong magnetic fields).</p>
<div class="tbl"><table><tr><th></th><th>Fission</th><th>Fusion</th></tr>
<tr><td>Process</td><td>a large nucleus splits into two smaller nuclei</td><td>two small nuclei join to make a larger nucleus</td></tr>
<tr><td>Fuel</td><td>uranium-235, plutonium-239</td><td>hydrogen isotopes (deuterium, tritium)</td></tr>
<tr><td>Trigger/conditions</td><td>absorbing a neutron; works at ordinary temperatures</td><td>extremely high temperature and pressure</td></tr>
<tr><td>Where used</td><td>nuclear power stations</td><td>stars; experimental reactors</td></tr>
<tr><td>Waste</td><td>long-lived radioactive waste</td><td>little radioactive waste (helium)</td></tr></table></div>` }

  learn: [
    { h: 'Doppler effect for light — red-shift', html: `
[[d:redshift]]
<p>If a wave source moves relative to an observer, the observed frequency and wavelength change (the Doppler effect). For light from a source moving <b>away</b>, the observed wavelength is <b>longer</b> — shifted towards the <b>red</b> end of the spectrum: <b>red-shift</b>. A source moving towards us shows <b>blue-shift</b>.</p>
<p>Astronomers see this in the <b>absorption lines</b> (dark lines) in the spectra of galaxies: the pattern of lines is the same as from elements on Earth, but shifted towards longer wavelengths.</p>
<div class="box def"><b class="lbl">Given</b><p>$@frac{Δλ}{λ_0} = @frac{λ - λ_0}{λ_0} = @frac{v}{c}$</p></div>
<p>λ₀ = reference wavelength (measured in the lab), λ = observed wavelength, v = velocity of the galaxy (away from us), c = speed of light = 3.0 × 10⁸ m/s.</p>` },

/* ---- gens.js ---- */
/* ==========================================================
   Numerical question generators (Edexcel International GCSE conventions: g = 10 N/kg, units m/s, J/kg °C …).
   Each returns { q, ans, unit, steps[] } with fresh values; answers are computed so
   every question is self-consistent. GEN_FLAGS marks Higher-tier (ht) / physics-only (po) ones.
   ========================================================== */
const GEN = {};
const s3 = x => sf(x, 3), s2 = x => sf(x, 2);
const G9 = 10;
const pk = a => a[Math.floor(Math.random() * a.length)];
const an = x => /^(8|11|18)/.test(String(x)) ? 'An' : 'A';
/* ‘P’ (Physics only, bold in the specification) generators — hidden for Science (Double Award) */
const GEN_FLAGS = { mom4: 'po', mom5: 'po', mom6: 'po', fmdt1: 'po', mom1: 'po', mom2: 'po', mom3: 'po', shc1: 'po', shc2: 'po', shc3: 'po',
  trans1: 'po', trans2: 'po', trans3: 'po', trans4: 'po', scope1: 'po', redshift1: 'po', redshift2: 'po' };

/* ---------- 1.1 Energy stores ---------- */
GEN.ke1 = () => { const m = pk([0.5, 2.0, 60, 75, 800, 1200, 1500]), v = rnd(2, 30, 1), E = 0.5 * m * v * v;
  return { q: `An object of mass ${m} kg moves at ${v} m/s. Calculate its kinetic energy.`, ans: E, unit: 'J', steps: ['$E_k = @frac{1}{2}mv^2$', `$E_k = 0.5 × ${m} × ${v}^2$`, `$E_k = ${s3(E)} "J"$`] }; };
GEN.ke2 = () => { const m = pk([2.0, 4.0, 50, 70, 1000]), v = rnd(3, 25, 1), E = 0.5 * m * v * v;
  return { q: `${an(m)} ${m} kg object has ${s3(E)} J of kinetic energy. Calculate its speed.`, ans: v, unit: 'm/s', steps: ['$v^2 = @frac{2E_k}{m}$', `$v^2 = @frac{2 × ${s3(E)}}{${m}} = ${s3(v * v)}$`, `$v = ${s3(v)} "m/s"$`] }; };
GEN.gpe1 = () => { const m = rnd(0.5, 80, 0.5), h = rnd(1, 50, 1), E = m * G9 * h;
  return { q: `${an(m)} ${m} kg object is lifted through ${h} m. g = 10 N/kg. Calculate the gain in gravitational potential energy.`, ans: E, unit: 'J', steps: ['$E_p = mgh$', `$E_p = ${m} × 10 × ${h}$`, `$E_p = ${s3(E)} "J"$`] }; };
GEN.gpe2 = () => { const m = rnd(1, 90, 1), h = rnd(2, 40, 0.5), E = m * G9 * h;
  return { q: `${an(m)} ${m} kg climber gains ${s3(E)} J of gravitational potential energy. g = 10 N/kg. How high did she climb?`, ans: h, unit: 'm', steps: ['$h = @frac{E_p}{mg}$', `$h = @frac{${s3(E)}}{${m} × 10}$`, `$h = ${s3(h)} "m"$`] }; };
GEN.epe1 = () => { const k = rnd(10, 400, 10), e = rnd(2, 30, 1), E = 0.5 * k * (e / 100) ** 2;
  return { q: `A spring with spring constant ${k} N/m is stretched by ${e} cm. Calculate the elastic potential energy stored.`, ans: E, unit: 'J', steps: [`e = ${e} cm = ${e / 100} m`, '$E_e = @frac{1}{2}ke^2$', `$E_e = 0.5 × ${k} × ${e / 100}^2 = ${s3(E)} "J"$`] }; };
GEN.fall1 = () => { const h = rnd(1, 45, 0.5), v = Math.sqrt(2 * G9 * h);
  return { q: `An object is dropped from rest from a height of ${h} m. Ignoring air resistance, calculate its speed just before it hits the ground. g = 10 N/kg.`, ans: v, unit: 'm/s', steps: ['Energy lost from gravitational store = energy gained by kinetic store: $mgh = @frac{1}{2}mv^2$', `Mass cancels: $v^2 = 2gh = 2 × 10 × ${h} = ${s3(2 * G9 * h)}$`, `$v = ${s3(v)} "m/s"$`] }; };

/* ---------- 1.2 SHC and power ---------- */
const MATS = [['water', 4200], ['aluminium', 900], ['copper', 385], ['iron', 450], ['concrete', 880], ['oil', 2000]];
GEN.shc1 = () => { const [n, c] = pk(MATS), m = rnd(0.2, 5, 0.1), dT = rnd(5, 60, 1), E = m * c * dT;
  return { q: `Calculate the energy needed to raise the temperature of ${m} kg of ${n} by ${dT} °C. Specific heat capacity of ${n} = ${c} J/kg °C.`, ans: E, unit: 'J', steps: ['$ΔE = mcΔθ$', `$ΔE = ${m} × ${c} × ${dT}$`, `$ΔE = ${s3(E)} "J"$`] }; };
GEN.shc2 = () => { const [n, c] = pk(MATS), m = rnd(0.5, 3, 0.5), dT = rnd(8, 40, 1), E = m * c * dT;
  return { q: `${an(m)} ${m} kg block is supplied with ${s3(E)} J and its temperature rises by ${dT} °C. Calculate the specific heat capacity of the material.`, ans: c, unit: 'J/kg °C', steps: ['$c = @frac{ΔE}{mΔθ}$', `$c = @frac{${s3(E)}}{${m} × ${dT}}$`, `$c = ${s3(c)} "J/kg °C"$ (${n})`] }; };
GEN.shc3 = () => { const m = rnd(0.5, 2, 0.1), P = pk([1000, 1500, 2000, 2400, 3000]), T0 = rnd(10, 25, 1), dT = 100 - T0, E = m * 4200 * dT, t = E / P;
  return { q: `${an(P)} ${P} W kettle heats ${m} kg of water from ${T0} °C to 100 °C. Assuming all the energy heats the water, calculate the time taken. c(water) = 4200 J/kg °C.`, ans: t, unit: 's', steps: [`$ΔE = mcΔθ = ${m} × 4200 × ${dT} = ${s3(E)} "J"$`, '$t = @frac{E}{P}$', `$t = @frac{${s3(E)}}{${P}} = ${s3(t)} "s"$`] }; };
GEN.power1 = () => { const E = rnd(500, 90000, 500), t = rnd(5, 300, 5), P = E / t;
  return { q: `A device transfers ${E} J of energy in ${t} s. Calculate its power.`, ans: P, unit: 'W', steps: ['$P = @frac{E}{t}$', `$P = @frac{${E}}{${t}}$`, `$P = ${s3(P)} "W"$`] }; };
GEN.power2 = () => { const P = pk([60, 100, 500, 1200, 2000, 3000]), mins = rnd(1, 30, 1), E = P * mins * 60;
  return { q: `${an(P)} ${P} W appliance is switched on for ${mins} minute${mins > 1 ? 's' : ''}. Calculate the energy transferred.`, ans: E, unit: 'J', steps: [`t = ${mins} × 60 = ${mins * 60} s`, '$E = Pt$', `$E = ${P} × ${mins * 60} = ${s3(E)} "J"$`] }; };
GEN.power3 = () => { const m = rnd(20, 200, 10), h = rnd(2, 30, 1), t = rnd(4, 40, 1), W = m * G9 * h, P = W / t;
  return { q: `A motor lifts ${an(m).toLowerCase()} ${m} kg load through ${h} m in ${t} s. g = 10 N/kg. Calculate the useful power output.`, ans: P, unit: 'W', steps: [`Work done = gain in $E_p = mgh = ${m} × 10 × ${h} = ${s3(W)} "J"$`, '$P = @frac{W}{t}$', `$P = @frac{${s3(W)}}{${t}} = ${s3(P)} "W"$`] }; };

/* ---------- 1.3 Efficiency ---------- */
GEN.eff1 = () => { const inp = rnd(200, 5000, 50), e = rnd(0.15, 0.9, 0.05), out = inp * e;
  return { q: `A machine is supplied with ${inp} J and transfers ${s3(out)} J usefully. Calculate its efficiency as a percentage.`, ans: e * 100, unit: '%', steps: ['efficiency = useful output ÷ total input', `= ${s3(out)} ÷ ${inp} = ${s2(e)}`, `= ${s3(e * 100)} %`] }; };
GEN.eff2 = () => { const P = rnd(20, 3000, 10), e = rnd(0.1, 0.95, 0.05), u = P * e;
  return { q: `A device has an input power of ${P} W and an efficiency of ${Math.round(e * 100)}%. Calculate its useful power output.`, ans: u, unit: 'W', steps: ['useful power output = efficiency × total power input', `= ${e.toFixed(2)} × ${P}`, `= ${s3(u)} W`] }; };
GEN.eff3 = () => { const u = rnd(5, 900, 5), e = rnd(0.2, 0.9, 0.05), P = u / e;
  return { q: `A motor produces a useful power output of ${u} W with an efficiency of ${e.toFixed(2)}. Calculate the total power input.`, ans: P, unit: 'W', steps: ['total power input = useful power output ÷ efficiency', `= ${u} ÷ ${e.toFixed(2)}`, `= ${s3(P)} W`] }; };
GEN.eff4 = () => { const inp = rnd(1000, 20000, 500), e = rnd(0.2, 0.85, 0.05), w = inp * (1 - e);
  return { q: `An engine is ${Math.round(e * 100)}% efficient. It is supplied with ${inp} J. How much energy is wasted?`, ans: w, unit: 'J', steps: [`useful output = ${e.toFixed(2)} × ${inp} = ${s3(inp * e)} J`, 'wasted = total input − useful output', `= ${inp} − ${s3(inp * e)} = ${s3(w)} J`] }; };

/* ---------- 2.1 Q = It, V = IR ---------- */
GEN.qit1 = () => { const I = rnd(0.1, 5, 0.1), mins = rnd(1, 20, 1), Q = I * mins * 60;
  return { q: `A current of ${I} A flows for ${mins} minute${mins > 1 ? 's' : ''}. Calculate the charge that flows.`, ans: Q, unit: 'C', steps: [`t = ${mins * 60} s`, '$Q = It$', `$Q = ${I} × ${mins * 60} = ${s3(Q)} "C"$`] }; };
GEN.qit2 = () => { const Q = rnd(10, 600, 10), t = rnd(5, 120, 5), I = Q / t;

  return { q: `A ray of light enters a block of ${nm} from air at an angle of incidence of ${i}°. The angle of refraction is ${r}°. Calculate the refractive index.`, ans: n, unit: '', steps: ['$n = @frac{sin i}{sin r}$', `$n = @frac{sin ${i}°}{sin ${r}°} = @frac{${sind(i).toFixed(3)}}{${sind(r).toFixed(3)}}$`, `$n = ${s3(n)}$`] }; };

/* ---- mount ---- */
function mountSim(host, key) {
  const def = SIMS[key]; if (!def) { host.innerHTML = '<div class="empty">Simulation unavailable.</div>'; return () => { }; }
  refreshSimTheme();
  const st = { t: 0, run: def.autoplay !== false, p: {}, key };
  (def.controls || []).forEach(c => { if (c.id) st.p[c.id] = c.value; });
  const ctl = (def.controls || []).map(c => {
    if (c.type === 'seg') return `<div class="ctl"><label>${c.label}</label><div class="seg" data-id="${c.id}">${c.options.map(o => `<button type="button" data-v="${esc(o[0])}" class="${o[0] == c.value ? 'on' : ''}">${o[1]}</button>`).join('')}</div></div>`;
    if (c.type === 'button') return `<button type="button" class="btn sm" data-act="${c.act}">${c.label}</button>`;
    return `<div class="ctl"><label for="sc-${key}-${c.id}">${sqrtify(c.label)}<output>${c.fmt ? c.fmt(c.value) : c.value}</output></label><input id="sc-${key}-${c.id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" data-id="${c.id}"></div>`;
  }).join('');
  const btnRow = (def.controls || []).filter(c => c.type === 'button').length;
  host.innerHTML = `<div class="sim"><div class="sim-stage" style="height:${(def.hNarrow && innerWidth < 600 ? def.hNarrow : def.h) || 440}px"><canvas aria-label="${esc(def.title)} simulation"></canvas></div>
    <div class="sim-ctl"><div class="row" style="justify-content:space-between"><div class="sim-title">${def.title}</div>
    <div class="row" style="gap:6px">${def.noPlay ? '' : `<button type="button" class="icon-btn" data-act="__play" title="Play / pause" aria-label="Play or pause">${st.run ? ICON.pause : ICON.play}</button>`}<button type="button" class="icon-btn" data-act="__reset" title="Reset" aria-label="Reset">${ICON.reset}</button></div></div>
    ${ctl.replace(/<button type="button" class="btn sm"[\s\S]*?<\/button>/g, '')}
    ${btnRow ? `<div class="row" style="gap:8px">${(def.controls || []).filter(c => c.type === 'button').map(c => `<button type="button" class="btn sm" data-act="${c.act}">${c.label}</button>`).join('')}</div>` : ''}
    <div class="readouts">${(def.readouts || []).map((r, i) => `<div class="ro"><span>${sqrtify(r)}</span><b data-ro="${i}">—</b></div>`).join('')}</div>
    ${def.note ? `<div class="sim-note">${rich(def.note)}</div>` : ''}</div></div>`;
  const cv = $('canvas', host), stage = $('.sim-stage', host), c = cv.getContext('2d');
  let W = 0, H = 0;
  const size = () => { const r = stage.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); st.W = W; st.H = H; def.resize && def.resize(st); };
  const ro = new ResizeObserver(size); ro.observe(stage); size();
  const setFill = inp => inp.style.setProperty('--p', ((inp.value - inp.min) / (inp.max - inp.min) * 100) + '%');
  $$('input[type=range]', host).forEach(inp => { setFill(inp); inp.addEventListener('input', () => { const id = inp.dataset.id, cdef = def.controls.find(x => x.id === id); st.p[id] = +inp.value; inp.previousElementSibling.querySelector('output').innerHTML = cdef.fmt ? cdef.fmt(+inp.value) : inp.value; setFill(inp); def.change && def.change(st, id); }); });
  $$('.seg', host).forEach(sg => sg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$('button', sg).forEach(x => x.classList.toggle('on', x === b)); const v = b.dataset.v; st.p[sg.dataset.id] = isNaN(+v) ? v : +v; def.change && def.change(st, sg.dataset.id); }));
  host.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === '__play') { st.run = !st.run; b.innerHTML = st.run ? ICON.pause : ICON.play; }
    else if (a === '__reset') { st.t = 0; def.init && def.init(st); }
    else def.action && def.action(st, a);
    sfx.tick();
  });
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  if (def.pointer) {
    let down = false;
    cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); def.pointer('down', ...pos(e), st); });
    cv.addEventListener('pointermove', e => def.pointer(down ? 'drag' : 'move', ...pos(e), st));
    cv.addEventListener('pointerup', e => { down = false; def.pointer('up', ...pos(e), st); });
    cv.addEventListener('pointerleave', e => def.pointer('leave', ...pos(e), st));
  }
  def.init && def.init(st);
  const ros = $$('[data-ro]', host);
  let raf, last = performance.now(), frame = 0, alive = true;
  const loop = now => {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (st.run && def.step) { const sub = def.substeps || 1; for (let i = 0; i < sub; i++) def.step(st, dt / sub); st.t += dt; }
    c.clearRect(0, 0, W, H); c.fillStyle = simTheme.bg; c.fillRect(0, 0, W, H);
    def.draw(c, W, H, st, simTheme);
    if (def.read && frame++ % 6 === 0) def.read(st).forEach((v, i) => ros[i] && (ros[i].innerHTML = v));
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}

/* ---- shared constants & canvas circuit symbols (GCSE sims) ---- */
const deg = Math.PI / 180, g = 10;
const CS = {
  /* Components are drawn centred on a wire. Draw the wires (and moving charges) inside CS.gaps(): it clips out each
     component's span so the wire ends exactly at the component's terminals — no gaps, no wire through the symbol. */
  HALF: { cell: 5, resistor: 18, lamp: 12, meter: 14, diode: 9, switch: 14 },
  gaps(c, W, H, comps, fn) { c.save(); c.beginPath(); c.rect(-10, -10, W + 20, H + 20); comps.forEach(([x, y, half, vert]) => vert ? c.rect(x - 6, y - half, 12, 2 * half) : c.rect(x - half, y - 6, 2 * half, 12)); c.clip('evenodd'); fn(); c.restore(); },
  wire(c, pts, col, w = 2) { c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); },
  junction(c, x, y, col) { CV.circle(c, x, y, 3.4, col); },
  cell(c, x, y, col, vert, flip) { c.save(); c.translate(x, y); if (vert) c.rotate(Math.PI / 2); if (flip) c.rotate(Math.PI); c.strokeStyle = col; c.lineCap = 'butt'; c.lineWidth = 2; c.beginPath(); c.moveTo(-5, -14); c.lineTo(-5, 14); c.stroke(); c.lineWidth = 5; c.beginPath(); c.moveTo(5, -8); c.lineTo(5, 8); c.stroke(); c.restore(); },
  resistor(c, x, y, col, bg, vert, variable) { c.save(); c.translate(x, y); if (vert) c.rotate(Math.PI / 2); CV.rrect(c, -18, -8, 36, 16, 2, bg, col, 2); if (variable) CV.arrow(c, -16, 16, 18, -16, col, 1.5, 6); c.restore(); },
  lamp(c, x, y, col, bg, glow = 0) { if (glow > 0.02) { const gr = c.createRadialGradient(x, y, 2, x, y, 12 + 30 * glow); gr.addColorStop(0, `rgba(255,220,120,${0.9 * glow})`); gr.addColorStop(1, 'rgba(255,200,80,0)'); c.fillStyle = gr; c.beginPath(); c.arc(x, y, 12 + 30 * glow, 0, 7); c.fill(); } CV.circle(c, x, y, 12, glow > 0.02 ? `rgba(255,226,140,${0.3 + 0.7 * glow})` : bg, col, 2); CV.line(c, x - 8.5, y - 8.5, x + 8.5, y + 8.5, col, 1.6); CV.line(c, x + 8.5, y - 8.5, x - 8.5, y + 8.5, col, 1.6); },
  meter(c, x, y, letter, col, bg) { CV.circle(c, x, y, 14, bg, col, 2); CV.text(c, letter, x, y + 1, col, 14, 'center', 700); },
  diode(c, x, y, col, bg, vert, flip) { c.save(); c.translate(x, y); if (vert) c.rotate(Math.PI / 2); if (flip) c.rotate(Math.PI); c.fillStyle = bg; c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(-9, -10); c.lineTo(-9, 10); c.lineTo(9, 0); c.closePath(); c.fill(); c.stroke(); CV.line(c, 9, -10, 9, 10, col, 2.4); c.restore(); },
  /* a reading on an opaque label, so wires never hide it; align 'left' | 'right' | 'center' */
  tag(c, C, text, x, y, align = 'center', col) { c.font = '500 11.5px IBM Plex Mono, ui-monospace, monospace'; const w = c.measureText(text).width + 12, x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2; CV.rrect(c, x0, y - 10, w, 20, 5, C.surface, hexA(col || C.accent, .7), 1); CV.mono(c, text, x0 + w / 2, y, col ? col : C.ink, 11.5, 'center'); },
  /* voltmeter in parallel with a component centred at (x, y) on a horizontal wire (half = its half-length).
     The leads join the main wire a little beyond each end of the component, then run out to a meter at distance d
     (d > 0 below, d < 0 above). Returns the meter centre. Call AFTER the main wires, BEFORE the tag. */
  voltmeter(c, C, x, y, half, d, col) { const gap = half + 16, my = y + d; CS.wire(c, [[x - gap, y], [x - gap, my], [x - 14, my]], col); CS.wire(c, [[x + gap, y], [x + gap, my], [x + 14, my]], col); CS.junction(c, x - gap, y, col); CS.junction(c, x + gap, y, col); CS.meter(c, x, my, 'V', col, C.surface); return [x, my]; },
  dots(c, path, t, speed, col, n = 20, open = false) { // moving charge along a closed polyline (conventional current direction); draw inside CS.gaps
    const segs = []; let L = 0; for (let i = 0; i < path.length - (open ? 1 : 0); i++) { const a = path[i], b = path[(i + 1) % path.length], l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push([a, b, l, L]); L += l; }

  }
};

SIMS.energy = {

  controls: [

    { id: 'a0', label: 'Release angle', min: 5, max: 80, step: 1, value: 50, fmt: v => v + '°' },
    { id: 'm', label: 'Mass', min: 0.1, max: 2, step: 0.1, value: 0.5, fmt: v => v.toFixed(1) + ' kg' },
    { id: 'b', label: 'Air resistance', min: 0, max: 0.6, step: 0.02, value: 0.05, fmt: v => v === 0 ? 'none' : v.toFixed(2) }
  ],
  readouts: ['Speed', 'Height above lowest point', 'Kinetic energy Eₖ = ½mv²', 'Gravitational PE Eₚ = mgh'],
  note: 'Energy moves between the kinetic and gravitational potential stores. Air resistance dissipates energy to the thermal store of the surroundings, so the total of Eₖ + Eₚ falls — but no energy is destroyed.',
  init(st) { st.th = st.p.a0 * deg; st.w = 0; st.lost = 0; },
  change(st, id) { if (id !== 'b') this.init(st); },
  step(st, dt) { const p = st.p; const E0 = .5 * p.m * (p.L * st.w) ** 2 + p.m * g * p.L * (1 - Math.cos(st.th)); st.w += (-g / p.L * Math.sin(st.th) - p.b * st.w) * dt; st.th += st.w * dt; const E1 = .5 * p.m * (p.L * st.w) ** 2 + p.m * g * p.L * (1 - Math.cos(st.th)); st.lost += Math.max(0, E0 - E1); },
  draw(c, W, H, st, C) {
    CV.grid(c, W, H, C); const p = st.p, px = Math.min(W * 0.33, (W - 4 * 60) / 2), py = 40, sc = (H - 120) / 3.2, Lp = p.L * sc;
    const bx = px + Lp * Math.sin(st.th), by = py + Lp * Math.cos(st.th);
    CV.line(c, px - 60, py, px + 60, py, C.ink, 3); CV.line(c, px - 110, py + Lp, px + 110, py + Lp, C.muted, 1, [4, 4]); CV.mono(c, 'h = 0', px + 114, py + Lp, C.muted, 10);
    c.strokeStyle = hexA(C.muted, .5); c.setLineDash([3, 4]); c.beginPath(); c.arc(px, py, Lp, Math.PI / 2 - p.a0 * deg, Math.PI / 2 + p.a0 * deg); c.stroke(); c.setLineDash([]);

function mountGame(host, id) {
  let alive = true, timer = null; const stop = () => { alive = false; clearInterval(timer); };
  const hud = (items) => `<div class="game-hud">${items.map(([k, v]) => `<div class="hud"><span>${k}</span><b>${v}</b></div>`).join('')}<span class="spacer"></span><a class="btn sm" href="#/arcade">${ICON.back} Arcade</a></div>`;
  const endScreen = (score, extra = '') => { const nb = gameBest(id, score); if (score > 0) addXP(Math.min(60, Math.round(score / 2)), GAMES[id].title); if (nb && score > 0) { burst(); sfx.win(); }
    host.innerHTML = `<div class="game"><div class="card result"><div class="eyebrow">${GAMES[id].title}</div><div class="big">${score}</div><p class="lede" style="margin:8px auto">${nb ? 'New personal best!' : 'Personal best: ' + S.games[id].best}</p>${extra}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-again>Play again</button><a class="btn" href="#/arcade">Back to arcade</a></div></div></div>`;
    $('[data-again]', host).onclick = () => { stop(); cleanup = mountGame(host, id); }; };
  let cleanup = stop;

  if (id === 'sprint' || id === 'rush' || id === 'symbols') {
    const bank = id === 'sprint' ? UNIT_BANK : id === 'symbols' ? SYMBOL_BANK : EQ_BANK.filter(e => inScope(e[2])), total = id === 'rush' ? 75 : 60;
    let score = 0, streak = 0, left = total, cur = null, answered = 0, right = 0;
    const next = () => { const item = pick(bank); const others = shuffle(bank.filter(b => b[1] !== item[1] && b[0] !== item[0])).slice(0, 3); cur = { item, opts: shuffle([item, ...others]) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Streak', streak], ['Time', Math.ceil(left) + 's']])}<div class="timer"><i style="width:${left / total * 100}%"></i></div>
        <div class="eyebrow" style="text-align:center">${id === 'sprint' ? 'What is the unit of' : id === 'symbols' ? 'Name this circuit symbol' : 'Which equation gives'}</div><div class="big-prompt${id === 'symbols' ? ' game-sym' : ''}">${id === 'rush' ? cur.item[0] + (cur.item[2] ? ' ' + tagHTML(cur.item[2], 1) : '') : cur.item[0]}</div>
        <div class="opts">${cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${id === 'rush' ? M(o[1]) : o[1]}</span></button>`).join('')}</div><p class="kbd-hint">Keys 1–4 to answer.</p></div>`;
      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => { if (!alive) return; answered++; const ok = cur.opts[i] === cur.item; const btn = $$('.opt', host)[i]; if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btn.classList.add('right'); } else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btn.classList.add('wrong'); $$('.opt', host)[cur.opts.indexOf(cur.item)].classList.add('right'); } setTimeout(() => alive && left > 0 && next(), ok ? 250 : 900); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= 4 && !$('.opt.right', host)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();
    return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'magnitude') {
    const qs = shuffle(MAGNITUDES).slice(0, 10); let i = 0, score = 0;
    const render = () => { const q = qs[i];
      host.innerHTML = `<div class="game">${hud([['Round', (i + 1) + '/10'], ['Score', score]])}<div class="eyebrow" style="text-align:center">Estimate the order of magnitude</div><div class="big-prompt">${q[0]}</div>
        <div class="card" style="text-align:center"><div style="font:800 56px var(--f-display)"><span class="m">10<sup id="mg-out">0</sup></span> <span class="muted" style="font-size:22px">${q[2]}</span></div>
        <input id="mg-in" type="range" min="-32" max="32" step="1" value="0" style="margin:14px 0" aria-label="Power of ten"><div class="row" style="justify-content:center"><button class="btn primary" id="mg-go">Lock in</button></div><div id="mg-fb"></div></div></div>`;
      const inp = $('#mg-in', host); const upd = () => { $('#mg-out', host).textContent = (+inp.value).toString().replace('-', '−'); inp.style.setProperty('--p', ((+inp.value + 32) / 64 * 100) + '%'); }; inp.oninput = upd; upd();
      $('#mg-go', host).onclick = () => { const L = Math.log10(q[1]), g0 = +inp.value, d = Math.min(Math.abs(g0 - Math.floor(L)), Math.abs(g0 - Math.round(L))), pts = d === 0 ? 10 : d === 1 ? 6 : d === 2 ? 2 : 0; score += pts; (pts >= 6 ? sfx.good : sfx.bad)();
        $('#mg-fb', host).innerHTML = `<div class="explain" style="margin-top:14px"><b class="v ${pts >= 6 ? 'good' : 'bad'}">${pts ? '+' + pts : 'Off by ' + d}</b> Actual value: <span class="m">${sf(q[1], 3)}</span> ${q[2]} — order of magnitude <span class="m">10<sup>${String(Math.round(L)).replace('-', '−')}</sup></span></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="mg-next">${i < 9 ? 'Next' : 'Finish'}</button></div>`;
        $('#mg-go', host).disabled = true; $('#mg-next', host).onclick = () => { i++; i < 10 ? render() : endScreen(score, '<p class="muted">10 points for an exact power of ten, 6 for one out, 2 for two out.</p>'); }; };
    };
    render(); return stop;
  }

  if (id === 'blitz') {
    const pool = allTopics().flatMap(t => V_(t).quiz.map(q => ({ q, t }))); let score = 0, lives = 3, cur;
    const next = () => { const { q, t } = pick(pool); const truth = Math.random() < 0.5; const opt = truth ? q.o[0] : pick(q.o.slice(1)); cur = { q, t, truth, opt }; render(); };
    const render = () => { host.innerHTML = `<div class="game">${hud([['Score', score], ['Lives', '♥'.repeat(lives) || '0']])}<div class="card"><div class="eyebrow">${cur.t.id} · ${esc(cur.t.title)}</div><p class="q-text">${rich(cur.q.q)}</p><div class="box def" style="font-size:17px"><b class="lbl">Proposed answer</b><p>${rich(cur.opt)}</p></div>
      <div class="row" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn primary" data-a="1" style="min-width:130px">True <kbd>T</kbd></button><button class="btn" data-a="0" style="min-width:130px">False <kbd>F</kbd></button></div><div id="bz-fb"></div></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => answer(b.dataset.a === '1')); };
    const answer = a => { if ($('#bz-fb', host).innerHTML) return; const ok = a === cur.truth; ok ? (score += 10, sfx.good()) : (lives--, sfx.bad());
      $('#bz-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</b> ${cur.truth ? 'That answer is right.' : 'The correct answer is: ' + rich(cur.q.o[0])} ${cur.q.x ? '<br><span class="muted">' + rich(cur.q.x) + '</span>' : ''}</div>`;
      setTimeout(() => { if (!alive) return; lives > 0 ? next() : endScreen(score); }, ok ? 900 : 2600); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 't' || e.key === 'T') answer(true); if (e.key === 'f' || e.key === 'F') answer(false); };
    addEventListener('keydown', key); next(); return () => { stop(); removeEventListener('keydown', key); };
  }
  return stop;
}

/* scope helpers: the course is untiered. Statements with a ‘P’ reference (e.g. 1.25P) are Physics only

const specFlag = sp => (/^\d+\.\d+P\b/.test(sp) || /\(PO\)/.test(sp)) ? 'po' : '';
const specTxt = sp => sp.replace(/\((HT|PO)\)\s*/g, '');
const tagHTML = (f, small) => (f && f.includes('po') ? `<span class="tag po${small ? ' sm' : ''}" title="Bold ‘P’ statement: International GCSE Physics only, examined on Paper 2">P · Physics only</span>` : '');
const flagOf = o => (o.po ? 'po' : '');
const vis = t => inScope(t);
const V_ = t => ({ quiz: t.quiz.filter(inScope), cards: t.cards.filter(c => inScope(c[2] || '')), exam: t.exam.filter(inScope), worked: t.worked.filter(inScope), gens: t.gens.filter(g => inScope(GEN_FLAGS[g] || '')), spec: t.spec.map((sp, i) => [sp, i]).filter(([sp]) => inScope(specFlag(sp))) });
const allTopics = () => TOPICS.filter(vis);
const coreTopics = () => TOPICS.filter(t => t.unit !== 'S' && vis(t));

function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, v = V_(t);
  const ck = t.cards.length ? Object.entries(s.cards).filter(([i, b]) => b >= 3 && inScope(t.cards[i]?.[2] || '')).length / Math.max(1, v.cards.length) : 0;
  const sp = v.spec.reduce((a, [, i]) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / Math.max(1, v.spec.length);
  const calc = v.gens.length ? Math.min(s.calc || 0, 5) / 5 : q;
  return clamp(0.4 * q + 0.2 * ck + 0.2 * sp + 0.2 * calc, 0, 1);
}
const pct = x => Math.round(x * 100) + '%';
const unitMastery = uid => { const ts = unitTopics(uid); return ts.length ? ts.reduce((a, t) => a + mastery(t), 0) / ts.length : 0; };

  /* The home “sky”: one star per topic, arranged as a constellation per topic group.

        <div class="fc-ctl">${flipped ? `<button class="btn" data-r="0" style="border-color:var(--bad);color:var(--bad)">Again <kbd>1</kbd></button><button class="btn" data-r="1">Hard <kbd>2</kbd></button><button class="btn" data-r="2" style="border-color:var(--good);color:var(--good)">Good <kbd>3</kbd></button><button class="btn" data-r="3">Easy <kbd>4</kbd></button>` : `<button class="btn primary" id="flip">Show answer <kbd>Space</kbd></button>`}</div>

    addEventListener('keydown', key); cleanup = () => removeEventListener('keydown', key);

  /* ---------- Quiz engine (also used by mock exam & daily challenge) ---------- */
  function runQuiz(host, items, o = {}) {
    const exam = o.mode === 'exam';
    const qs = items.map(it => it.type === 'num' ? it : { ...it, type: 'mcq', order: shuffle(it.o.map((_, i) => i)) });
    let i = 0, res = [], t0 = Date.now(), tick = null;
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${q.topic}</a>` : ''}${o.timeLimit ? '<span class="pill warn mono" id="qtimer"></span>' : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : exam ? 'cur' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.type === 'num' ? q.q : q.q)}</div>
        ${q.type === 'mcq' ? `<div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p>`
          : `<div class="calc-in"><input id="numin" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5e-3" aria-label="Your answer"><span class="unit">${q.unit || ''}</span><button class="btn primary" id="numgo">Submit</button></div><p class="kbd-hint">Give 2–3 significant figures. Use e for powers of ten, e.g. 6.6e-34.</p>`}
        <div id="fb"></div>`;
      if (q.type === 'mcq') $$('.opt', host).forEach(b => b.onclick = () => answer(+b.dataset.k));
      else { const inp = $('#numin'); inp.focus(); $('#numgo').onclick = () => answer(inp.value); inp.onkeydown = e => { if (e.key === 'Enter') answer(inp.value); }; }
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i) return;
      let ok, given;
      if (q.type === 'mcq') { ok = q.order[k] === 0; given = k; } else { const v = parseNum(k); if (!isFinite(v)) { toast('Enter a number, e.g. 3.2e-5'); return; } ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * (q.tol || 0.02) + 1e-12; given = v; }
      res.push({ ok, given, q }); (ok ? sfx.good : sfx.bad)();
      if (exam) { i++; render(); return; }
      if (q.type === 'mcq') { $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); }); }
      else { $('#numin').disabled = true; $('#numgo').disabled = true; }
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${q.type === 'num' ? `Answer: <b>${fmtAns(q.ans)}</b> ${q.unit}<div class="steps"><b class="small">Solution</b><ol>${q.steps.map(x => `<li>${rich(x)}</li>`).join('')}</ol></div>` : rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      clearInterval(tick); removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100), secs = Math.round((Date.now() - t0) / 1000);
      if (p === 100) { burst(); sfx.win(); }
      const byTopic = {}; res.forEach(r => { const k = r.q.topic || '—'; byTopic[k] ??= [0, 0]; byTopic[k][1]++; if (r.ok) byTopic[k][0]++; });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete · ${Math.floor(secs / 60)}m ${secs % 60}s</div><div class="big">${p}%</div><p class="lede" style="margin:6px auto 0">${correct} of ${qs.length} correct${p >= 80 ? ' — excellent.' : p >= 50 ? ' — good progress.' : ' — revisit the notes and try again.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>
        ${Object.keys(byTopic).length > 1 ? `<div class="sec"><div class="eyebrow">By topic</div><div class="grid gauto" style="margin-top:10px">${Object.entries(byTopic).map(([k, [a, b]]) => `<a class="tcard" href="#/t/${k}" style="--uc:${TOPIC[k] ? ucol(TOPIC[k].unit) : 'var(--accent)'}"><span class="no" style="font-size:22px">${k}</span><span class="tt">${TOPIC[k] ? esc(TOPIC[k].title) : ''}</span><span class="ts">${a}/${b} correct</span></a>`).join('')}</div></div>` : ''}
        <div class="sec"><div class="eyebrow">Review</div>${res.map((r, j) => `<div class="explain" style="margin-top:10px"><b class="v ${r.ok ? 'good' : 'bad'}">${j + 1}. ${r.ok ? '✓' : '✗'}</b> ${rich(r.q.q)}<div class="small" style="margin-top:6px">${r.q.type === 'mcq' ? `<b>Answer:</b> ${rich(r.q.o[0])}${r.ok ? '' : ` · <span style="color:var(--bad)">you chose: ${rich(r.q.o[r.q.order[r.given]])}</span>`}${r.q.x ? `<br><span class="muted">${rich(r.q.x)}</span>` : ''}` : `<b>Answer:</b> ${fmtAns(r.q.ans)} ${r.q.unit} · you gave ${r.given == null ? '—' : fmtAns(r.given)}`}</div></div>`).join('')}</div>`;
      $('#retry').onclick = () => { o.retry ? o.retry() : runQuiz(host, items, o); };
      S.stats.quizzes++; if (p === 100) S.stats.perfect++; save();
      o.onDone && o.onDone({ correct, total: qs.length, p, res });
      checkBadges();
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const q = qs[i]; if (!q) return;
      if (res.length > i && e.key === 'Enter') { $('#nextq')?.click(); return; }
      if (q.type === 'mcq' && res.length <= i) { const k = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (k != null && k < q.o.length) answer(k); } };
    addEventListener('keydown', key);
    if (o.timeLimit) { const end = Date.now() + o.timeLimit * 1000; tick = setInterval(() => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = $('#qtimer'); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (!document.body.contains(host)) clearInterval(tick); if (left <= 0) { while (res.length < qs.length) res.push({ ok: false, given: null, q: qs[res.length] }); i = qs.length; finish(); } }, 500); }
    const prevCleanup = cleanup; cleanup = () => { clearInterval(tick); removeEventListener('keydown', key); prevCleanup && prevCleanup(); };
    render();
  }

  function quizTab(host, t) {

  function calcTab(host, t) {

      const q = GEN[pick(V_(t).gens)]();

  /* ---------- Structured exam questions (shared by topic tab, bank and papers) ---------- */

  const qMarks = q => q.parts ? q.parts.reduce((a, p) => a + p.m, 0) : q.m;
  const qTag = q => q.tag || (qParts(q).some(p => p.m >= 5) ? 'ext' : '');
  const qParts = q => q.parts || [{ q: '', m: q.m, ms: q.ms }];

      ${ps.map((p, j) => `<div class="xq-part" data-m="${p.m}"><div><span class="pl">${multi ? '(' + 'abcdefgh'[j] + ')' : ''}</span>${rich(multi ? p.q : q.q)} <b class="mono">[${p.m}]</b></div><textarea rows="${p.m >= 5 ? 6 : p.m >= 3 ? 3 : 2}" aria-label="Your answer"></textarea>
        <div class="ms" hidden><div class="eyebrow" style="margin-bottom:4px">Mark scheme — tick the points you made</div>${p.ms.map(x => `<label><input type="checkbox"> <span>${rich(x)}</span></label>`).join('')}${p.m >= 5 ? '<p class="small muted" style="margin:6px 0 0">Extended responses: examiners also reward a logically structured answer that links the points together.</p>' : ''}</div></div>`).join('')}
      ${o.noFoot ? '' : `<div class="xq-foot"><button class="btn sm" data-reveal>Reveal mark scheme</button><button class="btn sm primary" data-save hidden>Save my marks</button><span class="small muted" data-score></span></div>`}</div>`;

  function wireXQ(host, list, onSave) {

  /* Build a paper from the structured questions: Paper 1 = no ‘P’ content, 110 marks; Paper 2 = all content, 70 marks
     (weighted towards ‘P’ content). Questions are grouped by topic, as on the real papers. */
  function paper(pn) {
    const target = pn === 1 ? 110 : 70, mins = pn === 1 ? 120 : 75, pool0 = bankAll().filter(q => pn === 1 ? !q.po : true);
    const pickTo = () => { const out = [], seen = new Set(); let m = 0; const pool = shuffle(pool0), pm = () => out.filter(x => x.po).reduce((a, x) => a + qMarks(x), 0);
      for (const pass of [0, 1]) for (const q of pool) { const qm = qMarks(q); if (out.includes(q) || m + qm > target || (!pass && seen.has(q.topic))) continue; if (pn === 2 && !pass && (q.po ? pm() + qm > target * .65 : pm() < target * .55 && m - pm() + qm > target * .45)) continue; out.push(q); seen.add(q.topic); m += qm; if (m === target) return out; } return out; };
    let qs = [], total = 0; for (let k = 0; k < 400 && total !== target; k++) { const o = pickTo(), tt = o.reduce((a, q) => a + qMarks(q), 0); if (Math.abs(tt - target) < Math.abs(total - target) || !qs.length) { qs = o; total = tt; } }
    qs.sort((a, b) => (a.topic > b.topic ? 1 : -1));
    const name = pn === 1 ? `Paper 1${S.settings.course === 'comb' ? 'P' : ''}` : 'Paper 2';
    crumbs(`<a href="#/mock" style="color:inherit">Mock exam</a> / <b>${name} practice</b>`);
    V().innerHTML = `<div style="max-width:880px"><div class="eyebrow">Pearson Edexcel International GCSE Physics · practice paper (not an official paper)</div><h1 class="display" style="font-size:clamp(30px,4.4vw,48px);margin:6px 0">${name}</h1>
      <div class="row"><span class="pill">${mins >= 120 ? '2 hours' : '1 hour 15 minutes'}</span><span class="pill">${total} marks</span><span class="pill warn mono" id="ptimer">${mins}:00</span><button class="btn sm" id="pstart">Start timer</button></div>
      <p class="small muted">Answer all questions. Show your working in calculations. Where necessary, assume g = 10 N/kg. The equations you must recall are not given; those on the <a href="#/equations">given list</a> may be used.</p>
      <div id="plist">${qs.map((q, i) => xqHTML(q, i, { showTopic: true, noFoot: true, num: 'Q' + (i + 1) })).join('')}</div>
      <div class="row" style="margin:24px 0"><button class="btn primary" id="pmark">Finish and show mark schemes</button></div><div id="pres"></div></div>`;
    let tick = null; $('#pstart').onclick = () => { if (tick) return; const end = Date.now() + mins * 60e3; tick = setInterval(() => { const el = $('#ptimer'); if (!el) { clearInterval(tick); return; } const l = Math.max(0, Math.round((end - Date.now()) / 1000)); el.textContent = `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}`; if (!l) { clearInterval(tick); toast('Time is up'); } }, 1000); };
    cleanup = () => clearInterval(tick);
    $('#pmark').onclick = () => { clearInterval(tick); $$('#plist .ms').forEach(m => m.hidden = false); $('#pmark').hidden = true;
      $('#pres').innerHTML = `<div class="card"><p>Tick the creditworthy points in each mark scheme, then save your score.</p><button class="btn primary" id="psave">Save my marks</button> <span id="pscore" class="mono"></span></div>`;
      $('#psave').onclick = () => { const got = $$('#plist .xq-part').reduce((a, p) => a + Math.min(+p.dataset.m, $$('input:checked', p).length), 0), p = Math.round(got / total * 100); $('#pscore').textContent = `${got} / ${total} (${p}%)`; $('#psave').disabled = true; S.stats.mocks++; S.stats.examMarks += got; S.mocks ??= []; S.mocks.push({ d: today(), u: name, p }); save(); addXP(got * 3, 'Practice paper'); checkBadges(); if (p >= 70) burst(); }; };
  }

      t.cards.filter(c => inScope(c[2] || '')).forEach(([q, a]) => index.push({ k: 'Card', t: q.replace(/<[^>]+>/g, ''), s: a.replace(/<[^>]+>/g, '').slice(0, 80), h: `#/t/${t.id}/cards`, x: (q + ' ' + a).toLowerCase() })); });
    PRACTICALS.filter(p => inScope(p.po ? 'po' : '')).forEach(p => index.push({ k: 'Practical', t: p.ref + ' ' + p.title, s: p.aim, h: '#/practicals', x: (p.title + ' ' + p.aim).toLowerCase() }));
    Object.entries(GAMES).forEach(([id, g]) => index.push({ k: 'Game', t: g.title, s: g.blurb, h: '#/game/' + id, x: (g.title + ' ' + g.blurb).toLowerCase() }));
    [['Equations (recall and given)', '#/equations'], ['Practicals', '#/practicals'], ['Exam question bank', '#/bank'], ['Settings: Physics or Double Award', '#/about'], ['Mock exam', '#/mock'], ['Progress', '#/progress'], ['Daily challenge', '#/daily']].forEach(([t, hh]) => index.push({ k: 'Page', t, s: '', h: hh, x: t.toLowerCase() }));
  }
  function openPalette() {
    if ($('.palette-back')) return; index || buildIndex();
    const back = h('div', { class: 'palette-back', role: 'dialog', 'aria-label': 'Search' }, `<div class="palette"><input id="pal" placeholder="Search topics, notes, equations, flashcards…" aria-label="Search" autocomplete="off"><ul id="palres"></ul></div>`);
    document.body.append(back); const inp = $('#pal'), ul = $('#palres'); let sel = 0, res = [];
    const close = () => back.remove();
    const show = () => { const q = inp.value.toLowerCase().trim(); const terms = q.split(/\s+/).filter(Boolean);
      res = q ? index.filter(it => terms.every(w => it.x.includes(w))).sort((a, b) => ({ Topic: 0, Page: 1, Equation: 2, Notes: 3, Practical: 4, Game: 5, Card: 6 }[a.k] - { Topic: 0, Page: 1, Equation: 2, Notes: 3, Practical: 4, Game: 5, Card: 6 }[b.k])).slice(0, 40) : index.filter(it => it.k === 'Topic' || it.k === 'Page').slice(0, 14);
      sel = 0; ul.innerHTML = res.length ? res.map((r, i) => `<li><a href="${r.h}" class="${i === sel ? 'sel' : ''}"><span class="kind">${r.k}</span><span><span class="t">${r.raw ? r.t : esc(r.t)}</span><br><span class="s">${esc(r.s)}</span></span><span class="muted">↵</span></a></li>`).join('') : '<li class="empty" style="margin:8px">No matches. Try a symbol like λ or a word like “capacitor”.</li>'; };
    inp.oninput = show; show(); inp.focus();
    back.onclick = e => { if (e.target === back) close(); if (e.target.closest('a')) close(); };
    inp.onkeydown = e => { const as = $$('a', ul); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = clamp(sel + (e.key === 'ArrowDown' ? 1 : -1), 0, as.length - 1); as.forEach((a, i) => a.classList.toggle('sel', i === sel)); as[sel]?.scrollIntoView({ block: 'nearest' }); } else if (e.key === 'Enter') { as[sel] && (location.hash = as[sel].getAttribute('href')); close(); } else if (e.key === 'Escape') close(); };
  }

  function init() {
    if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
    chrome(); touchStreak();
    addEventListener('hashchange', route);
    addEventListener('keydown', e => { if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !e.target.matches('input,textarea,select'))) { e.preventDefault(); openPalette(); } if (e.key === 'Escape') { $('.palette-back')?.remove(); toggleSide(false); } });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { refreshSimTheme(); refreshChrome(); });
    route();
  }
  return { init, route, refreshChrome };
})();
window.App = App;

</script>
