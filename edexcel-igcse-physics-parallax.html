<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parallax Physics</title>
<meta name="description" content="Parallax: an interactive study app for the Pearson Edexcel International GCSE in Physics (4PH1) — notes, simulations, the specification practicals, flashcards, quizzes, unlimited calculations, a deep exam-question bank and full Paper 1 and Paper 2 practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* ==========================================================
   Parallax · Pearson Edexcel International GCSE Physics (4PH1)
   Tokens: light = star-atlas paper, dark = observatory at night
   ========================================================== */
:root{
  --paper:#EEF0F6;
  --paper-2:#E3E6F0;
  --grid:#D6DAE7;
  --grid-2:#C5CADC;
  --surface:#FFFFFF;
  --surface-2:#F6F7FB;
  --ink:#151A33;
  --ink-2:#2C3352;
  --muted:#5E6582;
  --faint:#8C92AC;
  --line:#D6D9E6;
  --line-2:#BCC1D5;
  --accent:#0E8F8A;          /* O III emission line 501 nm */
  --accent-ink:#0A6663;
  --accent-soft:#D3F0EE;
  --good:#1F8A4C; --good-soft:#DDF3E5;
  --bad:#C4372F;  --bad-soft:#FBE2DF;
  --warn:#B7791F; --warn-soft:#FCEFD6;
  --info:#1C6FA8; --info-soft:#DCEBF6;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 4px 16px rgba(19,32,43,.06);
  --shadow-lg:0 12px 40px rgba(19,32,43,.16);
  --canvas-bg:#FBFCFD;
  --canvas-grid:#E4EAEE;
  --canvas-ink:#13202B;
  --u1:#E5484D; --u2:#E39B12; --u3:#3DAE5B; --u4:#0F9D8A; --u5:#2F7FE0; --u6:#16A3C6; --u7:#7B5BD6; --u8:#C0469A; --u9:#5B6C79;
  --uc:var(--accent);
  --r:10px; --r-lg:16px;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",Times,serif;
  --side:256px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#090C1C; --paper-2:#0D1126; --grid:#151A33; --grid-2:#1C2242;
    --surface:#10142B; --surface-2:#161B36; --ink:#E6E9F5; --ink-2:#C6CBE0;
    --muted:#8E94B3; --faint:#646A8A; --line:#20264A; --line-2:#2D3460;
    --accent:#3FD8CF; --accent-ink:#6FE6DF; --accent-soft:#0E2E33;
    --good:#4CC67A; --good-soft:#12301F; --bad:#FF6B61; --bad-soft:#3A1614;
    --warn:#F2B34C; --warn-soft:#352812; --info:#5AB0EA; --info-soft:#10283A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
    --shadow-lg:0 16px 50px rgba(0,0,0,.5);
    --canvas-bg:#0B0F22; --canvas-grid:#1A1F3A; --canvas-ink:#E6E9F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#090C1C; --paper-2:#0D1126; --grid:#151A33; --grid-2:#1C2242;
  --surface:#10142B; --surface-2:#161B36; --ink:#E6E9F5; --ink-2:#C6CBE0;
  --muted:#8E94B3; --faint:#646A8A; --line:#20264A; --line-2:#2D3460;
  --accent:#3FD8CF; --accent-ink:#6FE6DF; --accent-soft:#0E2E33;
  --good:#4CC67A; --good-soft:#12301F; --bad:#FF6B61; --bad-soft:#3A1614;
  --warn:#F2B34C; --warn-soft:#352812; --info:#5AB0EA; --info-soft:#10283A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
  --shadow-lg:0 16px 50px rgba(0,0,0,.5);
  --canvas-bg:#0B0F22; --canvas-grid:#1A1F3A; --canvas-ink:#E6E9F5;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
[hidden]{display:none!important}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:18px 14px 20px;
  scrollbar-width:thin;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#0A1017;position:relative;overflow:hidden;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand-mark i{position:absolute;top:5px;bottom:5px;width:2px;border-radius:1px;filter:drop-shadow(0 0 3px currentColor)}
.brand-name{font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand-sub{font:500 10.5px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a,.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;
  color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;text-align:left
}
.nav a:hover,.nav button:hover{background:var(--surface-2)}
.nav a.on{background:var(--paper-2);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .unit-a{align-items:flex-start}
.unit-line{width:3px;align-self:stretch;border-radius:2px;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.unit-a small{display:block;font:500 11px/1.3 var(--f-mono);color:var(--faint);letter-spacing:.03em}
.nav .meter{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--faint);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;gap:10px;padding:10px 28px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.crumbs{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.crumbs b{color:var(--ink);font-weight:600}
.search-btn{display:flex;align-items:center;gap:8px;min-width:220px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
.search-btn:hover{border-color:var(--line-2)}
.search-btn kbd{margin-left:auto}
kbd{font:500 11px var(--f-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{padding:28px 28px 80px;max-width:1240px;width:100%;margin:0 auto}
.view.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Mobile ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:60;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,10,15,.45);z-index:55}
  .top{padding:8px 16px}
  .search-btn{min-width:0;flex:none}
  .search-btn span,.search-btn kbd{display:none}
  .view{padding:18px 16px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10.5px var(--f-body);color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabbar a.on{color:var(--ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .hide-m{display:none!important}
}
@media (min-width:901px){.menu-btn{display:none!important}}

/* ---------- Type ---------- */
h1,h2,h3,h4{text-wrap:balance;margin:0}
.display{font:800 clamp(38px,6vw,68px)/.92 var(--f-display);letter-spacing:.005em;text-transform:uppercase}
.h2{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.h3{font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font:600 11.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;color:var(--ink-2);max-width:62ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.sec-head .h2,.sec-head .h3{flex:none}
.sec-head .muted{font-size:14px}

/* ---------- Math ---------- */
.m{font-family:var(--f-math);font-size:1.08em;white-space:nowrap;letter-spacing:.01em}
.m i{font-style:italic;padding-right:.04em}
.m .rm{font-style:normal}
.m sub,.m sup{font-size:.7em;line-height:0}
.m sub{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.15}
.fr>.nu{border-bottom:1px solid currentColor;padding:0 .15em}
.fr>.de{padding:0 .15em}
.sq{position:relative;display:inline-block;padding-left:.66em;white-space:nowrap}
.sq .rs{position:absolute;left:0;top:0;width:.66em;height:100%;overflow:visible;fill:none;stroke:currentColor}
.sq .rs path{stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}
.sq .ra{display:inline-block;border-top:1.3px solid currentColor;padding:.14em .1em 0 .06em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ov{text-decoration:overline}
.eqbig .m{font-size:1.4em}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1B1203}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--uc);border-radius:3px;transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--f-mono);letter-spacing:.02em;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--uc);box-shadow:0 0 6px var(--uc);flex:none}

/* ---------- Home ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#070B10;color:#E8EEF3;padding:30px 30px 26px;border:1px solid #1B2632;box-shadow:var(--shadow-lg)}
.hero canvas.spec{display:block;width:100%;height:120px;border-radius:10px;margin-top:22px;background:#020406}
.hero .display{color:#F3F6F8}
.hero .eyebrow{color:#8FA2B1}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:end}
.hero p{color:#B9C6D0;max-width:52ch;margin:12px 0 0}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px}
.hstat b{display:block;font:800 32px/1 var(--f-display);color:#fff;font-variant-numeric:tabular-nums}
.hstat span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#8FA2B1}
.spec-axis{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:#6D8091;margin-top:6px;letter-spacing:.05em}
.hero .btn{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff}
.hero .btn.accent{background:#FFB547;border-color:#FFB547;color:#1B1203}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding:22px 18px}}

.unit-card{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:18px 18px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.unit-card:hover{transform:translateY(-2px);border-color:var(--uc)}
.unit-card .line{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.unit-card .nm{font:500 11px var(--f-mono);color:var(--muted)}
.unit-card .h3{font-size:22px}

.topic-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--uc);transform:translateY(-1px)}
.tcard .no{grid-row:span 3;font:800 30px/1 var(--f-display);color:var(--uc);min-width:52px}
.tcard .tt{font-weight:600;font-size:15px;line-height:1.3}
.tcard .ts{font-size:12.5px;color:var(--muted);line-height:1.4}
.tcard .bar{margin-top:6px}

/* ---------- Topic page ---------- */
.topic-head{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:end;margin-bottom:18px}
.topic-no{grid-row:span 2;font:800 clamp(64px,10vw,112px)/.8 var(--f-display);color:var(--uc);text-shadow:0 0 30px color-mix(in srgb,var(--uc) 35%,transparent)}
.topic-head .display{font-size:clamp(32px,5vw,54px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--uc);box-shadow:0 0 8px var(--uc)}
.tab .n{font:500 11px var(--f-mono);color:var(--faint)}
.layout-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:1100px){.layout-2{grid-template-columns:1fr}}
.aside{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.aside{position:static}}

/* notes */
.notes{max-width:74ch}
.notes section{margin-bottom:34px;scroll-margin-top:130px}
.notes h3{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.notes h3 .k{font:600 12px var(--f-mono);color:var(--uc);letter-spacing:.06em}
.notes h4{font-size:16px;margin:18px 0 6px}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin:4px 0}
.notes table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;width:100%}
.notes th,.notes td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.notes th{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0 14px}
.tbl table{margin:0}
.box{position:relative;border-radius:12px;padding:14px 16px 12px;margin:14px 0;background:var(--surface);border:1px solid var(--line)}
.box>b.lbl{display:inline-block;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.def{border-left:3px solid var(--uc)}
.box.def>b.lbl{color:var(--uc)}
.box.tip{background:var(--accent-soft);border-color:transparent}
.box.tip>b.lbl{color:var(--accent-ink)}
.box.warn{background:var(--bad-soft);border-color:transparent}
.box.warn>b.lbl{color:var(--bad)}
.box.eq{text-align:center;font-size:18px;padding:18px}
.box.why{background:var(--info-soft);border-color:transparent}
.box.why>b.lbl{color:var(--info)}
.fig{margin:16px 0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;font-size:13.5px}
.toc a:hover{color:var(--ink);border-color:var(--uc)}

.spec-list{display:flex;flex-direction:column;gap:6px}
.spec-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.45;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.rag{display:flex;gap:3px;margin-top:1px}
.rag button{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-2);background:none;padding:0}
.rag button.on[data-v="1"]{background:var(--bad);border-color:var(--bad)}
.rag button.on[data-v="2"]{background:var(--warn);border-color:var(--warn)}
.rag button.on[data-v="3"]{background:var(--good);border-color:var(--good)}

.eq-row{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 16px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.eq-row:last-child{border:0}
.eq-row .m{font-size:1.2em}
.eq-row span.d{font-size:13px;color:var(--muted)}
.eq-tag{font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--paper-2);color:var(--muted);margin-left:6px;vertical-align:middle}
.eq-tag.nb{background:var(--warn-soft);color:var(--warn)}

/* worked */
.worked{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:16px}
.worked .wq{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.worked ol{margin:0;padding:12px 18px 12px 42px}
.worked li{margin:6px 0}
.worked li.hid{display:none}
.worked .wf{display:flex;gap:10px;padding:10px 18px 14px;align-items:center;flex-wrap:wrap}
.ans{font-weight:600;padding:8px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:760px}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.q-prog{flex:1;min-width:120px;display:flex;gap:3px}
.q-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.q-prog i.c{background:var(--good)} .q-prog i.w{background:var(--bad)} .q-prog i.cur{background:var(--uc)}
.q-text{font-size:19px;line-height:1.5;margin:6px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;line-height:1.45;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--line-2);transform:translateX(2px)}
.opt .k{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--paper-2);font:600 13px var(--f-mono)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.explain b.v{font:700 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.explain b.v.good{color:var(--good)} .explain b.v.bad{color:var(--bad)}
.result{text-align:center;padding:30px 20px}
.result .big{font:800 88px/1 var(--f-display);color:var(--uc)}

/* calc practice */
.calc-q{font-size:17.5px;line-height:1.55;margin-bottom:14px}
.calc-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc-in input{width:200px;max-width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font:500 17px var(--f-mono)}
.calc-in input:focus{outline:none;border-color:var(--uc)}
.calc-in .unit{font-family:var(--f-math);font-size:17px}
.steps{margin-top:14px;padding:14px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.steps ol{margin:6px 0 0;padding-left:20px}
.steps li{margin:5px 0}

/* exam */
.examq{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.examq .eh{display:flex;gap:12px;padding:16px 18px;align-items:flex-start}
.examq .eh .mk{margin-left:auto;flex:none}
.examq textarea{display:block;width:calc(100% - 36px);margin:0 18px 12px;min-height:90px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);resize:vertical;font-size:14.5px}
.ms{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px;cursor:pointer}
.ms input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}

/* flashcards */
.fc-stage{perspective:1400px;max-width:640px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:19px;line-height:1.5;overflow:auto}
.fc>div .eyebrow{position:absolute;top:18px;left:0;right:0}
.fc .back{transform:rotateY(180deg);background:var(--surface-2)}
.fc .front::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.fc-ctl{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.boxes{display:flex;gap:6px;justify-content:center;margin-top:14px}
.boxes span{font:500 11px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--paper-2);color:var(--muted)}

/* ---------- Sims ---------- */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sim-stage{position:relative;background:var(--canvas-bg);min-height:360px;border-right:1px solid var(--line)}
.sim-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.sim-ctl{padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.sim-title{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px;gap:8px}
.ctl label output{font:600 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:10px;background:var(--paper-2)}
.seg button{flex:1;padding:6px 8px;border:0;border-radius:7px;background:none;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.ro span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ro{min-width:0}
.ro b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sim-note{font-size:13px;color:var(--ink-2);line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.sim-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
@media (max-width:900px){.sim{grid-template-columns:1fr}.sim-stage{border-right:0;border-bottom:1px solid var(--line);min-height:300px}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--uc) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--uc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--uc);margin-top:-7px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--uc)}
select{padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)}

/* ---------- Search palette ---------- */
.palette-back{position:fixed;inset:0;background:rgba(5,10,15,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.palette{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;background:none;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:55vh;overflow-y:auto}
.palette li a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none}
.palette li a.sel,.palette li a:hover{background:var(--surface-2)}
.palette li .t{font-weight:500}
.palette li .s{font-size:12.5px;color:var(--muted)}
.palette .kind{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---------- Toast & fx ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
@media (max-width:900px){.toasts{bottom:84px;right:12px;left:12px;align-items:stretch}}
.toast{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow-lg);font-size:14px;animation:tin .3s ease}
.toast b{font:800 18px var(--f-display);color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:150;width:100%;height:100%}

/* ---------- Arcade ---------- */
.game-card{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .15s}
.game-card:hover{transform:translateY(-2px)}
.game-card .art{height:110px;border-radius:12px;background:#070B10;position:relative;overflow:hidden}
.game-card .art canvas{width:100%;height:100%;display:block}
.game{max-width:760px;margin:0 auto}
.game-hud{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hud{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:90px}
.hud span{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud b{font:800 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.big-prompt{font:700 clamp(26px,4vw,38px)/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:10px 0 20px;text-align:center}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.quark-bin{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.quark{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:600 26px var(--f-math);font-style:italic;border:2px solid;background:var(--surface);transition:transform .1s}
.quark:hover{transform:scale(1.06)}
.quark small{display:block;font:500 10.5px var(--f-mono);font-style:normal;margin-top:-18px}
.hadron{min-height:120px;display:flex;gap:12px;justify-content:center;align-items:center;border:2px dashed var(--line-2);border-radius:60px;padding:16px;margin:0 auto;max-width:360px}

/* ---------- Equation sheet ---------- */
.eq-section{break-inside:avoid;margin-bottom:18px}
.eq-cols{columns:2 420px;column-gap:22px}
.eq-card{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px;display:inline-block;width:100%}
.eq-card h4{font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px;display:flex;align-items:center;gap:8px}
.const-table{width:100%;border-collapse:collapse;font-size:14px}
.const-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
.const-table td:last-child{font-family:var(--f-mono);font-size:13px;white-space:nowrap}

/* misc */
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.kbd-hint{font-size:12px;color:var(--faint);margin-top:10px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;opacity:.45;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--accent)}
.badge .ic{font:800 30px var(--f-display);color:var(--accent-ink)}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.heat a{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font:600 10.5px var(--f-mono);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.prac{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
.prac summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.prac summary::-webkit-details-marker{display:none}
.prac summary .pno{font:800 20px var(--f-display);color:var(--uc);min-width:44px}
.prac[open] summary{border-bottom:1px solid var(--line)}
.prac .pb{padding:14px 18px}
.prac .pb h5{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.prac .pb h5:first-child{margin-top:0}
.prac .pb ul,.prac .pb ol{margin:0;padding-left:20px}
.chev{margin-left:auto;transition:transform .2s;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.prac[open] .chev{transform:rotate(180deg)}
.note-strip{font-size:12.5px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed var(--line-2);margin-top:24px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* fixes */
.search-btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.search-btn span{white-space:nowrap}
.tab{text-decoration:none}
.lc{text-transform:none;letter-spacing:.02em}
@media (max-width:640px){.spec-axis span:nth-child(2){display:none}}

/* ================= engine additions ================= */
.brand-mark.lw{display:grid;place-items:center;background:linear-gradient(135deg,#1A1204,#0A1017)}
.brand-mark.lw svg{width:22px;height:22px;fill:#FFC24B;stroke:#FFE08A;stroke-width:1;filter:drop-shadow(0 0 5px rgba(255,190,70,.8))}
.hero canvas.circuit{height:clamp(230px,34vw,300px);background:#05080B;border:1px solid #16212C}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-body);letter-spacing:.02em;padding:4px 8px;border-radius:999px;vertical-align:middle;margin-right:6px;white-space:nowrap}
.tag.sm{font-size:10px;padding:3px 6px;margin-right:5px}
.tag.ht{background:color-mix(in srgb,var(--u7) 16%,transparent);color:var(--u7);border:1px solid color-mix(in srgb,var(--u7) 40%,transparent)}
.tag.po{background:color-mix(in srgb,var(--u4) 14%,transparent);color:var(--u4);border:1px solid color-mix(in srgb,var(--u4) 40%,transparent)}
.tier-chip{cursor:pointer;border:1px solid var(--line-2);font-weight:600}
.tier-chip:hover{border-color:var(--accent)}
.settings-dlg{padding:22px;max-width:560px}
.seg.big{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-top:6px;flex-wrap:wrap}
.seg.big button{flex:1;min-width:150px;border:0;background:transparent;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.seg.big button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.unit-a.off,.unit-card.off{opacity:.45}
.onboard{border:1px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.linkcard{text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s}
.linkcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.grid.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid.g4{grid-template-columns:1fr}}
.nuc{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.62em;line-height:1.05;vertical-align:-.42em;margin-right:1px;font-family:var(--f-math)}
.nuc b{font-weight:400}
.eq-row.out{opacity:.4}
.eq-row .eqm{min-width:0}
#eqlists.covered .eq-row .eqm{filter:blur(7px);cursor:pointer;transition:filter .2s}
#eqlists.covered .eq-row.peek .eqm{filter:none}
.prac h5{margin:14px 0 6px}
.prac .pno{font:800 20px var(--f-display);color:var(--uc,var(--accent));min-width:52px}
.ht-inline{border-left:3px solid var(--u7);padding-left:10px}
[data-ht]{border-left:3px solid var(--u7);padding-left:10px}
[data-po]{border-left:3px solid var(--u4);padding-left:10px}
.toc a{white-space:normal}
.fig svg{max-width:100%;height:auto}
.game-sym{display:grid;place-items:center;min-height:150px}
.game-sym svg{width:min(260px,70vw);height:auto}

/* ================= Parallax overrides: observatory identity ================= */
.display{font:800 clamp(36px,5.8vw,64px)/.98 var(--f-display);letter-spacing:-.02em;text-transform:none;text-wrap:balance}
.h2{font:800 28px/1.05 var(--f-display);text-transform:none;letter-spacing:-.01em}
.h3{font:700 20px/1.15 var(--f-display);text-transform:none;letter-spacing:-.005em}
.notes h3{font:700 23px/1.15 var(--f-display);text-transform:none;letter-spacing:-.01em}
.sim-title,.eq-card h4,.big-prompt{text-transform:none;letter-spacing:-.005em}
.brand-name{font:800 25px/1 var(--f-display);letter-spacing:-.02em;text-transform:none}
.brand-mark.px{display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#1D2A6B,#070914 70%)}
.brand-mark.px svg{width:24px;height:24px;stroke:#7FF0E8;fill:none;stroke-width:1.6}
.hero{background:radial-gradient(1200px 400px at 80% -10%,#1A2566 0%,transparent 60%),#070914;border-color:#1B2150}
.hero .btn.accent{background:#3FD8CF;border-color:#3FD8CF;color:#06201E}
.hero canvas.sky{display:block;width:100%;height:clamp(250px,34vw,320px);border-radius:12px;margin-top:22px;background:#04060F;border:1px solid #171C44}
.tag.po{background:color-mix(in srgb,var(--u8) 14%,transparent);color:var(--u8);border:1px solid color-mix(in srgb,var(--u8) 40%,transparent)}
[data-po]{border-left:3px solid var(--u8);padding-left:10px}
.tag.qt{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
/* structured exam questions */
.xq{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:14px 0;overflow:hidden}
.xq-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.xq-head .n{font:800 18px var(--f-display);color:var(--uc,var(--accent))}
.xq-stem{padding:12px 16px 4px}
.xq-part{padding:10px 16px 14px;border-top:1px dashed var(--line)}
.xq-part:first-of-type{border-top:0}
.xq-part .pl{font:700 14px var(--f-mono);color:var(--accent-ink);margin-right:6px}
.xq-part textarea{width:100%;margin-top:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:inherit;resize:vertical}
.xq .ms{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.xq .ms label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:14px}
.xq-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.paper-sec{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:28px 0 4px}
.bank-filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.bank-filters select{padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit}
.dom-sim{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
@media (max-width:860px){.dom-sim{grid-template-columns:1fr}}
/* Parallax: narrow phones */
@media (max-width:480px){
  .top{gap:6px}
  #xp-chip{display:none}
  .tier-chip{padding:4px 8px;font-size:11.5px}
  .bank-filters select{max-width:100%;min-width:0;flex:1 1 140px}
  .const-table td:last-child{white-space:normal;word-break:break-word}
  .eq-row{grid-template-columns:minmax(0,1fr)}
  .eq-row .eqm,.eq-row>.m{min-width:0;white-space:normal}
}

const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" fill="${o.c || MUT}" font-size="${o.fs || 12}" font-family="${o.f || 'var(--f-body)'}" ${o.it ? 'font-style="italic"' : ''} text-anchor="${o.a || 'start'}" ${o.w ? `font-weight="${o.w}"` : ''} ${o.bl ? `dominant-baseline="${o.bl}"` : ''}>${s}</text>`;
const ln = (x1, y1, x2, y2, c = INK, w = 1.5, d = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${d ? `stroke-dasharray="${d}"` : ''} stroke-linecap="round"/>`;
const arrowHead = (x, y, ang, c = INK, s = 8) => { const a1 = ang + 2.7, a2 = ang - 2.7; return `<path d="M${x},${y} L${x + s * Math.cos(a1)},${y + s * Math.sin(a1)} L${x + s * Math.cos(a2)},${y + s * Math.sin(a2)} Z" fill="${c}"/>`; };
const arrow = (x1, y1, x2, y2, c = INK, w = 1.8) => ln(x1, y1, x2, y2, c, w) + arrowHead(x2, y2, Math.atan2(y2 - y1, x2 - x1), c);
const svg = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${esc(label || 'diagram')}" style="font-family:var(--f-body)">${body}</svg>`;
const mlab = (x, y, s, o = {}) => tx(x, y, s, { f: 'var(--f-math)', it: true, fs: o.fs || 15, c: o.c || INK, a: o.a, bl: o.bl });

/* Generic to-scale function plot */
function plot(o) {
  const W = o.w || 520, H = o.h || 290, L = o.pl ?? 52, R = o.pr ?? 20, Tp = o.pt ?? 18, B = o.pb ?? 40;
  const [x0, x1] = o.x, [y0, y1] = o.y;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => H - B - (v - y0) / (y1 - y0) * (H - Tp - B);
  let s = '';
  // grid
  (o.xt || []).forEach(t => s += ln(X(t), Y(y0), X(t), Y(y1), 'var(--line)', 1));
  (o.yt || []).forEach(t => s += ln(X(x0), Y(t), X(x1), Y(t), 'var(--line)', 1));
  // fills
  (o.fills || []).forEach(fl => {
    const n = 120; let d = `M${X(fl.a)},${Y(fl.base ?? 0)}`;
    for (let i = 0; i <= n; i++) { const xv = fl.a + (fl.b - fl.a) * i / n; d += ` L${X(xv)},${Y(clamp(fl.f(xv), y0, y1))}`; }
    d += ` L${X(fl.b)},${Y(fl.base ?? 0)} Z`;
    s += `<path d="${d}" fill="${fl.c}" fill-opacity="${fl.op ?? .18}" stroke="none"/>`;
  });
  // axes
  const ay = (y0 <= 0 && y1 >= 0) ? Y(0) : Y(y0), ax = (x0 <= 0 && x1 >= 0) ? X(0) : X(x0);
  s += arrow(X(x0), ay, X(x1) + 8, ay, INK, 1.4) + arrow(ax, Y(y0), ax, Y(y1) - 8, INK, 1.4);
  (o.xt || []).forEach((t, i) => o.xtl !== false && (s += tx(X(t), ay + 16, (o.xtl ? o.xtl[i] : t), { a: 'middle', fs: 11, f: 'var(--f-mono)' })));
  (o.yt || []).forEach((t, i) => o.ytl !== false && (s += tx(ax - 6, Y(t) + 4, (o.ytl ? o.ytl[i] : t), { a: 'end', fs: 11, f: 'var(--f-mono)' })));
  if (o.xl) s += tx(X(x1), ay + (o.xlDy ?? 32), o.xl, { a: 'end', fs: 12.5, c: INK });
  if (o.yl) s += tx(ax + 8, Y(y1) + 2, o.yl, { fs: 12.5, c: INK });
  // curves
  (o.fns || []).forEach(fn => {
    const a = fn.a ?? x0, b = fn.b ?? x1, n = fn.n || 240; let d = '', pen = false;
    for (let i = 0; i <= n; i++) {
      const xv = a + (b - a) * i / n, yv = fn.f(xv);
      if (!isFinite(yv) || yv > y1 * 1.05 + 1e-9 && y1 > 0 || yv < y0 - (y1 - y0) * .05) { pen = false; continue; }
      d += (pen ? ' L' : ' M') + X(xv).toFixed(1) + ',' + Y(yv).toFixed(1); pen = true;
    }
    s += `<path d="${d}" fill="none" stroke="${fn.c || INK}" stroke-width="${fn.w || 2.4}" ${fn.dash ? `stroke-dasharray="${fn.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (fn.label) { const lx = fn.lx ?? b; s += tx(X(lx) + (fn.ldx ?? 6), Y(fn.f(lx)) + (fn.ldy ?? 4), fn.label, { c: fn.c || INK, fs: 12, w: 600, a: fn.la || 'start' }); }
  });
  (o.segs || []).forEach(g => { let d = g.p.map((p, i) => (i ? 'L' : 'M') + X(p[0]) + ',' + Y(p[1])).join(' '); s += `<path d="${d}" fill="none" stroke="${g.c || INK}" stroke-width="${g.w || 2.4}" ${g.dash ? `stroke-dasharray="${g.dash}"` : ''} stroke-linejoin="round"/>`; if (g.label) s += tx(X(g.lp[0]), Y(g.lp[1]), g.label, { c: g.c || INK, fs: 12, w: 600, a: g.la || 'start' }); });
  (o.hl || []).forEach(l => s += ln(X(x0), Y(l.y), X(l.x ?? x1), Y(l.y), l.c || MUT, 1.2, '5 4') + (l.label ? tx(X(x0) + 6, Y(l.y) - 5, l.label, { fs: 11.5, c: l.c || MUT }) : ''));
  (o.vl || []).forEach(l => s += ln(X(l.x), Y(y0), X(l.x), Y(l.y ?? y1), l.c || MUT, 1.2, '5 4') + (l.label ? tx(X(l.x), ay + (l.dy ?? 16), l.label, { fs: 11.5, a: 'middle', c: l.c || MUT }) : ''));
  (o.marks || []).forEach(m => s += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="${m.r || 4}" fill="${m.c || ACC}"/>` + (m.label ? tx(X(m.x) + (m.dx ?? 8), Y(m.y) + (m.dy ?? -8), m.label, { fs: 12, c: m.lc || INK, a: m.a || 'start' }) : ''));
  (o.text || []).forEach(t => s += tx(X(t[0]), Y(t[1]), t[2], Object.assign({ c: INK, fs: 12 }, t[3] || {})));
  if (o.extra) s += o.extra(X, Y);
  return svg(W, H, s, o.label) + (o.cap ? `<figcaption>${o.cap}</figcaption>` : '');
}


/* ==========================================================
   Standard circuit symbols (AQA 4.2.1.1) — each drawn centred on (x, y), 60 px long, horizontal.
   rot = 90 draws it vertically.
   ========================================================== */
const SYM = {
  'cell': (x, y) => ln(x - 30, y, x - 4, y) + ln(x - 4, y - 13, x - 4, y + 13, INK, 2) + ln(x + 4, y - 7, x + 4, y + 7, INK, 4.5) + ln(x + 4, y, x + 30, y),
  'battery': (x, y) => ln(x - 30, y, x - 12, y) + ln(x - 12, y - 13, x - 12, y + 13, INK, 2) + ln(x - 5, y - 7, x - 5, y + 7, INK, 4.5) + ln(x - 5, y, x + 5, y, INK, 1.5, '2 3') + ln(x + 5, y - 13, x + 5, y + 13, INK, 2) + ln(x + 12, y - 7, x + 12, y + 7, INK, 4.5) + ln(x + 12, y, x + 30, y),
  'switch (open)': (x, y) => ln(x - 30, y, x - 14, y) + `<circle cx="${x - 14}" cy="${y}" r="2.6" fill="${INK}"/><circle cx="${x + 14}" cy="${y}" r="2.6" fill="${INK}"/>` + ln(x - 14, y, x + 11, y - 13) + ln(x + 14, y, x + 30, y),
  'switch (closed)': (x, y) => ln(x - 30, y, x - 14, y) + `<circle cx="${x - 14}" cy="${y}" r="2.6" fill="${INK}"/><circle cx="${x + 14}" cy="${y}" r="2.6" fill="${INK}"/>` + ln(x - 14, y, x + 14, y) + ln(x + 14, y, x + 30, y),
  'resistor': (x, y) => ln(x - 30, y, x - 15, y) + `<rect x="${x - 15}" y="${y - 7}" width="30" height="14" fill="var(--surface)" stroke="${INK}" stroke-width="1.8"/>` + ln(x + 15, y, x + 30, y),
  'variable resistor': (x, y) => SYM.resistor(x, y) + arrow(x - 14, y + 13, x + 15, y - 14, INK, 1.5),
  'lamp': (x, y) => ln(x - 30, y, x - 11, y) + `<circle cx="${x}" cy="${y}" r="11" fill="var(--surface)" stroke="${INK}" stroke-width="1.8"/>` + ln(x - 7.8, y - 7.8, x + 7.8, y + 7.8) + ln(x + 7.8, y - 7.8, x - 7.8, y + 7.8) + ln(x + 11, y, x + 30, y),
  'fuse': (x, y) => ln(x - 30, y, x - 15, y) + `<rect x="${x - 15}" y="${y - 6}" width="30" height="12" fill="var(--surface)" stroke="${INK}" stroke-width="1.8"/>` + ln(x - 22, y, x + 22, y, INK, 1.3) + ln(x + 15, y, x + 30, y),
  'diode': (x, y) => ln(x - 30, y, x + 30, y) + `<path d="M${x - 8},${y - 10} L${x - 8},${y + 10} L${x + 8},${y} Z" fill="var(--surface)" stroke="${INK}" stroke-width="1.8"/>` + ln(x + 8, y - 10, x + 8, y + 10, INK, 2),
  'LED': (x, y) => SYM.diode(x, y) + arrow(x - 2, y - 12, x + 7, y - 22, INK, 1.4) + arrow(x + 5, y - 11, x + 14, y - 21, INK, 1.4),
  'LDR': (x, y) => `<circle cx="${x}" cy="${y}" r="19" fill="none" stroke="${INK}" stroke-width="1.5"/>` + SYM.resistor(x, y) + arrow(x - 26, y - 26, x - 12, y - 13, INK, 1.4) + arrow(x - 16, y - 30, x - 3, y - 17, INK, 1.4),
  'thermistor': (x, y) => SYM.resistor(x, y) + ln(x - 22, y + 13, x - 16, y + 13, INK, 1.5) + ln(x - 16, y + 13, x + 15, y - 13, INK, 1.5),
  'ammeter': (x, y) => ln(x - 30, y, x - 12, y) + `<circle cx="${x}" cy="${y}" r="12" fill="var(--surface)" stroke="${INK}" stroke-width="1.8"/>` + tx(x, y + 5, 'A', { a: 'middle', fs: 14, c: INK, w: 700 }) + ln(x + 12, y, x + 30, y),
  'voltmeter': (x, y) => ln(x - 30, y, x - 12, y) + `<circle cx="${x}" cy="${y}" r="12" fill="var(--surface)" stroke="${INK}" stroke-width="1.8"/>` + tx(x, y + 5, 'V', { a: 'middle', fs: 14, c: INK, w: 700 }) + ln(x + 12, y, x + 30, y)
};
const sym = (name, x, y, rot) => { if (!rot) return SYM[name](x, y); const m = /meter$/.test(name), body = m ? SYM[name](x, y).replace(/<text[\s\S]*?<\/text>/, '') : SYM[name](x, y); // meter letters stay upright
  return `<g transform="rotate(${rot} ${x} ${y})">${body}</g>` + (m ? tx(x, y + 5, name === 'ammeter' ? 'A' : 'V', { a: 'middle', fs: 14, c: INK, w: 700 }) : ''); };
const wire = (...pts) => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
const dot = (x, y, c = INK, r = 3) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const SYMBOL_BANK = Object.keys(SYM).map(k => [svg(120, 70, SYM[k](60, 38), k).replace('width="120"', 'width="240"'), k]);
const box = (x, y, w, h, fill = 'var(--surface)', stroke = INK, r = 6, sw = 1.6) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
const cap = s => `<figcaption>${s}</figcaption>`;
const circ = (x, y, r, fill = 'none', stroke = INK, sw = 1.6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
const pth = (d, stroke = INK, sw = 1.8, fill = 'none', dash = '') => `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
const bar = (x, y, w, h, c, lab, val) => `<rect x="${x}" y="${y - h}" width="${w}" height="${h}" rx="3" fill="${c}"/>` + (lab ? tx(x + w / 2, y + 15, lab, { a: 'middle', fs: 11 }) : '') + (val != null ? tx(x + w / 2, y - h - 5, val, { a: 'middle', fs: 11, c: INK, f: 'var(--f-mono)' }) : '');

const DIAG = {
  /* ================= 4.1 ENERGY ================= */
  stores: () => { let s = ''; const pos = [[70, 'thrown up', 1, 0], [250, 'half-way up', .5, .5], [430, 'at the top', 0, 1]];
    s += ln(20, 200, 520, 200, MUT);
    pos.forEach(([x, lab, k, p], i) => { const by = 200 - [10, 90, 170][i]; s += circ(x, by - 12, 12, C1, INK) + (k ? arrow(x, by - 30, x, by - 30 - 40 * k, INK, 2) : '') + tx(x, 222, lab, { a: 'middle', fs: 12, c: INK, w: 600 });
      s += bar(x + 30, 195, 18, 90 * k + 1, C1, 'Eₖ') + bar(x + 54, 195, 18, 90 * p + 1, C5, 'Eₚ'); });
    return svg(540, 240, s, 'Energy stores of a ball thrown upwards') + cap('A ball thrown upwards: energy moves from the kinetic store to the gravitational potential store and back again (ignoring air resistance). The total stays the same.'); },
  shcrig: () => { let s = '';
    s += box(160, 90, 150, 110, 'color-mix(in srgb,var(--muted) 30%,var(--surface))', INK, 4) + tx(235, 180, 'aluminium block', { a: 'middle', fs: 12, c: INK });
    s += `<rect x="150" y="80" width="170" height="130" rx="8" fill="none" stroke="${C2}" stroke-width="3" stroke-dasharray="3 4"/>` + tx(330, 212, 'insulation', { fs: 11, c: C2 });
    s += box(190, 40, 14, 110, C1, INK, 3) + tx(212, 22, 'heater', { fs: 12 }); s += box(262, 30, 8, 120, 'var(--surface)', INK, 4) + `<rect x="264" y="95" width="4" height="50" fill="${BAD}"/>` + tx(280, 34, 'thermometer', { fs: 12 });
    s += box(20, 40, 100, 50, 'var(--surface-2)', INK, 8) + tx(70, 62, 'joulemeter', { a: 'middle', fs: 12, c: INK, w: 600 }) + tx(70, 80, '0 0 1 2 5 0 J', { a: 'middle', fs: 11, f: 'var(--f-mono)', c: INK });
    s += wire([120, 55], [197, 55]) + wire([120, 75], [140, 75], [140, 30], [197, 30], [197, 40]);
    s += box(20, 150, 100, 40, 'var(--surface-2)', INK, 8) + tx(70, 175, 'power supply', { a: 'middle', fs: 12 }) + wire([50, 150], [50, 90]) + wire([90, 150], [90, 90]);
    return svg(420, 230, s, 'Specific heat capacity apparatus') + cap('Practical 5.14P: an insulated metal block heated by an immersion heater. The joulemeter measures the energy supplied; the thermometer measures the temperature rise.'); },
  sankey: () => { let s = '';
    s += `<path d="M20,40 L430,40 L430,28 L470,45 L430,62 L430,50 L20,50 Z" fill="${C2}"/>`;
    s += `<path d="M20,50 L200,50 A110,110 0 0 1 310,160 L310,196 L332,196 L265,250 L198,196 L220,196 L220,160 A20,20 0 0 0 200,140 L20,140 Z" fill="${C1}" opacity=".78"/>`;
    s += tx(30, 100, '100 J in', { fs: 14, c: '#fff', w: 700 }) + tx(30, 118, '(electrical)', { fs: 12, c: '#fff' }) + tx(440, 22, '10 J light (useful)', { fs: 13, c: INK, w: 700, a: 'middle' }) + tx(345, 220, '90 J wasted', { fs: 13, c: INK, w: 700 }) + tx(345, 238, 'thermal store of the surroundings', { fs: 12 });
    return svg(540, 260, s, 'Sankey diagram for a filament lamp') + cap('Sankey diagram for a filament lamp. Arrow widths are proportional to energy: input = useful output + wasted output. Efficiency = 10 ÷ 100 = 0.10 (10%).'); },

  /* ================= 4.2 ELECTRICITY ================= */
  symbols: () => { const ks = Object.keys(SYM); let s = ''; ks.forEach((k, i) => { const x = 70 + (i % 4) * 140, y = 40 + Math.floor(i / 4) * 80; s += SYM[k](x, y) + tx(x, y + 34, k, { a: 'middle', fs: 12, c: INK, w: 600 }); });
    return svg(560, 40 + Math.ceil(ks.length / 4) * 80, s, 'Standard circuit symbols') + cap('Standard circuit symbols you must be able to draw and recognise. On a cell the longer line is the positive terminal.'); },
  wirerig: () => { let s = '';
    s += box(40, 150, 420, 22, 'color-mix(in srgb,var(--u2) 20%,var(--surface))', INK, 3); for (let i = 0; i <= 10; i++) s += ln(50 + i * 40, 150, 50 + i * 40, 158, INK, 1) + tx(50 + i * 40, 168, i * 10, { a: 'middle', fs: 9, f: 'var(--f-mono)' });
    s += ln(50, 145, 450, 145, C1, 2.2) + tx(452, 138, 'resistance wire', { a: 'end', fs: 11, c: C1 });
    s += `<path d="M44,136 l12,0 l0,14 l-12,0 z" fill="${INK}"/><path d="M284,136 l12,0 l0,14 l-12,0 z" fill="${INK}"/>` + tx(290, 188, '↑ crocodile clip at length L', { a: 'middle', fs: 11 });
    s += sym('battery', 170, 40) + sym('ammeter', 330, 40) + wire([140, 40], [50, 40], [50, 136]) + wire([200, 40], [300, 40]) + wire([360, 40], [420, 40], [420, 90], [290, 90], [290, 136]);
    s += sym('voltmeter', 170, 100) + wire([140, 100], [50, 100]) + wire([200, 100], [290, 100]) + dot(50, 100) + dot(290, 100);
    return svg(500, 198, s, 'Resistance of a wire apparatus') + cap('The voltmeter measures the pd across length L of wire; the ammeter measures the current. R = V ÷ I. Use a low pd so the wire stays cool.'); },
  ivall: () => { const g = (ox, title, f, col) => { let s = ''; const X = v => ox + 90 + v * 70, Y = v => 100 - v * 70; s += arrow(ox + 10, 100, ox + 170, 100, INK, 1.2) + arrow(ox + 90, 175, ox + 90, 22, INK, 1.2) + tx(ox + 172, 114, 'V', { fs: 12, c: INK, it: true, a: 'end' }) + tx(ox + 96, 28, 'I', { fs: 12, c: INK, it: true });
      let d = ''; for (let i = 0; i <= 80; i++) { const v = -1.1 + 2.2 * i / 80, iv = f(v); if (iv > 1.1 || iv < -1.1) continue; d += (d ? 'L' : 'M') + X(v).toFixed(1) + ',' + Y(iv).toFixed(1); } s += pth(d, col, 2.6) + tx(ox + 90, 198, title, { a: 'middle', fs: 13, c: INK, w: 700 }); return s; };
    const s = g(0, 'resistor (constant T)', v => 0.85 * v, C1) + g(185, 'filament lamp', v => Math.sign(v) * 1.0 * (1 - Math.exp(-2.4 * Math.abs(v))) * 1.02, C2) + g(370, 'diode', v => v < 0.45 ? 0.004 * v : Math.min(1.2, 9 * (v - 0.45) ** 1.5), C5);
    return svg(560, 210, s, 'I–V graphs') + cap('I–V characteristics. Resistor: straight line through the origin (ohmic). Filament lamp: curve — resistance increases as it heats up. Diode: current flows one way only, above about 0.6 V.'); },
  sensors: () => plot({ x: [0, 10], y: [0, 10], w: 520, h: 250, xtl: false, ytl: false, xt: [], yt: [], xl: 'temperature → / light intensity →', yl: 'resistance',
    fns: [{ f: x => 9 * Math.exp(-0.28 * x) + 0.4, c: C1, label: 'thermistor (against temperature)', lx: 3, ldy: -8 }, { f: x => 8 / (0.9 + x) + 0.6, c: C6, label: 'LDR (against light intensity)', lx: 2.6, ldy: 30 }],
    cap: 'Both resistances fall: a thermistor’s as temperature rises, an LDR’s as light intensity rises.' }),
  ivrig: () => { let s = '';
    s += sym('battery', 90, 40) + sym('variable resistor', 260, 40) + sym('ammeter', 400, 40) + wire([60, 40], [30, 40], [30, 150], [140, 150]) + wire([120, 40], [230, 40]) + wire([290, 40], [370, 40]) + wire([430, 40], [470, 40], [470, 150], [320, 150]);
    s += box(160, 130, 140, 40, 'var(--surface-2)', INK, 8) + tx(230, 155, 'component', { a: 'middle', fs: 12, c: INK, w: 600 }) + wire([140, 150], [160, 150]) + wire([300, 150], [320, 150]);
    s += sym('voltmeter', 230, 205) + wire([200, 205], [140, 205], [140, 150]) + wire([260, 205], [320, 205], [320, 150]) + dot(140, 150) + dot(320, 150);
    return svg(500, 230, s, 'Circuit for I–V characteristics') + cap('Practical 2.9: ammeter in series, voltmeter in parallel with the component, variable resistor to change the pd. Reverse the battery for negative values.'); },
  series: () => { let s = '';
    s += sym('battery', 250, 30) + tx(250, 12, '6.0 V', { a: 'middle', fs: 12, c: INK }) + sym('resistor', 150, 150) + sym('resistor', 350, 150) + sym('ammeter', 60, 90, 90);
    s += wire([220, 30], [60, 30], [60, 60]) + wire([60, 120], [60, 150], [120, 150]) + wire([180, 150], [320, 150]) + wire([380, 150], [440, 150], [440, 30], [280, 30]);
    [[150, 'R₁ = 4 Ω', '2.0 V'], [350, 'R₂ = 8 Ω', '4.0 V']].forEach(([x, r, v]) => { s += tx(x, 134, r, { a: 'middle', fs: 12, c: INK, w: 600 }) + sym('voltmeter', x, 205) + wire([x - 30, 205], [x - 36, 205], [x - 36, 150]) + wire([x + 30, 205], [x + 36, 205], [x + 36, 150]) + dot(x - 36, 150) + dot(x + 36, 150) + tx(x, 238, 'V = ' + v, { a: 'middle', fs: 12, c: C1, w: 600 }); });
    s += tx(78, 94, 'I = 0.50 A everywhere', { fs: 12, c: C5, w: 600 });
    return svg(480, 250, s, 'Series circuit') + cap('Series: the same current through each component; the supply pd is shared (2.0 V + 4.0 V = 6.0 V); total resistance = 4 + 8 = 12 Ω.'); },
  parallel: () => { let s = '';
    s += sym('battery', 250, 30) + tx(250, 12, '12 V', { a: 'middle', fs: 12, c: INK }) + sym('lamp', 250, 110) + sym('lamp', 250, 180);

/* ==========================================================
   Diagrams part 2: atomic structure, forces, waves, magnetism, space, skills
   ========================================================== */
/* ---- Magnetic field lines as contours of the magnetic vector potential ----
   A bar magnet or solenoid is modelled (in 2-D cross-section) as two rows of line currents
   along its long faces. In 2-D, B = curl(A k̂), so every field line is a contour of the
   scalar A: lines close on themselves, can never cross, are symmetric wherever the magnet
   is, and are closer together where the field is stronger. */
const FIELD = {
  /* wires on the faces of a magnet/solenoid from x0 to x1, centred on y, half-height h. I > 0 → B inside points +x */
  sheet(x0, x1, y, h, n, I) { const w = []; for (let i = 0; i < n; i++) { const x = x0 + (i + 0.5) * (x1 - x0) / n; w.push([x, y - h, I], [x, y + h, -I]); } return w; },
  A(ws, x, y) { let a = 0; for (let k = 0; k < ws.length; k++) { const w = ws[k], dx = x - w[0], dy = y - w[1]; a += w[2] * Math.log(dx * dx + dy * dy + 1); } return 0.5 * a; },
  B(ws, x, y) { const h = 0.5; return [(this.A(ws, x, y + h) - this.A(ws, x, y - h)) / (2 * h), -(this.A(ws, x + h, y) - this.A(ws, x - h, y)) / (2 * h)]; },
  /* n evenly spaced contour levels spanning the inside of a magnet (from 0.7 × half-height above to below its centre line) */
  levels(ws, x, y, h, n, f = 0.7) { const a = this.A(ws, x, y - f * h), b = this.A(ws, x, y + f * h); return Array.from({ length: n }, (_, k) => a + (b - a) * (k + 0.5) / n); },
  /* marching squares + stitching → [{L, pts:[[x,y],…]}] */
  lines(ws, W, H, levels, step = 3) {
    const nx = Math.ceil(W / step) + 1, ny = Math.ceil(H / step) + 1, g = new Float64Array(nx * ny), out = [];
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) g[j * nx + i] = this.A(ws, i * step, j * step);
    levels.forEach(L => {
      const edges = [];
      const ep = (i, j, v) => { const a = g[j * nx + i], b = v ? g[(j + 1) * nx + i] : g[j * nx + i + 1], t = (L - a) / (b - a); return [(v ? 'v' : 'h') + i + ',' + j, v ? [i * step, (j + t) * step] : [(i + t) * step, j * step]]; };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const v0 = g[j * nx + i] > L, v1 = g[j * nx + i + 1] > L, v2 = g[(j + 1) * nx + i + 1] > L, v3 = g[(j + 1) * nx + i] > L, cs = [];
        if (v0 !== v1) cs.push(ep(i, j, 0)); if (v1 !== v2) cs.push(ep(i + 1, j, 1)); if (v3 !== v2) cs.push(ep(i, j + 1, 0)); if (v0 !== v3) cs.push(ep(i, j, 1));
        if (cs.length === 2) edges.push(cs); else if (cs.length === 4) edges.push([cs[0], cs[1]], [cs[2], cs[3]]);
      }
      const adj = new Map(); edges.forEach((e, k) => e.forEach(p => { const l = adj.get(p[0]); l ? l.push(k) : adj.set(p[0], [k]); }));
      const used = new Uint8Array(edges.length);
      for (let k = 0; k < edges.length; k++) { if (used[k]) continue; used[k] = 1; const chain = [edges[k][0][1], edges[k][1][1]];
        for (const fwd of [1, 0]) { let key = edges[k][fwd][0]; for (;;) { const m = (adj.get(key) || []).find(q => !used[q]); if (m == null) break; used[m] = 1; const e = edges[m], nx_ = e[0][0] === key ? e[1] : e[0]; fwd ? chain.push(nx_[1]) : chain.unshift(nx_[1]); key = nx_[0]; } }
        if (chain.length > 3) out.push({ L, pts: chain }); }
    });
    return out;
  },
  /* arrowheads where lines cross the vertical guides xs, skipping points inside any rect [x0,y0,x1,y1] → [[x,y,ux,uy]] */
  arrows(ws, lines, xs, skip = [], W = 1e9, H = 1e9) { const out = [];
    lines.forEach(({ pts }) => { for (let k = 1; k < pts.length; k++) { const [x1, y1] = pts[k - 1], [x2, y2] = pts[k];
      xs.forEach(gx => { if ((x1 - gx) * (x2 - gx) > 0 || x1 === x2) return; const y = y1 + (y2 - y1) * (gx - x1) / (x2 - x1); if (y < 8 || y > H - 8 || skip.some(r => gx >= r[0] && gx <= r[2] && y >= r[1] && y <= r[3])) return;
        if (out.some(a => Math.hypot(a[0] - gx, a[1] - y) < 9)) return; const [bx, by] = this.B(ws, gx, y), m = Math.hypot(bx, by) || 1; out.push([gx, y, bx / m, by / m]); }); } });
    return out; },
  svgPath(pts) { return pts.filter((p, i) => i % 2 === 0 || i === pts.length - 1).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(''); },
  svgArrow(a, col, s = 7) { const [x, y, ux, uy] = a; return `<path d="M${(x + ux * s).toFixed(1)},${(y + uy * s).toFixed(1)} L${(x - ux * s * .6 - uy * s * .6).toFixed(1)},${(y - uy * s * .6 + ux * s * .6).toFixed(1)} L${(x - ux * s * .6 + uy * s * .6).toFixed(1)},${(y - uy * s * .6 - ux * s * .6).toFixed(1)} Z" fill="${col}"/>`; }
};

  ],
  learn: [
    { h: 'What forces do', html: `
<p>A force is a push or pull that acts between two bodies. Forces can change an object’s <b>speed</b> (start, stop, speed up, slow down), its <b>direction</b> of motion, or its <b>shape</b> (stretch, squash, bend, twist).</p>
<div class="tbl"><table><tr><th>Type of force</th><th>Acts between…</th></tr>
<tr><td>gravitational (weight)</td><td>any two masses — e.g. Earth and you</td></tr>
<tr><td>electrostatic</td><td>charged objects</td></tr>
<tr><td>magnetic</td><td>magnets / magnetic materials / currents</td></tr>
<tr><td>friction, air resistance (drag), upthrust</td><td>surfaces in contact; objects moving through fluids</td></tr>
<tr><td>tension, normal reaction (contact force)</td><td>stretched strings; surfaces pressed together</td></tr></table></div>` },
    { h: 'Scalars and vectors', html: `
<p><b>Scalars</b> have size (magnitude) only: mass, distance, speed, time, energy, temperature. <b>Vectors</b> have size <b>and direction</b>: force, weight, velocity, displacement, acceleration, momentum.</p>
<p>Force is a vector, so the direction matters when forces are combined. Forces are drawn as arrows: length = size, arrow = direction.</p>` },
    { h: 'Resultant force', html: `
[[d:resultant]]
<p>The <b>resultant</b> force is the single force that has the same effect as all the forces acting together. For forces along a line, choose a positive direction, then <b>add forces in the same direction and subtract forces in opposite directions</b>.</p>
<ul><li>Resultant = 0 (<b>balanced</b> forces): the object stays at rest or moves at <b>constant velocity</b>.</li><li>Resultant ≠ 0 (<b>unbalanced</b>): the object accelerates in the direction of the resultant.</li></ul>
<p><b>Friction</b> opposes motion (or attempted motion) between surfaces. Air resistance and water resistance are types of friction (drag). Friction transfers energy to the thermal store of the surfaces.</p>` }

TOPICS.push({

  spec: [
    '1.17 know and use the relationship between unbalanced force, mass and acceleration: force = mass × acceleration, F = m × a',

  ],
  learn: [
    { h: 'F = ma', html: `
<div class="box def"><b class="lbl">Recall</b><p>$"force" = "mass" × "acceleration"$ &nbsp; $F = m × a$ &nbsp; (N = kg × m/s²)</p></div>
<p>F is the <b>unbalanced (resultant)</b> force. For a given force, a larger mass has a smaller acceleration; for a given mass, a larger resultant force gives a larger acceleration (a ∝ F).</p>
<p><b>1 newton</b> is the force that gives a 1 kg mass an acceleration of 1 m/s².</p>` },
    { h: 'Weight and mass', html: `
<div class="box def"><b class="lbl">Recall</b><p>$"weight" = "mass" × "gravitational field strength"$ &nbsp; $W = m × g$ &nbsp; (N = kg × N/kg)</p></div>
<ul><li><b>Mass</b> (kg) is the amount of matter — the same everywhere.</li><li><b>Weight</b> (N) is the gravitational force on the mass — it depends on g. On Earth g ≈ 10 N/kg; on the Moon about 1.6 N/kg.</li><li>g in N/kg is also the acceleration of free fall in m/s².</li></ul>` },
    { h: 'Falling objects and terminal velocity', html: `
[[d:terminal]]
<ol><li><b>Just released:</b> only weight acts (no air resistance yet) → acceleration = g = 10 m/s².</li><li><b>Speeding up:</b> air resistance increases with speed, so the resultant force (W − drag) decreases → acceleration decreases.</li><li><b>Terminal velocity:</b> air resistance = weight → resultant force zero → constant (terminal) velocity.</li><li><b>Parachute opens:</b> much larger area → drag ≫ weight → resultant force upwards → decelerates. Drag falls as speed falls until drag = weight again → a new, <b>lower</b> terminal velocity, safe for landing.</li></ol>
<p>In a vacuum (e.g. on the Moon) there is no air resistance: a hammer and a feather fall with the same acceleration.</p>` }

<div class="box def"><b class="lbl">Definition</b><p><b>Stopping distance = thinking distance + braking distance.</b></p></div>
<ul><li><b>Thinking distance</b> — travelled during the driver’s reaction time, at constant speed: thinking distance = speed × reaction time. It is <b>proportional to speed</b>.</li><li><b>Braking distance</b> — travelled while the brakes slow the car to rest. For the same braking force it is proportional to <b>speed²</b> (double the speed → four times the braking distance), because the kinetic energy (½mv²) must all be transferred by the work done by the brakes.</li></ul>` },

<div class="tbl"><table><tr><th>Affects thinking distance (reaction time)</th><th>Affects braking distance</th></tr>

<p>Typical reaction times are 0.2–0.9 s. Braking distance for a given braking force: more mass → smaller deceleration (a = F/m) → longer distance.</p>` }

TOPICS.push({
  id: '1.7', unit: '1', ref: '1.25–1.29', po: true, title: 'Momentum', short: 'p = mv, conservation, F = Δp/t, Newton’s third law',

<div class="box def"><b class="lbl">Recall</b><p>$"momentum" = "mass" × "velocity"$ &nbsp; $p = m × v$ &nbsp; (kg m/s)</p></div>
<p>Momentum is a <b>vector</b> — direction matters. Choose a positive direction; momentum in the opposite direction is negative.</p>` },
    { h: 'Conservation of momentum', html: `
[[d:collision]]
<p>In a <b>closed system</b> (no external forces), <b>total momentum before = total momentum after</b> a collision or explosion.</p>
<ul><li><b>Collision where objects stick together:</b> $m_1u_1 + m_2u_2 = (m_1 + m_2)v$.</li><li><b>Explosion / recoil</b> (starting at rest): total momentum before = 0, so after, the two parts have equal and opposite momenta — e.g. a gun recoils as the bullet is fired.</li></ul>` },
    { h: 'Force and change in momentum', html: `
<div class="box def"><b class="lbl">Given on the paper</b><p>$"force" = @frac{"change in momentum"}{"time taken"}$ &nbsp; $F = @frac{(mv - mu)}{t}$</p></div>
<p>This is Newton’s second law in another form (since (v − u)/t = a, it gives F = ma). For a given change in momentum, <b>increasing the time</b> of the collision <b>decreases the force</b>.</p>
<p><b>Safety features</b> — crumple zones, seat belts (which stretch slightly), air bags, cycle and motorcycle helmets, crash barriers, soft playground surfaces — all increase the time over which a person’s momentum changes, so the force on them (and the deceleration) is smaller, reducing injury.</p>` },
    { h: 'Newton’s third law', html: `
[[d:thirdlaw]]
<p><b>When body A exerts a force on body B, body B exerts an equal and opposite force on body A.</b> The two forces are the same <b>type</b>, equal in <b>size</b>, opposite in <b>direction</b>, and act on <b>different bodies</b> — so they never cancel each other out.</p>
<p>Examples: you push on the ground backwards, the ground pushes you forwards; a rocket pushes gas backwards, the gas pushes the rocket forwards; the Earth pulls the Moon, the Moon pulls the Earth.</p>
<div class="box warn"><b class="lbl">Not a third-law pair</b><p>A book on a table: its weight (Earth pulls book) and the normal reaction (table pushes book) both act on the <b>book</b> — they are balanced forces, not a third-law pair.</p></div>` }

  cards: [

    ['Unit of momentum?', 'kg m/s', 'po'],

  learn: [

[[d:moment]]
<div class="box def"><b class="lbl">Recall</b><p>$"moment" = "force" × "perpendicular distance from the pivot"$ &nbsp; (Nm)</p></div>
<p>A moment is the <b>turning effect</b> of a force. It is larger for a bigger force or a force applied further from the pivot — which is why a long spanner makes a nut easier to turn and door handles are far from the hinges.</p>` },
    { h: 'Principle of moments and centre of gravity', html: `
<p><b>Principle of moments:</b> when an object is balanced (in equilibrium), <b>the sum of the clockwise moments about any point = the sum of the anticlockwise moments about that point</b>. Also, the upward forces equal the downward forces.</p>
<p>The <b>weight</b> of a body acts through its <b>centre of gravity</b> — the single point where all the weight appears to act. For a uniform ruler it is at the middle. A freely suspended object hangs with its centre of gravity directly below the pivot (used to find the centre of gravity of a lamina with a plumb line).</p>
<p>An object is <b>stable</b> if it has a low centre of gravity and a wide base; it topples when the line of action of its weight falls outside its base.</p>` },
    { h: 'Beams supported at both ends', html: `
<p>A light beam rests on two supports, A and B. When a heavy object is placed on it, the two upward forces add up to the object’s weight. <b>The support nearer the object carries the larger share.</b> If the object is in the middle, each support takes half; as the object moves towards A, the force at A increases and the force at B decreases (by the same amount).</p>
<p>To calculate: take moments about one support (this eliminates that support’s force), then use upward forces = downward forces.</p>
<p>Example: a 3.0 m light beam with a 600 N load 1.0 m from A. Moments about A: $F_B × 3.0 = 600 × 1.0$ → F<sub>B</sub> = 200 N; F<sub>A</sub> = 600 − 200 = 400 N.</p>` }

<div class="tbl"><table><tr><th>Wire / device</th><th>What it does</th></tr>

[[d:ripple]]
<p><b>Reflection:</b> a wave bounces off a barrier; angle of incidence = angle of reflection. Echoes are reflected sound.</p>
<p><b>Refraction:</b> a wave changes <b>speed</b> when it enters a different medium (or a different depth of water), and so usually changes <b>direction</b>. The <b>frequency stays the same</b> (set by the source), so the <b>wavelength changes</b> in proportion to the speed (v = fλ). Water waves slow down in shallower water: the wavefronts get closer together and bend towards the normal.</p>` },
    { h: 'The Doppler effect', html: `
[[d:doppler]]
<p>When a wave source moves <b>towards</b> an observer, each wave is emitted from a point a little closer than the last, so the wavefronts are squashed together: the observed <b>wavelength is shorter</b> and the <b>frequency higher</b>. When the source moves <b>away</b>, the wavefronts are stretched out: <b>longer wavelength, lower frequency</b>.</p>
<p>Examples: the pitch of an ambulance siren is higher as it approaches and drops as it passes; radar speed guns; blood-flow measurement with ultrasound; the <b>red-shift</b> of light from receding galaxies (Topic 8).</p>
<p>The speed of the wave itself does not change — only the spacing of the waves the observer receives.</p>` }
  ],

[[d:tir]]
<p>When light travels from a <b>denser</b> medium (glass, water) towards a <b>less dense</b> medium (air), it bends away from the normal. As the angle of incidence increases, the refracted ray gets closer to the surface.</p>
<ul><li>The <b>critical angle (c)</b> is the angle of incidence in the denser medium for which the angle of refraction is 90° (the refracted ray travels along the boundary).</li><li>If i &gt; c, <b>all</b> the light is reflected back inside — <b>total internal reflection (TIR)</b>. (If i &lt; c, most light refracts out and a little is reflected.)</li></ul>
<div class="box def"><b class="lbl">Recall</b><p>$sin c = @frac{1}{n}$ &nbsp; e.g. glass n = 1.5 → c = sin⁻¹(1/1.5) = 42°</p></div>
<p>Conditions for TIR: light going from denser to less dense medium, <b>and</b> angle of incidence greater than the critical angle.</p>` },
    { h: 'Optical fibres and prisms', html: `
[[d:fibre]]
<p><b>Optical fibres</b> are thin, flexible strands of very pure glass. Light entering one end hits the inside wall at an angle greater than the critical angle, so it is totally internally reflected again and again along the fibre, even round bends. A cladding of lower refractive index protects the surface.</p>
<ul><li><b>Communications:</b> pulses of light carry telephone, TV and internet signals — very high data rate, little loss, not affected by electrical interference, hard to tap.</li><li><b>Endoscopes:</b> bundles of fibres carry light into the body and an image back out, for viewing inside patients without major surgery.</li></ul>
<p><b>Prisms:</b> a right-angled (45°) glass prism reflects light by TIR because 45° is greater than the critical angle of glass (42°). One prism turns light through 90° (periscopes); used in pairs to turn it through 180° (binoculars, bicycle reflectors, “cat’s eyes”). Prisms give brighter, sharper images than mirrors and don’t tarnish.</p>` }

<p>Sound is produced by <b>vibrating</b> objects. It travels as a <b>longitudinal</b> wave of compressions and rarefactions through a medium — solids, liquids and gases — but <b>not through a vacuum</b> (there are no particles to vibrate).</p>

<div data-po="1">
[[d:scope]]
<p>A <b>microphone</b> converts the pressure variations of a sound wave into an alternating electrical signal (voltage) of the same frequency. An <b>oscilloscope</b> displays this voltage against time, giving a trace that looks like a transverse wave — even though sound is longitudinal.</p>
<ul><li>Taller trace → larger amplitude → louder.</li><li>More waves across the screen (closer together) → higher frequency → higher pitch.</li></ul>
<p><b>Practical (3.27P) — frequency from an oscilloscope:</b> connect the microphone; sound a tuning fork or signal generator + loudspeaker near it; adjust the timebase so a few complete waves are visible. Count the squares for one complete wave (or several and divide), multiply by the timebase setting (e.g. ms/div) to get the period T, then <b>f = 1/T</b>.</p>

[[d:stores]]

<p>Energy is transferred between stores in four ways: <b>mechanically</b> (a force moving through a distance — work done), <b>electrically</b> (a current flowing), <b>by heating</b> (from hotter to cooler), and <b>by radiation</b> (light and sound waves).</p>

<p>In every real transfer, some energy is <b>wasted</b>: usually transferred by heating to the thermal store of the surroundings (friction, air resistance, electrical resistance, sound). It spreads out (dissipates) and becomes less useful.</p>` },

<div class="box def"><b class="lbl">Recall</b><p>$"efficiency" = @frac{"useful energy output"}{"total energy output"} × 100"%"$ &nbsp; (total output = total input)</p></div>
<p>Efficiency can also be calculated with power. It can never be more than 100%.</p>
<p>A <b>Sankey diagram</b> shows energy transfers to scale: the width of each arrow is proportional to the amount of energy. The input arrow on the left splits into a useful output (straight on) and wasted outputs (bending away, usually downwards).</p>
<p>Examples: filament lamp ≈ 10% efficient (most energy heats the surroundings); LED ≈ 40–90%; electric motor ≈ 70–80%; car engine ≈ 25–30%; power station ≈ 35–40%; kettle ≈ 90%.</p>` }

TOPICS.push({
  id: '4.2', unit: '4', ref: '4.6–4.10', title: 'Thermal energy transfer', short: 'Conduction, convection, radiation, insulation',
  summary: 'How thermal energy is transferred by conduction, convection and radiation; convection in everyday life; how surface and temperature affect emission and absorption; the practical; and reducing unwanted transfer.',
  spec: [
