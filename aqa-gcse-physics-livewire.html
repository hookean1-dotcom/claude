TOPICS.push({
  id: '5.4', unit: '5', ref: '4.5.5', po: true, title: 'Pressure in fluids', short: 'p = F/A, p = hρg, upthrust, atmosphere',
  summary: 'Pressure in liquids and gases acts at right angles to surfaces. Calculate pressure, explain why it increases with depth (Higher), why objects float or sink, and why the atmosphere thins with height.',
  spec: [
    '(PO) A fluid can be a liquid or a gas; pressure in a fluid causes a force normal (at right angles) to any surface',
    '(PO) Pressure at the surface of a fluid: p = F / A (recall) — Pa, N, m²',
    '(PO) (HT) Pressure due to a column of liquid: p = h ρ g (equation sheet)',
    '(PO) (HT) Explain why pressure at a point in a liquid increases with the height of the column above it and with the density of the liquid; calculate pressure differences at different depths',
    '(PO) (HT) A submerged object experiences greater pressure on its bottom surface than its top, giving a resultant upward force — upthrust; describe the factors which influence floating and sinking',
    '(PO) The atmosphere is a thin layer of air round the Earth that gets less dense with increasing altitude',
    '(PO) Air molecules colliding with a surface create atmospheric pressure; there is less air above a higher surface, so atmospheric pressure decreases with height',
    '(PO) Describe a simple model of the atmosphere and of atmospheric pressure'
  ],
  learn: [
    { h: 'Pressure', html: `
<p>A <b>fluid</b> is a liquid or a gas. The pressure in a fluid produces a force <b>normal</b> (at right angles) to any surface it touches.</p>
<div class="box def"><b class="lbl">Recall this equation</b><p>pressure = force normal to a surface ÷ area of that surface &nbsp; $p = @frac{F}{A}$</p><p class="small">p in pascals (Pa), F in newtons (N), A in metres squared (m²). 1 Pa = 1 N/m².</p></div>
<p>Spreading a force over a larger area gives a smaller pressure (snowshoes, wide tractor tyres). Concentrating it on a small area gives a large pressure (knives, drawing pins).</p>
<div class="box tip"><b class="lbl">Area units</b><p>1 cm² = 0.0001 m² (10<sup>−4</sup> m²). Convert before dividing!</p></div>` },
    { h: 'Pressure in a liquid', ht: true, html: `
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>pressure = height of the column × density of the liquid × gravitational field strength &nbsp; $p = hρg$</p><p class="small">p in Pa, h in m, ρ in kg/m³, g in N/kg</p></div>
<p>The deeper you go, the <b>taller the column of liquid</b> above you, so the <b>greater the weight</b> of liquid pressing down — the pressure increases. A <b>denser</b> liquid has more mass (and weight) in the same column, so it also gives a greater pressure.</p>
[[d:depth]]
<p>Pressure <b>difference</b> between two depths: $Δp = Δh × ρ × g$. Dams are thicker at the bottom for this reason.</p>` },
    { h: 'Upthrust, floating and sinking', ht: true, html: `
<p>An object partly or fully submerged in a fluid has a <b>greater pressure on its bottom surface</b> than on its top surface (because the bottom is deeper). This creates a <b>resultant upward force</b> called <b>upthrust</b>.</p>
<ul><li>An object <b>floats</b> if the upthrust can equal its weight. It sinks until the weight of water it displaces equals its own weight.</li><li>An object <b>sinks</b> if its weight is greater than the upthrust even when fully submerged.</li></ul>
<p>Whether an object floats depends on its <b>density compared with the fluid</b>: less dense than the fluid → floats; more dense → sinks. A steel ship floats because its hollow shape displaces a lot of water, so its average density is less than water’s.</p>` },
    { h: 'Atmospheric pressure', html: `
[[d:atmosphere]]
<p>The atmosphere is a <b>thin layer</b> of air around the Earth (relative to the Earth’s size). It gets <b>less dense</b> with increasing altitude.</p>
<p>Air molecules <b>colliding with a surface</b> create atmospheric pressure. At sea level it is about 100 000 Pa.</p>
<p>The higher you go, the <b>fewer air molecules</b> (and so the less weight of air) there are <b>above</b> you. So <b>atmospheric pressure decreases with height</b>. Climbers on Everest experience about a third of sea-level pressure; aircraft cabins are pressurised.</p>` }
  ],
  eqs: [['p = @frac{F}{A}', 'pressure (recall; physics only)'], ['p = hρg', 'pressure in a liquid (equation sheet; HT, physics only)']],
  worked: [
    { q: 'A box of weight 600 N rests on a base of area 0.20 m². Calculate the pressure on the floor.', s: ['$p = @frac{F}{A}$', '$p = @frac{600}{0.20}$', '$p = 3000 "Pa"$'], a: '3000 Pa' },
    { ht: 1, q: 'Calculate the pressure due to the water at the bottom of a 3.0 m deep swimming pool. Density of water = 1000 kg/m³, g = 9.8 N/kg.', s: ['$p = hρg$', '$p = 3.0 × 1000 × 9.8$', '$p = 29 400 "Pa"$'], a: '29 400 Pa' },
    { ht: 1, q: 'A diver descends from 5.0 m to 15.0 m in seawater (ρ = 1030 kg/m³, g = 9.8 N/kg). Calculate the increase in pressure.', s: ['Δh = 15.0 − 5.0 = 10.0 m', '$Δp = Δhρg = 10.0 × 1030 × 9.8$', '$Δp = 100 940 "Pa"$'], a: '≈ 1.0 × 10⁵ Pa' }
  ],
  pitfalls: ['Using an area in cm² in p = F/A.', 'Saying pressure in a liquid acts only downwards — it acts in all directions, at right angles to surfaces.', 'Saying heavy objects always sink.', 'Saying atmospheric pressure decreases because it is colder higher up — it is because there is less air above.', 'Forgetting that p = hρg gives the pressure due to the liquid only (not including the atmosphere above).'],
  cards: [
    ['What is a fluid?', 'A liquid or a gas.', 'po'],
    ['Direction of the force from fluid pressure?', 'Normal (at right angles) to the surface.', 'po'],
    ['Equation for pressure?', '$p = F/A$ (Pa, N, m²)', 'po'],
    ['What is 1 Pa?', '1 N/m²', 'po'],
    ['Pressure due to a column of liquid?', '$p = hρg$', 'htpo'],
    ['Why does pressure increase with depth?', 'A taller column of liquid above — greater weight pressing down.', 'htpo'],
    ['What is upthrust?', 'The resultant upward force on a submerged object due to greater pressure on its bottom surface.', 'htpo'],
    ['When does an object float?', 'When the upthrust equals its weight / it is less dense than the fluid.', 'htpo'],
    ['Why does atmospheric pressure decrease with height?', 'There is less air (fewer molecules, less weight) above.', 'po'],
    ['What causes atmospheric pressure?', 'Air molecules colliding with a surface.', 'po']
  ],
  quiz: [
    { q: 'A force of 200 N acts on an area of 0.50 m². The pressure is', o: ['400 Pa', '100 Pa', '0.0025 Pa', '200.5 Pa'], x: 'p = F/A.', po: 1 },
    { q: 'Pressure in a fluid acts', o: ['at right angles to any surface', 'only downwards', 'only upwards', 'parallel to surfaces'], x: 'Normal to surfaces.', po: 1 },
    { q: 'Camels have wide feet so they', o: ['exert less pressure on the sand', 'exert more pressure', 'weigh less', 'have more upthrust'], x: 'Larger area → lower pressure.', po: 1 },
    { q: 'Atmospheric pressure decreases with altitude because', o: ['there is less air above', 'the air is colder', 'gravity is stronger', 'molecules move faster'], x: 'Less weight of air above.', po: 1 },
    { q: 'The pressure due to 2.0 m of water (ρ = 1000 kg/m³, g = 9.8 N/kg) is', o: ['19 600 Pa', '2000 Pa', '490 Pa', '9800 Pa'], x: 'p = hρg.', po: 1, ht: 1 },
    { q: 'Upthrust on a submerged object is caused by', o: ['greater pressure on its bottom surface than its top', 'the object’s weight', 'friction with the water', 'air trapped inside the object'], x: 'Bottom is deeper.', po: 1, ht: 1 },
    { q: 'An object will float if', o: ['its density is less than that of the fluid', 'it is heavy', 'it is made of metal', 'its density is greater than the fluid’s'], x: 'Upthrust can match its weight.', po: 1, ht: 1 },
    { q: 'At the same depth, the pressure in seawater compared with fresh water is', o: ['greater, because seawater is denser', 'smaller', 'the same', 'zero'], x: 'p ∝ ρ.', po: 1, ht: 1 },

    { q: 'The atmosphere compared with the size of the Earth is', o: ['a thin layer', 'thicker than the Earth’s radius', 'the same thickness as the Earth', 'of uniform density'], x: 'Most of the air is within about 10 km.', po: 1 }
  ],
  exam: [
    { q: 'Explain why the pressure at the bottom of a lake is greater than the pressure near the surface.', m: 2, ms: ['There is a greater height/column of water above.', 'So a greater weight of water pushes on each square metre / p = hρg increases with h.'], po: 1, ht: 1 },
    { q: 'Explain why a block of wood floats in water.', m: 3, ms: ['Pressure on the bottom surface is greater than on the top, producing upthrust.', 'The wood is less dense than water.', 'It sinks until the upthrust equals its weight / the resultant force is zero.'], po: 1, ht: 1 },
    { q: 'Describe a simple model of the Earth’s atmosphere and explain why atmospheric pressure decreases with height.', m: 3, ms: ['Thin layer of air around the Earth, less dense at higher altitude.', 'Pressure caused by air molecules colliding with surfaces.', 'At greater height there are fewer molecules / less weight of air above, so pressure is lower.'], po: 1 },

TOPICS.push({
  id: '5.5', unit: '5', ref: '4.5.6.1', title: 'Describing motion', short: 'Speed, velocity, acceleration, motion graphs',
  summary: 'Distance and displacement, speed and velocity, typical speeds, acceleration, v² − u² = 2as, and how to read distance–time and velocity–time graphs.',
  spec: [
    'Distance is how far an object moves (scalar); displacement is the straight-line distance and direction from start to finish (vector)',
    'Speed is a scalar; typical speeds: walking ≈ 1.5 m/s, running ≈ 3 m/s, cycling ≈ 6 m/s; speed of sound in air ≈ 330 m/s; recall typical speeds for transport',
    'Distance travelled = speed × time: s = v t (recall); calculate average speed for non-uniform motion',
    'Velocity is speed in a given direction (vector)',
    '(HT) Motion in a circle involves constant speed but changing velocity',
    'Speed from the gradient of a distance–time graph; draw and interpret distance–time graphs',
    '(HT) Speed of an accelerating object from the gradient of a tangent to a distance–time graph',
    'Acceleration = change in velocity ÷ time: a = Δv / t (recall); an object slowing down is decelerating; estimate everyday accelerations',
    'Acceleration from the gradient of a velocity–time graph; draw and interpret velocity–time graphs',
    '(HT) Distance travelled (or displacement) from the area under a velocity–time graph, including counting squares',
    'v² − u² = 2 a s for uniform acceleration (equation sheet); objects falling freely near Earth accelerate at about 9.8 m/s²',
    'An object falling through a fluid initially accelerates; eventually the resultant force is zero and it moves at terminal velocity',
    '(PO) Draw and interpret velocity–time graphs for objects that reach terminal velocity; interpret the changing motion in terms of the forces'
  ],
  learn: [
    { h: 'Distance, displacement, speed and velocity', html: `
<div class="tbl"><table><tr><th>Scalar</th><th>Vector</th></tr><tr><td><b>Distance</b> — how far an object moves</td><td><b>Displacement</b> — straight-line distance from start to finish <i>and</i> its direction</td></tr><tr><td><b>Speed</b> — how fast</td><td><b>Velocity</b> — speed in a given direction</td></tr></table></div>
<p>A runner completing one lap of a 400 m track has run a distance of 400 m but has a displacement of <b>zero</b>.</p>
<div class="box def"><b class="lbl">Typical speeds (recall these)</b><p>walking ≈ 1.5 m/s · running ≈ 3 m/s · cycling ≈ 6 m/s · car in town ≈ 13 m/s (30 mph) · car on motorway ≈ 31 m/s (70 mph) · train ≈ 50 m/s · aircraft ≈ 250 m/s · speed of sound in air ≈ 330 m/s</p></div>
<p>Speeds are rarely constant — they depend on age, terrain, fitness and distance travelled. Even the speed of sound and of the wind vary.</p>` },
    { h: 'Speed and average speed', html: `
<div class="box def"><b class="lbl">Recall this equation</b><p>distance travelled = speed × time &nbsp; $s = vt$</p><p class="small">s in metres (m), v in metres per second (m/s), t in seconds (s)</p></div>
<p>For non-uniform motion, <b>average speed = total distance ÷ total time</b>.</p>
<p>Converting: 1 km/h ÷ 3.6 = m/s. E.g. 72 km/h = 20 m/s.</p>` },
    { h: 'Circular motion', ht: true, html: `
<p>An object moving in a circle at constant speed is <b>constantly changing direction</b>. Because velocity is a vector, its <b>velocity is changing</b> even though its <b>speed is constant</b>. A changing velocity means it is accelerating — towards the centre of the circle. Examples: a satellite in orbit, a car going round a roundabout, a hammer thrower’s hammer.</p>` },
    { h: 'Distance–time graphs', html: `
[[d:dtgraph]]
<ul><li>The <b>gradient</b> of a distance–time graph = <b>speed</b>.</li><li>Straight sloping line → constant speed. Steeper → faster.</li><li>Horizontal line → stationary.</li><li>Curve getting steeper → accelerating; getting less steep → decelerating.</li></ul>
<p class="ht-inline"><b>(HT)</b> For an accelerating object, find the speed at a particular time by drawing a <b>tangent</b> to the curve at that time and measuring its gradient.</p>` },
    { h: 'Acceleration', html: `
<div class="box def"><b class="lbl">Recall this equation</b><p>acceleration = change in velocity ÷ time taken &nbsp; $a = @frac{Δv}{t}$</p><p class="small">a in metres per second squared (m/s²), Δv in m/s, t in s</p></div>
<p>An object that slows down is <b>decelerating</b> (negative acceleration). Everyday values: a car pulling away ≈ 2–3 m/s²; a sprinter at the start ≈ 5 m/s²; free fall ≈ 9.8 m/s².</p>
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>(final velocity)² − (initial velocity)² = 2 × acceleration × distance &nbsp; $v^2 - u^2 = 2as$</p><p class="small">Use it for uniform acceleration when time is not given.</p></div>
<p>Near the Earth’s surface any object falling freely under gravity has an acceleration of about <b>9.8 m/s²</b>.</p>` },
    { h: 'Velocity–time graphs', html: `
[[d:vtgraph]]
<ul><li>The <b>gradient</b> of a velocity–time graph = <b>acceleration</b>.</li><li>Horizontal line → constant velocity. Negative gradient → deceleration.</li><li><b>(HT)</b> The <b>area under</b> the graph = <b>distance travelled</b> (displacement). Split it into rectangles and triangles, or count squares for curved graphs.</li></ul>` },
    { h: 'Terminal velocity', html: `
<p>An object falling through a fluid first <b>accelerates</b> because of its weight. As its speed increases, the <b>drag</b> (air resistance) increases. Eventually drag equals weight, the <b>resultant force is zero</b>, and it falls at a steady <b>terminal velocity</b>.</p>
<div data-po="1"><p><b>Skydiver (physics only):</b></p>
[[d:terminal]]
<ol><li>Jumps: only weight acts → acceleration 9.8 m/s² (steep start to the v–t graph).</li><li>Speeds up: air resistance increases, resultant force decreases → acceleration decreases (graph gets less steep).</li><li>Air resistance = weight → terminal velocity (graph horizontal).</li><li>Opens parachute: much larger surface area, air resistance > weight → decelerates.</li><li>Air resistance falls as she slows, until it equals weight again → a new, lower terminal velocity.</li></ol></div>` }
  ],

TOPICS.push({
  id: '5.6', unit: '5', ref: '4.5.6.2', title: 'Newton’s laws of motion', short: 'F = ma, inertia, RP7, action–reaction',
  summary: 'Newton’s three laws explain every motion question at GCSE. Use F = ma, investigate acceleration (Required Practical 7), estimate forces in road transport and identify force pairs.',
  spec: [
    'Newton’s First Law: if the resultant force on an object is zero, a stationary object stays stationary and a moving object continues at the same velocity',
    'When a vehicle travels at a steady speed the resistive forces balance the driving force; velocity only changes if a resultant force acts',
    'Apply Newton’s First Law to objects with uniform velocity and objects whose speed and/or direction changes',
    '(HT) The tendency of objects to continue in their state of rest or of uniform motion is called inertia',
    'Newton’s Second Law: acceleration is proportional to the resultant force and inversely proportional to the mass; F = m a (recall); use the symbols ∝ and ~',
    '(HT) Inertial mass is a measure of how difficult it is to change the velocity of an object; it is defined as force ÷ acceleration',
    'Estimate the speeds, accelerations and forces involved in large accelerations for everyday road transport',
    'Required practical 7: investigate the effect of varying force on the acceleration of an object of constant mass, and of varying mass with a constant force',
    'Newton’s Third Law: whenever two objects interact, the forces they exert on each other are equal and opposite; apply it to equilibrium situations'
  ],
  learn: [
    { h: 'Newton’s First Law', html: `
<div class="box def"><b class="lbl">Newton’s First Law</b><p>If the resultant force acting on an object is <b>zero</b>: a stationary object <b>remains stationary</b>; a moving object <b>continues to move at the same speed and in the same direction</b> (the same velocity).</p></div>
<p>So when a car travels at a steady speed, the <b>resistive forces</b> (friction, air resistance) <b>balance</b> the <b>driving force</b>. The velocity (speed and/or direction) changes <b>only</b> if a resultant force acts.</p>
<p class="ht-inline"><b>(HT)</b> The tendency of objects to continue in their state of rest or uniform motion is called <b>inertia</b>.</p>` },
    { h: 'Newton’s Second Law', html: `
<div class="box def"><b class="lbl">Newton’s Second Law</b><p>The acceleration of an object is <b>proportional to the resultant force</b> acting on it, and <b>inversely proportional to its mass</b>: $a ∝ F$ and $a ∝ @frac{1}{m}$.</p></div>
<div class="box def"><b class="lbl">Recall this equation</b><p>resultant force = mass × acceleration &nbsp; $F = ma$</p><p class="small">F in newtons (N), m in kg, a in m/s²</p></div>
<p class="ht-inline"><b>(HT)</b> <b>Inertial mass</b> measures how difficult it is to change an object’s velocity. It is defined as the ratio <b>force ÷ acceleration</b> (m = F/a).</p>
<div class="box why"><b class="lbl">Estimating (~)</b><p>A family car (~1000 kg) accelerating at ~3 m/s² needs a resultant force of ~3000 N. An emergency stop from 30 m/s in ~3 s is a deceleration of ~10 m/s² — a braking force of ~10 000 N.</p></div>` },
    { h: 'Required practical 7: force, mass and acceleration', html: `
[[d:trolley]]
<ol><li>Set up a trolley on a flat bench, attached by a string over a pulley to a hanging mass holder. Mark a start line and use light gates (or a ruler, stopwatch and chalk marks) to measure the acceleration.</li><li><b>Varying force:</b> start with all the slotted masses on the trolley. Move one mass at a time from the trolley to the hanger. This increases the accelerating force (weight of hanger) while keeping the <b>total mass of the system constant</b>.</li><li>Release the trolley and record the acceleration for each force. Repeat and take a mean.</li><li><b>Varying mass:</b> keep the hanging mass the same (constant force) and add masses to the trolley.</li></ol>
<p><b>Results:</b> a graph of acceleration against force is a straight line through the origin (a ∝ F). Acceleration decreases as mass increases (a ∝ 1/m).</p>
<div class="box warn"><b class="lbl">Tips &amp; safety</b><p>Tilt the runway slightly to compensate for friction. Use a light string. Put a cushion or box under the falling masses so they don’t land on feet; don’t let the trolley fly off the bench.</p></div>` },
    { h: 'Newton’s Third Law', html: `
<div class="box def"><b class="lbl">Newton’s Third Law</b><p>Whenever two objects <b>interact</b>, the forces they exert on each other are <b>equal and opposite</b>.</p></div>
<p>Third-law pairs always: act on <b>different objects</b>; are the <b>same type</b> of force; are equal in size and opposite in direction.</p>
[[d:thirdlaw]]
<p>A book resting on a table (equilibrium): Earth pulls the book down (weight) and the book pulls the Earth up — one pair. The book pushes down on the table and the table pushes up on the book — another pair. The weight and the table’s normal force on the book balance, but they are <b>not</b> a third-law pair (they act on the same object and are different types).</p>` }
  ],
  eqs: [['F = ma', 'resultant force (recall)'], ['a ∝ F,  a ∝ @frac{1}{m}', 'Newton’s second law'], ['m = @frac{F}{a}', 'inertial mass (HT)']],
  worked: [
    { q: 'A 1200 kg car accelerates at 2.5 m/s². Calculate the resultant force.', s: ['$F = ma$', '$F = 1200 × 2.5$', '$F = 3000 "N"$'], a: '3000 N' },

  ],
  pitfalls: ['Saying an object moving at constant velocity has no forces on it — the forces are balanced.', 'Using the driving force instead of the resultant force in F = ma.', 'Saying third-law pairs cancel out — they act on different objects.', 'In RP7, changing the total mass while varying the force.', 'Using mass in grams.'],
  cards: [
    ['State Newton’s First Law.', 'Zero resultant force → stationary objects stay still; moving objects keep the same velocity.'],

TOPICS.push({
  id: '5.7', unit: '5', ref: '4.5.6.3', title: 'Stopping distances', short: 'Thinking + braking distance, reaction time',
  summary: 'Why a car’s stopping distance increases so rapidly with speed, what affects reaction time and braking distance, and the dangers of large decelerations.',
  spec: [
    'Stopping distance = thinking distance (during the driver’s reaction time) + braking distance (under the braking force); for a given braking force, greater speed → greater stopping distance',
    '(PO) Estimate how the distance for an emergency stop varies over a range of typical speeds; interpret graphs relating speed to stopping distance for a range of vehicles',
    'Reaction times vary from person to person, typically 0.2 s to 0.9 s; affected by tiredness, drugs, alcohol and distractions',
    'Explain methods to measure human reaction times and recall typical results; interpret and evaluate measurements; evaluate the effect of factors on thinking distance',
    'Braking distance is affected by adverse road and weather conditions (wet or icy) and poor condition of the brakes or tyres',
    'Explain the factors which affect stopping distance in emergencies and the implications for safety; estimate how stopping distance varies over typical speeds',
    'Braking: work done by friction between brakes and wheel reduces the kinetic energy and the temperature of the brakes increases',
    'The greater the speed, the greater the braking force needed to stop in a certain distance; greater braking force → greater deceleration; large decelerations can make brakes overheat and/or cause loss of control',
    '(HT) Estimate the forces involved in the deceleration of road vehicles in typical situations'
  ],
  learn: [
    { h: 'Thinking distance + braking distance', html: `
<div class="box def"><b class="lbl">Stopping distance</b><p><b>stopping distance = thinking distance + braking distance</b></p><p><b>Thinking distance</b>: distance travelled during the driver’s <b>reaction time</b>. <b>Braking distance</b>: distance travelled while the <b>braking force</b> acts.</p></div>
[[d:stopping]]
<p>Thinking distance = speed × reaction time, so it is <b>proportional to speed</b>. Braking distance is proportional to <b>speed squared</b> (because kinetic energy ∝ v²), so it rises very rapidly: doubling the speed doubles the thinking distance but <b>quadruples</b> the braking distance.</p>` },
    { h: 'Reaction time', html: `
<p>Reaction times vary from person to person — typically <b>0.2 s to 0.9 s</b>. They are made longer by <b>tiredness</b>, <b>drugs</b>, <b>alcohol</b> and <b>distractions</b> (such as using a phone). A longer reaction time increases the thinking distance, but not the braking distance.</p>
<div class="box why"><b class="lbl">Measuring reaction time: the ruler drop test</b><p>A partner holds a ruler vertically with the zero mark between your open finger and thumb. Without warning they let go; you catch it as fast as you can. Read the distance fallen. The further it falls, the longer your reaction time (use a conversion table or $s = @frac{1}{2}gt^2$). Repeat several times and take a mean. Computer tests (clicking when the screen changes colour) give similar results, around 0.2–0.3 s.</p></div>` },
    { h: 'Braking distance', html: `
<p>When the brakes are applied, <b>work done by the friction force</b> between the brake pads and the wheel <b>reduces the kinetic energy</b> of the vehicle, and the <b>temperature of the brakes increases</b>.</p>
<p>Braking distance is increased by:</p>
<ul><li><b>adverse road and weather conditions</b> — wet or icy roads reduce the friction between the tyres and the road;</li><li><b>poor condition of the vehicle</b> — worn brakes or worn/under-inflated tyres.</li></ul>
<p>The greater the speed, the greater the braking force needed to stop in a certain distance. The greater the braking force, the greater the <b>deceleration</b>. <b>Large decelerations</b> can make the brakes <b>overheat</b> and/or the driver <b>lose control</b> (skidding), and cause injuries to passengers.</p>` },
    { h: 'Estimating forces in braking', ht: true, html: `
<p>Use F = ma with sensible estimates. A 1000 kg car travelling at 20 m/s (≈ 45 mph) that stops in about 25 m:</p>
<p>$v^2 - u^2 = 2as$: $0 - 20^2 = 2 × a × 25$, so a = −8 m/s². Braking force F = ma ≈ 1000 × 8 = <b>8000 N</b>.</p>
<p>Alternatively, work done by brakes = kinetic energy lost: F × 25 = ½ × 1000 × 20² = 200 000 J, so F = 8000 N.</p>` }
  ],
  eqs: [['"stopping distance" = "thinking distance" + "braking distance"', ''], ['"thinking distance" = "speed" × "reaction time"', ''], ['Fs = @frac{1}{2}mv^2', 'braking: work done by friction = kinetic energy lost']],
  worked: [
    { q: 'A driver with a reaction time of 0.70 s is travelling at 20 m/s. Calculate the thinking distance.', s: ['thinking distance = speed × reaction time', '= 20 × 0.70', '= 14 m'], a: '14 m' },
    { q: 'The braking distance of a car at 15 m/s is 14 m. Estimate the braking distance at 30 m/s.', s: ['Braking distance ∝ speed².', 'Speed doubles, so braking distance × 2² = × 4.', '14 × 4 = 56 m'], a: '≈ 56 m' },
    { ht: 1, q: 'A 1200 kg car travelling at 25 m/s brakes to a stop in 40 m. Estimate the average braking force.', s: ['Kinetic energy = ½ × 1200 × 25² = 375 000 J', 'Work done by brakes = F × 40 = 375 000', 'F ≈ 9400 N'], a: '≈ 9400 N' }
  ],
  pitfalls: ['Saying alcohol increases the braking distance — it increases thinking distance (reaction time).', 'Saying wet roads increase thinking distance.', 'Saying stopping distance is proportional to speed.', 'Forgetting that brakes heat up because work is done by friction.'],
  cards: [

<div class="box def"><b class="lbl">Conservation of momentum</b><p>In a <b>closed system</b>, the <b>total momentum before</b> an event equals the <b>total momentum after</b> the event.</p></div>

<p><b>Collision:</b> a moving trolley hits a stationary one and they stick together. They move off more slowly together, but the total momentum is unchanged.</p>
<p><b>Explosion (recoil):</b> before firing, a gun and bullet are at rest — total momentum zero. Afterwards the bullet moves forward and the gun recoils backwards with equal and opposite momentum, so the total is still zero.</p>
<div data-po="1"><p><b>Calculation (physics only):</b> a 2.0 kg trolley at 3.0 m/s hits a stationary 1.0 kg trolley; they stick together. Before: 2.0 × 3.0 + 0 = 6.0 kg m/s. After: (2.0 + 1.0) × v = 6.0, so v = 2.0 m/s.</p></div>` },

<div class="box why"><b class="lbl">Safety features</b><p>In a crash, the change in momentum is fixed (from full speed to zero). <b>Air bags, seat belts, crash mats, cycle helmets and cushioned playground surfaces</b> all <b>increase the time</b> taken for the momentum to change. A longer time means a <b>smaller rate of change of momentum</b>, so a <b>smaller force</b> on the person — fewer injuries.</p></div>

<p><b>Speed of sound in air:</b> two students stand a measured distance apart (e.g. 400 m on a field). One bangs two wooden blocks together (or fires a starting pistol); the other starts a stopwatch on seeing the action and stops it on hearing the sound. Speed = distance ÷ time. Repeat and average. Alternatively use two microphones connected to a data logger to time the sound over a shorter distance. Typical result: ≈ 330 m/s.</p>
<p><b>Speed of ripples on water:</b> see Required Practical 8 below.</p>
<div data-po="1"><div class="box why"><b class="lbl">Sound passing between media (physics only)</b><p>When sound goes from air into water, its <b>frequency stays the same</b> (it is set by the source). Its <b>speed increases</b> (≈ 330 m/s → ≈ 1500 m/s), so from v = fλ its <b>wavelength increases</b> in proportion.</p></div></div>` },

<p><b>Waves on a string (solid):</b> attach a string to a vibration generator, pass it over a pulley and hang masses on the end. Adjust the frequency until a clear standing wave appears. Measure across several half-wavelengths with a metre rule to find λ; read f from the signal generator; v = fλ.</p>

TOPICS.push({
  id: '6.2', unit: '6', ref: '4.6.1.3–4.6.1.5', po: true, title: 'Reflection, sound and ultrasound', short: 'Reflection, hearing, echo sounding, seismic waves',
  summary: 'What happens to waves at boundaries, Required Practical 9, how the ear turns sound into vibrations (Higher), and how ultrasound, echo sounding and seismic waves reveal hidden structures (Higher).',
  spec: [
    '(PO) Waves can be reflected, absorbed or transmitted at the boundary between two different materials',
    '(PO) Construct ray diagrams to illustrate the reflection of a wave at a surface; describe the effects of reflection, transmission and absorption at material interfaces',
    '(PO) Required practical 9: investigate the reflection of light by different types of surface and the refraction of light by different substances',
    '(PO) (HT) Sound waves can travel through solids causing vibrations; in the ear sound causes the ear drum and other parts to vibrate; this conversion works only over a limited frequency range, which restricts human hearing',
    '(PO) (HT) Describe processes that convert sound waves into vibrations in solids; explain the limited frequency range; human hearing range is 20 Hz to 20 kHz',
    '(PO) (HT) Explain how differences in velocity, absorption and reflection of different waves in solids and liquids are used to detect and explore hidden structures',
    '(PO) (HT) Ultrasound has a frequency above the upper limit of human hearing; it is partially reflected at boundaries; timing the reflections gives the distance — used for medical and industrial imaging',
    '(PO) (HT) Seismic waves: P-waves are longitudinal and travel at different speeds through solids and liquids; S-waves are transverse and cannot travel through liquids; they give evidence for the structure and size of the Earth’s core',
    '(PO) (HT) Echo sounding with high-frequency sound detects objects in deep water and measures depth; seismic waves led to discoveries about parts of the Earth that cannot be observed directly'
  ],
  learn: [
    { h: 'Reflection, transmission and absorption', html: `
<p>When a wave meets the boundary between two different materials it can be:</p>
<ul><li><b>reflected</b> — it bounces back;</li><li><b>transmitted</b> — it passes through (often changing speed and direction — refraction);</li><li><b>absorbed</b> — its energy is transferred to the material, often warming it.</li></ul>
<p>Usually all three happen to some extent. What happens depends on the wavelength and the materials.</p>
[[d:reflection]]
<div class="box def"><b class="lbl">Law of reflection</b><p>angle of incidence = angle of reflection, both measured from the <b>normal</b> (a line at 90° to the surface at the point where the ray hits).</p></div>
<p>To draw a reflection ray diagram: draw the normal as a dashed line, measure the angle of incidence with a protractor, and draw the reflected ray at the same angle on the other side of the normal. Use arrows on rays.</p>` },
    { h: 'Required practical 9: reflection and refraction of light', html: `
[[d:raybox]]
<p><b>Reflection:</b> place a plane mirror on paper and draw round it. Draw a normal. Shine a narrow ray from a ray box at the mirror along a line drawn at a measured angle of incidence. Mark the reflected ray with crosses; measure the angle of reflection. Repeat for other angles and for different surfaces (e.g. a shiny surface gives a sharp reflected ray; a matt surface scatters light).</p>
<p><b>Refraction:</b> place a rectangular glass (or Perspex, or water in a clear box) block on paper and draw round it. Shine a ray into one side at an angle to the normal. Mark the ray entering and leaving; join them to show the path through the block. Measure the angles of incidence and refraction. Repeat with other materials.</p>
<div class="box warn"><b class="lbl">Tips &amp; safety</b><p>Work in a darkened room with a narrow slit for a thin ray. Mark rays with small crosses far apart. The ray box gets hot — don’t touch the lamp.</p></div>` },
    { h: 'Sound waves and hearing', ht: true, html: `
<p>Sound waves can travel through <b>solids</b>, causing them to vibrate. Inside the ear, sound waves make the <b>ear drum</b> vibrate; these vibrations are passed through tiny bones to the inner ear (cochlea), producing the sensation of sound.</p>
<p>The conversion of sound waves into vibrations of solids <b>only works over a limited range of frequencies</b>: the ear drum and small bones cannot vibrate effectively at very high or very low frequencies. This restricts the <b>limits of human hearing</b> to about <b>20 Hz to 20 kHz</b> (20 000 Hz). The upper limit falls with age.</p>` },
    { h: 'Ultrasound and echo sounding', ht: true, html: `
<p><b>Ultrasound</b> is sound with a frequency <b>above 20 kHz</b> — too high for humans to hear.</p>
<p>Ultrasound is <b>partially reflected</b> at the boundary between two different media (e.g. soft tissue and bone, or metal and a crack). The <b>time taken</b> for the reflection (echo) to return to a detector tells us how far away the boundary is:</p>
<p style="text-align:center">distance to boundary = speed × time ÷ 2 &nbsp; (÷ 2 because the pulse goes there and back)</p>
[[d:ultrasound]]
<ul><li><b>Medical imaging:</b> pre-natal scans, imaging organs — non-ionising, so safe for a fetus.</li><li><b>Industrial imaging:</b> detecting cracks or flaws inside metal castings and welds.</li><li><b>Echo sounding</b> (sonar): high-frequency sound pulses detect objects in deep water (shoals of fish, submarines, wrecks) and measure water depth.</li></ul>` },
    { h: 'Seismic waves and the Earth’s core', ht: true, html: `
<p>Earthquakes produce <b>seismic waves</b>:</p>
<div class="tbl"><table><tr><th>P-waves</th><th>S-waves</th></tr><tr><td>longitudinal</td><td>transverse</td></tr><tr><td>travel through solids <b>and</b> liquids, at different speeds</td><td>travel through solids only — <b>cannot travel through liquids</b></td></tr><tr><td>faster — arrive first</td><td>slower</td></tr></table></div>
[[d:seismic]]
<p>Seismometers around the world detect the waves. There is a large <b>S-wave shadow zone</b> on the opposite side of the Earth from an earthquake: S-waves cannot pass through the core, so the <b>outer core must be liquid</b>. P-waves are refracted as their speed changes at the boundaries, creating a smaller P-wave shadow zone — evidence for the size of the core and a solid inner core. Studying seismic waves gave new evidence about parts of the Earth we cannot observe directly.</p>` }

TOPICS.push({
  id: '6.3', unit: '6', ref: '4.6.2.1–4.6.2.4', title: 'Electromagnetic waves', short: 'The EM spectrum, refraction, uses and dangers',
  summary: 'The seven groups of the electromagnetic spectrum, how they are produced and absorbed, refraction (including wave front diagrams for Higher), Required Practical 10 on infrared, and their uses and hazards.',
  spec: [
    'EM waves are transverse waves that transfer energy from the source to an absorber',
    'EM waves form a continuous spectrum; all travel at the same velocity through a vacuum (space) or air',
    'Long to short wavelength (low to high frequency): radio, microwave, infrared, visible (red to violet), ultraviolet, X-rays, gamma rays; our eyes detect only visible light',
    'Give examples that illustrate the transfer of energy by EM waves',
    '(HT) Different substances may absorb, transmit, refract or reflect EM waves in ways that vary with wavelength; refraction is due to the difference in velocity in different substances',
    'Construct ray diagrams to illustrate refraction at a boundary between two media',
    '(HT) Use wave front diagrams to explain refraction in terms of the change of speed',
    'Required practical 10: investigate how the amount of infrared radiation absorbed or radiated by a surface depends on the nature of that surface',

    'Changes in atoms and nuclei can generate or absorb EM waves over a wide frequency range; gamma rays originate from changes in the nucleus',

    '(HT) Give brief explanations why each type of EM wave is suitable for its application'
  ],
  learn: [
    { h: 'The electromagnetic spectrum', html: `
[[d:emspec]]
<p>Electromagnetic waves are <b>transverse</b> waves that transfer <b>energy</b> from a source to an absorber. They form a <b>continuous spectrum</b>, and all EM waves travel at the <b>same speed through a vacuum</b> (space) or air: 3 × 10<sup>8</sup> m/s.</p>
<p>From <b>long wavelength / low frequency</b> to <b>short wavelength / high frequency</b>:</p>
<p style="text-align:center;font-weight:600">radio → microwave → infrared → visible (red → violet) → ultraviolet → X-rays → gamma rays</p>
<p class="small muted">Memory aid: “Rich Men In Vegas Use eXpensive Gadgets”.</p>
<p>Our eyes detect only <b>visible light</b> — a tiny part of the spectrum. Examples of energy transfer: the Sun warms the Earth (infrared); a microwave oven heats food; light is absorbed by solar cells.</p>` },
    { h: 'Refraction', html: `
<p><b>Refraction</b> is the change in direction of a wave when it crosses a boundary between two media at an angle, because its <b>speed changes</b>.</p>
[[d:refraction]]
<ul><li>Entering a medium where it <b>slows down</b> (air → glass): bends <b>towards</b> the normal.</li><li>Entering a medium where it <b>speeds up</b> (glass → air): bends <b>away from</b> the normal.</li><li>Along the normal (angle of incidence 0°): no change in direction, but the speed still changes.</li></ul>
<div data-ht="1"><div class="box why"><b class="lbl">Wave front diagrams (Higher)</b><p>Wave fronts are lines joining the crests. When wave fronts hit a boundary at an angle, the part that enters the slower medium first slows down first, while the rest is still travelling faster. The wave front pivots, so the direction changes. The wave fronts are closer together in the slower medium (shorter wavelength, same frequency).</p></div>
<p><b>(HT)</b> Different substances may <b>absorb, transmit, refract or reflect</b> EM waves in ways that <b>vary with wavelength</b>. E.g. glass transmits visible light but absorbs much UV; the atmosphere transmits radio and visible light but absorbs most X-rays and gamma rays.</p></div>` },
    { h: 'Required practical 10: infrared radiation', html: `
[[d:leslie]]
<p><b>Emission (Leslie cube):</b> a metal cube with four different faces — matt black, shiny black, matt white and shiny silver — is filled with hot water from a kettle. Hold an infrared detector (or thermometer with a blackened bulb) the <b>same distance</b> from each face and record the reading.</p>
<p><b>Result:</b> matt black emits the most infrared; shiny silver the least.</p>
<p><b>Absorption:</b> place two metal plates (one matt black, one shiny silver) at equal distances from a radiant heater, with a drawing pin stuck on the back of each with wax. The pin on the matt black plate falls first — it absorbs infrared faster.</p>
<div class="box warn"><b class="lbl">Control variables &amp; safety</b><p>Same distance from each surface, same starting water temperature, same time to take readings. Take care with boiling water and the hot cube; stand it on a heatproof mat.</p></div>
<p>Good absorbers of infrared are also good emitters: <b>dark, matt</b> surfaces are the best; <b>light, shiny</b> surfaces are the worst (they reflect it).</p>` },
    { h: 'How EM waves are produced and absorbed', html: `
<p>Changes in <b>atoms</b> (electrons changing energy levels) and in the <b>nuclei</b> of atoms can generate or absorb EM waves over a wide range of frequencies. <b>Gamma rays</b> come from changes in the <b>nucleus</b>.</p>
<p class="ht-inline"><b>(HT)</b> <b>Radio waves</b> can be produced by <b>oscillations</b> (alternating currents) in electrical circuits — e.g. in a transmitting aerial. When radio waves are absorbed by a receiving aerial they can create an <b>alternating current with the same frequency</b> as the radio wave — so radio waves can induce oscillations in a circuit.</p>` },
    { h: 'Uses of EM waves', html: `
<div class="tbl"><table><tr><th>Wave</th><th>Uses</th><th class="ht-col">(HT) Why it is suitable</th></tr>
<tr><td>Radio</td><td>television and radio broadcasting</td><td class="ht-col">long wavelengths travel long distances and can diffract round hills and reflect off the ionosphere; not absorbed much by the atmosphere</td></tr>
<tr><td>Microwaves</td><td>satellite communications; cooking</td><td class="ht-col">pass through the atmosphere to satellites; absorbed by water molecules in food, heating it</td></tr>
<tr><td>Infrared</td><td>electric heaters; cooking (grills, toasters); infrared cameras</td><td class="ht-col">absorbed by surfaces, transferring energy to their thermal stores; all warm objects emit IR, so cameras detect it</td></tr>
<tr><td>Visible light</td><td>fibre optic communications</td><td class="ht-col">light is totally internally reflected along glass fibres with little absorption, carrying lots of data</td></tr>
<tr><td>Ultraviolet</td><td>energy-efficient lamps; sun tanning</td><td class="ht-col">UV makes a coating glow (fluorescence), giving light with little wasted energy; UV stimulates melanin in skin</td></tr>
<tr><td>X-rays and gamma</td><td>medical imaging and treatments</td><td class="ht-col">X-rays pass through soft tissue but are absorbed by bone; gamma penetrates and can kill cancer cells or sterilise equipment</td></tr></table></div>` },
    { h: 'Dangers of EM waves', html: `
<p>Ultraviolet, X-rays and gamma rays can have <b>hazardous effects</b> on body tissue. The effect depends on the <b>type of radiation</b> and the <b>size of the dose</b>. <b>Radiation dose</b> (in sieverts) is a measure of the risk of harm from exposure. 1000 mSv = 1 Sv.</p>
<ul><li><b>Ultraviolet</b> can cause skin to <b>age prematurely</b> and increases the risk of <b>skin cancer</b> (and can damage eyes).</li><li><b>X-rays and gamma rays</b> are <b>ionising</b> radiation that can cause <b>mutation of genes</b> and <b>cancer</b>.</li></ul>
<p>Precautions: sun cream and sunglasses; radiographers stand behind lead screens and wear dosimeters; patients have the smallest dose needed.</p>` }
  ],
  eqs: [['v = fλ', 'applies to all EM waves; v = 3 × 10⁸ m/s in a vacuum']],
  worked: [
    { q: 'A radio station broadcasts at 100 MHz. EM waves travel at 3.0 × 10⁸ m/s. Calculate the wavelength.', s: ['f = 100 MHz = 1.0 × 10⁸ Hz', '$λ = @frac{v}{f} = @frac{3.0 × 10^8}{1.0 × 10^8}$', 'λ = 3.0 m'], a: '3.0 m' },
    { q: 'Explain why a matt black car gets hotter in sunshine than a shiny white car.', s: ['Matt black surfaces are good absorbers of infrared radiation.', 'Shiny white surfaces reflect most of the radiation.', 'So the black car absorbs energy at a greater rate and its temperature rises more.'], a: 'Matt black absorbs infrared better; white/shiny reflects it.' }
  ],
  pitfalls: ['Getting the order of the spectrum wrong (learn a mnemonic).', 'Saying EM waves travel at different speeds in a vacuum.', 'Saying microwaves are ionising.', 'Saying refraction happens because the wave changes frequency — the speed changes.', 'Saying shiny surfaces absorb infrared well.'],
  cards: [

  ],
  quiz: [
    { q: 'Which EM wave has the longest wavelength?', o: ['radio', 'gamma', 'visible', 'microwave'], x: 'Radio waves: metres to kilometres.' },
    { q: 'Which EM wave has the highest frequency?', o: ['gamma rays', 'X-rays', 'ultraviolet', 'radio'], x: 'Short wavelength, high frequency.' },

    { q: 'Which surface is the best emitter of infrared?', o: ['matt black', 'shiny silver', 'matt white', 'shiny white'], x: 'RP10.' },
    { q: 'UV radiation can cause', o: ['skin cancer and premature ageing', 'ionisation of nuclei only', 'heating of food', 'gene mutation by radio frequencies'], x: 'Spec statement.' },

TOPICS.push({
  id: '6.4', unit: '6', ref: '4.6.2.5–4.6.2.6', po: true, title: 'Lenses and visible light', short: 'Ray diagrams, magnification, colour',
  summary: 'How convex and concave lenses form real and virtual images, magnification, and why objects look coloured — including specular and diffuse reflection and colour filters.',
  spec: [
    '(PO) A lens forms an image by refracting light; in a convex lens parallel rays are brought to a focus at the principal focus; the distance from lens to principal focus is the focal length',
    '(PO) Ray diagrams show image formation by convex and concave lenses; a convex lens can produce a real or virtual image; a concave lens always produces a virtual image',
    '(PO) Construct ray diagrams to illustrate the similarities and differences between convex and concave lenses',
    '(PO) Magnification = image height ÷ object height (equation sheet); a ratio with no units; heights in mm or cm',
    '(PO) Each colour in the visible spectrum has its own narrow band of wavelength and frequency',
    '(PO) Specular reflection: from a smooth surface in a single direction; diffuse reflection: from a rough surface, causing scattering',
    '(PO) Colour filters absorb certain wavelengths (colours) and transmit others',
    '(PO) The colour of an opaque object is determined by which wavelengths are most strongly reflected; others are absorbed; reflecting all equally → white; absorbing all → black',
    '(PO) Objects that transmit light are transparent or translucent',
    '(PO) Explain colour in terms of differential absorption, transmission and reflection; the effect of filters; why an opaque object has a particular colour'
  ],
  learn: [
    { h: 'Convex and concave lenses', html: `
<p>A lens forms an image by <b>refracting</b> light.</p>
[[d:lenses]]
<ul><li>A <b>convex</b> (converging) lens brings parallel rays of light to a focus at the <b>principal focus</b> (F). The distance from the lens to F is the <b>focal length</b>. A fatter (more curved) lens has a shorter focal length.</li><li>A <b>concave</b> (diverging) lens spreads parallel rays out so that they <b>appear to come from</b> a principal focus on the same side as the object.</li></ul>
<p>In ray diagrams, a convex lens is drawn as a vertical line with <b>outward-pointing arrowheads</b> ↕ and a concave lens with <b>inward-pointing arrowheads</b>.</p>` },
    { h: 'Drawing ray diagrams', html: `
<p>Draw two rays from the <b>top of the object</b>:</p>
<ol><li>A ray <b>parallel to the principal axis</b>, which is refracted <b>through F</b> on the far side (convex) — or away as if from F on the near side (concave).</li><li>A ray through the <b>centre of the lens</b>, which goes straight on.</li></ol>
<p>Where the rays meet is the top of the image. If the rays actually meet → <b>real</b> image (can be projected on a screen). If they only <b>appear</b> to meet when traced backwards (dashed lines) → <b>virtual</b> image.</p>
<div class="tbl"><table><tr><th>Lens & object position</th><th>Image</th><th>Use</th></tr>
<tr><td>Convex, object beyond 2F</td><td>real, inverted, diminished</td><td>camera, eye</td></tr>
<tr><td>Convex, object between F and 2F</td><td>real, inverted, magnified</td><td>projector</td></tr>
<tr><td>Convex, object closer than F</td><td>virtual, upright, magnified</td><td>magnifying glass</td></tr>
<tr><td>Concave, any position</td><td>virtual, upright, diminished</td><td>correcting short sight</td></tr></table></div>
<p>A <b>convex</b> lens can produce a <b>real or virtual</b> image; a <b>concave</b> lens <b>always</b> produces a <b>virtual</b> image.</p>` },
    { h: 'Magnification', html: `
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>magnification = image height ÷ object height</p></div>
<p>Magnification is a <b>ratio</b>, so it has <b>no units</b>. Measure both heights in the same unit (mm or cm). Magnification > 1 → image bigger than the object.</p>` },
    { h: 'Visible light and colour', html: `
<p>Each colour has its own <b>narrow band of wavelength and frequency</b>: red ≈ 700 nm (lowest frequency) through orange, yellow, green, blue to violet ≈ 400 nm (highest frequency).</p>
[[d:specular]]
<ul><li><b>Specular reflection</b> — from a <b>smooth</b> surface, in a single direction (a mirror gives a clear image).</li><li><b>Diffuse reflection</b> — from a <b>rough</b> surface; the light is <b>scattered</b> in many directions (paper — no image).</li></ul>
<p><b>Opaque objects:</b> the colour is determined by which wavelengths are <b>most strongly reflected</b>; the other wavelengths are <b>absorbed</b>. A red apple reflects red and absorbs other colours. An object that reflects all wavelengths equally looks <b>white</b>; one that absorbs all wavelengths looks <b>black</b>.</p>
<p><b>Transparent</b> objects (clear glass) transmit light without scattering it; <b>translucent</b> objects (frosted glass) transmit light but scatter it.</p>
<p><b>Colour filters</b> absorb certain wavelengths and transmit others. A red filter transmits red light only. So a green leaf seen through a red filter looks <b>black</b> — no green light gets through, and the leaf reflects no red.</p>` }
  ],
  eqs: [['"magnification" = @frac{"image height"}{"object height"}', 'equation sheet (physics only); no units']],
  worked: [
    { q: 'A magnifying glass produces an image 4.5 cm tall of an insect 1.5 cm long. Calculate the magnification.', s: ['magnification = image height ÷ object height', '= 4.5 ÷ 1.5', '= 3.0 (no units)'], a: '3.0' },
    { q: 'A white shirt with blue stripes is lit by red light only. Describe what it looks like.', s: ['The white parts reflect all colours, so they reflect the red light → appear red.', 'The blue stripes reflect only blue and absorb red → appear black.'], a: 'Red shirt with black stripes.' }
  ],
  pitfalls: ['Giving magnification a unit.', 'Saying a concave lens can form a real image.', 'Saying a red object “absorbs red” — it reflects red.', 'Saying filters add colour — they only remove (absorb) wavelengths.', 'Forgetting to draw virtual rays as dashed lines.'],
  cards: [
    ['How does a lens form an image?', 'By refracting light.', 'po'],
    ['What is the principal focus of a convex lens?', 'The point where parallel rays are brought to a focus.', 'po'],
    ['What is the focal length?', 'Distance from the lens to the principal focus.', 'po'],
    ['Can a concave lens form a real image?', 'No — always virtual.', 'po'],
    ['Real vs virtual image?', 'Real: rays actually meet (can be projected). Virtual: rays only appear to meet.', 'po'],
    ['Image from a magnifying glass?', 'Virtual, upright, magnified (object closer than F).', 'po'],
    ['Magnification equation?', 'image height ÷ object height (no units).', 'po'],
    ['Specular reflection?', 'From a smooth surface, in a single direction.', 'po'],
    ['Diffuse reflection?', 'From a rough surface — light scattered.', 'po'],
    ['Why is a banana yellow?', 'It reflects yellow light (most strongly) and absorbs other colours.', 'po'],
    ['What does a blue filter do?', 'Transmits blue light and absorbs other colours.', 'po'],
    ['Why does a white object look white?', 'It reflects all wavelengths equally.', 'po'],
    ['Transparent vs translucent?', 'Both transmit light; translucent scatters it.', 'po']

    { h: 'The magnetic effect of a current', html: `
<p>When a current flows through a wire, a <b>magnetic field</b> is produced around it. You can demonstrate this by placing plotting compasses around a vertical wire — they line up in a circle when the current is on, and reverse when the current is reversed.</p>
[[d:wirefield]]
<ul><li>The field lines are <b>concentric circles</b> around the wire.</li><li>The <b>right-hand grip rule</b>: grip the wire with your right thumb pointing along the current — your fingers curl in the direction of the field.</li><li>The field is <b>stronger</b> for a <b>larger current</b> and <b>closer to the wire</b>.</li></ul>` },
    { h: 'Solenoids and electromagnets', html: `
[[d:solenoid]]
<p>Shaping a wire into a coil called a <b>solenoid</b> makes the fields of all the turns add together, <b>increasing the strength</b> of the field.</p>
<ul><li>The field <b>inside</b> a solenoid is <b>strong and uniform</b> (parallel, evenly spaced lines).</li><li>The field <b>outside</b> has the same shape as a <b>bar magnet’s</b>.</li><li>Adding an <b>iron core</b> increases the strength further — the iron becomes an induced magnet. A solenoid with an iron core is an <b>electromagnet</b>.</li></ul>
<p>Electromagnets can be switched on and off and their strength controlled by the current (and number of turns). Uses: scrap-yard cranes, electric bells, relays, circuit breakers, door locks.</p>
<div data-po="1"><div class="box why"><b class="lbl">Interpreting devices (physics only)</b><p>In a <b>relay</b>, a small current in the coil magnetises the iron core, which attracts an iron armature and closes a switch in a second circuit (e.g. to switch on a car’s starter motor safely with a small current). In an <b>electric bell</b>, the electromagnet pulls the hammer to the gong, which breaks the circuit; a spring pulls it back, completing the circuit again — so it repeats.</p></div></div>` },
    { h: 'The motor effect and Fleming’s left-hand rule', ht: true, html: `
<p>When a conductor carrying a current is placed in a magnetic field, the magnet and the conductor <b>exert a force on each other</b>. This is the <b>motor effect</b>. The force is largest when the wire is at right angles to the field, and zero when parallel.</p>
[[d:fleming]]
<div class="box def"><b class="lbl">Fleming’s left-hand rule</b><p>Hold the thumb, first finger and second finger of your <b>left</b> hand at right angles: <b>F</b>irst finger = <b>F</b>ield (N → S); se<b>C</b>ond finger = <b>C</b>urrent; th<b>u</b>mb = motion (force).</p></div>
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>force = magnetic flux density × current × length &nbsp; $F = BIl$</p><p class="small">F in N, B in tesla (T), I in A, l in m — for a conductor at right angles to the field</p></div>
<p>The force increases with the <b>magnetic flux density</b> (stronger magnet), the <b>current</b> and the <b>length</b> of conductor in the field.</p>` },

<p>A <b>coil</b> of wire carrying a current in a magnetic field <b>tends to rotate</b>:</p>

<p>The motor turns faster with a larger current, a stronger magnet or more turns on the coil. Reversing the current or the field reverses the direction of rotation.</p>` },
    { h: 'Loudspeakers and headphones', po: true, ht: true, html: `
[[d:speaker]]
<p>Loudspeakers and headphones use the <b>motor effect</b> to convert <b>variations in current</b> into <b>pressure variations</b> in sound waves:</p>

    { h: 'The generator effect', html: `
<p>If an electrical conductor <b>moves relative to a magnetic field</b>, or the <b>magnetic field around a conductor changes</b>, a <b>potential difference is induced</b> across the ends of the conductor. If the conductor is part of a complete circuit, a <b>current is induced</b>. This is the <b>generator effect</b>.</p>
[[d:induction]]
<div class="tbl"><table><tr><th>Size of induced pd increases with…</th><th>Direction of induced pd reverses if…</th></tr><tr><td>faster movement (speed of the wire or magnet)<br>a stronger magnetic field<br>more turns on the coil</td><td>the direction of movement is reversed<br>the magnetic field (poles) is reversed</td></tr></table></div>
<p>An <b>induced current</b> produces its own magnetic field that <b>opposes the original change</b>. Push a north pole into a coil and the end of the coil nearest the magnet becomes a north pole, repelling it. That’s why you must do work to generate electricity.</p>` },

[[d:generator]]
<p>A coil rotating in a magnetic field has a pd induced across it, which changes as the coil turns.</p>
<ul><li>An <b>alternator</b> generates <b>ac</b>. It uses <b>slip rings</b> and brushes, so each end of the coil stays connected to the same side of the circuit — the output pd reverses every half turn.</li><li>A <b>dynamo</b> generates <b>dc</b>. It uses a <b>split-ring commutator</b>, which swaps the connections every half turn, so the output never reverses (it rises and falls but stays positive).</li></ul>
<p>On a pd–time graph, spinning the coil <b>faster</b> gives peaks that are <b>higher</b> (larger pd) and <b>closer together</b> (higher frequency).</p>` },

<p>It is a loudspeaker working in reverse.</p>` },

[[d:transformer]]
<p>A transformer has a <b>primary coil</b> and a <b>secondary coil</b> wound on an <b>iron core</b>. Iron is used because it is <b>easily magnetised</b>.</p>
<ol><li>An <b>alternating current</b> in the primary coil produces a <b>changing magnetic field</b> in the iron core.</li><li>This changing field passes through the secondary coil.</li><li>So an alternating pd is <b>induced</b> across the secondary coil.</li></ol>
<p>Transformers only work with ac — a steady dc would give an unchanging field and no induced pd.</p>
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>$@frac{V_p}{V_s} = @frac{n_p}{n_s}$ &nbsp;&nbsp; and (if 100% efficient) &nbsp;&nbsp; $V_s × I_s = V_p × I_p$</p><p class="small">power output (secondary) = power input (primary)</p></div>

/* ---- gens.js ---- */
/* ==========================================================
   Numerical question generators (AQA GCSE conventions: g = 9.8 N/kg, units m/s, J/kg °C …).
   Each returns { q, ans, unit, steps[] } with fresh values; answers are computed so
   every question is self-consistent. GEN_FLAGS marks Higher-tier (ht) / physics-only (po) ones.
   ========================================================== */
const GEN = {};
const s3 = x => sf(x, 3), s2 = x => sf(x, 2);
const G9 = 9.8;
const pk = a => a[Math.floor(Math.random() * a.length)];
const an = x => /^(8|11|18)/.test(String(x)) ? 'An' : 'A';
const GEN_FLAGS = { vtarea1: 'ht', mom4: 'ht', mom5: 'htpo', mom6: 'htpo', fmdt1: 'htpo', phrg1: 'htpo', phrg2: 'htpo', bil1: 'ht', bil2: 'ht', trans1: 'htpo', trans2: 'htpo', trans3: 'htpo', hl4: 'ht', brake2: 'ht',
  mom1: 'po', mom2: 'po', mom3: 'po', pfa1: 'po', pfa2: 'po', boyle1: 'po', boyle2: 'po', mag1: 'po', mag2: 'po', dose1: 'po', echo1: 'htpo', echo2: 'htpo', sound1: 'po' };

/* ---------- 1.1 Energy stores ---------- */
GEN.ke1 = () => { const m = pk([0.5, 2.0, 60, 75, 800, 1200, 1500]), v = rnd(2, 30, 1), E = 0.5 * m * v * v;
  return { q: `An object of mass ${m} kg moves at ${v} m/s. Calculate its kinetic energy.`, ans: E, unit: 'J', steps: ['$E_k = @frac{1}{2}mv^2$', `$E_k = 0.5 × ${m} × ${v}^2$`, `$E_k = ${s3(E)} "J"$`] }; };
GEN.ke2 = () => { const m = pk([2.0, 4.0, 50, 70, 1000]), v = rnd(3, 25, 1), E = 0.5 * m * v * v;
  return { q: `${an(m)} ${m} kg object has ${s3(E)} J of kinetic energy. Calculate its speed.`, ans: v, unit: 'm/s', steps: ['$v^2 = @frac{2E_k}{m}$', `$v^2 = @frac{2 × ${s3(E)}}{${m}} = ${s3(v * v)}$`, `$v = ${s3(v)} "m/s"$`] }; };
GEN.gpe1 = () => { const m = rnd(0.5, 80, 0.5), h = rnd(1, 50, 1), E = m * G9 * h;
  return { q: `${an(m)} ${m} kg object is lifted through ${h} m. g = 9.8 N/kg. Calculate the gain in gravitational potential energy.`, ans: E, unit: 'J', steps: ['$E_p = mgh$', `$E_p = ${m} × 9.8 × ${h}$`, `$E_p = ${s3(E)} "J"$`] }; };
GEN.gpe2 = () => { const m = rnd(1, 90, 1), h = rnd(2, 40, 0.5), E = m * G9 * h;
  return { q: `${an(m)} ${m} kg climber gains ${s3(E)} J of gravitational potential energy. g = 9.8 N/kg. How high did she climb?`, ans: h, unit: 'm', steps: ['$h = @frac{E_p}{mg}$', `$h = @frac{${s3(E)}}{${m} × 9.8}$`, `$h = ${s3(h)} "m"$`] }; };
GEN.epe1 = () => { const k = rnd(10, 400, 10), e = rnd(2, 30, 1), E = 0.5 * k * (e / 100) ** 2;
  return { q: `A spring with spring constant ${k} N/m is stretched by ${e} cm. Calculate the elastic potential energy stored.`, ans: E, unit: 'J', steps: [`e = ${e} cm = ${e / 100} m`, '$E_e = @frac{1}{2}ke^2$', `$E_e = 0.5 × ${k} × ${e / 100}^2 = ${s3(E)} "J"$`] }; };
GEN.fall1 = () => { const h = rnd(1, 45, 0.5), v = Math.sqrt(2 * G9 * h);
  return { q: `An object is dropped from rest from a height of ${h} m. Ignoring air resistance, calculate its speed just before it hits the ground. g = 9.8 N/kg.`, ans: v, unit: 'm/s', steps: ['Energy lost from gravitational store = energy gained by kinetic store: $mgh = @frac{1}{2}mv^2$', `Mass cancels: $v^2 = 2gh = 2 × 9.8 × ${h} = ${s3(2 * G9 * h)}$`, `$v = ${s3(v)} "m/s"$`] }; };

/* ---------- 1.2 SHC and power ---------- */
const MATS = [['water', 4200], ['aluminium', 900], ['copper', 385], ['iron', 450], ['concrete', 880], ['oil', 2000]];
GEN.shc1 = () => { const [n, c] = pk(MATS), m = rnd(0.2, 5, 0.1), dT = rnd(5, 60, 1), E = m * c * dT;
  return { q: `Calculate the energy needed to raise the temperature of ${m} kg of ${n} by ${dT} °C. Specific heat capacity of ${n} = ${c} J/kg °C.`, ans: E, unit: 'J', steps: ['$ΔE = mcΔθ$', `$ΔE = ${m} × ${c} × ${dT}$`, `$ΔE = ${s3(E)} "J"$`] }; };
GEN.shc2 = () => { const [n, c] = pk(MATS), m = rnd(0.5, 3, 0.5), dT = rnd(8, 40, 1), E = m * c * dT;
  return { q: `${an(m)} ${m} kg block is supplied with ${s3(E)} J and its temperature rises by ${dT} °C. Calculate the specific heat capacity of the material.`, ans: c, unit: 'J/kg °C', steps: ['$c = @frac{ΔE}{mΔθ}$', `$c = @frac{${s3(E)}}{${m} × ${dT}}$`, `$c = ${s3(c)} "J/kg °C"$ (${n})`] }; };
GEN.shc3 = () => { const m = rnd(0.5, 2, 0.1), P = pk([1000, 1500, 2000, 2400, 3000]), T0 = rnd(10, 25, 1), dT = 100 - T0, E = m * 4200 * dT, t = E / P;
  return { q: `${an(P)} ${P} W kettle heats ${m} kg of water from ${T0} °C to 100 °C. Assuming all the energy heats the water, calculate the time taken. c(water) = 4200 J/kg °C.`, ans: t, unit: 's', steps: [`$ΔE = mcΔθ = ${m} × 4200 × ${dT} = ${s3(E)} "J"$`, '$t = @frac{E}{P}$', `$t = @frac{${s3(E)}}{${P}} = ${s3(t)} "s"$`] }; };
GEN.power1 = () => { const E = rnd(500, 90000, 500), t = rnd(5, 300, 5), P = E / t;
  return { q: `A device transfers ${E} J of energy in ${t} s. Calculate its power.`, ans: P, unit: 'W', steps: ['$P = @frac{E}{t}$', `$P = @frac{${E}}{${t}}$`, `$P = ${s3(P)} "W"$`] }; };
GEN.power2 = () => { const P = pk([60, 100, 500, 1200, 2000, 3000]), mins = rnd(1, 30, 1), E = P * mins * 60;
  return { q: `${an(P)} ${P} W appliance is switched on for ${mins} minute${mins > 1 ? 's' : ''}. Calculate the energy transferred.`, ans: E, unit: 'J', steps: [`t = ${mins} × 60 = ${mins * 60} s`, '$E = Pt$', `$E = ${P} × ${mins * 60} = ${s3(E)} "J"$`] }; };
GEN.power3 = () => { const m = rnd(20, 200, 10), h = rnd(2, 30, 1), t = rnd(4, 40, 1), W = m * G9 * h, P = W / t;
  return { q: `A motor lifts ${an(m).toLowerCase()} ${m} kg load through ${h} m in ${t} s. g = 9.8 N/kg. Calculate the useful power output.`, ans: P, unit: 'W', steps: [`Work done = gain in $E_p = mgh = ${m} × 9.8 × ${h} = ${s3(W)} "J"$`, '$P = @frac{W}{t}$', `$P = @frac{${s3(W)}}{${t}} = ${s3(P)} "W"$`] }; };

/* ---------- 1.3 Efficiency ---------- */
GEN.eff1 = () => { const inp = rnd(200, 5000, 50), e = rnd(0.15, 0.9, 0.05), out = inp * e;
  return { q: `A machine is supplied with ${inp} J and transfers ${s3(out)} J usefully. Calculate its efficiency as a percentage.`, ans: e * 100, unit: '%', steps: ['efficiency = useful output ÷ total input', `= ${s3(out)} ÷ ${inp} = ${s2(e)}`, `= ${s3(e * 100)} %`] }; };
GEN.eff2 = () => { const P = rnd(20, 3000, 10), e = rnd(0.1, 0.95, 0.05), u = P * e;
  return { q: `A device has an input power of ${P} W and an efficiency of ${Math.round(e * 100)}%. Calculate its useful power output.`, ans: u, unit: 'W', steps: ['useful power output = efficiency × total power input', `= ${e.toFixed(2)} × ${P}`, `= ${s3(u)} W`] }; };
GEN.eff3 = () => { const u = rnd(5, 900, 5), e = rnd(0.2, 0.9, 0.05), P = u / e;
  return { q: `A motor produces a useful power output of ${u} W with an efficiency of ${e.toFixed(2)}. Calculate the total power input.`, ans: P, unit: 'W', steps: ['total power input = useful power output ÷ efficiency', `= ${u} ÷ ${e.toFixed(2)}`, `= ${s3(P)} W`] }; };
GEN.eff4 = () => { const inp = rnd(1000, 20000, 500), e = rnd(0.2, 0.85, 0.05), w = inp * (1 - e);
  return { q: `An engine is ${Math.round(e * 100)}% efficient. It is supplied with ${inp} J. How much energy is wasted?`, ans: w, unit: 'J', steps: [`useful output = ${e.toFixed(2)} × ${inp} = ${s3(inp * e)} J`, 'wasted = total input − useful output', `= ${inp} − ${s3(inp * e)} = ${s3(w)} J`] }; };

/* ---------- 2.1 Q = It, V = IR ---------- */
GEN.qit1 = () => { const I = rnd(0.1, 5, 0.1), mins = rnd(1, 20, 1), Q = I * mins * 60;
  return { q: `A current of ${I} A flows for ${mins} minute${mins > 1 ? 's' : ''}. Calculate the charge that flows.`, ans: Q, unit: 'C', steps: [`t = ${mins * 60} s`, '$Q = It$', `$Q = ${I} × ${mins * 60} = ${s3(Q)} "C"$`] }; };
GEN.qit2 = () => { const Q = rnd(10, 600, 10), t = rnd(5, 120, 5), I = Q / t;
  return { q: `${Q} C of charge flows through a lamp in ${t} s. Calculate the current.`, ans: I, unit: 'A', steps: ['$I = @frac{Q}{t}$', `$I = @frac{${Q}}{${t}}$`, `$I = ${s3(I)} "A"$`] }; };
GEN.vir1 = () => { const I = rnd(0.1, 3, 0.05), R = rnd(2, 200, 2), V = I * R;
  return { q: `A current of ${I} A flows through ${an(R).toLowerCase()} ${R} Ω resistor. Calculate the potential difference across it.`, ans: V, unit: 'V', steps: ['$V = IR$', `$V = ${I} × ${R}$`, `$V = ${s3(V)} "V"$`] }; };
GEN.vir2 = () => { const V = pk([1.5, 3, 4.5, 6, 9, 12, 24, 230]), R = rnd(4, 500, 2), I = V / R;
  return { q: `${an(V)} ${V} V supply is connected across ${an(R).toLowerCase()} ${R} Ω resistor. Calculate the current.`, ans: I, unit: 'A', steps: ['$I = @frac{V}{R}$', `$I = @frac{${V}}{${R}}$`, `$I = ${s3(I)} "A"$`] }; };
GEN.vir3 = () => { const mA = rnd(20, 900, 10), V = rnd(1, 12, 0.5), R = V / (mA / 1000);
  return { q: `The current through a component is ${mA} mA when the pd across it is ${V} V. Calculate its resistance.`, ans: R, unit: 'Ω', steps: [`I = ${mA} mA = ${mA / 1000} A`, '$R = @frac{V}{I}$', `$R = @frac{${V}}{${mA / 1000}} = ${s3(R)} Ω$`] }; };

/* ---------- 2.2 I–V ---------- */
GEN.ivr1 = () => { const V = rnd(1, 12, 0.5), I = rnd(0.05, 0.8, 0.05), R = V / I;
  return { q: `A point on the I–V graph of a filament lamp is at V = ${V} V, I = ${I} A. Calculate the resistance of the lamp at this point.`, ans: R, unit: 'Ω', steps: ['At any point, $R = @frac{V}{I}$ (not the gradient)', `$R = @frac{${V}}{${I}}$`, `$R = ${s3(R)} Ω$`] }; };

/* ---------- 2.3 Series / parallel ---------- */
GEN.ser1 = () => { const a = rnd(2, 100, 1), b = rnd(2, 100, 1), c = Math.random() < 0.4 ? rnd(2, 50, 1) : 0, R = a + b + c;
  return { q: `Resistors of ${a} Ω, ${b} Ω${c ? ` and ${c} Ω` : ''} are connected in series. Calculate the total resistance.`, ans: R, unit: 'Ω', steps: ['In series, resistances add: $R_{"total"} = R_1 + R_2 + …$', `$R_{"total"} = ${a} + ${b}${c ? ' + ' + c : ''} = ${R} Ω$`] }; };
GEN.ser2 = () => { const V = pk([6, 9, 12, 24]), a = rnd(2, 40, 1), b = rnd(2, 40, 1), I = V / (a + b);

/* ==========================================================
   Simulation framework + Unit 1 & 2 simulations
   ========================================================== */
const SIMS = {};
let simTheme = null;
function refreshSimTheme() { simTheme = themeColors(); }

/* ---- canvas helpers ---- */
const CV = {
  line(c, x1, y1, x2, y2, col, w = 1.5, dash) { c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]); },
  arrow(c, x1, y1, x2, y2, col, w = 2, hs = 9) {
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 1) return; const a = Math.atan2(y2 - y1, x2 - x1);
    CV.line(c, x1, y1, x2 - Math.cos(a) * hs * .6, y2 - Math.sin(a) * hs * .6, col, w);
    c.fillStyle = col; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(a - .42), y2 - hs * Math.sin(a - .42)); c.lineTo(x2 - hs * Math.cos(a + .42), y2 - hs * Math.sin(a + .42)); c.closePath(); c.fill();
  },
  text(c, s, x, y, col, size = 12, align = 'left', weight = 500, font = 'IBM Plex Sans, system-ui, sans-serif') { c.fillStyle = col; c.font = `${weight} ${size}px ${font}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); },
  mono(c, s, x, y, col, size = 12, align = 'left') { CV.text(c, s, x, y, col, size, align, 500, 'IBM Plex Mono, ui-monospace, monospace'); },
  circle(c, x, y, r, fill, stroke, w = 1.5) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = w; c.stroke(); } },
  rrect(c, x, y, w, h, r, fill, stroke, lw = 1.5) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } },
  grid(c, w, h, C, step = 24) { c.strokeStyle = C.grid; c.lineWidth = 1; c.beginPath(); for (let x = 0; x <= w; x += step) { c.moveTo(x + .5, 0); c.lineTo(x + .5, h); } for (let y = 0; y <= h; y += step) { c.moveTo(0, y + .5); c.lineTo(w, y + .5); } c.stroke(); },
  /* mini plot: box {x,y,w,h}, ranges, series [{pts|f, col, w, dash}] */
  plot(c, C, b, o) {
    const { x, y, w, h } = b, [x0, x1] = o.xr, [y0, y1] = o.yr;
    const X = v => x + (v - x0) / (x1 - x0) * w, Y = v => y + h - (v - y0) / (y1 - y0) * h;
    CV.rrect(c, x - 8, y - 8, w + 16, h + 26, 8, C.surface, C.line, 1);
    c.save(); c.beginPath(); c.rect(x, y - 2, w, h + 4); c.clip();
    (o.fills || []).forEach(f => { c.fillStyle = f.col; c.beginPath(); c.moveTo(X(f.pts[0][0]), Y(0)); f.pts.forEach(p => c.lineTo(X(p[0]), Y(p[1]))); c.lineTo(X(f.pts[f.pts.length - 1][0]), Y(0)); c.fill(); });
    (o.series || []).forEach(s => {
      c.strokeStyle = s.col; c.lineWidth = s.w || 2; c.setLineDash(s.dash || []); c.beginPath(); let pen = false;
      if (s.f) { for (let i = 0; i <= 200; i++) { const xv = x0 + (x1 - x0) * i / 200, yv = s.f(xv); if (!isFinite(yv)) { pen = false; continue; } pen ? c.lineTo(X(xv), Y(yv)) : c.moveTo(X(xv), Y(yv)); pen = true; } }
      else s.pts.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])));
      c.stroke(); c.setLineDash([]);
    });
    (o.dots || []).forEach(d => CV.circle(c, X(d[0]), Y(d[1]), d[3] || 4.5, d[2] || C.accent));
    c.restore();
    const ay = (y0 < 0 && y1 > 0) ? Y(0) : y + h;
    CV.line(c, x, ay, x + w, ay, C.ink, 1.2); CV.line(c, x, y, x, y + h, C.ink, 1.2);
    if (o.xl) CV.text(c, o.xl, x + w, y + h + 10, C.muted, 10.5, 'right');
    if (o.yl) CV.text(c, o.yl, x + 4, y + 4, C.muted, 10.5, 'left');
    return { X, Y };
  }
};
function hexA(col, a) { // accepts #rrggbb or rgb(...) → rgba
  if (!col) return `rgba(0,0,0,${a})`;
  if (col.startsWith('#')) { const n = parseInt(col.slice(1).length === 3 ? col.slice(1).split('').map(x => x + x).join('') : col.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
  return col.replace('rgb(', 'rgba(').replace(')', `,${a})`);
}

/* ---- mount ---- */
function mountSim(host, key) {
  const def = SIMS[key]; if (!def) { host.innerHTML = '<div class="empty">Simulation unavailable.</div>'; return () => { }; }
  refreshSimTheme();
  const st = { t: 0, run: def.autoplay !== false, p: {}, key };
  (def.controls || []).forEach(c => { if (c.id) st.p[c.id] = c.value; });
  const ctl = (def.controls || []).map(c => {
    if (c.type === 'seg') return `<div class="ctl"><label>${c.label}</label><div class="seg" data-id="${c.id}">${c.options.map(o => `<button type="button" data-v="${esc(o[0])}" class="${o[0] == c.value ? 'on' : ''}">${o[1]}</button>`).join('')}</div></div>`;
    if (c.type === 'button') return `<button type="button" class="btn sm" data-act="${c.act}">${c.label}</button>`;
    return `<div class="ctl"><label for="sc-${key}-${c.id}">${sqrtify(c.label)}<output>${c.fmt ? c.fmt(c.value) : c.value}</output></label><input id="sc-${key}-${c.id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" data-id="${c.id}"></div>`;
  }).join('');
  const btnRow = (def.controls || []).filter(c => c.type === 'button').length;
  host.innerHTML = `<div class="sim"><div class="sim-stage" style="height:${(def.hNarrow && innerWidth < 600 ? def.hNarrow : def.h) || 440}px"><canvas aria-label="${esc(def.title)} simulation"></canvas></div>
    <div class="sim-ctl"><div class="row" style="justify-content:space-between"><div class="sim-title">${def.title}</div>
    <div class="row" style="gap:6px">${def.noPlay ? '' : `<button type="button" class="icon-btn" data-act="__play" title="Play / pause" aria-label="Play or pause">${st.run ? ICON.pause : ICON.play}</button>`}<button type="button" class="icon-btn" data-act="__reset" title="Reset" aria-label="Reset">${ICON.reset}</button></div></div>
    ${ctl.replace(/<button type="button" class="btn sm"[\s\S]*?<\/button>/g, '')}
    ${btnRow ? `<div class="row" style="gap:8px">${(def.controls || []).filter(c => c.type === 'button').map(c => `<button type="button" class="btn sm" data-act="${c.act}">${c.label}</button>`).join('')}</div>` : ''}
    <div class="readouts">${(def.readouts || []).map((r, i) => `<div class="ro"><span>${sqrtify(r)}</span><b data-ro="${i}">—</b></div>`).join('')}</div>

  const cv = $('canvas', host), stage = $('.sim-stage', host), c = cv.getContext('2d');
  let W = 0, H = 0;
  const size = () => { const r = stage.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); st.W = W; st.H = H; def.resize && def.resize(st); };
  const ro = new ResizeObserver(size); ro.observe(stage); size();

  host.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === '__play') { st.run = !st.run; b.innerHTML = st.run ? ICON.pause : ICON.play; }

  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  if (def.pointer) {
    let down = false;
    cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); def.pointer('down', ...pos(e), st); });

  };
  raf = requestAnimationFrame(loop);
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}

  lamp(c, x, y, col, bg, glow = 0) { if (glow > 0.02) { const gr = c.createRadialGradient(x, y, 2, x, y, 12 + 30 * glow); gr.addColorStop(0, `rgba(255,220,120,${0.9 * glow})`); gr.addColorStop(1, 'rgba(255,200,80,0)'); c.fillStyle = gr; c.beginPath(); c.arc(x, y, 12 + 30 * glow, 0, 7); c.fill(); } CV.circle(c, x, y, 12, glow > 0.02 ? `rgba(255,226,140,${0.3 + 0.7 * glow})` : bg, col, 2); CV.line(c, x - 8.5, y - 8.5, x + 8.5, y + 8.5, col, 1.6); CV.line(c, x + 8.5, y - 8.5, x - 8.5, y + 8.5, col, 1.6); },

/* ---------- 3.3 Gas pressure (reworked from the A-level sim for GCSE: °C, pV = constant) ---------- */
SIMS.gas = {
  title: 'Gas pressure', h: 460,
  controls: [
    { id: 'T', label: 'Temperature', min: -100, max: 500, step: 10, value: 20, fmt: v => v + ' °C' },

  init(st) { const N = 200; st.m = Array.from({ length: N }, () => { const gg = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()), s = this.spd(st.p.T) / Math.SQRT2; return { x: Math.random() * st.p.V, y: Math.random(), vx: gg() * s, vy: gg() * s }; }); st.imp = 0; st.hits = 0; st.pm = 0; st.hr = 0; st.win = 0; st.lastT = st.p.T; },
  spd(T) { return 0.35 * Math.sqrt((T + 273) / 293); },
  step(st, dt) {

      if (m.x < 0) { m.x = -m.x; m.vx = -m.vx; st.imp += 2 * Math.abs(m.vx); st.hits++; } if (m.x > Vx) { m.x = 2 * Vx - m.x; m.vx = -Math.abs(m.vx); st.imp += 2 * Math.abs(m.vx); st.hits++; }
      if (m.y < 0) { m.y = -m.y; m.vy = -m.vy; st.imp += 2 * Math.abs(m.vy); st.hits++; } if (m.y > 1) { m.y = 2 - m.y; m.vy = -m.vy; st.imp += 2 * Math.abs(m.vy); st.hits++; } });
    st.win += dt; if (st.win > 1.2) { const per = 2 * (p.V + 1), m = st.imp / st.win / per; st.pm = st.pm ? st.pm * .5 + .5 * m : m; st.hr = st.hr ? st.hr * .5 + .5 * st.hits / st.win : st.hits / st.win; st.imp = 0; st.hits = 0; st.win = 0; }

    const gx = bx + bw + 60; if (W - gx > 120) { const pr = st.pm * 100, maxp = 900; CV.rrect(c, gx, by + 20, 44, bh - 40, 8, C.surface, C.ink, 1.5); const hh = clamp(pr / maxp, 0, 1) * (bh - 44); CV.rrect(c, gx + 4, by + bh - 22 - hh, 36, hh, 6, C.u1); CV.text(c, 'pressure', gx + 22, by + 8, C.muted, 11, 'center'); CV.text(c, 'blue = slow · red = fast', gx - 20, by + bh + 14, C.muted, 10.5); }
  },
  read(st) { const p = st.p, pr = st.pm * 100; return [pr.toFixed(0) + ' (sim units)', (pr * p.V * 10).toFixed(0) + ' (sim units)', (this.spd(p.T) * 1300).toFixed(0) + ' m/s (scaled)', Math.round(st.hr) + ' /s']; }
};

/* ---------- 4.1 Build an atom ---------- */
const ELEMENTS = ['', 'hydrogen', 'helium', 'lithium', 'beryllium', 'boron', 'carbon', 'nitrogen', 'oxygen', 'fluorine', 'neon', 'sodium', 'magnesium', 'aluminium', 'silicon', 'phosphorus', 'sulfur', 'chlorine', 'argon', 'potassium', 'calcium'];

SIMS.atom = {
