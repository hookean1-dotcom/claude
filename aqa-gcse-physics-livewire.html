<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Wire Physics</title>
<meta name="description" content="Live Wire: an interactive study app for AQA GCSE Physics (8463) — notes, simulations, required practicals, flashcards, quizzes, unlimited calculations and exam practice for Foundation and Higher tier.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* ==========================================================
   Live Wire · AQA GCSE Physics
   Tokens: light = graph paper, dark = lab bench at night
   ========================================================== */
:root{
  --paper:#EDF1F3;
  --paper-2:#E3E9ED;
  --grid:#D5DEE4;
  --grid-2:#C4D0D8;
  --surface:#FFFFFF;
  --surface-2:#F6F8F9;
  --ink:#13202B;
  --ink-2:#2B3A47;
  --muted:#5B6C79;
  --faint:#8A99A5;
  --line:#D3DCE2;
  --line-2:#BAC7D0;
  --accent:#E39B12;          /* sodium D line 589 nm */
  --accent-ink:#8F5A00;
  --accent-soft:#FBEBC8;
  --good:#1F8A4C; --good-soft:#DDF3E5;
  --bad:#C4372F;  --bad-soft:#FBE2DF;
  --warn:#B7791F; --warn-soft:#FCEFD6;
  --info:#1C6FA8; --info-soft:#DCEBF6;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 4px 16px rgba(19,32,43,.06);
  --shadow-lg:0 12px 40px rgba(19,32,43,.16);
  --canvas-bg:#FBFCFD;
  --canvas-grid:#E4EAEE;
  --canvas-ink:#13202B;
  --u1:#E5484D; --u2:#E39B12; --u3:#3DAE5B; --u4:#0F9D8A; --u5:#2F7FE0; --u6:#16A3C6; --u7:#7B5BD6; --u8:#C0469A; --u9:#5B6C79;
  --uc:var(--accent);
  --r:10px; --r-lg:16px;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",Times,serif;
  --side:256px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1017; --paper-2:#0E151E; --grid:#141E29; --grid-2:#1B2735;
    --surface:#111A24; --surface-2:#16212D; --ink:#E4ECF2; --ink-2:#C5D1DB;
    --muted:#8C9DAB; --faint:#627383; --line:#1F2C3A; --line-2:#2B3B4C;
    --accent:#FFB547; --accent-ink:#FFC56E; --accent-soft:#3A2A0E;
    --good:#4CC67A; --good-soft:#12301F; --bad:#FF6B61; --bad-soft:#3A1614;
    --warn:#F2B34C; --warn-soft:#352812; --info:#5AB0EA; --info-soft:#10283A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
    --shadow-lg:0 16px 50px rgba(0,0,0,.5);
    --canvas-bg:#0C131B; --canvas-grid:#18232F; --canvas-ink:#E4ECF2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1017; --paper-2:#0E151E; --grid:#141E29; --grid-2:#1B2735;
  --surface:#111A24; --surface-2:#16212D; --ink:#E4ECF2; --ink-2:#C5D1DB;
  --muted:#8C9DAB; --faint:#627383; --line:#1F2C3A; --line-2:#2B3B4C;
  --accent:#FFB547; --accent-ink:#FFC56E; --accent-soft:#3A2A0E;
  --good:#4CC67A; --good-soft:#12301F; --bad:#FF6B61; --bad-soft:#3A1614;
  --warn:#F2B34C; --warn-soft:#352812; --info:#5AB0EA; --info-soft:#10283A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
  --shadow-lg:0 16px 50px rgba(0,0,0,.5);
  --canvas-bg:#0C131B; --canvas-grid:#18232F; --canvas-ink:#E4ECF2;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
[hidden]{display:none!important}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:18px 14px 20px;
  scrollbar-width:thin;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#0A1017;position:relative;overflow:hidden;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand-mark i{position:absolute;top:5px;bottom:5px;width:2px;border-radius:1px;filter:drop-shadow(0 0 3px currentColor)}
.brand-name{font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand-sub{font:500 10.5px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-label{font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a,.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;
  color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;text-align:left
}
.nav a:hover,.nav button:hover{background:var(--surface-2)}
.nav a.on{background:var(--paper-2);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .unit-a{align-items:flex-start}
.unit-line{width:3px;align-self:stretch;border-radius:2px;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.unit-a small{display:block;font:500 11px/1.3 var(--f-mono);color:var(--faint);letter-spacing:.03em}
.nav .meter{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--faint);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;gap:10px;padding:10px 28px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.crumbs{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.crumbs b{color:var(--ink);font-weight:600}
.search-btn{display:flex;align-items:center;gap:8px;min-width:220px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
.search-btn:hover{border-color:var(--line-2)}
.search-btn kbd{margin-left:auto}
kbd{font:500 11px var(--f-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{padding:28px 28px 80px;max-width:1240px;width:100%;margin:0 auto}
.view.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Mobile ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:60;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,10,15,.45);z-index:55}
  .top{padding:8px 16px}
  .search-btn{min-width:0;flex:none}
  .search-btn span,.search-btn kbd{display:none}
  .view{padding:18px 16px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10.5px var(--f-body);color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabbar a.on{color:var(--ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .hide-m{display:none!important}
}
@media (min-width:901px){.menu-btn{display:none!important}}

/* ---------- Type ---------- */
h1,h2,h3,h4{text-wrap:balance;margin:0}
.display{font:800 clamp(38px,6vw,68px)/.92 var(--f-display);letter-spacing:.005em;text-transform:uppercase}
.h2{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.h3{font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font:600 11.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;color:var(--ink-2);max-width:62ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.sec-head .h2,.sec-head .h3{flex:none}
.sec-head .muted{font-size:14px}

/* ---------- Math ---------- */
.m{font-family:var(--f-math);font-size:1.08em;white-space:nowrap;letter-spacing:.01em}
.m i{font-style:italic;padding-right:.04em}
.m .rm{font-style:normal}
.m sub,.m sup{font-size:.7em;line-height:0}
.m sub{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.15}
.fr>.nu{border-bottom:1px solid currentColor;padding:0 .15em}
.fr>.de{padding:0 .15em}
.sq{position:relative;display:inline-block;padding-left:.66em;white-space:nowrap}
.sq .rs{position:absolute;left:0;top:0;width:.66em;height:100%;overflow:visible;fill:none;stroke:currentColor}
.sq .rs path{stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}
.sq .ra{display:inline-block;border-top:1.3px solid currentColor;padding:.14em .1em 0 .06em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ov{text-decoration:overline}
.eqbig .m{font-size:1.4em}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1B1203}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--uc);border-radius:3px;transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--f-mono);letter-spacing:.02em;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--uc);box-shadow:0 0 6px var(--uc);flex:none}

/* ---------- Home ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#070B10;color:#E8EEF3;padding:30px 30px 26px;border:1px solid #1B2632;box-shadow:var(--shadow-lg)}
.hero canvas.spec{display:block;width:100%;height:120px;border-radius:10px;margin-top:22px;background:#020406}
.hero .display{color:#F3F6F8}
.hero .eyebrow{color:#8FA2B1}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:end}
.hero p{color:#B9C6D0;max-width:52ch;margin:12px 0 0}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px}
.hstat b{display:block;font:800 32px/1 var(--f-display);color:#fff;font-variant-numeric:tabular-nums}
.hstat span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#8FA2B1}
.spec-axis{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:#6D8091;margin-top:6px;letter-spacing:.05em}
.hero .btn{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff}
.hero .btn.accent{background:#FFB547;border-color:#FFB547;color:#1B1203}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding:22px 18px}}

.unit-card{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:18px 18px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.unit-card:hover{transform:translateY(-2px);border-color:var(--uc)}
.unit-card .line{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.unit-card .nm{font:500 11px var(--f-mono);color:var(--muted)}
.unit-card .h3{font-size:22px}

.topic-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--uc);transform:translateY(-1px)}
.tcard .no{grid-row:span 3;font:800 30px/1 var(--f-display);color:var(--uc);min-width:52px}
.tcard .tt{font-weight:600;font-size:15px;line-height:1.3}
.tcard .ts{font-size:12.5px;color:var(--muted);line-height:1.4}
.tcard .bar{margin-top:6px}

/* ---------- Topic page ---------- */
.topic-head{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:end;margin-bottom:18px}
.topic-no{grid-row:span 2;font:800 clamp(64px,10vw,112px)/.8 var(--f-display);color:var(--uc);text-shadow:0 0 30px color-mix(in srgb,var(--uc) 35%,transparent)}
.topic-head .display{font-size:clamp(32px,5vw,54px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--uc);box-shadow:0 0 8px var(--uc)}
.tab .n{font:500 11px var(--f-mono);color:var(--faint)}
.layout-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:1100px){.layout-2{grid-template-columns:1fr}}
.aside{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.aside{position:static}}

/* notes */
.notes{max-width:74ch}
.notes section{margin-bottom:34px;scroll-margin-top:130px}
.notes h3{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.notes h3 .k{font:600 12px var(--f-mono);color:var(--uc);letter-spacing:.06em}
.notes h4{font-size:16px;margin:18px 0 6px}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin:4px 0}
.notes table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;width:100%}
.notes th,.notes td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.notes th{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0 14px}
.tbl table{margin:0}
.box{position:relative;border-radius:12px;padding:14px 16px 12px;margin:14px 0;background:var(--surface);border:1px solid var(--line)}
.box>b.lbl{display:inline-block;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.def{border-left:3px solid var(--uc)}
.box.def>b.lbl{color:var(--uc)}
.box.tip{background:var(--accent-soft);border-color:transparent}
.box.tip>b.lbl{color:var(--accent-ink)}
.box.warn{background:var(--bad-soft);border-color:transparent}
.box.warn>b.lbl{color:var(--bad)}
.box.eq{text-align:center;font-size:18px;padding:18px}
.box.why{background:var(--info-soft);border-color:transparent}
.box.why>b.lbl{color:var(--info)}
.fig{margin:16px 0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;font-size:13.5px}
.toc a:hover{color:var(--ink);border-color:var(--uc)}

.spec-list{display:flex;flex-direction:column;gap:6px}
.spec-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.45;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.rag{display:flex;gap:3px;margin-top:1px}
.rag button{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-2);background:none;padding:0}
.rag button.on[data-v="1"]{background:var(--bad);border-color:var(--bad)}
.rag button.on[data-v="2"]{background:var(--warn);border-color:var(--warn)}
.rag button.on[data-v="3"]{background:var(--good);border-color:var(--good)}

.eq-row{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 16px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.eq-row:last-child{border:0}
.eq-row .m{font-size:1.2em}
.eq-row span.d{font-size:13px;color:var(--muted)}
.eq-tag{font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--paper-2);color:var(--muted);margin-left:6px;vertical-align:middle}
.eq-tag.nb{background:var(--warn-soft);color:var(--warn)}

/* worked */
.worked{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:16px}
.worked .wq{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.worked ol{margin:0;padding:12px 18px 12px 42px}
.worked li{margin:6px 0}
.worked li.hid{display:none}
.worked .wf{display:flex;gap:10px;padding:10px 18px 14px;align-items:center;flex-wrap:wrap}
.ans{font-weight:600;padding:8px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:760px}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.q-prog{flex:1;min-width:120px;display:flex;gap:3px}
.q-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.q-prog i.c{background:var(--good)} .q-prog i.w{background:var(--bad)} .q-prog i.cur{background:var(--uc)}
.q-text{font-size:19px;line-height:1.5;margin:6px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;line-height:1.45;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--line-2);transform:translateX(2px)}
.opt .k{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--paper-2);font:600 13px var(--f-mono)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.explain b.v{font:700 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.explain b.v.good{color:var(--good)} .explain b.v.bad{color:var(--bad)}
.result{text-align:center;padding:30px 20px}
.result .big{font:800 88px/1 var(--f-display);color:var(--uc)}

/* calc practice */
.calc-q{font-size:17.5px;line-height:1.55;margin-bottom:14px}
.calc-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc-in input{width:200px;max-width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font:500 17px var(--f-mono)}
.calc-in input:focus{outline:none;border-color:var(--uc)}
.calc-in .unit{font-family:var(--f-math);font-size:17px}
.steps{margin-top:14px;padding:14px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.steps ol{margin:6px 0 0;padding-left:20px}
.steps li{margin:5px 0}

/* exam */
.examq{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.examq .eh{display:flex;gap:12px;padding:16px 18px;align-items:flex-start}
.examq .eh .mk{margin-left:auto;flex:none}
.examq textarea{display:block;width:calc(100% - 36px);margin:0 18px 12px;min-height:90px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);resize:vertical;font-size:14.5px}
.ms{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px;cursor:pointer}
.ms input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}

/* flashcards */
.fc-stage{perspective:1400px;max-width:640px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:19px;line-height:1.5;overflow:auto}
.fc>div .eyebrow{position:absolute;top:18px;left:0;right:0}
.fc .back{transform:rotateY(180deg);background:var(--surface-2)}
.fc .front::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:3px;border-radius:0 3px 3px 0;background:var(--uc);box-shadow:0 0 10px var(--uc)}
.fc-ctl{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.boxes{display:flex;gap:6px;justify-content:center;margin-top:14px}
.boxes span{font:500 11px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--paper-2);color:var(--muted)}

/* ---------- Sims ---------- */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sim-stage{position:relative;background:var(--canvas-bg);min-height:360px;border-right:1px solid var(--line)}
.sim-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.sim-ctl{padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.sim-title{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px;gap:8px}
.ctl label output{font:600 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:10px;background:var(--paper-2)}
.seg button{flex:1;padding:6px 8px;border:0;border-radius:7px;background:none;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.ro span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ro{min-width:0}
.ro b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sim-note{font-size:13px;color:var(--ink-2);line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.sim-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
@media (max-width:900px){.sim{grid-template-columns:1fr}.sim-stage{border-right:0;border-bottom:1px solid var(--line);min-height:300px}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--uc) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--uc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--uc);margin-top:-7px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--uc)}
select{padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)}

/* ---------- Search palette ---------- */
.palette-back{position:fixed;inset:0;background:rgba(5,10,15,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.palette{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;background:none;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:55vh;overflow-y:auto}
.palette li a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none}
.palette li a.sel,.palette li a:hover{background:var(--surface-2)}
.palette li .t{font-weight:500}
.palette li .s{font-size:12.5px;color:var(--muted)}
.palette .kind{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---------- Toast & fx ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
@media (max-width:900px){.toasts{bottom:84px;right:12px;left:12px;align-items:stretch}}
.toast{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow-lg);font-size:14px;animation:tin .3s ease}
.toast b{font:800 18px var(--f-display);color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:150;width:100%;height:100%}

/* ---------- Arcade ---------- */
.game-card{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .15s}
.game-card:hover{transform:translateY(-2px)}
.game-card .art{height:110px;border-radius:12px;background:#070B10;position:relative;overflow:hidden}
.game-card .art canvas{width:100%;height:100%;display:block}
.game{max-width:760px;margin:0 auto}
.game-hud{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hud{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:90px}
.hud span{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud b{font:800 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.big-prompt{font:700 clamp(26px,4vw,38px)/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:10px 0 20px;text-align:center}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.quark-bin{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.quark{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:600 26px var(--f-math);font-style:italic;border:2px solid;background:var(--surface);transition:transform .1s}
.quark:hover{transform:scale(1.06)}
.quark small{display:block;font:500 10.5px var(--f-mono);font-style:normal;margin-top:-18px}
.hadron{min-height:120px;display:flex;gap:12px;justify-content:center;align-items:center;border:2px dashed var(--line-2);border-radius:60px;padding:16px;margin:0 auto;max-width:360px}

/* ---------- Equation sheet ---------- */
.eq-section{break-inside:avoid;margin-bottom:18px}
.eq-cols{columns:2 420px;column-gap:22px}
.eq-card{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px;display:inline-block;width:100%}
.eq-card h4{font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px;display:flex;align-items:center;gap:8px}
.const-table{width:100%;border-collapse:collapse;font-size:14px}
.const-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
.const-table td:last-child{font-family:var(--f-mono);font-size:13px;white-space:nowrap}

/* misc */
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.kbd-hint{font-size:12px;color:var(--faint);margin-top:10px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;opacity:.45;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--accent)}
.badge .ic{font:800 30px var(--f-display);color:var(--accent-ink)}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.heat a{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font:600 10.5px var(--f-mono);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.prac{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
.prac summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}
.prac summary::-webkit-details-marker{display:none}
.prac summary .pno{font:800 20px var(--f-display);color:var(--uc);min-width:44px}
.prac[open] summary{border-bottom:1px solid var(--line)}
.prac .pb{padding:14px 18px}
.prac .pb h5{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.prac .pb h5:first-child{margin-top:0}
.prac .pb ul,.prac .pb ol{margin:0;padding-left:20px}
.chev{margin-left:auto;transition:transform .2s;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.prac[open] .chev{transform:rotate(180deg)}
.note-strip{font-size:12.5px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed var(--line-2);margin-top:24px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* fixes */
.search-btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.search-btn span{white-space:nowrap}
.tab{text-decoration:none}
.lc{text-transform:none;letter-spacing:.02em}
@media (max-width:640px){.spec-axis span:nth-child(2){display:none}}

/* ================= Live Wire additions ================= */
.brand-mark.lw{display:grid;place-items:center;background:linear-gradient(135deg,#1A1204,#0A1017)}
.brand-mark.lw svg{width:22px;height:22px;fill:#FFC24B;stroke:#FFE08A;stroke-width:1;filter:drop-shadow(0 0 5px rgba(255,190,70,.8))}
.hero canvas.circuit{height:clamp(230px,34vw,300px);background:#05080B;border:1px solid #16212C}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-body);letter-spacing:.02em;padding:4px 8px;border-radius:999px;vertical-align:middle;margin-right:6px;white-space:nowrap}
.tag.sm{font-size:10px;padding:3px 6px;margin-right:5px}
.tag.ht{background:color-mix(in srgb,var(--u7) 16%,transparent);color:var(--u7);border:1px solid color-mix(in srgb,var(--u7) 40%,transparent)}
.tag.po{background:color-mix(in srgb,var(--u4) 14%,transparent);color:var(--u4);border:1px solid color-mix(in srgb,var(--u4) 40%,transparent)}
.tier-chip{cursor:pointer;border:1px solid var(--line-2);font-weight:600}
.tier-chip:hover{border-color:var(--accent)}
.settings-dlg{padding:22px;max-width:560px}
.seg.big{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-top:6px;flex-wrap:wrap}
.seg.big button{flex:1;min-width:150px;border:0;background:transparent;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.seg.big button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.unit-a.off,.unit-card.off{opacity:.45}
.onboard{border:1px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.linkcard{text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s}
.linkcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.grid.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid.g4{grid-template-columns:1fr}}
.nuc{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.62em;line-height:1.05;vertical-align:-.42em;margin-right:1px;font-family:var(--f-math)}
.nuc b{font-weight:400}
.eq-row.out{opacity:.4}
.eq-row .eqm{min-width:0}
#eqlists.covered .eq-row .eqm{filter:blur(7px);cursor:pointer;transition:filter .2s}
#eqlists.covered .eq-row.peek .eqm{filter:none}
.prac h5{margin:14px 0 6px}
.prac .pno{font:800 20px var(--f-display);color:var(--uc,var(--accent));min-width:52px}
.ht-inline{border-left:3px solid var(--u7);padding-left:10px}
[data-ht]{border-left:3px solid var(--u7);padding-left:10px}
[data-po]{border-left:3px solid var(--u4);padding-left:10px}
.toc a{white-space:normal}
.fig svg{max-width:100%;height:auto}
.game-sym{display:grid;place-items:center;min-height:150px}
.game-sym svg{width:min(260px,70vw);height:auto}
.dom-sim{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
@media (max-width:860px){.dom-sim{grid-template-columns:1fr}}

<script>
/* ---- core.js ---- */
/* ==========================================================
   Core utilities: DOM, maths typesetting, storage, sound, fx
   ========================================================== */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const h = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if (html) e.innerHTML = html; return e; };

/* ---------- Maths typesetting ----------

  (o.segs || []).forEach(g => { let d = g.p.map((p, i) => (i ? 'L' : 'M') + X(p[0]) + ',' + Y(p[1])).join(' '); s += `<path d="${d}" fill="none" stroke="${g.c || INK}" stroke-width="${g.w || 2.4}" ${g.dash ? `stroke-dasharray="${g.dash}"` : ''} stroke-linejoin="round"/>`; if (g.label) s += tx(X(g.lp[0]), Y(g.lp[1]), g.label, { c: g.c || INK, fs: 12, w: 600, a: g.la || 'start' }); });
  (o.hl || []).forEach(l => s += ln(X(x0), Y(l.y), X(l.x ?? x1), Y(l.y), l.c || MUT, 1.2, '5 4') + (l.label ? tx(X(x0) + 6, Y(l.y) - 5, l.label, { fs: 11.5, c: l.c || MUT }) : ''));
  (o.vl || []).forEach(l => s += ln(X(l.x), Y(y0), X(l.x), Y(l.y ?? y1), l.c || MUT, 1.2, '5 4') + (l.label ? tx(X(l.x), ay + (l.dy ?? 16), l.label, { fs: 11.5, a: 'middle', c: l.c || MUT }) : ''));
  (o.marks || []).forEach(m => s += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="${m.r || 4}" fill="${m.c || ACC}"/>` + (m.label ? tx(X(m.x) + (m.dx ?? 8), Y(m.y) + (m.dy ?? -8), m.label, { fs: 12, c: m.lc || INK, a: m.a || 'start' }) : ''));
  (o.text || []).forEach(t => s += tx(X(t[0]), Y(t[1]), t[2], Object.assign({ c: INK, fs: 12 }, t[3] || {})));
  if (o.extra) s += o.extra(X, Y);
  return svg(W, H, s, o.label) + (o.cap ? `<figcaption>${o.cap}</figcaption>` : '');
}


/* ==========================================================

const SYM = {

  'LED': (x, y) => SYM.diode(x, y) + arrow(x - 2, y - 12, x + 7, y - 22, INK, 1.4) + arrow(x + 5, y - 11, x + 14, y - 21, INK, 1.4),
  'LDR': (x, y) => `<circle cx="${x}" cy="${y}" r="19" fill="none" stroke="${INK}" stroke-width="1.5"/>` + SYM.resistor(x, y) + arrow(x - 26, y - 26, x - 12, y - 13, INK, 1.4) + arrow(x - 16, y - 30, x - 3, y - 17, INK, 1.4),

const sym = (name, x, y, rot) => rot ? `<g transform="rotate(${rot} ${x} ${y})">${SYM[name](x, y)}</g>` : SYM[name](x, y);
const wire = (...pts) => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;

const pth = (d, stroke = INK, sw = 1.8, fill = 'none', dash = '') => `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;

  ivall: () => { const g = (ox, title, f, col) => { let s = ''; const X = v => ox + 90 + v * 70, Y = v => 100 - v * 70; s += arrow(ox + 10, 100, ox + 170, 100, INK, 1.2) + arrow(ox + 90, 175, ox + 90, 22, INK, 1.2) + tx(ox + 172, 114, 'V', { fs: 12, c: INK, it: true, a: 'end' }) + tx(ox + 96, 28, 'I', { fs: 12, c: INK, it: true });

TOPICS.push({
  id: '1.2', unit: '1', ref: '4.1.1.3–4.1.1.4', title: 'Specific heat capacity and power', short: 'ΔE = mcΔθ, P = E/t, P = W/t',
  summary: 'How much energy it takes to warm things up, how to measure it (Required Practical 1), and power as the rate of transferring energy.',
  spec: [
    'Calculate the energy stored in or released from a system as its temperature changes: ΔE = m c Δθ (equation sheet)',

    'Power is the rate at which energy is transferred or the rate at which work is done: P = E/t and P = W/t (recall both)',

  ],
  learn: [
    { h: 'Specific heat capacity', html: `
<div class="box def"><b class="lbl">Definition</b><p>The <b>specific heat capacity</b> of a substance is the amount of energy required to raise the temperature of <b>one kilogram</b> of the substance by <b>one degree Celsius</b>.</p></div>
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>change in thermal energy = mass × specific heat capacity × temperature change &nbsp; $ΔE = mcΔθ$</p><p class="small">ΔE in J, m in kg, c in J/kg °C, Δθ in °C</p></div>
<div class="tbl"><table><tr><th>Material</th><th>c / J/kg °C</th></tr><tr><td>water</td><td>4200</td></tr><tr><td>aluminium</td><td>900</td></tr><tr><td>concrete</td><td>≈ 880</td></tr><tr><td>steel / iron</td><td>≈ 450</td></tr><tr><td>copper</td><td>385</td></tr></table></div>
<p>Water’s very high specific heat capacity means it takes a lot of energy to warm up and releases a lot as it cools — ideal for central heating systems and hot water bottles. A material with a <b>low</b> c heats up quickly.</p>
<div class="box tip"><b class="lbl">Exam tip</b><p>Δθ is a <b>change</b>: final temperature − initial temperature. A rise from 18 °C to 43 °C is Δθ = 25 °C.</p></div>` },
    { h: 'Required practical 1: specific heat capacity', html: `
[[d:shcrig]]
<ol><li>Measure the mass of an aluminium (or copper) block with a top-pan balance.</li><li>Put an electric immersion heater and a thermometer in the holes in the block. Wrap the block in insulation.</li><li>Connect the heater to a joulemeter — or to a power supply with an ammeter and voltmeter.</li><li>Record the starting temperature, switch on and start a stopwatch.</li><li>Record the temperature and the energy supplied every minute for about 10 minutes.</li></ol>
<p><b>Analysis:</b> plot temperature (y-axis) against energy supplied (x-axis). Draw a line of best fit through the straight part. The gradient = Δθ/ΔE, so $c = @frac{1}{m × "gradient"}$. Or simply use $c = @frac{ΔE}{mΔθ}$.</p>
<p>If you use an ammeter and voltmeter, energy supplied E = VIt (power P = VI multiplied by time).</p>
<div class="box why"><b class="lbl">Why the answer is usually too high</b><p>Some energy is transferred to the surroundings and to the heater and thermometer, so the temperature rise is smaller than it “should” be. Using insulation, a drop of oil or water in the thermometer hole (for good thermal contact) and waiting for the temperature to stop rising after switching off improve accuracy.</p></div>
<p><b>Safety:</b> the heater gets very hot — don’t touch it, and let it cool before packing away. Stand the block on a heatproof mat.</p>` },
    { h: 'Power', html: `
<div class="box def"><b class="lbl">Definition</b><p><b>Power</b> is the rate at which energy is transferred, or the rate at which work is done. An energy transfer of <b>1 joule per second</b> is a power of <b>1 watt</b>.</p></div>
<div class="box def"><b class="lbl">Recall both equations</b><p>power = energy transferred ÷ time &nbsp; $P = @frac{E}{t}$ &nbsp;&nbsp;&nbsp; power = work done ÷ time &nbsp; $P = @frac{W}{t}$</p><p class="small">P in watts (W), E and W in joules (J), t in seconds (s)</p></div>
<p>Two motors lift identical loads through the same height, so they do the same work. The motor that does it <b>in less time</b> is more powerful.</p>
<p>Remember 1 kW = 1000 W and 1 minute = 60 s. A 2.0 kW kettle switched on for 3 minutes transfers $E = Pt = 2000 × 180 = 360 000 "J"$.</p>` }
  ],
  eqs: [['ΔE = mcΔθ', 'change in thermal energy (equation sheet)'], ['P = @frac{E}{t}', 'power (recall)'], ['P = @frac{W}{t}', 'power as rate of doing work (recall)']],
  worked: [

    { q: 'A 1.0 kg aluminium block is heated by 18 000 J and its temperature rises by 20 °C. Calculate the specific heat capacity of aluminium.', s: ['Rearrange: $c = @frac{ΔE}{mΔθ}$', '$c = @frac{18 000}{1.0 × 20}$', '$c = 900 "J/kg °C"$'], a: '900 J/kg °C' },
    { q: 'A motor lifts a 50 kg load through 12 m in 20 s. g = 9.8 N/kg. Calculate its useful power output.', s: ['Work done = energy gained by gravitational store: $E_p = mgh = 50 × 9.8 × 12 = 5880 "J"$', '$P = @frac{W}{t} = @frac{5880}{20}$', '$P = 294 "W"$'], a: '294 W (≈ 290 W)' }

TOPICS.push({
  id: '1.3', unit: '1', ref: '4.1.2', title: 'Conservation, dissipation and efficiency', short: 'Wasted energy, insulation, efficiency',
  summary: 'Energy cannot be created or destroyed, but in every real change some is dissipated. Learn how to reduce unwanted transfers, how insulation works (Required Practical 2), and how to calculate efficiency.',
  spec: [
    'Energy can be transferred usefully, stored or dissipated, but cannot be created or destroyed',
    'In a closed system there is no net change to the total energy',
    'In all system changes energy is dissipated, so that it is stored in less useful ways (“wasted”)',
    'Explain ways of reducing unwanted energy transfers, e.g. lubrication and thermal insulation',
    'The higher the thermal conductivity of a material, the higher the rate of energy transfer by conduction across it',
    'Describe how the rate of cooling of a building is affected by the thickness and thermal conductivity of its walls',
    '(PO) Required practical 2: investigate the effectiveness of different materials as thermal insulators',
    'Efficiency = useful output energy transfer ÷ total input energy transfer, and = useful power output ÷ total power input (recall both); as a decimal or percentage',
    '(HT) Describe ways to increase the efficiency of an intended energy transfer'
  ],
  learn: [
    { h: 'Conservation of energy', html: `
<div class="box def"><b class="lbl">Law of conservation of energy</b><p>Energy can be transferred usefully, stored or dissipated, but it <b>cannot be created or destroyed</b>.</p></div>
<p>In a <b>closed system</b> (nothing enters or leaves) there is <b>no net change</b> in the total energy. A pendulum swinging in a vacuum would keep swinging: energy just moves back and forth between its kinetic and gravitational potential stores.</p>
<p>In every real change some energy is <b>dissipated</b> — it spreads out into the surroundings, usually warming them slightly. It is stored in less useful ways, so we call it <b>wasted</b> energy. It has not been destroyed.</p>
[[d:sankey]]
<p>A <b>Sankey diagram</b> shows this: the width of each arrow is proportional to the energy. Input = useful output + wasted output.</p>` },
    { h: 'Reducing unwanted energy transfers', html: `
<ul><li><b>Lubrication</b> (oil, grease) reduces friction between moving parts, so less work is done against friction and less energy is dissipated by heating.</li>
<li><b>Thermal insulation</b> reduces energy transfer by heating: loft insulation, cavity-wall insulation, double glazing, draught excluders.</li>
<li>Streamlining reduces air resistance on vehicles.</li></ul>
<div class="box def"><b class="lbl">Thermal conductivity</b><p>The <b>higher the thermal conductivity</b> of a material, the <b>higher the rate</b> of energy transfer by conduction across it. Metals have high thermal conductivity; air, foam and wool have low thermal conductivity.</p></div>
<p>A building cools more slowly if its walls are <b>thicker</b> and made of a material with <b>lower thermal conductivity</b>. Cavity walls trap air (a poor conductor) — filling the cavity with foam also stops air moving and carrying energy by convection.</p>
<p class="small muted">You do not need to know the definition of thermal conductivity.</p>` },
    { h: 'Required practical 2: thermal insulators', po: true, html: `
<ol><li>Put a small beaker inside a larger beaker. Fill the gap with the insulating material being tested (e.g. cotton wool, bubble wrap, newspaper, polystyrene beads).</li>
<li>Pour a fixed volume of hot water (e.g. 80 cm³ at about 80 °C) into the small beaker; add a lid of the same material.</li>
<li>Record the temperature every 2 minutes for 20 minutes.</li>
<li>Repeat with each material, and with no insulation as a control. Keep the starting temperature, volume of water and thickness of material the same.</li></ol>
<p><b>Analysis:</b> plot cooling curves (temperature against time). The best insulator gives the smallest temperature drop in the same time.</p>
<p>A second version investigates <b>thickness</b>: wrap the beaker in 1, 2, 3… layers of newspaper — more layers, slower cooling.</p>
<div class="box warn"><b class="lbl">Variables</b><p>Independent: type (or thickness) of insulating material. Dependent: temperature drop in a fixed time. Control: volume and starting temperature of water, time, beaker size, room temperature.</p></div>
<p><b>Safety:</b> take care pouring hot water; stand beakers on a heatproof mat; wipe up spills.</p>` },
    { h: 'Efficiency', html: `
<div class="box def"><b class="lbl">Recall both equations</b><p>efficiency = useful output energy transfer ÷ total input energy transfer</p><p>efficiency = useful power output ÷ total power input</p></div>
<p>Efficiency has <b>no unit</b>. It can be written as a decimal (0.35) or a percentage (35%). No real device is 100% efficient, so efficiency is always less than 1.</p>
<p>Rearranged: useful output = efficiency × total input. A 40% efficient motor supplied with 500 J does 200 J of useful work — the other 300 J is wasted.</p>
<div class="box tip"><b class="lbl">Exam tip</b><p>If you get an efficiency above 1 (or 100%), you have divided the wrong way up.</p></div>` },
    { h: 'Increasing efficiency', ht: true, html: `
<p>To increase the efficiency of an intended transfer, reduce the energy that is dissipated:</p>
<ul><li>lubricate moving parts to reduce friction</li><li>use low-resistance wires to reduce heating in cables</li><li>insulate hot objects (e.g. a kettle) so less energy heats the surroundings</li><li>streamline vehicles to reduce air resistance</li><li>replace filament lamps with LEDs, which waste far less energy by heating</li><li>tighten loose parts so less energy is transferred as sound and vibration</li></ul>` }
  ],
  eqs: [['"efficiency" = @frac{"useful output energy transfer"}{"total input energy transfer"}', 'recall'], ['"efficiency" = @frac{"useful power output"}{"total power input"}', 'recall']],
  worked: [
    { q: 'A motor is supplied with 800 J of energy and does 560 J of useful work. Calculate its efficiency.', s: ['efficiency = useful output ÷ total input', '= 560 ÷ 800', '= 0.70'], a: '0.70 (70%)' },
    { q: 'An LED bulb has an efficiency of 0.80 and an input power of 5.0 W. Calculate its useful power output and the power wasted.', s: ['useful power output = efficiency × total power input', '= 0.80 × 5.0 = 4.0 W', 'wasted power = 5.0 − 4.0 = 1.0 W'], a: '4.0 W useful, 1.0 W wasted' },
    { q: 'A 25% efficient petrol engine gives a useful output of 15 kW. Calculate the total power input.', s: ['total power input = useful power output ÷ efficiency', '= 15 000 ÷ 0.25', '= 60 000 W'], a: '60 kW' }

  pitfalls: ['Dividing input by output and getting an efficiency above 1.', 'Saying wasted energy is “destroyed” or “lost” — it is dissipated to the surroundings.', 'Forgetting that efficiency has no unit.', 'Confusing thermal conductivity (how fast energy is conducted) with specific heat capacity.', 'In RP2, changing more than one variable at a time.'],
  cards: [

  quiz: [

    { q: 'An electric motor has an input power of 400 W and an efficiency of 0.75. Its useful power output is', o: ['300 W', '533 W', '100 W', '0.0019 W'], x: '0.75 × 400.' },

<p>For charge to flow round a circuit there must be a <b>closed circuit</b> and a <b>source of potential difference</b> (a cell, battery or power supply).</p>
<div class="box def"><b class="lbl">Definition</b><p><b>Electric current</b> is a flow of electrical charge. The size of the current is the <b>rate of flow of charge</b>.</p></div>
<div class="box def"><b class="lbl">Recall this equation</b><p>charge flow = current × time &nbsp; $Q = It$</p><p class="small">Q in coulombs (C), I in amperes (A), t in seconds (s)</p></div>

<p>The current through a component depends on both the <b>resistance</b> R of the component and the <b>potential difference</b> V across it. For a given pd, a <b>greater resistance</b> gives a <b>smaller current</b>.</p>
<div class="box def"><b class="lbl">Recall this equation</b><p>potential difference = current × resistance &nbsp; $V = IR$</p><p class="small">V in volts (V), I in amperes (A), R in ohms (Ω)</p></div>
<p>Questions use the term <b>potential difference</b> (pd); “voltage” also gets credit. Rearranging: $I = @frac{V}{R}$ and $R = @frac{V}{I}$.</p>

<p>Plot R against L: a <b>straight line through the origin</b> (or close to it) shows R ∝ L. Doubling the length doubles the resistance.</p>
<p><b>Keep the temperature constant:</b> use a low pd and switch off between readings. If the wire gets hot its resistance rises and the results are no longer valid.</p>
<p><b>Part 2 — combinations of resistors.</b> Measure I and V for a single resistor, then for two identical resistors in series, then in parallel. Series: total R increases. Parallel: total R is less than either resistor alone.</p>

TOPICS.push({

<p>The I–V graph is a <b>straight line through the origin</b>. Reversing the pd just reverses the current, so the line continues into the third quadrant. A fixed resistor and a wire at constant temperature are ohmic.</p>
[[d:ivall]]` },
    { h: 'Filament lamp and diode', html: `
<p><b>Filament lamp:</b> as the current increases the filament gets hotter. The metal ions vibrate more, so electrons collide with them more often — the <b>resistance increases as the temperature increases</b>. The I–V graph curves and becomes less steep (an S-shape through the origin).</p>
<p><b>Diode:</b> current flows in <b>one direction only</b>. In the forward direction, above about 0.6 V, the resistance becomes low and the current rises steeply. In the <b>reverse direction</b> the diode has a <b>very high resistance</b>, so the current is almost zero. An <b>LED</b> is a diode that emits light.</p>

<p><b>LDR (light-dependent resistor):</b> resistance <b>decreases</b> as <b>light intensity increases</b>. Used in circuits that <b>switch lights on when it gets dark</b> (street lamps, security lights).</p>
[[d:sensors]]
<p>You can investigate each one: put the thermistor in a beaker of water heated with a kettle, and measure R (with an ohmmeter or V and I) at different temperatures; move a lamp to different distances from an LDR to vary light intensity.</p>` },

TOPICS.push({

  summary: 'How appliances transfer energy, the four equations linking power, energy, current, pd and charge — and why the National Grid transmits at very high pd.',

  ],
  learn: [
    { h: 'Power in circuits', html: `
<div class="box def"><b class="lbl">Recall both equations</b><p>power = potential difference × current &nbsp; $P = VI$</p><p>power = current<sup>2</sup> × resistance &nbsp; $P = I^2R$</p><p class="small">P in watts (W), V in volts (V), I in amperes (A), R in ohms (Ω)</p></div>
<p>$P = I^2R$ comes from substituting V = IR into P = VI. Use it when you know the current and resistance — for example, the power wasted heating a transmission cable.</p>` },
    { h: 'Energy transferred by appliances', html: `
<p>Everyday appliances are designed to bring about energy transfers — from the chemical store of a battery or from the ac mains to the <b>kinetic store</b> of a motor (fan, drill, washing machine) or the <b>thermal store</b> of a heating element (kettle, toaster, iron).</p>
<p><b>Work is done when charge flows</b> through a component.</p>
<div class="box def"><b class="lbl">Recall both equations</b><p>energy transferred = power × time &nbsp; $E = Pt$</p><p>energy transferred = charge flow × potential difference &nbsp; $E = QV$</p><p class="small">E in joules (J), P in W, t in s, Q in coulombs (C), V in V</p></div>
<p>The energy an appliance transfers depends on its <b>power rating</b> and <b>how long it is switched on</b>. A 3 kW kettle on for 2 minutes transfers the same energy as a 1 kW heater on for 6 minutes.</p>

    { h: 'The National Grid', html: `
[[d:grid]]
<p>The <b>National Grid</b> is a system of cables and transformers linking power stations to consumers.</p>
<ol><li>A <b>step-up transformer</b> increases the pd from the power station (about 25 kV) to a very high value for the transmission cables (up to 400 kV).</li><li>Electricity is transmitted across the country.</li><li><b>Step-down transformers</b> decrease the pd to a much lower value (230 V) for homes.</li></ol>
<div class="box why"><b class="lbl">Why is this efficient?</b><p>For a given power, P = VI, so increasing the pd <b>decreases the current</b>. The power wasted heating the cables is P = I²R, so a smaller current means <b>much less energy is dissipated</b> in the cables (halving I cuts the loss to a quarter). High pd also means thinner, cheaper cables can be used.</p></div>
<p class="small muted">How transformers work is covered in topic 7.3 (Higher tier).</p>` }

<p><b>Irregular solid</b> (e.g. a stone): measure its mass. Fill a <b>displacement (eureka) can</b> with water to the spout; lower the object in gently on a thread and collect the displaced water in a measuring cylinder. The volume of water = the volume of the object. (Or note the rise in level in a measuring cylinder.)</p>

<div class="box warn"><b class="lbl">Accuracy tips</b><p>Read the measuring cylinder at eye level from the bottom of the meniscus. Use a thread, not fingers, to avoid splashing. Take several measurements of each dimension and use the mean. Wipe up spills to avoid slipping.</p></div>` },

TOPICS.push({
  id: '3.2', unit: '3', ref: '4.3.2', title: 'Internal energy and specific latent heat', short: 'Heating curves, E = mL',
  summary: 'Internal energy is the energy stored by particles. Heating either raises the temperature or changes the state — learn to tell specific heat capacity and specific latent heat apart and read heating and cooling graphs.',
  spec: [
    'Internal energy is the total kinetic energy and potential energy of all the particles that make up a system',
    'Heating increases the energy of the particles: it either raises the temperature or produces a change of state',
    'The temperature increase depends on the mass heated, the type of material and the energy input: ΔE = m c Δθ (equation sheet)',
    'Specific heat capacity: the energy required to raise the temperature of 1 kg of a substance by 1 °C',
    'Latent heat is the energy needed for a change of state; during a change of state the internal energy changes but not the temperature',
    'Specific latent heat: the energy required to change the state of 1 kg of a substance with no change in temperature: E = m L (equation sheet)',
    'Specific latent heat of fusion (solid → liquid) and of vaporisation (liquid → vapour)',
    'Interpret heating and cooling graphs that include changes of state; distinguish between specific heat capacity and specific latent heat'
  ],
  learn: [
    { h: 'Internal energy', html: `
<div class="box def"><b class="lbl">Definition</b><p><b>Internal energy</b> is the total <b>kinetic energy</b> and <b>potential energy</b> of all the particles (atoms and molecules) that make up a system.</p></div>
<p>Particles move (kinetic energy) and are held by forces between them (potential energy). Heating a system increases the energy of its particles. This <b>either</b>:</p>
<ul><li>raises the <b>temperature</b> (the particles move faster — more kinetic energy), <b>or</b></li><li>produces a <b>change of state</b> (bonds are broken or weakened — more potential energy, temperature stays constant).</li></ul>` },
    { h: 'Specific heat capacity (again)', html: `
<p>How much the temperature rises depends on the <b>mass</b>, the <b>material</b> and the <b>energy input</b>:</p>
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>$ΔE = mcΔθ$ &nbsp; (J, kg, J/kg °C, °C)</p></div>
<p>This is the same equation as in topic 1.2 — it appears in both the Energy and Particle model sections of the specification.</p>` },
    { h: 'Specific latent heat', html: `
<p>The energy needed for a substance to change state is called <b>latent heat</b>. During a change of state the energy supplied changes the <b>internal energy</b> but <b>not the temperature</b>.</p>
<div class="box def"><b class="lbl">Definition</b><p>The <b>specific latent heat</b> of a substance is the amount of energy required to change the state of <b>one kilogram</b> of the substance <b>with no change in temperature</b>.</p></div>
<div class="box def"><b class="lbl">Given on the equation sheet</b><p>energy for a change of state = mass × specific latent heat &nbsp; $E = mL$</p><p class="small">E in J, m in kg, L in joules per kilogram (J/kg)</p></div>
<ul><li><b>Specific latent heat of fusion</b> — solid ↔ liquid. Water: 334 000 J/kg.</li><li><b>Specific latent heat of vaporisation</b> — liquid ↔ vapour. Water: 2 260 000 J/kg.</li></ul>
<p>It takes about seven times more energy to boil water away than to melt the same mass of ice — the particles must be separated completely.</p>` },
    { h: 'Heating and cooling graphs', html: `
[[d:heatcurve]]
<p>On a heating graph for ice:</p>
<ul><li><b>Sloping sections</b>: the temperature rises — the energy increases the kinetic energy of the particles (use ΔE = mcΔθ).</li><li><b>Flat sections</b>: a change of state — the energy breaks bonds, increasing potential energy; the temperature stays constant (use E = mL).</li></ul>
<p>A <b>cooling</b> graph is the reverse: flat sections occur while the substance condenses or freezes, releasing latent heat.</p>
<div class="box tip"><b class="lbl">Tell them apart</b><p>Specific <b>heat capacity</b> → temperature changes, no change of state (units J/kg °C). Specific <b>latent heat</b> → change of state, no temperature change (units J/kg).</p></div>` }
  ],

<div class="box def"><b class="lbl">Key terms</b><p><b>Activity</b> — the rate at which a source of unstable nuclei decays, measured in <b>becquerel (Bq)</b>. 1 Bq = 1 decay per second.</p><p><b>Count-rate</b> — the number of decays recorded each second by a detector such as a <b>Geiger–Muller tube</b>.</p></div>` },
    { h: 'Types of nuclear radiation', html: `
<div class="tbl"><table><tr><th></th><th>Alpha (α)</th><th>Beta (β)</th><th>Gamma (γ)</th></tr>
<tr><td>What it is</td><td>2 protons + 2 neutrons (a helium nucleus)</td><td>high-speed electron ejected from the nucleus as a neutron turns into a proton</td><td>electromagnetic radiation from the nucleus</td></tr>
<tr><td>Stopped by</td><td>a sheet of paper (or skin)</td><td>a few mm of aluminium</td><td>several cm of lead / metres of concrete (reduced, not fully stopped)</td></tr>
<tr><td>Range in air</td><td>a few cm</td><td>about 1 m</td><td>very large</td></tr>
<tr><td>Ionising power</td><td>strongly ionising</td><td>moderately ionising</td><td>weakly ionising</td></tr></table></div>
[[d:penetration]]
<p>A nucleus may also emit a <b>neutron (n)</b>.</p>
<p>Ionising power and penetration are linked: alpha particles ionise strongly, so they lose their energy quickly and cannot travel far. Gamma rays rarely interact, so they penetrate a long way.</p>
<div class="box tip"><b class="lbl">Choosing a source</b><p>Paper thickness gauge → <b>beta</b> (alpha would be stopped by any paper; gamma would pass straight through regardless). Smoke alarm → <b>alpha</b> (short range, strongly ionising). Medical tracer inside the body → <b>gamma</b> (detected outside the body, weakly ionising).</p></div>` },
    { h: 'Nuclear equations', html: `
<p>In nuclear equations, an alpha particle is written ${nuc(4, 2, 'He')} and a beta particle ${nuc(0, -1, 'e')}. The <b>mass numbers</b> (top) and the <b>atomic numbers</b> (bottom) must <b>balance</b> on each side.</p>
<div class="box def"><b class="lbl">Alpha decay</b><p style="font-size:20px">${nuc(219, 86, 'Rn')} → ${nuc(215, 84, 'Po')} + ${nuc(4, 2, 'He')}</p><p>Mass number falls by 4, atomic number falls by 2 — alpha decay decreases <b>both the mass and the charge</b> of the nucleus.</p></div>
<div class="box def"><b class="lbl">Beta decay</b><p style="font-size:20px">${nuc(14, 6, 'C')} → ${nuc(14, 7, 'N')} + ${nuc(0, -1, 'e')}</p><p>A neutron turns into a proton: mass number unchanged, atomic number <b>increases by 1</b> — beta decay does not change the mass but <b>increases the charge</b>.</p></div>
<p><b>Gamma</b> emission does not change the mass or charge of the nucleus — it is just energy leaving.</p>
<p class="small muted">You do not need to recall these two examples, or identify the new elements formed — only balance the numbers.</p>` }
  ],

TOPICS.push({
  id: '4.3', unit: '4', ref: '4.4.2.3–4.4.2.4', title: 'Half-life, contamination and irradiation', short: 'Random decay, half-life graphs, hazards',
  summary: 'Why random decay gives a predictable half-life, how to read half-life from a graph, net decline after several half-lives, and the difference between contamination and irradiation.',

    { h: 'Half-life', html: `
<div class="box def"><b class="lbl">Definition</b><p>The <b>half-life</b> of a radioactive isotope is the time it takes for the <b>number of nuclei</b> of the isotope in a sample to <b>halve</b>, or the time it takes for the <b>count-rate</b> (or activity) from a sample to fall to <b>half its initial level</b>.</p></div>
<p>Each nucleus decays at random, but with an enormous number of nuclei the <b>proportion</b> that decays in a given time is predictable — like tossing a million coins, about half will land heads every time. So the half-life is constant for a particular isotope.</p>
[[d:halflife]]
<p><b>From a graph:</b> read the starting count-rate, find half that value, draw across to the curve and down to the time axis. Check with a second pair of readings (e.g. half again).</p>
<div class="box tip"><b class="lbl">Exam tip</b><p>Subtract the <b>background count-rate</b> before finding the half-life if the question gives one.</p></div>` },
    { h: 'Net decline after several half-lives', ht: true, html: `
<p>After each half-life the amount is multiplied by ½. After n half-lives the fraction left is $(@frac{1}{2})^n$.</p>
<div class="tbl"><table><tr><th>Half-lives</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>Fraction left</td><td>1</td><td>1/2</td><td>1/4</td><td>1/8</td><td>1/16</td></tr></table></div>
<p>The <b>net decline</b> can be expressed as a ratio. E.g. after 3 half-lives the activity has fallen from 800 Bq to 100 Bq: a decline of 700 Bq, so the ratio of net decline to initial activity is 700 : 800 = <b>7 : 8</b>. The ratio of final to initial activity is 1 : 8.</p>` },
    { h: 'Contamination and irradiation', html: `
<div class="box def"><b class="lbl">Contamination</b><p>The <b>unwanted presence</b> of materials containing radioactive atoms <b>on</b> (or in) other materials. The hazard comes from the <b>decay of the contaminating atoms</b>, and continues until they are removed or have decayed. The type of radiation affects the hazard.</p></div>
<div class="box def"><b class="lbl">Irradiation</b><p>Exposing an object to nuclear radiation. The irradiated object <b>does not become radioactive</b>. The hazard stops as soon as the source is removed or shielded.</p></div>
<p><b>Comparing hazards:</b> contamination is usually more dangerous — the radioactive atoms stay in contact, perhaps inside the body. Inside the body, <b>alpha</b> is most dangerous (strongly ionising, all its energy absorbed by nearby cells). Outside the body, <b>gamma</b> and <b>beta</b> are more dangerous because alpha cannot get through the skin.</p>
<p><b>Precautions:</b> wear gloves, use tongs, keep sources in lead-lined boxes, minimise time of exposure, keep as far away as possible, and workers wear dosimeter badges.</p>
<p>Results of studies on the effects of radiation on humans must be <b>published and shared</b> so that other scientists can check them by <b>peer review</b>.</p>` }

  learn: [
    { h: 'Background radiation', html: `
<p><b>Background radiation</b> is around us all the time. It comes from:</p>
<ul><li><b>natural sources</b> — rocks (especially granite, which releases radon gas), cosmic rays from space, food and drink;</li><li><b>man-made sources</b> — fallout from nuclear weapons testing and nuclear accidents (e.g. Chernobyl), plus medical X-rays.</li></ul>
[[d:background]]
<p>The level of background radiation and the <b>radiation dose</b> a person receives can depend on their <b>occupation</b> (airline pilots receive more cosmic rays; radiographers and nuclear workers work near sources) and <b>location</b> (areas with granite rock, such as Cornwall, have more radon).</p>
<p>Radiation dose is measured in <b>sieverts (Sv)</b>: 1000 millisieverts (mSv) = 1 Sv. A typical UK annual dose is about 2.7 mSv.</p>` },
    { h: 'Half-life and hazard', html: `
<p>Radioactive isotopes have a <b>very wide range</b> of half-lives, from fractions of a second to billions of years (uranium-238: 4.5 × 10<sup>9</sup> years).</p>
<ul><li>An isotope with a <b>short half-life</b> is intensely active at first but soon decays to a safe level.</li><li>An isotope with a <b>long half-life</b> has a lower activity but stays hazardous for a very long time — this is why nuclear waste must be stored safely for thousands of years.</li></ul>
<p>For use inside the body, a short half-life (hours) is best: enough time to do its job, then it decays quickly so the patient’s dose is small.</p>` },
    { h: 'Uses in medicine', html: `
<p><b>Exploring internal organs (tracers):</b> a gamma-emitting isotope with a short half-life, e.g. technetium-99m (half-life 6 hours), is injected or swallowed. It collects in the organ being studied; a gamma camera outside the body detects the radiation and builds an image. Gamma is used because it passes out of the body and is weakly ionising.</p>
<p><b>Controlling or destroying unwanted tissue (radiotherapy):</b></p>
<ul><li>Beams of <b>gamma rays</b> are aimed at a tumour from several directions, so the tumour gets a high dose while surrounding healthy tissue gets less.</li><li>An <b>implant</b> of a beta (or alpha) emitter can be placed in or next to a tumour, so the radiation only travels a short distance.</li><li>Radioactive iodine-131 is taken up by the thyroid gland to treat an overactive thyroid or thyroid cancer.</li></ul>
<div class="box why"><b class="lbl">Evaluating the risk</b><p>Radiation can damage healthy cells and cause cancer. Doctors weigh the <b>benefit</b> (diagnosis or cure) against the <b>risk</b>. People often perceive radiation as riskier than data suggest, because it is invisible, unfamiliar and imposed rather than chosen.</p></div>` }
  ],

TOPICS.push({
  id: '5.3', unit: '5', ref: '4.5.4', po: true, title: 'Moments, levers and gears', short: 'M = Fd, balance, force multipliers',
  summary: 'Forces can make objects turn. Calculate moments, use the principle of moments to balance objects, and explain how levers and gears transmit turning effects.',
  spec: [
    '(PO) A force or system of forces may cause an object to rotate; describe examples',
    '(PO) The turning effect of a force is its moment: M = F d (recall), where d is the perpendicular distance from the pivot to the line of action of the force',
    '(PO) If an object is balanced, the total clockwise moment about a pivot equals the total anticlockwise moment about that pivot',

    '(PO) A simple lever and a simple gear system can both be used to transmit the rotational effects of forces; explain how'
  ],
  learn: [
    { h: 'Moments', html: `
<p>A force can make an object <b>rotate</b> — opening a door, turning a spanner, using a seesaw. The turning effect of a force is called its <b>moment</b>.</p>
<div class="box def"><b class="lbl">Recall this equation</b><p>moment of a force = force × distance &nbsp; $M = Fd$</p><p class="small">M in newton-metres (Nm), F in newtons (N), d = the <b>perpendicular distance</b> from the pivot to the line of action of the force, in metres (m)</p></div>
[[d:moment]]
<p>To get a bigger turning effect, use a bigger force or apply it further from the pivot — that is why door handles are far from the hinges.</p>` },
    { h: 'The principle of moments', html: `
<div class="box def"><b class="lbl">Principle of moments</b><p>If an object is <b>balanced</b>, the total <b>clockwise</b> moment about a pivot equals the total <b>anticlockwise</b> moment about that pivot.</p></div>
<p>Example: a seesaw. A 400 N child sits 1.5 m from the pivot. How far from the pivot must a 600 N adult sit? 400 × 1.5 = 600 × d, so d = 1.0 m.</p>` },
    { h: 'Levers and gears', html: `
<p><b>Levers</b> transmit the rotational effect of a force. A small <b>effort</b> applied a long way from the pivot produces a large moment, which can move a large <b>load</b> close to the pivot. Crowbars, wheelbarrows, bottle openers and scissors are levers — they act as <b>force multipliers</b>.</p>
[[d:gears]]
<p><b>Gears</b> are toothed wheels that transmit rotation. When a small gear drives a large gear:</p>
<ul><li>the large gear turns <b>more slowly</b>,</li><li>but with a <b>larger moment</b> (turning effect), because the same force acts at a larger radius.</li><li>Adjacent gears turn in <b>opposite directions</b>.</li></ul>
<p>A bicycle in a low gear uses a small front cog and a large rear cog — easier to pedal uphill (larger moment on the wheel) but slower.</p>` }
  ],
  eqs: [['M = Fd', 'moment of a force (recall; physics only)'], ['"clockwise moments" = "anticlockwise moments"', 'balanced object']],
  worked: [
    { q: 'A force of 40 N is applied at the end of a 0.25 m spanner, at right angles. Calculate the moment.', s: ['$M = Fd$', '$M = 40 × 0.25$', '$M = 10 "Nm"$'], a: '10 Nm' },
    { q: 'A uniform beam is pivoted at its centre. A 30 N weight hangs 0.40 m to the left. Where must a 20 N weight hang on the right to balance it?', s: ['Anticlockwise moment = 30 × 0.40 = 12 Nm', 'Clockwise moment = 20 × d', 'Balanced: 20d = 12, so d = 0.60 m'], a: '0.60 m to the right of the pivot' }
  ],
  pitfalls: ['Using a distance that is not perpendicular to the line of action of the force.', 'Leaving distances in cm and getting Nm answers 100× too large.', 'Saying gears “create” energy — they change force and speed, not energy.', 'Forgetting that meshing gears rotate in opposite directions.'],
  cards: [

    ['What is d in M = Fd?', 'The perpendicular distance from the pivot to the line of action of the force.', 'po'],
    ['State the principle of moments.', 'For a balanced object, total clockwise moment = total anticlockwise moment about a pivot.', 'po'],
    ['How do levers make jobs easier?', 'A small effort far from the pivot gives a large moment that moves a large load near the pivot.', 'po'],
    ['What happens when a small gear drives a large gear?', 'The large gear turns more slowly but with a larger moment.', 'po'],
    ['Direction of adjacent gears?', 'Opposite directions.', 'po'],
    ['Why is a door handle far from the hinge?', 'A larger distance gives a larger moment for the same force.', 'po']

  quiz: [

    { q: 'A 50 N force acts 0.30 m from a pivot. The moment is', o: ['15 Nm', '167 Nm', '0.006 Nm', '50.3 Nm'], x: '50 × 0.30.', po: 1 },
    { q: 'For a balanced seesaw', o: ['clockwise moments = anticlockwise moments', 'the heavier person must sit further away', 'both people must weigh the same', 'there are no moments'], x: 'Principle of moments.', po: 1 },
    { q: 'A 200 N weight is 2.0 m from a pivot. What force 0.50 m on the other side balances it?', o: ['800 N', '50 N', '200 N', '400 N'], x: '200 × 2.0 = F × 0.50.', po: 1 },
    { q: 'To undo a tight nut more easily, you should', o: ['use a longer spanner', 'use a shorter spanner', 'push closer to the nut', 'push along the spanner handle'], x: 'Larger d, larger moment.', po: 1 },
    { q: 'When a small gear drives a larger gear, the larger gear', o: ['turns more slowly with a larger moment', 'turns faster with a larger moment', 'turns faster with a smaller moment', 'turns at the same speed'], x: 'Force multiplier.', po: 1 },
    { q: 'Two meshing gears rotate', o: ['in opposite directions', 'in the same direction', 'at the same speed always', 'only if they are the same size'], x: 'Teeth push each other the opposite way.', po: 1 },

  ],
  exam: [
    { q: 'Explain how a crowbar allows a person to lift a heavy rock with a small force.', m: 3, ms: ['The crowbar is a lever / rotates about a pivot.', 'The effort is applied a long way from the pivot, giving a large moment.', 'The load is close to the pivot, so a large force is exerted on the rock (moments balance).'], po: 1 },
