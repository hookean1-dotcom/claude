/* ---- 1.6 Interval session designer ---- */
SIMS.interval = DS('Interval session designer', 'Set the work time, intensity, recovery and reps. The tool estimates the predominant energy system and checks whether the recovery suits it — the way you should justify a session in an exam answer.', body => {
  body.innerHTML = `<div class="grid g2">${dsRange('iv-w', 'Work period', 5, 300, 5, 10, ' s')}${dsRange('iv-i', 'Intensity', 50, 100, 5, 95, '%')}${dsRange('iv-r', 'Recovery', 10, 300, 10, 60, ' s')}${dsRange('iv-n', 'Repetitions', 2, 20, 1, 8, '')}</div><div id="iv-out" style="margin-top:12px"></div>`;
  dsWire(body, () => { const w = val(body, 'iv-w'), i = val(body, 'iv-i'), r = val(body, 'iv-r'), n = val(body, 'iv-n');
    const sys = w <= 10 && i >= 90 ? 'ATP-PC' : w <= 120 && i >= 75 ? 'anaerobic glycolysis (lactic acid)' : 'aerobic', ratio = r / w;
    const ok = sys === 'ATP-PC' ? ratio >= 5 : sys.startsWith('anaerobic') ? ratio >= 1.5 && ratio <= 4 : ratio <= 1.5;
    const advice = sys === 'ATP-PC' ? (ok ? 'Recovery long enough for PC to be largely restored (≈ 2–3 min for full recovery).' : 'Recovery too short: PC will not restore, so later reps become lactic. Aim for at least 1:5.') : sys.startsWith('anaerobic') ? (ok ? 'Good: incomplete recovery trains lactate tolerance and buffering.' : ratio < 1.5 ? 'Very short recovery — the session will drift aerobic/fatigue quickly. Try 1:2–1:3.' : 'Recovery is long; fine for quality, but less lactate tolerance stress.') : (ok ? 'Short recoveries keep heart rate in the aerobic zone.' : 'Long rests for aerobic work — reduce recovery to about 1:1.');
    const tot = (w + r) * n; let bars = ''; for (let k = 0; k < n; k++) bars += `<i style="display:inline-block;height:28px;width:${w / tot * 100}%;background:var(--a1);opacity:${i / 100}"></i><i style="display:inline-block;height:28px;width:${r / tot * 100}%;background:var(--line)"></i>`;
    $('#iv-out', body).innerHTML = `<div style="border-radius:8px;overflow:hidden;white-space:nowrap;font-size:0">${bars}</div><div class="tbl" style="margin-top:10px"><table><tr><td>Work : rest</td><td class="mono">1 : ${ratio.toFixed(1)}</td></tr><tr><td>Predominant system</td><td><b>${sys}</b></td></tr><tr><td>Session time</td><td class="mono">${Math.floor(tot / 60)} min ${tot % 60} s</td></tr></table></div><div class="box ${ok ? 'good' : 'warn'}"><b class="lbl">${ok ? 'Well designed' : 'Check the recovery'}</b><p>${advice}</p></div>`; });
});

/* ---- 1.6 Components of fitness sorter ---- */
SIMS.fitcomp = sorterSim('Health-related or skill-related?', 'Sort each component of fitness (with its test).', ['Health-related', 'Skill-related'], [
  ['Aerobic capacity — multi-stage fitness test', 0, 'Ability to take in, transport and use oxygen.'], ['Muscular strength — handgrip dynamometer / 1RM', 0, 'Maximum force in one contraction.'], ['Muscular endurance — press-up test', 0, 'Repeated contractions without fatigue.'],
  ['Body composition — skinfold callipers', 0, 'Proportions of fat, muscle and bone.'], ['Flexibility — sit and reach', 0, 'Range of movement at a joint.'], ['Agility — Illinois agility run', 1, 'Changing direction quickly and in control.'],
  ['Balance — stork stand', 1, 'Keeping the centre of mass over the base of support.'], ['Co-ordination — alternate-hand wall toss', 1, 'Moving body parts together smoothly.'], ['Speed — 30 m sprint', 1, 'Moving quickly from one point to another.'],
  ['Power — vertical jump', 1, 'Strength × speed.'], ['Reaction time — ruler drop test', 1, 'Time from stimulus to start of response.']
]);

/* ---- 1.7 Periodisation planner ---- */
SIMS.periodise = DS('Periodisation planner', 'Move the main competition and see how the training year is organised into phases. Add a second peak for double periodisation (e.g. indoor and outdoor seasons).', body => {
  body.innerHTML = `<div class="grid g2">${dsRange('pz-p', 'Main competition (week)', 20, 48, 1, 38, '')}${dsRange('pz-q', 'Second peak (week, 0 = none)', 0, 30, 1, 0, '')}</div><div id="pz-o"></div>`;
  dsWire(body, () => { const pk1 = val(body, 'pz-p'), pk2 = val(body, 'pz-q'), W = 620, X = w => 20 + w / 52 * 580; let s = '';
    const phases = []; const addPeak = (p, lenPrep) => { phases.push(['General prep', Math.max(0, p - lenPrep), p - Math.round(lenPrep * 0.45), 'var(--a3)'], ['Specific prep', p - Math.round(lenPrep * 0.45), p - 4, 'var(--a3)'], ['Competition + taper', p - 4, p + 1, 'var(--a1)']); };
    if (pk2 && pk2 < pk1 - 10) { addPeak(pk2, Math.min(pk2, 16)); addPeak(pk1, Math.min(pk1 - pk2 - 2, 14)); } else addPeak(pk1, Math.min(pk1, 26));
    phases.push(['Transition', pk1 + 1, 52, 'var(--a2)']);
    phases.forEach(([n, a, b, c]) => { if (b > a) s += `<rect x="${X(a)}" y="120" width="${X(b) - X(a) - 1}" height="30" rx="4" fill="${c}" fill-opacity=".3"/><text x="${(X(a) + X(b)) / 2}" y="140" font-size="10.5" text-anchor="middle" fill="var(--ink)">${b - a > 4 ? n : ''}</text>`; });
    [pk1, pk2].filter(Boolean).forEach(p => s += `<line x1="${X(p)}" y1="30" x2="${X(p)}" y2="160" stroke="var(--a1)" stroke-width="2" stroke-dasharray="4 3"/><text x="${X(p)}" y="24" font-size="11" text-anchor="middle" fill="var(--a1)">peak wk ${p}</text>`);
    let vol = '', inten = ''; for (let w = 0; w <= 52; w++) { const d1 = Math.min(...[pk1, pk2].filter(Boolean).map(p => Math.abs(w - p))); const I = 0.35 + 0.6 * Math.exp(-d1 / 7), V = w > pk1 ? 0.3 : 0.9 - 0.55 * Math.exp(-d1 / 6); vol += (w ? 'L' : 'M') + X(w) + ',' + (110 - V * 70); inten += (w ? 'L' : 'M') + X(w) + ',' + (110 - I * 70); }
    s += `<path d="${vol}" fill="none" stroke="var(--a3)" stroke-width="2.4"/><path d="${inten}" fill="none" stroke="var(--a1)" stroke-width="2.4"/><text x="24" y="44" font-size="11" fill="var(--a3)">volume</text><text x="24" y="58" font-size="11" fill="var(--a1)">intensity</text>`;
    for (let w = 0; w <= 52; w += 4) s += `<text x="${X(w)}" y="172" font-size="10" text-anchor="middle" fill="var(--muted)">${w}</text>`;
    $('#pz-o', body).innerHTML = `<svg viewBox="0 0 ${W} 180" width="100%" style="max-width:100%">${s}</svg><p class="small muted">Each coloured block is a mesocycle; each week is a microcycle; the whole year is the macrocycle. Volume falls and intensity rises into each peak; the taper cuts volume in the last 1–3 weeks.</p>`; });
});

/* ---- 1.7 Altitude training model ---- */
SIMS.altitude = {
  title: 'Altitude training model', h: 340, noPlay: true,
  controls: [{ id: 'alt', label: 'Training altitude (m)', min: 0, max: 4000, step: 100, value: 2400 }, { id: 'days', label: 'Days at altitude', min: 0, max: 35, step: 1, value: 21 }, { id: 'back', label: 'Days since returning to sea level', min: 0, max: 42, step: 1, value: 7 }],
  readouts: ['O₂ partial pressure at altitude', 'Red cell mass change', 'Effect at sea level', 'Drawback to watch'],
  note: 'A simplified model: lower partial pressure of O₂ → EPO → more red blood cells over weeks; the gain fades after returning. Real responses vary widely between athletes.',
  calc(p) { const pO2 = 21.2 * Math.exp(-p.alt / 8400), stim = clamp((p.alt - 1200) / 1800, 0, 1.3), gain = 9 * stim * (1 - Math.exp(-p.days / 14)), now = gain * Math.exp(-p.back / 21); return { pO2, gain, now }; },
  draw(c, W, H, st, C) { const r = this.calc(st.p), x0 = 60, bw = W - 120;
    CV.text(c, 'Partial pressure of O₂ (kPa)', x0, 36, C.muted, 12); CV.rrect(c, x0, 46, bw, 16, 8, C.line); CV.rrect(c, x0, 46, bw * r.pO2 / 21.2, 16, 8, C.info); CV.text(c, r.pO2.toFixed(1) + ' kPa (sea level 21.2)', x0 + 6, 76, C.ink, 12);
    CV.text(c, 'Red blood cell mass: gain at the end of the camp', x0, 116, C.muted, 12); CV.rrect(c, x0, 126, bw, 16, 8, C.line); CV.rrect(c, x0, 126, bw * r.gain / 12, 16, 8, C.a1); CV.text(c, '+' + r.gain.toFixed(1) + '%', x0 + 6, 156, C.ink, 12);
    CV.text(c, 'Remaining benefit at sea level now', x0, 196, C.muted, 12); CV.rrect(c, x0, 206, bw, 16, 8, C.line); CV.rrect(c, x0, 206, bw * r.now / 12, 16, 8, C.a3); CV.text(c, '+' + r.now.toFixed(1) + '% red cell mass', x0 + 6, 236, C.ink, 12);
    let d = ''; for (let k = 0; k <= 42; k++) { const v = r.gain * Math.exp(-k / 21), x = x0 + k / 42 * bw, y = H - 30 - v / 12 * 60; d += (k ? 'L' : 'M') + x + ',' + y; } c.strokeStyle = C.a3; c.lineWidth = 2; c.stroke(new Path2D(d)); CV.circle(c, x0 + st.p.back / 42 * bw, H - 30 - r.now / 12 * 60, 5, C.a3); CV.text(c, 'days after return →', x0 + bw, H - 16, C.muted, 11, 'right');
  },
  read(st) { const r = this.calc(st.p); return [r.pO2.toFixed(1) + ' kPa', '+' + r.gain.toFixed(1) + '%', r.now > 3 ? 'meaningful O₂-carrying boost' : r.now > 1 ? 'small boost' : 'little or none left', st.p.alt > 3000 ? 'altitude sickness; much lower training intensity' : st.p.alt > 1800 ? 'lower training intensity; dehydration' : 'altitude too low for a strong stimulus']; }
};

/* ---- 1.8 Energy systems over time ---- */
SIMS.energy = {
  title: 'Energy systems through a race', h: 360,
  controls: [{ id: 'I', label: 'Intensity (% of maximum)', min: 40, max: 100, step: 5, value: 100, fmt: v => v + '%' }, { id: 'T', label: 'Time into exercise (s)', min: 1, max: 180, step: 1, value: 8 }],
  readouts: ['ATP-PC', 'Anaerobic glycolysis', 'Aerobic', 'Predominant'],
  note: 'Press play to run the clock. All three systems contribute all the time; intensity is the main factor deciding which predominates. (Illustrative model.)',
  share(t, I) { const i = I / 100, pc = Math.exp(-Math.pow(t / 10, 2)) * i * i, gl = (1 - Math.exp(-t / 15)) * Math.exp(-t / 90) * i * i * i * 1.2, ae = (1 - Math.exp(-t / 25)) * (1.1 - 0.6 * i) + 0.05, s = pc + gl + ae; return [pc / s, gl / s, ae / s]; },
  step(st, dt) { st.p.T = st.p.T >= 180 ? 1 : Math.min(180, st.p.T + dt * 12); const inp = document.getElementById('sc-energy-T'); if (inp) { inp.value = Math.round(st.p.T); inp.style.setProperty('--p', (st.p.T / 180 * 100) + '%'); inp.previousElementSibling.querySelector('output').textContent = Math.round(st.p.T); } },
  init(st) { st.run = false; },
  draw(c, W, H, st, C) { const b = { x: 60, y: 30, w: W - 90, h: H - 90 }, cols = [C.a1, C.a4, C.a3];
    const X = t => b.x + t / 180 * b.w, Y = v => b.y + b.h - v * b.h;
    CV.rrect(c, b.x - 8, b.y - 8, b.w + 16, b.h + 26, 8, C.surface, C.line, 1);
    for (let t = 1; t <= 180; t += 1) { const sh = this.share(t, st.p.I); let acc = 0; sh.forEach((v, k) => { c.fillStyle = hexA(cols[k], .75); c.fillRect(X(t - 1), Y(acc + v), X(t) - X(t - 1) + .6, v * b.h); acc += v; }); }
    CV.line(c, X(st.p.T), b.y, X(st.p.T), b.y + b.h, C.ink, 2); [10, 60, 120, 180].forEach(t => CV.text(c, t + ' s', X(t), b.y + b.h + 14, C.muted, 11, 'center'));
    ['ATP-PC', 'anaerobic glycolysis', 'aerobic'].forEach((n, k) => { CV.rrect(c, b.x + k * 150, H - 26, 12, 12, 3, cols[k]); CV.text(c, n, b.x + 18 + k * 150, H - 20, C.ink, 12); });
    CV.text(c, '% of energy', b.x - 6, b.y - 14, C.muted, 11);
  },
  read(st) { const s = this.share(st.p.T, st.p.I), k = s.indexOf(Math.max(...s)); return s.map(v => Math.round(v * 100) + '%').concat([['ATP-PC (e.g. 60 m, shot)', 'anaerobic glycolysis (e.g. 400 m)', 'aerobic (e.g. 1500 m +)'][k]]); }
};

/* ---- 1.8 Lactate threshold ---- */
SIMS.threshold = {
  title: 'Lactate threshold and OBLA', h: 330, noPlay: true,
  controls: [{ type: 'seg', id: 'lvl', label: 'Training status', value: 1, options: [[0, 'untrained'], [1, 'club'], [2, 'elite endurance']] }, { id: 'I', label: 'Running intensity (% VO₂max)', min: 30, max: 100, step: 1, value: 70, fmt: v => v + '%' }],
  readouts: ['Blood lactate', 'OBLA (4 mmol/L) at', 'Zone', 'Sustainable pace?'],
  note: 'Training raises the intensity at which lactate starts to accumulate, so a higher % of VO₂max can be sustained. The dashed line is OBLA (4 mmol/L).',
  T(st) { return [52, 64, 78][+st.p.lvl]; },
  lac(I, T) { return 1 + Math.exp((I - T) / 9); },
  draw(c, W, H, st, C) { const T = this.T(st); const pl = CV.plot(c, C, { x: 60, y: 24, w: W - 90, h: H - 70 }, { xr: [30, 100], yr: [0, 12], xl: 'intensity (% VO₂max)', yl: 'blood lactate (mmol/L)',
      series: [[52, C.muted], [64, C.muted], [78, C.muted]].map(([t, col]) => ({ f: I => this.lac(I, t), col: t === T ? C.a1 : hexA(col, .4), w: t === T ? 3 : 1.5 })).concat([{ pts: [[30, 4], [100, 4]], col: C.a4, dash: [6, 4], w: 1.5 }]), dots: [[st.p.I, this.lac(st.p.I, T), C.a1, 6]] });
    CV.text(c, 'OBLA', pl.X(96), pl.Y(4) - 8, C.a4, 11, 'center');
  },
  read(st) { const T = this.T(st), L = this.lac(st.p.I, T), obla = T + 9 * Math.log(3); return [L.toFixed(1) + ' mmol/L', obla.toFixed(0) + '% VO₂max', L < 2 ? 'aerobic, steady' : L < 4 ? 'threshold zone' : 'above OBLA', L < 4 ? 'yes — for a long time' : 'no — fatigue within minutes']; }
};

/* ---- 1.9 Fuel use ---- */
SIMS.fuel = {
  title: 'Carbohydrate or fat? Fuel use', h: 330, noPlay: true,
  controls: [{ type: 'seg', id: 'tr', label: 'Performer', value: 0, options: [[0, 'untrained'], [1, 'trained endurance']] }, { id: 'I', label: 'Intensity (% VO₂max)', min: 20, max: 100, step: 1, value: 55, fmt: v => v + '%' }, { id: 'D', label: 'Duration so far (min)', min: 0, max: 180, step: 5, value: 20 }],
  readouts: ['Carbohydrate', 'Fat', 'Protein', 'Crossover point'],
  note: 'At low intensity fat is the main fuel; as intensity rises carbohydrate takes over. As duration increases and glycogen falls, fat use rises. Trained athletes use more fat at the same intensity, sparing glycogen.',
  X(st) { return (st.p.tr == 1 ? 60 : 48) + st.p.D / 180 * 12; },
  carb(I, X) { return 0.95 / (1 + Math.exp(-(I - X) / 9)) + 0.03; },
  draw(c, W, H, st, C) { const X = this.X(st), b = { x: 60, y: 24, w: W - 90, h: H - 70 };
    const pl = CV.plot(c, C, b, { xr: [20, 100], yr: [0, 100], xl: 'intensity (% VO₂max)', yl: '% of energy', fills: [{ col: hexA(C.a4, .35), pts: Array.from({ length: 81 }, (_, i) => [20 + i, 100]) }, { col: hexA(C.a1, .55), pts: Array.from({ length: 81 }, (_, i) => [20 + i, this.carb(20 + i, X) * 100]) }], series: [{ pts: [[X, 0], [X, 100]], col: C.ink, dash: [5, 4], w: 1.2 }], dots: [[st.p.I, this.carb(st.p.I, X) * 100, C.ink, 6]] });
    CV.text(c, 'carbohydrate', pl.X(88), pl.Y(50), '#fff', 12, 'center', 700); CV.text(c, 'fat', pl.X(28), pl.Y(80), C.ink, 12, 'center', 700);
  },
  read(st) { const X = this.X(st), cb = this.carb(st.p.I, X), pr = 0.03; return [Math.round((cb - 0.015) * 100) + '%', Math.round((1 - cb - 0.015) * 100) + '%', '≈ 2–5%', Math.round(X) + '% VO₂max']; }
};

/* ---- 1.9 Hydration calculator ---- */
SIMS.hydration = DS('Hydration planner', 'Estimate fluid loss during a session and whether it will affect performance, then plan rehydration. Sweat rates vary with temperature, intensity and the individual.', body => {
  body.innerHTML = `<div class="grid g2">${dsRange('hy-m', 'Body mass', 45, 120, 1, 70, ' kg')}${dsRange('hy-t', 'Duration', 15, 180, 5, 90, ' min')}${dsRange('hy-s', 'Sweat rate', 0.3, 2.5, 0.1, 1.2, ' L/h')}${dsRange('hy-d', 'Drinking every 15 min', 0, 350, 25, 150, ' ml')}</div>${dsSelect('hy-e', 'Event type', [['team', 'team game (80 min)'], ['endurance', 'endurance event'], ['short', 'short session, energy not needed'], ['after', 'recovery after training']], 'team')}<div id="hy-o" style="margin-top:12px"></div>`;
  dsWire(body, () => { const m = val(body, 'hy-m'), t = val(body, 'hy-t'), sr = val(body, 'hy-s'), dr = val(body, 'hy-d'), ev = val(body, 'hy-e');
    const lost = sr * t / 60, drunk = dr * Math.floor(t / 15) / 1000, net = Math.max(0, lost - drunk), pc = net / m * 100;
    const drink = { team: ['Isotonic', 'fluid and energy (6–8 g carbohydrate/100 ml)'], endurance: ['Isotonic (or hypotonic early on)', 'fluid plus 30–60 g carbohydrate per hour'], short: ['Hypotonic or water', 'fastest rehydration with little energy'], after: ['Hypertonic / recovery drink + water', 'glycogen replacement; rehydrate with sodium'] }[ev];
    $('#hy-o', body).innerHTML = hbar('Fluid lost', lost, 5, 'var(--info)', lost.toFixed(2) + ' L') + hbar('Fluid drunk', drunk, 5, 'var(--good)', drunk.toFixed(2) + ' L') + hbar('Body mass lost', pc, 5, pc >= 2 ? 'var(--bad)' : 'var(--warn)', pc.toFixed(1) + '%', 2) +
      `<div class="box ${pc >= 2 ? 'warn' : 'good'}"><b class="lbl">${pc >= 2 ? 'Performance likely impaired' : 'Within safe limits'}</b><p>${pc >= 2 ? 'Losing ≥ 2% of body mass reduces plasma volume and stroke volume, raises heart rate and core temperature, and harms decision making.' : 'Keep drinking to plan; check urine colour.'} After the session drink about <b>${(net * 1.5).toFixed(1)} L</b> (1.5 × the mass lost). Suggested drink: <b>${drink[0]}</b> — ${drink[1]}.</p></div>`; });
});

/* ---- 1.9 Glycaemic index ---- */
const GI_FOODS = [['Glucose drink', 100], ['Sports drink', 78], ['White bread', 75], ['Baked potato', 85], ['Jelly sweets', 78], ['Banana (ripe)', 62], ['Porridge oats', 58], ['Basmati rice', 58], ['Wholegrain bread', 51], ['Pasta', 45], ['Apple', 38], ['Lentils', 30]];
SIMS.gi = {
  title: 'Glycaemic index: blood glucose after eating', h: 340, noPlay: true,
  controls: [{ type: 'seg', id: 'a', label: 'Food A', value: 0, options: GI_FOODS.slice(0, 6).map((f, i) => [i, f[0]]) }, { type: 'seg', id: 'b', label: 'Food B', value: 9, options: GI_FOODS.slice(6).map((f, i) => [i + 6, f[0]]) }],
  readouts: ['Food A (GI)', 'Food B (GI)', 'Best before competition', 'Best straight after'],
  note: 'High GI (≥ 70) raises blood glucose quickly and can cause a rebound dip; low GI (≤ 55) releases glucose slowly and steadily — ideal 2–4 hours before competition. (Illustrative curves.)',
  curve(gi) { return t => 4.6 + (gi / 100) * 3.6 * Math.exp(-Math.pow((t - (20 + (100 - gi) * 0.6)) / (14 + (100 - gi) * 0.5), 2)) - (gi > 70 ? (gi - 70) / 30 * 0.9 * Math.exp(-Math.pow((t - 95) / 20, 2)) : 0); },
  draw(c, W, H, st, C) { const A = GI_FOODS[+st.p.a], B = GI_FOODS[+st.p.b];
    CV.plot(c, C, { x: 60, y: 24, w: W - 90, h: H - 70 }, { xr: [0, 150], yr: [3, 9], xl: 'minutes after eating', yl: 'blood glucose (mmol/L)', series: [{ f: this.curve(A[1]), col: C.a1, w: 3 }, { f: this.curve(B[1]), col: C.a3, w: 3 }, { pts: [[0, 4.6], [150, 4.6]], col: C.muted, dash: [5, 4], w: 1 }] });
    CV.text(c, `A: ${A[0]} (GI ${A[1]})`, W - 40, 40, C.a1, 12.5, 'right', 700); CV.text(c, `B: ${B[0]} (GI ${B[1]})`, W - 40, 60, C.a3, 12.5, 'right', 700);
  },
  read(st) { const A = GI_FOODS[+st.p.a], B = GI_FOODS[+st.p.b], lo = A[1] < B[1] ? A : B, hi = A[1] < B[1] ? B : A; const cat = g => g >= 70 ? 'high' : g <= 55 ? 'low' : 'medium'; return [`${A[1]} — ${cat(A[1])}`, `${B[1]} — ${cat(B[1])}`, lo[0] + ' (3–4 h before)', hi[0] + ' (with protein)']; }
};

/* ---- 1.10 Eysenck plotter ---- */
SIMS.eysenck = DS('Place a performer on Eysenck’s dimensions', 'Rate a performer (or yourself) on each statement. The dot shows where they sit on the extrovert–introvert and stable–neurotic dimensions. Remember: personality does not predict sporting success.', body => {
  const Q = [['Enjoys being the centre of attention', 'e'], ['Prefers training with a group', 'e'], ['Looks for excitement and risk', 'e'], ['Worries a lot before competition', 'n'], ['Mood changes quickly', 'n'], ['Stays calm after a mistake', 's']];
  body.innerHTML = `<div class="grid g2"><div>${Q.map((q, i) => dsRange('ey' + i, q[0], 1, 5, 1, 3, '')).join('')}</div><div id="ey-o"></div></div>`;
  dsWire(body, () => { const v = Q.map((_, i) => val(body, 'ey' + i)); const ex = (v[0] + v[1] + v[2] - 9) / 6, ne = (v[3] + v[4] + (6 - v[5]) - 9) / 6;
    const x = 150 + ex * 120, y = 150 - ne * 120, qd = ex >= 0 ? (ne >= 0 ? 'unstable extrovert' : 'stable extrovert') : (ne >= 0 ? 'unstable introvert' : 'stable introvert');
    const sport = { 'stable extrovert': 'team games, gross skills, leadership roles', 'unstable extrovert': 'fast, exciting activities — but may struggle with pressure', 'stable introvert': 'individual, closed, fine skills (golf, archery, distance running)', 'unstable introvert': 'self-paced activities; anxiety control is important' }[qd];
    $('#ey-o', body).innerHTML = `<svg viewBox="0 0 300 300" width="100%" style="max-width:300px"><line x1="20" y1="150" x2="280" y2="150" stroke="var(--ink)"/><line x1="150" y1="20" x2="150" y2="280" stroke="var(--ink)"/><text x="22" y="143" font-size="11" fill="var(--muted)">introvert</text><text x="278" y="143" font-size="11" text-anchor="end" fill="var(--muted)">extrovert</text><text x="156" y="30" font-size="11" fill="var(--muted)">neurotic</text><text x="156" y="276" font-size="11" fill="var(--muted)">stable</text><circle cx="${x}" cy="${y}" r="9" fill="var(--a2)"/></svg><p><b>${qd}</b> — often linked with ${sport}.</p>`; });
});

/* ---- 1.11 Arousal theories explorer ---- */
SIMS.arousal = {
  title: 'Arousal and performance', h: 350, noPlay: true,
  controls: [{ type: 'seg', id: 'th', label: 'Theory', value: 'iu', options: [['drive', 'drive'], ['iu', 'inverted-U'], ['cat', 'catastrophe']] }, { type: 'seg', id: 'sk', label: 'Skill / performer', value: 1, options: [[0, 'fine, complex / novice'], [1, 'mixed'], [2, 'gross, simple / expert']] }, { id: 'a', label: 'Arousal', min: 0, max: 100, step: 1, value: 45 }],
  readouts: ['Performance', 'Optimum arousal', 'State', 'Suggested technique'],
  note: 'Inverted-U: the optimum is lower for fine, complex skills and novices. Catastrophe: past the optimum with high cognitive anxiety performance collapses — reducing arousal slightly is not enough to recover.',
  opt(st) { return [30, 50, 68][+st.p.sk]; },
  perf(a, st) { const o = this.opt(st), th = st.p.th; if (th === 'drive') return +st.p.sk === 0 ? clamp(60 - a * 0.4, 0, 100) : clamp(10 + a * 0.85, 0, 100); if (th === 'iu') return clamp(100 - Math.pow((a - o) / (o > 50 ? 1.1 : 0.9), 2) / 30, 0, 100); return a <= o + 4 ? clamp(100 - Math.pow((a - o) / 1, 2) / 28, 0, 100) : 18; },
  draw(c, W, H, st, C) { const pl = CV.plot(c, C, { x: 60, y: 24, w: W - 90, h: H - 70 }, { xr: [0, 100], yr: [0, 105], xl: 'arousal', yl: 'performance', series: [{ f: a => this.perf(a, st), col: C.a2, w: 3 }], dots: [[st.p.a, this.perf(st.p.a, st), C.a1, 7]] });
    if (st.p.th !== 'drive') { const o = this.opt(st); CV.line(c, pl.X(o), pl.Y(0), pl.X(o), pl.Y(100), C.muted, 1, [4, 3]); CV.text(c, 'optimum', pl.X(o), pl.Y(0) - 10, C.muted, 11, 'center'); } },
  read(st) { const p = this.perf(st.p.a, st), o = this.opt(st), a = st.p.a; return [Math.round(p) + '%', st.p.th === 'drive' ? 'none — linear' : o + '', a < o - 12 ? 'under-aroused' : a > o + 12 ? (st.p.th === 'cat' ? 'catastrophe!' : 'over-aroused') : 'in the zone', a < o - 12 ? 'psych up: music, pep talk, goals' : a > o + 12 ? 'breathing, PMR, imagery, self-talk' : 'keep routine']; }
};

/* ---- 1.12 Achievement motivation ---- */
SIMS.achieve = {
  title: 'Achievement motivation: choosing a challenge', h: 320, noPlay: true,
  controls: [{ id: 'nach', label: 'Need to achieve (NAch)', min: 0, max: 10, step: 1, value: 7 }, { id: 'naf', label: 'Need to avoid failure (NAF)', min: 0, max: 10, step: 1, value: 3 }],
  readouts: ['Profile', 'Preferred task', 'Response to failure', 'Coaching tip'],
  note: 'Atkinson: tendency to approach = motive × probability of success × incentive (incentive = 1 − probability). High-NAch performers prefer about a 50:50 challenge; high-NAF performers pick very easy or impossible tasks.',
  draw(c, W, H, st, C) { const n = st.p.nach, f = st.p.naf, net = n - f;
    CV.plot(c, C, { x: 60, y: 24, w: W - 90, h: H - 70 }, { xr: [0, 1], yr: [-3, 3], xl: 'probability of success', yl: 'motivation to take part', series: [{ f: p => net * p * (1 - p) * 4 / 10 * 2.5, col: net >= 0 ? C.a3 : C.a1, w: 3 }, { pts: [[0, 0], [1, 0]], col: C.muted, w: 1 }] }); },
  read(st) { const net = st.p.nach - st.p.naf; return [net > 1 ? 'high NAch — approach' : net < -1 ? 'high NAF — avoidance' : 'mixed', net > 0 ? '≈ 50:50 challenge' : 'very easy or impossible tasks', net > 0 ? 'persists; attributes to effort' : 'gives up; fears evaluation', net > 0 ? 'set challenging goals' : 'early success, praise effort, attributional retraining']; }
};

/* ---- 1.14 Learning curves ---- */
SIMS.curves = {
  title: 'Learning curves and plateaus', h: 330, noPlay: true,
  controls: [{ type: 'seg', id: 'sh', label: 'Curve', value: 'neg', options: [['lin', 'linear'], ['pos', 'positive'], ['neg', 'negative'], ['pla', 'with plateau']] }, { id: 'n', label: 'Trials completed', min: 5, max: 60, step: 1, value: 40 }],
  readouts: ['Shape', 'Likely cause', 'Stage of learning', 'Coach’s response'],
  note: 'Performance fluctuates from trial to trial, so real curves are noisy. A plateau is a period with no improvement — not a decline.',
  f(t, sh) { t /= 60; return sh === 'lin' ? 10 + 80 * t : sh === 'pos' ? 10 + 80 * t * t : sh === 'neg' ? 10 + 80 * (1 - Math.exp(-t * 4)) : 10 + (t < 0.35 ? 150 * t : t < 0.6 ? 52 : 52 + 90 * (t - 0.6)); },
  init(st) { st.noise = Array.from({ length: 61 }, () => (Math.random() - .5) * 8); },
  draw(c, W, H, st, C) { const sh = st.p.sh, pts = []; for (let t = 0; t <= st.p.n; t++) pts.push([t, clamp(this.f(t, sh) + st.noise[t], 0, 100)]);
    CV.plot(c, C, { x: 60, y: 24, w: W - 90, h: H - 70 }, { xr: [0, 60], yr: [0, 100], xl: 'trials', yl: 'performance', series: [{ f: t => t <= st.p.n ? this.f(t, sh) : NaN, col: C.a3, w: 3 }], dots: pts.map(p => [p[0], p[1], hexA(C.a3, .5), 3]) }); },
  read(st) { return { lin: ['linear', 'steady practice, simple task', 'associative', 'keep variety'], pos: ['positive — slow then fast', 'complex task / low ability / low early motivation', 'cognitive → associative', 'demonstrations, part practice, praise'], neg: ['negative — fast then slow', 'simple task / high ability or motivation', 'associative → autonomous', 'new goals to avoid drive reduction'], pla: ['plateau', 'boredom, fatigue, limit of ability, drive reduction', 'moving between stages', 'vary practice, rest, new goals, rewards'] }[st.p.sh]; }
};

  dsWire(body, () => { const g = k => val(body, 'pr-' + k), out = [];

    out.push(g('st') === 'cog' || g('dg') === 'yes' || g('fit') === 'low' || g('cx') === 'complex' ? ['Distributed practice', 'rest for recovery, feedback and mental rehearsal'] : ['Massed practice', 'efficient for fit, motivated, experienced learners']);
    out.push(g('st') === 'cog' ? [g('dg') === 'yes' ? 'Manual/mechanical + visual guidance' : 'Visual guidance (demonstrations)', 'builds a mental picture; safety'] : g('st') === 'ass' ? ['Visual and verbal guidance', 'refines technique'] : ['Verbal guidance', 'detailed technical/tactical points']);

/* ---- Skills: graph plotter ---- */
SIMS.grapher = DS('Plot and read a graph', 'Enter data (up to 8 pairs). The tool plots it with labelled axes, and calculates the change, the percentage change and the mean — then describe the trend using the figures.', body => {
  body.innerHTML = `<div class="grid g2"><div><label class="small">x values (comma-separated)<input id="gr-x" type="text" class="ds-sel" value="0, 2, 4, 6, 8, 10"></label><label class="small">y values<input id="gr-y" type="text" class="ds-sel" value="72, 128, 150, 152, 151, 153"></label><label class="small">x label<input id="gr-xl" type="text" class="ds-sel" value="time (min)"></label><label class="small">y label<input id="gr-yl" type="text" class="ds-sel" value="heart rate (bpm)"></label></div><div id="gr-o"></div></div>`;
  dsWire(body, () => { const xs = val(body, 'gr-x').split(',').map(Number).filter(isFinite).slice(0, 8), ys = val(body, 'gr-y').split(',').map(Number).filter(isFinite).slice(0, xs.length);
    if (xs.length < 2 || ys.length < 2) { $('#gr-o', body).innerHTML = '<p class="muted">Enter at least two pairs.</p>'; return; }
    const n = Math.min(xs.length, ys.length), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(0, Math.min(...ys)), y1 = Math.max(...ys) * 1.1, X = x => 50 + (x - x0) / (x1 - x0 || 1) * 240, Y = y => 190 - (y - y0) / (y1 - y0 || 1) * 170;
    let d = ''; for (let i = 0; i < n; i++) d += (i ? 'L' : 'M') + X(xs[i]) + ',' + Y(ys[i]);
    const mean = ys.slice(0, n).reduce((a, b) => a + b, 0) / n, ch = ys[n - 1] - ys[0], pc = ys[0] ? ch / ys[0] * 100 : 0;
    $('#gr-o', body).innerHTML = `<svg viewBox="0 0 320 230" width="100%"><line x1="50" y1="190" x2="300" y2="190" stroke="var(--ink)"/><line x1="50" y1="190" x2="50" y2="15" stroke="var(--ink)"/><path d="${d}" fill="none" stroke="var(--a1)" stroke-width="2.5"/>${xs.slice(0, n).map((x, i) => `<circle cx="${X(x)}" cy="${Y(ys[i])}" r="3.5" fill="var(--a1)"/>`).join('')}<text x="300" y="220" font-size="11" text-anchor="end" fill="var(--ink)">${esc(val(body, 'gr-xl'))}</text><text x="54" y="14" font-size="11" fill="var(--ink)">${esc(val(body, 'gr-yl'))}</text><text x="46" y="${Y(y1 / 1.1) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(y1 / 1.1)}</text><text x="46" y="194" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(y0)}</text></svg>
      <div class="small">Change: <b>${sf(ch, 3)}</b> · % change: <b>${sf(pc, 3)}%</b> · mean: <b>${sf(mean, 3)}</b></div>`; });
});

const plotBox = (W, H) => ({ x: 60, y: 24, w: W - 90, h: H - 70 });

/* ---- 3.1 Cardiac output ---- */
SIMS.cardiac = {
  title: 'Heart rate, stroke volume and cardiac output', h: 340, noPlay: true,
  controls: [{ type: 'seg', id: 'tr', label: 'Performer', value: 0, options: [[0, 'untrained'], [1, 'trained endurance']] }, { id: 'I', label: 'Exercise intensity', min: 0, max: 100, step: 1, value: 50, fmt: v => v + '%' }],
  readouts: ['Heart rate', 'Stroke volume', 'Cardiac output', 'Why'],
  note: 'Q = HR × SV. Stroke volume rises with venous return (Frank–Starling) and plateaus at about 40–60% intensity; beyond that, cardiac output rises mainly through heart rate. The trained heart has a larger SV and a lower HR at any submaximal workload.',
  v(st, I) { const tr = +st.p.tr, hr = (tr ? 50 : 72) + ((tr ? 195 : 200) - (tr ? 50 : 72)) * I / 100, sv = (tr ? 100 : 70) + (tr ? 80 : 45) * Math.min(1, I / (tr ? 70 : 50)); return { hr, sv, q: hr * sv / 1000 }; },
  draw(c, W, H, st, C) { const b = plotBox(W, H), tr = st.p.tr;

  let round = 0, seq = [], res = [];
  const start = () => { const n = 5 + round * 2, chunk = round >= 2; seq = shuffle(CALLS.concat(CALLS)).slice(0, n); const shown = chunk ? seq.map((w, i) => w + ((i + 1) % 3 === 0 && i < n - 1 ? ' | ' : ' · ')).join('') : seq.join(' · ');
    body.innerHTML = `<div class="card" style="text-align:center;font:700 22px var(--f-mono);padding:22px">${shown}</div><p class="small muted">Memorise… (${chunk ? 'grouped in threes' : 'no grouping'})</p>`;

  const check = () => { const ans = $('#mm-in', body).value.trim().toLowerCase().split(/[\s,·|]+/).filter(Boolean); let k = 0; while (k < seq.length && ans[k] === seq[k]) k++; res.push([seq.length, k, round >= 2]); round++;

    $('#mm-next', body).onclick = () => { if (round >= 4) { round = 0; res = []; } start(); }; };

  const KEYS = ['f', 'j', 'd', 'k'], COLS = ['var(--a1)', 'var(--a3)', 'var(--a2)', 'var(--a4)'];
  let n = 1, trial = 0, t0 = 0, target = -1, times = {}, tm = null, waiting = false;
  const pads = () => `<div class="row" style="justify-content:center;gap:12px;margin:18px 0">${Array.from({ length: n }, (_, i) => `<button class="btn" data-p="${i}" style="width:84px;height:84px;border-radius:16px;font:800 20px var(--f-display);${i === target ? `background:${COLS[i]};color:#fff;border-color:${COLS[i]}` : ''}">${KEYS[i].toUpperCase()}</button>`).join('')}</div>`;
  const draw = msg => { body.innerHTML = `<div class="row" style="justify-content:space-between"><span class="pill">${n} choice${n > 1 ? 's' : ''} · trial ${Math.min(trial + 1, 5)}/5</span><span class="small muted">${msg || ''}</span></div>${pads()}${chart()}`;
    $$('[data-p]', body).forEach(b => b.onpointerdown = () => press(+b.dataset.p)); };
  const chart = () => { const ks = [1, 2, 4].filter(k => times[k]?.length); if (!ks.length) return ''; const pts = ks.map(k => [k, times[k].reduce((a, b) => a + b, 0) / times[k].length]);
    return `<div class="tbl"><table><tr><th>Choices</th><th>Mean reaction time</th></tr>${pts.map(p => `<tr><td>${p[0]}</td><td class="mono">${Math.round(p[1])} ms</td></tr>`).join('')}</table></div>`; };
  const arm = () => { target = -1; waiting = true; draw('wait for a target…'); clearTimeout(tm); tm = setTimeout(() => { target = Math.floor(Math.random() * n); t0 = performance.now(); waiting = false; draw('GO!'); }, 900 + Math.random() * 1800); };
  const press = i => { if (waiting) { clearTimeout(tm); draw('Too early! Wait for the colour.'); setTimeout(arm, 900); return; } if (target < 0) return; const rt = performance.now() - t0; if (i !== target) { draw('Wrong target — try again.'); setTimeout(arm, 900); return; }
    (times[n] ??= []).push(rt); trial++; target = -1; sfx.tick();
    if (trial >= 5) { trial = 0; n = n === 1 ? 2 : n === 2 ? 4 : 0; if (!n) { finish(); return; } draw(`Next: ${n} choices`); setTimeout(arm, 1200); } else { draw(Math.round(rt) + ' ms'); setTimeout(arm, 700); } };
  const key = e => { if (!document.body.contains(body)) { removeEventListener('keydown', key); return; } const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0 && n && i < n) press(i); };
  const finish = () => { const m = k => times[k].reduce((a, b) => a + b, 0) / times[k].length; body.innerHTML = `${chart()}<p>Your choice reaction time rose from <b>${Math.round(m(1))} ms</b> (1 choice) to <b>${Math.round(m(4))} ms</b> (4 choices) — Hick’s law. Attackers create more choices (disguise) to slow defenders; defenders anticipate to reduce them.</p><button class="btn primary" id="rt-again">Test again</button>`; $('#rt-again', body).onclick = () => { n = 1; trial = 0; times = {}; arm(); }; };
  addEventListener('keydown', key);
  body.innerHTML = `<p>Use keys <b>F</b>, <b>J</b>, <b>D</b>, <b>K</b> or tap the pads. Don’t anticipate — an early press restarts the trial.</p><button class="btn primary" id="rt-go">Start</button>`; $('#rt-go', body).onclick = arm;
  return () => { clearTimeout(tm); removeEventListener('keydown', key); };
});

/* ---- 3.19 PRP ---- */
SIMS.prp = {
  title: 'The psychological refractory period', h: 300, noPlay: true,
  controls: [{ id: 'gap', label: 'Gap between dummy and real move (ms)', min: 0, max: 600, step: 10, value: 120 }, { id: 'proc', label: 'Defender’s processing time for S1 (ms)', min: 150, max: 350, step: 10, value: 220 }],
  readouts: ['Response to S2 starts at', 'PRP delay', 'Outcome', 'Why'],
  note: 'Single-channel hypothesis: the defender cannot start processing the real move (S2) until the dummy (S1) has been processed. A gap shorter than the processing time adds a delay — the PRP.',
  draw(c, W, H, st, C) { const g = st.p.gap, p = st.p.proc, delay = Math.max(0, p - g), sc = (W - 80) / 900, X = t => 40 + t * sc;
    CV.line(c, 40, H - 50, W - 40, H - 50, C.ink, 1.4); [0, 200, 400, 600, 800].forEach(t => CV.text(c, t + ' ms', X(t), H - 34, C.muted, 11, 'center'));
    CV.rrect(c, X(0), 70, p * sc, 30, 6, hexA(C.a2, .4)); CV.text(c, 'processing S1 (dummy)', X(0) + 6, 85, C.ink, 12);
    if (delay) { CV.rrect(c, X(g), 120, delay * sc, 30, 6, hexA(C.a4, .5)); CV.text(c, 'PRP', X(g) + 4, 135, C.ink, 12, 'left', 700); }
    CV.rrect(c, X(g + delay), 120, 220 * sc, 30, 6, hexA(C.a1, .4)); CV.text(c, 'processing S2', X(g + delay) + 6, 135, C.ink, 12);
    CV.arrow(c, X(g), 40, X(g), 118, C.a1, 2); CV.text(c, 'S2 real move', X(g), 30, C.a1, 12, 'center', 700); },
  read(st) { const g = st.p.gap, p = st.p.proc, delay = Math.max(0, p - g); return [(g + delay + 220) + ' ms', delay + ' ms', delay > 60 ? 'attacker gets past' : 'defender reacts in time', delay ? 'S2 arrived before S1 was processed' : 'gap too long — the dummy was “read”']; }
};

function drawGameArt(cv, id) {
  const c = cv.getContext('2d'), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; c.scale(dpr, dpr);
  c.fillStyle = '#0B1326'; c.fillRect(0, 0, W, H);
  const col = { muscle: '#FF6478', plane: '#3CCBB4', tests: '#A98BFF', reaction: '#FF9152', blitz: '#F2B04E' }[id];
  if (id === 'reaction') { for (let i = 0; i < 12; i++) { c.fillStyle = hexA(col, .2 + .06 * i); c.fillRect(20 + i * (W - 40) / 12, H - 24 - i * 5, (W - 40) / 12 - 4, 10 + i * 5); } }
  else if (id === 'plane') { const cx = W - 70, cy = H / 2 - 6; [[.4, '#6CC47A'], [.38, '#E8B84A'], [.12, '#FF8A5B'], [.08, '#64A8F0'], [.02, '#B98AEF']].reduce((a0, [p, cc]) => { c.fillStyle = cc; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, 44, a0, a0 + p * Math.PI * 2); c.fill(); return a0 + p * Math.PI * 2; }, -Math.PI / 2); }
  else if (id === 'tests') { for (let i = 0; i < 14; i++) { const x = 20 + Math.random() * (W - 40), y = 10 + Math.random() * (H - 50); c.save(); c.translate(x, y); c.rotate(Math.random() * 3); c.fillStyle = hexA(col, .3 + Math.random() * .5); c.beginPath(); c.roundRect ? c.roundRect(-10, -4, 20, 8, 4) : c.rect(-10, -4, 20, 8); c.fill(); c.restore(); } }
  else for (let i = 0; i < 26; i++) { c.fillStyle = hexA(col, Math.random() * .5 + .1); c.beginPath(); c.arc(Math.random() * W, Math.random() * (H - 30), 2 + Math.random() * 8, 0, 7); c.fill(); }
  CV.text(c, GAMES[id].title, 14, H - 18, '#fff', 21, 'left', 700, '"Barlow Condensed", sans-serif');
}

function mountGame(host, id) {
  let alive = true, timer = null; const stop = () => { alive = false; clearInterval(timer); };
  const hud = (items) => `<div class="game-hud">${items.map(([k, v]) => `<div class="hud"><span>${k}</span><b>${v}</b></div>`).join('')}<span class="spacer"></span><a class="btn sm" href="#/arcade">${ICON.back} Arcade</a></div>`;
  const endScreen = (score, extra = '') => { const nb = gameBest(id, score); if (score > 0) addXP(Math.min(60, Math.round(score / 2)), GAMES[id].title); if (nb && score > 0) { burst(); sfx.win(); }
    host.innerHTML = `<div class="game"><div class="card result"><div class="eyebrow">${GAMES[id].title}</div><div class="big">${score}</div><p class="lede" style="margin:8px auto">${nb ? 'New personal best!' : 'Personal best: ' + S.games[id].best}</p>${extra}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-again>Play again</button><a class="btn" href="#/arcade">Back to arcade</a></div></div></div>`;
    $('[data-again]', host).onclick = () => { stop(); cleanup = mountGame(host, id); }; };
  let cleanup = stop;

  if (id === 'muscle' || id === 'plane' || id === 'tests') {
    const bank = id === 'muscle' ? MUSCLE_BANK : id === 'plane' ? PLANE_BANK : TEST_BANK, total = 60;
    let score = 0, streak = 0, left = total, cur = null, answered = 0, right = 0;
    const next = () => { const item = pick(bank); const seen = new Set([item[1]]), others = shuffle(bank.filter(b => b[1] !== item[1])).filter(b => !seen.has(b[1]) && seen.add(b[1])).slice(0, 3); cur = { item, opts: shuffle([item, ...others]) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Streak', streak], ['Time', Math.ceil(left) + 's']])}<div class="timer"><i style="width:${left / total * 100}%"></i></div>
        <div class="eyebrow" style="text-align:center">${id === 'muscle' ? 'Which muscle is the agonist?' : id === 'plane' ? 'Which type of joint?' : 'Which component does it train?'}</div><div class="big-prompt">${esc(cur.item[0])}</div>
        <div class="opts">${cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o[1])}</span></button>`).join('')}</div><p class="kbd-hint">Keys 1–4 to answer.</p></div>`;
      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => { if (!alive) return; answered++; const ok = cur.opts[i] === cur.item; const btn = $$('.opt', host)[i]; if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btn.classList.add('right'); } else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btn.classList.add('wrong'); $$('.opt', host)[cur.opts.indexOf(cur.item)].classList.add('right'); } setTimeout(() => alive && left > 0 && next(), ok ? 250 : 900); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= 4 && !$('.opt.right', host)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();
    return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'reaction') {
    let n = 0, times = [], t0 = 0, armed = false, tm = null;
    const render = (msg, go) => { host.innerHTML = `<div class="game">${hud([['Trial', Math.min(n + 1, 10) + '/10'], ['Mean', times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) + ' ms' : '—']])}<button id="rt-pad" class="card" style="display:block;width:100%;height:220px;border-radius:20px;font:800 34px var(--f-display);text-transform:uppercase;cursor:pointer;background:${go ? 'var(--a5)' : 'var(--surface-2)'};color:${go ? '#fff' : 'var(--ink)'}">${msg}</button><p class="kbd-hint">Tap the pad or press Space when it turns orange.</p></div>`; $('#rt-pad', host).onpointerdown = hit; };
    const arm = () => { armed = false; render('Wait…'); clearTimeout(tm); tm = setTimeout(() => { if (!alive) return; armed = true; t0 = performance.now(); render('Go!', true); }, 1000 + Math.random() * 2200); };
    const hit = () => { if (!armed) { clearTimeout(tm); render('Too early!'); sfx.bad(); setTimeout(() => alive && arm(), 900); return; } const rt = performance.now() - t0; armed = false; times.push(rt); n++; sfx.good();
      if (n >= 10) { const m = times.reduce((a, b) => a + b, 0) / times.length; removeEventListener('keydown', key); endScreen(Math.max(0, Math.round(600 - m)), `<p class="muted">Mean simple reaction time ${Math.round(m)} ms (score = 600 − mean). The ruler drop test measures the same component; choice reactions (several possible stimuli) are slower.</p>`); } else { render(Math.round(rt) + ' ms'); setTimeout(() => alive && arm(), 800); } };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.code === 'Space') { e.preventDefault(); hit(); } };
    addEventListener('keydown', key); arm();
    return () => { stop(); clearTimeout(tm); removeEventListener('keydown', key); };
  }

  if (id === 'blitz') {
    const pool = allTopics().flatMap(t => V_(t).quiz.map(q => ({ q, t }))); let score = 0, lives = 3, cur;
    const next = () => { const { q, t } = pick(pool); const truth = Math.random() < 0.5; const opt = truth ? q.o[0] : pick(q.o.slice(1)); cur = { q, t, truth, opt }; render(); };
    const render = () => { host.innerHTML = `<div class="game">${hud([['Score', score], ['Lives', '♥'.repeat(lives) || '0']])}<div class="card"><div class="eyebrow">${cur.t.id} · ${esc(cur.t.title)}</div><p class="q-text">${rich(cur.q.q)}</p><div class="box def" style="font-size:17px"><b class="lbl">Proposed answer</b><p>${rich(cur.opt)}</p></div>
      <div class="row" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn primary" data-a="1" style="min-width:130px">True <kbd>T</kbd></button><button class="btn" data-a="0" style="min-width:130px">False <kbd>F</kbd></button></div><div id="bz-fb"></div></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => answer(b.dataset.a === '1')); };
    const answer = a => { if ($('#bz-fb', host).innerHTML) return; const ok = a === cur.truth; ok ? (score += 10, sfx.good()) : (lives--, sfx.bad());
      $('#bz-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</b> ${cur.truth ? 'That answer is right.' : 'The correct answer is: ' + rich(cur.q.o[0])} ${cur.q.x ? '<br><span class="muted">' + rich(cur.q.x) + '</span>' : ''}</div>`;
      setTimeout(() => { if (!alive) return; lives > 0 ? next() : endScreen(score); }, ok ? 900 : 2600); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 't' || e.key === 'T') answer(true); if (e.key === 'f' || e.key === 'F') answer(false); };
    addEventListener('keydown', key); next(); return () => { stop(); removeEventListener('keydown', key); };
  }
  return stop;
}

function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, v = V_(t);
  const ck = t.cards.length ? Object.entries(s.cards).filter(([i, b]) => b >= 3 && inScope(t.cards[i]?.[2] || '')).length / Math.max(1, v.cards.length) : 0;
  const sp = v.spec.reduce((a, [, i]) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / Math.max(1, v.spec.length);
  const calc = v.gens.length ? Math.min(s.calc || 0, 5) / 5 : q;
  return clamp(0.4 * q + 0.2 * ck + 0.2 * sp + 0.2 * calc, 0, 1);
}

      <section id="s-wk"><h3><span class="k">DO</span>Worked examples</h3>${v.worked.map((w, i) => `<div class="worked" data-w="${i}"><div class="wq"><span class="eyebrow">Example ${i + 1} ${tagHTML(flagOf(w), 1)}</span><div style="margin-top:6px">${rich(w.q)}</div></div><ol>${w.s.map((st, j) => `<li class="${j ? 'hid' : ''}">${rich(st)}</li>`).join('')}</ol><div class="wf"><button class="btn sm primary" data-step>Next step</button><button class="btn sm ghost" data-all>Show all</button><span class="ans" hidden>Answer: ${rich(w.a)}</span></div></div>`).join('')}</section>

    </article>

      <div class="card flat" style="padding:16px"><div class="eyebrow">Specification checklist · ${esc(t.ref)}</div><p class="small muted" style="margin:6px 0 10px">Rate your confidence: red, amber, green.</p><div class="spec-list">${v.spec.map(([sp, i]) => `<div class="spec-item"><div class="rag" data-i="${i}">${[1, 2, 3].map(val => `<button data-v="${val}" class="${s.spec[i] === val ? 'on' : ''}" aria-label="${['Not confident', 'Getting there', 'Confident'][val - 1]}: ${esc(specTxt(sp))}"></button>`).join('')}</div><span>${tagHTML(specFlag(sp), 1)}${rich(esc(specTxt(sp)))}</span></div>`).join('')}</div></div>
      <a class="btn primary" href="#/t/${t.id}/quiz">Test yourself ${ICON.arrow}</a></aside></div>`;

    $$('.rag', host).forEach(r => r.onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = +r.dataset.i, val = +b.dataset.v; s.spec[i] = s.spec[i] === val ? 0 : val; save(); $$('button', r).forEach(x => x.classList.toggle('on', +x.dataset.v === s.spec[i])); refreshChrome(); checkBadges(); });

  /* ---------- Flashcards (Leitner boxes) ---------- */
  function cardsTab(host, t) {
    const s = T(t.id), idxs = t.cards.map((c, i) => i).filter(i => inScope(t.cards[i][2] || '')); let queue = shuffle(idxs).sort((a, b) => (s.cards[a] || 0) - (s.cards[b] || 0)), pos = 0, flipped = false, reviewed = 0;
    const render = () => {
      const i = queue[pos], box = s.cards[i] || 0, counts = [0, 1, 2, 3, 4, 5].map(b => idxs.filter(j => (s.cards[j] || 0) === b).length);
      if (pos >= queue.length) { host.innerHTML = `<div class="card result"><div class="eyebrow">Session complete</div><div class="big">${reviewed}</div><p class="lede" style="margin:8px auto">cards reviewed. Known (box 3+): ${idxs.filter(j => s.cards[j] >= 3).length}/${idxs.length}</p><button class="btn primary" id="again">Review again</button></div>`; $('#again').onclick = () => cardsTab(host, t); return; }
      host.innerHTML = `<div class="fc-stage"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow">Card ${pos + 1} of ${queue.length}</span><span class="pill">Box ${box || 'new'}</span></div>
        <div class="fc ${flipped ? 'flip' : ''}" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="front"><span class="eyebrow">Question ${tagHTML(t.cards[i][2] || '', 1)}</span><div>${rich(t.cards[i][0])}</div></div><div class="back"><span class="eyebrow">Answer</span><div>${rich(t.cards[i][1])}</div></div></div>
        <div class="fc-ctl">${flipped ? `<button class="btn" data-r="0" style="border-color:var(--bad);color:var(--bad)">Again <kbd>1</kbd></button><button class="btn" data-r="1">Hard <kbd>2</kbd></button><button class="btn" data-r="2" style="border-color:var(--good);color:var(--good)">Good <kbd>3</kbd></button><button class="btn" data-r="3">Easy <kbd>4</kbd></button>` : `<button class="btn primary" id="flip">Show answer <kbd>Space</kbd></button>`}</div>
        <div class="boxes">${counts.map((n, b) => `<span>${b ? 'Box ' + b : 'New'}: ${n}</span>`).join('')}</div></div>`;
      $('#fc').onclick = () => { flipped = !flipped; sfx.flip(); render(); };
      $('#flip') && ($('#flip').onclick = () => { flipped = true; sfx.flip(); render(); });
      $$('[data-r]', host).forEach(b => b.onclick = () => rate(+b.dataset.r));
    };
    const rate = r => { const i = queue[pos], b = s.cards[i] || 0; s.cards[i] = r === 0 ? 1 : r === 1 ? Math.max(1, b) : r === 2 ? Math.min(5, b + 1) : Math.min(5, b + 2); if (r === 0) queue.push(i); reviewed++; S.stats.cardsSeen++; save(); addXP(2); pos++; flipped = false; render(); };
    const key = e => { if (!document.body.contains(host) || !$('#fc')) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipped = !flipped; render(); } else if (flipped && '1234'.includes(e.key)) rate(+e.key - 1); };
    addEventListener('keydown', key); cleanup = () => removeEventListener('keydown', key);
    render();
  }

  /* ---------- Quiz engine (also used by mock exam & daily challenge) ---------- */
  function runQuiz(host, items, o = {}) {
    const exam = o.mode === 'exam';
    const qs = items.map(it => it.type === 'num' ? it : { ...it, type: 'mcq', order: shuffle(it.o.map((_, i) => i)) });
    let i = 0, res = [], t0 = Date.now(), tick = null;
    const render = () => {
      if (i >= qs.length) return finish();
      const q = qs[i];
      host.innerHTML = `<div class="q-meta"><span class="eyebrow">${o.title ? esc(o.title) + ' · ' : ''}Question ${i + 1} of ${qs.length}</span>${q.topic ? `<a class="pill" href="#/t/${q.topic}">${q.topic}</a>` : ''}${o.timeLimit ? '<span class="pill warn mono" id="qtimer"></span>' : ''}<div class="q-prog">${qs.map((_, j) => `<i class="${j < res.length ? (res[j].ok ? 'c' : exam ? 'cur' : 'w') : j === i ? 'cur' : ''}"></i>`).join('')}</div></div>
        <div class="q-text">${rich(q.type === 'num' ? q.q : q.q)}</div>
        ${q.type === 'mcq' ? `<div class="opts">${q.order.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div><p class="kbd-hint">Press A–D or 1–4.</p>`
          : `<div class="calc-in"><input id="numin" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5e-3" aria-label="Your answer"><span class="unit">${q.unit || ''}</span><button class="btn primary" id="numgo">Submit</button></div><p class="kbd-hint">Give your answer to 2–3 significant figures (answers within 2% are accepted).</p>`}
        <div id="fb"></div>`;
      if (q.type === 'mcq') $$('.opt', host).forEach(b => b.onclick = () => answer(+b.dataset.k));
      else { const inp = $('#numin'); inp.focus(); $('#numgo').onclick = () => answer(inp.value); inp.onkeydown = e => { if (e.key === 'Enter') answer(inp.value); }; }
    };
    const answer = k => {
      const q = qs[i]; if (res.length > i) return;
      let ok, given;
      if (q.type === 'mcq') { ok = q.order[k] === 0; given = k; } else { const v = parseNum(k); if (!isFinite(v)) { toast('Enter a number, e.g. 3.2e-5'); return; } ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * (q.tol || 0.02) + 1e-12; given = v; }
      res.push({ ok, given, q }); (ok ? sfx.good : sfx.bad)();
      if (exam) { i++; render(); return; }
      if (q.type === 'mcq') { $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.order[j] === 0) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); }); }
      else { $('#numin').disabled = true; $('#numgo').disabled = true; }
      $('#fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${q.type === 'num' ? `Answer: <b>${fmtAns(q.ans)}</b> ${q.unit}<div class="steps"><b class="small">Solution</b><ol>${q.steps.map(x => `<li>${rich(x)}</li>`).join('')}</ol></div>` : rich(q.x || '')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="nextq">${i < qs.length - 1 ? 'Next question' : 'See results'} <kbd>Enter</kbd></button></div>`;
      $('#nextq').onclick = () => { i++; render(); }; $('#nextq').focus();
    };
    const finish = () => {
      clearInterval(tick); removeEventListener('keydown', key);
      const correct = res.filter(r => r.ok).length, p = Math.round(correct / qs.length * 100), secs = Math.round((Date.now() - t0) / 1000);
      if (p === 100) { burst(); sfx.win(); }
      const byTopic = {}; res.forEach(r => { const k = r.q.topic || '—'; byTopic[k] ??= [0, 0]; byTopic[k][1]++; if (r.ok) byTopic[k][0]++; });
      host.innerHTML = `<div class="card result"><div class="eyebrow">${esc(o.title || 'Quiz')} complete · ${Math.floor(secs / 60)}m ${secs % 60}s</div><div class="big">${p}%</div><p class="lede" style="margin:6px auto 0">${correct} of ${qs.length} correct${p >= 80 ? ' — excellent.' : p >= 50 ? ' — good progress.' : ' — revisit the notes and try again.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="retry">Try again</button>${o.back ? `<a class="btn" href="${o.back}">Back</a>` : ''}</div></div>
        ${Object.keys(byTopic).length > 1 ? `<div class="sec"><div class="eyebrow">By topic</div><div class="grid gauto" style="margin-top:10px">${Object.entries(byTopic).map(([k, [a, b]]) => `<a class="tcard" href="#/t/${k}" style="--uc:${TOPIC[k] ? ucol(TOPIC[k].unit) : 'var(--accent)'}"><span class="no" style="font-size:22px">${k}</span><span class="tt">${TOPIC[k] ? esc(TOPIC[k].title) : ''}</span><span class="ts">${a}/${b} correct</span></a>`).join('')}</div></div>` : ''}
        <div class="sec"><div class="eyebrow">Review</div>${res.map((r, j) => `<div class="explain" style="margin-top:10px"><b class="v ${r.ok ? 'good' : 'bad'}">${j + 1}. ${r.ok ? '✓' : '✗'}</b> ${rich(r.q.q)}<div class="small" style="margin-top:6px">${r.q.type === 'mcq' ? `<b>Answer:</b> ${rich(r.q.o[0])}${r.ok ? '' : ` · <span style="color:var(--bad)">you chose: ${rich(r.q.o[r.q.order[r.given]])}</span>`}${r.q.x ? `<br><span class="muted">${rich(r.q.x)}</span>` : ''}` : `<b>Answer:</b> ${fmtAns(r.q.ans)} ${r.q.unit} · you gave ${r.given == null ? '—' : fmtAns(r.given)}`}</div></div>`).join('')}</div>`;
      $('#retry').onclick = () => { o.retry ? o.retry() : runQuiz(host, items, o); };
      S.stats.quizzes++; if (p === 100) S.stats.perfect++; save();
      o.onDone && o.onDone({ correct, total: qs.length, p, res });
      checkBadges();
    };
    const key = e => { if (!document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.target.matches('input,textarea')) return; const q = qs[i]; if (!q) return;
      if (res.length > i && e.key === 'Enter') { $('#nextq')?.click(); return; }
      if (q.type === 'mcq' && res.length <= i) { const k = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[e.key.toLowerCase()]; if (k != null && k < q.o.length) answer(k); } };
    addEventListener('keydown', key);
    if (o.timeLimit) { const end = Date.now() + o.timeLimit * 1000; tick = setInterval(() => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = $('#qtimer'); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (!document.body.contains(host)) clearInterval(tick); if (left <= 0) { while (res.length < qs.length) res.push({ ok: false, given: null, q: qs[res.length] }); i = qs.length; finish(); } }, 500); }
    const prevCleanup = cleanup; cleanup = () => { clearInterval(tick); removeEventListener('keydown', key); prevCleanup && prevCleanup(); };
    render();
  }

  function calcTab(host, t) {

      const q = GEN[pick(V_(t).gens)]();

        <div class="card"><div class="calc-q">${rich(q.q)}</div><div class="calc-in"><input id="cin" inputmode="decimal" autocomplete="off" placeholder="your answer" aria-label="Your answer"><span class="unit">${q.unit}</span><button class="btn primary" id="cgo">Check</button><button class="btn ghost" id="cshow">Show solution</button></div><p class="kbd-hint">Answers within 2% are accepted. Use e-notation for powers of ten (e.g. 3.0e8). Take g = 9.8 N/kg unless told otherwise.</p><div id="cfb"></div></div></div>`;

      const check = () => { const v = parseNum(inp.value); if (!isFinite(v)) { toast('Enter a number, e.g. 2.4e-3'); return; } const ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * 0.02 + 1e-12; if (ok) { s.calc = (s.calc || 0) + 1; S.stats.calcOK++; streak++; save(); addXP(15, 'Calculation correct'); sfx.good(); if (streak % 5 === 0) burst(); } else { streak = 0; sfx.bad(); } s.calcN = (s.calcN || 0) + 1; save(); reveal(ok); };
      $('#cgo').onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); }; $('#cshow').onclick = () => { streak = 0; reveal(null); };

  /* ---------- Structured exam questions (topic tab, bank and papers) ----------
     A question is {q, m, ms} or {q (stem), parts:[{q, m, ms, lv?}]}. Parts with lv:true are extended answers marked in
     bands: ms is then indicative content, and the learner awards a mark using Pearson-style levels descriptors. */
  const QTAGS = { short: 'Short answer', struct: 'Structured', ext: 'Extended (levels)', data: 'Data response', graph: 'Graphs', calc: 'Calculation', synoptic: 'Synoptic', nea: 'Assignment practice' };
  const qParts = q => q.parts || [{ q: '', m: q.m, ms: q.ms, lv: q.lv }];
  const qMarks = q => qParts(q).reduce((a, p) => a + p.m, 0);
  const qTag = q => q.tag || (qParts(q).some(p => p.lv) ? 'ext' : q.parts ? 'struct' : 'short');
  const BANDS = { 4: [[3, 4], [2, 2], [1, 1]], 5: [[4, 5], [2, 3], [1, 1]], 6: [[5, 6], [3, 4], [1, 2]], 7: [[6, 7], [3, 5], [1, 2]], 8: [[7, 8], [4, 6], [1, 3]], 9: [[7, 9], [4, 6], [1, 3]], 10: [[8, 10], [4, 7], [1, 3]] };
  const BAND_TXT = ['Detailed, accurate knowledge applied consistently to the context; thorough analysis and evaluation that weighs both sides; a supported conclusion; accurate specialist terms; well structured.',
    'Sound knowledge with some application; some analysis or evaluation, but one-sided or undeveloped; a conclusion that is not fully supported; some specialist terms.',
    'Limited knowledge, mostly descriptive; little application, analysis or evaluation; few specialist terms; limited structure.'];
  function partHTML(p, j, multi) {
    p = { ...p, q: String(p.q || '').replace(/\s*\[\d+\]\s*$/, '') };
    const lab = multi ? `<span class="pl">(${'abcdefgh'[j]})</span>` : '';
    const box = `<textarea rows="${p.m >= 6 ? 7 : p.m >= 3 ? 3 : 2}" aria-label="Your answer"></textarea>`;
    if (p.lv) { const b = BANDS[p.m] || BANDS[8];
      return `<div class="xq-part" data-m="${p.m}" data-lv="1"><div>${lab}${rich(p.q)} <b class="mono">[${p.m}]</b> <span class="tag qt sm">levels-marked</span></div>${box}
        <div class="ms" hidden><div class="eyebrow" style="margin-bottom:4px">Indicative content — tick what you covered (a guide, not a checklist)</div>${p.ms.map(x => `<label><input type="checkbox" data-ic> <span>${rich(x)}</span></label>`).join('')}
        <div class="eyebrow" style="margin:12px 0 2px">Choose the level that best fits, then the mark</div><div class="bands">${b.map((r, k) => `<button type="button" data-band="${k}" data-lo="${r[0]}" data-hi="${r[1]}"><b>Level ${3 - k} · ${r[0]}–${r[1]}</b><span>${BAND_TXT[k]}</span></button>`).join('')}</div>
        <div class="mk-pick">${Array.from({ length: p.m + 1 }, (_, k) => `<button type="button" data-mk="${k}">${k}</button>`).join('')}</div></div></div>`; }
    return `<div class="xq-part" data-m="${p.m}"><div>${lab}${rich(p.q)} <b class="mono">[${p.m}]</b></div>${box}
      <div class="ms" hidden><div class="eyebrow" style="margin-bottom:4px">Mark scheme — tick the points you made (1 mark each, up to ${p.m})</div>${p.ms.map(x => `<label><input type="checkbox"> <span>${rich(x)}</span></label>`).join('')}</div></div>`;
  }
  function xqHTML(q, n, o = {}) {
    const ps = qParts(q), multi = !!q.parts, tp = q.topic && TOPIC[q.topic], tg = qTag(q);
    if (q.mcq) return `<div class="xq" data-xq="${n}" style="--uc:${tp ? acol(tp) : 'var(--accent)'}"><div class="xq-head"><span class="n">${o.num || 'Q' + (n + 1)}</span>${tp && o.showTopic ? `<a class="pill" href="#/t/${tp.id}">${tp.id} ${esc(tp.title)}</a>` : ''}<span class="tag qt sm">Multiple choice</span><span class="spacer" style="flex:1"></span><span class="pill mk">1 mark</span></div>
      <div class="xq-part" data-m="1" data-mcq="1"><div>${rich(q.q)}</div><ol class="mcq-list" type="A">${q.order.map(i => `<li class="${i === 0 ? 'ans-k' : ''}"><label style="display:flex;gap:8px"><input type="radio" name="mcq${n}" value="${i}"> <span>${rich(q.o[i])}</span></label></li>`).join('')}</ol>
      <div class="ms" hidden><div class="small"><b>Answer:</b> ${rich(q.o[0])}${q.x ? ` — <span class="muted">${rich(q.x)}</span>` : ''}</div></div></div></div>`;
