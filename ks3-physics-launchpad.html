  /* ---------- Unit 5 ---------- */
  floatsink: () => { let s = `<rect x="10" y="80" width="520" height="130" fill="${WATER}"/>` + ln(10, 80, 530, 80, WATERL, 2);
    s += box(90, 56, 70, 50, '#C8A26A') + arrow(125, 106, 125, 150, C1, 3) + tx(133, 146, 'weight 6 N', { c: C1, fs: 11.5, w: 700 }) + arrow(125, 56, 125, 16, C5, 3) + tx(133, 26, 'upthrust 6 N', { c: C5, fs: 11.5, w: 700 }) + tx(125, 196, 'FLOATS: upthrust = weight', { a: 'middle', c: INK, w: 700 });
    s += box(370, 130, 60, 44, '#8C7A6B') + arrow(400, 174, 400, 230 - 6, C1, 3) + tx(408, 222, 'weight 8 N', { c: C1, fs: 11.5, w: 700 }) + arrow(400, 130, 400, 104, C5, 3) + tx(408, 112, 'upthrust 3 N', { c: C5, fs: 11.5, w: 700 }) + tx(400, 70, 'SINKS: weight > upthrust', { a: 'middle', c: INK, w: 700 });
    return svg(540, 240, s, 'Floating and sinking') + cap('A floating object sinks in only until the upthrust equals its weight. A sinking object still feels upthrust, but even fully under water the upthrust is less than its weight.'); },
  k_depth: recap('depth', 'Pressure in a liquid acts in all directions and increases with depth, because there is more liquid above pushing down. The push on the bottom of an object is bigger than on its top — that difference is upthrust.', s => s.replace(/<text[^>]*>p = hρg \(Higher\)<\/text>/, '')),
  upthrustexp: () => { let s = ''; const nm = (x, rd) => ln(x, 10, x, 20, INK, 2) + box(x - 22, 20, 44, 70, 'var(--surface-2)', INK, 8) + tx(x, 60, rd, { a: 'middle', fs: 11, c: C1, w: 700 }) + ln(x, 90, x, 110, INK, 1.4);
    s += nm(90, '5.0 N') + box(72, 110, 36, 40, '#9AA3AC') + tx(90, 176, 'in air: 5.0 N', { a: 'middle', c: INK, w: 700 });
    s += nm(300, '3.0 N') + pth('M240,90 L240,210 L380,210 L380,90 M380,104 L412,120', INK, 2) + `<rect x="241" y="104" width="138" height="105" fill="${WATER}"/>` + box(282, 140, 36, 40, '#9AA3AC') + ln(300, 110, 300, 140, INK, 1.4) + pth('M398,132 L398,196 L446,196 L446,132', INK, 1.6) + `<rect x="399" y="166" width="46" height="29" fill="${WATER}"/>` + pth('M414,122 l0,30', C5, 1.4, 'none', '2 3');
    s += tx(310, 234, 'in water: 3.0 N', { a: 'middle', c: INK, w: 700 }) + tx(470, 170, 'displaced water', { fs: 11 }) + tx(470, 186, 'weighs 2.0 N', { fs: 11, c: C5, w: 700 });
    s += tx(150, 262, 'upthrust = 5.0 − 3.0 = 2.0 N = weight of water displaced', { c: C5, w: 700, fs: 13 });
    return svg(580, 275, s, 'Measuring upthrust') + cap('The newton meter reading drops when the block is lowered into water. The drop (the upthrust) equals the weight of the water pushed out of the eureka can — Archimedes’ principle.'); },
  ship: () => { let s = `<rect x="10" y="110" width="520" height="90" fill="${WATER}"/>` + ln(10, 110, 530, 110, WATERL, 2);
    s += `<rect x="70" y="150" width="34" height="34" fill="#5B6C79" stroke="${INK}"/>` + tx(87, 214, 'steel block: sinks', { a: 'middle', c: INK, fs: 11.5 }) + tx(87, 228, '7.8 g/cm³', { a: 'middle', fs: 11, f: 'var(--f-mono)' });
    s += pth('M230,86 L470,86 L446,134 L254,134 Z', INK, 2, '#5B6C79') + pth('M240,92 L460,92 L440,128 L260,128 Z', 'none', 0, 'color-mix(in srgb, var(--surface) 80%, transparent)') + tx(350,115,'air', { a: 'middle', c: INK }) + arrow(350, 170, 350, 138, C5, 3) + tx(360, 166, 'big upthrust', { c: C5, fs: 11.5, w: 700 }) + tx(350, 214, 'steel ship: floats', { a: 'middle', c: INK, fs: 11.5 }) + tx(350, 228, 'average density < 1 g/cm³', { a: 'middle', fs: 11 });
    return svg(540, 240, s, 'Why steel ships float') + cap('A hollow steel hull full of air has a low average density (total mass ÷ total volume) and displaces a huge volume of water, so the upthrust can balance its weight.'); },

  /* ---------- Unit 6 ---------- */
  storeicons: () => { const S = [['kinetic', C1, 'moving'], ['gravitational potential', C3, 'raised up'], ['elastic potential', C2, 'stretched'], ['thermal', C6, 'hot'], ['chemical', C8, 'fuel, food'], ['nuclear', C7, 'atomic nuclei'], ['magnetic', C5, 'magnets'], ['electrostatic', C4, 'charges']]; let s = '';
    S.forEach(([n, c, e], i) => { const x = 10 + (i % 4) * 135, y = 10 + Math.floor(i / 4) * 64; s += `<rect x="${x}" y="${y}" width="125" height="54" rx="10" fill="color-mix(in srgb, ${c} 14%, transparent)" stroke="${c}" stroke-width="1.6"/>` + tx(x + 62, y + 24, n, { a: 'middle', c: INK, w: 700, fs: n.length > 16 ? 10.5 : 12 }) + tx(x + 62, y + 42, e, { a: 'middle', fs: 11 }); });
    return svg(550, 140, s, 'The energy stores') + cap('The eight energy stores. Energy is measured in joules (J) and is moved between stores — it is never created or destroyed.'); },
  k_stores: recap('stores', 'A ball thrown upwards: energy moves from the kinetic store to the gravitational potential store and back again. (Ignoring air resistance, the total stays the same.)', s => s.replace(/>Eₖ</g, '>KE<').replace(/>Eₚ</g, '>GPE<')),
  transferdiag: () => { let s = ''; const B = (x, y, t, c) => `<rect x="${x}" y="${y}" width="${x > 300 ? 170 : 120}" height="44" rx="10" fill="color-mix(in srgb, ${c} 14%, transparent)" stroke="${c}" stroke-width="1.6"/>` + tx(x + (x > 300 ? 85 : 60), y + 18, t[0], { a: 'middle', c: INK, w: 700, fs: 11.5 }) + tx(x + (x > 300 ? 85 : 60), y + 34, t[1], { a: 'middle', fs: 10.5 });
    s += B(10, 60, ['chemical store', 'of the battery'], C8) + arrow(130, 82, 196, 82, INK, 2) + tx(163, 74, 'electrically', { a: 'middle', fs: 10.5, c: INK }) + box(198, 64, 96, 36, 'var(--surface-2)', INK, 18) + tx(246, 87, 'torch bulb', { a: 'middle', c: INK, w: 700, fs: 11.5 });
    s += arrow(294, 76, 380, 36, C2, 2) + tx(330, 40, 'light', { fs: 10.5, c: C2 }) + B(382, 14, ['thermal store', 'of surroundings (useful: light)'], C2) + arrow(294, 90, 380, 120, C6, 2) + tx(318, 124, 'heating', { fs: 10.5, c: C6 }) + B(382, 104, ['thermal store', 'of surroundings (wasted)'], C6);
    return svg(560, 160, s, 'An energy transfer diagram') + cap('Energy transfer diagram for a torch: boxes are stores, arrows are transfers (electrically, by light, by heating). In the end, all the energy ends up in the thermal store of the surroundings.'); },
  k_sankey: recap('sankey', 'A filament lamp: of every 100 J supplied, only 10 J becomes light (useful); 90 J heats the surroundings (wasted). The widths of the arrows show the amounts of energy.'),
  bathcup: () => { let s = pth('M20,70 Q20,150 80,150 L240,150 Q300,150 300,70 Z', INK, 2, `color-mix(in srgb, var(--u5) 25%, transparent)`) + tx(160, 108, 'bath: 40 °C', { a: 'middle', c: INK, w: 700, fs: 14 }) + tx(160, 128, '100 kg of water', { a: 'middle', fs: 11.5 });
    s += pth('M380,70 L390,150 L450,150 L460,70 Z', INK, 2, 'color-mix(in srgb, var(--u6) 30%, transparent)') + pth('M460,86 Q486,90 482,112 Q478,130 456,130', INK, 2) + tx(420, 108, '90 °C', { a: 'middle', c: INK, w: 700, fs: 14 }) + tx(420, 128, '0.25 kg', { a: 'middle', fs: 11.5 });
    s += tx(160, 176, 'lower temperature,', { a: 'middle', c: C5, w: 700, fs: 12 }) + tx(160, 192, 'MUCH more thermal energy', { a: 'middle', c: C5, w: 700, fs: 12 }) + tx(420, 176, 'higher temperature,', { a: 'middle', c: C6, w: 700, fs: 12 }) + tx(420, 192, 'less thermal energy', { a: 'middle', c: C6, w: 700, fs: 12 }) + pth('M400,60 q6,-12 0,-24 M420,60 q6,-12 0,-24 M440,60 q6,-12 0,-24', MUT, 1.5);
    return svg(560, 204, s, 'Temperature and thermal energy') + cap('Temperature tells you the average energy of the particles; thermal energy is the total energy of all of them. The bath has far more particles, so far more thermal energy.'); },
  coaster: () => { const f = x => x < 60 ? 210 - x * 2.9 : x < 120 ? 36 + (1 - Math.cos((x - 60) / 60 * Math.PI)) / 2 * 174 : x < 260 ? 210 - (1 - Math.cos((x - 120) / 140 * 2 * Math.PI)) / 2 * 110 : x < 380 ? 210 - (1 - Math.cos((x - 260) / 120 * 2 * Math.PI)) / 2 * 64 : 210; let d = ''; for (let x = 0; x <= 520; x += 4) d += (x ? 'L' : 'M') + (x + 20) + ',' + f(x).toFixed(1);
    let s = pth(d, INK, 3) + ln(20, 214, 540, 214, LN, 1);
    const lab = (x, t, c, below) => circ(x + 20, f(x) - 8, 7, c, INK, 1.4) + tx(x + 20, below ? f(x) + 22 : f(x) - 22, t, { a: 'middle', fs: 11, c: INK, w: 700 });
    s += lab(60, 'A: most GPE, slow', C3) + lab(120, 'B: fastest — most KE', C1, 1) + lab(190, 'C: lower hill', C3) + lab(320, 'D: lower again', C3) + tx(460, 204, 'brakes: KE → thermal', { a: 'middle', fs: 11, c: C6, w: 700 }) + tx(24, 252, 'lift hill: a motor fills the GPE store', { fs: 11 });
    return svg(560, 262, s, 'Energy on a rollercoaster') + cap('The lift hill fills the gravitational potential store. Going down, GPE → kinetic; climbing, kinetic → GPE. Friction and air resistance waste energy by heating, so every hill must be lower than the first.'); },

  /* ---------- Unit 7 ---------- */
  poles: () => { let s = ''; const row = (y, a, b, rep, t) => { s += magnet(40, y, 100, 26, a) + magnet(200, y, 100, 26, b) + (rep ? arrow(150, y + 13, 124, y + 13, C1, 2) + arrow(190, y + 13, 216, y + 13, C1, 2) : arrow(144, y + 13, 162, y + 13, C3, 2) + arrow(196, y + 13, 178, y + 13, C3, 2)) + tx(330, y + 18, t, { c: rep ? C1 : C3, w: 700 }); };
    row(20, false, true, true, 'N facing N: repel'); row(70, true, false, true, 'S facing S: repel'); row(120, false, false, false, 'N facing S: attract');
    return svg(520, 160, s, 'Forces between magnetic poles') + cap('Like poles repel; unlike poles attract. Only a magnet can repel another magnet, so repulsion is the test for a magnet.'); },
  k_barfield: recap('barfield', 'The field around a bar magnet: lines go from N to S, never cross, and are closest together at the poles where the field is strongest. The pattern is the same on both sides and at both ends.'),
  domains: () => { let s = ''; const bar = (x, t, al) => { s += box(x, 30, 200, 90, 'var(--surface-2)', INK, 4) + tx(x + 100, 142, t, { a: 'middle', c: INK, w: 700 }); for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) { const cx = x + 22 + i * 39, cy = 54 + j * 42, a = al ? 0 : ((i * 7 + j * 13) % 12) / 12 * Math.PI * 2; s += `<rect x="${cx - 18}" y="${cy - 19}" width="36" height="38" fill="none" stroke="${LN}" stroke-dasharray="3 3"/>` + arrow(cx - Math.cos(a) * 12, cy - Math.sin(a) * 12, cx + Math.cos(a) * 12, cy + Math.sin(a) * 12, al ? C1 : C7, 1.8); } };
    bar(20, 'unmagnetised: domains random', false); bar(290, 'magnetised: domains lined up', true); s += tx(300, 22, 'S', { c: C6, w: 700 }) + tx(480, 22, 'N', { c: C1, w: 700 });
    return svg(510, 155, s, 'Magnetic domains') + cap('Domains are tiny regions that act like mini-magnets. In an unmagnetised bar they point every which way and cancel out; stroking or a current in a coil lines them up.'); },
  k_solenoid: recap('solenoid', 'The field of a coil (solenoid): inside it is strong and uniform (parallel lines); outside it is shaped like a bar magnet’s. The lines never cross. An iron core makes it much stronger — an electromagnet.'),
  bell: () => { let s = box(40, 60, 16, 110, 'var(--surface-2)') + [0, 1, 2, 3, 4, 5].map(i => `<ellipse cx="48" cy="${76 + i * 16}" rx="16" ry="5" fill="none" stroke="#B87333" stroke-width="2.4"/>`).join('') + tx(48, 190, 'electromagnet', { a: 'middle', fs: 11 });
    s += box(90, 60, 10, 110, '#9AA3AC') + tx(116, 186, 'iron armature', { fs: 11 }) + pth('M95,170 L95,200 L150,200', INK, 2) + pth('M150,194 l6,-6 l6,12 l6,-12 l6,12 l6,-6', C2, 1.6) + tx(150, 216, 'spring', { fs: 11 }) + ln(95, 60, 95, 30, INK, 2) + circ(95, 22, 9, INK, INK) + tx(112, 20, 'hammer', { fs: 11 });
    s += pth('M140,10 A36,36 0 0 1 176,46', C2, 5) + tx(186, 30, 'gong', { fs: 11 }) + circ(104, 120, 3, INK, INK) + ln(104, 120, 150, 120, INK, 2) + tx(160, 110, 'contact (opens when the armature moves)', { fs: 11 });
    s += wire([48, 170], [48, 240], [300, 240], [300, 120], [150, 120]) + sym('cell', 180, 240) + sym('switch (closed)', 260, 240) + wire([48, 60], [48, 44], [20, 44]);
    return svg(420, 256, s, 'An electric bell') + cap('Press the switch: the electromagnet pulls the armature, the hammer hits the gong, and the contact opens. The magnet switches off, the spring pulls the armature back, the circuit closes — and it repeats.'); },

  /* ---------- Unit 8 ---------- */
  k_moment: recap('moment', 'The moment of a force = force × perpendicular distance from the pivot. A longer spanner or a door handle far from the hinges gives a bigger moment for the same force.', s => s.replace(/<text[^>]*>d = perpendicular distance<\/text>/, '<text x="282" y="104" fill="var(--muted)" font-size="12" text-anchor="middle">d = distance from the pivot</text>')),
  seesaw: () => { let s = pth('M270,150 L250,190 L290,190 Z', INK, 2, 'var(--surface-2)') + box(50, 140, 440, 10, '#B87333', INK, 3);
    s += box(118, 110, 44, 30, C1) + tx(140, 130, '400 N', { a: 'middle', c: '#fff', w: 700, fs: 11 }) + arrow(140, 150, 140, 184, C1, 2) + box(348, 110, 44, 30, C5) + tx(370, 130, '600 N', { a: 'middle', c: '#fff', w: 700, fs: 11 }) + arrow(370, 150, 370, 184, C5, 2);
    s += ln(140, 96, 270, 96, INK, 1.2) + ln(140, 90, 140, 102, INK) + ln(270, 90, 270, 102, INK) + tx(205, 90, '1.5 m', { a: 'middle', c: INK }) + ln(270, 96, 370, 96, INK, 1.2) + ln(370, 90, 370, 102, INK) + tx(320, 90, '1.0 m', { a: 'middle', c: INK });
    s += tx(140, 214, 'anticlockwise: 400 × 1.5 = 600 Nm', { a: 'middle', c: C1, fs: 11.5, w: 700 }) + tx(390, 214, 'clockwise: 600 × 1.0 = 600 Nm', { a: 'middle', c: C5, fs: 11.5, w: 700 }) + tx(270, 236, 'equal moments → balanced', { a: 'middle', c: INK, w: 700 });
    return svg(540, 246, s, 'The principle of moments') + cap('A balanced seesaw: total clockwise moment = total anticlockwise moment. The heavier person sits closer to the pivot.'); },
  friction: () => { let s = pth('M20,150 l10,-6 l8,5 l10,-7 l9,6 l12,-5 l8,6 l10,-6 l9,5 l11,-7 l10,6 l9,-4 l10,5 l12,-6 l8,5 l10,-7 l9,6 l12,-5 l8,6 l10,-6 l9,5 l11,-7 l10,6 l9,-4 l10,5 l12,-6 l8,5 l10,-7 l9,6 l12,-5 l8,6 L420,150', INK, 1.6) + `<path d="M120,100 L300,100 L300,138 l-9,-4 l-10,6 l-12,-5 l-8,6 l-10,-6 l-9,5 l-11,-7 l-10,6 l-9,-4 l-10,5 l-12,-6 l-8,5 l-10,-7 l-9,6 l-12,-5 l-8,6 l-10,-6 L120,138 Z" fill="#C8A26A" stroke="${INK}" stroke-width="1.6"/>`;
    s += arrow(300, 118, 380, 118, C5, 3) + tx(340, 108, 'pull', { a: 'middle', c: C5, w: 700 }) + arrow(120, 142, 50, 142, C1, 3) + tx(84, 166, 'friction', { a: 'middle', c: C1, w: 700 }) + tx(210, 186, 'magnified: tiny bumps catch on each other', { a: 'middle', c: INK });
    return svg(440, 196, s, 'Friction') + cap('Surfaces are rough close up. The bumps catch as they slide, giving friction, which acts opposite to the motion and heats the surfaces.'); },
  k_dtgraph: recap('dtgraph', 'Distance–time graph: the gradient (steepness) is the speed — steeper means faster. A horizontal line means the object is stationary.'),
  pressure: () => { let s = ''; const brick = (x, w, h, t, p) => { s += box(x, 150 - h, w, h, '#C8573F', INK, 2) + tx(x + w / 2, 176, t, { a: 'middle', c: INK, w: 700, fs: 11.5 }) + tx(x + w / 2, 192, p, { a: 'middle', fs: 11, f: 'var(--f-mono)' }) + arrow(x + w / 2, 150 - h - 30, x + w / 2, 150 - h - 4, C1, 2); };
    s += ln(10, 150, 530, 150, INK, 2); brick(30, 160, 40, 'large area', '20 N ÷ 0.02 m² = 1000 Pa'); brick(260, 80, 50, 'medium area', '20 N ÷ 0.01 m² = 2000 Pa'); brick(430, 40, 90, 'small area', '4000 Pa');
    s += tx(270, 20, 'the same 20 N brick, three ways up', { a: 'middle', c: INK, w: 700 });
    return svg(540, 200, s, 'Pressure depends on area') + cap('The same force on a smaller area gives a bigger pressure: pressure = force ÷ area. Snowshoes spread the force; knives and pins concentrate it.'); },
  footprint: () => { let s = ''; for (let i = 0; i <= 14; i++) s += ln(20 + i * 14, 20, 20 + i * 14, 244, 'var(--line)', 1); for (let j = 0; j <= 16; j++) s += ln(20, 20 + j * 14, 216, 20 + j * 14, 'var(--line)', 1);
    s += pth('M118,34 C160,30 176,70 172,110 C170,140 160,160 158,190 C156,222 136,236 112,232 C86,228 78,206 82,180 C86,150 70,120 72,86 C74,52 90,36 118,34 Z', C1, 2.4, 'color-mix(in srgb, var(--u1) 12%, transparent)');
    s += tx(240, 50, 'count a square if', { c: INK }) + tx(240, 66, 'HALF OR MORE is inside', { c: INK, w: 700 }) + tx(240, 100, 'e.g. 150 squares = 150 cm²', { c: INK }) + tx(240, 124, 'both feet: 300 cm²', { c: INK }) + tx(240, 158, 'weight 450 N:', { c: INK }) + tx(240, 176, 'p = 450 ÷ 300', { c: INK, f: 'var(--f-mono)' }) + tx(240, 194, '  = 1.5 N/cm²', { c: C1, w: 700, f: 'var(--f-mono)' });
    return svg(420, 256, s, 'Finding the area of a footprint') + cap('Draw round your shoe on 1 cm squared paper and count the squares (half or more). Pressure = weight ÷ area — double the area if you stand on both feet.'); },
  hydraulic: () => { let s = pth('M60,70 L60,180 L400,180 L400,110 M100,70 L100,140 L340,140 L340,110', INK, 2) + `<path d="M61,100 L99,100 L99,141 L341,141 L341,110 L399,110 L399,179 L61,179 Z" fill="color-mix(in srgb, var(--u6) 28%, transparent)"/>`;
    s += box(58, 88, 44, 12, '#9AA3AC') + arrow(80, 40, 80, 86, C1, 3) + tx(80, 30, '50 N', { a: 'middle', c: C1, w: 700 }) + tx(80, 204, 'small piston 5 cm²', { a: 'middle', fs: 11 });
    s += box(338, 98, 64, 12, '#9AA3AC') + arrow(370, 96, 370, 40, C5, 3) + tx(370, 30, '2000 N', { a: 'middle', c: C5, w: 700 }) + tx(370, 204, 'large piston 200 cm²', { a: 'middle', fs: 11 }) + tx(220, 164, 'oil: pressure 10 N/cm² everywhere', { a: 'middle', c: INK, fs: 12, w: 700 });
    return svg(440, 214, s, 'A hydraulic jack') + cap('The liquid cannot be squashed, so the pressure made at the small piston (50 ÷ 5 = 10 N/cm²) acts on the large piston too, giving a bigger force (10 × 200 = 2000 N).'); },
  k_gasbox: recap('gasbox', 'Gas particles move fast in random directions. Each collision with the wall gives a tiny push; together they make the gas pressure. Heating makes them hit harder and more often.'),
  k_atmosphere: recap('atmosphere', 'The atmosphere is a thin layer of air that gets less dense with height. At sea level the weight of the air above gives a pressure of about 100 000 Pa; higher up there is less air above, so the pressure is lower.'),
  can: () => { let s = ''; const can = (x, y, crushed) => crushed ? pth(`M${x - 18},${y} L${x - 12},${y + 20} L${x - 20},${y + 36} L${x - 10},${y + 52} L${x - 16},${y + 70} L${x + 16},${y + 70} L${x + 10},${y + 52} L${x + 20},${y + 36} L${x + 12},${y + 20} L${x + 18},${y} Z`, INK, 1.8, '#C8CDD2') : box(x - 20, y, 40, 70, '#C8CDD2', INK, 4);
    s += tx(90, 18, '1. Heat a little water', { a: 'middle', c: INK, w: 700, fs: 11.5 }) + can(90, 50, false) + `<rect x="72" y="108" width="36" height="10" fill="${WATER}"/>` + pth('M80,46 q6,-12 0,-22 M92,46 q6,-12 0,-22 M104,46 q6,-12 0,-22', MUT, 1.4) + pth('M76,140 l6,-14 l6,14 l6,-18 l6,18 l6,-14 l6,14', C2, 2) + tx(90, 160, 'steam pushes air out', { a: 'middle', fs: 11 });
    s += tx(275, 18, '2. Flip into cold water', { a: 'middle', c: INK, w: 700, fs: 11.5 }) + `<rect x="210" y="96" width="130" height="60" fill="${WATER}"/>` + ln(210, 96, 340, 96, WATERL, 2) + `<g transform="rotate(180 275 90)">${can(275, 55, false)}</g>` + tx(275, 172, 'steam condenses', { a: 'middle', fs: 11 });
    s += tx(460, 18, '3. Crushed!', { a: 'middle', c: C1, w: 700, fs: 11.5 }) + `<rect x="395" y="96" width="130" height="60" fill="${WATER}"/>` + `<g transform="rotate(180 460 90)">${can(460, 55, true)}</g>` + [[410, 90, 436, 90], [510, 90, 484, 90], [460, 34, 460, 52]].map(([a, b, c, d]) => arrow(a, b, c, d, C1, 2)).join('') + tx(460, 172, 'air pressure outside wins', { a: 'middle', fs: 11 });
    return svg(540, 182, s, 'The crushed-can experiment') + cap('Steam drives the air out. In cold water the steam condenses, leaving almost no gas particles inside, so the pressure inside is very low. Atmospheric pressure outside crushes the can.'); },

  /* ---------- Unit 9 ---------- */
  k_symbols: () => { const K = ['cell', 'battery', 'switch (open)', 'switch (closed)', 'lamp', 'resistor', 'variable resistor', 'fuse', 'ammeter', 'voltmeter', 'motor', 'buzzer', 'two-way switch', 'LED']; let s = '';
    K.forEach((k, i) => { const x = 70 + (i % 4) * 130, y = 36 + Math.floor(i / 4) * 64; s += SYM[k](x, y) + tx(x, y + 30, k, { a: 'middle', fs: 11, c: INK, w: 600 }); });
    return svg(540, 270, s, 'Circuit symbols') + cap('The circuit symbols for Key Stage 3. On a cell, the longer line is the positive (+) terminal; a battery is two or more cells.'); },
  meters: () => { let s = wire([40, 40], [40, 150], [420, 150], [420, 40], [40, 40]) + sym('cell', 230, 40) + tx(230, 18, '3 V', { a: 'middle', c: INK }) + `<rect x="200" y="140" width="60" height="20" fill="var(--paper)"/>` + sym('lamp', 230, 150);
    s += `<rect x="100" y="30" width="60" height="20" fill="var(--paper)"/>` + sym('ammeter', 130, 40) + tx(130, 74, 'ammeter: IN SERIES', { a: 'middle', c: C5, w: 700, fs: 11.5 });
    s += wire([190, 150], [190, 200], [218, 200]) + wire([270, 150], [270, 200], [242, 200]) + dot(190, 150) + dot(270, 150) + `<rect x="200" y="190" width="60" height="20" fill="var(--paper)"/>` + sym('voltmeter', 230, 200) + tx(230, 234, 'voltmeter: IN PARALLEL (across the lamp)', { a: 'middle', c: C1, w: 700, fs: 11.5 });
    return svg(460, 244, s, 'Connecting ammeters and voltmeters') + cap('An ammeter goes in the loop (series) so the current flows through it. A voltmeter goes across a component (parallel) to compare the two ends.'); },
  ropemodel: () => { let s = `<ellipse cx="270" cy="100" rx="220" ry="62" fill="none" stroke="#B87333" stroke-width="5"/>`; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; s += arrowHead(270 + 220 * Math.cos(a), 100 + 62 * Math.sin(a), a + Math.PI / 2, C2, 9); }
    s += person(56, 150, 1.1, C8) + tx(56, 180, 'teacher = cell', { a: 'middle', fs: 11.5, c: INK }) + person(270, 176, 1.1, C1) + tx(270, 200, 'gripping hands = lamp (resistance): hands get warm', { a: 'middle', fs: 11.5, c: INK }) + tx(270, 104, 'moving rope = current', { a: 'middle', fs: 12, c: C2, w: 700 }) + tx(270, 120, 'same speed everywhere', { a: 'middle', fs: 11 });
    return svg(540, 210, s, 'The rope model of a circuit') + cap('The rope model: the teacher (cell) pushes the rope (charge) round; it moves at the same rate all the way round (current is not used up); energy is transferred where it is gripped (the lamp).'); },
  k_series: recap('series', 'Series circuit: one loop. The current is the same everywhere; the supply p.d. is shared between the components (2.0 V + 4.0 V = 6.0 V).'),
  k_parallel: recap('parallel', 'Parallel circuit: the current splits into branches and joins again (0.50 A + 0.30 A = 0.80 A). Each branch gets the full supply p.d.'),
  wirerig: () => { let s = box(40, 60, 420, 20, 'color-mix(in srgb, var(--u2) 30%, transparent)', INK, 2); for (let i = 0; i <= 10; i++) s += ln(40 + i * 42, 60, 40 + i * 42, 68, INK, 1) + tx(40 + i * 42, 94, i * 10, { a: 'middle', fs: 9.5, f: 'var(--f-mono)' });
    s += ln(40, 70, 460, 70, C6, 2) + pth('M82,56 l-8,-14 l16,0 Z', INK, 1.4, C1) + pth('M292,56 l-8,-14 l16,0 Z', INK, 1.4, C1) + tx(187, 110, 'length between the clips (cm)', { a: 'middle', fs: 11 });
    s += wire([82, 42], [82, 20], [292, 20], [292, 42]) + `<rect x="160" y="10" width="54" height="20" fill="var(--paper)"/>` + sym('voltmeter', 187, 20);
    s += wire([82, 56], [30, 56], [30, 170], [460, 170], [460, 130], [292, 130], [292, 56]) + sym('cell', 120, 170) + sym('ammeter', 250, 170) + sym('switch (closed)', 360, 170) + tx(187, 198, 'R = V ÷ I for each length', { a: 'middle', c: INK, w: 700 });
    return svg(490, 210, s, 'Resistance of a wire') + cap('Crocodile clips set the length of wire in the circuit. Measure the current (ammeter in series) and the p.d. across the length (voltmeter in parallel); R = V ÷ I. Switch off between readings.'); },

TOPICS.push({
  id: '1.3', unit: '1', title: 'Balanced and unbalanced forces', short: 'How forces affect motion',
  summary: 'If the forces on an object are balanced, its motion does not change: it stays still, or keeps moving at the same speed in the same direction. Unbalanced forces make it speed up, slow down or change direction.',
  spec: [
    'I can decide whether the forces on an object are balanced or unbalanced',
    'I can explain that balanced forces mean no change in motion: stationary objects stay still; moving objects keep the same speed and direction',

    '★ I can explain why a moving object with balanced forces keeps moving'
  ],
  learn: [
    { h: 'Balanced forces', html: `
[[d:balanced]]
<p>Forces are <b>balanced</b> when they are the <b>same size</b> but act in <b>opposite directions</b>. They cancel out: the <b>resultant force is zero</b>.</p>
<ul><li>A <b>stationary</b> object with balanced forces <b>stays still</b> — a book on a table, a boat floating at rest.</li><li>A <b>moving</b> object with balanced forces keeps moving at a <b>steady speed in a straight line</b> — a car cruising at 30 mph when the driving force equals the drag.</li></ul>
<div class="box why"><b class="lbl">★ The surprising part</b><p>You do <b>not</b> need an overall force to keep something moving. On Earth, things slow down because friction and air resistance act on them. In space, far from anything, a probe keeps going at the same speed for ever with its engines off.</p></div>` },
    { h: 'Unbalanced forces', html: `
<p>If the forces are <b>unbalanced</b>, there is a <b>resultant force</b> and the motion <b>changes</b>:</p>
<ul><li>bigger force <b>forwards</b> → the object <b>speeds up</b> (accelerates)</li><li>bigger force <b>backwards</b> → it <b>slows down</b> (decelerates)</li><li>a force at an angle to the motion → it <b>changes direction</b></li></ul>
<p>Examples: a car pulling away (driving force &gt; drag), a cyclist braking (friction &gt; driving force), a rocket lifting off (thrust &gt; weight).</p>` },
    { h: 'The skydiver', html: `
[[d:k_terminal]]
<ol><li><b>Just jumped:</b> weight is much bigger than air resistance → unbalanced downwards → speeds up.</li><li><b>Falling faster:</b> air resistance grows with speed → still unbalanced, but speeds up more slowly.</li><li><b>Terminal velocity:</b> air resistance = weight → balanced → steady speed (about 55 m/s).</li><li><b>Parachute opens:</b> huge air resistance, now bigger than weight → unbalanced upwards → slows down.</li><li><b>New terminal velocity:</b> air resistance = weight again → steady, slow speed (about 5 m/s) for a safe landing.</li></ol>` }

<p>Most objects have several forces acting on them. The <b>resultant force</b> is the <b>one single force</b> that would have the same effect as all of them together.</p>

[[d:newtonmeter]]
<p>A <b>newton meter</b> (or <b>force meter</b>) has a <b>spring</b> inside. When you pull the hook, the spring <b>stretches</b>. The bigger the force, the more it stretches, and a pointer moves along a scale marked in <b>newtons</b>.</p>
<p>This works because, for a spring, the <b>extension</b> (how much longer it gets) is <b>proportional to the force</b>: double the force → double the extension.</p>` },
    { h: 'Using a newton meter properly', html: `
<ol><li><b>Choose the range.</b> Pick a meter whose maximum is a bit bigger than the force you expect. A 100 N meter is useless for a 2 N force — the pointer hardly moves; a 5 N meter would be over-stretched and damaged by a 20 N force.</li><li><b>Zero it.</b> Hold it the way you will use it (usually hanging vertically) and adjust it so it reads 0 with nothing attached. A meter that reads 0.2 N with nothing on it has a <b>zero error</b>.</li><li><b>Work out the scale.</b> Count how many small divisions there are between two numbered marks. If 0 to 1 N has 10 divisions, each is 0.1 N.</li><li><b>Read at eye level</b>, straight on, to avoid parallax error.</li><li>Pull gently and steadily, in line with the spring.</li></ol>
<div class="box tip"><b class="lbl">Resolution</b><p>The <b>resolution</b> is the smallest change the meter can show — the value of one division. A 10 N meter with 0.2 N divisions can measure to 0.2 N.</p></div>` },
    { h: 'Stretching springs: Hooke’s law', html: `
[[d:k_hooke]]
<p>If you hang masses on a spring and measure the extension, the graph of <b>force against extension</b> is a <b>straight line through the origin</b>: extension is <b>proportional</b> to force. This is <b>Hooke’s law</b>.</p>
<p>If you stretch the spring too far, past its <b>limit of proportionality</b>, the line curves and the spring may not go back to its original length — it is permanently stretched. That is why you must not overload a newton meter.</p>
<p><b>Extension = stretched length − original length.</b> A spring 5 cm long that stretches to 8 cm has an extension of 3 cm.</p>` }

    { h: 'The method', html: `
[[d:popper]]
<ol><li>Clamp the party popper <b>firmly</b> to a stand (or have a partner hold it) pointing <b>away from everyone</b>.</li><li>Hook a <b>newton meter</b> (0–10 N or 0–20 N) onto the string.</li><li>Pull the meter <b>slowly and steadily</b>, in line with the string, watching the pointer.</li><li>Note the <b>highest reading</b> just before it pops — that is the force needed.</li><li>Repeat with at least <b>five</b> poppers of the same type.</li></ol>
<div class="box warn"><b class="lbl">Safety</b><p>Wear <b>eye protection</b>, point poppers away from people, and do not hold your face near them — they are loud and fire streamers and card at speed. Check nobody in the room is sensitive to loud bangs.</p></div>` },
    { h: 'Why repeat? Mean, anomalies and range', html: `
<p>No two poppers are exactly the same, and it is hard to read a moving pointer at the instant of the bang. So one reading is not enough.</p>
<ul><li><b>Mean</b> = add up the readings ÷ how many there are. It is the best estimate of the true value.</li><li>An <b>anomalous result</b> (anomaly) does not fit the pattern — e.g. 15.0 N when the others are 5–6 N. Maybe the string snagged or the meter was pulled at an angle. <b>Leave anomalies out</b> of the mean (and repeat that test if you can).</li><li>The <b>range</b> is from the smallest to the largest value, e.g. 5.2 N to 6.1 N. A small range means the results are close together — they are <b>repeatable</b>.</li></ul>
<div class="box tip"><b class="lbl">Example</b><p>Readings: 5.6, 5.2, 6.0, 14.8, 5.7 N. The anomaly is 14.8 N. Mean = (5.6 + 5.2 + 6.0 + 5.7) ÷ 4 = 22.5 ÷ 4 = 5.6 N (to 1 decimal place). Range: 5.2–6.0 N.</p></div>` },

<p>You could extend the investigation: do different brands need different forces? Does the popper’s temperature matter?</p>` }

<p>Weight depends on the <b>gravitational field strength</b>, g, where you are. On Earth each kilogram is pulled with a force of about <b>10 N</b>, so g = 10 N/kg. On the Moon, g is only 1.6 N/kg, so you weigh about one-sixth as much — but your mass is the same.</p>

[[d:coaster]]
<ol><li><b>Lift hill:</b> a motor and chain pull the cars to the top. Energy is transferred <b>electrically</b> then <b>mechanically</b> into the <b>gravitational potential store</b> of the cars.</li><li><b>First drop:</b> GPE store empties, <b>kinetic store</b> fills — the cars speed up. They are <b>fastest at the lowest point</b>.</li><li><b>Next hill:</b> kinetic store empties, GPE store fills again — the cars slow down as they climb. They are <b>slowest at the top</b> of each hill.</li><li>All the way, <b>friction</b> (wheels on track) and <b>air resistance</b> transfer energy to the <b>thermal store</b> of the track and air, and some to sound.</li><li><b>Brakes</b> at the end use friction (or magnets) to transfer the remaining kinetic energy to the thermal store.</li></ol>` },

<p>Every magnet has two ends called <b>poles</b>: a <b>north-seeking (N)</b> pole and a <b>south-seeking (S)</b> pole. The magnetic force is strongest at the poles.</p>

<p>Magnetic force is a <b>non-contact</b> force — it acts across a gap, and even through paper, wood or plastic.</p>

<p><b>Plotting compasses:</b> place a small compass near one pole, mark where its needle points with a dot, move the compass so its tail is on the dot, and repeat. Join the dots to make a field line. <b>Iron filings</b> sprinkled on paper over the magnet show the whole pattern at once.</p>` },

  id: '7.2', unit: '7', title: 'Making magnets', short: 'Domains, stroking and induced magnetism',
  summary: 'Magnetic materials contain tiny regions called domains, each like a mini-magnet. In an unmagnetised bar they point every which way; stroking the bar with a magnet, or putting it in a coil with a current, lines them up and makes a magnet.',
  spec: [

    'I can describe how to make a magnet by stroking and by using an electric current in a coil',

  ],
  learn: [
    { h: 'Domains: mini-magnets inside', html: `
[[d:domains]]
<p>Iron, steel, nickel and cobalt are made of tiny regions called <b>domains</b>. Each domain acts like a very small magnet.</p>
<ul><li><b>Unmagnetised</b>: the domains point in <b>random directions</b>, so their effects cancel out.</li><li><b>Magnetised</b>: the domains are <b>lined up</b> in the same direction, so their effects add together to make a magnet.</li></ul>` },
    { h: 'How to make a magnet', html: `
<p><b>1. Stroking.</b> Stroke a steel needle or nail <b>many times</b> from one end to the other with <b>one pole</b> of a magnet, always in the <b>same direction</b>, lifting the magnet well away between strokes. The domains gradually line up.</p>
<p><b>2. Using electricity.</b> Put the steel bar inside a <b>coil of wire</b> (a solenoid) and pass a <b>direct current</b> (from a battery) through it for a moment. The magnetic field of the coil lines up the domains. This is how most magnets are made in factories.</p>
<p><b>Demagnetising:</b> <b>heat</b> the magnet strongly, <b>hammer</b> or drop it repeatedly, or put it in a coil carrying <b>alternating current</b> and slowly pull it out. All of these jumble the domains up again.</p>` },

<div class="box def"><b class="lbl">Learn this</b><p>$"moment" = "force" × "perpendicular distance from the pivot"$ &nbsp; &nbsp; $M = F × d$</p><p>Force in N, distance in m → moment in <b>newton metres (Nm)</b>. (Distance in cm → Ncm.)</p></div>

<p>Friction increases when the surfaces are <b>rougher</b> and when they are <b>pressed together harder</b> (a heavier object). Friction transfers energy to the <b>thermal store</b> — rub your hands together and they warm up.</p>

<div class="box def"><b class="lbl">Learn this</b><p>$"speed" = @frac{"distance"}{"time"}$ &nbsp; &nbsp; $v = @frac{d}{t}$</p><p>distance in metres (m), time in seconds (s) → speed in <b>metres per second (m/s)</b>. Other units: km/h, mph.</p></div>

<p>Rearranged: $d = v × t$ and $t = @frac{d}{v}$.</p>` },

<p><b>Reaction time</b> (≈ 0.2–0.3 s) matters: pressing the stopwatch late at the start and finish causes errors, which are worst for short times. Improvements: use a <b>longer distance</b>, use the same person to time, or use <b>light gates</b> connected to a data logger, which start and stop automatically.</p>

    { h: 'What is pressure?', html: `

<p>The pressure goes <b>up</b> when:</p><ul><li>the gas is <b>heated</b> — particles move faster, so they hit the walls <b>harder and more often</b>;</li><li><b>more gas</b> is added (pumping up a tyre) — more particles, more collisions;</li><li>the gas is <b>squashed into a smaller volume</b> — particles hit the walls more often. (This is why a bicycle pump gets harder to push.)</li></ul>` },

<p>It acts in <b>all directions</b>, which is why we do not notice it — the fluids in our bodies push back out equally. Atmospheric pressure <b>decreases with height</b>, because there is less air above and the air is less dense. At the top of Everest it is only about one-third of the sea-level value; aircraft cabins are pressurised.</p>` },

<p><b>Resistance</b> tells you how hard it is for current to flow through a component. A bigger resistance means a <b>smaller current</b> for the same p.d. It is measured in <b>ohms (Ω)</b>.</p>
<div class="box def"><b class="lbl">Learn this</b><p>$"resistance" = @frac{"potential difference"}{"current"}$ &nbsp; &nbsp; $R = @frac{V}{I}$</p><p>R in ohms (Ω), V in volts (V), I in amps (A)</p></div>
[[d:tri_ohm]]

<p><b>Result:</b> a straight line through the origin — resistance is <b>proportional</b> to length.</p>
<div class="box warn"><b class="lbl">Safety</b><p>Use a low p.d.; switch off between readings (the wire gets <b>hot</b>, which also changes its resistance). Do not touch the wire while the current is on.</p></div>

<p>That is why <b>space is silent</b>: a vacuum has no particles to pass on the vibrations. Astronauts talk by radio, which uses electromagnetic waves (these can travel through a vacuum).</p>

<p>An <b>echo</b> is a sound <b>reflected</b> from a surface. Hard, flat surfaces (cliffs, walls, buildings) reflect sound well. You only hear a separate echo if the reflector is far enough away — at least about 17 m — so the echo arrives at least 0.1 s after the original sound.</p>

    { h: 'Calculating with echoes', html: `

<p>The sound travels <b>to</b> the surface <b>and back</b>, so it covers <b>twice</b> the distance to the surface.</p>
<div class="box def"><b class="lbl">Learn this</b><p>$"distance to surface" = @frac{"speed" × "time"}{2}$</p></div>
<p><b>Echo sounding (sonar)</b>: a ship sends a pulse of sound down to the sea bed. The echo returns after 0.8 s. Sound in water travels at 1500 m/s. Depth = 1500 × 0.8 ÷ 2 = <b>600 m</b>.</p>` },

/* ---- gens.js ---- */
/* ==========================================================
   Calculation generators (KS3: g = 10 N/kg on Earth, sound 330 m/s in air, 1500 m/s in water).
   Each returns { q, ans, unit, steps[] } with fresh numbers; answers are computed so every
   question is self-consistent. Numbers are kept friendly — no standard form.
   ========================================================== */
const GEN = {};
const GEN_FLAGS = {};
const nf = x => String(+(+x).toPrecision(4));
const pk = a => a[Math.floor(Math.random() * a.length)];
const G9 = 10;

/* ---------- 1.2 Scale drawings ---------- */
GEN.scale1 = () => { const sc = pk([2, 5, 10, 20, 50]), L = rnd(1.5, 9, 0.5), F = L * sc; return Math.random() < .5
  ? { q: `A force diagram uses the scale 1 cm = ${sc} N. How long should the arrow be for a force of ${nf(F)} N?`, ans: L, unit: 'cm', steps: [`length = force ÷ scale = ${nf(F)} ÷ ${sc}`, `= ${nf(L)} cm`] }
  : { q: `A force diagram uses the scale 1 cm = ${sc} N. An arrow is ${nf(L)} cm long. What force does it show?`, ans: F, unit: 'N', steps: [`force = length × scale = ${nf(L)} × ${sc}`, `= ${nf(F)} N`] }; };

/* ---------- Means (practicals) ---------- */
GEN.mean1 = () => { const base = rnd(2, 9, 0.1), vals = Array.from({ length: pk([3, 4, 5]) }, () => +(base + (Math.random() - .5) * 0.8).toFixed(1)), m = vals.reduce((a, b) => a + b, 0) / vals.length;
  return { q: `A student’s repeat readings are ${vals.join(' N, ')} N. Calculate the mean.`, ans: m, unit: 'N', steps: [`sum = ${vals.join(' + ')} = ${nf(vals.reduce((a, b) => a + b, 0))}`, `mean = sum ÷ ${vals.length} = ${nf(m)} N`] }; };
GEN.mean2 = () => { const base = rnd(3, 8, 0.1), vals = Array.from({ length: 4 }, () => +(base + (Math.random() - .5) * 0.6).toFixed(1)), bad = +(base * pk([1.8, 2.2, 0.4])).toFixed(1), all = shuffle([...vals, bad]), m = vals.reduce((a, b) => a + b, 0) / 4;
  return { q: `Readings: ${all.join(' s, ')} s. Leave out the anomalous result and calculate the mean.`, ans: m, unit: 's', steps: [`the anomaly is ${bad} s — it does not fit the others`, `sum of the rest = ${vals.join(' + ')} = ${nf(vals.reduce((a, b) => a + b, 0))}`, `mean = ÷ 4 = ${nf(m)} s`] }; };

/* ---------- 2.1 Resultant force ---------- */
GEN.res1 = () => { const a = rnd(10, 400, 5), b = rnd(10, 400, 5); return { q: `Two people push a car in the same direction with forces of ${a} N and ${b} N. Calculate the resultant force.`, ans: a + b, unit: 'N', steps: ['Same direction → add.', `${a} + ${b} = ${a + b} N`] }; };
GEN.res2 = () => { let a = rnd(20, 900, 10), b = rnd(10, 800, 10); if (a === b) b += 10; const r = Math.abs(a - b);
  return { q: `A box is pushed to the right with ${a} N. Friction of ${b} N acts to the left. Calculate the size of the resultant force.`, ans: r, unit: 'N', steps: ['Opposite directions → subtract.', `${Math.max(a, b)} − ${Math.min(a, b)} = ${r} N`, `It acts to the ${a > b ? 'right' : 'left'} (the direction of the bigger force).`] }; };
GEN.res3 = () => { const d = rnd(100, 3000, 50), ar = rnd(20, 1500, 10), fr = rnd(10, 800, 10), r = d - ar - fr;
  return { q: `A vehicle has a driving force of ${d} N, air resistance of ${ar} N and friction of ${fr} N. Calculate the resultant force (use a minus sign if it acts backwards).`, ans: r, unit: 'N', steps: [`backwards forces = ${ar} + ${fr} = ${ar + fr} N`, `resultant = ${d} − ${ar + fr} = ${r} N`, r > 0 ? 'Forwards: it speeds up.' : r < 0 ? 'Backwards: it slows down.' : 'Zero: steady speed.'] }; };

/* ---------- 2.2 Springs and newton meters ---------- */
GEN.nm1 = () => { const perN = pk([0.5, 1, 1.5, 2, 2.5, 3, 4]), F1 = pk([1, 2, 3, 4]), F2 = rnd(1, 8, 0.5), e1 = perN * F1, e2 = perN * F2;
  return { q: `A spring stretches ${nf(e1)} cm when a force of ${F1} N is applied. Assuming it obeys Hooke’s law, how far will it stretch with ${nf(F2)} N?`, ans: e2, unit: 'cm', steps: [`1 N stretches it ${nf(e1)} ÷ ${F1} = ${nf(perN)} cm`, `${nf(F2)} N → ${nf(F2)} × ${nf(perN)} = ${nf(e2)} cm`] }; };
GEN.nm2 = () => { const max = pk([5, 10, 20, 50]), div = pk([5, 10, 4, 2]), whole = max / 10, dv = whole / div, k = rnd(1, 9, 1), n = rnd(1, div - 1, 1), R = whole * k + dv * n;
  return { q: `A newton meter has numbered marks every ${nf(whole)} N, with ${div} small divisions between each numbered mark. The pointer is ${n} small division${n > 1 ? 's' : ''} past the ${nf(whole * k)} N mark. What is the reading?`, ans: R, unit: 'N', steps: [`one division = ${nf(whole)} ÷ ${div} = ${nf(dv)} N`, `reading = ${nf(whole * k)} + ${n} × ${nf(dv)} = ${nf(R)} N`] }; };
GEN.ext1 = () => { const L0 = rnd(4, 20, 0.5), e = rnd(0.5, 12, 0.5); return { q: `A spring is ${nf(L0)} cm long. When a weight is hung on it, it is ${nf(L0 + e)} cm long. Calculate the extension.`, ans: e, unit: 'cm', steps: ['extension = stretched length − original length', `= ${nf(L0 + e)} − ${nf(L0)} = ${nf(e)} cm`] }; };

/* ---------- 3 Weight ---------- */
GEN.wt1 = () => { const m = pk([rnd(1, 90, 1), rnd(0.1, 5, 0.1)]), W = m * G9; return { q: `Calculate the weight of a ${nf(m)} kg object on Earth. (g = 10 N/kg)`, ans: W, unit: 'N', steps: ['$W = m × g$', `$W = ${nf(m)} × 10$`, `$W = ${nf(W)} "N"$`] }; };
GEN.wt2 = () => { const grams = rnd(50, 950, 50), W = grams / 1000 * G9; return { q: `Calculate the weight of ${grams} g of flour on Earth. (g = 10 N/kg)`, ans: W, unit: 'N', steps: [`${grams} g = ${nf(grams / 1000)} kg`, `$W = ${nf(grams / 1000)} × 10$`, `$W = ${nf(W)} "N"$`] }; };
GEN.wt3 = () => { const m = rnd(2, 120, 1), W = m * G9; return { q: `An object weighs ${W} N on Earth. What is its mass? (g = 10 N/kg)`, ans: m, unit: 'kg', steps: ['$m = @frac{W}{g}$', `$m = @frac{${W}}{10}$`, `$m = ${m} "kg"$`] }; };
const PLANETS = [['the Moon', 1.6], ['Mars', 3.7], ['Mercury', 3.7], ['Venus', 8.9], ['Jupiter', 25], ['Saturn', 10.4], ['Neptune', 11]];
GEN.planet1 = () => { const [p, gp] = pk(PLANETS), m = rnd(5, 150, 5), W = m * gp; return { q: `A ${m} kg robot lands on ${p}, where g = ${gp} N/kg. Calculate its weight there.`, ans: W, unit: 'N', steps: ['$W = m × g$', `$W = ${m} × ${gp}$`, `$W = ${nf(W)} "N"$`] }; };
GEN.planet2 = () => { const [p, gp] = pk(PLANETS), m = rnd(20, 100, 5), WE = m * G9, W = m * gp; return { q: `An astronaut weighs ${WE} N on Earth (g = 10 N/kg). What does she weigh on ${p} (g = ${gp} N/kg)?`, ans: W, unit: 'N', steps: [`mass = ${WE} ÷ 10 = ${m} kg (the same everywhere)`, `$W = ${m} × ${gp}$`, `$W = ${nf(W)} "N"$`] }; };

/* ---------- 4 Density ---------- */
const MATS = [['aluminium', 2.7], ['iron', 7.9], ['copper', 8.9], ['lead', 11.3], ['glass', 2.5], ['oak', 0.7], ['ice', 0.92], ['cork', 0.24], ['gold', 19.3], ['granite', 2.7]];
GEN.den1 = () => { const [n, d] = pk(MATS), V = rnd(5, 200, 5), m = d * V; return { q: `A sample has a mass of ${nf(m)} g and a volume of ${V} cm³. Calculate its density.`, ans: d, unit: 'g/cm³', steps: ['$ρ = @frac{m}{V}$', `$ρ = @frac{${nf(m)}}{${V}}$`, `$ρ = ${d} "g/cm"^3$ (${n})`] }; };
GEN.den2 = () => { const [n, d] = pk(MATS), V = rnd(10, 500, 10), m = d * V; return { q: `${n[0].toUpperCase() + n.slice(1)} has a density of ${d} g/cm³. Calculate the mass of ${V} cm³ of it.`, ans: m, unit: 'g', steps: ['$m = ρ × V$', `$m = ${d} × ${V}$`, `$m = ${nf(m)} "g"$`] }; };
GEN.den3 = () => { const [n, d] = pk(MATS), V = rnd(5, 100, 5), m = d * V; return { q: `A piece of ${n} (density ${d} g/cm³) has a mass of ${nf(m)} g. Calculate its volume.`, ans: V, unit: 'cm³', steps: ['$V = @frac{m}{ρ}$', `$V = @frac{${nf(m)}}{${d}}$`, `$V = ${V} "cm"^3$`] }; };
GEN.den4 = () => { const [n, d] = pk(MATS.slice(0, 6)), l = rnd(2, 8, 1), w = rnd(1, 5, 1), h = rnd(1, 4, 1), V = l * w * h, m = d * V; return { q: `A block measures ${l} cm × ${w} cm × ${h} cm and has a mass of ${nf(m)} g. Calculate its density.`, ans: d, unit: 'g/cm³', steps: [`volume = ${l} × ${w} × ${h} = ${V} cm³`, `$ρ = @frac{${nf(m)}}{${V}}$`, `$ρ = ${d} "g/cm"^3$ (${n})`] }; };
GEN.den5 = () => { const [n, d] = pk(MATS.filter(x => x[1] > 1)), start = rnd(20, 60, 2), V = rnd(4, 30, 1), m = d * V; return { q: `A stone of mass ${nf(m)} g is lowered into a measuring cylinder. The water level rises from ${start} cm³ to ${start + V} cm³. Calculate the density of the stone.`, ans: d, unit: 'g/cm³', steps: [`volume = ${start + V} − ${start} = ${V} cm³`, `$ρ = @frac{${nf(m)}}{${V}}$`, `$ρ = ${d} "g/cm"^3$`] }; };
const LIQ = [['water', 1.0], ['cooking oil', 0.92], ['sea water', 1.03], ['milk', 1.03], ['honey', 1.42], ['alcohol', 0.79], ['washing-up liquid', 1.06]];
GEN.den6 = () => { const [n, d] = pk(LIQ), empty = rnd(80, 160, 1), V = pk([25, 40, 50, 80, 100]), m = d * V; return { q: `An empty measuring cylinder has a mass of ${empty} g. With ${V} cm³ of ${n} in it, the mass is ${nf(empty + m)} g. Calculate the density of the ${n}.`, ans: d, unit: 'g/cm³', steps: [`mass of liquid = ${nf(empty + m)} − ${empty} = ${nf(m)} g`, `$ρ = @frac{${nf(m)}}{${V}}$`, `$ρ = ${d} "g/cm"^3$`] }; };

/* ---------- 5 Upthrust ---------- */
GEN.up1 = () => { const Wa = rnd(2, 20, 0.2), U = +(Wa * pk([0.1, 0.15, 0.2, 0.3, 0.35, 0.4])).toFixed(1), Ww = +(Wa - U).toFixed(1); return { q: `An object weighs ${nf(Wa)} N in air and ${nf(Ww)} N when fully under water. Calculate the upthrust.`, ans: U, unit: 'N', steps: ['upthrust = weight in air − weight in water', `= ${nf(Wa)} − ${nf(Ww)} = ${nf(U)} N`] }; };
GEN.up2 = () => { const V = rnd(20, 900, 10), U = V / 1000 * G9; return { q: `A stone displaces ${V} cm³ of water when fully submerged. 1 cm³ of water has a mass of 1 g. Calculate the upthrust on the stone. (g = 10 N/kg)`, ans: U, unit: 'N', steps: [`mass of water = ${V} g = ${nf(V / 1000)} kg`, `weight of water = ${nf(V / 1000)} × 10 = ${nf(U)} N`, 'upthrust = weight of water displaced'] }; };
GEN.up3 = () => { const W = rnd(5, 5000, 5), m = W / G9; return { q: `A floating boat weighs ${W} N. What mass of water does it displace? (g = 10 N/kg)`, ans: m, unit: 'kg', steps: ['floating: upthrust = weight = weight of water displaced', `mass = ${W} ÷ 10 = ${nf(m)} kg`] }; };
GEN.avgden1 = () => { const V = rnd(100, 1000, 50), d = pk([0.3, 0.5, 0.8, 0.9, 1.2, 1.5, 2]), m = d * V; return { q: `A hollow container has a total mass of ${nf(m)} g and a total volume of ${V} cm³. Calculate its average density. Will it float in water?`, ans: d, unit: 'g/cm³', steps: ['average density = total mass ÷ total volume', `= ${nf(m)} ÷ ${V} = ${d} g/cm³`, d < 1 ? 'Less than 1.0 g/cm³ → it floats.' : 'More than 1.0 g/cm³ → it sinks.'] }; };

/* ---------- 6 Energy ---------- */
GEN.kj1 = () => { const kj = rnd(0.2, 950, 0.1); return Math.random() < .5 ? { q: `Convert ${nf(kj)} kJ into joules.`, ans: kj * 1000, unit: 'J', steps: ['1 kJ = 1000 J', `${nf(kj)} × 1000 = ${nf(kj * 1000)} J`] } : { q: `Convert ${nf(kj * 1000)} J into kilojoules.`, ans: kj, unit: 'kJ', steps: ['1 kJ = 1000 J', `${nf(kj * 1000)} ÷ 1000 = ${nf(kj)} kJ`] }; };
GEN.waste1 = () => { const E = rnd(50, 5000, 50), u = Math.round(E * pk([0.1, 0.2, 0.25, 0.4, 0.6, 0.75, 0.9])); return { q: `A device is supplied with ${E} J of energy and transfers ${u} J usefully. How much energy is wasted?`, ans: E - u, unit: 'J', steps: ['wasted = total in − useful', `${E} − ${u} = ${E - u} J`] }; };
GEN.eff1 = () => { const E = rnd(100, 5000, 100), eff = pk([10, 20, 25, 30, 40, 50, 60, 75, 80, 90]), u = E * eff / 100; return { q: `★ A motor is given ${E} J and transfers ${nf(u)} J usefully. Calculate its efficiency as a percentage.`, ans: eff, unit: '%', steps: ['$"efficiency" = @frac{"useful out"}{"total in"} × 100"%"$', `= ${nf(u)} ÷ ${E} × 100`, `= ${eff}%`] }; };
GEN.gpe1 = () => { const m = rnd(1, 800, 1), h = rnd(1, 60, 1), E = m * G9 * h; return { q: `★ Calculate the gravitational potential energy gained when a ${m} kg object is lifted ${h} m. (g = 10 N/kg)`, ans: E, unit: 'J', steps: ['$"GPE" = m × g × h$', `$= ${m} × 10 × ${h}$`, `$= ${nf(E)} "J"$`] }; };
GEN.coast1 = () => { const m = rnd(200, 800, 50), h = rnd(20, 60, 5), E = m * G9 * h, w = Math.round(E * pk([0.1, 0.15, 0.2, 0.25])); return { q: `A ${m} kg coaster car at the top of a ${h} m hill has ${nf(E)} J of gravitational potential energy. By the bottom, ${nf(w)} J has been wasted by friction and air resistance. How much kinetic energy does it have at the bottom?`, ans: E - w, unit: 'J', steps: ['kinetic energy at the bottom = GPE at the top − energy wasted', `= ${nf(E)} − ${nf(w)} = ${nf(E - w)} J`] }; };

/* ---------- 8.1 Moments ---------- */
GEN.mom1 = () => { const F = rnd(5, 600, 5), d = rnd(0.1, 3, 0.05); return { q: `A force of ${F} N acts ${nf(d)} m from a pivot. Calculate the moment.`, ans: F * d, unit: 'Nm', steps: ['$M = F × d$', `$M = ${F} × ${nf(d)}$`, `$M = ${nf(F * d)} "Nm"$`] }; };
GEN.mom2 = () => { const W1 = rnd(200, 700, 10), d1 = rnd(0.5, 2.5, 0.1), d2 = rnd(0.5, 3, 0.1), W2 = W1 * d1 / d2; return { q: `A seesaw is balanced. A child weighing ${W1} N sits ${nf(d1)} m to the left of the pivot. Another child sits ${nf(d2)} m to the right. What is the second child’s weight?`, ans: W2, unit: 'N', steps: [`anticlockwise moment = ${W1} × ${nf(d1)} = ${nf(W1 * d1)} Nm`, 'balanced: clockwise moment = anticlockwise moment', `weight = ${nf(W1 * d1)} ÷ ${nf(d2)} = ${nf(W2)} N`] }; };
GEN.mom3 = () => { const W1 = rnd(1, 10, 1), d1 = rnd(10, 45, 5), W2 = rnd(1, 10, 1), d2 = W1 * d1 / W2; if (d2 > 50 || d2 < 2) return GEN.mom3(); return { q: `A metre rule balances at its centre. A ${W1} N weight hangs ${d1} cm to the left of the centre. How far to the right must a ${W2} N weight hang to balance it?`, ans: d2, unit: 'cm', steps: [`anticlockwise moment = ${W1} × ${d1} = ${W1 * d1} N cm`, `distance = ${W1 * d1} ÷ ${W2}`, `= ${nf(d2)} cm`] }; };

/* ---------- 8.3 Speed ---------- */
GEN.spd1 = () => { const v = pk([rnd(1, 12, 0.5), rnd(10, 40, 1)]), t = rnd(4, 120, 1), d = v * t; return { q: `A runner covers ${nf(d)} m in ${t} s. Calculate her average speed.`, ans: v, unit: 'm/s', steps: ['$v = @frac{d}{t}$', `$v = @frac{${nf(d)}}{${t}}$`, `$v = ${nf(v)} "m/s"$`] }; };
GEN.spd2 = () => { const v = rnd(2, 30, 1), mins = rnd(1, 20, 1), d = v * mins * 60; return { q: `A car travels at ${v} m/s for ${mins} minute${mins > 1 ? 's' : ''}. How far does it travel?`, ans: d, unit: 'm', steps: [`t = ${mins} × 60 = ${mins * 60} s`, '$d = v × t$', `$d = ${v} × ${mins * 60} = ${nf(d)} "m"$`] }; };
GEN.spd3 = () => { const v = pk([1.5, 2, 4, 5, 6, 8, 10, 12, 15, 20, 25]), t = rnd(10, 400, 10), d = v * t; return { q: `How long does it take to travel ${nf(d)} m at ${v} m/s?`, ans: t, unit: 's', steps: ['$t = @frac{d}{v}$', `$t = @frac{${nf(d)}}{${v}}$`, `$t = ${t} "s"$`] }; };
GEN.spd4 = () => { const km = rnd(1, 30, 0.5), min = rnd(5, 90, 5), v = km * 1000 / (min * 60); return { q: `A cyclist rides ${nf(km)} km in ${min} minutes. Calculate her average speed in m/s.`, ans: v, unit: 'm/s', steps: [`d = ${nf(km)} km = ${nf(km * 1000)} m; t = ${min} × 60 = ${min * 60} s`, `$v = @frac{${nf(km * 1000)}}{${min * 60}}$`, `$v = ${nf(v)} "m/s"$`] }; };

/* ---------- 8.4 Distance–time graphs ---------- */
GEN.dtg1 = () => { const t1 = rnd(0, 40, 5), dt = rnd(10, 60, 5), v = rnd(1, 12, 0.5), d1 = rnd(0, 200, 10), d2 = d1 + v * dt; return { q: `A straight section of a distance–time graph goes from (${t1} s, ${d1} m) to (${t1 + dt} s, ${nf(d2)} m). Calculate the speed.`, ans: v, unit: 'm/s', steps: [`change in distance = ${nf(d2)} − ${d1} = ${nf(d2 - d1)} m`, `change in time = ${t1 + dt} − ${t1} = ${dt} s`, `speed = ${nf(d2 - d1)} ÷ ${dt} = ${nf(v)} m/s`] }; };
GEN.dtg2 = () => { const a = rnd(100, 800, 50), ta = rnd(40, 200, 10), rest = rnd(20, 120, 10), b = rnd(100, 900, 50), tb = rnd(40, 200, 10), v = (a + b) / (ta + rest + tb); return { q: `On a journey someone travels ${a} m in ${ta} s, stops for ${rest} s, then travels ${b} m in ${tb} s. Calculate the average speed for the whole journey.`, ans: v, unit: 'm/s', steps: [`total distance = ${a} + ${b} = ${a + b} m`, `total time = ${ta} + ${rest} + ${tb} = ${ta + rest + tb} s`, `average speed = ${a + b} ÷ ${ta + rest + tb} = ${nf(v)} m/s`] }; };

/* ---------- 8.5–8.7 Pressure ---------- */
GEN.pr1 = () => { const F = rnd(10, 5000, 10), A = pk([0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 4]), p = F / A; return { q: `A force of ${F} N acts on an area of ${A} m². Calculate the pressure.`, ans: p, unit: 'Pa', steps: ['$p = @frac{F}{A}$', `$p = @frac{${F}}{${A}}$`, `$p = ${nf(p)} "Pa"$ (N/m²)`] }; };
GEN.pr2 = () => { const F = rnd(20, 900, 10), A = rnd(2, 400, 2), p = F / A; return { q: `A box weighing ${F} N rests on a face of area ${A} cm². Calculate the pressure in N/cm².`, ans: p, unit: 'N/cm²', steps: ['$p = @frac{F}{A}$', `$p = @frac{${F}}{${A}}$`, `$p = ${nf(p)} "N/cm"^2$`] }; };
GEN.pr3 = () => { const p = rnd(100, 20000, 100), A = pk([0.01, 0.05, 0.1, 0.2, 0.5, 1.5, 2]), F = p * A; return { q: `The pressure under a block is ${p} Pa and its base area is ${A} m². Calculate the force it exerts.`, ans: F, unit: 'N', steps: ['$F = p × A$', `$F = ${p} × ${A}$`, `$F = ${nf(F)} "N"$`] }; };
GEN.pr4 = () => { const m = rnd(30, 80, 1), sq = rnd(120, 260, 1), feet = pk([1, 2]), W = m * G9, p = W / (sq * feet); return { q: `A student of mass ${m} kg draws round one shoe on 1 cm squared paper and counts ${sq} squares. Calculate the pressure on the floor when standing on ${feet === 2 ? 'both feet' : 'one foot'}. (g = 10 N/kg)`, ans: p, unit: 'N/cm²', steps: [`weight = ${m} × 10 = ${W} N`, `area = ${feet === 2 ? `2 × ${sq} = ${2 * sq}` : sq} cm²`, `p = ${W} ÷ ${sq * feet} = ${nf(p)} N/cm²`] }; };
GEN.pr5 = () => { const F1 = rnd(10, 200, 5), A1 = pk([1, 2, 4, 5, 10]), A2 = pk([50, 80, 100, 200, 250, 400]), p = F1 / A1, F2 = p * A2; return { q: `In a hydraulic jack, a force of ${F1} N pushes on a small piston of area ${A1} cm². The large piston has an area of ${A2} cm². Calculate the force on the large piston.`, ans: F2, unit: 'N', steps: [`pressure = ${F1} ÷ ${A1} = ${nf(p)} N/cm²`, 'the same pressure acts on the large piston', `F = ${nf(p)} × ${A2} = ${nf(F2)} N`] }; };
GEN.pr6 = () => { const [n, d] = pk([['water', 1000], ['sea water', 1030], ['oil', 900]]), h = rnd(0.5, 20, 0.5), p = h * d * G9; return { q: `★ Calculate the pressure due to ${n} (density ${d} kg/m³) at a depth of ${nf(h)} m. (g = 10 N/kg)`, ans: p, unit: 'Pa', steps: ['$p = h × ρ × g$', `$p = ${nf(h)} × ${d} × 10$`, `$p = ${nf(p)} "Pa"$`] }; };
GEN.pr7 = () => { const A = rnd(10, 500, 10), F = 10 * A; return { q: `Atmospheric pressure is about 10 N/cm². Calculate the force of the air on a surface of area ${A} cm².`, ans: F, unit: 'N', steps: ['$F = p × A$', `$F = 10 × ${A}$`, `$F = ${F} "N"$`] }; };

const SIMS = {};

/* ---- canvas helpers ---- */

    c.fillStyle = col; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - hs * Math.cos(a - .42), y2 - hs * Math.sin(a - .42)); c.lineTo(x2 - hs * Math.cos(a + .42), y2 - hs * Math.sin(a + .42)); c.closePath(); c.fill();
  },
  text(c, s, x, y, col, size = 12, align = 'left', weight = 500, font = 'IBM Plex Sans, system-ui, sans-serif') { c.fillStyle = col; c.font = `${weight} ${size}px ${font}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); },

  circle(c, x, y, r, fill, stroke, w = 1.5) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = w; c.stroke(); } },
  rrect(c, x, y, w, h, r, fill, stroke, lw = 1.5) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } },
  grid(c, w, h, C, step = 24) { c.strokeStyle = C.grid; c.lineWidth = 1; c.beginPath(); for (let x = 0; x <= w; x += step) { c.moveTo(x + .5, 0); c.lineTo(x + .5, h); } for (let y = 0; y <= h; y += step) { c.moveTo(0, y + .5); c.lineTo(w, y + .5); } c.stroke(); },
  /* mini plot: box {x,y,w,h}, ranges, series [{pts|f, col, w, dash}] */
  plot(c, C, b, o) {
    const { x, y, w, h } = b, [x0, x1] = o.xr, [y0, y1] = o.yr;
    const X = v => x + (v - x0) / (x1 - x0) * w, Y = v => y + h - (v - y0) / (y1 - y0) * h;
    CV.rrect(c, x - 8, y - 8, w + 16, h + 26, 8, C.surface, C.line, 1);
    c.save(); c.beginPath(); c.rect(x, y - 2, w, h + 4); c.clip();
    (o.fills || []).forEach(f => { c.fillStyle = f.col; c.beginPath(); c.moveTo(X(f.pts[0][0]), Y(0)); f.pts.forEach(p => c.lineTo(X(p[0]), Y(p[1]))); c.lineTo(X(f.pts[f.pts.length - 1][0]), Y(0)); c.fill(); });
    (o.series || []).forEach(s => {
      c.strokeStyle = s.col; c.lineWidth = s.w || 2; c.setLineDash(s.dash || []); c.beginPath(); let pen = false;
      if (s.f) { for (let i = 0; i <= 200; i++) { const xv = x0 + (x1 - x0) * i / 200, yv = s.f(xv); if (!isFinite(yv)) { pen = false; continue; } pen ? c.lineTo(X(xv), Y(yv)) : c.moveTo(X(xv), Y(yv)); pen = true; } }
      else s.pts.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])));

    });

    if (o.xl) CV.text(c, o.xl, x + w, y + h + 10, C.muted, 10.5, 'right');

function hexA(col, a) { // accepts #rrggbb or rgb(...) → rgba

  if (col.startsWith('#')) { const n = parseInt(col.slice(1).length === 3 ? col.slice(1).split('').map(x => x + x).join('') : col.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

/* ---- mount ---- */
function mountSim(host, key) {
  const def = SIMS[key]; if (!def) { host.innerHTML = '<div class="empty">Simulation unavailable.</div>'; return () => { }; }
  refreshSimTheme();
  const st = { t: 0, run: def.autoplay !== false, p: {}, key };
  (def.controls || []).forEach(c => { if (c.id) st.p[c.id] = c.value; });
  const ctl = (def.controls || []).map(c => {
    if (c.type === 'seg') return `<div class="ctl"><label>${c.label}</label><div class="seg" data-id="${c.id}">${c.options.map(o => `<button type="button" data-v="${esc(o[0])}" class="${o[0] == c.value ? 'on' : ''}">${o[1]}</button>`).join('')}</div></div>`;
    if (c.type === 'button') return `<button type="button" class="btn sm" data-act="${c.act}">${c.label}</button>`;
    return `<div class="ctl"><label for="sc-${key}-${c.id}">${sqrtify(c.label)}<output>${c.fmt ? c.fmt(c.value) : c.value}</output></label><input id="sc-${key}-${c.id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" data-id="${c.id}"></div>`;
  }).join('');
  const btnRow = (def.controls || []).filter(c => c.type === 'button').length;
  host.innerHTML = `<div class="sim"><div class="sim-stage" style="height:${(def.hNarrow && innerWidth < 600 ? def.hNarrow : def.h) || 440}px"><canvas aria-label="${esc(def.title)} simulation"></canvas></div>
    <div class="sim-ctl"><div class="row" style="justify-content:space-between"><div class="sim-title">${def.title}</div>
    <div class="row" style="gap:6px">${def.noPlay ? '' : `<button type="button" class="icon-btn" data-act="__play" title="Play / pause" aria-label="Play or pause">${st.run ? ICON.pause : ICON.play}</button>`}<button type="button" class="icon-btn" data-act="__reset" title="Reset" aria-label="Reset">${ICON.reset}</button></div></div>
    ${ctl.replace(/<button type="button" class="btn sm"[\s\S]*?<\/button>/g, '')}
    ${btnRow ? `<div class="row" style="gap:8px">${(def.controls || []).filter(c => c.type === 'button').map(c => `<button type="button" class="btn sm" data-act="${c.act}">${c.label}</button>`).join('')}</div>` : ''}
    <div class="readouts">${(def.readouts || []).map((r, i) => `<div class="ro"><span>${sqrtify(r)}</span><b data-ro="${i}">—</b></div>`).join('')}</div>
    ${def.note ? `<div class="sim-note">${rich(def.note)}</div>` : ''}</div></div>`;
  const cv = $('canvas', host), stage = $('.sim-stage', host), c = cv.getContext('2d');
  let W = 0, H = 0;
  const size = () => { const r = stage.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); st.W = W; st.H = H; def.resize && def.resize(st); };
  const ro = new ResizeObserver(size); ro.observe(stage); size();
  const setFill = inp => inp.style.setProperty('--p', ((inp.value - inp.min) / (inp.max - inp.min) * 100) + '%');
  $$('input[type=range]', host).forEach(inp => { setFill(inp); inp.addEventListener('input', () => { const id = inp.dataset.id, cdef = def.controls.find(x => x.id === id); st.p[id] = +inp.value; inp.previousElementSibling.querySelector('output').innerHTML = cdef.fmt ? cdef.fmt(+inp.value) : inp.value; setFill(inp); def.change && def.change(st, id); }); });
  $$('.seg', host).forEach(sg => sg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$('button', sg).forEach(x => x.classList.toggle('on', x === b)); const v = b.dataset.v; st.p[sg.dataset.id] = isNaN(+v) ? v : +v; def.change && def.change(st, sg.dataset.id); }));
  host.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === '__play') { st.run = !st.run; b.innerHTML = st.run ? ICON.pause : ICON.play; }
    else if (a === '__reset') { st.t = 0; def.init && def.init(st); }
    else def.action && def.action(st, a);
    sfx.tick();
  });
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  if (def.pointer) {
    let down = false;
    cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); def.pointer('down', ...pos(e), st); });
    cv.addEventListener('pointermove', e => def.pointer(down ? 'drag' : 'move', ...pos(e), st));
    cv.addEventListener('pointerup', e => { down = false; def.pointer('up', ...pos(e), st); });
    cv.addEventListener('pointerleave', e => def.pointer('leave', ...pos(e), st));
  }
  def.init && def.init(st);
  const ros = $$('[data-ro]', host);
  let raf, last = performance.now(), frame = 0, alive = true;
  const loop = now => {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (st.run && def.step) { const sub = def.substeps || 1; for (let i = 0; i < sub; i++) def.step(st, dt / sub); st.t += dt; }
    c.clearRect(0, 0, W, H); c.fillStyle = simTheme.bg; c.fillRect(0, 0, W, H);
    def.draw(c, W, H, st, simTheme);
    if (def.read && frame++ % 6 === 0) def.read(st).forEach((v, i) => ros[i] && (ros[i].innerHTML = v));
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}

/* ---- shared constants & canvas circuit symbols (GCSE sims) ---- */
const deg = Math.PI / 180, g = 10;
const CS = {
  /* Components are drawn centred on a wire. Draw the wires (and moving charges) inside CS.gaps(): it clips out each
     component's span so the wire ends exactly at the component's terminals — no gaps, no wire through the symbol. */
  HALF: { cell: 5, resistor: 18, lamp: 12, meter: 14, diode: 9, switch: 14 },
  gaps(c, W, H, comps, fn) { c.save(); c.beginPath(); c.rect(-10, -10, W + 20, H + 20); comps.forEach(([x, y, half, vert]) => vert ? c.rect(x - 6, y - half, 12, 2 * half) : c.rect(x - half, y - 6, 2 * half, 12)); c.clip('evenodd'); fn(); c.restore(); },
  wire(c, pts, col, w = 2) { c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); },
  junction(c, x, y, col) { CV.circle(c, x, y, 3.4, col); },
  cell(c, x, y, col, vert, flip) { c.save(); c.translate(x, y); if (vert) c.rotate(Math.PI / 2); if (flip) c.rotate(Math.PI); c.strokeStyle = col; c.lineCap = 'butt'; c.lineWidth = 2; c.beginPath(); c.moveTo(-5, -14); c.lineTo(-5, 14); c.stroke(); c.lineWidth = 5; c.beginPath(); c.moveTo(5, -8); c.lineTo(5, 8); c.stroke(); c.restore(); },
  resistor(c, x, y, col, bg, vert, variable) { c.save(); c.translate(x, y); if (vert) c.rotate(Math.PI / 2); CV.rrect(c, -18, -8, 36, 16, 2, bg, col, 2); if (variable) CV.arrow(c, -16, 16, 18, -16, col, 1.5, 6); c.restore(); },
  lamp(c, x, y, col, bg, glow = 0) { if (glow > 0.02) { const gr = c.createRadialGradient(x, y, 2, x, y, 12 + 30 * glow); gr.addColorStop(0, `rgba(255,220,120,${0.9 * glow})`); gr.addColorStop(1, 'rgba(255,200,80,0)'); c.fillStyle = gr; c.beginPath(); c.arc(x, y, 12 + 30 * glow, 0, 7); c.fill(); } CV.circle(c, x, y, 12, glow > 0.02 ? `rgba(255,226,140,${0.3 + 0.7 * glow})` : bg, col, 2); CV.line(c, x - 8.5, y - 8.5, x + 8.5, y + 8.5, col, 1.6); CV.line(c, x + 8.5, y - 8.5, x - 8.5, y + 8.5, col, 1.6); },
  meter(c, x, y, letter, col, bg) { CV.circle(c, x, y, 14, bg, col, 2); CV.text(c, letter, x, y + 1, col, 14, 'center', 700); },
  diode(c, x, y, col, bg, vert, flip) { c.save(); c.translate(x, y); if (vert) c.rotate(Math.PI / 2); if (flip) c.rotate(Math.PI); c.fillStyle = bg; c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(-9, -10); c.lineTo(-9, 10); c.lineTo(9, 0); c.closePath(); c.fill(); c.stroke(); CV.line(c, 9, -10, 9, 10, col, 2.4); c.restore(); },
  /* a reading on an opaque label, so wires never hide it; align 'left' | 'right' | 'center' */
  tag(c, C, text, x, y, align = 'center', col) { c.font = '500 11.5px IBM Plex Mono, ui-monospace, monospace'; const w = c.measureText(text).width + 12, x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2; CV.rrect(c, x0, y - 10, w, 20, 5, C.surface, hexA(col || C.accent, .7), 1); CV.mono(c, text, x0 + w / 2, y, col ? col : C.ink, 11.5, 'center'); },
  /* voltmeter in parallel with a component centred at (x, y) on a horizontal wire (half = its half-length).

/* A KS3 version of a shared sim: new labels/notes; fix = hidden parameter values; map = rewrite the readouts */
function KS3SIM(base, over) {
  const b = SIMS[base], d = Object.assign(Object.create(b), over);
  if (over.fix) d.init = function (st) { Object.assign(st.p, over.fix); b.init && b.init.call(this, st); };
  if (over.map) d.read = function (st) { return over.map(b.read.call(this, st), st); };
  return d;
}

  init(st) { st.ph = 'ready'; st.P = 0; st.tt = 0; st.y = 0; st.vy = 0; st.maxH = 0; st.res = st.res || []; },

    for (let i = 0; i <= 50; i++) { const y = top + 10 + i / 50 * len, big = i % 10 === 0; CV.line(c, x + (big ? 10 : 18), y, x + 30, y, C.ink, big ? 1.6 : 0.8); if (big) CV.mono(c, String(+(k.R * i / 50).toFixed(2)), x + 36, y, C.ink, 11); }

    c.save(); c.beginPath(); c.arc(zx, zy, 88, 0, 7); c.clip(); const scl = 6, base = zy - (f * len) * scl; for (let i = 0; i <= 50; i++) { const yy = base + (i / 50 * len) * scl, big = i % 5 === 0; if (yy < zy - 100 || yy > zy + 100) continue; CV.line(c, zx - 10 + (big ? 0 : 20), yy, zx + 60, yy, C.ink, big ? 2 : 1); if (big) CV.mono(c, String(+(k.R * i / 50).toFixed(2)) + ' N', zx - 18, yy, C.ink, 13, 'right'); } CV.line(c, zx - 70, zy, zx + 70, zy, C.u1, 3); c.restore();

  stats(st) { const r = st.res; if (!r.length) return null; const med = [...r].sort((a, b) => a - b)[Math.floor(r.length / 2)], ok = r.filter(x => Math.abs(x - med) < 1.2), bad = r.filter(x => Math.abs(x - med) >= 1.2); return { mean: ok.reduce((a, b) => a + b, 0) / ok.length, lo: Math.min(...ok), hi: Math.max(...ok), bad }; },

    // results chart
    const b = { x: 60, y: H * 0.58, w: W - 120, h: H * 0.3 }, s = this.stats(st); CV.plot(c, C, b, { xr: [0.5, 10.5], yr: [0, 10], dots: st.res.map((r, i) => [i + 1, r, s && s.bad.includes(r) ? C.bad : C.u5, 5]), series: s ? [{ pts: [[0.5, s.mean], [10.5, s.mean]], col: C.good, w: 1.5, dash: [5, 4] }] : [], xl: 'popper number', yl: 'force to pop (N)' });

  readouts: ['Weight of block + masses', 'Force to START it moving', 'Force to KEEP it moving (steady)', 'Friction at steady speed'],

    CV.plot(c, C, { x: 60, y: H * 0.56, w: W - 120, h: H * 0.3 }, { xr: [0, 10], yr: [0, Math.max(4, this.k(st.p).st * 1.3)], series: [{ pts: st.trace.map(([t, f]) => [t, f]), col: C.u1 }], xl: 'time', yl: 'newton meter reading (N)' });

function mountGame(host, id) {
  let alive = true, timer = null; const stop = () => { alive = false; clearInterval(timer); };

  const endScreen = (score, extra = '') => { const nb = gameBest(id, score); if (score > 0) addXP(Math.min(60, Math.round(score / 2)), GAMES[id].title); if (nb && score > 0) { burst(); sfx.win(); }
    host.innerHTML = `<div class="game"><div class="card result"><div class="eyebrow">${GAMES[id].title}</div><div class="big">${score}</div><p class="lede" style="margin:8px auto">${nb ? 'New personal best!' : 'Personal best: ' + S.games[id].best}</p>${extra}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-again>Play again</button><a class="btn" href="#/arcade">Back to arcade</a></div></div></div>`;
    $('[data-again]', host).onclick = () => { stop(); cleanup = mountGame(host, id); }; };
  let cleanup = stop;

  if (id === 'sprint' || id === 'rush' || id === 'symbols') {
    const bank = id === 'sprint' ? UNIT_BANK : id === 'symbols' ? KS3_SYMBOL_BANK : EQ_BANK.filter(e => inScope(e[2])), total = id === 'rush' ? 75 : 60;
    let score = 0, streak = 0, left = total, cur = null, answered = 0, right = 0;
    const next = () => { const item = pick(bank); const others = shuffle(bank.filter(b => b[1] !== item[1] && b[0] !== item[0])).slice(0, 3); cur = { item, opts: shuffle([item, ...others]) }; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Streak', streak], ['Time', Math.ceil(left) + 's']])}<div class="timer"><i style="width:${left / total * 100}%"></i></div>
        <div class="eyebrow" style="text-align:center">${id === 'sprint' ? 'What is the unit of' : id === 'symbols' ? 'Name this circuit symbol' : 'Which equation gives'}</div><div class="big-prompt${id === 'symbols' ? ' game-sym' : ''}">${cur.item[0]}</div>
        <div class="opts">${cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${id === 'rush' ? M(o[1]) : o[1]}</span></button>`).join('')}</div><p class="kbd-hint">Keys 1–4 to answer.</p></div>`;
      $$('.opt', host).forEach(b => b.onclick = () => choose(+b.dataset.i));
    };
    const choose = i => { if (!alive) return; answered++; const ok = cur.opts[i] === cur.item; const btn = $$('.opt', host)[i]; if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); btn.classList.add('right'); } else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); btn.classList.add('wrong'); $$('.opt', host)[cur.opts.indexOf(cur.item)].classList.add('right'); } setTimeout(() => alive && left > 0 && next(), ok ? 250 : 900); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } const n = +e.key; if (n >= 1 && n <= 4 && !$('.opt.right', host)) choose(n - 1); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct</p>`); } }, 100);
    next();
    return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'floaty') {
    let score = 0, streak = 0, left = 45, cur = null, answered = 0, right = 0, busy = false; const total = 45;
    const next = () => { cur = pick(FLOATERS); busy = false; render(); };
    const render = () => {
      host.innerHTML = `<div class="game">${hud([['Score', score], ['Streak', streak], ['Time', Math.ceil(left) + 's']])}<div class="timer"><i style="width:${left / total * 100}%"></i></div>
        <div class="eyebrow" style="text-align:center">Drop it in water (1.0 g/cm³). Will it float or sink?</div><div class="big-prompt">${esc(cur[0])}<div class="small muted" style="font:500 15px var(--f-mono);margin-top:6px">density ${cur[1]} g/cm³</div></div>
        <div class="row" style="justify-content:center;gap:14px"><button class="btn primary" data-a="f" style="min-width:140px">Float <kbd>F</kbd></button><button class="btn" data-a="s" style="min-width:140px">Sink <kbd>S</kbd></button></div><div id="fl-fb" style="min-height:60px"></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => choose(b.dataset.a)); };
    const choose = a => { if (!alive || busy) return; busy = true; answered++; const fl = cur[1] < 1, ok = (a === 'f') === fl;
      if (ok) { right++; streak++; score += 10 + Math.min(streak, 10) * 2; sfx.good(); } else { streak = 0; left = Math.max(0, left - 3); sfx.bad(); }
      $('#fl-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Not quite'}</b> ${esc(cur[0])} ${fl ? 'floats' : 'sinks'}: ${cur[1]} g/cm³ is ${fl ? 'less' : 'more'} than water’s 1.0 g/cm³.</div>`;
      setTimeout(() => alive && left > 0 && next(), ok ? 700 : 1600); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 'f' || e.key === 'F') choose('f'); if (e.key === 's' || e.key === 'S') choose('s'); };
    addEventListener('keydown', key);
    timer = setInterval(() => { left -= 0.1; const bar = $('.timer i', host); if (bar) bar.style.width = (left / total * 100) + '%'; const tb = $$('.hud b', host)[2]; if (tb) tb.textContent = Math.ceil(Math.max(0, left)) + 's'; if (left <= 0) { clearInterval(timer); removeEventListener('keydown', key); endScreen(score, `<p class="muted">${right} of ${answered} correct. Anything less dense than water floats in it.</p>`); } }, 100);
    next(); return () => { stop(); removeEventListener('keydown', key); };
  }

  if (id === 'blitz') {
    const pool = allTopics().flatMap(t => V_(t).quiz.map(q => ({ q, t }))); let score = 0, lives = 3, cur;
    const next = () => { const { q, t } = pick(pool); const truth = Math.random() < 0.5; const opt = truth ? q.o[0] : pick(q.o.slice(1)); cur = { q, t, truth, opt }; render(); };
    const render = () => { host.innerHTML = `<div class="game">${hud([['Score', score], ['Lives', '♥'.repeat(lives) || '0']])}<div class="card"><div class="eyebrow">${cur.t.id} · ${esc(cur.t.title)}</div><p class="q-text">${rich(cur.q.q)}</p><div class="box def" style="font-size:17px"><b class="lbl">Proposed answer</b><p>${rich(cur.opt)}</p></div>
      <div class="row" style="justify-content:center;gap:14px;margin-top:10px"><button class="btn primary" data-a="1" style="min-width:130px">True <kbd>T</kbd></button><button class="btn" data-a="0" style="min-width:130px">False <kbd>F</kbd></button></div><div id="bz-fb"></div></div></div>`;
      $$('[data-a]', host).forEach(b => b.onclick = () => answer(b.dataset.a === '1')); };
    const answer = a => { if ($('#bz-fb', host).innerHTML) return; const ok = a === cur.truth; ok ? (score += 10, sfx.good()) : (lives--, sfx.bad());
      $('#bz-fb', host).innerHTML = `<div class="explain"><b class="v ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</b> ${cur.truth ? 'That answer is right.' : 'The correct answer is: ' + rich(cur.q.o[0])} ${cur.q.x ? '<br><span class="muted">' + rich(cur.q.x) + '</span>' : ''}</div>`;
      setTimeout(() => { if (!alive) return; lives > 0 ? next() : endScreen(score); }, ok ? 900 : 2600); };
    const key = e => { if (!alive || !document.body.contains(host)) { removeEventListener('keydown', key); return; } if (e.key === 't' || e.key === 'T') answer(true); if (e.key === 'f' || e.key === 'F') answer(false); };
    addEventListener('keydown', key); next(); return () => { stop(); removeEventListener('keydown', key); };
  }
  return stop;
}

const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
/* scope helpers: topics are shown for the chosen year (see inScope in core.js). Items marked ch are
   ★ Challenge — deeper, stretch content. They are always shown, and tagged so learners can choose them. */
const specFlag = sp => /^★/.test(sp) ? 'ch' : '';
const specTxt = sp => sp.replace(/^★\s*/, '');
const tagHTML = (f, small) => (f && f.includes('ch') ? `<span class="tag ch${small ? ' sm' : ''}" title="Challenge: goes deeper than the core lesson">★ Challenge</span>` : '');
const flagOf = o => (o.ch ? 'ch' : '');
const vis = t => inScope(t);
const V_ = t => ({ quiz: t.quiz, cards: t.cards, exam: t.exam, worked: t.worked, gens: t.gens, spec: t.spec.map((sp, i) => [sp, i]) });
const yearOfT = t => unitOf(t.unit)?.year;
const allTopics = () => TOPICS.filter(vis);
const coreTopics = () => TOPICS.filter(t => t.unit !== 'S' && vis(t));
const unitTopics = uid => TOPICS.filter(t => t.unit === uid && vis(t));
const fmtAns = x => Number.isInteger(x) ? String(x) : sf(x, 3);
const ucol = uid => unitOf(uid)?.css || 'var(--accent)';
S.stats ??= { quizzes: 0, perfect: 0, calcOK: 0, cardsSeen: 0, sims: [], mocks: 0, examMarks: 0 };
S.daily ??= {};

function mastery(t) {
  const s = T(t.id), q = (s.quiz || 0) / 100, v = V_(t);
  const ck = t.cards.length ? Object.entries(s.cards).filter(([i, b]) => b >= 3 && t.cards[i]).length / Math.max(1, v.cards.length) : 0;
  const sp = v.spec.reduce((a, [, i]) => a + (s.spec[i] ? (s.spec[i] - 1) / 2 : 0), 0) / Math.max(1, v.spec.length);
  const calc = v.gens.length ? Math.min(s.calc || 0, 5) / 5 : q;
  return clamp(0.4 * q + 0.2 * ck + 0.2 * sp + 0.2 * calc, 0, 1);
}
const pct = x => Math.round(x * 100) + '%';
const unitMastery = uid => { const ts = unitTopics(uid); return ts.length ? ts.reduce((a, t) => a + mastery(t), 0) / ts.length : 0; };

  /* Build a 60-mark, one-hour end-of-year test from the structured questions of one year: at most one question

  function paper(yr) {
    const target = 60, mins = 60, year = TOPICS.filter(t => unitOf(t.unit).year === yr && !(unitOf(t.unit).extra && !S.settings.mag)).map(t => t.id), skills = TOPICS.filter(t => t.unit === 'S').map(t => t.id);

    const pickTo = () => { const out = [], seen = new Set(), perU = {}; let m = 0, sk = 0; const pool = shuffle(pool0);
      for (const pass of [0, 1]) for (const q of pool) { const qm = qMarks(q), u = TOPIC[q.topic].unit, isS = u === 'S'; if (out.includes(q) || m + qm > target || (!pass && seen.has(q.topic)) || (isS && sk >= 8) || (perU[u] || 0) >= 4) continue; out.push(q); seen.add(q.topic); perU[u] = (perU[u] || 0) + 1; if (isS) sk += qm; m += qm; if (m === target) return out; } return out; };
    let qs = [], total = 0; for (let k = 0; k < 400 && total !== target; k++) { const o = pickTo(), tt = o.reduce((a, q) => a + qMarks(q), 0); if (Math.abs(tt - target) < Math.abs(total - target) || !qs.length) { qs = o; total = tt; } }
    const ord = id => { const t = TOPIC[id]; return (t.unit === 'S' ? 99 : +t.unit) * 100 + TOPICS.indexOf(t); }; qs.sort((a, b) => ord(a.topic) - ord(b.topic));
    const name = `Year ${yr} end-of-year test`;
    crumbs(`<a href="#/mock" style="color:inherit">Tests</a> / <b>${name}</b>`);
    V().innerHTML = `<div style="max-width:880px"><div class="eyebrow">Key Stage 3 physics · practice test</div><h1 class="display" style="font-size:clamp(30px,4.4vw,48px);margin:6px 0">${name}</h1>
      <div class="row"><span class="pill">1 hour</span><span class="pill">${total} marks</span><span class="pill">${qs.length} questions</span><span class="pill warn mono" id="ptimer">${mins}:00</span><button class="btn sm" id="pstart">Start timer</button></div>
      <p class="small muted">Answer all the questions. Show your working in calculations and give the unit. Use g = 10 N/kg on Earth. You may use a calculator and a ruler.</p>
      <div id="plist">${qs.map((q, i) => xqHTML(q, i, { showTopic: true, noFoot: true, num: 'Q' + (i + 1) })).join('')}</div>
      <div class="row" style="margin:24px 0"><button class="btn primary" id="pmark">Finish and show the mark scheme</button></div><div id="pres"></div></div>`;

    addEventListener('hashchange', route);
    addEventListener('keydown', e => { if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !e.target.matches('input,textarea,select'))) { e.preventDefault(); openPalette(); } if (e.key === 'Escape') { $('.palette-back')?.remove(); toggleSide(false); } });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { refreshSimTheme(); refreshChrome(); });
    route();
  }
  return { init, route, refreshChrome };
})();
window.App = App;

</script>
<script>App.init();</script>
</body>
